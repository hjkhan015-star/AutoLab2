{

<script type="module">
import * as THREE from 'three';
import * as Base from './kit.js';
import { Widgets } from './components.js';

/* ═══════════════════════════════════════════════════════════════════════
   CRANKSHAFT & PISTONS  ·  v3.1
   Slider-crank mechanism with a full 4-stroke cycle, valves, spark, gas
   pressure, inertia forces and torque — all driven by the same maths.

   Conventions
     · crank axis = X, pistons move along Y, the crank swings in the Y-Z plane
     · θ  = crank angle, 0 = piston at TDC (pin straight up)
     · φ  = a cylinder's own 720° cycle angle, 0 = TDC on the power stroke
     · rod ratio = rod length ÷ stroke (typically 1.5 – 2.0)
   ═══════════════════════════════════════════════════════════════════════ */
const DEG = Base.DEG, TAU = Base.TAU;
const clamp  = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp   = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mod    = (a, n) => ((a % n) + n) % n;

/* ═══════════════════════════════════════════════════════════════════════
   CONFIG
   ═══════════════════════════════════════════════════════════════════════ */
const CFG = {
  moduleId: 'crankpiston',
  accent:   '#ca8a04',
  cycleHz:  1.0,          // visual crank revolutions per second at speed ×1
  r:        0.90,         // crank throw radius (stroke = 2r)          [scene units]
  bore:     0.46,         // cylinder bore radius
  deckY:    4.50,         // underside of the cylinder head (fixed)
  pinTDC:   4.00,         // wrist-pin height at TDC (fixed → block stays put)
  crownH:   0.40,         // crown height above the wrist pin
  ratioMin: 1.4, ratioMax: 2.1, ratioDefault: 1.7
};

/* Real-world numbers behind the readouts (a small 1.6 L petrol engine) */
const REAL = { r: 0.045, boreR: 0.043, mRecip: 0.55, CR: 10, n: 1.35, pIntake: 0.9 };
REAL.A = Math.PI * REAL.boreR * REAL.boreR;

/* Throws: 1 & 4 up together, 2 & 3 opposite.  Firing order 1-3-4-2.
   fire = crank-cycle angle (0-720°) at which the cylinder is at TDC on the power stroke. */
const CYLINDERS = [
  { id: 1, x: -1.65, phase: 0.0, fire:   0, colour: 0xffb020 },
  { id: 2, x: -0.55, phase: 0.5, fire: 540, colour: 0x38bdf8 },
  { id: 3, x:  0.55, phase: 0.5, fire: 180, colour: 0x38bdf8 },
  { id: 4, x:  1.65, phase: 0.0, fire: 360, colour: 0xffb020 }
];
const MAIN_X = [-2.20, -1.10, 0.00, 1.10, 2.20];

const STAGES = [
  { n: 'Power',       cls: 'warn', col: 0xff8a1f },
  { n: 'Exhaust',     cls: '',     col: 0x94a3b8 },
  { n: 'Intake',      cls: 'ok',   col: 0x38bdf8 },
  { n: 'Compression', cls: 'hi',   col: 0x818cf8 }
];

const state = Base.createUIState();

/* ═══════════════════════════════════════════════════════════════════════
   PHYSICS  (pure functions — used by the readouts AND the graph)
   ═══════════════════════════════════════════════════════════════════════ */
const engineRpm = () => Math.round((800 + (state.speedMul - 0.15) / 2.35 * 5200) / 10) * 10;

function cylPressure(phi, V) {
  const CR = REAL.CR;
  const pComp = v => REAL.pIntake * Math.pow(CR / v, REAL.n);
  const pBurn = v => REAL.pIntake * Math.pow(CR, REAL.n) * 3.0 * Math.pow(1 / v, 1.3);
  if (phi < 180) return lerp(pComp(V), pBurn(V), smooth(0, 20, phi));              // power (burn ramps in)
  if (phi < 360) return 1.1 + (pBurn(CR) - 1.1) * Math.exp(-(phi - 180) / 14);     // exhaust blow-down
  if (phi < 540) return 0.85;                                                       // intake (slight vacuum)
  return pComp(V);                                                                  // compression
}

/* One cylinder at cycle angle φ (degrees). Returns SI units. */
function evalCyl(phiDeg, rpm, ratio) {
  const th = mod(phiDeg, 360) * DEG;
  const w = rpm * TAU / 60, lam = 1 / (2 * ratio);
  const s = Math.sin(th), c = Math.cos(th);
  const root = Math.sqrt(1 - (lam * s) * (lam * s));
  const x = REAL.r * ((1 - c) + (1 - root) / lam);                    // m below TDC
  const v = REAL.r * w * (s + lam * s * c / root);                    // m/s (down +)
  const a = REAL.r * w * w * (c + lam * Math.cos(2 * th));            // m/s²
  const V = 1 + (REAL.CR - 1) * x / (2 * REAL.r);
  const p = cylPressure(phiDeg, V);                                   // bar
  const F = (p - 1) * 1e5 * REAL.A - REAL.mRecip * a;                 // N along the bore
  const tanB = lam * s / root;                                        // tan(rod angle)
  return { x, v, a, p, F, V, side: F * tanB, T: F * REAL.r * (s + c * tanB) };
}
function totalTorque(cycDeg, rpm, ratio) {
  let T = 0;
  for (const c of CYLINDERS) T += evalCyl(mod(cycDeg - c.fire, 720), rpm, ratio).T;
  return T;
}
function meanTorque(rpm, ratio) {
  let sum = 0, n = 0;
  for (let d = 0; d < 720; d += 2) { sum += totalTorque(d, rpm, ratio); n++; }
  return sum / n;
}

/* ═══════════════════════════════════════════════════════════════════════
   SCENE
   ═══════════════════════════════════════════════════════════════════════ */
const built = Base.buildScene({
  fov: 42,
  camPos: [8.6, 4.9, 9.6],
  target: [0, 2.0, 0],
  floorY: -2.9,
  fogDensity: 0.026
});
const { scene, camera, renderer, controls, wrap, viewManager, quality } = built;
Base.attachResize(camera, renderer, wrap, built.baseFov);
const lowEnd = quality.isLowEnd;

const low  = new THREE.Group();   // everything referenced to the crank axis (moves with rod length)
const deck = new THREE.Group();   // block top, head, plugs, valves, gas (fixed in space)
scene.add(low, deck);

/* ═══════════════════════════════════════════════════════════════════════
   MATERIALS
   ═══════════════════════════════════════════════════════════════════════ */
const mk = (color, metalness, roughness, extra = {}) =>
  new THREE.MeshStandardMaterial({ color, metalness, roughness, ...extra });
const MAT = {
  crank:    mk(0xb8c0cc, 0.88, 0.26),
  crankDk:  mk(0x7c8596, 0.80, 0.36),
  cw:       mk(0x4a5160, 0.65, 0.45),
  journal:  mk(0xdde3ec, 0.94, 0.14),
  rod:      mk(0xc5ccd6, 0.78, 0.30),
  rodCap:   mk(0x9aa3b2, 0.80, 0.34),
  piston:   mk(0xd4dbe6, 0.72, 0.30, { side: THREE.DoubleSide }),
  ring:     mk(0x6b7280, 0.90, 0.22),
  oilRing:  mk(0xa4713a, 0.85, 0.30),
  pin:      mk(0x8f98a8, 0.90, 0.20),
  bearing:  mk(0xc0803a, 0.85, 0.30, { side: THREE.DoubleSide }),
  iron:     mk(0x3a414f, 0.60, 0.50),
  gear:     mk(0x59606f, 0.70, 0.40),
  bolt:     mk(0x22262e, 0.80, 0.40),
  plug:     mk(0xf1f5f9, 0.05, 0.35),
  valveIn:  mk(0x38bdf8, 0.70, 0.30),
  valveEx:  mk(0xfb923c, 0.70, 0.30),
  head:     mk(0x505a6c, 0.60, 0.45, { transparent: true, opacity: 0.55 }),
  liner:    mk(0x9fb3c8, 0.30, 0.30, { transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false }),
  block:    mk(0x5b6577, 0.40, 0.60, { transparent: true, opacity: 0.10, side: THREE.DoubleSide, depthWrite: false }),
  pan:      mk(0x2a3038, 0.55, 0.55, { transparent: true, opacity: 0.50, side: THREE.DoubleSide }),
  oil:      mk(0xd08a1a, 0.20, 0.30, { transparent: true, opacity: 0.55 }),
  mark:     new THREE.MeshBasicMaterial({ color: 0xf8fafc }),
  pointer:  new THREE.MeshBasicMaterial({ color: 0xf59e0b })
};

/* ═══════════════════════════════════════════════════════════════════════
   GEOMETRY HELPERS
   ═══════════════════════════════════════════════════════════════════════ */
/* Extrude a 2-D shape along the crank axis (X). Shape x→-Z, shape y→Y. */
function extrudeX(shape, depth, seg = lowEnd ? 12 : 28) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: seg });
  g.translate(0, 0, -depth / 2);
  g.rotateY(Math.PI / 2);
  return g;
}
function ringShape(ro, ri) {
  const s = new THREE.Shape(); s.absarc(0, 0, ro, 0, TAU, false);
  const h = new THREE.Path();  h.absarc(0, 0, ri, 0, TAU, true);
  s.holes.push(h); return s;
}
function halfRing(ro, ri, a0, a1) {
  const s = new THREE.Shape();
  s.moveTo(Math.cos(a0) * ro, Math.sin(a0) * ro);
  s.absarc(0, 0, ro, a0, a1, false);
  s.lineTo(Math.cos(a1) * ri, Math.sin(a1) * ri);
  s.absarc(0, 0, ri, a1, a0, true);
  s.closePath(); return s;
}
/* Crank web: big circle on the axis + small circle on the pin, joined by tangents */
function webShape(R1, R2, r) {
  const f = Math.asin((R1 - R2) / r);
  const s = new THREE.Shape();
  s.moveTo(R1 * Math.cos(f), R1 * Math.sin(f));
  s.lineTo(R2 * Math.cos(f), r + R2 * Math.sin(f));
  s.absarc(0, r, R2, f, Math.PI - f, false);
  s.lineTo(-R1 * Math.cos(f), R1 * Math.sin(f));
  s.absarc(0, 0, R1, Math.PI - f, TAU + f, false);
  s.closePath(); return s;
}
function counterweightShape(radius, halfAngleDeg) {
  const s = new THREE.Shape(); s.moveTo(0, 0);
  s.absarc(0, 0, radius, (270 - halfAngleDeg) * DEG, (270 + halfAngleDeg) * DEG, false);
  s.lineTo(0, 0); return s;
}
/* I-beam connecting-rod shank: unit length along +Y, scaled per rod length */
function ibeamGeo() {
  const fw = 0.090, hd = 0.075, ft = 0.030, wt = 0.018;
  const pts = [[-fw,-hd],[fw,-hd],[fw,-hd+ft],[wt,-hd+ft],[wt,hd-ft],[fw,hd-ft],[fw,hd],[-fw,hd],[-fw,hd-ft],[-wt,hd-ft],[-wt,-hd+ft],[-fw,-hd+ft]];
  const s = new THREE.Shape(); s.moveTo(pts[0][0], pts[0][1]); pts.slice(1).forEach(p => s.lineTo(p[0], p[1])); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: 1, bevelEnabled: false });
  g.rotateX(-Math.PI / 2);
  return g;
}
/* Piston: ring-land section (full turn) + two thrust-face skirt arcs, so the
   wrist pin and connecting rod stay visible through the sides. */
function pistonUpperGeo(R) {
  const P = (x, y) => new THREE.Vector2(x, y);
  const g = R - 0.03;
  const pts = [
    P(R - 0.07, 0.06), P(R, 0.06), P(R, 0.135), P(g, 0.135), P(g, 0.185), P(R, 0.185),
    P(R, 0.215), P(g, 0.215), P(g, 0.245), P(R, 0.245), P(R, 0.285), P(g, 0.285), P(g, 0.315), P(R, 0.315),
    P(R, 0.385), P(R - 0.02, 0.40), P(0.30, 0.40), P(0.12, 0.375), P(0, 0.365),
    P(0, 0.335), P(R - 0.07, 0.335), P(R - 0.07, 0.06)
  ];
  return new THREE.LatheGeometry(pts, lowEnd ? 24 : 44);
}
function pistonSkirtGeo(R, phiStart) {
  const P = (x, y) => new THREE.Vector2(x, y);
  const Rs = R - 0.008;
  const pts = [P(Rs - 0.05, 0.06), P(Rs, 0.06), P(Rs, -0.30), P(Rs - 0.03, -0.32), P(Rs - 0.05, -0.32), P(Rs - 0.05, 0.06)];
  return new THREE.LatheGeometry(pts, 12, phiStart, TAU / 3);
}

/* ═══════════════════════════════════════════════════════════════════════
   CRANKSHAFT  (rotates about X)
   ═══════════════════════════════════════════════════════════════════════ */
const crankGroup = new THREE.Group();
low.add(crankGroup);

const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 6.05, 24), MAT.crank);
shaft.rotation.z = Math.PI / 2; shaft.position.x = 0.10; shaft.castShadow = true;
crankGroup.add(shaft);

const journalGeo = new THREE.CylinderGeometry(0.16, 0.16, 0.40, lowEnd ? 16 : 28);
MAIN_X.forEach(x => {
  const j = new THREE.Mesh(journalGeo, MAT.journal);
  j.rotation.z = Math.PI / 2; j.position.x = x; j.castShadow = true;
  crankGroup.add(j);
});

const webGeo = extrudeX(webShape(0.34, 0.21, CFG.r), 0.11);
const cwGeo  = extrudeX(counterweightShape(0.62, 62), 0.11);
const pinGeo = new THREE.CylinderGeometry(0.14, 0.14, 0.50, lowEnd ? 16 : 28);

CYLINDERS.forEach(c => {
  const u = new THREE.Group();                       // one throw, built with the pin straight up
  u.position.x = c.x;
  u.rotation.x = c.phase * TAU;                      // 2 & 3 are 180° from 1 & 4
  crankGroup.add(u);
  [-1, 1].forEach(sg => {
    const web = new THREE.Mesh(webGeo, MAT.crankDk); web.position.x = sg * 0.205; web.castShadow = true; u.add(web);
    const cw  = new THREE.Mesh(cwGeo,  MAT.cw);      cw.position.x  = sg * 0.205; cw.castShadow  = true; u.add(cw);
  });
  const pin = new THREE.Mesh(pinGeo, MAT.journal);
  pin.rotation.z = Math.PI / 2; pin.position.y = CFG.r; pin.castShadow = true;
  u.add(pin);
  c.pinMesh = pin;
});

/* Front vibration damper with degree scale (TDC = long white mark) */
function addScale(parent, x, radius, dir) {
  for (let k = 0; k < 24; k++) {
    const a = k * 15 * DEG, big = k === 0;
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.02, big ? 0.15 : 0.06, 0.02), big ? MAT.mark : MAT.pointer);
    m.rotation.x = a;
    m.position.set(x + dir * 0.005, Math.cos(a) * radius, Math.sin(a) * radius);
    parent.add(m);
  }
}
const damper = new THREE.Group(); damper.position.x = -2.85; crankGroup.add(damper);
const damperDisc = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.16, lowEnd ? 28 : 48), MAT.iron);
damperDisc.rotation.z = Math.PI / 2; damper.add(damperDisc);
const damperHub = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.30, 0.26, 28), MAT.gear);
damperHub.rotation.z = Math.PI / 2; damperHub.position.x = -0.04; damper.add(damperHub);
addScale(damper, -0.085, 0.47, -1);

/* Rear flywheel with starter ring gear and TDC mark */
const fly = new THREE.Group(); fly.position.x = 3.05; crankGroup.add(fly);
const flyDisc = new THREE.Mesh(new THREE.CylinderGeometry(0.78, 0.78, 0.16, lowEnd ? 32 : 56), MAT.iron);
flyDisc.rotation.z = Math.PI / 2; flyDisc.castShadow = true; fly.add(flyDisc);
const ringGear = Base.makeCog(0.78, 0.12, lowEnd ? 36 : 54, 0.05, 0.04, MAT.gear, MAT.gear);
ringGear.rotation.z = Math.PI / 2; fly.add(ringGear);
const flyHub = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.26, 28), MAT.crank);
flyHub.rotation.z = Math.PI / 2; flyHub.position.x = 0.04; fly.add(flyHub);
addScale(fly, 0.085, 0.60, 1);

/* Fixed timing pointers */
function addPointer(x, y) {
  const m = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.16, 12), MAT.pointer);
  m.rotation.z = Math.PI; m.position.set(x, y, 0); low.add(m);
}
addPointer(-2.85, 0.68);
addPointer( 3.05, 0.95);

/* Main bearings: copper shell + bolted cap under each journal */
const shellGeo = extrudeX(halfRing(0.19, 0.165, Math.PI, TAU), 0.34);
const capGeo   = extrudeX(halfRing(0.32, 0.19,  Math.PI, TAU), 0.34);
const boltGeo  = new THREE.CylinderGeometry(0.028, 0.028, 0.24, 10);
MAIN_X.forEach(x => {
  const sh = new THREE.Mesh(shellGeo, MAT.bearing); sh.position.x = x; low.add(sh);
  const cp = new THREE.Mesh(capGeo,   MAT.iron);    cp.position.x = x; cp.castShadow = true; low.add(cp);
  [-0.25, 0.25].forEach(z => { const b = new THREE.Mesh(boltGeo, MAT.bolt); b.position.set(x, -0.20, z); low.add(b); });
});

/* Oil pan + sump oil */
const pan = new THREE.Mesh(new THREE.BoxGeometry(5.0, 0.55, 2.5), MAT.pan);
pan.position.y = -1.42; low.add(pan);
const oil = new THREE.Mesh(new THREE.BoxGeometry(4.7, 0.16, 2.25), MAT.oil);
oil.position.y = -1.60; low.add(oil);

/* ═══════════════════════════════════════════════════════════════════════
   CONNECTING RODS + PISTONS  (rod local +Y runs from big end to small end)
   ═══════════════════════════════════════════════════════════════════════ */
const SHANK0 = 0.235;
const rodGeo = {
  bigTop: extrudeX(halfRing(0.25, 0.152, 0, Math.PI), 0.30),
  bigCap: extrudeX(halfRing(0.25, 0.152, Math.PI, TAU), 0.30),
  shell:  extrudeX(ringShape(0.152, 0.142), 0.30),
  small:  extrudeX(ringShape(0.150, 0.085), 0.28),
  shank:  ibeamGeo(),
  bolt:   new THREE.CylinderGeometry(0.028, 0.028, 0.26, 10),
  head:   new THREE.CylinderGeometry(0.05, 0.05, 0.04, 6)
};

const R_P = CFG.bore - 0.02;                                   // piston radius
const pistonGeoUpper = pistonUpperGeo(R_P);
const pistonGeoSkirtA = pistonSkirtGeo(R_P, -Math.PI / 3);
const pistonGeoSkirtB = pistonSkirtGeo(R_P, 2 * Math.PI / 3);
const ringGeo = new THREE.CylinderGeometry(R_P + 0.004, R_P + 0.004, 0.026, lowEnd ? 24 : 40);
const pinCylGeo = new THREE.CylinderGeometry(0.075, 0.075, 0.78, 20);
const bossGeo = new THREE.CylinderGeometry(0.13, 0.13, 0.14, 20);
const tagGeo  = new THREE.CylinderGeometry(0.16, 0.16, 0.012, 24);

CYLINDERS.forEach(c => {
  c.rodMat = MAT.rod.clone();
  c.pistonMat = MAT.piston.clone();

  /* rod */
  const g = new THREE.Group();
  const add = (geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; g.add(m); return m; };
  add(rodGeo.bigTop, c.rodMat);
  add(rodGeo.bigCap, MAT.rodCap);
  add(rodGeo.shell,  MAT.bearing);
  [-0.20, 0.20].forEach(z => { add(rodGeo.bolt, MAT.bolt, 0, -0.13, z); add(rodGeo.head, MAT.bolt, 0, -0.27, z); });
  c.shank = add(rodGeo.shank, c.rodMat, 0, SHANK0, 0);
  c.small = add(rodGeo.small, c.rodMat, 0, 3, 0);
  low.add(g); c.rod = g;

  /* piston, origin = wrist-pin axis */
  const p = new THREE.Group();
  const addP = (geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; p.add(m); return m; };
  addP(pistonGeoUpper,  c.pistonMat);
  addP(pistonGeoSkirtA, c.pistonMat);
  addP(pistonGeoSkirtB, c.pistonMat);
  [0.30, 0.23].forEach(y => addP(ringGeo, MAT.ring, 0, y, 0));
  addP(ringGeo, MAT.oilRing, 0, 0.16, 0);
  const pin = addP(pinCylGeo, MAT.pin); pin.rotation.z = Math.PI / 2;
  [-0.34, 0.34].forEach(x => { const b = addP(bossGeo, c.pistonMat, x, 0, 0); b.rotation.z = Math.PI / 2; });
  addP(tagGeo, new THREE.MeshStandardMaterial({ color: c.colour, emissive: c.colour, emissiveIntensity: 0.45 }), 0, 0.368, 0);
  low.add(p); c.pistonG = p;
});

/* ═══════════════════════════════════════════════════════════════════════
   BLOCK, LINERS, HEAD, SPARK PLUGS, VALVES, GAS  (fixed in space)
   ═══════════════════════════════════════════════════════════════════════ */
const unitBox = new THREE.BoxGeometry(1, 1, 1);
const blockShell = new THREE.Mesh(unitBox, MAT.block);
blockShell.add(new THREE.LineSegments(new THREE.EdgesGeometry(unitBox),
  new THREE.LineBasicMaterial({ color: 0x8aa0bd, transparent: true, opacity: 0.45 })));
deck.add(blockShell);

const LINER_BOT = 1.72;
const linerGeo = new THREE.CylinderGeometry(CFG.bore + 0.02, CFG.bore + 0.02, CFG.deckY - LINER_BOT, lowEnd ? 24 : 44, 1, true);
const head = new THREE.Mesh(new THREE.BoxGeometry(4.9, 0.55, 2.4), MAT.head);
head.position.y = CFG.deckY + 0.275; deck.add(head);

const hexGeo = new THREE.CylinderGeometry(0.09, 0.09, 0.08, 6);
const insGeo = new THREE.CylinderGeometry(0.055, 0.065, 0.46, 16);
const stemGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.5, 8);
const vDiscGeo = new THREE.CylinderGeometry(0.13, 0.05, 0.05, 20);
const chargeGeo = new THREE.CylinderGeometry(R_P - 0.01, R_P - 0.01, 1, lowEnd ? 24 : 36);
const sparkGeo = new THREE.SphereGeometry(0.09, 12, 10);

CYLINDERS.forEach(c => {
  const liner = new THREE.Mesh(linerGeo, MAT.liner);

/* ═══════════════════════════════════════════════════════════════════════
   GRAPH  (canvas, redrawn with the readouts)
   ═══════════════════════════════════════════════════════════════════════ */
const GRAPH = {
  pos:    { unit: 'mm from TDC', f: (e) => e.x * 1000 },
  vel:    { unit: 'm/s',         f: (e) => e.v },
  acc:    { unit: 'g',           f: (e) => e.a / 9.81 },
  press:  { unit: 'bar',         f: (e) => e.p },
  torque: { unit: 'N·m',         f: (e) => e.T }
};
function drawGraph() {
  const cv = cpGraph;
  if (!cv) return;
  const g = cv.getContext('2d'); if (!g) return;
  const W = cv.width, Hh = cv.height;
  const light = document.documentElement.classList.contains('light-theme');
  const ink  = light ? '#334155' : '#cbd5e1';
  const dim  = light ? 'rgba(51,65,85,.60)' : 'rgba(203,213,225,.60)';
  const grid = light ? 'rgba(15,23,42,.10)' : 'rgba(255,255,255,.10)';
  const padL = 40, padR = 8, padT = 24, padB = 20;
  const pw = W - padL - padR, ph = Hh - padT - padB;
  const rpm = engineRpm(), ratio = rodRatio(), fc = CYLINDERS[focus];
  const def = GRAPH[graphMode];

  const N = 180, main = [], second = [];
  for (let i = 0; i <= N; i++) {
    const ce = i * 4;
    const e = evalCyl(mod(ce - fc.fire, 720), rpm, ratio);
    if (graphMode === 'torque') { main.push(totalTorque(ce, rpm, ratio)); second.push(e.T); }
    else main.push(def.f(e));
  }
  const all = main.concat(second);
  let lo = Math.min(...all), hi = Math.max(...all);
  if (graphMode === 'pos') { lo = 0; hi = 90; }
  else { lo = Math.min(lo, 0); hi = Math.max(hi, 0); const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad; }
  const X = d => padL + d / 720 * pw;
  const Y = v => padT + (1 - (v - lo) / (hi - lo)) * ph;

  g.clearRect(0, 0, W, Hh);
  /* stroke bands of the selected cylinder */
  for (let k = 0; k < 4; k++) {
    const s = mod(fc.fire + k * 180, 720);
    g.fillStyle = '#' + STAGES[k].col.toString(16).padStart(6, '0');
    g.globalAlpha = 0.13; g.fillRect(X(s), padT, X(s + 180) - X(s), ph); g.globalAlpha = 1;
    g.fillStyle = dim; g.font = '9px system-ui, sans-serif'; g.textAlign = 'center';
    g.fillText(STAGES[k].n.slice(0, 3).toUpperCase(), (X(s) + X(s + 180)) / 2, padT - 8);
  }
  /* grid + axes */
  g.strokeStyle = grid; g.lineWidth = 1; g.beginPath();
  for (let d = 0; d <= 720; d += 180) { g.moveTo(X(d), padT); g.lineTo(X(d), padT + ph); }
  g.stroke();
  g.strokeStyle = dim; g.beginPath(); g.moveTo(padL, Y(0)); g.lineTo(W - padR, Y(0)); g.stroke();
  g.fillStyle = dim; g.font = '9px system-ui, sans-serif'; g.textAlign = 'center';
  for (let d = 0; d <= 720; d += 180) g.fillText(d + '°', X(d), Hh - 6);
  g.textAlign = 'right';
  g.fillText(hi.toFixed(Math.abs(hi) < 10 ? 1 : 0), padL - 4, padT + 8);
  g.fillText(lo.toFixed(Math.abs(lo) < 10 ? 1 : 0), padL - 4, padT + ph);
  g.textAlign = 'left'; g.fillStyle = ink; g.fillText(def.unit, 4, 12);
  g.textAlign = 'right'; g.fillText('Cyl ' + fc.id, W - padR, 12);

  const line = (arr, color, w, alpha) => {
    g.strokeStyle = color; g.lineWidth = w; g.globalAlpha = alpha; g.beginPath();
    arr.forEach((v, i) => { const x = X(i * 4), y = Y(v); i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.stroke(); g.globalAlpha = 1;
  };
  if (graphMode === 'torque') { line(second, ink, 1, 0.45); line(main, CFG.accent, 2.2, 1); }
  else line(main, CFG.accent, 2.2, 1);

  /* now-marker */
  const cyc = mod(thetaTotal / DEG, 720);
  const idx = Math.min(N, Math.round(cyc / 4));
  g.strokeStyle = ink; g.lineWidth = 1; g.setLineDash([3, 3]);
  g.beginPath(); g.moveTo(X(cyc), padT); g.lineTo(X(cyc), padT + ph); g.stroke(); g.setLineDash([]);
  g.fillStyle = CFG.accent; g.beginPath(); g.arc(X(idx * 4), Y(main[idx]), 3.5, 0, TAU); g.fill();
}

/* ═══════════════════════════════════════════════════════════════════════
   ANIMATION
   ═══════════════════════════════════════════════════════════════════════ */
let thetaTotal = 0;                  // total crank angle, wrapped to 0…4π (one 720° cycle)
let last = performance.now();
let raf = 0;
let roClock = 0;

const tmp = new THREE.Vector3();
const cCol = new THREE.Color();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const C_INTAKE = new THREE.Color(0x38bdf8), C_COMP = new THREE.Color(0x818cf8);
const C_HOT = new THREE.Color(0xffd23f), C_FIRE = new THREE.Color(0xff5a1f), C_COOL = new THREE.Color(0x8a4b2a);
const C_EXH = new THREE.Color(0x94a3b8);

function valveLift(phi, open, close) {
  if (phi < open || phi > close) return 0;
  return Math.sin(Math.PI * (phi - open) / (close - open)) * 0.13;
}

function updatePose() {
  const r = CFG.r, l = rodLen();
  const th = thetaTotal % TAU;
  const cyc = cycleDeg();
  crankGroup.rotation.x = th;

  CYLINDERS.forEach((c, i) => {
    const ang = th + c.phase * TAU;
    const s = Math.sin(ang), co = Math.cos(ang);
    const pinY = r * co, pinZ = r * s;
    const pistonY = pinY + Math.sqrt(l * l - (r * s) * (r * s));

    c.pistonG.position.set(c.x, pistonY, 0);
    c.rod.position.set(c.x, pinY, pinZ);
    c.rod.rotation.x = Math.atan2(-pinZ, pistonY - pinY);
    c.pinY = pinY; c.pinZ = pinZ; c.pistonY = pistonY;

    const isFocus = i === focus;
    c.rodMat.emissive.setHex(c.colour);    c.rodMat.emissiveIntensity = isFocus ? 0.30 : 0;
    c.pistonMat.emissive.setHex(c.colour); c.pistonMat.emissiveIntensity = isFocus ? 0.16 : 0;

    /* stroke + valves + spark */
    const phi = mod(cyc - c.fire, 720);
    const st = stageOf(phi);
    c.valveIn.position.y = CFG.deckY - valveLift(phi, 350, 580);
    c.valveEx.position.y = CFG.deckY - valveLift(phi, 140, 370);
    const sparkOn = phi >= 708 || phi < 6;
    c.sparkMat.opacity = sparkOn ? 0.95 : 0;

    /* gas between crown and head */
    const crownWorld = crankY + pistonY + CFG.crownH;
    const gap = Math.max(0.02, CFG.deckY - crownWorld);
    c.charge.visible = state.showGas !== false;
    c.charge.position.set(c.x, crownWorld + gap / 2, 0);
    c.charge.scale.set(1, gap, 1);
    if (st === 0) {                                   // power: bright → dull orange
      const k = phi / 180;
      cCol.copy(C_HOT).lerp(C_FIRE, smooth(0, 0.25, k)).lerp(C_COOL, smooth(0.35, 1, k));
      c.chargeMat.color.copy(cCol); c.chargeMat.opacity = lerp(0.62, 0.20, smooth(0, 1, k));
    } else if (st === 1) {                            // exhaust
      c.chargeMat.color.copy(C_EXH); c.chargeMat.opacity = lerp(0.24, 0.08, (phi - 180) / 180);
    } else if (st === 2) {                            // intake
      c.chargeMat.color.copy(C_INTAKE); c.chargeMat.opacity = 0.16;
    } else {                                          // compression: denser and warmer
      const k = (phi - 540) / 180;
      c.chargeMat.color.copy(C_INTAKE).lerp(C_COMP, k); c.chargeMat.opacity = lerp(0.16, 0.42, k);
    }
  });
}

function updateLabels() {
  labels.hideAll();
  if (!state.showLabels) return;
  const c1 = CYLINDERS[0], c2 = CYLINDERS[1], c3 = CYLINDERS[2], c4 = CYLINDERS[3];
  const P = (id, x, y, z) => labels.project(id, tmp.set(x, y, z), camera, wrap);
  P('crank', 0.0, crankY + 0.05, 0.18);
  P('throw', c2.x, crankY + c2.pinY, c2.pinZ + 0.16);
  const cwAng = Math.atan2(c4.pinZ, c4.pinY) + Math.PI;
  P('cw', c4.x + 0.20, crankY + Math.cos(cwAng) * 0.45, Math.sin(cwAng) * 0.45);
  P('main', -1.10, crankY + 0.05, 0.20);
  P('cap', 1.10, crankY - 0.30, 0.34);
  P('rod', c3.x, crankY + (c3.pinY + c3.pistonY) / 2, c3.pinZ / 2 + 0.10);
  P('big', c2.x, crankY + c2.pinY - 0.20, c2.pinZ + 0.25);
  P('piston', c1.x, crankY + c1.pistonY + 0.44, 0);
  P('rings', c1.x, crankY + c1.pistonY + 0.23, R_P + 0.05);
  P('wrist', c4.x + 0.40, crankY + c4.pistonY, 0);
  P('liner', 2.45, 3.05, 0.0);
  P('head', 2.3, CFG.deckY + 0.30, 1.2);
  P('plug', c1.x, CFG.deckY + 1.30, 0);
  P('vin', c2.x, CFG.deckY + 0.30, -0.24);
  P('vex', c3.x, CFG.deckY + 0.30, 0.24);
  P('fly', 3.05, crankY + 0.80, 0);
  P('damp', -2.85, crankY + 0.62, 0);
  P('pan', 2.2, crankY - 1.55, 1.2);
  P('cyl1', c1.x, CFG.deckY + 1.55, 0);
  P('cyl4', c4.x, CFG.deckY + 1.55, 0);
}

function tick(dt, advance) {
  if (advance) {
    const sp = state.playing ? state.speedMul : 0;
    thetaTotal = (thetaTotal + dt * sp * CFG.cycleHz * TAU) % (2 * TAU);
  }
  updatePose();
  updateLabels();
  controls.update();
  renderer.render(scene, camera);
  roClock += dt;
  if (roClock > 0.12) { roClock = 0; updateReadouts(); }
}

function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  tick(dt, true);
}

if (reduced) {
  updatePose(); updateReadouts();
  setInterval(() => tick(0.12, false), 120);
} else {
  raf = requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', () => {
  if (reduced) return;
  if (document.hidden) {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  } else if (!raf) {
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }
});

setFocusButton();
updatePose();
updateReadouts();

</script>
</body>
</html>
