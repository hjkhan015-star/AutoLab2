<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d13">
<title>Manual Gearbox — Auto Lab</title>
<link rel="stylesheet" href="app.css">
<style>
  /* ═══════════════════════════════════════════════════════════
     WIDGET INTERIOR — Torque visualizer (bottom-left)
     ═══════════════════════════════════════════════════════════ */
  .tq-panel {
    width: 220px;
    background: rgba(11, 14, 20, 0.92);
    border: 1px solid var(--border, rgba(255,255,255,.10));
    border-radius: 12px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    overflow: hidden;
    color: var(--text, #e6e9ef);
    font: 11px/1.35 system-ui, -apple-system, sans-serif;
    box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    user-select: none;
  }
  html.light-theme .tq-panel {
    background: rgba(255,255,255,.95);
    border-color: rgba(15,23,42,.14);
    color: #0a0d13;
    box-shadow: 0 8px 32px rgba(15,23,42,.15);
  }

  .tq-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border, rgba(255,255,255,.07));
    gap: 8px;
  }
  html.light-theme .tq-header { border-bottom-color: rgba(15,23,42,.08); }

  .tq-live { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
  .tq-gear {
    font-size: 12px; font-weight: 800; letter-spacing: .02em;
    color: #22c55e; line-height: 1;
    transition: color .2s;
  }
  .tq-gear.shifting { color: #38bdf8; }
  .tq-rpm {
    font-size: 10px;
    font-family: var(--font-mono);
    color: var(--text-dim, #94a3b8);
    font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  html.light-theme .tq-rpm { color: #64748b; }

  .tq-status {
    font-weight: 700; font-size: 10px; letter-spacing: .06em;
    color: #38bdf8; opacity: 0; transition: opacity .15s;
    padding: 2px 6px; border-radius: 4px;
    background: rgba(56,189,248,.15);
    text-transform: uppercase; flex: 0 0 auto;
  }
  .tq-status.on { opacity: 1; }

  .tq-toggle {
    background: none; border: none;
    color: var(--text-dim, #9aa3b2);
    cursor: pointer; font-size: 14px; line-height: 1;
    padding: 0 2px; border-radius: 4px; flex: 0 0 auto;
  }
  .tq-toggle:hover { color: #fff; background: rgba(255,255,255,0.08); }
  html.light-theme .tq-toggle { color: #64748b; }
  html.light-theme .tq-toggle:hover { color: #0a0d13; background: rgba(15,23,42,.08); }

  .tq-canvas { display: block; width: 100%; height: 110px; }
  .tq-panel.collapsed .tq-canvas { display: none; }

  .ratio-badge {
    display: inline-block;
    background: rgba(56, 189, 248, 0.14);
    color: #38bdf8;
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-left: 4px;
  }

  /* ═══════════════════════════════════════════════════════════
     WIDGET INTERIOR — H-pattern gear shifter (bottom-right)
     ═══════════════════════════════════════════════════════════ */
  #gear-shifter-overlay {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }

  #gear-shifter {
    width: clamp(108px, 26vw, 144px);
    height: clamp(150px, 36vw, 200px);
    pointer-events: auto;
    cursor: grab;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,.62));
    transition: filter .2s;
  }
  #gear-shifter.grabbing {
    cursor: grabbing;
    filter: drop-shadow(0 0 16px rgba(56,189,248,.48))
            drop-shadow(0 10px 20px rgba(0,0,0,.65));
  }

  #gs-knob {
    transition: transform .16s cubic-bezier(.32,.72,0,1);
    will-change: transform;
  }
  #gear-shifter.grabbing #gs-knob { transition: none; }

  .gs-bg {
    fill: rgba(10,14,20,.86);
    stroke: rgba(255,255,255,.10);
    stroke-width: 1.5;
  }
  html.light-theme .gs-bg {
    fill: rgba(255,255,255,.96);
    stroke: rgba(15,23,42,.14);
  }

  .gs-groove {
    fill: rgba(255,255,255,.045);
    stroke: rgba(255,255,255,.08);
    stroke-width: 1;
  }
  html.light-theme .gs-groove {
    fill: rgba(15,23,42,.06);
    stroke: rgba(15,23,42,.10);
  }

  .gs-title {
    fill: #64748b; font-size: 10px; font-weight: 800;
    letter-spacing: 1.6px;
    font-family: var(--font-sans);
  }
  html.light-theme .gs-title { fill: #94a3b8; }

  .gs-label {
    fill: #94a3b8; font-size: 12px; font-weight: 800;
    font-family: var(--font-mono);
    transition: fill .2s;
  }
  .gs-label.active { fill: #38bdf8; }
  html.light-theme .gs-label { fill: #475569; }
  html.light-theme .gs-label.active { fill: #2563eb; }

  .gs-gate { fill: rgba(148,163,184,.32); transition: fill .2s; }
  .gs-gate.active { fill: #38bdf8; }
  html.light-theme .gs-gate { fill: rgba(15,23,42,.22); }
  html.light-theme .gs-gate.active { fill: #2563eb; }

  .gs-knob-shadow { fill: rgba(0,0,0,.55); }
  .gs-knob {
    fill: #3b4656; stroke: #a8b4c4; stroke-width: 1.6;
    transition: fill .15s, stroke .15s;
  }
  .gs-knob-hi { fill: rgba(255,255,255,.18); transition: fill .15s; }
  #gear-shifter.grabbing .gs-knob { stroke: #38bdf8; fill: #4b5a72; }
  #gear-shifter.grabbing .gs-knob-hi { fill: rgba(56,189,248,.28); }
  html.light-theme .gs-knob { fill: #cbd5e1; stroke: #334155; }
  html.light-theme .gs-knob-hi { fill: rgba(255,255,255,.7); }
  html.light-theme .gs-knob-shadow { fill: rgba(15,23,42,.20); }

  #gear-shifter-label {
    margin-top: 2px;
    color: var(--text-dim, #aab4c3);
    font-size: 10px; font-weight: 700; letter-spacing: .55px;
    text-transform: uppercase;
    background: rgba(10,14,20,.78);
    padding: 4px 10px; border-radius: 20px;
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    border: 1px solid var(--border, rgba(255,255,255,.08));
    pointer-events: none;
    transition: color .15s, border-color .15s;
    white-space: nowrap;
  }
  html.light-theme #gear-shifter-label {
    background: rgba(255,255,255,.94);
    border-color: rgba(15,23,42,.14);
    color: #475569;
  }
  #gear-shifter-label.active {
    color: #38bdf8; border-color: rgba(56,189,248,.38);
  }

  /* ═══════════════════════════════════════════════════════════
     TOOLBAR EXTRAS — gearbox config switcher (prev / label / next)
     ═══════════════════════════════════════════════════════════ */
  .cfg-group {
    display: flex; align-items: center; gap: 4px;
    padding-left: 8px; margin-left: 4px;
    border-left: 1px solid var(--border, rgba(255,255,255,.10));
  }
  .cfg-arrow {
    width: 22px; height: 22px; border-radius: 50%;
    border: none; background: rgba(255,255,255,.08);
    color: var(--text, #e5e7eb); font-size: 14px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-family: inherit; padding: 0;
    transition: background var(--dur-fast, .15s) var(--ease-out, ease),
                color var(--dur-fast, .15s) var(--ease-out, ease);
  }
  .cfg-arrow:hover, .cfg-arrow:active { background: var(--accent, #22c55e); color: #0b0e14; }
  #cfg-label {
    min-width: 108px; text-align: center; white-space: nowrap;
    font-size: 10.5px; font-weight: 700; letter-spacing: .02em;
    color: var(--text, #e5e7eb);
    font-family: var(--font-mono);
  }
  html.light-theme .cfg-arrow { background: rgba(15,23,42,.08); color: #0a0d13; }
  html.light-theme .cfg-arrow:hover { background: var(--accent, #22c55e); color: #fff; }
  html.light-theme #cfg-label { color: #0a0d13; }
  @media (max-width: 600px) {
    .cfg-arrow { width: 19px; height: 19px; font-size: 12px; }
    #cfg-label { min-width: 84px; font-size: 10px; }
  }
</style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div id="labels-root"></div>

  <script src="guard.js"></script>
  <script type="importmap">
  { "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import * as Base from './kit.js';
  import { UI } from './kit.js';

  /* ═══════════════════════════════════════════════════════════
     ADAPTIVE QUALITY
     ═══════════════════════════════════════════════════════════ */
  const isCoarse = matchMedia('(pointer: coarse)').matches;
  const cores    = navigator.hardwareConcurrency || 4;
  const mem      = navigator.deviceMemory || 4;
  const isLowEnd = cores <= 4 || mem <= 2;
  const isMidEnd = !isLowEnd && (cores <= 6 || isCoarse);

  const CYL_SEGS = isLowEnd ? 20 : 32;
  const TORUS_SEGS = isLowEnd ? 6 : 10;

  /* ═══════════════════════════════════════════════════════════
     SCENE
     ═══════════════════════════════════════════════════════════ */
  const { scene, camera, renderer, controls, wrap, viewManager } = Base.buildScene({
    fov: 42,
    camPos: isCoarse ? [1.0, 2.2, 3.6] : [1.2, 2.6, 4.4],
    target: [0.9, 0, 0],
    floorY: -2.15
  });
  Base.attachResize(camera, renderer, wrap, 42);
  const labels = Base.createLabelSystem();
  const state = Base.createUIState();

  /* ═══════════════════════════════════════════════════════════
     MATERIALS
     ═══════════════════════════════════════════════════════════ */
  const gbMats = {
    shaft:    new THREE.MeshStandardMaterial({ color:0x8a93a5, metalness:0.85, roughness:0.30 }),
    gearFix:  new THREE.MeshStandardMaterial({ color:0xa8b0be, metalness:0.85, roughness:0.28 }),
    gearFixT: new THREE.MeshStandardMaterial({ color:0xbcc4d0, metalness:0.85, roughness:0.26 }),
    gearFry:  new THREE.MeshStandardMaterial({ color:0xc9d2dd, metalness:0.80, roughness:0.30 }),
    gearFryT: new THREE.MeshStandardMaterial({ color:0xdde4ed, metalness:0.80, roughness:0.28 }),
    hub:      new THREE.MeshStandardMaterial({ color:0xd4a34a, metalness:0.85, roughness:0.28 }),
    hubT:     new THREE.MeshStandardMaterial({ color:0xe6b85a, metalness:0.85, roughness:0.25 }),
    idler:    new THREE.MeshStandardMaterial({ color:0x66bb6a, metalness:0.80, roughness:0.30 }),
    idlerT:   new THREE.MeshStandardMaterial({ color:0x7dcc81, metalness:0.80, roughness:0.28 }),
    housing:  new THREE.MeshStandardMaterial({
      color:0x8a93a5, metalness:0.30, roughness:0.45,
      transparent:true, opacity:0.05,
      side:THREE.DoubleSide, depthWrite:false
    })
  };

  const GEAR_RATIOS = [3.50, 2.00, 1.40, 1.00, 3.60];

  const MODULE = 0.022;
  const teethFor = (r) => Math.round(2 * r / MODULE);

  const SH_Y_TOP = 0.30, SH_Y_BOT = -0.25;
  const SHAFT_GAP = SH_Y_TOP - SH_Y_BOT;

  const IN_X = -0.50, G1_X = 0.10, G2_X = 0.70, G3_X = 1.30, G4_X = 1.90;
  const HUB12_X = 0.40, HUB34_X = 1.60, GR_X = 2.60;

  const R_IN_TOP = 0.20, R_IN_BOT = 0.35;
  const MESH_IN_CS = R_IN_TOP / R_IN_BOT;

  const GEAR_GEOM = GEAR_RATIOS.map(gRatio => {
    const gb = (1 / gRatio) / MESH_IN_CS;
    const rTop = SHAFT_GAP / (1 + gb);
    return { rTop, rBot: SHAFT_GAP - rTop, gb };
  });

  const R_G1_TOP = GEAR_GEOM[0].rTop, R_G1_BOT = GEAR_GEOM[0].rBot;
  const R_G2_TOP = GEAR_GEOM[1].rTop, R_G2_BOT = GEAR_GEOM[1].rBot;
  const R_G3_TOP = GEAR_GEOM[2].rTop, R_G3_BOT = GEAR_GEOM[2].rBot;
  const R_G4_TOP = GEAR_GEOM[3].rTop, R_G4_BOT = GEAR_GEOM[3].rBot;
  const R_GR_TOP = GEAR_GEOM[4].rTop, R_GR_BOT = GEAR_GEOM[4].rBot;
  const GB_RATIOS = GEAR_GEOM.map(g => g.gb);

  const R_IDLER = 0.20;
  const _idler_d1 = R_IDLER + R_GR_BOT;
  const _idler_d2 = R_IDLER + R_GR_TOP;
  const _idler_h  = (_idler_d1**2 - _idler_d2**2 + SHAFT_GAP**2) / (2 * SHAFT_GAP);
  const _idler_s  = Math.sqrt(_idler_d1**2 - _idler_h**2);
  const IDLER_X = GR_X - _idler_s;
  const IDLER_Y = SH_Y_BOT + _idler_h;
  const IDLER_Z = 0;

  /* ═══════════════════════════════════════════════════════════
     MAIN GROUP — MANUAL GEARBOX
     ═══════════════════════════════════════════════════════════ */
  const gearboxGroup = new THREE.Group();
  scene.add(gearboxGroup);

  const gbInputGrp   = new THREE.Group(); gbInputGrp.position.set(0, SH_Y_TOP, 0); gearboxGroup.add(gbInputGrp);
  const gbOutputGrp  = new THREE.Group(); gbOutputGrp.position.set(0, SH_Y_TOP, 0); gearboxGroup.add(gbOutputGrp);
  const gbCounterGrp = new THREE.Group(); gbCounterGrp.position.set(0, SH_Y_BOT, 0); gearboxGroup.add(gbCounterGrp);

  function gbShaft(len, cx) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,len,CYL_SEGS), gbMats.shaft);
    m.rotation.z = Math.PI/2; m.position.x = cx; return m;
  }
  gbInputGrp.add(gbShaft(1.20, -1.10));
  gbOutputGrp.add(gbShaft(3.20, 1.55));
  gbCounterGrp.add(gbShaft(3.50, 1.45));

  function speedRotor(parent, x, color) {
    const rotor = new THREE.Group(); rotor.position.set(x, 0, 0);
    const disc = new THREE.Mesh(
      new THREE.CylinderGeometry(0.14,0.14,0.02,CYL_SEGS),
      new THREE.MeshStandardMaterial({ color: 0x15191f, metalness: 0.6, roughness: 0.4 })
    );
    disc.rotation.z = Math.PI/2; rotor.add(disc);
    const barMat = new THREE.MeshBasicMaterial({ color });
    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.015,0.24,0.04), barMat); bar.position.y = 0.05; rotor.add(bar);
    const dot = new THREE.Mesh(new THREE.BoxGeometry(0.015,0.06,0.04), barMat); dot.position.y = -0.08; rotor.add(dot);
    parent.add(rotor);
  }
  speedRotor(gbInputGrp,   -1.40, 0x38bdf8);
  speedRotor(gbOutputGrp,   2.80, 0x22c55e);
  speedRotor(gbCounterGrp,  2.80, 0xf59e0b);

  function bearing(x, y) {
    const outer = new THREE.Mesh(new THREE.TorusGeometry(0.13,0.035,TORUS_SEGS,CYL_SEGS), gbMats.gearFix);
    outer.rotation.y = Math.PI/2; outer.position.set(x, y, 0); gearboxGroup.add(outer);
    const inner = new THREE.Mesh(new THREE.TorusGeometry(0.09,0.02,TORUS_SEGS,CYL_SEGS), gbMats.shaft);
    inner.rotation.y = Math.PI/2; inner.position.set(x, y, 0); gearboxGroup.add(inner);
  }
  bearing(-0.60, SH_Y_TOP); bearing(-0.40, SH_Y_BOT);
  bearing( 3.10, SH_Y_TOP); bearing( 3.20, SH_Y_BOT);

  function cogOnX(x, r, mat, teethMat, phase = 0) {
    const teeth = teethFor(r);
    const g = Base.makeCog(r, 0.10, teeth, r*0.15, r*0.12, mat, teethMat);
    g.rotation.z = Math.PI/2;
    g.rotation.x = phase;
    g.position.x = x;
    return g;
  }
  gbInputGrp.add(cogOnX(IN_X, R_IN_TOP, gbMats.gearFix, gbMats.gearFixT));
  gbCounterGrp.add(cogOnX(IN_X, R_IN_BOT, gbMats.gearFix, gbMats.gearFixT, Math.PI / teethFor(R_IN_BOT)));
  gbCounterGrp.add(cogOnX(G1_X, R_G1_BOT, gbMats.gearFix, gbMats.gearFixT, Math.PI / teethFor(R_G1_BOT)));
  gbCounterGrp.add(cogOnX(G2_X, R_G2_BOT, gbMats.gearFix, gbMats.gearFixT, Math.PI / teethFor(R_G2_BOT)));
  gbCounterGrp.add(cogOnX(G3_X, R_G3_BOT, gbMats.gearFix, gbMats.gearFixT, Math.PI / teethFor(R_G3_BOT)));
  gbCounterGrp.add(cogOnX(G4_X, R_G4_BOT, gbMats.gearFix, gbMats.gearFixT, Math.PI / teethFor(R_G4_BOT)));
  gbCounterGrp.add(cogOnX(GR_X, R_GR_BOT, gbMats.gearFix, gbMats.gearFixT, Math.PI / teethFor(R_GR_BOT)));

  function freeGear(x, r, markerColor) {
    const g = new THREE.Group(); g.position.set(x, SH_Y_TOP, 0);
    const matBody  = gbMats.gearFry.clone();  matBody.transparent  = true; matBody.opacity  = 0.4;
    const matTooth = gbMats.gearFryT.clone(); matTooth.transparent = true; matTooth.opacity = 0.4;
    const cog = Base.makeCog(r, 0.10, teethFor(r), r*0.15, r*0.12, matBody, matTooth);
    cog.rotation.z = Math.PI/2;
    g.add(cog);
    const marker = new THREE.Mesh(new THREE.BoxGeometry(0.10,0.14,0.05),
      new THREE.MeshBasicMaterial({ color: markerColor }));
    marker.position.set(0, r + 0.055, 0); g.add(marker);
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(r*1.06, 0.035, TORUS_SEGS, CYL_SEGS),
      new THREE.MeshBasicMaterial({ color:0x38bdf8, transparent:true, opacity:0.95 })
    );
    ring.rotation.y = Math.PI/2; ring.visible = false; g.add(ring);
    const glow = new THREE.Mesh(
      new THREE.TorusGeometry(r*1.10, 0.06, TORUS_SEGS, CYL_SEGS),
      new THREE.MeshBasicMaterial({
        color: markerColor, transparent:true, opacity:0,
        blending: THREE.AdditiveBlending, depthWrite: false
      })
    );
    glow.rotation.y = Math.PI/2; glow.visible = false; g.add(glow);
    gearboxGroup.add(g);
    return { group: g, ring, glow, matBody, matTooth };
  }
  const gbFree = [
    freeGear(G1_X, R_G1_TOP, 0x38bdf8),
    freeGear(G2_X, R_G2_TOP, 0x22c55e),
    freeGear(G3_X, R_G3_TOP, 0xf59e0b),
    freeGear(G4_X, R_G4_TOP, 0xa855f7),
    freeGear(GR_X, R_GR_TOP, 0xef4444)
  ];

  const HUB_ENGAGE_OFFSET = 0.17;

  function addHub(xNeutral, xLeftGear, xRightGear) {
    const g = new THREE.Group(); g.position.set(xNeutral, 0, 0);
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.22,CYL_SEGS), gbMats.hub);
    body.rotation.z = Math.PI/2; g.add(body);
    for (const dx of [-0.12, 0.12]) {
      const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.185,0.185,0.04,CYL_SEGS), gbMats.hubT);
      ring.rotation.z = Math.PI/2; ring.position.x = dx; g.add(ring);
    }
    gbOutputGrp.add(g);
    const fork = new THREE.Group(); fork.position.set(xNeutral, SH_Y_TOP, 0);
    const fMat = gbMats.shaft;
    const p1 = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.18,0.04), fMat); p1.position.set(0,0.20, 0.20); fork.add(p1);
    const p2 = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.18,0.04), fMat); p2.position.set(0,0.20,-0.20); fork.add(p2);
    const cn = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.05,0.45), fMat); cn.position.set(0,0.29,0); fork.add(cn);
    gearboxGroup.add(fork);
    return {
      group: g, fork,
      xNeutral,
      xLeft:  xLeftGear  + HUB_ENGAGE_OFFSET,
      xRight: xRightGear - HUB_ENGAGE_OFFSET,
      curX: xNeutral
    };
  }
  const gbHub12 = addHub(HUB12_X, G1_X, G2_X);
  const gbHub34 = addHub(HUB34_X, G3_X, G4_X);
  const gbHubs = [gbHub12, gbHub34];

  [-0.10, 0.50].forEach(z => {
    const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,3.0,CYL_SEGS), gbMats.shaft);
    rail.rotation.z = Math.PI/2; rail.position.set(1.10, SH_Y_TOP+0.35, z); gearboxGroup.add(rail);
  });

  const idlerGrp = new THREE.Group(); idlerGrp.position.set(IDLER_X, IDLER_Y, IDLER_Z); gearboxGroup.add(idlerGrp);
  const idler = Base.makeCog(R_IDLER, 0.10, teethFor(R_IDLER), R_IDLER*0.15, R_IDLER*0.12, gbMats.idler, gbMats.idlerT);
  idler.rotation.z = Math.PI/2; idlerGrp.add(idler);
  const idlerShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.6,CYL_SEGS), gbMats.shaft);
  idlerShaft.rotation.x = Math.PI/2; idlerShaft.position.set(IDLER_X, IDLER_Y, -0.30); gearboxGroup.add(idlerShaft);

  const gbHousing = new THREE.Mesh(

  const extraGearboxes = (function () {

    /* ── Automatic (planetary) ── */
    function createAutomatic() {
      const group = new THREE.Group();

      /* Torque converter (input, left) */
      const tc = new THREE.Group();
      tc.position.set(-1.60, 0, 0);
      group.add(tc);

      const tcShell = new THREE.Mesh(
        new THREE.TorusGeometry(0.55, 0.20, 16, 40), exMat.tcShell);

      tc.add(tcShell);

      /* Impeller blades (engine side) */
      for (let i = 0; i < 14; i++) {
        const a = (i / 14) * Math.PI * 2;
        const blade = new THREE.Mesh(
          new THREE.BoxGeometry(0.06, 0.36, 0.09), exMat.tcImpeller);
        blade.position.set(-0.15, Math.cos(a) * 0.34, Math.sin(a) * 0.34);
        blade.rotation.x = a;
        tc.add(blade);
      }
      /* Turbine blades (output side) */
      for (let i = 0; i < 14; i++) {
        const a = (i / 14) * Math.PI * 2 + Math.PI / 14;
        const blade = new THREE.Mesh(
          new THREE.BoxGeometry(0.06, 0.36, 0.09), exMat.tcTurbine);
        blade.position.set(0.15, Math.cos(a) * 0.34, Math.sin(a) * 0.34);
        blade.rotation.x = a;
        tc.add(blade);
      }
      const tcHub = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12, 0.12, 0.10, 20), exMat.pulleyHub);
      tcHub.rotation.z = Math.PI / 2;
      tc.add(tcHub);

      /* Planetary gearset (right) */
      const planetary = new THREE.Group();
      planetary.position.set(1.20, 0, 0);
      group.add(planetary);

      /* Input shaft (from turbine) */
      const inputShaft = new THREE.Mesh(
        new THREE.CylinderGeometry(0.07, 0.07, 2.40, 20), exMat.planet);
      inputShaft.rotation.z = Math.PI / 2;
      inputShaft.position.x = -0.05;
      planetary.add(inputShaft);

      /* Sun gear (attached to input shaft) */
      const sun = Base.makeCog(0.20, 0.10, 18, 0.045, 0.045, exMat.sun, exMat.sun);
      sun.rotation.z = Math.PI / 2;
      sun.rotation.x = 0;
      planetary.add(sun);

      /* Planet carrier group */
      const carrier = new THREE.Group();
      planetary.add(carrier);
      const carrierDisc = new THREE.Mesh(
        new THREE.TorusGeometry(0.42, 0.05, 12, 36), exMat.carrier);
      carrierDisc.rotation.y = Math.PI / 2;
      carrier.add(carrierDisc);

      const planets = [];
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * Math.PI * 2 + Math.PI / 6;
        const pg = new THREE.Group();
        pg.position.set(0, Math.cos(a) * 0.42, Math.sin(a) * 0.42);
        carrier.add(pg);
        const planet = Base.makeCog(0.18, 0.08, 14, 0.04, 0.04, exMat.planet, exMat.planet);
        planet.rotation.z = Math.PI / 2;
        pg.add(planet);
        planets.push(planet);

        /* Carrier spoke */
        const spoke = new THREE.Mesh(
          new THREE.BoxGeometry(0.05, 0.42, 0.05), exMat.carrier);
        spoke.position.set(0, Math.cos(a) * 0.21, Math.sin(a) * 0.21);
        spoke.rotation.x = a;
        carrier.add(spoke);
      }

      /* Ring gear (internal teeth, outer) */
      const ringGrp = new THREE.Group();
      planetary.add(ringGrp);
      const ringOuter = new THREE.Mesh(
        new THREE.TorusGeometry(0.62, 0.06, 12, 48), exMat.ring);
      ringOuter.rotation.y = Math.PI / 2;
      ringGrp.add(ringOuter);
      for (let i = 0; i < 34; i++) {
        const a = (i / 34) * Math.PI * 2;
        const tooth = new THREE.Mesh(
          new THREE.BoxGeometry(0.05, 0.06, 0.05), exMat.ring);
        tooth.position.set(0, Math.cos(a) * 0.58, Math.sin(a) * 0.58);
        tooth.rotation.x = a;
        ringGrp.add(tooth);
      }

      /* Output shaft (from carrier) */
      const outputShaft = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08, 0.08, 1.20, 20), exMat.planet);
      outputShaft.rotation.z = Math.PI / 2;
      outputShaft.position.x = 1.00;
      group.add(outputShaft);

      /* Housing shell */
      const shell = new THREE.Mesh(
        new THREE.CylinderGeometry(0.95, 0.95, 4.4, 32, 1, true), exMat.housing);
      shell.rotation.z = Math.PI / 2;
      shell.position.x = 0.20;
      group.add(shell);

      let sunAng = 0, ringAng = 0, carrAng = 0, tcAng = 0;

      function step(dt, gear) {
        /* Ring ratio: 1st→0 (fixed), 4th→0.85 (near-locked), 2nd→0.2, 3rd→0.5, R→0.15 */
        const ringRatio = gear === 0 ? 1.0
                        : gear === 1 ? 0.00
                        : gear === 2 ? 0.22
                        : gear === 3 ? 0.50
                        : gear === 4 ? 0.85
                        : 0.15;
        const sunOmega = 1.0;
        const ringOmega = sunOmega * ringRatio;
        /* ω_carrier = (N_sun * ω_sun + N_ring * ω_ring) / (N_sun + N_ring) */
        const carrOmega = (18 * sunOmega + 34 * ringOmega) / (18 + 34);

        sunAng += dt * sunOmega * 2.0;
        ringAng += dt * ringOmega * 2.0;
        carrAng += dt * carrOmega * 2.0;
        tcAng += dt * sunOmega * 2.0;

        sun.rotation.x = sunAng;
        ringGrp.rotation.x = ringAng;
        carrier.rotation.x = carrAng;
        inputShaft.rotation.x = sunAng;
        tc.rotation.x = tcAng;
        outputShaft.rotation.x = carrAng;

        for (const p of planets) {
          p.rotation.x = -sunAng * (0.20 / 0.18);
        }
      }

      return {
        group, step,
        title: 'Automatic Transmission · Planetary Gearset',
        kicker: 'Transmission · Automatic',
        badge: { text: 'Planetary + Torque Converter', color: '#38bdf8' },
        desc: `<strong>Automatic transmission.</strong> A <strong>torque converter</strong> — a

               <strong>impeller</strong> (driven by the engine) throws fluid at the
               <strong>turbine</strong> (driven output), smoothly transferring torque and letting the
               engine idle in gear without stalling. Behind it, a <strong>planetary gearset</strong>
               provides the ratios. Holding the <em>ring gear</em> stationary and driving the
               <em>sun gear</em> gives a reduction. Releasing the ring or locking parts together
               changes the output ratio. A hydraulic valve body chooses which clutches and bands
               hold or release, shifting gears automatically without any input from the driver.`
      };

    /* ── Dual-clutch (DCT) ── */
    function createDCT() {
      const group = new THREE.Group();

      /* Two clutch packs side by side */
      function makeClutch(centerX, mat, label) {
        const pack = new THREE.Group();
        pack.position.set(centerX, 0, 0);
        group.add(pack);

        const outer = new THREE.Mesh(
          new THREE.CylinderGeometry(0.55, 0.55, 0.22, 32), mat);
        outer.rotation.z = Math.PI / 2;
        pack.add(outer);

        for (let i = 0; i < 5; i++) {
          const disc = new THREE.Mesh(
            new THREE.CylinderGeometry(0.48 - i * 0.02, 0.48 - i * 0.02, 0.03, 32),
            exMat.clutchDisc);
          disc.rotation.z = Math.PI / 2;
          disc.position.x = -0.08 + i * 0.04;
          pack.add(disc);
        }
        const hub = new THREE.Mesh(
          new THREE.CylinderGeometry(0.10, 0.10, 0.30, 20), exMat.pulleyHub);
        hub.rotation.z = Math.PI / 2;
        pack.add(hub);

        return { group: pack, outer };
      }

      const clutchA = makeClutch(-0.65, exMat.clutchA);
      const clutchB = makeClutch( 0.65, exMat.clutchB);

      /* Input shaft (thin, drives both clutch outer rings) */
      const inputShaft = new THREE.Mesh(
        new THREE.CylinderGeometry(0.05, 0.05, 1.80, 20), exMat.planet);
      inputShaft.rotation.z = Math.PI / 2;
      inputShaft.position.x = -1.70;
      group.add(inputShaft);

      /* Concentric output shafts — inner (odd) + outer (even) */
      const shaftOuter = new THREE.Mesh(
        new THREE.CylinderGeometry(0.15, 0.15, 2.00, 24), exMat.planet);
      shaftOuter.rotation.z = Math.PI / 2;
      shaftOuter.position.x = 1.85;
      group.add(shaftOuter);

      const shaftInner = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08, 0.08, 1.70, 20), exMat.carrier);
      shaftInner.rotation.z = Math.PI / 2;
      shaftInner.position.x = 1.75;
      group.add(shaftInner);

      /* Output gears (simplified) */
      const gearSetA = new THREE.Group();
      gearSetA.position.set(1.20, 0.35, 0);
      group.add(gearSetA);
      const gearA = Base.makeCog(0.22, 0.10, 18, 0.05, 0.05, exMat.clutchA, exMat.clutchA);
      gearA.rotation.z = Math.PI / 2;
      gearSetA.add(gearA);

      const gearSetB = new THREE.Group();
      gearSetB.position.set(1.20, -0.35, 0);
      group.add(gearSetB);
      const gearB = Base.makeCog(0.22, 0.10, 18, 0.05, 0.05, exMat.clutchB, exMat.clutchB);
      gearB.rotation.z = Math.PI / 2;
      gearSetB.add(gearB);

      /* Housing */
      const shell = new THREE.Mesh(
        new THREE.CylinderGeometry(0.85, 0.85, 3.6, 32, 1, true), exMat.housing);
      shell.rotation.z = Math.PI / 2;
      shell.position.x = 0.10;
      group.add(shell);

      let angA = 0, angB = 0, angIn = 0;

      function step(dt, gear) {
        /* Clutch A = odd gears (1, 3, R). Clutch B = even gears (2, 4). */
        const engageA = (gear === 1 || gear === 3 || gear === 5) ? 1 : 0;
        const engageB = (gear === 2 || gear === 4) ? 1 : 0;

        angIn += dt * 2.0;
        if (engageA) angA += dt * 2.0 * 0.35;
        if (engageB) angB += dt * 2.0 * 0.55;

        clutchA.group.rotation.x = angA;
        clutchB.group.rotation.x = angB;
        inputShaft.rotation.x = angIn;
        gearA.rotation.x = angA;
        gearB.rotation.x = angB;
        shaftInner.rotation.x = angA;
        shaftOuter.rotation.x = angB;

        /* Emissive pulse on the engaged clutch */
        exMat.clutchA.emissiveIntensity = 0.35 + (engageA ? 1.6 : 0);
        exMat.clutchB.emissiveIntensity = 0.35 + (engageB ? 1.6 : 0);
      }

      return {
        group, step,
        title: 'Dual-Clutch Transmission (DCT)',
        kicker: 'Transmission · Dual-Clutch',
        badge: { text: 'Twin-Clutch · Powershift', color: '#8b5cf6' },
        desc: `<strong>Dual-clutch transmission.</strong> Two separate clutches drive two
               concentric input shafts — an <strong>outer hollow shaft</strong> carrying the
               even gears, and an <strong>inner solid shaft</strong> running through it carrying
               the odd gears. While you're in 3rd, the gearbox has already preselected 4th on the
               other shaft: it engages that shaft's clutch the instant you shift. Because the next
               gear is already meshed, a DCT shifts in milliseconds — faster than any manual or
               torque-converter automatic, with none of the fluid losses of an automatic
               (efficiency close to a manual). Used in performance cars and many modern hot
               hatches.`
      };
    }

    /* ── CVT ── */
    function createCVT() {
      const group = new THREE.Group();

      function makePulley(cx) {
        const g = new THREE.Group();
        g.position.set(cx, 0, 0);
        group.add(g);

        /* Two opposing cones */
        const coneL = new THREE.Mesh(
          new THREE.ConeGeometry(0.45, 0.32, 32, 1, false), exMat.pulleyCone);
        coneL.rotation.z = Math.PI / 2;
        coneL.position.x = -0.20;
        g.add(coneL);

        const coneR = new THREE.Mesh(
          new THREE.ConeGeometry(0.45, 0.32, 32, 1, false), exMat.pulleyCone);
        coneR.rotation.z = -Math.PI / 2;
        coneR.position.x = 0.20;
        g.add(coneR);

        const hub = new THREE.Mesh(
          new THREE.CylinderGeometry(0.10, 0.10, 0.90, 20), exMat.pulleyHub);
        hub.rotation.z = Math.PI / 2;
        g.add(hub);

        return { group: g, coneL, coneR };
      }

      const primary   = makePulley(-1.05);
      const secondary = makePulley( 1.05);

      /* Belt — two strands (top and bottom) connecting the two pulleys */
      const beltGroup = new THREE.Group();
      group.add(beltGroup);

      const beltTop = new THREE.Mesh(
        new THREE.BoxGeometry(0.06, 0.05, 1), exMat.belt);
      beltTop.rotation.z = Math.PI / 2;
      beltGroup.add(beltTop);

      const beltBot = new THREE.Mesh(
        new THREE.BoxGeometry(0.06, 0.05, 1), exMat.belt);
      beltBot.rotation.z = Math.PI / 2;
      beltGroup.add(beltBot);

      /* Decorative belt links */
      const beltLinks = [];
      for (let i = 0; i < 14; i++) {
        const link = new THREE.Mesh(
          new THREE.BoxGeometry(0.02, 0.07, 0.05), exMat.beltLink);
        beltGroup.add(link);
        beltLinks.push(link);
      }

      /* Housing shell */
      const shell = new THREE.Mesh(
        new THREE.CylinderGeometry(0.75, 0.75, 3.0, 32, 1, true), exMat.housing);
      shell.rotation.z = Math.PI / 2;
      group.add(shell);

      let ang = 0;

      function step(dt, gear) {
        /* Gear 1 → low (primary small radius, secondary large)
           Gear 4 → high (primary large, secondary small)
           Neutral → middle */
        const t = gear === 0 ? 0.5
                : gear === 1 ? 0.15
                : gear === 2 ? 0.35
                : gear === 3 ? 0.65
                : gear === 4 ? 0.90
                : 0.20;

        /* Primary cones slide together for high ratio, apart for low */
        const primaryGap = 0.40 - t * 0.30;
        const secondaryGap = 0.10 + t * 0.30;

        primary.coneL.position.x = -0.10 - primaryGap / 2;
        primary.coneR.position.x =  0.10 + primaryGap / 2;
        secondary.coneL.position.x = -0.10 - secondaryGap / 2;
        secondary.coneR.position.x =  0.10 + secondaryGap / 2;

        /* Belt radius at each pulley */
        const rPrimary   = 0.16 + t * 0.24;
        const rSecondary = 0.16 + (1 - t) * 0.24;

        beltTop.position.set(0, rSecondary, 0);
        beltTop.scale.z = 1;
        beltTop.scale.y = (rSecondary + rPrimary) / 0.5;
        beltTop.geometry.computeBoundingBox?.();
        beltTop.position.y = (rPrimary + rSecondary) / 2;

        beltBot.position.y = -(rPrimary + rSecondary) / 2;
        beltBot.scale.y = (rSecondary + rPrimary) / 0.5;

        /* Update belt link positions */
        ang += dt * 2.0;
        beltLinks.forEach((link, i) => {
          const phase = (i / beltLinks.length + ang * 0.05) % 1;
          const x = -1.05 + phase * 2.10;
          const isTop = phase < 0.5;
          const r = isTop ? rPrimary : rSecondary;
          link.position.set(x, isTop ? r + 0.05 : -r - 0.05, 0);
          link.rotation.z = Math.PI / 2;
        });
      }

      return {
        group, step,
        title: 'Continuously Variable Transmission (CVT)',
        kicker: 'Transmission · CVT',
        badge: { text: 'Steel-Belt Variable', color: '#22c55e' },
        desc: `<strong>Continuously variable transmission.</strong> Instead of fixed gears, a
               CVT uses two <strong>variable-diameter pulleys</strong> connected by a
               <strong>steel belt</strong> or chain. Each pulley is made of two opposing cones
               that can slide together or apart: as the cones close, the belt is forced to ride
               further out, effectively <em>enlarging</em> that pulley's working diameter. The
               engine's pulley (primary) and the wheels' pulley (secondary) trade diameters
               continuously, so the ratio can be anything between its extremes — no discrete
               steps. That's why a CVT-equipped car holds a smooth constant RPM while accelerating
               instead of stepping through gears.`
      };
    }

    return {
      automatic: createAutomatic(),
      dct:       createDCT(),
      cvt:       createCVT()
    };
  })();

              <span class="tq-status" id="tq-status">SHIFT</span>
              <button class="tq-toggle" id="torque-toggle" aria-label="Toggle chart">−</button>
            </div>
            <canvas class="tq-canvas" id="torque-canvas"></canvas>
          </div>
        `,
        onMount: (el) => {
          /* Defer to the module-level wiring below */
          if (typeof window.__wireTorqueWidget === 'function') {
            window.__wireTorqueWidget(el);
          }
        }
      },

      br: {
        caption: 'Gear stick',
        html: `
          <div id="gear-shifter-overlay">
            <svg id="gear-shifter" viewBox="0 0 130 180" aria-label="Gear stick">
              <rect class="gs-bg" x="2" y="2" width="126" height="176" rx="20"/>
              <text class="gs-title" x="65" y="22" text-anchor="middle">GEAR STICK</text>
              <rect class="gs-groove" x="20" y="80" width="90" height="20" rx="10"/>
              <rect class="gs-groove" x="20" y="37" width="20" height="106" rx="10"/>
              <rect class="gs-groove" x="55" y="37" width="20" height="106" rx="10"/>
              <rect class="gs-groove" x="90" y="37" width="20" height="106" rx="10"/>
              <circle class="gs-gate" data-gate="1" cx="30"  cy="48"  r="3"/>
              <circle class="gs-gate" data-gate="N" cx="30"  cy="90"  r="3"/>
              <circle class="gs-gate" data-gate="2" cx="30"  cy="132" r="3"/>
              <circle class="gs-gate" data-gate="3" cx="65"  cy="48"  r="3"/>
              <circle class="gs-gate" data-gate="N" cx="65"  cy="90"  r="3"/>
              <circle class="gs-gate" data-gate="4" cx="65"  cy="132" r="3"/>
              <circle class="gs-gate" data-gate="R" cx="100" cy="48"  r="3"/>
              <circle class="gs-gate" data-gate="N" cx="100" cy="90"  r="3"/>
              <text class="gs-label" data-label="1" x="30"  y="36" text-anchor="middle">1</text>
              <text class="gs-label" data-label="2" x="30"  y="150" text-anchor="middle">2</text>
              <text class="gs-label" data-label="3" x="65"  y="36" text-anchor="middle">3</text>
              <text class="gs-label" data-label="4" x="65"  y="150" text-anchor="middle">4</text>
              <text class="gs-label" data-label="R" x="100" y="36" text-anchor="middle">R</text>
              <g id="gs-knob" transform="translate(65 90)">
                <circle class="gs-knob-shadow" cx="0" cy="3" r="14"/>
                <circle class="gs-knob" cx="0" cy="0" r="13"/>
                <circle class="gs-knob-hi" cx="0" cy="-4" r="8"/>
              </g>
            </svg>
            <div id="gear-shifter-label">Neutral · drag knob</div>
          </div>
        `,
        onMount: (el) => {
          if (typeof window.__wireShifterWidget === 'function') {
            window.__wireShifterWidget(el);
          }
        }
      }
    }
  });

  /* ═══════════════════════════════════════════════════════════
     CONFIG SWITCHER in toolbar extras
     ═══════════════════════════════════════════════════════════ */
  const CONFIG_ORDER  = ['manual', 'automatic', 'dct', 'cvt'];
  const CONFIG_LABELS = {
    manual:    'Manual',
    automatic: 'Automatic',
    dct:       'Dual-Clutch',
    cvt:       'CVT'
  };
  const MANUAL_INFO = {
    title:  'Manual Gearbox · Working Principle',
    kicker: 'Transmission',
    badge:  { text: 'Gearbox', color: '#22c55e' },
    desc:   `<strong>Gearbox.</strong> The input shaft drives the countershaft through a single gear pair.
             Fixed gears on the countershaft always spin at the same rate. Each output gear is free on
             the output shaft until its synchro hub locks it — the selected gear then forces the output
             shaft to turn at that gear's ratio. Reverse uses an extra idler gear to flip the output
             direction. Drag the knob through the H-pattern to select a gear.`
  };

  (function buildConfigSwitcher() {
    const extras = document.getElementById('toolbar-extras');
    if (!extras) return;
    const cfgGroup = document.createElement('div');
    cfgGroup.className = 'cfg-group';
    cfgGroup.setAttribute('role', 'group');
    cfgGroup.setAttribute('aria-label', 'Gearbox configuration');
    cfgGroup.innerHTML = `
      <button class="cfg-arrow" id="cfg-prev" type="button" aria-label="Previous gearbox">‹</button>
      <span id="cfg-label">Manual</span>
      <button class="cfg-arrow" id="cfg-next" type="button" aria-label="Next gearbox">›</button>
    `;
    extras.appendChild(cfgGroup);
  })();

  const cfgLabelEl = document.getElementById('cfg-label');
  const cfgPrevEl  = document.getElementById('cfg-prev');
  const cfgNextEl  = document.getElementById('cfg-next');

  /* Panel body refs (for readout labels that change per config) */
  const panelBody      = ui.panel.body;
  const elRpmIn        = panelBody ? panelBody.querySelector('#gb-rpm-in')       : null;
  const elRpmOut       = panelBody ? panelBody.querySelector('#gb-rpm-out')      : null;
  const elRatio        = panelBody ? panelBody.querySelector('#gb-ratio')        : null;
  const elCurrentGear  = panelBody ? panelBody.querySelector('#gb-current-gear') : null;

  const strokeDescEl  = document.getElementById('stroke-desc');
  const badgeEl       = document.getElementById('stroke-badge');
  const badgeTextEl   = document.getElementById('badge-text');
  const moduleTitleEl = document.getElementById('module-title');
  const moduleKickerEl= document.getElementById('module-kicker');

  let activeConfig = 'manual';

  function applyConfig(id) {
    activeConfig = id;

    /* Toggle 3D scenes */
    gearboxGroup.visible = (id === 'manual');
    Object.keys(extraGearboxes).forEach(k => {
      extraGearboxes[k].group.visible = (k === id);
    });

    /* Update switcher label */
    if (cfgLabelEl) cfgLabelEl.textContent = CONFIG_LABELS[id];

    /* Update panel chrome */
    const info = (id === 'manual') ? MANUAL_INFO : extraGearboxes[id];
    if (moduleTitleEl)  moduleTitleEl.textContent  = info.title;
    if (moduleKickerEl) moduleKickerEl.textContent = info.kicker || 'Transmission';
    if (strokeDescEl)   strokeDescEl.innerHTML     = info.desc;

    if (badgeTextEl) badgeTextEl.textContent = info.badge.text;
    if (badgeEl) {
      badgeEl.style.background = `color-mix(in oklch, ${info.badge.color} 18%, transparent)`;
      badgeEl.style.color = info.badge.color;
      const dot = badgeEl.querySelector('.dot');
      if (dot) dot.style.background = info.badge.color;
    }

    /* Reset gear */
    setGear(0);
    labels.hideAll();
  }

  function stepConfig(dir) {
    const i = CONFIG_ORDER.indexOf(activeConfig);
    const next = CONFIG_ORDER[(i + dir + CONFIG_ORDER.length) % CONFIG_ORDER.length];
    applyConfig(next);
  }

  if (cfgPrevEl) cfgPrevEl.addEventListener('click', () => stepConfig(-1));
  if (cfgNextEl) cfgNextEl.addEventListener('click', () => stepConfig(1));

  /* ═══════════════════════════════════════════════════════════
     KINEMATICS (manual gearbox)
     ═══════════════════════════════════════════════════════════ */
  let gbAngInput = 0, gbAngCounter = 0, gbAngOutput = 0, gbAngIdler = 0;
  const gbFreeAng = [0,0,0,0,0];
  let gbCurrentGear = 0;

  const GEAR_SPEED_RATIO = GEAR_RATIOS.map(r => 1 / r);

  function updateGearbox(dt) {
    const wIn = 2.0 * state.speedMul;
    const wCs = -wIn * MESH_IN_CS;
    gbAngInput   += dt * wIn;
    gbAngCounter += dt * wCs;

    for (let i = 0; i < 4; i++) gbFreeAng[i] += dt * (-wCs) * GB_RATIOS[i];
    gbFreeAng[4] += dt * (wCs) * GB_RATIOS[4];

    let wOut = 0;
    if (gbCurrentGear >= 1 && gbCurrentGear <= 4) wOut = -wCs * GB_RATIOS[gbCurrentGear-1];
    else if (gbCurrentGear === 5)                 wOut =  wCs * GB_RATIOS[4];
    gbAngOutput += dt * wOut;

    if (gbCurrentGear >= 1 && gbCurrentGear <= 5) gbFreeAng[gbCurrentGear-1] = gbAngOutput;

    gbInputGrp.rotation.x   = gbAngInput;
    gbCounterGrp.rotation.x = gbAngCounter;
    gbOutputGrp.rotation.x  = gbAngOutput;

    const fadeLerp = Math.min(1, dt * 5);

    for (let i = 0; i < 5; i++) {
      gbFree[i].group.rotation.x = (gbCurrentGear === i+1) ? gbAngOutput : gbFreeAng[i];
      const isActive = (gbCurrentGear === i+1);
      gbFree[i].ring.visible = isActive;
      gbFree[i].glow.visible = isActive;
      const targetOp = isActive ? 1.0 : 0.4;
      gbFree[i].matBody.opacity  += (targetOp - gbFree[i].matBody.opacity)  * fadeLerp;
      gbFree[i].matTooth.opacity += (targetOp - gbFree[i].matTooth.opacity) * fadeLerp;
    }

    const hub12Target = gbCurrentGear === 1 ? gbHub12.xLeft : gbCurrentGear === 2 ? gbHub12.xRight : gbHub12.xNeutral;
    const hub34Target = gbCurrentGear === 3 ? gbHub34.xLeft : gbCurrentGear === 4 ? gbHub34.xRight : gbHub34.xNeutral;
    gbHub12.curX += (hub12Target - gbHub12.curX) * fadeLerp;
    gbHub34.curX += (hub34Target - gbHub34.curX) * fadeLerp;
    gbHub12.group.position.x = gbHub12.curX; gbHub12.fork.position.x = gbHub12.curX;
    gbHub34.group.position.x = gbHub34.curX; gbHub34.fork.position.x = gbHub34.curX;

    gbAngIdler += dt * (-wCs) * (R_GR_BOT / R_IDLER);
    idlerGrp.rotation.x = gbAngIdler;

    syncReadout();
  }

  /* ═══════════════════════════════════════════════════════════
     READOUTS
     ═══════════════════════════════════════════════════════════ */
  const tqGearEl = document.getElementById('tq-gear');
  const tqRpmEl  = document.getElementById('tq-rpm');

  function syncReadout() {
    const rpmIn = Math.round(400 + state.speedMul * 900);
    let speedRatio = 0;
    let displayRatio = '—';
    if (gbCurrentGear >= 1 && gbCurrentGear <= 4) {
      speedRatio = GEAR_SPEED_RATIO[gbCurrentGear - 1];
      displayRatio = GEAR_RATIOS[gbCurrentGear - 1].toFixed(2) + ':1';
    } else if (gbCurrentGear === 5) {
      speedRatio = GEAR_SPEED_RATIO[4];
      displayRatio = GEAR_RATIOS[4].toFixed(2) + ':1';
    }
    const rpmOut = Math.round(speedRatio * rpmIn);

    if (elRpmIn)  elRpmIn.textContent  = rpmIn;
    if (elRpmOut) elRpmOut.textContent = rpmOut;
    if (elRatio)  elRatio.textContent  = displayRatio;
    if (elCurrentGear) elCurrentGear.textContent = GEAR_NAMES[gbCurrentGear];

    if (tqGearEl) {
      tqGearEl.textContent = GEAR_NAMES[gbCurrentGear];
      const activeColors = ['#22c55e', '#38bdf8', '#22c55e', '#f59e0b', '#a855f7', '#ef4444'];
      tqGearEl.style.color = activeColors[gbCurrentGear] || '#22c55e';
    }
    if (tqRpmEl) tqRpmEl.textContent = rpmIn + ' → ' + rpmOut + ' rpm';

    /* Chip */
    ui.chip.setBig(GEAR_SHORT[gbCurrentGear], '');
    ui.chip.setColor(
      ['#22c55e', '#38bdf8', '#22c55e', '#f59e0b', '#a855f7', '#ef4444'][gbCurrentGear] || '#22c55e'
    );
    ui.chip.set('in',  rpmIn  + ' rpm');
    ui.chip.set('out', rpmOut + ' rpm');
    ui.chip.setStatus(GEAR_NAMES[gbCurrentGear], gbCurrentGear !== 0);
  }

  /* ═══════════════════════════════════════════════════════════
     TORQUE VISUALIZER
     ═══════════════════════════════════════════════════════════ */
  const tqPanel  = document.getElementById('torque-panel');
  const tqCanvas = document.getElementById('torque-canvas');
  const tqCtx    = tqCanvas ? tqCanvas.getContext('2d') : null;
  const tqToggle = document.getElementById('torque-toggle');
  const tqStatus = document.getElementById('tq-status');
  let tqW = 0, tqH = 0;

  function resizeTorqueCanvas() {
    if (!tqCanvas || !tqCtx) return;
    const dpr = Math.min(window.devicePixelRatio || 1, isLowEnd ? 1.5 : 2);
    const rect = tqCanvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    tqW = rect.width; tqH = rect.height;
    tqCanvas.width  = Math.round(rect.width  * dpr);
    tqCanvas.height = Math.round(rect.height * dpr);
    tqCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  if (tqCanvas && window.ResizeObserver) new ResizeObserver(resizeTorqueCanvas).observe(tqCanvas);
  else window.addEventListener('resize', resizeTorqueCanvas);
  resizeTorqueCanvas();

  if (tqToggle) {
    tqToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const collapsed = tqPanel.classList.toggle('collapsed');
      tqToggle.textContent = collapsed ? '+' : '−';
      if (!collapsed) requestAnimationFrame(resizeTorqueCanvas);
    });
  }

  const ENGINE_MIN_RPM   = 800;
  const ENGINE_MAX_RPM   = 6500;
  const TORQUE_PEAK      = 200;
  const TORQUE_PEAK_RPM  = 3500;

  function engineTorque(rpm) {
    const n = Math.max(ENGINE_MIN_RPM, Math.min(ENGINE_MAX_RPM, rpm));
    const x = (n - TORQUE_PEAK_RPM) / 3200;
    return Math.max(60, TORQUE_PEAK * (1 - 0.55 * x * x));
  }

  const GEAR_TOTAL = [
    null,
    GEAR_SPEED_RATIO[0],
    GEAR_SPEED_RATIO[1],
    GEAR_SPEED_RATIO[2],
    GEAR_SPEED_RATIO[3],
    GEAR_SPEED_RATIO[4]
  ];

  const GEAR_COLORS = [null, '#38bdf8', '#22c55e', '#f59e0b', '#a855f7', '#ef4444'];

  const gearCurves = GEAR_TOTAL.map((ratio) => {
    if (!ratio) return null;
    const pts = [];
    for (let rpm = ENGINE_MIN_RPM; rpm <= ENGINE_MAX_RPM; rpm += 100) {
      pts.push([ rpm * ratio, engineTorque(rpm) / ratio ]);
    }
    return pts;
  });

  let MAX_X = 1, MAX_Y = 1;
  gearCurves.forEach(c => {
    if (!c) return;
    c.forEach(([x, y]) => {
      if (x > MAX_X) MAX_X = x;
      if (y > MAX_Y) MAX_Y = y;
    });
  });
  MAX_X *= 1.06;
  MAX_Y *= 1.10;

  let shiftAnim = null;
  const SHIFT_DURATION = 0.55;
  let displayPoint = [0, 0];
  let displayDip   = 0;

  function currentOperatingPoint(gear) {
    if (!gear) return null;
    const ratio = GEAR_TOTAL[gear];
    const inRpm = 400 + state.speedMul * 900;
    return [ inRpm * ratio, engineTorque(inRpm) / ratio ];
  }

  function smoothstep(t) { return t * t * (3 - 2 * t); }

  function updateVisualizer(dt) {
    if (shiftAnim) {
      shiftAnim.t += dt;
      if (shiftAnim.t >= SHIFT_DURATION) shiftAnim = null;
    }

    const inRpm = 400 + state.speedMul * 900;
    const target = currentOperatingPoint(gbCurrentGear);

    if (shiftAnim) {
      const u = Math.min(1, shiftAnim.t / SHIFT_DURATION);
      const e = smoothstep(u);
      const pA = currentOperatingPoint(shiftAnim.from) || [0, 0];
      const pB = currentOperatingPoint(shiftAnim.to)   || [0, 0];
      displayDip = Math.sin(u * Math.PI);
      const torqueScale = 1 - 0.95 * displayDip;
      displayPoint = [
        pA[0] + (pB[0] - pA[0]) * e,
        (pA[1] + (pB[1] - pA[1]) * e) * torqueScale
      ];
      if (tqStatus) tqStatus.classList.add('on');
      if (tqGearEl) tqGearEl.classList.add('shifting');
    } else {
      displayDip = 0;
      displayPoint = target || [ inRpm * 0.15, 0 ];
      if (tqStatus) tqStatus.classList.remove('on');
      if (tqGearEl) tqGearEl.classList.remove('shifting');
    }
  }

  function drawTorqueChart() {
    if (!tqW || !tqH || !tqCtx) return;
    const ctx = tqCtx;
    const padL = 32, padR = 8, padT = 10, padB = 20;
    const plotW = tqW - padL - padR;
    const plotH = tqH - padT - padB;
    if (plotW <= 0 || plotH <= 0) return;

    const isLight = document.body.classList.contains('light-theme') ||
                    document.documentElement.classList.contains('light-theme');
    const axisColor  = isLight ? 'rgba(15,23,42,.35)' : 'rgba(255,255,255,.55)';
    const gridColor  = isLight ? 'rgba(15,23,42,.08)' : 'rgba(255,255,255,.06)';
    const bgFill     = isLight ? 'rgba(15,23,42,.02)' : 'rgba(255,255,255,0.015)';
    const frameColor = isLight ? 'rgba(15,23,42,.25)' : 'rgba(255,255,255,0.18)';

    const X = (v) => padL + (v / MAX_X) * plotW;
    const Y = (v) => padT + plotH - (v / MAX_Y) * plotH;

    ctx.clearRect(0, 0, tqW, tqH);
    ctx.fillStyle = bgFill;
    ctx.fillRect(padL, padT, plotW, plotH);

    ctx.strokeStyle = gridColor;
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = padT + (plotH * i / 4);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
      const x = padL + (plotW * i / 4);
      ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + plotH); ctx.stroke();
    }

    ctx.strokeStyle = frameColor;
    ctx.beginPath();
    ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + plotH); ctx.lineTo(padL + plotW, padT + plotH);
    ctx.stroke();

    ctx.fillStyle = axisColor;
    ctx.font = '8px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(Math.round(MAX_Y) + '', padL - 3, padT + 4);
    ctx.fillText('0', padL - 3, padT + plotH);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('Output speed (rpm)', padL + plotW/2, padT + plotH + 3);

    gearCurves.forEach((c, i) => {
      if (!c) return;
      const active = (gbCurrentGear === i);
      ctx.strokeStyle = GEAR_COLORS[i];
      ctx.lineWidth = active ? 2.4 : 1.3;
      ctx.globalAlpha = active ? 1 : 0.32;
      ctx.beginPath();
      c.forEach(([x, y], j) => {
        const px = X(x), py = Y(y);
        if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      });
      ctx.stroke();

      const last = c[c.length - 1];
      ctx.globalAlpha = active ? 1 : 0.55;
      ctx.fillStyle = GEAR_COLORS[i];
      ctx.font = (active ? 'bold ' : '') + '8px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(GEAR_SHORT[i], X(last[0]), Y(last[1]) - 2);
    });
    ctx.globalAlpha = 1;

    if (displayPoint[0] > 0 || displayPoint[1] > 0) {
      const px = X(Math.min(displayPoint[0], MAX_X));
      const py = Y(Math.min(displayPoint[1], MAX_Y));

      const g = ctx.createRadialGradient(px, py, 0, px, py, 14);
      g.addColorStop(0, 'rgba(255,255,255,0.35)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(px, py, 14, 0, Math.PI * 2); ctx.fill();

      if (shiftAnim) {
        const u = Math.min(1, shiftAnim.t / SHIFT_DURATION);
        const pulse = 1 + 0.9 * Math.sin(u * Math.PI);
        ctx.beginPath();
        ctx.arc(px, py, 6 * pulse, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 * (1 - u)) + ')';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(px, py, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = gbCurrentGear > 0 ? GEAR_COLORS[gbCurrentGear] : '#94a3b8';
      ctx.stroke();
    }
  }

  /* ═══════════════════════════════════════════════════════════
     H-PATTERN GEAR SHIFTER
     ═══════════════════════════════════════════════════════════ */
  const shifterEl       = document.getElementById('gear-shifter');
  const knobEl          = document.getElementById('gs-knob');
  const shifterLabelEl  = document.getElementById('gear-shifter-label');

  const CH_XS = [30, 65, 100];
  const Y_TOP = 48;
  const Y_NEU = 90;
  const Y_BOT = 132;
  const NEUTRAL_BAND = 18;

  const GATES = [
    { x: CH_XS[0], y: Y_TOP, gear: 1, name: '1st' },
    { x: CH_XS[0], y: Y_NEU, gear: 0, name: 'Neutral' },
    { x: CH_XS[0], y: Y_BOT, gear: 2, name: '2nd' },
    { x: CH_XS[1], y: Y_TOP, gear: 3, name: '3rd' },
    { x: CH_XS[1], y: Y_NEU, gear: 0, name: 'Neutral' },
    { x: CH_XS[1], y: Y_BOT, gear: 4, name: '4th' },
    { x: CH_XS[2], y: Y_TOP, gear: 5, name: 'Reverse' },
    { x: CH_XS[2], y: Y_NEU, gear: 0, name: 'Neutral' }
  ];

  let shifterPos = { x: CH_XS[1], y: Y_NEU };
  let shifterDragging = false;
  let shifterPointerId = null;
  let shifterGrabOffset = { x: 0, y: 0 };
  let shifterReturnRAF = 0;

  function shifterApplyTransform(animate = true) {
    if (!knobEl) return;
    if (!animate) {
      const prev = knobEl.style.transition;
      knobEl.style.transition = 'none';
      knobEl.setAttribute('transform', `translate(${shifterPos.x.toFixed(2)} ${shifterPos.y.toFixed(2)})`);
      requestAnimationFrame(() => { knobEl.style.transition = prev || ''; });
    } else {
      knobEl.setAttribute('transform', `translate(${shifterPos.x.toFixed(2)} ${shifterPos.y.toFixed(2)})`);
    }
  }

  function clientToSvg(clientX, clientY) {
    const rect = shifterEl.getBoundingClientRect();
    const sx = 130 / rect.width;
    const sy = 180 / rect.height;
    return {
      x: (clientX - rect.left) * sx,
      y: (clientY - rect.top) * sy
    };
  }

  function constrainToGrooves(x, y) {
    let nearestChX = CH_XS[0];
    let bestDist = Math.abs(x - CH_XS[0]);
    for (const cx of CH_XS) {
      const d = Math.abs(x - cx);
      if (d < bestDist) { bestDist = d; nearestChX = cx; }
    }
    if (Math.abs(y - Y_NEU) <= NEUTRAL_BAND) {
      const clampedX = Math.max(CH_XS[0], Math.min(CH_XS[CH_XS.length - 1], x));
      return { x: clampedX, y: Y_NEU };
    }
    const maxY = (nearestChX === CH_XS[2]) ? Y_NEU : Y_BOT;   /* R column has no lower gate */
    const clampedY = Math.max(Y_TOP, Math.min(maxY, y));
    return { x: nearestChX, y: clampedY };
  }

  function snapToNearestGate() {
    let bestGate = GATES[0];
    let bestDist = Math.hypot(shifterPos.x - GATES[0].x, shifterPos.y - GATES[0].y);
    for (let i = 1; i < GATES.length; i++) {
      const g = GATES[i];
      const d = Math.hypot(shifterPos.x - g.x, shifterPos.y - g.y);
      if (d < bestDist) { bestDist = d; bestGate = g; }
    }
    shifterPos.x = bestGate.x;
    shifterPos.y = bestGate.y;
    shifterApplyTransform(true);

    if (bestGate.gear !== gbCurrentGear) setGear(bestGate.gear);

    if (shifterLabelEl) {
      shifterLabelEl.textContent = bestGate.name + ' · drag knob';
      shifterLabelEl.classList.toggle('active', bestGate.gear !== 0);
    }
  }

  function updateGateHighlights() {
    document.querySelectorAll('.gs-gate').forEach(el => {
      const g = parseInt(el.dataset.gate, 10);
      const isN = el.dataset.gate === 'N';
      const match = (isN && gbCurrentGear === 0) ||
                    (!isN && g === gbCurrentGear) ||
                    (el.dataset.gate === 'R' && gbCurrentGear === 5);
      el.classList.toggle('active', match);
    });
    document.querySelectorAll('.gs-label').forEach(el => {
      const lbl = el.dataset.label;
      const match =
        (lbl === '1' && gbCurrentGear === 1) ||
        (lbl === '2' && gbCurrentGear === 2) ||
        (lbl === '3' && gbCurrentGear === 3) ||
        (lbl === '4' && gbCurrentGear === 4) ||
        (lbl === 'R' && gbCurrentGear === 5);
      el.classList.toggle('active', match);
    });
  }

  function shifterSyncFromGear(n) {
    let gate;
    switch (n) {
      case 1: gate = { x: CH_XS[0], y: Y_TOP }; break;
      case 2: gate = { x: CH_XS[0], y: Y_BOT }; break;
      case 3: gate = { x: CH_XS[1], y: Y_TOP }; break;
      case 4: gate = { x: CH_XS[1], y: Y_BOT }; break;
      case 5: gate = { x: CH_XS[2], y: Y_TOP }; break;
      default: gate = { x: CH_XS[1], y: Y_NEU }; break;
    }
    shifterPos.x = gate.x;
    shifterPos.y = gate.y;
    if (!shifterDragging) shifterApplyTransform(true);
    updateGateHighlights();

    if (shifterLabelEl) {
      const name = GEAR_NAMES[n] || 'Neutral';
      shifterLabelEl.textContent = name + ' · drag knob';
      shifterLabelEl.classList.toggle('active', n !== 0);
    }
  }

  /* Widget wiring callbacks (deferred from UI.create onMount) */
  window.__wireTorqueWidget = function(el) {
    /* Torque panel is already wired — nothing more needed here */
  };
  window.__wireShifterWidget = function(el) {
    if (!shifterEl) return;

    shifterEl.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      cancelAnimationFrame(shifterReturnRAF);
      shifterDragging = true;
      shifterPointerId = e.pointerId;
      try { shifterEl.setPointerCapture(e.pointerId); } catch (_) {}
      shifterEl.classList.add('grabbing');
      if (shifterLabelEl) shifterLabelEl.classList.add('active');

      const p = clientToSvg(e.clientX, e.clientY);
      const dx = p.x - shifterPos.x;
      const dy = p.y - shifterPos.y;
      if (Math.hypot(dx, dy) < 26) {
        shifterGrabOffset.x = dx;
        shifterGrabOffset.y = dy;
      } else {
        shifterGrabOffset.x = 0;
        shifterGrabOffset.y = 0;
      }
    });

    shifterEl.addEventListener('pointermove', (e) => {
      if (!shifterDragging || e.pointerId !== shifterPointerId) return;
      e.preventDefault();
      const p = clientToSvg(e.clientX, e.clientY);
      const targetX = p.x - shifterGrabOffset.x;
      const targetY = p.y - shifterGrabOffset.y;
      const c = constrainToGrooves(targetX, targetY);
      shifterPos.x = c.x;
      shifterPos.y = c.y;
      shifterApplyTransform(false);
    });

    function endShifterDrag() {
      if (!shifterDragging) return;
      shifterDragging = false;
      shifterPointerId = null;
      shifterEl.classList.remove('grabbing');
      if (shifterLabelEl) shifterLabelEl.classList.remove('active');
      snapToNearestGate();
    }
    shifterEl.addEventListener('pointerup', endShifterDrag);
    shifterEl.addEventListener('pointercancel', endShifterDrag);
    shifterEl.addEventListener('lostpointercapture', endShifterDrag);

    shifterEl.tabIndex = 0;
    shifterEl.addEventListener('keydown', (e) => {
      let handled = true;
      switch (gbCurrentGear) {
        case 0:
          if (e.key === 'ArrowUp')   { setGear(1); }
          else if (e.key === 'ArrowDown') { setGear(2); }
          else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { handled = false; }
          else handled = false;
          break;
        default:
          if (e.key === 'Escape' || e.key === 'Home' || e.key === 'n' || e.key === 'N') { setGear(0); }
          else if (e.key === 'ArrowUp' && (gbCurrentGear === 2 || gbCurrentGear === 4)) { setGear(0); }
          else if (e.key === 'ArrowDown' && (gbCurrentGear === 1 || gbCurrentGear === 3 || gbCurrentGear === 5)) { setGear(0); }
          else handled = false;
      }
      if (handled) e.preventDefault();
    });
  };

  /* ═══════════════════════════════════════════════════════════
     GEAR SELECTION
     ═══════════════════════════════════════════════════════════ */
  function setGear(n) {
    if (n !== gbCurrentGear) {
      shiftAnim = { from: gbCurrentGear, to: n, t: 0 };
    }
    gbCurrentGear = n;

    for (let i = 0; i < 5; i++) {
      const active = (n === i+1);
      gbFree[i].ring.visible = active;
      gbFree[i].ring.material.color.setHex(
        [null, 0x38bdf8, 0x22c55e, 0xf59e0b, 0xa855f7, 0xef4444][i+1] || 0x38bdf8
      );
      gbFree[i].glow.visible = active;
    }

    syncReadout();
    shifterSyncFromGear(n);
    if (bridge) bridge.setStatus(GEAR_NAMES[n], n === 0 ? '#22c55e' : '#38bdf8');
  }

  /* ═══════════════════════════════════════════════════════════
     BRIDGE
     ═══════════════════════════════════════════════════════════ */
  const bridge = ui.wireBridge({
    viewManager,
    state,
    onCommand: (d) => {
      switch (d.action) {
        case 'reset':  setGear(0); break;
        case 'setGear': { const n = +d.value; if (n >= 0 && n <= 5) { if (activeConfig !== 'manual') applyConfig('manual'); setGear(n); } break; }
        case 'setConfig': if (CONFIG_ORDER.indexOf(d.value) >= 0) applyConfig(d.value); break;
      }
    }
  });
  bridge.ready();
  bridge.setStatus('Neutral', '#22c55e');

  /* Initialize */
  applyConfig('manual');

  /* ═══════════════════════════════════════════════════════════
     ANIMATION LOOP
     ═══════════════════════════════════════════════════════════ */
  const clock = new THREE.Clock();
  let frame = 0;

  function animate() {
    requestAnimationFrame(animate);
    frame++;
    const dt = Math.min(clock.getDelta(), 0.05);

    if (state.playing) {
      if (activeConfig === 'manual') {
        updateGearbox(dt);
      } else {
        const ex = extraGearboxes[activeConfig];
        if (ex && ex.step) ex.step(dt * state.speedMul, gbCurrentGear);
      }
    }

    updateVisualizer(dt);
    drawTorqueChart();

    if (state.showLabels && frame % 2 === 0) {
      if (activeConfig === 'manual') {
        labelDefs.forEach(d => labels.project(d.id, d.pos, camera, wrap));
      } else {
        labels.hideAll();
      }
    } else if (!state.showLabels) {
      labels.hideAll();
    }

    /* Glow pulse on active gear */
    const pulse = 0.35 + 0.25 * Math.sin(performance.now() * 0.005);
    for (let i = 0; i < 5; i++) {
      if (gbFree[i].glow.visible) gbFree[i].glow.material.opacity = pulse;
    }

    controls.update();
    renderer.render(scene, camera);
  }

  syncReadout();
  shifterApplyTransform(false);
  updateGateHighlights();
  setGear(0);
  /* onMount fires inside UI.create(), before __wireShifterWidget exists — wire it now. */
  if (!shifterEl.__wired) { shifterEl.__wired = true; window.__wireShifterWidget(shifterEl); }
  animate();
  </script>
</body>
</html>
