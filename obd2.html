<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OBD-II · Auto Lab</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="controls.css">
<link rel="stylesheet" href="components.css">
<style>
:root { --al-accent: #22d3ee; }
html.light-theme { --al-accent: #0891b2; }
.al-pins{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font:500 11px/1.5 var(--font-mono);}
.al-pins .p{color:var(--al-accent);font-weight:700;}
.al-pins .d{color:var(--text-dim);}
.ui-tb-btn.active{outline:2px solid var(--al-accent);color:var(--al-accent);}

#st{position:fixed;left:12px;top:64px;z-index:40;width:min(350px,calc(100vw - 24px));max-height:calc(100% - 150px);overflow:auto;font:12px/1.45 var(--font-ui,system-ui,sans-serif);color:var(--text,#e6ebf5);background:color-mix(in oklch,var(--bg,#0a0d13) 84%,transparent);border:1px solid color-mix(in oklch,var(--text,#fff) 14%,transparent);border-radius:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#st.min{width:auto;overflow:visible}#st.min #st-body{display:none}
#st-head{display:flex;gap:8px;align-items:center;width:100%;padding:9px 12px;background:none;border:0;color:inherit;font:700 11px var(--font-ui,sans-serif);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
#st-head .dot{width:9px;height:9px;border-radius:50%;background:#6b7280}
#st-body{padding:0 12px 12px}
.st-tabs{display:flex;gap:4px;margin-bottom:8px}.st-tabs button,.st-btn{flex:1;min-height:34px;padding:6px;border-radius:8px;font:inherit;font-weight:700;color:inherit;cursor:pointer;background:color-mix(in oklch,var(--text,#fff) 7%,transparent);border:1px solid color-mix(in oklch,var(--text,#fff) 14%,transparent)}
.st-tabs button{font-size:10px;padding:6px 1px;min-width:0}.st-tabs button[aria-pressed=true]{border-color:var(--al-accent);color:var(--al-accent)}
.st-btn.go{border-color:#22c55e;background:color-mix(in oklch,#22c55e 20%,transparent);margin-top:6px;width:100%}
.st-msg{padding:12px;border-radius:8px;background:color-mix(in oklch,var(--text,#fff) 6%,transparent)}
.st-dtc{border-left:3px solid #f59e0b;padding:6px 8px;margin:6px 0;background:color-mix(in oklch,var(--text,#fff) 5%,transparent);border-radius:0 8px 8px 0}
.st-dtc b.c{font:800 15px var(--font-mono,monospace)}.st-dtc ol{margin:4px 0 0 16px;padding:0}.st-dtc .tag{float:right;font-size:10px;font-weight:800;text-transform:uppercase;color:#f59e0b}
.st-r{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:3px 0;font-family:var(--font-mono,monospace)}
.st-r .bar{grid-column:1/3;height:3px;border-radius:2px;background:#22d3ee33}.st-r .bar i{display:block;height:100%;background:#22d3ee;border-radius:2px}
.st-r.bad b{color:#f87171}.st-r.bad .bar i{background:#f87171}
#st-toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:60;padding:8px 16px;border-radius:8px;font:800 12px var(--font-mono,monospace);letter-spacing:.08em;background:#000b;pointer-events:none;opacity:0;transition:opacity .25s}
#st-toast.on{opacity:1}
@media (max-width:700px){#st{top:56px}}
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<div id="labels-root"></div>
<div id="st" class="min"><button id="st-head" aria-expanded="false"><span class="dot"></span>Scan Tool <span id="st-state" style="opacity:.7;margin-left:auto">not connected</span></button><div id="st-body"></div></div><div id="st-toast"></div>

<script src="guard.js"></script>
  <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as Base from './kit.js';
import { Widgets } from './components.js';

/* ═══════════════════════════════════════════════════════════════════════
   CONFIG
   ═══════════════════════════════════════════════════════════════════════ */
const CFG = {
  moduleId: 'obd2',
  accent:   '#22d3ee',
  busHz:    0.55          // CAN message cycles per second at speedMul = 1
};

const DTCS = [{ code: '—', name: 'No codes stored', sys: '—', mil: false }];   /* [0] mirrors the primary code of the simulation */

const state = Base.createUIState();
state.dtcIndex = 0;

/* ═══════════════════════════════════════════════════════════════════════
   SCENE
   ═══════════════════════════════════════════════════════════════════════ */
const built = Base.buildScene({
  fov: 42,
  camPos: [4.6, 3.8, 7.6],
  target: [0, 0.60, 0],
  floorY: -1.5,
  fogDensity: 0.030
});
const { scene, camera, renderer, controls, wrap, viewManager, quality } = built;
Base.attachResize(camera, renderer, wrap, built.baseFov);

const lowEnd = quality.isLowEnd;

/* ═══════════════════════════════════════════════════════════════════════
   MATERIALS
   ═══════════════════════════════════════════════════════════════════════ */
const M = Base.createMaterials();
const root = new THREE.Group();
scene.add(root);

const shellMat = new THREE.MeshStandardMaterial({ color: 0x2a3038, roughness: 0.62, metalness: 0.35 });
const pinGrey  = new THREE.MeshStandardMaterial({ color: 0x6b7280, roughness: 0.42, metalness: 0.70 });
const pinGnd   = new THREE.MeshStandardMaterial({ color: 0x9aa3b2, roughness: 0.42, metalness: 0.70 });
const pinCanH  = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.35, metalness: 0.60 });
const pinCanL  = new THREE.MeshStandardMaterial({ color: 0xffb020, roughness: 0.35, metalness: 0.60 });
const pinBat   = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.35, metalness: 0.60 });
const cableMat = new THREE.MeshStandardMaterial({ color: 0x232a33, roughness: 0.80, metalness: 0.10 });

/* --- helper: smooth tube through points --- */
function cable(points, r, mat) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0], p[1], p[2])));
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, lowEnd ? 16 : 28, r, lowEnd ? 6 : 8, false), mat);
  root.add(mesh);
  return mesh;
}

/* ═══════════════════════════════════════════════════════════════════════
   GEOMETRY — ECU (left) · DLC connector (centre) · scan tool (right)
   ═══════════════════════════════════════════════════════════════════════ */

/* --- vehicle ECU --- */
const ecuBox = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.55, 1.1), M.matMetalDark);
ecuBox.position.set(-3.1, 0.34, 0);
ecuBox.castShadow = true;
ecuBox.receiveShadow = true;
root.add(ecuBox);

/* --- harness ECU → DLC --- */
const harnessPts = [
  [-2.35, 0.42, 0.10],
  [-1.70, 0.48, -0.45],
  [-0.80, 0.52, -0.58],
  [-0.05, 0.55, -0.28]
];
cable(harnessPts, 0.055, cableMat);

/* --- DLC connector shell (J1962) --- */
const dlcGroup = new THREE.Group();
dlcGroup.position.set(0, 0.55, 0);
root.add(dlcGroup);

const shell = new THREE.Mesh(new THREE.BoxGeometry(1.00, 0.36, 0.46), shellMat);
shell.castShadow = true;
dlcGroup.add(shell);

const keyRim = new THREE.Mesh(new THREE.BoxGeometry(0.88, 0.30, 0.06), shellMat);
keyRim.position.z = 0.25;
dlcGroup.add(keyRim);

/* --- 16 pins, colour-coded by function --- */
const PIN_META = {
  4:  { mat: pinGnd,  r: 0.034, label: 'Chassis ground' },
  5:  { mat: pinGnd,  r: 0.034, label: 'Signal ground' },
  6:  { mat: pinCanH, r: 0.040, label: 'CAN-H' },
  14: { mat: pinCanL, r: 0.040, label: 'CAN-L' },
  16: { mat: pinBat,  r: 0.038, label: 'Battery +12 V' }
};

const pinGeoCache = {};
function pinGeo(r) {
  const k = r.toFixed(3);
  if (!pinGeoCache[k]) pinGeoCache[k] = new THREE.CylinderGeometry(r, r, 0.20, lowEnd ? 6 : 10);
  return pinGeoCache[k];
}

const pinPositions = {};
for (let i = 0; i < 16; i++) {
  const num = i + 1;
  const col = i % 8;
  const row = i < 8 ? 0 : 1;
  const x = -0.35 + col * 0.10;
  const y = row === 0 ? 0.085 : -0.085;
  const meta = PIN_META[num];
  const mat = meta ? meta.mat : pinGrey;
  const r = meta ? meta.r : 0.028;

  const pin = new THREE.Mesh(pinGeo(r), mat);
  pin.rotation.x = Math.PI / 2;
  pin.position.set(x, y, 0.34);
  dlcGroup.add(pin);

  pinPositions[num] = new THREE.Vector3(x, 0.55 + y, 0.34);
}

/* --- scan tool --- */
const toolGroup = new THREE.Group();
toolGroup.position.set(3.0, 0.95, 0);
toolGroup.rotation.y = -0.30;
root.add(toolGroup);

const toolBody = new THREE.Mesh(new THREE.BoxGeometry(1.20, 0.86, 0.32), M.matMetalDark);
toolBody.castShadow = true;
toolGroup.add(toolBody);

/* screen with live canvas texture */
const scCanvas = document.createElement('canvas');
scCanvas.width = 256;
scCanvas.height = 160;
const sctx = scCanvas.getContext('2d');
const scTex = new THREE.CanvasTexture(scCanvas);
scTex.colorSpace = THREE.SRGBColorSpace;

const screenMat = new THREE.MeshBasicMaterial({ map: scTex });
const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.92, 0.58), screenMat);
screen.position.set(0, 0.10, 0.17);
toolGroup.add(screen);

/* buttons */
const btnMat = new THREE.MeshStandardMaterial({ color: 0x3d4555, roughness: 0.55, metalness: 0.30 });
[-0.34, 0, 0.34].forEach(x => {
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.05, lowEnd ? 8 : 14), btnMat);
  b.rotation.x = Math.PI / 2;
  b.position.set(x, -0.30, 0.17);
  toolGroup.add(b);
});

/* MIL lamp on the tool */
const milMat = new THREE.MeshBasicMaterial({ color: 0x4a3a10 });
const milLamp = new THREE.Mesh(new THREE.SphereGeometry(0.055, lowEnd ? 8 : 12, lowEnd ? 6 : 8), milMat);
milLamp.position.set(0.50, 0.32, 0.18);
toolGroup.add(milLamp);

/* --- cable DLC → scan tool --- */
/* DLC → tool cable is rebuilt dynamically by the plug simulation */

/* ═══════════════════════════════════════════════════════════════════════
   SIGNAL PARTICLES (CAN traffic)
   ═══════════════════════════════════════════════════════════════════════ */
const lines = [];
const pGeo = new THREE.SphereGeometry(0.045, lowEnd ? 6 : 10, lowEnd ? 5 : 8);

function makeLink(a, b, colour) {
  const parts = [];
  const n = lowEnd ? 2 : 4;
  for (let i = 0; i < n; i++) {
    const p = new THREE.Mesh(pGeo, new THREE.MeshBasicMaterial({ color: colour }));
    root.add(p);
    parts.push(p);
  }
  const rec = { a: a.clone(), b: b.clone(), parts };
  lines.push(rec);
  return rec;
}

makeLink(new THREE.Vector3(-2.35, 0.42, 0.10), new THREE.Vector3(-0.05, 0.55, -0.28), 0x38bdf8);
makeLink(new THREE.Vector3(0.02, 0.55, -0.26),  new THREE.Vector3(2.90, 0.72, -0.20), 0x22d3ee);

/* ═══════════════════════════════════════════════════════════════════════
   LABELS
   ═══════════════════════════════════════════════════════════════════════ */
const labels = Base.createLabelSystem();
labels.add('ecu',  'ECU');
labels.add('dlc',  'DLC · J1962 16-pin');
labels.add('tool', 'Scan tool');
labels.add('p4',   '4 · chassis gnd');
labels.add('p5',   '5 · signal gnd');
labels.add('p6',   '6 · CAN-H');
labels.add('p14',  '14 · CAN-L');
labels.add('p16',  '16 · battery +');

/* ═══════════════════════════════════════════════════════════════════════
   SCREEN RENDERING
   ═══════════════════════════════════════════════════════════════════════ */
function drawScreen() {
  const P = tool.phase, dtc = DTCS[0];
  sctx.fillStyle = P === 'nopower' || P === 'off' ? '#05070a' : '#04121a'; sctx.fillRect(0, 0, 256, 160);
  if (P === 'nopower' || P === 'off') { scTex.needsUpdate = true; return; }
  sctx.strokeStyle = '#12414f'; sctx.lineWidth = 4; sctx.strokeRect(4, 4, 248, 152);
  sctx.fillStyle = '#22d3ee'; sctx.font = 'bold 20px monospace'; sctx.fillText('OBD-II', 16, 34);
  const M2 = { boot: ['AUTO LAB', 'Booting…', '#7dd3fc'], nokey: ['LINKED', 'Turn ignition ON', '#fbbf24'], search: ['ISO 15765-4', 'Searching protocol…', '#7dd3fc'], fail: ['NO ECU', 'Check CAN pins 6 / 14', '#f87171'] }[P];
  if (M2) { sctx.fillStyle = M2[2]; sctx.font = 'bold 24px monospace'; sctx.fillText(M2[0], 16, 90); sctx.font = '13px monospace'; sctx.fillText(M2[1], 16, 118); }
  else {
    sctx.fillStyle = '#7dd3fc'; sctx.font = '13px monospace'; sctx.fillText('ISO 15765-4 CAN  ' + sim.codes.length + ' DTC', 16, 55);
    sctx.fillStyle = '#e2e8f0'; sctx.font = 'bold 30px monospace'; sctx.fillText(dtc.code, 16, 100);
    sctx.fillStyle = '#94a3b8'; sctx.font = '13px monospace'; sctx.fillText(dtc.name.slice(0, 28), 16, 122);
    sctx.fillStyle = dtc.mil ? '#f59e0b' : '#4b5563'; sctx.font = 'bold 12px monospace'; sctx.fillText(dtc.mil ? 'MIL ON' : 'MIL OFF', 16, 144);
  }
  scTex.needsUpdate = true;
}

/* ═══════════════════════════════════════════════════════════════════════
   UI
   ═══════════════════════════════════════════════════════════════════════ */
const TABS = {
  overview: () => `
    <div class="al-sec">
      <h4>What it is</h4>
      <p>OBD-II is the legislated diagnostics standard fitted to every petrol car sold since
      roughly 2001 and every diesel since roughly 2004. One 16-pin socket under the dash gives
      access to fault codes, freeze-frame data and live sensor values.</p>
    </div>
    <div class="al-sec">
      <h4>Key pins</h4>
      <div class="al-pins">
        <span class="p">4</span><span class="d">Chassis ground</span>
        <span class="p">5</span><span class="d">Signal ground</span>
        <span class="p">6</span><span class="d">CAN-H (ISO 15765-4)</span>
        <span class="p">14</span><span class="d">CAN-L</span>
        <span class="p">16</span><span class="d">Battery positive, always live</span>
      </div>
    </div>
    <div class="al-sec">
      <h4>Code families</h4>
      <ul>
        <li><b>P</b> — powertrain (engine, transmission)</li>
        <li><b>C</b> — chassis (ABS, steering)</li>
        <li><b>B</b> — body (airbags, climate)</li>
        <li><b>U</b> — network / communication</li>
      </ul>
      <p>The first digit after the letter tells you whether the code is generic
      (<b>0</b>) or manufacturer-specific (<b>1</b>).</p>
    </div>
    <div class="al-sec">
      <h4>Live data and monitors</h4>
      <p>Mode 01 streams PIDs such as rpm, coolant temperature, calculated load and fuel trim.
      Readiness monitors report whether the self-tests have completed since the last clear —
      they must be "ready" before an emissions test.</p>
    </div>`,
  faults: () => `
    <div class="al-sec"><h4>Working with codes</h4></div>
    <div class="al-fault">
      <div class="t">No communication with the tool</div>
      <div class="s">Tool powers up but will not connect to any module.</div>
      <div class="c">Check: pin 16 battery voltage, pins 4 and 5 grounds, 60 Ω across pins 6–14.</div>
    </div>
    <div class="al-fault">
      <div class="t">Multiple U-codes at once</div>
      <div class="s">Several modules offline, instrument pack dark, intermittent starting.</div>
      <div class="c">Check: CAN-H ≈ 2.5 V and CAN-L ≈ 2.5 V at rest, for chafed harness near the bulkhead.</div>
    </div>
    <div class="al-fault">
      <div class="t">Code returns immediately after clearing</div>
      <div class="s">MIL comes back within one drive cycle.</div>
      <div class="c">The fault is still present — clear only after repairing, then run the readiness monitors.</div>
    </div>
    <div class="al-fault">
      <div class="t">Monitors stuck "not ready"</div>
      <div class="s">No codes stored but the emissions test fails.</div>
      <div class="c">The ECU needs a specific drive cycle (cold start, cruise, decel) before the monitors complete.</div>
    </div>`,
  quiz: () => Widgets.quiz({ quiz: [["Which pins carry the CAN bus on a standard OBD-II socket?", ["Pins 2 and 10", "Pins 6 and 14", "Pins 4 and 5"], 1, "CAN-H is pin 6, CAN-L is pin 14. Pins 4 and 5 are the two grounds."], ["What does a P1xxx code tell you?", ["It is a body code", "It is a network code", "It is a manufacturer-specific powertrain code"], 2, "The letter gives the system (P = powertrain); the first digit 1 means the definition is set by the manufacturer rather than by the standard."], ["What is freeze-frame data?", ["A snapshot of sensor values captured when the fault was set", "The ECU's permanent memory of the last service", "A live stream of every sensor at once"], 0, "Freeze frame records rpm, load, speed, temperature and fuel trim at the moment the DTC was stored — it is the single most useful diagnostic clue."]] })};

/* 7b3: the module legend is the Monitor footer */
const LEGEND = '<div class="mon-legend"><span><i style="background:var(--c-cyan)"></i>Request frame</span><span><i style="background:var(--c-cyan)"></i>Response frame</span><span><i style="background:var(--c-orange)"></i>CAN-L</span><span><i style="background:var(--c-red)"></i>Battery +</span></div>';

const ui = Base.UI.create({
  moduleId: CFG.moduleId,
  panel: {
    kicker: 'Sensors & Control',
    title:  'OBD-II diagnostics',
    tabs: [
      { id: 'overview', label: 'Overview' },
      { id: 'faults',   label: 'Codes' },
      { id: 'quiz',     label: 'Self-check' }
    ],
    onTab: renderTab,
    badge: { text: 'No codes', color: CFG.accent }
  },
  monitor: {
    config: { label: 'Bus', value: { label: 'Bus', unit: ' kbit/s', max: 100, bar: true }, rows: [['dtc', 'DTCs'], ['mil', 'MIL'], ['proto', 'Protocol'], ['mods', 'Modules online'], ['code', 'Active code'], ['frpm', 'Freeze rpm'], ['fcool', 'Freeze coolant']], footer: LEGEND, status: { text: 'Connected' } },
    initial: { value: { text: '—', unit: ' kbit/s' }, rows: { dtc: '—', mil: '—', proto: '—', mods: '—', code: '—', frpm: '—', fcool: '—' }, status: ['Connected', false] }
  },
  toolbar: {
    play: true,
    reset: true,
    speed: { label: 'Bus rate', min: 0.15, max: 2.5, step: 0.05, value: 0.85 },
    labels: true
  },

  /* Phase 6: the stored code is a controls.js choice and Clear codes an action, both in the dock options row */
  options: [
    { id: 'plug', type: 'toggle', label: 'Tool plugged', ariaLabel: 'Plug the scan tool into the DLC', def: false, onChange: (on) => setPlug(on) },
    { id: 'key', type: 'choice', layout: 'segmented', label: 'Ignition', ariaLabel: 'Ignition state', def: 'off',
      options: [{ id: 'off', label: 'Off' }, { id: 'on', label: 'On' }, { id: 'run', label: 'Run' }],
      onChange: (id) => { if (id !== sim.key) { sim.key = id; tool.t = Math.min(tool.t, 1); toast('IGNITION ' + id.toUpperCase(), '#22d3ee'); } } },
    { id: 'sel', type: 'choice', layout: 'select', label: 'Fail', ariaLabel: 'Part to fail', def: 'ect',
      options: Object.keys(SENS).map(k => ({ id: k, label: SENS[k].n })).concat([{ id: 'fuse', label: 'DLC fuse (pin 16)' }, { id: 'can', label: 'CAN wire break' }]),
      onChange: (id) => { sim.sel = id; } },
    { id: 'ftype', type: 'choice', layout: 'segmented', label: 'Fault', ariaLabel: 'Fault type', def: 'open',
      options: [{ id: 'open', label: 'Open' }, { id: 'short', label: 'Short' }, { id: 'stuck', label: 'Stuck' }], onChange: (id) => { sim.ftype = id; } },
    { id: 'thr', type: 'choice', layout: 'segmented', label: 'Throttle', ariaLabel: 'Throttle position', def: 'auto',
      options: [{ id: 'auto', label: 'Auto' }, { id: 'idle', label: 'Idle' }, { id: 'mid', label: '50%' }, { id: 'wot', label: 'WOT' }], onChange: (id) => { sim.thr = id; } },
    { id: 'mystery', type: 'action', label: 'Mystery fault', tone: 'crit', onAction: () => mystery() },
    { id: 'inject', type: 'action', label: 'Inject fault', tone: 'crit', onAction: () => inject(sim.sel) },
    { id: 'clear', type: 'action', label: 'Clear codes', onAction: () => clearCodes() }
  ]
});

const tabHost = document.createElement('div');
tabHost.id = 'al-tabs';
tabHost.className = 'al-tabs';
ui.panel.body.appendChild(tabHost);

Widgets.wireQuiz(tabHost);

function renderTab(id) {
  tabHost.innerHTML = (TABS[id] || TABS.overview)();
}
renderTab('overview');

function clearCodes(force) {
  if (!force && tool.phase !== 'ready') { toast('CONNECT THE TOOL FIRST', '#fbbf24'); return; }
  sim.codes = []; sim.freeze = null; sim.ready = 0; sim.milKm = 0; sim.sinceClear = 0;
  Object.values(sim.faults).forEach(f => { f.age = 0; });              /* a live fault will set the code again */
  syncDtc(); toast(force ? 'RESET' : 'CODES CLEARED · MIL OFF', '#4ade80');
  if (sim.ch && sim.ch.fixed && !force && !Object.keys(sim.faults).length) { toast('✔ SOLVED · wrong parts: ' + sim.ch.wrong, '#4ade80'); sim.ch = null; }
}

/* ═══════════════════════════════════════════════════════════════════════
   OBD SIMULATOR — vehicle model, fault injection, ECU diagnostics, plug-in
   ═══════════════════════════════════════════════════════════════════════ */
const SENS = {
  ect: { n: 'Coolant temp (ECT)', part: 'ECT sensor', u: '°C', min: -40, max: 215, bad: { open: -40, short: 215, stuck: 60 }, trim: -14,
    c: { open: ['P0118', 'ECT circuit high input'], short: ['P0117', 'ECT circuit low input'], stuck: ['P0116', 'ECT range/performance'] },
    test: 'Measure sensor resistance: about 2.5 kΩ at 20 °C falling to about 0.3 kΩ at 90 °C. Back-probe for 5 V reference.' },
  iat: { n: 'Intake air temp (IAT)', part: 'IAT sensor', u: '°C', min: -40, max: 215, bad: { open: -40, short: 215, stuck: 25 }, trim: -6,
    c: { open: ['P0113', 'IAT circuit high input'], short: ['P0112', 'IAT circuit low input'], stuck: ['P0111', 'IAT range/performance'] },
    test: 'Compare IAT with ambient on a cold engine: they should match within about 5 °C. Check resistance against the temperature chart.' },

/* — sensor nodes (click one to fail it) — */

/* — detachable J1962 plug + dynamic cable — */
const plugG = new THREE.Group(); root.add(plugG);
const plugBody = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.36, 0.5), new THREE.MeshStandardMaterial({ color: 0x3b4350, roughness: 0.5, metalness: 0.3 })); plugG.add(plugBody);
const plugKey = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.3, 0.08), shellMat); plugKey.position.z = -0.27; plugG.add(plugKey);

  const pts = [[p.x, p.y, p.z + 0.4], [p.x + 0.7, Math.max(0.2, p.y - 0.3), p.z + 0.7], [1.9, 0.3, 0.4], [2.9, 0.72, -0.2]].map(a => new THREE.Vector3(...a));

placePlug();
function setPlug(on) { sim.plugOn = on; if (on) toast('PUSH IN · ALIGN KEY', '#22d3ee'); ui.controls.set('plug', on); }

/* — toast + click handling — */
const toastEl = document.getElementById('st-toast'); let toastT = 0;
function toast(m, c) { if (c === '#f87171' || c === '#f59e0b') beep(330, 0.16, 'sawtooth'); toastEl.textContent = m; toastEl.style.color = c || '#e6ebf5'; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 1600); }
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {

/* — fault injection / repair — */
function inject(id) {
  if (id === 'fuse' || id === 'can') { sim.conn[id] = true; toast(id === 'fuse' ? 'PIN 16 FUSE BLOWN' : 'CAN WIRE BROKEN', '#f87171'); return; }
  sim.faults[id] = { type: sim.ftype, age: 0 }; toast(SENS[id].n.toUpperCase() + ' · ' + sim.ftype.toUpperCase(), '#f87171');
}
function repair(id) {
  if (id === 'fuse' || id === 'can') sim.conn[id] = false; else delete sim.faults[id];
  toast('REPLACED · now clear the codes', '#4ade80'); tool.t = Math.min(tool.t, 1);
}
function resetSim() { sim.faults = {}; sim.conn = { fuse: false, can: false }; sim.plugOn = false; sim.key = 'off'; ui.controls.set('plug', false); ui.controls.set('key', 'off'); sim.ch = null; clearCodes(true); }

/* — vehicle model — */
const truth = () => {
  const run = sim.key === 'run' && !sim.faults.ckp, u = sim.uS;
  return { rpm: run ? 780 + 1700 * u : 0, tps: run ? 4 + 30 * u : 0, map: run ? 30 + 55 * u : 101, maf: run ? 3 + 35 * u : 0, ect: sim.ect, iat: 28 + (sim.ect - 20) * 0.15,
    o2: run ? 0.45 + 0.4 * Math.sin(sim.T * 6) : 0, speed: run ? u * 70 : 0, batt: run ? 14.1 : 12.4, run };
};
function readings() {
  const v = truth(); const o = { ...v };
  Object.keys(SENS).forEach(id => { const f = sim.faults[id]; if (f && id !== 'ckp') o[id] = SENS[id].bad[f.type]; });
  let trim = 2 * Math.sin(sim.T * 1.3); Object.keys(sim.faults).forEach(id => { trim += SENS[id].trim; });
  o.stft = v.run ? Math.max(-25, Math.min(25, trim)) : 0;
  o.loop = !v.run ? '—' : (sim.faults.o2 || sim.faults.ect) ? 'Open loop (fault)' : sim.ect < 70 ? 'Open loop (warm-up)' : 'Closed loop';
  return o;
}
function syncDtc() {
  const stored = sim.codes.find(c => c.status === 'stored'), d = DTCS[0];
  d.code = stored ? stored.code : (sim.codes[0] ? sim.codes[0].code : '—'); d.name = stored ? stored.name : (sim.codes[0] ? sim.codes[0].name + ' (pending)' : 'No codes stored'); d.mil = !!stored;
  drawScreen(); applyCodeVisuals(); updateReadouts(); sim._sig = '';
}
function simStep(dt) {
  sim.T += dt;
  const ut = sim.thr === 'auto' ? 0.5 + 0.5 * Math.sin(sim.T * 0.35) : { idle: 0, mid: 0.5, wot: 1 }[sim.thr];
  sim.uS += (ut - sim.uS) * Math.min(1, dt * 2.5);
  const tgt = sim.plugOn ? 1 : 0, was = sim.plug;
  if (sim.plug !== tgt) { sim.plug += Math.sign(tgt - sim.plug) * Math.min(Math.abs(tgt - sim.plug), dt * 0.9); placePlug(); }
  const seated = sim.plug >= 1;
  if (seated && !sim.wasSeated) { tool.t = 0; beep(160, 0.07); setTimeout(() => beep(820, 0.05), 70); toast('✔ CLICK · CONNECTOR SEATED', '#4ade80'); }
  sim.wasSeated = seated;
  if (seated) tool.t += dt;
  const v = truth();
  if (DTCS[0].mil) sim.milKm += v.speed * dt / 3600;
  if (sim.key === 'run') sim.sinceClear += dt;
  sim.ect += ((v.run ? 90 : 20) - sim.ect) * dt * (v.run ? 0.03 : 0.004);
  /* tool phase: power (pin 16) → boot → ignition → protocol search (CAN pins 6/14) → ready */
  const ph = !seated ? 'off' : sim.conn.fuse ? 'nopower' : tool.t < 1 ? 'boot' : sim.key === 'off' ? 'nokey' : tool.t < (sim.conn.can ? 4.5 : 3.2) ? 'search' : sim.conn.can ? 'fail' : 'ready';
  if (ph !== tool.phase) { tool.phase = ph; if (ph === 'ready') beep(1200, 0.12, 'sine'); drawScreen(); updateReadouts(); }
  pinBat.color.setHex(sim.conn.fuse ? 0x4a1a1a : 0xef4444);
  /* ECU monitors: detect → pending → stored (MIL) + freeze frame */
  if (sim.key !== 'off') Object.entries(sim.faults).forEach(([id, f]) => {
    f.age += dt; const c = SENS[id].c[f.type], ex = sim.codes.find(x => x.id === id);
    if (f.age > 1.5 && !ex) { sim.codes.push({ id, code: c[0], name: c[1], status: 'pending', type: f.type }); syncDtc(); }
    else if (f.age > 3.5 && ex && ex.status === 'pending') { ex.status = 'stored'; if (!sim.freeze) { const r = readings(); sim.freeze = { code: c[0], rpm: sim.faults.ckp ? 0 : 780 + 800 * Math.abs(Math.sin(sim.T)), ect: v.ect, speed: 0 }; }

  });

}

/* — phase 2: sound, multimeter probe, parts + mystery-fault challenge, vehicle info — */
let AC;
function beep(f, d, type) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.value = f; g.gain.value = 0.04; g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d); } catch (e) {} }

  let sig, ohm = null;
  if (ntc) { const k = T + 273.15; ohm = f && f.type === 'open' ? Infinity : f && f.type === 'short' ? 0 : 2500 * Math.exp(3500 * (1 / k - 1 / 293.15)); sig = ohm === Infinity ? 5 : 5 * ohm / (ohm + 2500); }

const fmtR = (o) => o === null ? '—' : o === Infinity ? 'OL (open)' : o < 1 ? '0.0 Ω' : o >= 1000 ? (o / 1000).toFixed(2) + ' kΩ' : Math.round(o) + ' Ω';

    row('Signal', m.sig.toFixed(2) + (id === 'ckp' ? ' Vp-p' : ' V'), e.sig.toFixed(2), vb) + row('5 V reference', on ? '5.00 V' : '0.00 V', on ? '5.00' : '0.00') + row('Ground', '0.00 V', '0.00') +

}

    all.map(([k, l]) => `<div class="st-r"><span>${l}</span><button class="st-btn" style="flex:none;min-height:28px;padding:2px 10px" data-part="${k}">Replace</button></div>`).join('');
}
function infoHtml() {

function partFix(id) {

/* — scan tool UI — */
const stBody = document.getElementById('st-body'), stEl = document.getElementById('st');

if (innerWidth > 700) document.getElementById('st-head').click();

drawScreen();
applyCodeVisuals();

/* ═══════════════════════════════════════════════════════════════════════
   READOUTS
   ═══════════════════════════════════════════════════════════════════════ */
/* 7b3: the old panel grid is Monitor rows (codes stored and the lamp repeated the DTCs / MIL rows and are dropped) */
const ro = Base.monitorRows(ui, ['proto', 'mods', 'code', 'frpm', 'fcool'], ['count', 'mil']);

function updateReadouts() {
  const dtc = DTCS[state.dtcIndex];
  const kbit = Math.round(250 + state.speedMul * 250);

  if (ro.proto) ro.proto.textContent = 'ISO 15765-4 CAN';
  if (ro.mods)  ro.mods.textContent  = tool.phase === 'ready' ? (sim.faults.ckp ? '5 of 7' : '7 of 7') : '—';
  if (ro.count) {
    ro.count.textContent = String(sim.codes.length);
    ro.count.className = 'v ' + (dtc.mil ? 'warn' : 'ok');
  }
  if (ro.code) {
    ro.code.textContent = dtc.code;
    ro.code.className = 'v ' + (dtc.mil ? 'crit' : '');
  }
  if (ro.frpm)  ro.frpm.textContent  = sim.freeze ? Math.round(sim.freeze.rpm) + ' rpm' : '—';
  if (ro.fcool) ro.fcool.textContent = sim.freeze ? Math.round(sim.freeze.ect) + ' °C' : '—';
  if (ro.mil) {
    ro.mil.textContent = dtc.mil ? 'ON' : 'OFF';
    ro.mil.className = 'v ' + (dtc.mil ? 'warn' : 'ok');
  }

  ui.monitor.update({
    value: { text: String(kbit), unit: ' kbit/s', bar: (state.speedMul / 2.5) * 100, barColor: dtc.mil ? 'var(--warn)' : 'var(--al-accent)' },
    rows: { dtc: String(sim.codes.length), mil: dtc.mil ? 'ON' : 'OFF' },
    status: [dtc.mil ? 'Fault stored' : 'All clear', !dtc.mil]
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   MESSAGING
   ═══════════════════════════════════════════════════════════════════════ */
const bridge = ui.wireBridge({
  viewManager,
  state,
  onCommand: (d) => {
    if (d.action === 'reset') resetSim();
  }
});
bridge.ready();
bridge.setStatus('Bus active', '#22d3ee');

/* ═══════════════════════════════════════════════════════════════════════
   ANIMATION
   ═══════════════════════════════════════════════════════════════════════ */
let t = 0;
let last = performance.now();
let raf = 0;
let roClock = 0;

const tmp = new THREE.Vector3();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  const sp = state.playing ? state.speedMul : 0;
  t += dt * sp;
  simStep(dt);

  /* --- CAN frames --- */
  for (const L of lines) {
    const n = L.parts.length;
    for (let i = 0; i < n; i++) {
      const p = L.parts[i];
      let u = (t * CFG.busHz + i / n) % 1;
      if (u < 0) u += 1;
      p.position.lerpVectors(L.a, L.b, u);
      p.scale.setScalar(0.5 + 0.6 * Math.sin(Math.PI * u));
    }
  }

  /* --- MIL blink while a code is stored --- */
  const dtc = DTCS[state.dtcIndex];
  if (dtc.mil) {
    const on = Math.sin(t * 4.0) > -0.2;
    milLamp.scale.setScalar(on ? 1.35 : 1.0);
  } else {
    milLamp.scale.setScalar(1.0);
  }

  /* --- labels --- */
  labels.hideAll();
  if (state.showLabels) {
    labels.project('ecu',  tmp.set(-3.1, 0.95, 0), camera, wrap);
    labels.project('dlc',  tmp.set(0, 1.05, 0), camera, wrap);
    labels.project('tool', tmp.set(3.0, 1.72, 0), camera, wrap);
    labels.project('p4',   pinPositions[4],  camera, wrap);
    labels.project('p5',   pinPositions[5],  camera, wrap);
    labels.project('p6',   pinPositions[6],  camera, wrap);
    labels.project('p14',  pinPositions[14], camera, wrap);
    labels.project('p16',  pinPositions[16], camera, wrap);
    sensorLabels();
  }

  controls.update();
  renderer.render(scene, camera);

  roClock += dt;
  if (roClock > 0.15) { roClock = 0; updateReadouts(); }
}

if (reduced) {
  setInterval(() => renderer.render(scene, camera), 120);
} else {
  raf = requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', () => {
  if (reduced) return;
  if (document.hidden) {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  } else if (!raf) {
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }
});

updateReadouts();
</script>
</body>
</html>
