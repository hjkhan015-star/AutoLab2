<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d13">
<title>Steering System — Auto Lab</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="controls.css">
<style>
  /* ═══════════════════════════════════════════════════════════
     PANEL READOUT INTERIOR — live steering values
     ═══════════════════════════════════════════════════════════ */
  #steer-readout { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  #steer-readout .steer-row {
    display: flex; justify-content: space-between; gap: 10px;
    font-size: 11.5px; color: var(--text-dim, #94a3b8);
  }
  #steer-readout .steer-row b {
    color: var(--text, #e5e7eb); font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  html.light-theme #steer-readout .steer-row b { color: #0a0d13; }

  /* ═══════════════════════════════════════════════════════════
     TOOLBAR EXTRAS — steering-system switcher (prev / label / next)
     ═══════════════════════════════════════════════════════════ */
  html.light-theme  html.light-theme  html.light-theme  @media (max-width: 600px) {
  }
</style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div id="labels-root"></div>

  <script src="guard.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import * as Base from './kit.js';
  import { UI } from './kit.js';

  const DEG = Base.DEG;

  const isCoarse = matchMedia('(pointer: coarse)').matches;
  const cores    = navigator.hardwareConcurrency || 4;
  const mem      = navigator.deviceMemory || 4;
  const isLowEnd = cores <= 4 || mem <= 2;
  const isMidEnd = !isLowEnd && (cores <= 6 || isCoarse);

  const TYRE_SEGS   = isLowEnd ? 24 : isMidEnd ? 36 : 48;
  const TREAD_COUNT = isLowEnd ? 14 : isMidEnd ? 20 : 26;
  const GRIP_COUNT  = isLowEnd ? 12 : isMidEnd ? 18 : 24;
  const WHEEL_SEGS  = isLowEnd ? 24 : isMidEnd ? 36 : 48;
  const TUBE_SEGS   = isLowEnd ? 12 : isMidEnd ? 16 : 20;

  /* ═══════════════════════════════════════════════════════════
     1. SCENE
     ═══════════════════════════════════════════════════════════ */
  const { scene, camera, renderer, controls, wrap, viewManager } = Base.buildScene({
    fov:      40,
    camPos:   isCoarse ? [2.8, 2.1, 4.0] : [3.4, 2.4, 4.8],
    target:   [0, 0.45, 0],
    floorY:   -1.9,
    fogDensity: 0.024
  });
  Base.attachResize(camera, renderer, wrap, 40);

  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  const keyLight = new THREE.DirectionalLight(0xfff2e0, 2.4);
  keyLight.position.set(4, 6, 5);
  scene.add(keyLight);

  const purpleLight = new THREE.PointLight(0xa855f7, 60, 14, 2);
  purpleLight.position.set(-2.2, 2.6, 2.8);
  scene.add(purpleLight);

  const cyanLight = new THREE.PointLight(0x38bdf8, 45, 14, 2);
  cyanLight.position.set(2.6, 1.8, -2.2);
  scene.add(cyanLight);

  const rimLight = new THREE.PointLight(0xf59e0b, 30, 10, 2);
  rimLight.position.set(0, -1.2, 3.2);
  scene.add(rimLight);

  const hemi = new THREE.HemisphereLight(0x9bb0ff, 0x0a0e14, 0.45);
  scene.add(hemi);

  const labels = Base.createLabelSystem();
  const state  = Base.createUIState();

  /* ═══════════════════════════════════════════════════════════
     2. MATERIALS
     ═══════════════════════════════════════════════════════════ */
  const mat = {
    steel:       new THREE.MeshStandardMaterial({ color:0xd0d8e6, metalness:0.95, roughness:0.18 }),
    steelBright: new THREE.MeshStandardMaterial({ color:0xe8eefc, metalness:1.0,  roughness:0.10 }),
    steelDark:   new THREE.MeshStandardMaterial({ color:0x4e5768, metalness:0.85, roughness:0.32 }),
    iron:        new THREE.MeshStandardMaterial({ color:0x3e4552, metalness:0.70, roughness:0.55 }),
    tire:        new THREE.MeshStandardMaterial({ color:0x1a1e26, metalness:0.10, roughness:0.95 }),
    tireTread:   new THREE.MeshStandardMaterial({ color:0x14171d, metalness:0.05, roughness:1.0 }),
    rim:         new THREE.MeshStandardMaterial({ color:0xb8c1d2, metalness:0.95, roughness:0.15 }),
    rimAccent:   new THREE.MeshStandardMaterial({ color:0x6a7383, metalness:0.85, roughness:0.35 }),
    arm:         new THREE.MeshStandardMaterial({ color:0xe0a94a, metalness:0.90, roughness:0.22,
                    emissive:0x3a2400, emissiveIntensity:0.25 }),
    rod:         new THREE.MeshStandardMaterial({ color:0x9aa3b8, metalness:0.92, roughness:0.20 }),
    joint:       new THREE.MeshStandardMaterial({ color:0x2a3038, metalness:0.50, roughness:0.65 }),
    rubber:      new THREE.MeshStandardMaterial({ color:0x1e2229, metalness:0.05, roughness:0.98 }),
    housingGlass:new THREE.MeshPhysicalMaterial({
      color:0x8a93a5, metalness:0.10, roughness:0.15,
      transmission:0.0, transparent:true, opacity:0.16,
      side:THREE.DoubleSide, depthWrite:false, clearcoat:1.0, clearcoatRoughness:0.1
    }),
    markerBlue:  new THREE.MeshStandardMaterial({ color:0x38bdf8, emissive:0x38bdf8, emissiveIntensity:1.4 }),
    markerAmber: new THREE.MeshStandardMaterial({ color:0xf59e0b, emissive:0xf59e0b, emissiveIntensity:1.4 }),
    markerViolet:new THREE.MeshStandardMaterial({ color:0xa855f7, emissive:0xa855f7, emissiveIntensity:1.6 }),
    grip:        new THREE.MeshStandardMaterial({ color:0x1c2028, metalness:0.10, roughness:0.90 }),
    leather:     new THREE.MeshStandardMaterial({ color:0x2b303a, metalness:0.05, roughness:0.85 })
  };

  /* ═══════════════════════════════════════════════════════════
     3. GEOMETRY CONSTANTS
     ═══════════════════════════════════════════════════════════ */
  const MODULE      = 0.010;
  const PITCH       = Math.PI * MODULE;
  const PRESSURE    = 20 * DEG;

  const RACK_HALF   = 1.40;
  const RACK_BAR_H  = 0.12;
  const RACK_BAR_D  = 0.14;
  const RACK_BASE_Y = RACK_BAR_H / 2;
  const TOOTH_H     = 2.25 * MODULE;
  const RACK_PITCH_Y= RACK_BASE_Y + TOOTH_H / 2;

  const PINION_N    = 16;
  const PINION_R    = MODULE * PINION_N / 2;
  const PINION_Y    = RACK_PITCH_Y + PINION_R;
  const PINION_W    = 0.12;

  const COL_TILT    = 60 * DEG;
  const COL_LEN     = 1.55;

  const WHEEL_R      = 0.42;
  const WHEEL_W      = 0.20;
  const WHEEL_X      = 2.05;
  const WHEEL_Y      = -0.18;
  const WHEEL_Z      = -0.35;
  const STEER_ARM_LEN= 0.45;
  const STEER_ARM_Y  = -0.06;

  const WHEEL_MAX_ANGLE = Math.PI;

  /* ═══════════════════════════════════════════════════════════
     4. STATE
     ═══════════════════════════════════════════════════════════ */
  let steerAngle = 0;                 /* radians, > 0 = left; derived each frame from the 'wheel' dial */

  /* ═══════════════════════════════════════════════════════════
     5. GROUND GLOW
     ═══════════════════════════════════════════════════════════ */
  const groundGeo = new THREE.CircleGeometry(9, isLowEnd ? 32 : 64);
  const groundMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: {
      uInner: { value: new THREE.Color(0x2a1f4a) },
      uOuter: { value: new THREE.Color(0x000000) }
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec2 vUv;
      uniform vec3 uInner;
      uniform vec3 uOuter;
      void main() {
        float d = distance(vUv, vec2(0.5)) * 2.0;
        float a = smoothstep(1.0, 0.0, d) * 0.55;
        vec3 col = mix(uOuter, uInner, smoothstep(0.8, 0.0, d));
        gl_FragColor = vec4(col, a);
      }`
  });
  const groundPlane = new THREE.Mesh(groundGeo, groundMat);
  groundPlane.rotation.x = -Math.PI / 2;
  groundPlane.position.y = -1.895;
  scene.add(groundPlane);

  /* ═══════════════════════════════════════════════════════════
     6. CHASSIS FRAME
     ═══════════════════════════════════════════════════════════ */
  const chassis = new THREE.Group();
  scene.add(chassis);

  const frameBar = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.10, 0.9), mat.iron);
  frameBar.position.set(0, -0.65, -0.35);
  frameBar.receiveShadow = true;
  frameBar.castShadow = true;
  chassis.add(frameBar);

  [-1.9, 0, 1.9].forEach(x => {
    const cm = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.14, 1.2), mat.iron);
    cm.position.set(x, -0.60, -0.35);
    cm.castShadow = true;
    chassis.add(cm);
  });

  /* ═══════════════════════════════════════════════════════════
     7. SHARED PARTS — one rack-and-pinion assembly, three rigs
        rack      manual rack & pinion (the reference)
        hydraulic the same rack + pump / rotary valve / power piston
        eps       the same rack + column torque sensor / ECU / motor + worm
     Every part is mounted to something: the housing to the chassis bar,
     the column to a dash beam, the pump to the engine, the motor to the column.
     ═══════════════════════════════════════════════════════════ */
  const FRAME_TOP_Y = -0.60;     /* top face of the chassis bar: every mount stands on it   */
  const HOUSING_R   = 0.115;     /* rack housing tube radius                                  */
  const UJ_BASIC    = 0.10;      /* u-joint distance along the pinion axis: manual rack        */
  const UJ_POWER    = 0.50;      /* power rigs: valve / pinion cover sits below the joint      */

  const cylX = (r, len, m, segs = TUBE_SEGS) => {
    const o = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, segs), m);
    o.rotation.z = Math.PI / 2;                      /* axis along X */
    return o;
  };
  const cylZ = (r, len, m, segs = TUBE_SEGS) => {
    const o = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, segs), m);
    o.rotation.x = Math.PI / 2;                      /* axis along Z */
    return o;
  };
  const strutMesh = (p0, p1, r, m, segs = 10) => {
    const d = new THREE.Vector3().subVectors(p1, p0);
    const len = d.length();
    const o = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, segs), m);
    o.position.copy(p0).addScaledVector(d, 0.5);
    o.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
    return o;
  };
  const pipeMesh = (pts, r, m, segs = 32) => {
    const curve = new THREE.CatmullRomCurve3(pts);
    return { curve, mesh: new THREE.Mesh(new THREE.TubeGeometry(curve, segs, r, 8, false), m) };
  };
  /* little spheres that travel along a curve — shows fluid / current direction */
  function makeBeads(curve, count, m, radius) {
    const mesh = new THREE.InstancedMesh(new THREE.SphereGeometry(radius, 8, 6), m, count);
    mesh.frustumCulled = false;
    const mx = new THREE.Matrix4();
    const p  = new THREE.Vector3();
    const set = (phase) => {
      for (let i = 0; i < count; i++) {
        let u = (phase + i / count) % 1;
        if (u < 0) u += 1;
        curve.getPointAt(u, p);
        mx.makeTranslation(p.x, p.y, p.z);
        mesh.setMatrixAt(i, mx);
      }
      mesh.instanceMatrix.needsUpdate = true;
    };
    set(0);
    return { mesh, set };
  }

  /* — rack teeth + pinion geometry, built once and shared by every rig — */
  const dxT   = (TOOTH_H / 2) * Math.tan(PRESSURE);
  const wBase = PITCH / 4 + dxT;
  const wTip  = PITCH / 4 - dxT;
  const toothShape = new THREE.Shape();
  toothShape.moveTo(-wBase, 0);
  toothShape.lineTo( wBase, 0);
  toothShape.lineTo( wTip,  TOOTH_H);
  toothShape.lineTo(-wTip,  TOOTH_H);
  toothShape.closePath();
  const toothGeo = new THREE.ExtrudeGeometry(toothShape, { depth: RACK_BAR_D * 0.98, bevelEnabled: false });
  toothGeo.translate(0, 0, -RACK_BAR_D * 0.49);
  const N_TEETH = Math.floor((RACK_HALF * 2) / PITCH);

  function makePinionGeometry(Rp, N, m, width) {
    const rTip  = Rp + m;
    const rRoot = Rp - 1.25 * m;
    const step  = (Math.PI * 2) / N;
    const pts = [];
    const push = (r, a) => pts.push(new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r));
    for (let i = 0; i < N; i++) {
      const c  = i * step;
      const aB = step * 0.30;
      const aT = step * 0.17;
      push(rRoot, c - aB);
      push(rTip,  c - aT);
      push(rTip,  c + aT);
      push(rRoot, c + aB);
      const a0 = c + aB, a1 = c + step - aB;
      for (let k = 1; k < 4; k++) push(rRoot, a0 + (a1 - a0) * k / 4);
    }
    const shape = new THREE.Shape(pts);
    const geo = new THREE.ExtrudeGeometry(shape, { depth: width, bevelEnabled: false, curveSegments: 1 });
    geo.translate(0, 0, -width / 2);
    return geo;
  }
  const pinionGeo = makePinionGeometry(PINION_R, PINION_N, MODULE, PINION_W);
  pinionGeo.rotateZ(-Math.PI / 2 - Math.PI / PINION_N);

  /* — steering wheel (3-spoke) — */
  function makeSteeringWheel() {
    const g = new THREE.Group();
    const rimMesh = new THREE.Mesh(
      new THREE.TorusGeometry(0.30, 0.042, isLowEnd ? 10 : 16, isLowEnd ? 40 : 64), mat.leather);
    g.add(rimMesh);
    for (let i = 0; i < GRIP_COUNT; i++) {
      const a = (i / GRIP_COUNT) * Math.PI * 2;
      const bump = new THREE.Mesh(new THREE.TorusGeometry(0.042, 0.006, 6, 12, Math.PI * 0.15), mat.grip);
      bump.rotation.z = a;
      bump.position.set(Math.cos(a) * 0.30, Math.sin(a) * 0.30, 0);
      g.add(bump);
    }
    const hubMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.085, 0.085, 0.10, isLowEnd ? 16 : 24), mat.steelDark);
    hubMesh.rotation.x = Math.PI / 2;
    g.add(hubMesh);
    const hubFace = new THREE.Mesh(
      new THREE.CylinderGeometry(0.07, 0.07, 0.02, isLowEnd ? 16 : 24), mat.steel);
    hubFace.rotation.x = Math.PI / 2;
    hubFace.position.z = 0.055;
    g.add(hubFace);
    const hubLogo = new THREE.Mesh(
      new THREE.CylinderGeometry(0.028, 0.028, 0.01, isLowEnd ? 14 : 20), mat.markerViolet);
    hubLogo.rotation.x = Math.PI / 2;
    hubLogo.position.z = 0.066;
    g.add(hubLogo);
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2 - Math.PI / 2;
      const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.055, 0.035), mat.steelDark);
      spoke.position.set(Math.cos(a) * 0.155, Math.sin(a) * 0.155, 0);
      spoke.rotation.z = a;
      spoke.castShadow = true;
      g.add(spoke);
      const spokeAccent = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.012, 0.038), mat.markerViolet);
      spokeAccent.position.set(Math.cos(a) * 0.155, Math.sin(a) * 0.155, 0);
      spokeAccent.rotation.z = a;
      g.add(spokeAccent);
    }
    const wheelMarker = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.05), mat.markerBlue);
    wheelMarker.position.set(0, 0.30, 0);
    g.add(wheelMarker);
    return g;
  }

  /* — front road wheel + steering arm — */
  function makeRoadWheel(side) {
    const g = new THREE.Group();
    g.position.set(side * WHEEL_X, WHEEL_Y, WHEEL_Z);

    const tyre = new THREE.Mesh(new THREE.CylinderGeometry(WHEEL_R, WHEEL_R, WHEEL_W, TYRE_SEGS), mat.tire);
    tyre.rotation.z = Math.PI / 2;
    tyre.castShadow = true;
    tyre.receiveShadow = true;
    g.add(tyre);

    for (let i = 0; i < TREAD_COUNT; i++) {
      const th = (i / TREAD_COUNT) * Math.PI * 2;
      const tread = new THREE.Mesh(new THREE.BoxGeometry(WHEEL_W * 1.01, 0.028, 0.055), mat.tireTread);
      tread.position.set(0, Math.cos(th) * (WHEEL_R + 0.005), Math.sin(th) * (WHEEL_R + 0.005));
      tread.rotation.x = th;
      g.add(tread);
    }

    const rimRing = new THREE.Mesh(new THREE.TorusGeometry(WHEEL_R * 0.62, 0.028, 10, isLowEnd ? 24 : 32), mat.rim);
    rimRing.rotation.y = Math.PI / 2;
    g.add(rimRing);

    const rimFace = new THREE.Mesh(
      new THREE.CylinderGeometry(WHEEL_R * 0.60, WHEEL_R * 0.60, 0.02, isLowEnd ? 20 : 32), mat.rimAccent);
    rimFace.rotation.z = Math.PI / 2;
    g.add(rimFace);

    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.10, WHEEL_W + 0.02, WHEEL_SEGS), mat.rim);
    hub.rotation.z = Math.PI / 2;
    g.add(hub);

    const hubCap = new THREE.Mesh(
      new THREE.CylinderGeometry(0.055, 0.055, WHEEL_W + 0.03, WHEEL_SEGS),
      side < 0 ? mat.markerBlue : mat.markerAmber);
    hubCap.rotation.z = Math.PI / 2;
    g.add(hubCap);

    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      const spoke = new THREE.Mesh(new THREE.BoxGeometry(WHEEL_W * 0.55, 0.05, 0.10), mat.rim);
      spoke.position.set(0, Math.cos(a) * WHEEL_R * 0.34, Math.sin(a) * WHEEL_R * 0.34);
      spoke.rotation.x = a;
      g.add(spoke);
    }

    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 + 0.3;
      const nut = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, WHEEL_W + 0.04, 6), mat.steelBright);
      nut.rotation.z = Math.PI / 2;
      nut.position.set(0, Math.cos(a) * 0.075, Math.sin(a) * 0.075);
      g.add(nut);
    }

    const marker = new THREE.Mesh(
      new THREE.BoxGeometry(WHEEL_W * 0.30, 0.045, 0.045), side < 0 ? mat.markerBlue : mat.markerAmber);
    marker.position.set(0, WHEEL_R * 0.62, 0);
    g.add(marker);

    const armGroup = new THREE.Group();
    g.add(armGroup);
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.06, STEER_ARM_LEN), mat.arm);
    arm.position.set(0, STEER_ARM_Y, STEER_ARM_LEN / 2);
    arm.castShadow = true;
    armGroup.add(arm);
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 12), mat.joint);
    ball.position.set(0, STEER_ARM_Y, STEER_ARM_LEN);
    armGroup.add(ball);
    const taper = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.09, TUBE_SEGS), mat.arm);
    taper.position.set(0, STEER_ARM_Y, 0.04);
    armGroup.add(taper);

    return g;
  }

  /* — tie rod: a unit-length rod with a ball joint at each end, stretched between two points — */
  function makeTieRod() {
    const g = new THREE.Group();
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.032, 1, TUBE_SEGS), mat.rod);
    rod.castShadow = true;
    g.add(rod);
    const ballA = new THREE.Mesh(new THREE.SphereGeometry(0.045, 14, 10), mat.joint);
    const ballB = new THREE.Mesh(new THREE.SphereGeometry(0.045, 14, 10), mat.joint);
    ballA.position.y = 0.5;
    ballB.position.y = -0.5;
    g.add(ballA);
    g.add(ballB);
    return g;
  }
  const _dir = new THREE.Vector3();
  const _up  = new THREE.Vector3(0, 1, 0);
  function alignTieRod(group, p0, p1) {
    _dir.subVectors(p1, p0);
    const len = _dir.length();
    if (len < 1e-5) return;
    group.position.copy(p0).addScaledVector(_dir, 0.5);
    group.quaternion.setFromUnitVectors(_up, _dir.normalize());
    group.children[0].scale.set(1, len, 1);
    group.children[1].position.y =  len / 2;
    group.children[2].position.y = -len / 2;
    group.children[1].scale.set(1, 1 / len, 1);
    group.children[2].scale.set(1, 1 / len, 1);
  }

  /* ═══════════════════════════════════════════════════════════
     8. THE ASSEMBLY — rack, housing, pinion, column, wheel,
        road wheels, tie rods, mounts and the dash beam
        opts: closedHousing (continuous rack tube + pinion housing),
              ujZ (u-joint position along the pinion axis),
              pinionCover (plain cover over the pinion: EPS)
     ═══════════════════════════════════════════════════════════ */
  function buildRackAssembly(opts) {
    const o = opts || {};
    const closed = !!o.closedHousing;
    const ujZ    = o.ujZ || UJ_BASIC;

    const root = new THREE.Group();
    const gear = new THREE.Group();            /* tilted frame: local Z = pinion / column axis */
    gear.rotation.x = -COL_TILT;
    root.add(gear);

    /* 8a. rack bar, teeth, end eyes */
    const rackGroup = new THREE.Group();
    gear.add(rackGroup);

    const bar = new THREE.Mesh(new THREE.BoxGeometry(RACK_HALF * 2, RACK_BAR_H, RACK_BAR_D), mat.steelDark);
    bar.castShadow = true;
    bar.receiveShadow = true;
    rackGroup.add(bar);

    const topStrip = new THREE.Mesh(
      new THREE.BoxGeometry(RACK_HALF * 2 * 0.98, 0.006, RACK_BAR_D * 0.6), mat.steelBright);
    topStrip.position.y = RACK_BAR_H / 2 - 0.001;
    rackGroup.add(topStrip);

    const teeth = new THREE.InstancedMesh(toothGeo, mat.steel, N_TEETH);
    const dm = new THREE.Object3D();
    for (let i = 0; i < N_TEETH; i++) {
      dm.position.set((i - (N_TEETH - 1) / 2) * PITCH, RACK_BASE_Y, 0);
      dm.updateMatrix();
      teeth.setMatrixAt(i, dm.matrix);
    }
    teeth.instanceMatrix.needsUpdate = true;
    teeth.castShadow = true;
    rackGroup.add(teeth);

    [-1, 1].forEach(dir => {
      const cap = cylX(RACK_BAR_H * 0.85, 0.10, mat.steelDark);
      cap.position.set(dir * (RACK_HALF + 0.05), 0, 0);
      rackGroup.add(cap);
      const eye = cylX(0.055, 0.11, mat.steelBright);
      eye.position.set(dir * RACK_HALF, 0, 0);
      rackGroup.add(eye);
    });

    /* 8b. rack housing + boots */
    [-1, 1].forEach(dir => {
      const len = closed ? 1.06 : 0.72;
      const cx  = closed ? 0.66 : 0.83;
      const tube = new THREE.Mesh(
        new THREE.CylinderGeometry(HOUSING_R, HOUSING_R, len, TUBE_SEGS, 1, true), mat.housingGlass);
      tube.rotation.z = Math.PI / 2;
      tube.position.x = dir * cx;
      gear.add(tube);

      for (let i = 0; i < 5; i++) {
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(0.10 + i * 0.008, 0.024, 8, isLowEnd ? 16 : 24), mat.rubber);
        ring.rotation.y = Math.PI / 2;
        ring.position.set(dir * (1.02 + i * 0.062), 0, 0);
        gear.add(ring);
      }
    });

    /* 8c. pinion */
    const pinionSpin = new THREE.Group();
    pinionSpin.position.set(0, PINION_Y, 0);
    gear.add(pinionSpin);
    const pinionMesh = new THREE.Mesh(pinionGeo, mat.steel);
    pinionMesh.castShadow = true;
    pinionSpin.add(pinionMesh);
    const pinionDisc = new THREE.Mesh(
      new THREE.CylinderGeometry(PINION_R * 0.95, PINION_R * 0.95, 0.02, TUBE_SEGS), mat.steelDark);
    pinionDisc.rotation.x = Math.PI / 2;
    pinionDisc.position.z = -PINION_W / 2 - 0.01;
    pinionSpin.add(pinionDisc);
    const pinionMarker = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.11, 0.05), mat.markerViolet);
    pinionMarker.position.set(0, PINION_R * 0.62, PINION_W / 2 + 0.015);
    pinionSpin.add(pinionMarker);

    const pinionStub = cylZ(0.042, 0.26, mat.steelDark);          /* lower pinion bearing journal */
    pinionStub.position.set(0, PINION_Y, -0.13);
    gear.add(pinionStub);

    if (closed) {
      /* pinion housing: central tube joins the two rack tubes, a boss carries the pinion bearings */
      const mid = new THREE.Mesh(
        new THREE.CylinderGeometry(HOUSING_R + 0.008, HOUSING_R + 0.008, 0.27, TUBE_SEGS, 1, true), mat.housingGlass);
      mid.rotation.z = Math.PI / 2;
      gear.add(mid);
      const boss = cylZ(0.135, 0.20, mat.housingGlass);
      boss.position.set(0, PINION_Y, 0);
      gear.add(boss);
      const bearing = cylZ(0.075, 0.10, mat.steelDark);           /* lower bearing cap */
      bearing.position.set(0, PINION_Y, -0.15);
      gear.add(bearing);
      if (o.pinionCover) {
        const cover = cylZ(0.105, 0.05, mat.steelDark);           /* plain cover (no valve) */
        cover.position.set(0, PINION_Y, 0.125);
        gear.add(cover);
      }
    }

    /* 8d. shaft, universal joint, column, steering wheel */
    const pinShaft = cylZ(0.030, ujZ, mat.steelDark);
    pinShaft.position.set(0, PINION_Y, ujZ / 2);
    gear.add(pinShaft);

    const columnTube = cylZ(0.045, COL_LEN - ujZ, mat.steel);
    columnTube.position.set(0, PINION_Y, (COL_LEN + ujZ) / 2);
    columnTube.castShadow = true;
    gear.add(columnTube);

    const uJoint = new THREE.Group();
    uJoint.position.set(0, PINION_Y, ujZ);
    gear.add(uJoint);
    uJoint.add(new THREE.Mesh(new THREE.SphereGeometry(0.058, 20, 14), mat.steelDark));
    const ujPin1 = new THREE.Mesh(new THREE.CylinderGeometry(0.020, 0.020, 0.14, 10), mat.steelBright);
    ujPin1.rotation.z = Math.PI / 2;
    uJoint.add(ujPin1);
    const ujPin2 = new THREE.Mesh(new THREE.CylinderGeometry(0.020, 0.020, 0.14, 10), mat.steelBright);
    ujPin2.rotation.x = Math.PI / 2;
    uJoint.add(ujPin2);

    const wheelSpin = makeSteeringWheel();
    wheelSpin.position.set(0, PINION_Y, COL_LEN);
    gear.add(wheelSpin);

    /* 8e. road wheels, kingpins, tie rods */
    const wheelL = makeRoadWheel(-1);
    const wheelR = makeRoadWheel( 1);
    root.add(wheelL);
    root.add(wheelR);
    [-1, 1].forEach(dir => {
      const kp = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.72, TUBE_SEGS), mat.steelDark);
      kp.position.set(dir * WHEEL_X, WHEEL_Y, WHEEL_Z);
      kp.castShadow = true;
      root.add(kp);
      const kcap = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.04, TUBE_SEGS), mat.steelBright);
      kcap.position.set(dir * WHEEL_X, WHEEL_Y + 0.36, WHEEL_Z);
      root.add(kcap);
    });
    const tieRodL = makeTieRod();
    const tieRodR = makeTieRod();
    root.add(tieRodL);
    root.add(tieRodR);

    /* 8f. mounts — rack housing bolted down to the chassis bar (two saddle clamps on posts) */
    [-1, 1].forEach(dir => {
      const hPost = (-HOUSING_R) - FRAME_TOP_Y;                     /* chassis top → housing underside */
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.10, hPost, 0.12), mat.iron);
      post.position.set(dir * 0.62, FRAME_TOP_Y + hPost / 2, -0.03);
      post.castShadow = true;
      root.add(post);
      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.02, 0.18), mat.steelDark);
      foot.position.set(dir * 0.62, FRAME_TOP_Y + 0.01, -0.03);
      root.add(foot);
      const clamp = new THREE.Mesh(new THREE.TorusGeometry(HOUSING_R + 0.016, 0.016, 8, 24), mat.steelDark);
      clamp.rotation.y = Math.PI / 2;
      clamp.position.set(dir * 0.62, 0, 0);
      root.add(clamp);
    });

    /* 8g. dash beam — the column is clamped to a cross-car beam held by two struts from the chassis bar */
    const clampZ = 1.30;                                           /* clamp position along the column */
    const colClamp = new THREE.Mesh(new THREE.TorusGeometry(0.058, 0.014, 8, 20), mat.steelDark);
    colClamp.position.set(0, PINION_Y, clampZ);
    gear.add(colClamp);
    const q = new THREE.Vector3();                                  /* clamp point in world space (rotation about X by −tilt) */
    {
      const c = Math.cos(-COL_TILT), s = Math.sin(-COL_TILT);
      q.set(0, c * PINION_Y - s * clampZ, s * PINION_Y + c * clampZ);
    }
    const beamC = new THREE.Vector3(0, q.y, q.z - 0.16);
    root.add(strutMesh(q, beamC, 0.016, mat.steelDark));           /* clamp arm */
    const beam = cylX(0.030, 1.80, mat.iron);
    beam.position.copy(beamC);
    root.add(beam);
    [-1, 1].forEach(dir => {
      const foot = new THREE.Vector3(dir * 0.9, FRAME_TOP_Y, -0.45);
      const top  = new THREE.Vector3(dir * 0.9, beamC.y, beamC.z);
      root.add(strutMesh(foot, top, 0.025, mat.iron));
      const plate = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.02, 0.14), mat.steelDark);
      plate.position.set(dir * 0.9, FRAME_TOP_Y + 0.01, -0.45);
      root.add(plate);
    });

    root.updateMatrixWorld(true);
    return { root, gear, rackGroup, pinionSpin, wheelSpin, wheelL, wheelR, tieRodL, tieRodR, ujZ };
  }

  /* ═══════════════════════════════════════════════════════════
     9. EXTRA MATERIALS (power steering only)
     ═══════════════════════════════════════════════════════════ */
  const glassTint = (hex, op) => new THREE.MeshPhysicalMaterial({
    color: hex, metalness: 0.2, roughness: 0.2, transparent: true, opacity: op,
    side: THREE.DoubleSide, depthWrite: false, clearcoat: 0.8, clearcoatRoughness: 0.2 });
  const std = (hex, metal, rough, emissive, ei) => new THREE.MeshStandardMaterial({
    color: hex, metalness: metal, roughness: rough,
    emissive: emissive === undefined ? 0x000000 : emissive, emissiveIntensity: ei || 0 });

  const fx = {
    engine:    std(0x3a424e, 0.70, 0.52),
    pump:      std(0x2a2f38, 0.75, 0.42),
    tank:      glassTint(0x9fb4c8, 0.30),
    cap:       std(0xc0392b, 0.30, 0.55),
    belt:      std(0x0f1115, 0.05, 0.92),
    valveBody: glassTint(0x2e6fbf, 0.28),
    sleeve:    new THREE.MeshStandardMaterial({ color: 0x2e6fbf, metalness: 0.7, roughness: 0.3, transparent: true, opacity: 0.55, depthWrite: false }),
    spool:     std(0xe8eefc, 1.0, 0.12),
    hoseP:     std(0xb02a2a, 0.15, 0.7, 0xb02a2a, 0.4),
    hoseT:     std(0x1e5fae, 0.15, 0.7, 0x1e5fae, 0.4),
    pipeA:     std(0x1e5fae, 0.35, 0.5, 0x1e5fae, 0.4),
    pipeB:     std(0x1e5fae, 0.35, 0.5, 0x1e5fae, 0.4),
    chamA:     new THREE.MeshStandardMaterial({ color: 0x1e5fae, emissive: 0x1e5fae, emissiveIntensity: 0.5, transparent: true, opacity: 0.55, depthWrite: false }),
    chamB:     new THREE.MeshStandardMaterial({ color: 0x1e5fae, emissive: 0x1e5fae, emissiveIntensity: 0.5, transparent: true, opacity: 0.55, depthWrite: false }),
    beadP:     new THREE.MeshBasicMaterial({ color: 0xffb4a8 }),
    beadT:     new THREE.MeshBasicMaterial({ color: 0xa8d0ff }),
    beadA:     new THREE.MeshBasicMaterial({ color: 0xffffff }),
    beadB:     new THREE.MeshBasicMaterial({ color: 0xffffff }),
    sensor:    glassTint(0x22c55e, 0.22),
    gearBox:   glassTint(0xd8a44a, 0.26),
    wormWheel: std(0xe0a94a, 0.9, 0.24),
    worm:      std(0xf0d078, 0.95, 0.18),
    motor:     std(0x2c3a4a, 0.78, 0.36, 0x0a1a2a, 0.4),
    motorBand: std(0x8b5cf6, 0.5, 0.35, 0x8b5cf6, 0.5),
    ecu:       std(0x1a1f2a, 0.42, 0.62),
    battery:   std(0x20252d, 0.35, 0.6),
    terminal:  std(0xd0d6df, 0.9, 0.2),
    cableRed:  std(0xc0303c, 0.3, 0.55, 0xc0303c, 0.25),
    cableBlk:  std(0x14171d, 0.3, 0.6),
    signal:    std(0x22c55e, 0.2, 0.65, 0x22c55e, 0.35),
    beadAmp:   new THREE.MeshBasicMaterial({ color: 0xffd0d4 })
  };
  const cBlue = new THREE.Color(0x1e5fae);
  const cRed  = new THREE.Color(0xe0402f);
  const cWhite = new THREE.Color(0xffffff);
  const heat  = (m, f, ei) => { m.color.copy(cBlue).lerp(cRed, f); if (m.emissive) { m.emissive.copy(m.color); m.emissiveIntensity = ei; } };

  /* belt around two pulleys in the XY plane (external tangents), extruded along Z */
  function makeBelt(c1, r1, c2, r2, z, width, thick, m) {
    const dx = c2.x - c1.x, dy = c2.y - c1.y;
    const d = Math.hypot(dx, dy), ang = Math.atan2(dy, dx);
    const loop = (path, R1, R2) => {
      const al = Math.PI / 2 - Math.asin((R1 - R2) / d);
      path.moveTo(R1 * Math.cos(al), R1 * Math.sin(al));
      path.lineTo(d + R2 * Math.cos(al), R2 * Math.sin(al));
      path.absarc(d, 0, R2, al, -al, true);
      path.lineTo(R1 * Math.cos(al), -R1 * Math.sin(al));
      path.absarc(0, 0, R1, -al, al - Math.PI * 2, true);
      return path;
    };
    const shape = loop(new THREE.Shape(), r1 + thick, r2 + thick);
    shape.holes.push(loop(new THREE.Path(), r1, r2));
    const mesh = new THREE.Mesh(
      new THREE.ExtrudeGeometry(shape, { depth: width, bevelEnabled: false, curveSegments: 20 }), m);
    mesh.rotation.z = ang;
    mesh.position.set(c1.x, c1.y, z - width / 2);
    return mesh;
  }

  /* ═══════════════════════════════════════════════════════════
     10. HYDRAULIC POWER STEERING RIG
         engine (belt) → pump → pressure hose → rotary valve →
         power piston (on the rack bar) → return hose → reservoir
     ═══════════════════════════════════════════════════════════ */
  function buildHydraulicRig() {
    const A = buildRackAssembly({ closedHousing: true, ujZ: UJ_POWER });
    const { root, gear, rackGroup } = A;
    const cy = PINION_Y;
    const W = (x, y, z) => gear.localToWorld(new THREE.Vector3(x, y, z));

    /* 10a. power cylinder: the rack housing is the cylinder, a piston is fixed to the rack bar */
    const PISTON_X = 0.60, PISTON_T = 0.06, GLAND_A = 0.20, GLAND_B = 1.00;
    const piston = cylX(0.106, PISTON_T, mat.steelBright);
    piston.position.x = PISTON_X;
    rackGroup.add(piston);                                  /* moves with the rack */
    [-1, 1].forEach(s => {
      const seal = new THREE.Mesh(new THREE.TorusGeometry(0.106, 0.009, 8, 24), mat.rubber);
      seal.rotation.y = Math.PI / 2;
      seal.position.x = PISTON_X + s * 0.02;
      rackGroup.add(seal);
    });
    [GLAND_A, GLAND_B].forEach(x => {                       /* fixed end glands close the two chambers */
      const g = cylX(0.114, 0.03, mat.steelDark);
      g.position.x = x;
      gear.add(g);
    });
    const chamGeo = new THREE.CylinderGeometry(0.098, 0.098, 1, TUBE_SEGS);
    chamGeo.rotateZ(Math.PI / 2);                           /* unit length along X */
    const chamA = new THREE.Mesh(chamGeo, fx.chamA);        /* between valve-side gland and piston */
    const chamB = new THREE.Mesh(chamGeo, fx.chamB);        /* between piston and far gland */
    gear.add(chamA);
    gear.add(chamB);

    /* 10b. rotary valve on the pinion shaft, above the pinion */
    const VZ = 0.21;
    const valveHousing = cylZ(0.105, 0.26, fx.valveBody);
    valveHousing.position.set(0, cy, VZ);
    gear.add(valveHousing);
    const valveEdge = new THREE.Mesh(new THREE.TorusGeometry(0.108, 0.006, 6, 24), mat.steelDark);
    valveEdge.position.set(0, cy, VZ + 0.13);
    gear.add(valveEdge);

    const sleeve = new THREE.Group();                       /* turns with the pinion (output side) */
    sleeve.position.set(0, cy, VZ);
    gear.add(sleeve);
    sleeve.add(cylZ(0.082, 0.20, fx.sleeve));
    [-0.06, 0, 0.06].forEach(z => {
      const groove = new THREE.Mesh(new THREE.TorusGeometry(0.083, 0.006, 6, 20), mat.steelDark);
      groove.position.z = z;
      sleeve.add(groove);
    });
    const sleeveFlange = cylZ(0.095, 0.012, mat.steelDark);
    sleeveFlange.position.z = 0.135;
    sleeve.add(sleeveFlange);
    const sleeveMark = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.03, 0.02), mat.markerAmber);
    sleeveMark.position.set(0, 0.092, 0.147);
    sleeve.add(sleeveMark);

    const spool = new THREE.Group();                        /* turns with the steering shaft (input side) */
    spool.position.set(0, cy, VZ);
    gear.add(spool);
    const spoolShaft = cylZ(0.050, 0.34, fx.spool);
    spoolShaft.position.z = 0.02;
    spool.add(spoolShaft);
    [-0.05, 0.05].forEach(z => {
      const land = cylZ(0.066, 0.025, mat.steelBright);
      land.position.z = z;
      spool.add(land);
    });
    const spoolFlange = cylZ(0.064, 0.012, mat.steelBright);
    spoolFlange.position.z = 0.152;
    spool.add(spoolFlange);
    const spoolMark = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.034, 0.02), mat.markerBlue);
    spoolMark.position.set(0, 0.050, 0.165);
    spool.add(spoolMark);

    /* ports: P (pressure in) and T (tank / return) on the pump side, A and B (cylinder lines) on the other */
    const port = (x, z, m) => { const f = cylX(0.026, 0.05, m); f.position.set(x, cy, z); gear.add(f); return f; };
    port(-0.125, 0.14, fx.hoseP);                           /* P */
    port(-0.125, 0.28, fx.hoseT);                           /* T */
    port( 0.125, 0.14, fx.pipeA);                           /* A */
    port( 0.125, 0.28, fx.pipeB);                           /* B */

    /* 10c. rigid transfer pipes from the valve to each end of the cylinder (local to the tilted frame) */
    const pA = pipeMesh([
      new THREE.Vector3(0.15, cy, 0.14), new THREE.Vector3(0.20, 0.21, 0.10),
      new THREE.Vector3(0.24, 0.20, 0.04), new THREE.Vector3(0.24, 0.125, 0.0)], 0.016, fx.pipeA, 24);
    const pB = pipeMesh([
      new THREE.Vector3(0.15, cy, 0.28), new THREE.Vector3(0.32, 0.23, 0.22),
      new THREE.Vector3(0.62, 0.25, 0.11), new THREE.Vector3(0.96, 0.20, 0.04),
      new THREE.Vector3(0.96, 0.125, 0.0)], 0.016, fx.pipeB, 40);
    gear.add(pA.mesh);
    gear.add(pB.mesh);
    [0.24, 0.96].forEach(x => {                             /* banjo fittings where the pipes meet the cylinder */
      const f = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.05, 12), mat.steelDark);
      f.position.set(x, 0.125, 0);
      gear.add(f);
    });
    const beadsA = makeBeads(pA.curve, 6, fx.beadA, 0.011);
    const beadsB = makeBeads(pB.curve, 6, fx.beadB, 0.011);
    gear.add(beadsA.mesh);
    gear.add(beadsB.mesh);

    /* 10d. engine front, drive belt, pump and reservoir (all standing on the chassis bar) */
    const eng = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.70, 0.55), fx.engine);
    eng.position.set(-1.25, -0.20, -0.725);
    eng.castShadow = true;
    root.add(eng);
    [-1.45, -1.05].forEach(x => {                           /* engine mounts */
      const mount = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.05, 0.16), mat.rubber);
      mount.position.set(x, FRAME_TOP_Y + 0.025, -0.62);
      root.add(mount);
    });
    const FACE_Z = -0.45;                                   /* accessory-drive face of the engine */
    const C1 = new THREE.Vector3(-1.38, -0.28, 0);          /* crank pulley centre */
    const C2 = new THREE.Vector3(-1.08,  0.00, 0);          /* pump pulley centre  */
    const R1 = 0.16, R2 = 0.085, BELT_Z = -0.33;

    const crankSnout = cylZ(0.05, 0.14, mat.steelDark);
    crankSnout.position.set(C1.x, C1.y, FACE_Z + 0.07);
    root.add(crankSnout);
    const crankPulley = new THREE.Group();
    crankPulley.position.set(C1.x, C1.y, BELT_Z);
    root.add(crankPulley);
    crankPulley.add(cylZ(R1, 0.05, mat.steelDark, WHEEL_SEGS));
    const crankMark = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.08, 0.03), mat.markerViolet);
    crankMark.position.set(0, R1 * 0.6, 0.03);
    crankPulley.add(crankMark);

    const pumpBody = cylZ(0.11, 0.09, fx.pump);
    pumpBody.position.set(C2.x, C2.y, FACE_Z + 0.045);
    root.add(pumpBody);
    const pumpSnout = cylZ(0.03, 0.09, mat.steelDark);
    pumpSnout.position.set(C2.x, C2.y, FACE_Z + 0.135);
    root.add(pumpSnout);
    const pumpPulley = new THREE.Group();
    pumpPulley.position.set(C2.x, C2.y, BELT_Z);
    root.add(pumpPulley);
    pumpPulley.add(cylZ(R2, 0.05, mat.steelDark, WHEEL_SEGS));
    const pumpMark = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.05, 0.03), mat.markerBlue);
    pumpMark.position.set(0, R2 * 0.55, 0.03);
    pumpPulley.add(pumpMark);
    root.add(makeBelt(C1, R1, C2, R2, BELT_Z, 0.04, 0.012, fx.belt));

    const tank = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.16, TUBE_SEGS), fx.tank);   /* reservoir sits on the pump */
    tank.position.set(C2.x, C2.y + 0.185, FACE_Z + 0.045);
    root.add(tank);
    const tankCap = new THREE.Mesh(new THREE.CylinderGeometry(0.068, 0.068, 0.03, TUBE_SEGS), fx.cap);
    tankCap.position.set(C2.x, C2.y + 0.275, FACE_Z + 0.045);
    root.add(tankCap);

    const outlet = cylX(0.022, 0.05, fx.hoseP);              /* pump pressure outlet */
    outlet.position.set(C2.x + 0.11 + 0.015, C2.y, FACE_Z + 0.045);
    root.add(outlet);
    const inlet = cylX(0.020, 0.04, fx.hoseT);               /* reservoir return inlet */
    inlet.position.set(C2.x + 0.06 + 0.01, C2.y + 0.19, FACE_Z + 0.045);
    root.add(inlet);

    /* 10e. flexible hoses: pump → valve (pressure), valve → reservoir (return) */
    const outletEnd = new THREE.Vector3(C2.x + 0.16, C2.y, FACE_Z + 0.045);
    const inletEnd  = new THREE.Vector3(C2.x + 0.10, C2.y + 0.19, FACE_Z + 0.045);
    const hP = pipeMesh([
      outletEnd, new THREE.Vector3(-0.80, 0.04, -0.36), new THREE.Vector3(-0.55, 0.12, -0.28),
      new THREE.Vector3(-0.34, 0.19, -0.13), W(-0.15, cy, 0.14)], 0.022, fx.hoseP, 40);
    const hT = pipeMesh([
      W(-0.15, cy, 0.28), new THREE.Vector3(-0.32, 0.33, -0.07), new THREE.Vector3(-0.58, 0.30, -0.24),
      new THREE.Vector3(-0.80, 0.23, -0.36), inletEnd], 0.022, fx.hoseT, 40);
    root.add(hP.mesh);
    root.add(hT.mesh);
    const beadsP = makeBeads(hP.curve, 8, fx.beadP, 0.014);
    const beadsT = makeBeads(hT.curve, 8, fx.beadT, 0.014);
    root.add(beadsP.mesh);
    root.add(beadsT.mesh);

    /* 10f. animation */
    let phP = 0, phT = 0, phA = 0, phB = 0;
    function update(c) {
      const mag = Math.abs(c.e);
      const hi  = 0.05 + 0.85 * mag;                        /* pressure fraction (≈ 4 … 90 bar)  */
      const lo  = 0.05;
      const pa = c.e > 0.02 ? hi : lo;                      /* e > 0: rack goes +X → pressurise chamber A */
      const pb = c.e < -0.02 ? hi : lo;

      const tw = c.e * 20 * DEG;                            /* torsion-bar twist (≈ 5° real, × 4 for visibility) */
      spool.rotation.z  = c.theta + tw / 2;
      sleeve.rotation.z = c.theta - tw / 2;

      const pistonX = PISTON_X + c.rackOffset;
      const a0 = GLAND_A + 0.015, a1 = pistonX - PISTON_T / 2;
      const b0 = pistonX + PISTON_T / 2, b1 = GLAND_B - 0.015;
      chamA.position.x = (a0 + a1) / 2;  chamA.scale.x = Math.max(1e-3, a1 - a0);
      chamB.position.x = (b0 + b1) / 2;  chamB.scale.x = Math.max(1e-3, b1 - b0);

      heat(fx.chamA, pa, 0.25 + pa * 0.9);
      heat(fx.chamB, pb, 0.25 + pb * 0.9);
      heat(fx.pipeA, pa, 0.25 + pa * 0.9);
      heat(fx.pipeB, pb, 0.25 + pb * 0.9);
      fx.beadA.color.copy(fx.pipeA.color).lerp(cWhite, 0.5);
      fx.beadB.color.copy(fx.pipeB.color).lerp(cWhite, 0.5);
      fx.hoseP.emissiveIntensity = 0.3 + hi * 0.9;
      fx.hoseT.emissiveIntensity = 0.3;

      /* pump & crank spin with the engine; flow in the pump circuit never stops */
      crankPulley.rotation.z = -c.t * 3.0;
      pumpPulley.rotation.z  = -c.t * 3.0 * (R1 / R2);
      phP += c.dtA * 0.35;
      phT += c.dtA * 0.35;
      beadsP.set(phP);
      beadsT.set(phT);
      /* flow in the cylinder lines only while the piston moves: into the pressurised chamber, out of the other */
      const fl = Math.max(-1, Math.min(1, c.omega / 2.2));
      phA += c.dtA * 0.7 *  fl;
      phB += c.dtA * 0.7 * -fl;
      beadsA.set(phA);
      beadsB.set(phB);
    }

    const midP = hP.curve.getPointAt(0.5);
    const midT = hT.curve.getPointAt(0.5);
    const labelDefs = [
      { id: 'h-wheel',  text: 'Steering wheel',                   obj: A.wheelSpin, off: new THREE.Vector3(0, 0.30, 0) },
      { id: 'h-valve',  text: 'Rotary control valve',             obj: gear, off: new THREE.Vector3(0.105, cy, 0.21), kind: 'control' },
      { id: 'h-torsion',text: 'Torsion bar twist',                obj: gear, off: new THREE.Vector3(0, cy, 0.37), kind: 'control' },
      { id: 'h-pinion', text: 'Pinion gear',                      obj: gear, off: new THREE.Vector3(0.09, cy - 0.04, -0.04) },
      { id: 'h-piston', text: 'Power piston (fixed to rack)',     obj: piston, off: new THREE.Vector3(0, 0.106, 0) },
      { id: 'h-chamA',  text: 'Cylinder chamber A',               obj: chamA, off: new THREE.Vector3(0, 0, 0), kind: 'fuel' },
      { id: 'h-chamB',  text: 'Cylinder chamber B',               obj: chamB, off: new THREE.Vector3(0, 0, 0), kind: 'fuel' },
      { id: 'h-pump',   text: 'Power steering pump',              obj: root, off: new THREE.Vector3(C2.x, C2.y, FACE_Z + 0.02), kind: 'fuel' },
      { id: 'h-res',    text: 'Fluid reservoir',                  obj: root, off: new THREE.Vector3(C2.x, C2.y + 0.20, FACE_Z + 0.045), kind: 'fuel' },
      { id: 'h-belt',   text: 'Drive belt',                       obj: root, off: new THREE.Vector3((C1.x + C2.x) / 2 - 0.02, (C1.y + C2.y) / 2 + 0.06, BELT_Z) },
      { id: 'h-engine', text: 'Engine (belt drive)',              obj: root, off: new THREE.Vector3(-1.25, -0.40, FACE_Z - 0.10) },
      { id: 'h-hoseP',  text: 'High-pressure hose',               obj: root, off: midP, kind: 'fuel' },
      { id: 'h-hoseT',  text: 'Return hose',                      obj: root, off: midT, kind: 'coolant' },
      { id: 'h-rack',   text: 'Rack',                             obj: gear, off: new THREE.Vector3(-0.70, 0, 0) },
      { id: 'h-tie',    text: 'Tie rod',                          obj: A.tieRodR, off: new THREE.Vector3(0, 0, 0) }
    ];

    return {
      A, group: root, update, labelDefs,
      title: 'Hydraulic Power Steering (HPAS)',
      kicker: 'Steering · Assisted',
      badge: { text: 'Hydraulic Assist', color: '#2e6fbf' },
      desc: `<strong>Hydraulic power-assisted rack and pinion.</strong> The engine's <strong>drive belt</strong>
             spins a <strong>vane pump</strong>, which draws fluid from the <strong>reservoir</strong> and sends it
             through the <strong>high-pressure hose</strong> to the <strong>rotary control valve</strong> built into
             the pinion housing. Inside the valve a short <strong>torsion bar</strong> joins the steering shaft
             (spool) to the pinion (sleeve). Wheel centred or held still: the bar is straight, fluid flows straight
             back to the reservoir through the <strong>return hose</strong>, and both sides of the
             <strong>power piston</strong> sit at low pressure. Turn the wheel: road resistance twists the bar a
             few degrees (drawn 4× larger), the spool shifts against the sleeve, pump pressure is routed to one
             end of the cylinder and the other end is opened to return. The piston is fixed to the rack bar, so
             the pressure difference pushes the rack the way you are steering, on top of the pinion's force.
             Stop turning and the bar untwists, the valve re-centres and the assist vanishes. The pump runs
             whenever the engine does, which costs a little fuel even when going straight.`
    };
  }

  /* ═══════════════════════════════════════════════════════════
     11. ELECTRIC POWER STEERING RIG (column-assist)
         torque sensor → ECU (12 V battery) → motor → worm gear →
         worm wheel on the column → u-joint → pinion → rack
     ═══════════════════════════════════════════════════════════ */
  function buildElectricRig() {
    const A = buildRackAssembly({ closedHousing: true, ujZ: UJ_POWER, pinionCover: true });
    const { root, gear } = A;
    const cy = PINION_Y;
    const W = (x, y, z) => gear.localToWorld(new THREE.Vector3(x, y, z));

    const ZS = 1.06;                                         /* torque sensor, wheel side        */
    const ZG = 0.86;                                         /* assist gear, between sensor and u-joint */
    const WY = cy - 0.092;                                   /* worm / motor axis, offset from the column */

    /* 11a. torque sensor around the column: input ring and output ring joined by a torsion bar */
    const sensorHousing = cylZ(0.078, 0.12, fx.sensor);
    sensorHousing.position.set(0, cy, ZS);
    gear.add(sensorHousing);
    const coil = new THREE.Mesh(new THREE.TorusGeometry(0.080, 0.008, 8, 24), fx.signal);
    coil.position.set(0, cy, ZS);
    gear.add(coil);
    const connector = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.034, 0.05), mat.steelDark);
    connector.position.set(0.098, cy, ZS);
    gear.add(connector);
    const ringIn  = new THREE.Group();                       /* wheel side — turns with the driver */
    const ringOut = new THREE.Group();                       /* gear side — turns with the pinion  */
    ringIn.position.set(0, cy, ZS + 0.03);
    ringOut.position.set(0, cy, ZS - 0.03);
    gear.add(ringIn);
    gear.add(ringOut);
    ringIn.add(cylZ(0.058, 0.012, mat.steelBright));
    ringOut.add(cylZ(0.058, 0.012, mat.steelBright));
    const markIn = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.03, 0.02), mat.markerBlue);
    markIn.position.set(0, 0.064, 0);
    ringIn.add(markIn);
    const markOut = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.03, 0.02), mat.markerAmber);
    markOut.position.set(0, 0.064, 0);
    ringOut.add(markOut);
    const bartwist = cylZ(0.014, 0.08, mat.steelBright);     /* torsion bar between the rings */
    bartwist.position.set(0, cy, ZS);
    gear.add(bartwist);

    /* 11b. assist gear: worm wheel fixed to the column, worm on the motor shaft */
    const gearHousing = cylZ(0.098, 0.16, fx.gearBox);
    gearHousing.position.set(0, cy, ZG);
    gear.add(gearHousing);
    const wormWheel = new THREE.Group();
    wormWheel.position.set(0, cy, ZG);
    gear.add(wormWheel);
    const wwGeo = makePinionGeometry(0.058, 24, 0.0075, 0.04);
    wormWheel.add(new THREE.Mesh(wwGeo, fx.wormWheel));
    const wwMark = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.03, 0.05), mat.markerViolet);
    wwMark.position.set(0, 0.04, 0);
    wormWheel.add(wwMark);

    const wormHousing = cylX(0.052, 0.24, fx.gearBox);
    wormHousing.position.set(0.06, WY, ZG);
    gear.add(wormHousing);
    const worm = new THREE.Group();
    worm.position.set(0.0, WY, ZG);
    gear.add(worm);
    const wormShaft = cylX(0.026, 0.22, fx.worm);
    wormShaft.position.x = 0.02;
    worm.add(wormShaft);
    for (let i = 0; i < 9; i++) {                            /* thread */
      const th = new THREE.Mesh(new THREE.TorusGeometry(0.030, 0.007, 6, 14), fx.worm);
      th.rotation.y = Math.PI / 2;
      th.position.x = -0.07 + i * 0.026;
      worm.add(th);
    }
    const wormMark = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.012, 0.012), mat.markerViolet);
    wormMark.position.set(-0.08, 0.036, 0);
    worm.add(wormMark);

    /* 11c. motor and ECU bolted to the worm housing */
    const motorBody = cylX(0.075, 0.20, fx.motor);
    motorBody.position.set(0.24, WY, ZG);
    gear.add(motorBody);
    const motorBand = cylX(0.078, 0.04, fx.motorBand);
    motorBand.position.set(0.24, WY, ZG);
    gear.add(motorBand);
    const flange = cylX(0.085, 0.02, mat.steelDark);
    flange.position.set(0.14, WY, ZG);
    gear.add(flange);
    const endCap = cylX(0.078, 0.02, mat.steelDark);
    endCap.position.set(0.35, WY, ZG);
    gear.add(endCap);
    const ecuBox = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.15, 0.15), fx.ecu);
    ecuBox.position.set(0.42, WY, ZG);
    gear.add(ecuBox);
    const ecuLed = new THREE.Mesh(new THREE.SphereGeometry(0.014, 10, 8), new THREE.MeshBasicMaterial({ color: 0x22c55e }));
    ecuLed.position.set(0.42, WY - 0.078, ZG);
    gear.add(ecuLed);
    const ecuPlug = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.05, 0.05), mat.steelDark);
    ecuPlug.position.set(0.495, WY, ZG);
    gear.add(ecuPlug);

    /* 11d. sensor harness (sensor → ECU), local to the column frame */
    const hs = pipeMesh([
      new THREE.Vector3(0.125, cy, ZS), new THREE.Vector3(0.20, cy - 0.02, ZS + 0.02),
      new THREE.Vector3(0.34, cy - 0.07, ZS - 0.03), new THREE.Vector3(0.42, WY, ZG + 0.12),
      new THREE.Vector3(0.42, WY, ZG + 0.075)], 0.011, fx.signal, 28);
    gear.add(hs.mesh);

    /* 11e. 12 V battery on the chassis bar, supply cable to the ECU, ground strap to the bar */
    const batt = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.22, 0.20), fx.battery);
    batt.position.set(0.60, FRAME_TOP_Y + 0.11, -0.45);
    batt.castShadow = true;
    root.add(batt);
    const termPos = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.04, 12), fx.cableRed);
    termPos.position.set(0.70, FRAME_TOP_Y + 0.24, -0.45);
    root.add(termPos);
    const termNeg = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.04, 12), fx.terminal);
    termNeg.position.set(0.50, FRAME_TOP_Y + 0.24, -0.45);
    root.add(termNeg);
    const plug = W(0.51, WY, ZG);
    const cable = pipeMesh([
      new THREE.Vector3(0.70, FRAME_TOP_Y + 0.26, -0.45), new THREE.Vector3(0.72, -0.10, -0.42),
      new THREE.Vector3(0.72, 0.30, -0.34), new THREE.Vector3(0.68, 0.62, -0.10),
      new THREE.Vector3(0.60, 0.78, 0.22), plug], 0.017, fx.cableRed, 40);
    root.add(cable.mesh);
    const strap = pipeMesh([
      new THREE.Vector3(0.50, FRAME_TOP_Y + 0.26, -0.45), new THREE.Vector3(0.42, -0.40, -0.50),
      new THREE.Vector3(0.40, FRAME_TOP_Y + 0.005, -0.52)], 0.014, fx.cableBlk, 12);
    root.add(strap.mesh);
    const beadsC = makeBeads(cable.curve, 8, fx.beadAmp, 0.013);
    root.add(beadsC.mesh);

    /* 11f. animation */
    let phC = 0;
    const WORM_RATIO = 8;                                    /* drawn worm turns per column turn (fewer than real, so it stays readable) */
    function update(c) {
      const mag = Math.abs(c.e);
      const tw = c.e * 18 * DEG;                             /* ≈ 4.5° real, × 4 for visibility */
      ringIn.rotation.z  = c.theta + tw / 2;
      ringOut.rotation.z = c.theta - tw / 2;
      wormWheel.rotation.z = c.theta;
      worm.rotation.x = c.theta * WORM_RATIO;

      fx.motor.emissiveIntensity     = 0.3 + mag * 1.8;
      fx.motorBand.emissiveIntensity = 0.4 + mag * 1.4;
      fx.signal.emissiveIntensity    = 0.3 + mag * 0.9;
      fx.cableRed.emissiveIntensity  = 0.25 + mag * 1.2;
      ecuLed.material.color.setHex(mag > 0.05 ? 0x22c55e : 0x334155);

      phC += c.dtA * (0.15 + 0.9 * mag);                     /* current only while the motor assists */
      beadsC.set(phC);
    }

    const midC = cable.curve.getPointAt(0.45);
    const labelDefs = [
      { id: 'e-wheel',  text: 'Steering wheel',                  obj: A.wheelSpin, off: new THREE.Vector3(0, 0.30, 0) },
      { id: 'e-sensor', text: 'Torque sensor (torsion bar)',     obj: gear, off: new THREE.Vector3(-0.078, cy, ZS), kind: 'control' },
      { id: 'e-ecu',    text: 'ECU (assist controller)',         obj: gear, off: new THREE.Vector3(0.42, WY + 0.075, ZG), kind: 'control' },
      { id: 'e-motor',  text: 'Electric assist motor',           obj: gear, off: new THREE.Vector3(0.24, WY + 0.075, ZG), kind: 'electrical' },
      { id: 'e-worm',   text: 'Worm gear',                       obj: gear, off: new THREE.Vector3(0.0, WY - 0.03, ZG), kind: 'mechanical' },
      { id: 'e-wwheel', text: 'Worm wheel on column',            obj: gear, off: new THREE.Vector3(-0.098, cy, ZG) },
      { id: 'e-harn',   text: 'Sensor wiring',                   obj: gear, off: new THREE.Vector3(0.34, cy - 0.07, ZS - 0.03), kind: 'electrical' },
      { id: 'e-batt',   text: 'Battery 12 V',                    obj: root, off: new THREE.Vector3(0.60, FRAME_TOP_Y + 0.22, -0.45), kind: 'electrical' },
      { id: 'e-cable',  text: 'Power cable',                     obj: root, off: midC, kind: 'electrical' },
      { id: 'e-col',    text: 'Steering column',                 obj: gear, off: new THREE.Vector3(0.0, cy, 1.30) },
      { id: 'e-pinion', text: 'Pinion gear',                     obj: gear, off: new THREE.Vector3(0.09, cy - 0.04, -0.04) },
      { id: 'e-rack',   text: 'Rack',                            obj: gear, off: new THREE.Vector3(-0.70, 0, 0) },
      { id: 'e-tie',    text: 'Tie rod',                         obj: A.tieRodR, off: new THREE.Vector3(0, 0, 0) }
    ];

    return {
      A, group: root, update, labelDefs,
      title: 'Electric Power Steering (EPS)',
      kicker: 'Steering · Modern',
      badge: { text: 'Electric Assist', color: '#8b5cf6' },
      desc: `<strong>Electric power steering (column-assist type).</strong> No pump, no fluid, no belt. A
             <strong>torque sensor</strong> on the steering shaft measures how far the driver twists a short
             <strong>torsion bar</strong> (drawn 4× larger). The <strong>ECU</strong>, powered from the
             <strong>12 V battery</strong>, reads that torque together with vehicle speed and decides how much
             assist to give. It drives the <strong>electric motor</strong>; the motor's <strong>worm gear</strong>
             turns a <strong>worm wheel</strong> fixed to the column, which both slows the motor and multiplies its
             torque. Motor torque adds to the driver's torque on the column, passes through the universal joint to
             the <strong>pinion</strong> and moves the <strong>rack</strong> exactly as in the manual system.
             The motor draws current only while it is assisting, and the ECU can give a lot of assist when parking
             and little at speed. Other layouts mount the motor on the pinion or directly on the rack.`
    };
  }

  /* ═══════════════════════════════════════════════════════════
     11b. THE THREE RIGS + LABELS
     ═══════════════════════════════════════════════════════════ */
  const rackAsm = buildRackAssembly({});
  const rigs = {
    rack: {
      A: rackAsm, group: rackAsm.root, update: null,
      labelDefs: [
        { id: 'wheel',  text: 'Steering wheel',   pos: new THREE.Vector3( 0.00, 1.74,  0.72) },
        { id: 'column', text: 'Steering column',  pos: new THREE.Vector3( 0.55, 0.92,  0.35) },
        { id: 'pinion', text: 'Pinion gear',      pos: new THREE.Vector3( 0.48, 0.24, -0.24) },
        { id: 'rack',   text: 'Rack',             pos: new THREE.Vector3(-0.95, 0.28,  0.05) },
        { id: 'tieL',   text: 'Tie rod (L)',      pos: new THREE.Vector3(-1.78, 0.10,  0.02) },
        { id: 'tieR',   text: 'Tie rod (R)',      pos: new THREE.Vector3( 1.78, 0.10,  0.02) },
        { id: 'armL',   text: 'Steering arm (L)', pos: new THREE.Vector3(-2.10,-0.12,  0.32) },
        { id: 'armR',   text: 'Steering arm (R)', pos: new THREE.Vector3( 2.10,-0.12,  0.32) },
        { id: 'roadL',  text: 'Road wheel (L)',   pos: new THREE.Vector3(-2.48, 0.34, -0.35) },
        { id: 'roadR',  text: 'Road wheel (R)',   pos: new THREE.Vector3( 2.48, 0.34, -0.35) }
      ]
    },
    hydraulic: buildHydraulicRig(),
    eps:       buildElectricRig()
  };
  const rigRoot = new THREE.Group();
  scene.add(rigRoot);
  Object.values(rigs).forEach(r => {
    r.group.visible = false;
    rigRoot.add(r.group);
    r.labelDefs.forEach(d => labels.add(d.id, d.text, d.kind ? { kind: d.kind } : undefined));
  });
  const _lp = new THREE.Vector3();
  function labelPos(d) {
    if (d.pos) return d.pos;
    _lp.copy(d.off);
    d.obj.localToWorld(_lp);
    return _lp;
  }

  /* ═══════════════════════════════════════════════════════════
     12. UI — kit chrome + steering-wheel widget
     ═══════════════════════════════════════════════════════════ */
  const ui = UI.create({
    moduleId: 'steering',

    panel: {
      kicker: 'Steering',
      title:  'Rack-and-Pinion Steering System',
      badge:  { text: 'Steering', color: '#a855f7' },
      readout: `
        <div id="steer-readout">
          <div class="steer-row"><span data-steer-lbl="wheel">Wheel angle</span><b data-steer="wheel">0°</b></div>
          <div class="steer-row"><span data-steer-lbl="rack">Rack travel</span><b data-steer="rack">0.000</b></div>
          <div class="steer-row"><span data-steer-lbl="road">Road wheel</span><b data-steer="road">0.0°</b></div>
        </div>
      `,
      desc: `<strong>Rack-and-pinion steering.</strong> Turning the <strong>steering wheel</strong>
             rotates the <strong>steering column</strong>, which turns the <strong>pinion gear</strong>.
             The pinion teeth mesh with the <strong>rack</strong> — a flat bar with teeth cut along it —
             so every turn of the pinion slides the rack sideways by
             <em>rack travel = pinion radius × pinion angle</em>. <strong>Tie rods</strong> bolted to
             each end of the rack push or pull the <strong>steering arms</strong> on the front wheels,
             which pivot about their <strong>kingpins</strong> — so both road wheels steer in unison.
             Drag the wheel on the right to steer; release it and it self-centres.`
    },

    monitor: {
      config: { label: 'Live steering', value: { label: 'Live steering', unit: '°', max: 100, bar: true }, rows: [['rack', 'Rack'], ['road', 'Road'], ['drv', 'Driver torque'], ['asst', 'Assist']], status: { text: 'Centred' } },
      initial: { value: { text: '0', unit: '°' }, rows: { rack: '0.000', road: '0.0°', drv: '0.0 N·m', asst: 'None' }, status: ['Centred', false] }
    },

    toolbar: {
      play: true, reset: true,
      speed: { label: 'Speed', min: 0.15, max: 2.5, step: 0.05, value: 0.85 },
      labels: true, gas: true
    },

    /* Phase 5: the steering wheel is a controls.js dial (id 'wheel', ±180°, springs back to centre).
       Registry −1..1, positive = clockwise = a RIGHT turn (→ key, clockwise drag). The simulation keeps its own
       sign convention (steerAngle > 0 = left), so it reads steerAngle = −dial · WHEEL_MAX_ANGLE.
       Enter / Home = centre: the one reset path (replaces the old centre button).
       k = 4.68 s⁻¹ is the old per-frame return (return rate 4.5 → 0.925 / frame at 60 Hz) as a time constant. */
    axes: [
      { id: 'wheel', type: 'dial', look: 'wheel', label: 'Steering', ariaLabel: 'Steering wheel',
        range: 360, def: 0, step: 1, spring: 'return', k: 4.68, side: 'right' }
    ]
  });

  /* Panel readout refs */
  const panelBody      = ui.panel.body;
  const elWheelAngle   = panelBody ? panelBody.querySelector('[data-steer="wheel"]') : null;
  const elRackTravel   = panelBody ? panelBody.querySelector('[data-steer="rack"]') : null;
  const elRoadAngle    = panelBody ? panelBody.querySelector('[data-steer="road"]') : null;
  const elRackLabel    = panelBody ? panelBody.querySelector('[data-steer-lbl="rack"]') : null;
  const elRoadLabel    = panelBody ? panelBody.querySelector('[data-steer-lbl="road"]') : null;

  const strokeDescEl   = document.getElementById('stroke-desc');
  const badgeEl        = document.getElementById('stroke-badge');
  const badgeTextEl    = document.getElementById('badge-text');
  const moduleTitleEl  = document.getElementById('module-title');
  const moduleKickerEl = document.getElementById('module-kicker');

  /* ═══════════════════════════════════════════════════════════
     13. STEERING-SYSTEM CONFIG SWITCHER
     ═══════════════════════════════════════════════════════════ */
  const RACK_INFO = {
    title:  'Rack-and-Pinion Steering System',
    kicker: 'Steering',
    badge:  { text: 'Steering', color: '#a855f7' },
    desc:   `<strong>Rack-and-pinion steering.</strong> Turning the <strong>steering wheel</strong>
             rotates the <strong>steering column</strong>, which turns the <strong>pinion gear</strong>.
             The pinion teeth mesh with the <strong>rack</strong> — a flat bar with teeth cut along it —
             so every turn of the pinion slides the rack sideways by
             <em>rack travel = pinion radius × pinion angle</em>. <strong>Tie rods</strong> bolted to
             each end of the rack push or pull the <strong>steering arms</strong> on the front wheels,
             which pivot about their <strong>kingpins</strong> — so both road wheels steer in unison.
             Drag the wheel on the right to steer; release it and it self-centres.`
  };

  const CONFIG_ORDER  = ['rack', 'hydraulic', 'eps'];
  const CONFIG_LABELS = {
    rack:      'Rack & Pinion',
    hydraulic: 'Hydraulic Power',
    eps:       'Electric Power'
  };
  const CONFIG_SUBTITLE_ROWS = {
    rack:      { rack: 'Rack travel', road: 'Road wheel' },
    hydraulic: { rack: 'Rack travel', road: 'Road wheel' },
    eps:       { rack: 'Rack travel', road: 'Road wheel' }
  };
  /* label of the Monitor's `asst` row follows the system */
  const ASSIST_LABEL = { rack: 'Assist', hydraulic: 'Assist pressure', eps: 'Motor assist' };

  let activeConfig = 'rack';

  /* Phase 6: the steering-system switcher is a dock choice (replaces the ‹ › arrows + label) */
  ui.addOptions([
    { id: 'config', type: 'choice', layout: 'select', label: 'Steering system', options: CONFIG_ORDER.map(id => ({ id, label: CONFIG_LABELS[id] })) }
  ]);

  function applyConfig(id) {
    activeConfig = id;

    Object.keys(rigs).forEach(k => { rigs[k].group.visible = (k === id); });

    ui.controls.set('config', CONFIG_ORDER.indexOf(id));          /* keep the dock choice in step */

    const info = (id === 'rack') ? RACK_INFO : rigs[id];

    if (moduleTitleEl)  moduleTitleEl.textContent  = info.title;
    if (moduleKickerEl) moduleKickerEl.textContent = info.kicker || 'Steering Systems';
    if (strokeDescEl)   strokeDescEl.innerHTML     = info.desc;

    if (badgeTextEl) badgeTextEl.textContent = info.badge.text;
    if (badgeEl) {
      badgeEl.style.background = `color-mix(in oklch, ${info.badge.color} 18%, transparent)`;
      badgeEl.style.color = info.badge.color;
      const dot = badgeEl.querySelector('.dot');
      if (dot) dot.style.background = info.badge.color;
    }

    const rowLabels = CONFIG_SUBTITLE_ROWS[id];
    if (elRackLabel) elRackLabel.textContent = rowLabels.rack;
    if (elRoadLabel) elRoadLabel.textContent = rowLabels.road;

    ui.monitor.update({ rowLabels: { asst: ASSIST_LABEL[id] } });
    ui.controls.set('wheel', 0);
    labels.hideAll();
  }

  ui.controls.on('config', (i) => { const id = CONFIG_ORDER[i]; if (id !== activeConfig) applyConfig(id); });

  applyConfig('rack');

  /* ═══════════════════════════════════════════════════════════
     14. BRIDGE
     ═══════════════════════════════════════════════════════════ */
  const bridge = ui.wireBridge({
    viewManager,
    state,
    onCommand: (d) => {
      switch (d.action) {
        case 'reset': ui.controls.resetAll(); break;
        case 'setConfig': if (CONFIG_ORDER.indexOf(d.value) >= 0) applyConfig(d.value); break;
      }
    }
  });
  bridge.ready();
  bridge.setStatus('Steering', '#a855f7');

  /* ═══════════════════════════════════════════════════════════
     15. KINEMATICS
     ═══════════════════════════════════════════════════════════ */
  const _p0 = new THREE.Vector3();
  const _p1 = new THREE.Vector3();

  function worldArmTip(wheelGroup, angleY) {
    const s = Math.sin(angleY), c = Math.cos(angleY);
    return new THREE.Vector3(
      wheelGroup.position.x + s * STEER_ARM_LEN,
      wheelGroup.position.y + STEER_ARM_Y,
      wheelGroup.position.z + c * STEER_ARM_LEN
    );
  }

  /* The shared kinematics: wheel, pinion, rack, road wheels and tie rods of whichever rig is on show. */
  function applyKinematics(A, theta, rackOffset, roadAngle) {
    A.pinionSpin.rotation.z = theta;
    A.wheelSpin.rotation.z  = theta;
    A.rackGroup.position.x  = rackOffset;
    A.wheelL.rotation.y     = roadAngle;
    A.wheelR.rotation.y     = roadAngle;

    _p0.set(-RACK_HALF + rackOffset, 0, 0);
    _p1.copy(worldArmTip(A.wheelL, roadAngle));
    alignTieRod(A.tieRodL, _p0, _p1);

    _p0.set( RACK_HALF + rackOffset, 0, 0);
    _p1.copy(worldArmTip(A.wheelR, roadAngle));
    alignTieRod(A.tieRodR, _p0, _p1);
  }

  /* Steering effort model (illustrative, not a vehicle simulation).
     e in −1..1, positive = steering towards +steerAngle (left): a held part that grows with lock
     (self-aligning torque) plus a part that follows how fast the wheel is turned (tyre / seal friction). */
  const LOAD_NM        = 10;      /* torque needed at the column with no assist, full effort */
  const HYD_SHARE      = 0.72;    /* share of that torque the hydraulic boost supplies        */
  const EPS_SHARE      = 0.75;    /* share the electric motor supplies (parking-speed map)     */
  let prevAngle = 0, omegaF = 0, animT = 0;

  function updateSteering(dt) {
    /* the dial owns the angle (drag, ←/→, spring-back); clockwise = right = steerAngle < 0 */
    steerAngle = -ui.controls.get('wheel') * WHEEL_MAX_ANGLE;

    const rackOffset = PINION_R * steerAngle;
    const roadAngle  = Math.asin(
      Math.max(-1, Math.min(1, rackOffset / STEER_ARM_LEN))
    );

    if (dt > 0) {
      omegaF += ((steerAngle - prevAngle) / dt - omegaF) * Math.min(1, dt * 12);
      animT  += state.playing ? dt * state.speedMul : 0;
    }
    prevAngle = steerAngle;
    const e = Math.max(-1, Math.min(1, 0.40 * steerAngle / Math.PI + 0.60 * Math.max(-1, Math.min(1, omegaF / 2.2))));
    const mag = Math.abs(e);

    const rig = rigs[activeConfig];
    applyKinematics(rig.A, steerAngle, rackOffset, roadAngle);
    if (rig.update) rig.update({
      theta: steerAngle, rackOffset, roadAngle, e, omega: omegaF,
      dt, dtA: state.playing ? dt * state.speedMul : 0, t: animT
    });

    /* readouts: driver torque falls when a system assists; the assist row follows the system */
    const load = LOAD_NM * mag;
    let drv = load, asst = 'None';
    if (activeConfig === 'hydraulic') { drv = load * (1 - HYD_SHARE); asst = Math.round(4 + 86 * mag) + ' bar'; }
    if (activeConfig === 'eps')       { drv = load * (1 - EPS_SHARE); asst = (load * EPS_SHARE).toFixed(1) + ' N·m'; }

    const wDeg = Math.round(steerAngle / DEG);
    const rOff = rackOffset.toFixed(3);
    const rDeg = (roadAngle / DEG).toFixed(1);

    if (elWheelAngle) elWheelAngle.textContent = wDeg + '°';
    if (elRackTravel) elRackTravel.textContent = rOff;
    if (elRoadAngle)  elRoadAngle.textContent  = rDeg + '°';

    const isActive = Math.abs(steerAngle) > 0.01;
    ui.monitor.update({
      value: { text: String(wDeg), unit: '°', bar: Math.min(100, Math.abs(steerAngle) / WHEEL_MAX_ANGLE * 100), barColor: isActive ? '#a855f7' : '#38bdf8' },
      rows: { rack: rOff, road: rDeg + '°', drv: drv.toFixed(1) + ' N·m', asst },
      status: [isActive ? 'Steering' : 'Centred', !isActive]
    });
  }

  /* ═══════════════════════════════════════════════════════════
     16. RENDER LOOP
     ═══════════════════════════════════════════════════════════ */
  const clock = new THREE.Clock();
  let frame = 0;
  let renderErrorLogged = false;

  function animate() {
    requestAnimationFrame(animate);
    try {
      frame++;
      const dt = Math.min(clock.getDelta(), 0.05);

      updateSteering(dt);

      if (state.showLabels && frame % 2 === 0) {
        rigs[activeConfig].labelDefs.forEach(d => labels.project(d.id, labelPos(d), camera, wrap));
      } else if (!state.showLabels) {
        labels.hideAll();
      }

      const t = performance.now() * 0.001;
      purpleLight.intensity = 55 + Math.sin(t * 1.4) * 10;
      cyanLight.intensity   = 42 + Math.sin(t * 1.1 + 1.5) * 8;

      /* Idle pulse on the wheel markers so the scene visibly breathes even
         before any interaction — helps confirm the render loop is alive. */
      const pulse = 0.75 + 0.35 * Math.sin(t * 2.2);
      if (mat.markerViolet) mat.markerViolet.emissiveIntensity = 1.0 + pulse * 0.6;
      if (mat.markerBlue)   mat.markerBlue.emissiveIntensity   = 1.0 + pulse * 0.5;
      if (mat.markerAmber)  mat.markerAmber.emissiveIntensity  = 1.0 + pulse * 0.5;

      controls.update();
      renderer.render(scene, camera);
    } catch (err) {
      if (!renderErrorLogged) {
        renderErrorLogged = true;
        console.error('[Steering] render error:', err);
      }
    }
  }

  updateSteering(0);
  animate();
  </script>
</body>
</html>
