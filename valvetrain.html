<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valvetrain · Auto Lab</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="controls.css">
<link rel="stylesheet" href="components.css">
<style>
:root { --al-accent: #d946ef; }
html.light-theme { --al-accent: #a21caf; }
.ui-tb-btn.active{outline:2px solid var(--al-accent);color:var(--al-accent);}
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<div id="labels-root"></div>

<script src="guard.js"></script>
  <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as Base from './kit.js';
import { Widgets } from './components.js';

/* ═══════════════════════════════════════════════════════════════════════
   CONFIG
   ═══════════════════════════════════════════════════════════════════════ */
const CFG = {
  moduleId: 'valvetrain',
  accent:   '#d946ef',
  cycleHz:  0.9,          // cam revs/sec at speedMul = 1
  maxLift:  0.34          // 3D lift travel (visually ~10 mm)
};

const state = Base.createUIState();

/* ═══════════════════════════════════════════════════════════════════════
   SCENE
   ═══════════════════════════════════════════════════════════════════════ */
const built = Base.buildScene({
  fov: 42,
  camPos: [5.4, 4.0, 7.6],
  target: [0, 0.10, 0],
  floorY: -1.55,
  fogDensity: 0.030
});
const { scene, camera, renderer, controls, wrap, viewManager, quality } = built;
Base.attachResize(camera, renderer, wrap, built.baseFov);
const lowEnd = quality.isLowEnd;

/* ═══════════════════════════════════════════════════════════════════════
   MATERIALS & GEOMETRY
   ═══════════════════════════════════════════════════════════════════════ */
const M = Base.createMaterials();
const root = new THREE.Group();
scene.add(root);

/* Cam steel & valve materials */
const camMat  = new THREE.MeshStandardMaterial({ color: 0xb8c0cc, metalness: 0.88, roughness: 0.22 });
const lobeMat = new THREE.MeshStandardMaterial({ color: 0x8a93a5, metalness: 0.85, roughness: 0.28 });
const valveIn = new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness: 0.75, roughness: 0.30 });
const valveEx = new THREE.MeshStandardMaterial({ color: 0xf97316, metalness: 0.75, roughness: 0.30 });
const headMat = new THREE.MeshStandardMaterial({ color: 0x4a5160, metalness: 0.55, roughness: 0.55 });
const bucketMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.80, roughness: 0.25 });
const springMat = new THREE.MeshStandardMaterial({ color: 0x9aa3b2, metalness: 0.70, roughness: 0.40 });
const retainerMat = new THREE.MeshStandardMaterial({ color: 0x6b7280, metalness: 0.80, roughness: 0.32 });

/* --- Cylinder head block (partial cutaway) --- */
const head = new THREE.Mesh(new THREE.BoxGeometry(2.9, 0.55, 1.4), headMat);
head.position.set(0, -1.20, 0);
head.castShadow = true;
head.receiveShadow = true;
root.add(head);

/* Combustion chamber roof + valve seats */
const chamber = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.10, 1.0), headMat);
chamber.position.set(0, -0.92, 0);
chamber.castShadow = true;
root.add(chamber);

/* --- Valve guide sleeves (two, vertical) --- */
const guideGeo = new THREE.CylinderGeometry(0.10, 0.10, 0.55, 14);
const guideMat = new THREE.MeshStandardMaterial({ color: 0x556074, metalness: 0.70, roughness: 0.45 });

/* --- Valve stems & springs (intake X=-0.55, exhaust X=+0.55) --- */
const valveStemGeo = new THREE.CylinderGeometry(0.055, 0.055, 1.35, 14);
const valveHeadGeo = new THREE.CylinderGeometry(0.16, 0.20, 0.09, 18);
const bucketGeo = new THREE.CylinderGeometry(0.16, 0.16, 0.14, 18);

/* spring: helix of thick wire, built once, cloned */
const springGeo = new THREE.TubeGeometry(
  new THREE.CatmullRomCurve3(
    Array.from({ length: 61 }, (_, i) => {
      const t = i / 60;
      const a = t * 7 * Math.PI * 2;
      return new THREE.Vector3(Math.cos(a) * 0.14, t * 0.42, Math.sin(a) * 0.14);
    })
  ),
  lowEnd ? 40 : 70, 0.022, 6, false
);

const VALVES = [
  { id: 'in', label: 'Intake',  x: -0.55, mat: valveIn, camOffset: 0.0 },
  { id: 'ex', label: 'Exhaust', x:  0.55, mat: valveEx, camOffset: 0.5 }
];

VALVES.forEach(v => {
  const g = new THREE.Group();
  g.position.set(v.x, -0.65, 0);
  root.add(g);

  /* guide sleeve */
  const guide = new THREE.Mesh(guideGeo, guideMat);
  guide.position.set(v.x, -1.00, 0);
  root.add(guide);

  /* moving group: everything that moves with the valve */
  const moving = new THREE.Group();
  g.add(moving);

  /* stem */
  const stem = new THREE.Mesh(valveStemGeo, v.mat);
  stem.position.y = 0.55;
  stem.castShadow = true;
  moving.add(stem);

  /* valve head (mushroom) */
  const vhead = new THREE.Mesh(valveHeadGeo, v.mat);
  vhead.position.y = -0.12;
  vhead.castShadow = true;
  moving.add(vhead);

  /* retainer */
  const retainer = new THREE.Mesh(bucketGeo, retainerMat);
  retainer.position.y = 0.80;
  retainer.scale.set(0.55, 0.6, 0.55);
  moving.add(retainer);

  /* spring (below retainer, above head) */
  const spring = new THREE.Mesh(springGeo, springMat);
  spring.position.y = 0.18;
  moving.add(spring);

  /* bucket / tappet (contact face for cam) */
  const bucket = new THREE.Mesh(bucketGeo, bucketMat);
  bucket.position.y = 1.10;
  bucket.castShadow = true;
  moving.add(bucket);

  v.group = g;
  v.moving = moving;
  v.baseY = 0;   // rest position of moving group (set once)
});

/* --- Camshafts (two, running along Z, above each valve) --- */
const CAM_Y = 1.05;
const camBaseGeo = new THREE.CylinderGeometry(0.22, 0.22, 1.30, lowEnd ? 16 : 24);
const camLobeGeo = new THREE.CylinderGeometry(0.13, 0.13, 1.34, lowEnd ? 14 : 20);
const camShaftGeo = new THREE.CylinderGeometry(0.07, 0.07, 1.65, lowEnd ? 10 : 14);

VALVES.forEach(v => {
  const camGroup = new THREE.Group();
  camGroup.position.set(v.x, CAM_Y, 0);
  root.add(camGroup);

  /* shaft */
  const shaft = new THREE.Mesh(camShaftGeo, camMat);
  shaft.rotation.x = Math.PI / 2;
  camGroup.add(shaft);

  /* base circle */
  const base = new THREE.Mesh(camBaseGeo, camMat);
  base.rotation.x = Math.PI / 2;
  camGroup.add(base);

  /* lobe: offset cylinder that produces the bump */
  const lobe = new THREE.Mesh(camLobeGeo, lobeMat);
  lobe.rotation.x = Math.PI / 2;
  lobe.position.set(0.18, 0, 0);
  camGroup.add(lobe);

  v.cam = camGroup;
  v.cam.rotation.z = 0;
});

/* --- Cam sprockets (visual, one per camshaft) --- */
VALVES.forEach(v => {
  const sprocket = Base.makeCog(0.26, 0.10, lowEnd ? 16 : 22, 0.06, 0.10, camMat, camMat);
  sprocket.rotation.x = Math.PI / 2;
  sprocket.position.set(v.x, CAM_Y, 0.85);
  v.cam.add(sprocket);
});

/* ═══════════════════════════════════════════════════════════════════════
   LABELS
   ═══════════════════════════════════════════════════════════════════════ */
const labels = Base.createLabelSystem();
labels.add('cam-in',  'Intake cam');
labels.add('cam-ex',  'Exhaust cam');
labels.add('lobe',    'Cam lobe');
labels.add('bucket',  'Bucket');
labels.add('spring',  'Valve spring');
labels.add('vin',     'Intake valve');
labels.add('vex',     'Exhaust valve');
labels.add('head',    'Cylinder head');
labels.add('seat',    'Valve seat');

/* ═══════════════════════════════════════════════════════════════════════
   UI
   ═══════════════════════════════════════════════════════════════════════ */
const TABS = {
  overview: () => `
    <div class="al-sec">
      <h4>What it does</h4>
      <p>The valvetrain turns camshaft rotation into precise valve opening. Intake valves let air and
      fuel in; exhaust valves let burnt gases out. Timing and lift decide how much air the engine
      can breathe — and therefore how much power it makes.</p>
    </div>
    <div class="al-sec">
      <h4>Cam profile</h4>
      <ul>
        <li><b>Base circle</b> — the round part; valve closed and resting.</li>
        <li><b>Lobe</b> — the bump; pushes the valve open.</li>
        <li><b>Lift</b> — how far the valve opens (typical 8–13 mm).</li>
        <li><b>Duration</b> — crank degrees the valve stays open (typical 220–280°).</li>
        <li><b>Overlap</b> — both valves open together around TDC; helps scavenging.</li>
      </ul>
    </div>
    <div class="al-sec">
      <h4>Layouts</h4>
      <ul>
        <li><b>OHV</b> — cam in block, pushrods and rockers.</li>
        <li><b>SOHC</b> — one cam in the head, rockers or buckets.</li>
        <li><b>DOHC</b> — two cams in the head, direct-acting buckets (shown here).</li>
      </ul>
    </div>
    <div class="al-sec">
      <h4>Variable valve timing (VVT)</h4>
      <p>The ECU rotates the cam relative to the crank via an oil-pressure phaser — typically ±20–40°
      crank. Advancing the intake cam at low rpm improves torque and idle quality; retarding it at
      high rpm improves top-end power.</p>
    </div>`,
  faults: () => `
    <div class="al-sec"><h4>Common faults</h4></div>
    <div class="al-fault">
      <div class="t">Timing belt / chain failure</div>
      <div class="s">Sudden no-start, bent valves on interference engines, sudden power loss.</div>
      <div class="c">Check: belt tension, timing marks vs crank TDC, chain stretch with a scan tool cam/crank correlation code (P0016).</div>
    </div>
    <div class="al-fault">
      <div class="t">Worn cam lobe</div>
      <div class="s">Tick-tick noise, misfire on one cylinder, low compression, rough idle.</div>
      <div class="c">Check: cam lift with a dial indicator (compare across cylinders); inspect oil for metal.</div>
    </div>
    <div class="al-fault">
      <div class="t">VVT phaser / solenoid</div>
      <div class="s">Rough idle, rattling on cold start, P0011 / P0012 codes, power loss.</div>
      <div class="c">Check: solenoid resistance, oil quality (VVT is oil-pressure sensitive), phaser rattle test.</div>
    </div>
    <div class="al-fault">
      <div class="t">Sticking valve</div>
      <div class="s">Rough running, backfire, single-cylinder misfire.</div>
      <div class="c">Check: valve guide wear, valve stem straightness, spring breakage.</div>
    </div>`,
  quiz: () => `
    <div class="al-q" data-a="1">
      <div class="q">1. What does the cam base circle do?</div>
      <button class="al-opt">Pushes the valve open</button>
      <button class="al-opt">Holds the valve closed between events</button>
      <button class="al-opt">Drives the oil pump</button>
      <div class="al-exp">The base circle is the round part of the cam — while the follower is on it, the valve is fully closed and resting on its seat.</div>
    </div>
    <div class="al-q" data-a="2">
      <div class="q">2. Valve overlap happens when…</div>
      <button class="al-opt">Both valves are fully closed</button>
      <button class="al-opt">The piston is at the bottom of its stroke</button>
      <button class="al-opt">Intake and exhaust valves are both slightly open around TDC</button>
      <div class="al-exp">Overlap is the brief window at TDC where exhaust is still closing and intake is already opening — it helps scavenge burnt gases and improves cylinder filling.</div>
    </div>
    <div class="al-q" data-a="0">
      <div class="q">3. Why does the camshaft rotate at half crank speed?</div>
      <button class="al-opt">Because a four-stroke cycle needs two crank revolutions per cam revolution</button>
      <button class="al-opt">Because the cam chain has a 2:1 reduction for the oil pump</button>
      <button class="al-opt">Because valve lift is doubled</button>
      <div class="al-exp">In a 4-stroke engine the full cycle is 720° of crank. Each valve opens once per cycle, so the cam only needs one revolution — a 2:1 reduction from the crank.</div>
    </div>`
};

function readoutHTML() {
  return `<div class="al-read">
    <span class="k">Engine speed</span><span class="v hi" id="ro-rpm">—</span>
    <span class="k">Cam angle</span><span class="v" id="ro-cam">—</span>
    <span class="k">Intake lift</span><span class="v" id="ro-li">—</span>
    <span class="k">Exhaust lift</span><span class="v" id="ro-le">—</span>
    <span class="k">Cam advance</span><span class="v" id="ro-adv">—</span>
    <span class="k">Valve event</span><span class="v" id="ro-ev">—</span>
    <span class="k">Overlap</span><span class="v" id="ro-ov">—</span>
    <span class="k">Volumetric eff.</span><span class="v" id="ro-ve">—</span>
    <span class="k">Torque effect</span><span class="v" id="ro-eff">—</span>
  </div>`;
}

const ui = Base.UI.create({
  moduleId: CFG.moduleId,
  panel: {
    kicker: 'Engine Mechanical',
    title:  'Valvetrain',
    tabs: [
      { id: 'overview', label: 'Overview' },
      { id: 'faults',   label: 'Faults' },
      { id: 'quiz',     label: 'Self-check' }
    ],
    onTab: renderTab,
    badge: { text: 'DOHC · 4-valve', color: CFG.accent },
    readout: readoutHTML()
  },
  monitor: {
    config: { label: 'Engine', value: { label: 'Engine', unit: ' rpm', max: 100, bar: true }, rows: [['in', 'Intake'], ['ex', 'Exhaust']], status: { text: 'Running' } },
    initial: { value: { text: '—', unit: ' rpm' }, rows: { in: '—', ex: '—' }, status: ['Running', false] }
  },
  toolbar: {
    play: true,
    reset: true,
    speed: { label: 'Sim speed', min: 0.15, max: 2.5, step: 0.05, value: 0.85 },
    labels: true
  },
  axes: [{ id: 'adv', min: -20, max: 20, step: 1, def: 0, unit: '°', label: 'Cam advance', side: 'left',
           format: (v) => (v > 0 ? '+' : '') + v + '°', onChange: () => updateReadouts() }],

  /* Phase 6: the +10° step is a controls.js action in the dock options row (replaces the toolbar extra) */
  options: [
    { id: 'advance', type: 'action', label: 'Advance +10\u00b0', ariaLabel: 'Advance the intake cam by 10 degrees', onAction: () => advanceCam() }
  ],
  widgets: {
    br: {
      html: `<div class="al-legend">
        <span><i style="background:#38bdf8"></i>Intake valve</span>
        <span><i style="background:#f97316"></i>Exhaust valve</span>
        <span><i style="background:#b8c0cc"></i>Camshaft</span>
        <span><i style="background:#9aa3b2"></i>Valve spring</span>
      </div>`,
      caption: 'Legend'
    }
  }
});

const tabHost = document.createElement('div');
tabHost.id = 'al-tabs';
tabHost.className = 'al-tabs';
ui.panel.body.appendChild(tabHost);

Widgets.wireQuiz(tabHost);

function renderTab(id) { tabHost.innerHTML = (TABS[id] || TABS.overview)(); }
renderTab('overview');

function advanceCam() {
  const cur = ui.controls.value('adv');
  ui.controls.setValue('adv', cur >= 20 ? -20 : cur + 10);   /* the axis fires onChange -> updateReadouts */
}

/* ═══════════════════════════════════════════════════════════════════════
   READOUTS
   ═══════════════════════════════════════════════════════════════════════ */
const ro = {
  rpm:  document.getElementById('ro-rpm'),
  cam:  document.getElementById('ro-cam'),
  li:   document.getElementById('ro-li'),
  le:   document.getElementById('ro-le'),
  adv:  document.getElementById('ro-adv'),
  ev:   document.getElementById('ro-ev'),
  ov:   document.getElementById('ro-ov'),
  ve:   document.getElementById('ro-ve'),
  eff:  document.getElementById('ro-eff')
};

/* Smooth lift curve — 0 at 0 and 1, peak at 0.5, applied across the event window */
function liftCurve(phase) {
  if (phase < 0 || phase > 1) return 0;
  return 0.5 * (1 - Math.cos(phase * Math.PI * 2));
}

/* Return lift in metres (0 to 1 normalised) for each valve at given cam fraction */
function camEvents(camFrac, advanceDeg) {
  const adv = advanceDeg / 720;   // convert crank degrees to cam fraction
  const intakePhase  = ((camFrac + adv) % 1);
  const exhaustPhase = ((camFrac + 0.5 + adv) % 1);
  const li = liftCurve(intakePhase < 0.5 ? intakePhase * 2 : -1);
  const le = liftCurve(exhaustPhase >= 0.5 ? (exhaustPhase - 0.5) * 2 : -1);
  return { li, le };
}

/* ═══════════════════════════════════════════════════════════════════════
   VOLUMETRIC EFFICIENCY MODEL — ties the VVT phaser to a felt consequence.
   Advancing the intake cam opens the valve earlier in the intake stroke:
   at low rpm this fills the cylinder better (torque peak moves down);
   retarding it closes the valve later relative to piston speed, which
   favours high-rpm ram-air filling at the cost of low-end torque. This
   is a simplified but directionally-real model — not a lookup table of
   real dyno data — so students can feel *why* VVT exists, not just watch
   a slider move a valve.
   ═══════════════════════════════════════════════════════════════════════ */
const VE_BASE_PEAK_RPM = 3400;   // naturally-aspirated peak-torque rpm at 0° advance
const VE_SHIFT_PER_DEG = 35;     // rpm the torque peak moves per degree of advance
const VE_WIDTH_RPM     = 1800;   // curve width (sigma-ish)
const VE_MIN = 0.55, VE_MAX = 0.96;

function volumetricEfficiency(rpm, advanceDeg) {
  const peak = VE_BASE_PEAK_RPM - advanceDeg * VE_SHIFT_PER_DEG;
  const x = (rpm - peak) / VE_WIDTH_RPM;
  return VE_MIN + (VE_MAX - VE_MIN) * Math.exp(-x * x);
}

function updateReadouts() {
  const rpm = Math.round(700 + state.speedMul * 5500);
  const camFrac = (t * CFG.cycleHz) % 1;
  const camDeg = camFrac * 360;
  const ev = camEvents(camFrac, ui.controls.value('adv'));
  const liMm = ev.li * 10.5;
  const leMm = ev.le * 10.5;

  if (ro.rpm) ro.rpm.textContent = rpm.toLocaleString() + ' rpm';
  if (ro.cam) ro.cam.textContent = camDeg.toFixed(0) + '°';
  if (ro.li)  ro.li.textContent  = liMm.toFixed(2) + ' mm';
  if (ro.le)  ro.le.textContent  = leMm.toFixed(2) + ' mm';
  if (ro.adv) {
    ro.adv.textContent = (ui.controls.value('adv') > 0 ? '+' : '') + ui.controls.value('adv') + '°';
    ro.adv.className = 'v ' + (ui.controls.value('adv') !== 0 ? 'warn' : '');
  }

  if (ro.ev) {
    let label = 'Both closed';
    if (ev.li > 0.05 && ev.le > 0.05) label = 'Overlap';
    else if (ev.li > 0.05) label = 'Intake open';
    else if (ev.le > 0.05) label = 'Exhaust open';
    ro.ev.textContent = label;
    ro.ev.className = 'v ' + (label === 'Overlap' ? 'warn' : label === 'Both closed' ? '' : 'ok');
  }

  if (ro.ov) {
    const bothOpen = ev.li > 0.05 && ev.le > 0.05;
    ro.ov.textContent = bothOpen ? 'YES' : 'no';
    ro.ov.className = 'v ' + (bothOpen ? 'warn' : '');
  }

  const ve = volumetricEfficiency(rpm, ui.controls.value('adv'));
  if (ro.ve) {
    ro.ve.textContent = Math.round(ve * 100) + ' %';
    ro.ve.className = 'v ' + (ve > 0.85 ? 'ok' : ve < 0.65 ? 'warn' : '');
  }
  if (ro.eff) {
    let effect, cls;
    if (ui.controls.value('adv') >= 5)      { effect = 'Low-end torque ↑'; cls = 'ok'; }
    else if (ui.controls.value('adv') <= -5) { effect = 'Top-end power ↑'; cls = 'ok'; }
    else                              { effect = 'Balanced';        cls = ''; }
    ro.eff.textContent = effect;
    ro.eff.className = 'v ' + cls;
  }

  ui.monitor.update({
    value: { text: String(rpm), unit: ' rpm', bar: camFrac * 100, barColor: 'var(--al-accent)' },
    rows: { in: (liMm).toFixed(1) + ' mm', ex: (leMm).toFixed(1) + ' mm' },
    status: [ev.li > 0.05 || ev.le > 0.05 ? 'Valve open' : 'Idle', true]
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   MESSAGING
   ═══════════════════════════════════════════════════════════════════════ */
const bridge = ui.wireBridge({
  viewManager,
  state,
  onCommand: (d) => {
    if (d.action === 'reset') {
      ui.controls.resetAll();
      updateReadouts();
    }
  }
});
bridge.ready();
bridge.setStatus('Valvetrain ready', '#d946ef');

/* ═══════════════════════════════════════════════════════════════════════
   ANIMATION
   ═══════════════════════════════════════════════════════════════════════ */
let t = 0;
let last = performance.now();
let raf = 0;
let roClock = 0;

const tmp = new THREE.Vector3();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  const sp = state.playing ? state.speedMul : 0;
  t += dt * sp;

  const camFrac = (t * CFG.cycleHz) % 1;
  const camDeg = camFrac * 360;
  const ev = camEvents(camFrac, ui.controls.value('adv'));

  /* --- rotate cams and translate valves --- */
  VALVES.forEach(v => {
    /* exhaust cam is 180° out of phase with intake */
    const phaseOffset = v.id === 'ex' ? 180 : 0;
    v.cam.rotation.z = -(camDeg + phaseOffset) * Math.PI / 180;

    const liftNorm = v.id === 'in' ? ev.li : ev.le;
    v.moving.position.y = -liftNorm * CFG.maxLift;
  });

  /* --- labels --- */
  labels.hideAll();
  if (state.showLabels) {
    labels.project('cam-in', tmp.set(-0.55, CAM_Y + 0.55, 0), camera, wrap);
    labels.project('cam-ex', tmp.set( 0.55, CAM_Y + 0.55, 0), camera, wrap);
    labels.project('vin',    tmp.set(-0.55, -0.55, 0), camera, wrap);
    labels.project('vex',    tmp.set( 0.55, -0.55, 0), camera, wrap);
    labels.project('bucket', tmp.set(-0.55, CAM_Y - 0.35, 0.35), camera, wrap);
    labels.project('spring', tmp.set( 0.95, -0.15, 0.35), camera, wrap);
    labels.project('head',   tmp.set(0, -1.55, 0.55), camera, wrap);
  }

  controls.update();
  renderer.render(scene, camera);

  roClock += dt;
  if (roClock > 0.12) { roClock = 0; updateReadouts(); }
}

if (reduced) {
  setInterval(() => renderer.render(scene, camera), 120);
} else {
  raf = requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', () => {
  if (reduced) return;
  if (document.hidden) {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  } else if (!raf) {
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }
});

updateReadouts();
</script>
</body>
</html>
