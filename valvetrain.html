  <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import * as Base from './kit.js';
import { Widgets } from './components.js';

/* ═══════════════════════════════════════════════════════════════════════
   CONFIG
   ═══════════════════════════════════════════════════════════════════════ */
const CFG = {
  moduleId: 'valvetrain',
  accent:   '#d946ef',
  cycleHz:  0.9,          // cam revs/sec at speedMul = 1
  maxLift:  0.34          // 3D lift travel (visually ~10 mm)
};

const state = Base.createUIState();

/* ═══════════════════════════════════════════════════════════════════════
   SCENE
   ═══════════════════════════════════════════════════════════════════════ */
const built = Base.buildScene({
  fov: 42,
  camPos: [6.6, 2.4, 9.6],
  target: [0, -0.7, 0],
  floorY: -4.7,
  fogDensity: 0.030
});
const { scene, camera, renderer, controls, wrap, viewManager, quality } = built;
Base.attachResize(camera, renderer, wrap, built.baseFov);
const lowEnd = quality.isLowEnd;

/* ═══════════════════════════════════════════════════════════════════════
   MATERIALS & GEOMETRY
   ═══════════════════════════════════════════════════════════════════════ */
const M = Base.createMaterials();
const root = new THREE.Group();
scene.add(root);

/* ── Valve train: crank → chain → cam → (tappet → pushrod → rocker | bucket) → valve ── */
const DEG = Math.PI / 180, TWO = Math.PI * 2;
const steel = (c, m, r) => new THREE.MeshStandardMaterial({ color: c, metalness: m, roughness: r });
const camMat = steel(0xb8c0cc, .88, .22), lobeMat = steel(0x8a93a5, .85, .28),
  valveIn = steel(0x38bdf8, .75, .3), valveEx = steel(0xf97316, .75, .3), headMat = steel(0x4a5160, .55, .55),
  tapMat = steel(0x94a3b8, .8, .25), springMat = steel(0x9aa3b2, .7, .4), retMat = steel(0x6b7280, .8, .32),
  rodMat = steel(0xcbd5e1, .7, .3), crankMat = steel(0x7b8497, .8, .35), chainMat = steel(0x3b4252, .7, .4),
  guideMat = steel(0x556074, .7, .45), seatMat = steel(0x2b303b, .6, .5);
const glassMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, transparent: true, opacity: .16, side: THREE.DoubleSide, depthWrite: false });
const tapD = tapMat.clone(); tapD.side = THREE.DoubleSide;
const seg = lowEnd ? 14 : 22;
const put = (geo, mat, p, par) => { const o = new THREE.Mesh(geo, mat); o.position.set(p[0], p[1], p[2]); o.castShadow = true; par.add(o); return o; };
const cyl = (rt, rb, h, mat, p, par, open) => put(new THREE.CylinderGeometry(rt, rb, h, seg, 1, !!open), mat, p, par);
const cylZ = (r, h, mat, p, par) => { const o = cyl(r, r, h, mat, p, par); o.rotation.x = Math.PI / 2; return o; };
const boxM = (w, h, d, mat, p, par) => put(new THREE.BoxGeometry(w, h, d), mat, p, par);
const cog = (r, th, n, tl, tw, par, z, mat) => { const c = Base.makeCog(r, th, n, tl, tw, mat || camMat, mat || camMat); c.rotation.x = Math.PI / 2; c.position.z = z; par.add(c); return c; };

const ohvG = new THREE.Group(), dohcG = new THREE.Group();
root.add(ohvG, dohcG); dohcG.visible = false;

/* cylinder head cutaway (floor plate, deck plate, glass walls) + liner */
boxM(3.8, .12, 1.9, headMat, [0, .06, 0], root);
boxM(3.8, .10, 1.9, headMat, [0, .77, 0], root);
boxM(3.8, .65, 1.9, glassMat, [0, .42, 0], root);
cyl(1, 1, 2.7, glassMat, [0, -1.35, 0], root, true);

/* crankshaft, piston, connecting rod */
const CY = -3.1, CR = .6, RL = 1.9;
const crank = new THREE.Group(); crank.position.set(0, CY, 0); root.add(crank);
cylZ(.2, 3.2, crankMat, [0, 0, .1], crank);
[-.32, .32].forEach(z => { cylZ(.46, .14, crankMat, [0, 0, z], crank); boxM(1.0, .55, .14, crankMat, [0, -.62, z], crank); });
cylZ(.17, .7, crankMat, [0, CR, 0], crank);
cog(.26, .1, 12, .08, .07, crank, 1.5, crankMat);
const piston = new THREE.Group(); root.add(piston);
cyl(.92, .92, .14, tapMat, [0, -.07, 0], piston);
cyl(.92, .92, .75, tapD, [0, -.375, 0], piston, true);
[-.1, -.2, -.3].forEach(y => cyl(.95, .95, .035, retMat, [0, y, 0], piston));
cylZ(.13, 1.7, rodMat, [0, -.45, 0], piston);
const rod = new THREE.Group(); root.add(rod);
cyl(.07, .1, RL, rodMat, [0, RL / 2, 0], rod); cylZ(.25, .3, rodMat, [0, 0, 0], rod); cylZ(.15, .4, rodMat, [0, RL, 0], rod);
function setMech(phi) {
  const s = Math.sin(phi * DEG), c = Math.cos(phi * DEG), yp = CR * c + Math.sqrt(RL * RL - CR * CR * s * s);
  crank.rotation.z = -phi * DEG;
  piston.position.y = CY + yp + .45;
  rod.position.set(CR * s, CY + CR * c, 0);
  rod.rotation.z = -Math.atan2(-CR * s, yp - CR * c);
}

/* valve assembly: seat, guide, fixed retainer, spring, valve, upper retainer (+ bucket for DOHC) */
function buildValve(par, mat, x, z, bucket) {
  const g = new THREE.Group(); g.position.set(x, 0, z); par.add(g);
  const seat = put(new THREE.TorusGeometry(.19, .035, 8, 20), seatMat, [0, 0, 0], g); seat.rotation.x = Math.PI / 2;
  cyl(.08, .08, .7, guideMat, [0, .47, 0], g);
  cyl(.2, .2, .05, retMat, [0, .8, 0], g);
  const sp = Base.makeHelixSpring(.14, .022, 7, 1, springMat, lowEnd ? 50 : 80); sp.position.y = .82; sp.castShadow = true; g.add(sp);
  const mv = new THREE.Group(); g.add(mv);
  cyl(.06, .2, .1, mat, [0, -.03, 0], mv); cyl(.05, .05, 1.95, mat, [0, .97, 0], mv);
  cyl(.2, .2, .05, retMat, [0, 1.45, 0], mv); cyl(.09, .09, .1, retMat, [0, 1.5, 0], mv);
  if (bucket) cyl(.24, .24, .16, tapMat, [0, 1.85, 0], mv);
  return { g, mv, sp };
}

/* camshaft with real teardrop lobes (lift curve = the same cosine bump the model uses) */
function lobeGeo(L) {
  const sh = new THREE.Shape(), w = 65 * DEG;
  for (let i = 0; i < 90; i++) {
    const a = i * 4 * DEG, d = a > Math.PI ? a - TWO : a;
    const r = .28 + (Math.abs(d) < w ? L * .5 * (1 + Math.cos(Math.PI * d / w)) : 0);
    const x = -r * Math.sin(a), y = r * Math.cos(a);
    i ? sh.lineTo(x, y) : sh.moveTo(x, y);
  }
  const g = new THREE.ExtrudeGeometry(sh, { depth: .26, bevelEnabled: false }); g.translate(0, 0, -.13); return g;
}
const cams = [];
function buildCam(par, pos, L, lobes, dir, base) {
  const grp = new THREE.Group(); grp.position.set(pos[0], pos[1], 0); par.add(grp);
  cylZ(.1, 2.5, camMat, [0, 0, .25], grp);
  [-.95, 0, .95].forEach(z => cylZ(.16, .16, camMat, [0, 0, z], grp));
  const lg = lobeGeo(L), ls = lobes.map(([k, z]) => ({ k, m: put(lg, lobeMat, [0, 0, z], grp) }));
  const c = { grp, lobes: ls, dir, base }; cams.push(c); return c;
}

/* timing chain: link instances travelling round a crank + cam sprocket hull */
function beltPts(a, ra, b, rb) {
  const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy), al = Math.atan2(dy, dx), be = Math.acos((ra - rb) / d), P = [];
  const arc = (c, r, s, e) => { const n = Math.max(4, Math.ceil(Math.abs(e - s) * r / .05)); for (let i = 0; i <= n; i++) { const q = s + (e - s) * i / n; P.push([c[0] + r * Math.cos(q), c[1] + r * Math.sin(q)]); } };
  arc(a, ra, al + be, al + TWO - be); arc(b, rb, al - be, al + be); return P;
}
function makeChain(par, a, ra, b, rb, z) {
  const P = beltPts(a, ra, b, rb), n = P.length, cum = [0];
  for (let i = 1; i <= n; i++) { const p = P[i % n], q = P[i - 1]; cum.push(cum[i - 1] + Math.hypot(p[0] - q[0], p[1] - q[1])); }
  const tot = cum[n], N = Math.round(tot / .11), im = new THREE.InstancedMesh(new THREE.BoxGeometry(.08, .05, .1), chainMat, N), o = new THREE.Object3D();
  par.add(im);
  return { update(off) {
    for (let k = 0; k < N; k++) {
      const s = (((k / N) * tot + off) % tot + tot) % tot; let j = 0; while (j < n - 1 && cum[j + 1] < s) j++;
      const p = P[j], q = P[(j + 1) % n], f = (s - cum[j]) / ((cum[j + 1] - cum[j]) || 1);
      o.position.set(p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f, z);
      o.rotation.z = Math.atan2(q[1] - p[1], q[0] - p[0]); o.updateMatrix(); im.setMatrixAt(k, o.matrix);
    }
    im.instanceMatrix.needsUpdate = true;
  } };
}

/* ── OHV: cam in the block → roller tappet → pushrod → rocker (1.5:1) → valve ── */
const OCX = -1.5, OCY = -1.9, lifters = [];
const camO = buildCam(ohvG, [OCX, OCY], .13, [['in', -.5], ['ex', .5]], -1, 0);
cog(.56, .1, 24, .08, .08, camO.grp, 1.5);
[['in', -.5, valveIn], ['ex', .5, valveEx]].forEach(([k, z, mat]) => {
  const v = buildValve(ohvG, mat, 0, z, false);
  const rk = new THREE.Group(); rk.position.set(-.9, 2.15, z); ohvG.add(rk);
  boxM(1.5, .16, .22, tapMat, [.15, 0, 0], rk); cylZ(.15, .26, camMat, [0, 0, 0], rk);
  cyl(.07, .04, .1, tapMat, [-.6, -.1, 0], rk); cyl(.05, .05, .18, retMat, [.9, -.1, 0], rk);
  const pr = new THREE.Group(); pr.position.set(OCX, OCY, z); ohvG.add(pr);
  cylZ(.1, .12, tapMat, [0, .38, 0], pr); cyl(.13, .13, .5, tapMat, [0, .63, 0], pr); cyl(.05, .05, 3.07, rodMat, [0, 2.415, 0], pr);
  lifters.push({ kind: k, v, rk, pr, Lv: .195 });
});
[-.98, 0, .98].forEach(z => cyl(.08, .08, 1.4, guideMat, [-.9, 1.45, z], ohvG));
cylZ(.06, 2.2, camMat, [-.9, 2.15, 0], ohvG);
const chainO = makeChain(ohvG, [0, CY], .3, [OCX, OCY], .6, 1.5);

/* ── DOHC: two cams in the head, direct-acting buckets, 4 valves, meshed timing gears ── */
const DCY = 2.21;
[['in', -.6, valveIn, 1, Math.PI], ['ex', .6, valveEx, -1, Math.PI]].forEach(([k, x, mat, dir, base]) => {
  const c = buildCam(dohcG, [x, DCY], .17, [[k, -.5], [k, .5]], dir, base);
  const gr = cog(.55, .1, 24, .1, .08, c.grp, 1.1); if (dir < 0) gr.rotation.y = -Math.PI / 24;
  if (dir < 0) cog(.56, .1, 24, .08, .08, c.grp, 1.5);
  [-.5, .5].forEach(z => lifters.push({ kind: k, v: buildValve(dohcG, mat, x, z, true), Lv: .17 }));
});
const chainD = makeChain(dohcG, [0, CY], .3, [.6, DCY], .6, 1.5);
function applyLayout() { const o = ui.controls.value('layout') !== 'dohc'; ohvG.visible = o; dohcG.visible = !o; }
const LBL = {
  ohv: [['cam', -1.5, -2.35, .5], ['lobe', -1.5, -1.6, .5], ['tappet', -1.5, -1.0, .5], ['pushrod', -1.5, .5, .5], ['rocker', -.9, 2.4, .5],
    ['spring', .2, 1.1, .5], ['retainer', .2, 1.5, .5], ['guide', .1, .45, .5], ['vin', 0, 1.9, -.5], ['seat', .22, 0, -.5],
    ['piston', .95, -.6, 0], ['rod', .3, -2.0, 0], ['crank', .6, -3.5, .3], ['chain', -.75, -2.5, 1.5], ['head', 1.9, .4, 0]],
  dohc: [['cam-in', -.6, 2.75, 0], ['cam-ex', .6, 2.75, 0], ['lobe', -.6, 2.5, .5], ['bucket', -.6, 1.9, .5], ['spring', -.45, 1.1, .5],
    ['vin', -.6, 1.6, -.5], ['vex', .6, 1.6, -.5], ['guide', .68, .45, .5], ['seat', .8, 0, .5], ['gear', 0, 2.25, 1.1],
    ['chain', .35, -.4, 1.5], ['piston', .95, -.6, 0], ['rod', .3, -2.0, 0], ['crank', .6, -3.5, .3], ['head', 1.9, .4, 0]]
};

/* ═══════════════════════════════════════════════════════════════════════
   LABELS
   ═══════════════════════════════════════════════════════════════════════ */
const labels = Base.createLabelSystem();
[['cam','Camshaft'],['cam-in','Intake cam'],['cam-ex','Exhaust cam'],['lobe','Cam lobe'],['tappet','Tappet'],['pushrod','Pushrod'],['rocker','Rocker arm'],
 ['spring','Valve spring'],['retainer','Upper retainer'],['guide','Valve guide'],['vin','Intake valve'],['vex','Exhaust valve'],['seat','Valve seat'],
 ['bucket','Bucket tappet'],['gear','Timing gears'],['chain','Timing chain'],['piston','Piston'],['rod','Connecting rod'],['crank','Crankshaft'],['head','Cylinder head']
].forEach(([i,t])=>labels.add(i,t));

/* ═══════════════════════════════════════════════════════════════════════
   UI
   ═══════════════════════════════════════════════════════════════════════ */
const TABS = {
  overview: () => `
    <div class="al-sec">
      <h4>What it does</h4>
      <p>The valvetrain turns camshaft rotation into precise valve opening. Intake valves let air and
      fuel in; exhaust valves let burnt gases out. Timing and lift decide how much air the engine
      can breathe — and therefore how much power it makes.</p>
    </div>
    <div class="al-sec">
      <h4>Cam profile</h4>
      <ul>
        <li><b>Base circle</b> — the round part; valve closed and resting.</li>
        <li><b>Lobe</b> — the bump; pushes the valve open.</li>
        <li><b>Lift</b> — how far the valve opens (typical 8–13 mm).</li>
        <li><b>Duration</b> — crank degrees the valve stays open (typical 220–280°).</li>
        <li><b>Overlap</b> — both valves open together around TDC; helps scavenging.</li>
      </ul>
    </div>
    <div class="al-sec">
      <h4>Layouts</h4>
      <ul>
        <li><b>OHV</b> — cam in the block, driven by a chain from the crank at 2:1; tappet → pushrod → rocker arm → valve (shown by default).</li>
        <li><b>SOHC</b> — one cam in the head, rockers or buckets.</li>
        <li><b>DOHC</b> — two cams in the head, direct-acting buckets, 4 valves per cylinder (switch Layout).</li>
      </ul>
    </div>
    <div class="al-sec">
      <h4>Variable valve timing (VVT)</h4>
      <p>The ECU rotates the cam relative to the crank via an oil-pressure phaser — typically ±20–40°
      crank. Advancing the intake cam at low rpm improves torque and idle quality; retarding it at
      high rpm improves top-end power.</p>
    </div>`,
  faults: () => `
    <div class="al-sec"><h4>Common faults</h4></div>
    <div class="al-fault">
      <div class="t">Timing belt / chain failure</div>
      <div class="s">Sudden no-start, bent valves on interference engines, sudden power loss.</div>
      <div class="c">Check: belt tension, timing marks vs crank TDC, chain stretch with a scan tool cam/crank correlation code (P0016).</div>
    </div>
    <div class="al-fault">
      <div class="t">Worn cam lobe</div>
      <div class="s">Tick-tick noise, misfire on one cylinder, low compression, rough idle.</div>
      <div class="c">Check: cam lift with a dial indicator (compare across cylinders); inspect oil for metal.</div>
    </div>
    <div class="al-fault">
      <div class="t">VVT phaser / solenoid</div>
      <div class="s">Rough idle, rattling on cold start, P0011 / P0012 codes, power loss.</div>
      <div class="c">Check: solenoid resistance, oil quality (VVT is oil-pressure sensitive), phaser rattle test.</div>
    </div>
    <div class="al-fault">
      <div class="t">Sticking valve</div>
      <div class="s">Rough running, backfire, single-cylinder misfire.</div>
      <div class="c">Check: valve guide wear, valve stem straightness, spring breakage.</div>
    </div>`,
  quiz: () => `
    <div class="al-q" data-a="1">
      <div class="q">1. What does the cam base circle do?</div>
      <button class="al-opt">Pushes the valve open</button>
      <button class="al-opt">Holds the valve closed between events</button>
      <button class="al-opt">Drives the oil pump</button>
      <div class="al-exp">The base circle is the round part of the cam — while the follower is on it, the valve is fully closed and resting on its seat.</div>
    </div>
    <div class="al-q" data-a="2">
      <div class="q">2. Valve overlap happens when…</div>
      <button class="al-opt">Both valves are fully closed</button>
      <button class="al-opt">The piston is at the bottom of its stroke</button>
      <button class="al-opt">Intake and exhaust valves are both slightly open around TDC</button>
      <div class="al-exp">Overlap is the brief window at TDC where exhaust is still closing and intake is already opening — it helps scavenge burnt gases and improves cylinder filling.</div>
    </div>
    <div class="al-q" data-a="0">
      <div class="q">3. Why does the camshaft rotate at half crank speed?</div>
      <button class="al-opt">Because a four-stroke cycle needs two crank revolutions per cam revolution</button>
      <button class="al-opt">Because the cam chain has a 2:1 reduction for the oil pump</button>
      <button class="al-opt">Because valve lift is doubled</button>
      <div class="al-exp">In a 4-stroke engine the full cycle is 720° of crank. Each valve opens once per cycle, so the cam only needs one revolution — a 2:1 reduction from the crank.</div>
    </div>`
};

/* 7b3: the module legend is the Monitor footer */
const LEGEND = '<div class="mon-legend"><span><i style="background:#38bdf8"></i>Intake valve</span><span><i style="background:#f97316"></i>Exhaust valve</span><span><i style="background:#b8c0cc"></i>Camshaft</span><span><i style="background:#9aa3b2"></i>Valve spring</span></div>';

const ui = Base.UI.create({
  moduleId: CFG.moduleId,
  panel: {
    kicker: 'Engine Mechanical',
    title:  'Valvetrain',
    tabs: [
      { id: 'overview', label: 'Overview' },
      { id: 'faults',   label: 'Faults' },
      { id: 'quiz',     label: 'Self-check' }
    ],
    onTab: renderTab,
      badge: { text: 'OHV · DOHC', color: CFG.accent }
  },
  monitor: {
    config: { label: 'Engine', value: { label: 'Engine', unit: ' rpm', max: 100, bar: true }, rows: [['in', 'Intake lift'], ['ex', 'Exhaust lift'], ['cam', 'Cam angle'], ['adv', 'Cam advance'], ['ev', 'Valve event'], ['ov', 'Overlap'], ['ve', 'Volumetric eff.'], ['eff', 'Torque effect']], footer: LEGEND, status: { text: 'Running' } },
    initial: { value: { text: '—', unit: ' rpm' }, rows: { in: '—', ex: '—', cam: '—', adv: '—', ev: '—', ov: '—', ve: '—', eff: '—' }, status: ['Running', false] }
  },
  toolbar: {
    play: true,
    reset: true,
    speed: { label: 'Sim speed', min: 0.15, max: 2.5, step: 0.05, value: 0.85 },
    labels: true
  },
  axes: [{ id: 'adv', min: -20, max: 20, step: 1, def: 0, unit: '°', label: 'Cam advance', side: 'left',
           format: (v) => (v > 0 ? '+' : '') + v + '°', onChange: () => updateReadouts() }],

  /* Phase 6: the +10° step is a controls.js action in the dock options row (replaces the toolbar extra) */
  options: [
    { id: 'layout', type: 'choice', layout: 'segmented', label: 'Layout', ariaLabel: 'Valvetrain layout',
      options: [{ id: 'ohv', label: 'OHV pushrod' }, { id: 'dohc', label: 'DOHC' }], def: 'ohv', onChange: () => applyLayout() },
    { id: 'advance', type: 'action', label: 'Advance +10\u00b0', ariaLabel: 'Advance the intake cam by 10 degrees', onAction: () => advanceCam() }
  ],
});

const tabHost = document.createElement('div');
tabHost.id = 'al-tabs';
tabHost.className = 'al-tabs';
ui.panel.body.appendChild(tabHost);

Widgets.wireQuiz(tabHost);

function renderTab(id) { tabHost.innerHTML = (TABS[id] || TABS.overview)(); }
renderTab('overview');

function advanceCam() {
  const cur = ui.controls.value('adv');
  ui.controls.setValue('adv', cur >= 20 ? -20 : cur + 10);   /* the axis fires onChange -> updateReadouts */
}

/* ═══════════════════════════════════════════════════════════════════════
   READOUTS
   ═══════════════════════════════════════════════════════════════════════ */
/* 7b3: the old panel grid is Monitor rows (engine speed and the two lifts repeated the big value / the Intake and Exhaust lift rows and are dropped) */
const ro = Base.monitorRows(ui, ['cam', 'adv', 'ev', 'ov', 've', 'eff'], ['rpm', 'li', 'le']);

/* Valve events in crank degrees (TDC = 0 at the start of intake). Advance moves the intake cam only. */
const IN = { open: -25, dur: 260 }, EX = { open: 460, dur: 285 };
function lift1(phi, open, dur) {
  const p = ((phi - open) % 720 + 720) % 720 / dur;
  return p < 1 ? 0.5 * (1 - Math.cos(p * TWO)) : 0;
}
function camEvents(camFrac, advanceDeg) {
  const phi = camFrac * 720;
  return { li: lift1(phi, IN.open - advanceDeg, IN.dur), le: lift1(phi, EX.open, EX.dur) };
}

/* ═══════════════════════════════════════════════════════════════════════
   VOLUMETRIC EFFICIENCY MODEL — ties the VVT phaser to a felt consequence.
   Advancing the intake cam opens the valve earlier in the intake stroke:
   at low rpm this fills the cylinder better (torque peak moves down);
   retarding it closes the valve later relative to piston speed, which
   favours high-rpm ram-air filling at the cost of low-end torque. This
   is a simplified but directionally-real model — not a lookup table of
   real dyno data — so students can feel *why* VVT exists, not just watch
   a slider move a valve.
   ═══════════════════════════════════════════════════════════════════════ */
const VE_BASE_PEAK_RPM = 3400;   // naturally-aspirated peak-torque rpm at 0° advance
const VE_SHIFT_PER_DEG = 35;     // rpm the torque peak moves per degree of advance
const VE_WIDTH_RPM     = 1800;   // curve width (sigma-ish)
const VE_MIN = 0.55, VE_MAX = 0.96;

function volumetricEfficiency(rpm, advanceDeg) {
  const peak = VE_BASE_PEAK_RPM - advanceDeg * VE_SHIFT_PER_DEG;
  const x = (rpm - peak) / VE_WIDTH_RPM;
  return VE_MIN + (VE_MAX - VE_MIN) * Math.exp(-x * x);
}

function updateReadouts() {
  const rpm = Math.round(700 + state.speedMul * 5500);
  const camFrac = (t * CFG.cycleHz) % 1;
  const camDeg = camFrac * 360;
  const ev = camEvents(camFrac, ui.controls.value('adv'));
  const liMm = ev.li * 10.5;
  const leMm = ev.le * 10.5;

  if (ro.rpm) ro.rpm.textContent = rpm.toLocaleString() + ' rpm';
  if (ro.cam) ro.cam.textContent = camDeg.toFixed(0) + '°';
  if (ro.li)  ro.li.textContent  = liMm.toFixed(2) + ' mm';
  if (ro.le)  ro.le.textContent  = leMm.toFixed(2) + ' mm';
  if (ro.adv) {
    ro.adv.textContent = (ui.controls.value('adv') > 0 ? '+' : '') + ui.controls.value('adv') + '°';
    ro.adv.className = 'v ' + (ui.controls.value('adv') !== 0 ? 'warn' : '');
  }

  if (ro.ev) {
    let label = 'Both closed';
    if (ev.li > 0.02 && ev.le > 0.02) label = 'Overlap';
    else if (ev.li > 0.02) label = 'Intake open';
    else if (ev.le > 0.02) label = 'Exhaust open';
    ro.ev.textContent = label;
    ro.ev.className = 'v ' + (label === 'Overlap' ? 'warn' : label === 'Both closed' ? '' : 'ok');
  }

  if (ro.ov) {
    const bothOpen = ev.li > 0.02 && ev.le > 0.02;
    ro.ov.textContent = bothOpen ? 'YES' : 'no';
    ro.ov.className = 'v ' + (bothOpen ? 'warn' : '');
  }

  const ve = volumetricEfficiency(rpm, ui.controls.value('adv'));
  if (ro.ve) {
    ro.ve.textContent = Math.round(ve * 100) + ' %';
    ro.ve.className = 'v ' + (ve > 0.85 ? 'ok' : ve < 0.65 ? 'warn' : '');
  }
  if (ro.eff) {
    let effect, cls;
    if (ui.controls.value('adv') >= 5)      { effect = 'Low-end torque ↑'; cls = 'ok'; }
    else if (ui.controls.value('adv') <= -5) { effect = 'Top-end power ↑'; cls = 'ok'; }
    else                              { effect = 'Balanced';        cls = ''; }
    ro.eff.textContent = effect;
    ro.eff.className = 'v ' + cls;
  }

  ui.monitor.update({
    value: { text: String(rpm), unit: ' rpm', bar: camFrac * 100, barColor: 'var(--al-accent)' },
    rows: { in: (liMm).toFixed(1) + ' mm', ex: (leMm).toFixed(1) + ' mm' },
    status: [ev.li > 0.02 || ev.le > 0.02 ? 'Valve open' : 'Idle', true]
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   MESSAGING
   ═══════════════════════════════════════════════════════════════════════ */
const bridge = ui.wireBridge({
  viewManager,
  state,
  onCommand: (d) => {
    if (d.action === 'reset') {
      ui.controls.resetAll();
      updateReadouts();
    }
  }
});
bridge.ready();
bridge.setStatus('Valvetrain ready', '#d946ef');

/* ═══════════════════════════════════════════════════════════════════════
   ANIMATION
   ═══════════════════════════════════════════════════════════════════════ */
let t = 0;
let last = performance.now();
let raf = 0;
let roClock = 0;

const tmp = new THREE.Vector3();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  const sp = state.playing ? state.speedMul : 0;
  t += dt * sp;

  const adv = ui.controls.value('adv'), phiU = t * CFG.cycleHz * 720, phi = phiU % 720;
  const ev = camEvents(phi / 720, adv);
  applyLayout();
  setMech(phi);
  (ohvG.visible ? chainO : chainD).update(-phiU * DEG * 0.3);
  cams.forEach(c => {
    c.grp.rotation.z = c.dir * phi * DEG / 2;
    c.lobes.forEach(l => { const pk = l.k === 'in' ? IN.open - adv + IN.dur / 2 : EX.open + EX.dur / 2; l.m.rotation.z = c.base - c.dir * pk * DEG / 2; });
  });
  lifters.forEach(l => {
    const lift = (l.kind === 'in' ? ev.li : ev.le) * l.Lv;
    l.v.mv.position.y = -lift;
    l.v.sp.scale.y = Math.max(.05, .605 - lift);
    if (l.rk) { const psi = lift / .9; l.rk.rotation.z = -psi; l.pr.position.y = .6 * psi; }
  });

  /* --- labels --- */
  labels.hideAll();
  if (state.showLabels) LBL[ohvG.visible ? 'ohv' : 'dohc'].forEach(([id, x, y, z]) => labels.project(id, tmp.set(x, y, z), camera, wrap));

  controls.update();
  renderer.render(scene, camera);

  roClock += dt;
  if (roClock > 0.12) { roClock = 0; updateReadouts(); }
}

if (reduced) {
  setInterval(() => { applyLayout(); renderer.render(scene, camera); }, 120);
} else {
  raf = requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', () => {
  if (reduced) return;
  if (document.hidden) {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  } else if (!raf) {
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }
});

updateReadouts();
</script>
</body>
</html>
