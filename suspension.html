<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d13">
<title>Suspension System — Auto Lab</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="controls.css">
<style>
  /* ═══════ Road status bar (overlay) ═══════ */
  #road-info {
    position: fixed;
    bottom: calc(var(--dock-h, 24vh) + var(--s-3, 12px));   /* Phase 2: clear the control dock */
    left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; padding: 5px 10px;
    background: color-mix(in oklch, var(--bg) 72%, transparent); border: 1px solid color-mix(in oklch, var(--text) 8%, transparent);
    border-radius: 10px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 10.5px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase;
    color: var(--text-dim); z-index: 6; pointer-events: none;
    transition: opacity .3s;
    white-space: nowrap;
  }
  #road-info .label { opacity: .6; }
  #road-info .val {
    color: var(--text);
    font-family: var(--font-mono);
  }
  #road-info .val.pot  { color: var(--c-red); }
  #road-info .val.bump { color: var(--c-amber); }
  #road-info .val.warn { color: var(--c-red); }

  /* ═══════ Impact flash + warning (overlays) ═══════ */
  #impact-flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 8;
    background: radial-gradient(ellipse at center,
      transparent 35%, color-mix(in oklch, var(--c-red) 42%, transparent) 100%);
    opacity: 0; transition: opacity .12s ease-out;
  }
  #impact-warning {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    background: color-mix(in oklch, var(--c-red) 95%, transparent); color: var(--c-red);
    padding: 8px 18px; border-radius: 10px;
    font-weight: 800; font-size: 12px; letter-spacing: .06em;
    border: 1px solid color-mix(in oklch, var(--c-red) 60%, transparent);
    box-shadow: 0 10px 30px color-mix(in oklch, var(--c-red) 35%, transparent);
    opacity: 0; transition: opacity .18s;
    z-index: 9; pointer-events: none;
    text-transform: uppercase; white-space: nowrap; max-width: 88vw;
  }
  #impact-warning.on { opacity: 1; }

  /* ═══════ Toolbar extra — SUSP toggle ═══════ */
  @keyframes suspRigidPulse {
    from { box-shadow: 0 0 8px color-mix(in oklch, var(--c-red) 35%, transparent); }
    to   { box-shadow: 0 0 18px color-mix(in oklch, var(--c-red) 70%, transparent); }
  }

</style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div id="labels-root"></div>
  <div id="impact-flash"></div>
  <div id="impact-warning">⚠ IMPACT — every bump slams the chassis</div>

  <div id="road-info">
    <span class="label">Road:</span>
    <span class="val" id="road-val">Flat</span>
    <span class="label" id="road-next-label"></span>
  </div>

  <script src="guard.js"></script>
  <script type="importmap">
  { "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import * as Base from './kit.js';
import { Parts } from './components.js';
  import { UI } from './kit.js';

  const isCoarse = matchMedia('(pointer: coarse)').matches;
  const DEG = Base.DEG, TAU = Base.TAU;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ═══════════════════════════════════════════════════════════
     LAYOUT
     ═══════════════════════════════════════════════════════════ */
  const RW = 0.55;
  const XF = 1.45, XR = -1.45;
  const TRACK_W = 0.78;
  const SPRING_SEAT_Y = 1.36;
  const REST_LEN_F = 0.62;
  const EYE_LOCAL = 1.05;
  const EYE_RISE = 0.30;
  const TRACK_HALF = 0.62;

  const M_BODY = 1.0, I_PITCH = 2.2, I_ROLL = 0.9;
  const K_SPRING = 30, C_DAMP = 2.8, K_SPRING_R = 26;

  /* ═══════════════════════════════════════════════════════════
     ROAD
     ═══════════════════════════════════════════════════════════ */
  const ROAD_LENGTH = 64;
  const ROAD_HALF_WIDTH = 1.20;

  const FEATURES = [
    { x:  3.0, w: 0.9, h:  0.10, mode: 'both',  type: 'bump' },
    { x:  6.5, w: 1.4, h:  0.20, mode: 'both',  type: 'bump' },
    { x: 10.0, w: 0.7, h: -0.14, mode: 'both',  type: 'pot'  },
    { x: 12.5, w: 1.0, h:  0.09, mode: 'left',  type: 'bump' },
    { x: 14.0, w: 0.9, h:  0.10, mode: 'right', type: 'bump' },
    { x: 17.0, w: 2.6, h:  0.05, mode: 'both',  type: 'ripple' },
    { x: 21.0, w: 0.6, h: -0.16, mode: 'left',  type: 'pot'  },
    { x: 22.8, w: 0.7, h: -0.14, mode: 'right', type: 'pot'  },
    { x: 25.5, w: 1.3, h:  0.16, mode: 'both',  type: 'bump' },
    { x: 29.0, w: 3.0, h:  0.06, mode: 'both',  type: 'wave' },
    { x: 33.5, w: 1.0, h:  0.11, mode: 'left',  type: 'bump' },
    { x: 35.0, w: 1.0, h:  0.11, mode: 'right', type: 'bump' },
    { x: 38.0, w: 1.1, h: -0.19, mode: 'both',  type: 'pot'  },
    { x: 41.0, w: 0.9, h:  0.14, mode: 'both',  type: 'bump' },
    { x: 44.5, w: 2.2, h:  0.06, mode: 'both',  type: 'ripple' },
    { x: 48.5, w: 0.8, h: -0.15, mode: 'left',  type: 'pot'  },
    { x: 50.5, w: 0.9, h:  0.12, mode: 'right', type: 'bump' },
    { x: 53.5, w: 1.5, h:  0.20, mode: 'both',  type: 'bump' },
    { x: 57.0, w: 0.6, h: -0.12, mode: 'both',  type: 'pot'  },
    { x: 59.5, w: 0.8, h:  0.13, mode: 'left',  type: 'bump' },
    { x: 61.0, w: 0.8, h:  0.13, mode: 'right', type: 'bump' },
  ];

  function roadHeight(x, z) {
    x = ((x % ROAD_LENGTH) + ROAD_LENGTH) % ROAD_LENGTH;
    let h = 0;
    for (let i = 0; i < FEATURES.length; i++) {
      const f = FEATURES[i];
      let dx = x - f.x;
      if (dx > ROAD_LENGTH / 2) dx -= ROAD_LENGTH;
      if (dx < -ROAD_LENGTH / 2) dx += ROAD_LENGTH;
      const dist = Math.abs(dx);
      if (dist > f.w) continue;
      let zWeight = 1;
      if (f.mode === 'left')       zWeight = clamp((0.35 - z) / 0.7, 0, 1);
      else if (f.mode === 'right') zWeight = clamp((0.35 + z) / 0.7, 0, 1);
      else if (f.mode === 'center')zWeight = clamp((0.6 - Math.abs(z)) / 0.6, 0, 1);
      const t = dist / f.w;
      let profile;
      if (f.type === 'bump')        profile = Math.cos(Math.PI * t * 0.5) ** 2;
      else if (f.type === 'pot')    profile = Math.pow(Math.cos(Math.PI * t * 0.5), 0.55);
      else if (f.type === 'ripple') profile = Math.cos(Math.PI * t * 4) * (1 - t) * 0.55;
      else                          profile = (1 - Math.cos(Math.PI * t * 2)) * 0.5;
      h += f.h * profile * zWeight;
    }
    return h;
  }
  function roadFeatureAt(x) {
    x = ((x % ROAD_LENGTH) + ROAD_LENGTH) % ROAD_LENGTH;
    let best = null, bestD = 2.5;
    for (const f of FEATURES) {
      let dx = x - f.x;
      if (dx > ROAD_LENGTH / 2) dx -= ROAD_LENGTH;
      if (dx < -ROAD_LENGTH / 2) dx += ROAD_LENGTH;
      const d = Math.abs(dx);
      if (d < bestD) { bestD = d; best = f; }
    }
    return best;
  }
  function nextRoadFeatureAt(x) {
    x = ((x % ROAD_LENGTH) + ROAD_LENGTH) % ROAD_LENGTH;
    let best = null, bestD = 1e9;
    for (const f of FEATURES) {
      let dx = f.x - x;
      if (dx < 0) dx += ROAD_LENGTH;
      if (dx < bestD) { bestD = dx; best = f; }
    }
    return { feature: best, distance: bestD };
  }

  /* ═══════════════════════════════════════════════════════════
     SCENE
     ═══════════════════════════════════════════════════════════ */
  const { scene, camera, renderer, controls, wrap, viewManager } = Base.buildScene({
    fov: 42, camPos: [5.8, 4.2, 7.5], target: [-0.1, 1.25, 0], floorY: -0.35
  });
  Base.attachResize(camera, renderer, wrap, 42);

  const M = Base.createMaterials();
  const labels = Base.createLabelSystem();
  const particleTex = Base.createParticleTexture();
  const state = Base.createUIState();

  /* Sky */
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: {
      topColor: { value: new THREE.Color(0x1a2a4a) },
      botColor: { value: new THREE.Color(0x0b0e14) }
    },
    vertexShader: `varying vec3 vPos; void main(){ vPos=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `varying vec3 vPos; uniform vec3 topColor; uniform vec3 botColor;
      void main(){ float h=normalize(vPos).y; gl_FragColor=vec4(mix(botColor,topColor,smoothstep(-0.2,0.85,h)),1.0); }`
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(60, 24, 16), skyMat));

  /* Materials */
  const matAsphalt   = new THREE.MeshStandardMaterial({ color: 0x24272d, roughness: 0.96, metalness: 0.02 });
  const matCenterLine= new THREE.MeshStandardMaterial({ color: 0xd9a13b, roughness: 0.7 });
  const matRubber    = new THREE.MeshStandardMaterial({ color: 0x1b1e23, roughness: 0.92, metalness: 0.05 });
  const matStrut     = new THREE.MeshStandardMaterial({ color: 0x9c3a32, roughness: 0.42, metalness: 0.4, emissive: 0x3a0503, emissiveIntensity: 0.4 });
  const matArrow     = new THREE.MeshBasicMaterial({ color: 0x22c55e });
  const matHeadLight = new THREE.MeshStandardMaterial({ color: 0xfff6cf, emissive: 0xfff0a8, emissiveIntensity: 2.2, roughness: 0.25, metalness: 0.1 });
  const matBrakeLight= new THREE.MeshStandardMaterial({ color: 0xff2a2a, emissive: 0xff1a1a, emissiveIntensity: 2.4, roughness: 0.3, metalness: 0.1 });
  const matDisc      = new THREE.MeshStandardMaterial({ color: 0x6a7280, metalness: 0.9, roughness: 0.35 });
  const matCaliper   = new THREE.MeshStandardMaterial({ color: 0xb91c1c, metalness: 0.5, roughness: 0.35 });
  const matGlassWin  = new THREE.MeshPhysicalMaterial({
    color: 0x2a3d55, roughness: 0.08, metalness: 0.4,
    transparent: true, opacity: 0.55, side: THREE.DoubleSide,
    clearcoat: 1.0, clearcoatRoughness: 0.05
  });
  const matDamperBody= new THREE.MeshStandardMaterial({ color: 0x2a2e35, metalness: 0.75, roughness: 0.35 });
  const matDamperSeal= new THREE.MeshStandardMaterial({ color: 0xd4a34a, metalness: 0.85, roughness: 0.28 });

  const world = new THREE.Group();
  scene.add(world);

  /* Road mesh */
  const ROAD_SEGS_X = 256, ROAD_SEGS_Z = 8;

  function buildRoadMesh() {
    const vertX = ROAD_SEGS_X + 1, vertZ = ROAD_SEGS_Z + 1;
    const positions = new Float32Array(vertX * vertZ * 3);
    const uvs = new Float32Array(vertX * vertZ * 2);
    const indices = [];
    for (let i = 0; i < vertX; i++) {
      const x = (i / ROAD_SEGS_X) * ROAD_LENGTH;
      for (let j = 0; j < vertZ; j++) {
        const z = -ROAD_HALF_WIDTH + (j / ROAD_SEGS_Z) * (2 * ROAD_HALF_WIDTH);
        const y = roadHeight(x, z);
        const idx = (i * vertZ + j);
        positions[idx * 3]     = x;
        positions[idx * 3 + 1] = y;
        positions[idx * 3 + 2] = z;
        uvs[idx * 2]     = x * 0.15;
        uvs[idx * 2 + 1] = z * 0.5;
      }
    }
    for (let i = 0; i < ROAD_SEGS_X; i++) {
      for (let j = 0; j < ROAD_SEGS_Z; j++) {
        const a = i * vertZ + j;
        const b = (i + 1) * vertZ + j;
        indices.push(a, a + 1, b, a + 1, b + 1, b);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return geo;
  }
  const roadGeo = buildRoadMesh();
  const roadMesh  = new THREE.Mesh(roadGeo, matAsphalt); roadMesh.receiveShadow = true;  world.add(roadMesh);
  const roadMesh2 = new THREE.Mesh(roadGeo, matAsphalt); roadMesh2.receiveShadow = true; world.add(roadMesh2);

  const dashesGroup = new THREE.Group();
  world.add(dashesGroup);
  for (let x = 0; x < ROAD_LENGTH; x += 2.0) {
    const y = roadHeight(x, 0) + 0.015;
    const dash = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.02, 0.10), matCenterLine);
    dash.position.set(x, y, 0);
    dashesGroup.add(dash);
  }

  /* Feature markers */
  const markersGroup = new THREE.Group();
  world.add(markersGroup);
  const MARKER_COLORS = { bump: 0xfbbf24, pot: 0xef4444, ripple: 0x94a3b8, wave: 0xa78bfa };

  FEATURES.forEach(f => {
    const color = MARKER_COLORS[f.type] || 0xfbbf24;
    const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.78, side: THREE.DoubleSide });
    [0, ROAD_LENGTH].forEach(offset => {
      const sides = f.mode === 'left' ? [-1] : f.mode === 'right' ? [1] : [1, -1];
      sides.forEach(side => {
        const chev = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.22), mat);
        chev.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2;
        const yEdge = roadHeight(f.x, side * ROAD_HALF_WIDTH) + 0.13;
        chev.position.set(f.x + offset, yEdge, side * (ROAD_HALF_WIDTH + 0.04));
        markersGroup.add(chev);
      });
      if (f.mode === 'both') {
        const strip = new THREE.Mesh(new THREE.PlaneGeometry(Math.max(0.35, f.w * 0.55), 0.14), mat);
        strip.rotation.x = -Math.PI / 2;
        strip.position.set(f.x + offset, roadHeight(f.x, 0) + 0.02, 0);
        markersGroup.add(strip);
      }
    });
  });

  for (let side = -1; side <= 1; side += 2) {
    const sh = new THREE.Mesh(
      new THREE.BoxGeometry(ROAD_LENGTH, 0.05, 1.5),
      new THREE.MeshStandardMaterial({ color: 0x3a2e1f, roughness: 1.0 })
    );
    sh.position.set(ROAD_LENGTH / 2, -0.32, side * 2.1);
    sh.receiveShadow = true;
    world.add(sh);
  }

  /* ═══════════════════════════════════════════════════════════
     VEHICLE
     ═══════════════════════════════════════════════════════════ */
  const vehicle = new THREE.Group();
  world.add(vehicle);

  const bodyG = new THREE.Group();
  vehicle.add(bodyG);

  const axleF = new THREE.Group(); axleF.position.set(XF, RW, 0); vehicle.add(axleF);
  const axleR = new THREE.Group(); axleR.position.set(XR, RW, 0); vehicle.add(axleR);

  /* Chassis */
  {
    [-0.62, 0.62].forEach(z => {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(4.9, 0.16, 0.18), M.matIron);
      rail.position.set(-0.10, 1.50, z); rail.castShadow = true; bodyG.add(rail);
    });
    [-2.3, -1.0, 0.35, 1.9].forEach(x => {
      const cm = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.10, 1.26), M.matIronDS);
      cm.position.set(x, 1.46, 0); bodyG.add(cm);
    });
    const bF = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.22, 1.7), M.matMetalDark);
    bF.position.set(2.45, 1.30, 0); bodyG.add(bF);
    const bR = bF.clone(); bR.position.set(-2.65, 1.30, 0); bodyG.add(bR);
    const grille = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.30, 1.1), M.matMetalDark);
    grille.position.set(2.40, 1.52, 0); bodyG.add(grille);
    [-0.45, 0.45].forEach(z => {
      const hl = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.09, 16), matHeadLight);
      hl.rotation.z = Math.PI / 2; hl.position.set(2.48, 1.52, z); bodyG.add(hl);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.012, 8, 20), M.matMetalDark);
      ring.rotation.y = Math.PI / 2; ring.position.set(2.52, 1.52, z); bodyG.add(ring);
    });
    [-0.52, 0.52].forEach(z => {
      const bl = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.10, 0.24), matBrakeLight);
      bl.position.set(-2.52, 1.55, z); bodyG.add(bl);
    });
    const cab = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.95, 1.5), M.matPiston);
    cab.position.set(1.35, 2.05, 0); cab.castShadow = true; bodyG.add(cab);
    [-0.76, 0.76].forEach(z => {
      const win = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.42, 0.02), matGlassWin);
      win.position.set(1.30, 2.18, z); bodyG.add(win);
    });
    const ws = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.60, 1.2), matGlassWin);
    ws.position.set(2.12, 2.22, 0); ws.rotation.z = -0.45; bodyG.add(ws);
    const floor = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.10, 1.5), M.matPiston);
    floor.position.set(-1.25, 1.63, 0); floor.castShadow = true; bodyG.add(floor);
    [-0.72, 0.72].forEach(z => {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.35, 0.06), M.matPiston);
      wall.position.set(-1.25, 1.85, z); bodyG.add(wall);
    });
    const tail = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.35, 1.5), M.matPiston);
    tail.position.set(-2.47, 1.85, 0); bodyG.add(tail);
    const bedFront = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.35, 1.5), M.matPiston);
    bedFront.position.set(-0.02, 1.85, 0); bodyG.add(bedFront);

    [-0.38, 0.38].forEach(z => {
      const plate = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.30, 0.05, 20), M.matIronDS);
      plate.position.set(XF - 0.15, SPRING_SEAT_Y, z); bodyG.add(plate);
      const arm = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.14, 0.34), M.matIronDS);
      arm.position.set(XF - 0.15, 1.42, Math.sign(z) * 0.50); bodyG.add(arm);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.27, 0.025, 8, 22), M.matMetal);
      ring.rotation.x = Math.PI / 2; ring.position.set(XF - 0.15, SPRING_SEAT_Y, z); bodyG.add(ring);
    });
    [-TRACK_HALF, TRACK_HALF].forEach(z => {
      const hanger = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.72, 0.24), M.matIronDS);
      hanger.position.set(XR - EYE_LOCAL - 0.07, 1.06, z);
      hanger.castShadow = true; bodyG.add(hanger);
      const shBr = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.36, 0.24), M.matIronDS);
      shBr.position.set(XR + EYE_LOCAL, 1.22, z);
      shBr.castShadow = true; bodyG.add(shBr);
    });
    const exhaust = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.55, 12), M.matMetalDark);
    exhaust.rotation.z = Math.PI / 2;
    exhaust.position.set(-2.60, 0.80, 0.35); bodyG.add(exhaust);
  }

  /* Axles */
  function makeAxleG(group, withDiff) {
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.10, 1.9, 18), M.matIronDS);
    beam.rotation.x = Math.PI / 2; beam.castShadow = true; group.add(beam);
    [-0.85, 0.85].forEach(z => {
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.22, 14), M.matMetalDark);
      hub.rotation.x = Math.PI / 2; hub.position.z = z; group.add(hub);
    });
    if (withDiff) {
      const diff = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), M.matIron);
      diff.position.set(0.25, 0, 0); group.add(diff);
    }
  }
  makeAxleG(axleF, true);
  makeAxleG(axleR, false);

  /* Wheels */
  const wheelSpinners = [];
  function makeWheel() {
    const w = new THREE.Group();
    const spinner = new THREE.Group();
    w.add(spinner);
    wheelSpinners.push(spinner);
    const tire = new THREE.Mesh(new THREE.CylinderGeometry(RW, RW, 0.34, 28), matRubber);
    tire.rotation.x = Math.PI / 2; tire.castShadow = true; spinner.add(tire);
    for (let k = 0; k < 18; k++) {
      const a = (k / 18) * TAU;
      const t = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.055, 0.345), matRubber);
      t.position.set(Math.cos(a) * (RW - 0.005), Math.sin(a) * (RW - 0.005), 0);
      t.rotation.z = a; spinner.add(t);
    }
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.355, 24), M.matAlu);
    rim.rotation.x = Math.PI / 2; spinner.add(rim);
    return w;
  }

  const wheels = [];
  [axleF, axleR].forEach(ax => {
    [-TRACK_W, TRACK_W].forEach(z => {
      const w = makeWheel();
      w.position.set(0, 0, z);
      ax.add(w);
      wheels.push(w);
      const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.02, 24), matDisc);
      disc.rotation.x = Math.PI / 2;
      disc.position.set(0, 0, z * 0.94);
      ax.add(disc);
      const caliper = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.18, 0.14), matCaliper);
      caliper.position.set(0, 0.16, z * 0.94);
      ax.add(caliper);
    });
  });

  /* Coil spring */
  function makeCoilSpring(radius, wireR, coils, height, mat) {

  /* Deformable leaf spring */
  const LEAF_N = 18;
  function makeDeformableLeafGeo(N, halfWidth, thickness) {
    const vertCount = (N + 1) * 4;
    const positions = new Float32Array(vertCount * 3);
    const indices = [];
    for (let i = 0; i < N; i++) {
      const a = i * 4, b = (i + 1) * 4;
      indices.push(a+0, a+1, b+1, a+0, b+1, b+0);
      indices.push(a+2, b+2, b+3, a+2, b+3, a+3);
      indices.push(a+0, b+0, b+2, a+0, b+2, a+2);
      indices.push(a+1, a+3, b+3, a+1, b+3, b+1);
    }
    indices.push(0, 2, 1, 0, 3, 1);
    const L = N * 4;
    indices.push(L+0, L+1, L+2, L+2, L+1, L+3);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return { geo, positions, halfWidth, thickness };
  }
  function deformLeaf(d, P0, C, P2, stackOffset) {
    const { positions, halfWidth, thickness } = d;
    const N = LEAF_N, tS = d.tS, tE = d.tE;
    const hw = halfWidth, ht = thickness * 0.5;
    for (let i = 0; i <= N; i++) {
      const t = tS + (tE - tS) * (i / N);
      const mt = 1 - t;
      const cx = mt*mt*P0.x + 2*mt*t*C.x + t*t*P2.x;
      const cy = mt*mt*P0.y + 2*mt*t*C.y + t*t*P2.y + stackOffset;
      const yT = cy + ht, yB = cy - ht;
      const base = i * 12;
      positions[base + 0] = cx; positions[base + 1] = yT; positions[base + 2] = -hw;
      positions[base + 3] = cx; positions[base + 4] = yT; positions[base + 5] = +hw;
      positions[base + 6] = cx; positions[base + 7] = yB; positions[base + 8] = -hw;
      positions[base + 9] = cx; positions[base + 10] = yB; positions[base + 11] = +hw;
    }
    d.geo.attributes.position.needsUpdate = true;
    d.geo.computeVertexNormals();
    d.geo.computeBoundingSphere();
  }

  const leafSprings = [];
  function makeLeafSpring(zPos) {
    const group = new THREE.Group();
    group.userData.z = zPos;
    const leavesGroup = new THREE.Group();
    group.add(leavesGroup);
    const leafSpec = [
      { spanHalf: 0.50, halfW: 0.13, thick: 0.036 },
      { spanHalf: 0.42, halfW: 0.125, thick: 0.032 },
      { spanHalf: 0.35, halfW: 0.115, thick: 0.030 },
      { spanHalf: 0.28, halfW: 0.105, thick: 0.028 },
      { spanHalf: 0.22, halfW: 0.095, thick: 0.026 },
    ];
    const stackGap = 0.038;
    const leafData = [];
    leafSpec.forEach((spec, i) => {
      const dGeo = makeDeformableLeafGeo(LEAF_N, spec.halfW, spec.thick);
      const mesh = new THREE.Mesh(dGeo.geo, M.matSpring);
      mesh.castShadow = true;
      leavesGroup.add(mesh);
      leafData.push({
        geo: dGeo.geo, positions: dGeo.positions,
        halfWidth: spec.halfW, thickness: spec.thick,
        tS: 0.5 - spec.spanHalf, tE: 0.5 + spec.spanHalf,
        stackOffset: -i * stackGap
      });
    });
    const eyeF = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.052, 0.26, 12), M.matMetalDark);
    eyeF.rotation.x = Math.PI / 2; group.add(eyeF);
    const eyeR = eyeF.clone(); group.add(eyeR);
    const cb = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.26, 8), M.matMetalDark);
    cb.position.set(0, 0.02, 0); group.add(cb);

      botPlate.position.set(x, -0.20, 0); group.add(botPlate);

        rod.position.set(x, -0.07, zz); group.add(rod);
      });
    });
    vehicle.add(group);
    suspParts.push(group);
    const s = { group, leavesGroup, eyeF, eyeR, leafData, leafSx: 1, leafSy: 1, z: zPos, prevSy: 1 };
    leafSprings.push(s);
    return s;
  }

  function spawnDust(x, n, power) {
    for (let i = 0; i < DUST_N && n > 0; i++) {
      const p = dustData[i];
      if (p.life > 0) continue;
      p.x = x + (Math.random() - 0.5) * 0.5;
      p.y = 0.06;
      p.z = (Math.random() < 0.5 ? -1 : 1) * (0.62 + Math.random() * 0.4);
      p.vx = (Math.random() - 0.5) * 1.6 * power;
      p.vy = (0.8 + Math.random() * 1.6) * power;
      p.vz = (Math.random() - 0.5) * 0.8;
      p.life = 1;
      n--;
    }
  }
  function updateDust(dt) {
    for (let i = 0; i < DUST_N; i++) {
      const p = dustData[i];
      const i3 = i * 3;
      if (p.life > 0) {
        p.life -= dt * 1.8;
        p.vy -= 4 * dt;
        p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
        if (p.y < 0.04) { p.y = 0.04; p.vy *= -0.2; p.vx *= 0.8; }
        const f = Math.max(0, p.life) ** 2 * 0.9;
        dustPos[i3] = p.x; dustPos[i3+1] = p.y; dustPos[i3+2] = p.z;
        dustCol[i3] = 0.75*f; dustCol[i3+1] = 0.68*f; dustCol[i3+2] = 0.55*f;
      } else {
        dustPos[i3+1] = -10;
        dustCol[i3] = dustCol[i3+1] = dustCol[i3+2] = 0;
      }
    }
    dustGeo.attributes.position.needsUpdate = true;

  }

        const f = Math.max(0, s.life / s.maxLife);
        sparkPos[i3] = s.px; sparkPos[i3+1] = s.py; sparkPos[i3+2] = s.pz;
        sparkCol[i3] = 1.0; sparkCol[i3+1] = 0.35 + 0.55 * f; sparkCol[i3+2] = 0.05 * f;

  function updateVehicle(dt) {
    if (dt <= 0) return;
    const v = 2.4 * (slowMo ? SLOWMO_MULT : state.speedMul);
    roadScroll += v * dt;

    const lXf = XF + roadScroll;
    const lXr = XR + roadScroll;
    const yfL = roadHeight(lXf, -TRACK_W);
    const yfR = roadHeight(lXf,  TRACK_W);
    const yrL = roadHeight(lXr, -TRACK_W);
    const yrR = roadHeight(lXr,  TRACK_W);

    const dvfL = _firstFrame ? 0 : (yfL - prevYfL) / dt;
    const dvfR = _firstFrame ? 0 : (yfR - prevYfR) / dt;
    const dvrL = _firstFrame ? 0 : (yrL - prevYrL) / dt;
    const dvrR = _firstFrame ? 0 : (yrR - prevYrR) / dt;

    const avgAxleF = (yfL + yfR) / 2;
    const avgAxleR = (yrL + yrR) / 2;
    const rigidH = (avgAxleF + avgAxleR) / 2;
    const rigidPhi = Math.atan2(avgAxleF - avgAxleR, XF - XR) * 0.85;
    const rigidRollF = -Math.atan2(yfR - yfL, 2 * TRACK_W);
    const rigidRollR = -Math.atan2(yrR - yrL, 2 * TRACK_W);
    const rigidTheta = (rigidRollF + rigidRollR) / 2;

    const blendTarget = withSusp ? 1 : 0;
    suspBlend += (blendTarget - suspBlend) * Math.min(1, dt * SUSP_BLEND_RATE);
    if (Math.abs(suspBlend - blendTarget) < 0.005) suspBlend = blendTarget;

    const fYFL = h + phi * XF + theta * (-TRACK_W);
    const fYFR = h + phi * XF + theta * ( TRACK_W);
    const fYRL = h + phi * XR + theta * (-TRACK_W);
    const fYRR = h + phi * XR + theta * ( TRACK_W);

    const defFL = yfL - fYFL;
    const defFR = yfR - fYFR;
    const defRL = yrL - fYRL;
    const defRR = yrR - fYRR;

    const dfFL = _firstFrame ? 0 : (defFL - prevDefFL) / dt;
    const dfFR = _firstFrame ? 0 : (defFR - prevDefFR) / dt;
    const dfRL = _firstFrame ? 0 : (defRL - prevDefRL) / dt;
    const dfRR = _firstFrame ? 0 : (defRR - prevDefRR) / dt;

    const FFL = (K_SPRING * defFL + C_DAMP * dfFL) * suspBlend;
    const FFR = (K_SPRING * defFR + C_DAMP * dfFR) * suspBlend;
    const FRL = (K_SPRING_R * defRL + C_DAMP * dfRL) * suspBlend;
    const FRR = (K_SPRING_R * defRR + C_DAMP * dfRR) * suspBlend;

    const Fsum = FFL + FFR + FRL + FRR;
    const Mpitch = FFL * XF + FFR * XF + FRL * XR + FRR * XR;
    const Mroll  = TRACK_W * (FFL - FFR + FRL - FRR);

    hv += (Fsum / M_BODY) * dt;
    phiv += (Mpitch / I_PITCH) * dt;
    thetav += (Mroll / I_ROLL) * dt;
    h += hv * dt;
    phi += phiv * dt;
    theta += thetav * dt;

    phi = clamp(phi, -0.16, 0.16);
    theta = clamp(theta, -0.12, 0.12);
    h = clamp(h, -0.25, 0.30);

    if (suspBlend < 1) {
      const w = 1 - suspBlend;
      h = h * suspBlend + rigidH * w;
      phi = phi * suspBlend + rigidPhi * w;
      theta = theta * suspBlend + rigidTheta * w;
      hv *= suspBlend;
      phiv *= suspBlend;
      thetav *= suspBlend;
    }

    let chatter = 0;
    if (suspBlend < 0.98) {
      const rigidAmt = 1 - suspBlend;
      const phase = performance.now() * 0.001;
      const speedFactor = clamp(v / 2.4, 0.2, 1.6);
      chatter = 0.006 * speedFactor * Math.sin(phase * 22)
              + 0.009 * speedFactor * Math.sin(phase * 55)
              + 0.005 * speedFactor * Math.sin(phase * 133);
      chatter *= rigidAmt;
    }

    const hVis = h + chatter;

    axleYf = (yfL + yfR) / 2 + RW;
    axleYr = (yrL + yrR) / 2 + RW;
    rollF = rigidRollF;
    rollR = rigidRollR;

    axleF.position.y = axleYf;
    axleR.position.y = axleYr;
    axleF.rotation.x = rollF;
    axleR.rotation.x = rollR;
    bodyG.position.y = hVis;
    bodyG.rotation.z = phi;
    bodyG.rotation.x = theta;

    const spin = (v * dt) / RW;
    wheelSpinners.forEach(s => { s.rotation.z -= spin; });

    const scrollMod = ((roadScroll % ROAD_LENGTH) + ROAD_LENGTH) % ROAD_LENGTH;
    roadMesh.position.x = -scrollMod;
    roadMesh2.position.x = -scrollMod + ROAD_LENGTH;
    dashesGroup.position.x = -scrollMod;
    markersGroup.position.x = -scrollMod;

    [coiloverL, coiloverR].forEach(co => {
      const zs = co.userData.z;
      const plateY = SPRING_SEAT_Y + hVis + phi * (XF - 0.15) + theta * zs;
      const baseY = axleYf + 0.19 - Math.sin(rollF) * zs;
      co.position.set(XF - 0.15, baseY, zs);
      const L = clamp(plateY - baseY, 0.28, 0.86);
      const scaleY = L / REST_LEN_F;
      co.userData.spring.scale.y = scaleY;
      const bulge = clamp(1 / Math.sqrt(scaleY), 0.92, 1.18);
      co.userData.spring.scale.x = bulge;
      co.userData.spring.scale.z = bulge;
      co.userData.damper.set(L + 0.08);
    });

    rearDampers.forEach(d => {
      const zs = d.g.userData.z;
      const seatY = 1.40 + hVis + phi * (XR + 0.45) + theta * zs;
      const baseY = axleYr + 0.05 - Math.sin(rollR) * zs;
      d.g.position.set(XR + 0.45, baseY, zs);
      d.set(clamp(seatY - baseY, 0.40, 1.05));
    });

    const now = performance.now();
    leafSprings.forEach(la => {
      const zs = la.z;
      const bodyY = 0.75 + hVis + phi * (XR - EYE_LOCAL) + theta * zs;
      const axleAtZ = axleYr - Math.sin(rollR) * zs;
      la.group.position.set(XR, axleAtZ - 0.10, zs);
      la.leafSy = clamp((bodyY - (axleAtZ - 0.10)) / EYE_RISE, 0.35, 1.25);
      la.leafSx = 1 + 0.16 * (1 - la.leafSy);

      if (la.leafSy <= 0.36 && la.prevSy > 0.36 && now - lastBottomOutT > 90) {
        lastBottomOutT = now;
        spawnSparks(XR, axleAtZ + 0.05, zs, 5, 0.8);
      }
      la.prevSy = la.leafSy;

      const eyeX = EYE_LOCAL * la.leafSx;
      const eyeY = EYE_RISE * la.leafSy;
      const P0 = { x: -eyeX, y: eyeY };
      const P2 = { x:  eyeX, y: eyeY };
      const C  = { x: 0, y: -eyeY };
      la.leafData.forEach(d => deformLeaf(d, P0, C, P2, d.stackOffset));
      la.eyeF.position.set(-eyeX, eyeY, 0);
      la.eyeR.position.set( eyeX, eyeY, 0);
    });

    shackles.forEach(sh => {
      const zs = sh.userData.z;
      const shTopX = XR + EYE_LOCAL;
      const shTopY = 1.04 + hVis + phi * (XR + EYE_LOCAL) + theta * zs;
      const la = leafSprings[zs < 0 ? 0 : 1];
      const ex = XR + EYE_LOCAL * la.leafSx;
      const ey = la.group.position.y + EYE_RISE * la.leafSy;
      const dx = ex - shTopX;
      const dy = ey - shTopY;
      sh.position.set(shTopX, shTopY, zs);
      sh.scale.y = Math.max(0.18, Math.hypot(dx, dy));
      sh.rotation.z = Math.atan2(dx, -dy);
    });

    rigidParts.forEach(p => {
      const zs = p.z;
      const base = p.front
        ? axleYf + 0.19 - Math.sin(rollF) * zs
        : axleYr + 0.04 - Math.sin(rollR) * zs;
      const top = p.front
        ? SPRING_SEAT_Y + hVis + phi * (XF - 0.15) + theta * zs
        : 1.42 + hVis + phi * XR + theta * zs;
      p.mesh.position.set(p.x, base, zs);
      p.mesh.scale.y = clamp(top - base, 0.30, 1.15);
    });

    if (state.showGas && !_firstFrame) {
      const midFr = Math.max(Math.abs(dvfL), Math.abs(dvfR));
      const midRr = Math.max(Math.abs(dvrL), Math.abs(dvrR));
      if (midFr > 0.55) spawnDust(XF, Math.min(12, Math.round(midFr * 10)), 0.7);
      if (midRr > 0.55) spawnDust(XR, Math.min(12, Math.round(midRr * 10)), 0.7);
    }

    if (suspBlend < 0.5) {
      const rigidAmt = 1 - suspBlend;
      const accel = Math.abs((defFL + defFR + defRL + defRR) / 4) * rigidAmt * 30;
      const tnow = performance.now();
      const rumble = clamp(v / 2.4, 0, 1.4) * 0.008 * rigidAmt;
      shakeAmt = Math.max(shakeAmt, rumble);

      if (accel > 3.5 && tnow - lastImpactT > 110) {
        lastImpactT = tnow;
        const power = clamp(accel / 8, 0.3, 1.6);
        const n = Math.round(6 + state.speedMul * 8 * power);
        spawnSparks(XF, axleYf - 0.15,  0.68, n, power);
        spawnSparks(XF, axleYf - 0.15, -0.68, n, power);
        spawnSparks(XR, axleYr - 0.15,  0.55, Math.round(n * 0.75), power);
        spawnSparks(XR, axleYr - 0.15, -0.55, Math.round(n * 0.75), power);
        shakeAmt = Math.max(shakeAmt, 0.05 + power * 0.06);
        flashImpact(power);
      }
    }

    prevDefFL = defFL; prevDefFR = defFR;
    prevDefRL = defRL; prevDefRR = defRR;
    prevYfL = yfL; prevYfR = yfR;
    prevYrL = yrL; prevYrR = yrR;
    _firstFrame = false;
  }

  function updateShockMeters(dt) {
    const frontImpact = clamp(
      (Math.abs(prevDefFL) + Math.abs(prevDefFR)) / 2 * (withSusp ? 0.12 : 1.1), 0, 1);
    const rearImpact = clamp(
      (Math.abs(prevDefRL) + Math.abs(prevDefRR)) / 2 * (withSusp ? 0.12 : 1.1), 0, 1);

    shockFrontSmooth += (frontImpact - shockFrontSmooth) * Math.min(1, dt * 5);
    shockRearSmooth  += (rearImpact  - shockRearSmooth)  * Math.min(1, dt * 5);

    ui.monitor.update({ rows: { shockF: Math.round(shockFrontSmooth * 100) + '%', shockR: Math.round(shockRearSmooth * 100) + '%' } });

    const maxShock = Math.max(shockFrontSmooth, shockRearSmooth);
    arrow.scale.y = 0.25 + 1.55 * maxShock;
    if (maxShock < 0.28) matArrow.color.set(0x22c55e);
    else if (maxShock < 0.62) matArrow.color.set(0xf59e0b);
    else matArrow.color.set(0xef4444);
  }

  const DANGER_UP = 0.32, DANGER_DOWN = 0.55;
  function updateDanger(dt) {
    if (!withSusp && state.playing) {
      const sf = Math.pow(state.speedMul / 2.5, 1.4);
      danger += DANGER_UP * sf * dt;
    } else {
      danger -= DANGER_DOWN * dt;
    }
    danger = clamp(danger, 0, 1);
    const pct = Math.round(danger * 100);

    let tone = 'ok';
    let verdict = 'Chassis coping fine';
    if (danger > 0.90) { tone = 'crit'; verdict = '⚠ ACCIDENT IMMINENT — slow down or re-enable suspension'; }
    else if (danger > 0.70) { tone = 'crit'; verdict = 'Severe impacts — structural risk'; }
    else if (danger > 0.40) { tone = 'warn'; verdict = 'Ride deteriorating — re-enable suspension'; }
    ui.monitor.update({ gauge: [pct, pct + '%'], rows: { chassis: [verdict, tone] } });
  }

  let roadInfoTimer = 0;
  function updateRoadInfo(dt) {
    roadInfoTimer -= dt;
    if (roadInfoTimer > 0) return;
    roadInfoTimer = 0.12;

    const xNow = XF + roadScroll;
    const f = roadFeatureAt(xNow);
    if (!f) {
      roadValEl.textContent = 'Flat';
      roadValEl.className = 'val';
      ui.monitor.update({ rows: { road: 'Flat' } });
    } else {
      const lateral = f.mode === 'left' ? 'L wheel' : f.mode === 'right' ? 'R wheel' : 'Both';
      const type = f.type === 'bump' ? 'Bump' : f.type === 'pot' ? 'Pothole'
                 : f.type === 'ripple' ? 'Washboard' : 'Wave';
      roadValEl.textContent = type + ' · ' + lateral;
      roadValEl.className = 'val ' + (f.type === 'pot' ? 'pot' : 'bump');
      ui.monitor.update({ rows: { road: type } });
    }

    const nx = nextRoadFeatureAt(xNow + 2);
    if (nx && nx.feature && nx.distance < 8) {
      const type = nx.feature.type === 'bump' ? 'Bump'
                 : nx.feature.type === 'pot' ? 'Pothole'
                 : nx.feature.type === 'ripple' ? 'Washboard' : 'Wave';
      const lat = nx.feature.mode === 'left' ? 'L'
                : nx.feature.mode === 'right' ? 'R' : 'Both';
      roadNextLabelEl.textContent = `→ ${type} (${lat}) in ${nx.distance.toFixed(1)}`;
    } else {
      roadNextLabelEl.textContent = '';
    }
  }

  /* ═══════════════════════════════════════════════════════════
     BRIDGE
     ═══════════════════════════════════════════════════════════ */
  bridge = ui.wireBridge({
    viewManager,
    state,
    onCommand: (d) => {
      switch (d.action) {
        case 'reset': resetSim(); break;
        case 'setSuspension': withSusp = !!d.value; applyMode(); break;
        case 'setSlowMo':
          ui.controls.set('slowmo', !!d.value);              /* onChange sets slowMo + the label */
          break;
      }
    }
  });
  bridge.ready();
  bridge.setStatus('Suspension', '#38bdf8');

  applyMode();
  updateSpeedLabel();

  /* ═══════════════════════════════════════════════════════════
     RENDER LOOP
     ═══════════════════════════════════════════════════════════ */
  const clock = new THREE.Clock();
  let lastSpeedMul = -1;

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.033);

    camera.position.sub(shakeOffset);

    if (state.playing && dt > 0) updateVehicle(dt);
    updateDust(dt);
    updateSparks(dt);
    updateShockMeters(dt);
    updateDanger(dt);
    updateRoadInfo(dt);

    if (state.speedMul !== lastSpeedMul) {
      lastSpeedMul = state.speedMul;
      updateSpeedLabel();
    }

    if (state.showLabels) {
      if (labelsDirty) { labels.hideAll(); labelsDirty = false; }
      labelDefs.forEach(d => {
        if (d.mech && !withSusp) return;
        if (d.rigid && withSusp) return;
        labels.project(d.id, d.pos(), camera, wrap);
      });
    } else {
      labels.hideAll();
    }

    controls.update();

    if (shakeAmt > 0.0008) {
      shakeOffset.set(
        (Math.random() - 0.5) * shakeAmt,
        (Math.random() - 0.5) * shakeAmt,
        (Math.random() - 0.5) * shakeAmt
      );
      camera.position.add(shakeOffset);
      shakeAmt *= 0.86;
    } else {
      shakeOffset.set(0, 0, 0);
      shakeAmt = 0;
    }

    renderer.render(scene, camera);
  }

  updateVehicle(0.016);
  animate();
  </script>
</body>
