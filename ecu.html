<script type="module">
import * as THREE from 'three';
import * as Base from './kit.js';
import { Widgets } from './components.js';

/* ═══════════════════════════════════════════════════════════════════════
   CONFIG
   ═══════════════════════════════════════════════════════════════════════ */
const CFG = {
  moduleId: 'ecu',
  accent:   '#a855f7',
  flowHz:   0.40
};

const state = Base.createUIState();
state.fault   = 'none';          // none | o2 | maf | ckp | tps | knock
state.t       = 0;

/* ═══════════════════════════════════════════════════════════════════════
   ENGINE + ECU MODEL — pure, named functions
   A 2.0 L four-cylinder petrol engine. Simplified physical trends, not a
   calibration file: every table is a plausible shape, not a real map.
   ═══════════════════════════════════════════════════════════════════════ */
const clampN = (x, a, b) => (Number.isFinite(x) ? (x < a ? a : (x > b ? b : x)) : a);
const lerpN  = (a, b, t) => a + (b - a) * t;

const DISP_L      = 2.0;     /* litres, total displacement                        */
const N_CYL       = 4;
const AFR_STOICH  = 14.7;    /* air : fuel by mass at lambda = 1                  */
const INJ_MG_MS   = 4.2;     /* mg/ms, injector static flow (about 330 cc/min)    */
const DEAD_MS     = 0.7;     /* ms, injector opening dead time                    */
const IAT_C       = 30;      /* degC, intake air temperature                      */
const RPM_MAX     = 6500;
const PLANT_BIAS  = 0.06;    /* the real engine delivers 6 % less fuel than commanded (injector tolerance) - the trims must find it */
const ECT_RUN     = 90;      /* degC, warm coolant                                */
const ECT_COLD    = 15;      /* degC, cold-start coolant                          */
const TAU_WARM    = 45;      /* s, warm-up time constant (compressed for the lab) */
const ECT_CLOSED  = 55;      /* degC, closed loop is allowed above this           */
const O2_DELAY    = 0.30;    /* s, exhaust transport delay from cylinder to sensor */
const K_STFT      = 0.10;    /* 1/s, short-term trim integrator rate              */
const K_LTFT      = 0.05;    /* 1/s, long-term trim learning rate                 */
const TRIM_LIM    = 0.25;    /* +-25 % trim authority                             */
const O2_TAU      = 0.12;    /* s, sensor response                                */
const KNOCK_STEP  = 1.5;     /* deg retard per detected knock event               */
const KNOCK_MAX   = 12;      /* deg, maximum knock retard                         */
const KNOCK_DECAY = 0.4;     /* deg/s, retard recovers when quiet                 */
const KNOCK_FAULT = 16;      /* deg, how much a knock event (bad fuel / hot charge) lowers the knock limit */
const LIMP_LOAD   = 0.22;    /* load cap in limp-home                             */
const LIMP_RPM    = 2500;    /* rpm cap in limp-home                              */

/* Calibration tables. Rows = engine speed, columns = manifold pressure. */
const RPM_AX = [800, 1500, 2500, 3500, 4500, 5500, 6500];
const MAP_AX = [30, 50, 70, 90, 100];
const VE_TAB = [
  [0.62, 0.66, 0.70, 0.73, 0.74],
  [0.68, 0.74, 0.80, 0.85, 0.86],
  [0.74, 0.81, 0.88, 0.94, 0.96],
  [0.78, 0.86, 0.94, 1.01, 1.03],
  [0.80, 0.88, 0.97, 1.04, 1.07],
  [0.76, 0.84, 0.93, 1.00, 1.03],
  [0.68, 0.75, 0.83, 0.89, 0.91]
];
const ADV_TAB = [                      /* degrees before TDC */
  [28, 24, 18, 14, 12],
  [32, 28, 23, 19, 16],
  [36, 32, 28, 23, 20],
  [38, 35, 31, 25, 23],
  [39, 36, 33, 26, 24],
  [38, 35, 32, 26, 24],
  [36, 33, 30, 25, 23]
];
const VE_RANGE  = [0.60, 1.08];
const ADV_RANGE = [10, 40];

/* Fractional position of x on an axis (index units). */
function fracIndex(ax, x) {
  const v = clampN(x, ax[0], ax[ax.length - 1]);
  let i = 0;
  while (i < ax.length - 2 && v >= ax[i + 1]) i++;
  return i + (v - ax[i]) / (ax[i + 1] - ax[i]);
}
/* Bilinear interpolation between the four nearest cells - what the ECU does on every lookup. */
function bilerp(tab, fi, fj) {
  const i0 = Math.min(Math.floor(fi), tab.length - 2), j0 = Math.min(Math.floor(fj), tab[0].length - 2);
  const a = fi - i0, b = fj - j0;
  return lerpN(lerpN(tab[i0][j0], tab[i0 + 1][j0], a), lerpN(tab[i0][j0 + 1], tab[i0 + 1][j0 + 1], a), b);
}

/* Manifold pressure (kPa). Direction: opening the throttle raises it; at high rpm a closed throttle pulls it lower. */
function mapKpa(load, rN) {
  const L = clampN(load, 0, 1), r = clampN(rN, 0, 1);
  return clampN(26 + 74 * Math.pow(L, 1.1) - 6 * (1 - L) * r, 18, 101);
}
/* Air mass flow (g/s) = cycles per second x displacement x manifold air density x volumetric efficiency. */
function airFlowGps(rpm, map, ve) {
  const rho = map / (0.287 * (273 + IAT_C));                 /* kg/m3 */
  return (rpm / 120) * (DISP_L / 1000) * rho * ve * 1000;
}
/* Air per cylinder per cycle (mg). */
function airMgPerCyl(flowGps, rpm) { return rpm > 1 ? flowGps * 1000 / (rpm / 120) / N_CYL : 0; }
/* Narrowband oxygen sensor voltage: steep step at lambda = 1. Direction: rich -> high, lean -> low. */
function o2Volts(lam) { return 0.05 + 0.85 / (1 + Math.exp((lam - 1) / 0.008)); }
/* Fuel target lambda. Direction: richer under power enrichment at high load and when the engine is cold. */
function lambdaTarget(loadReq, warm) {
  const power = loadReq > 0.78 ? 1 - 0.14 * clampN((loadReq - 0.78) / 0.22, 0, 1) : 1;
  return power / (1 + 0.30 * (1 - clampN(warm, 0, 1)));
}
/* Knock limit (deg BTDC): the most spark advance the engine tolerates. Direction: falls with load. */
function knockLimitDeg(load, faultOn) { return 54 - 28 * clampN(load, 0, 1) - (faultOn ? KNOCK_FAULT : 0); }

const FAULT_DTC = { none: 'None', o2: 'P0134', maf: 'P0102', ckp: 'P0335', tps: 'P0122', knock: 'P0327' };

/* Mutable model state (module level so Reset can reach it). */
const ECU = { ect: ECT_RUN, stft: 0, ltft: 0, o2v: 0.45, knockRet: 0, knockT: 0, knocking: false, cyc: 0, clk: 0, q: [], R: null };

function resetModel() {
  ECU.ect = ECT_RUN; ECU.stft = 0; ECU.ltft = 0; ECU.o2v = 0.45;
  ECU.knockRet = 0; ECU.knockT = 0; ECU.knocking = false; ECU.clk = 0; ECU.q = [];
}

/* One model step. dt = sim seconds (0 re-evaluates without integrating). Returns the readout record R. */
function stepModel(dt, loadReq, rpmReq, fault, mapKey) {
  const f = fault;
  const noStart = f === 'ckp', limp = f === 'tps';
  const L  = limp ? Math.min(loadReq, LIMP_LOAD) : loadReq;
  const rpm = noStart ? 220 : (limp ? Math.min(rpmReq, LIMP_RPM) : rpmReq);
  const rN = clampN((rpm - 800) / (RPM_MAX - 800), 0, 1);

  /* warm-up */
  if (dt > 0) ECU.ect += (ECT_RUN - ECU.ect) * (1 - Math.exp(-dt / TAU_WARM));
  const warm = clampN((ECU.ect - 20) / 45, 0, 1);

  /* air: what the engine really breathes, and what the ECU believes it breathes */
  const map  = mapKpa(L, rN);
  const fi = fracIndex(RPM_AX, rpm), fj = fracIndex(MAP_AX, map);
  const veTab = bilerp(VE_TAB, fi, fj);
  const veTrue = veTab * (1 + 0.08 * Math.sin(rpm / 900));    /* the real engine never matches the table exactly */
  const airTrue = noStart ? 0 : airFlowGps(rpm, map, veTrue);
  const airEst  = f === 'maf' ? airFlowGps(rpm, map, veTab)   /* speed-density: MAP + rpm + table */
                              : airTrue * 1.005;              /* MAF sensor reads within half a percent */

  /* fuel */
  const closed = !noStart && f !== 'o2' && ECU.ect > ECT_CLOSED && loadReq <= 0.78;   /* no power enrichment, engine warm enough */
  const lamTgt = closed ? 1 : lambdaTarget(loadReq, warm);
  const trimTot = closed ? (1 + ECU.stft + ECU.ltft) : (1 + ECU.ltft);
  const airMg = airMgPerCyl(airEst, rpm);
  const fuelCmdMg = noStart ? 0 : airMg / (AFR_STOICH * lamTgt) * trimTot;
  const pw = noStart ? 0 : fuelCmdMg / INJ_MG_MS + DEAD_MS;
  const fuelActMg = noStart ? 0 : (pw - DEAD_MS) * INJ_MG_MS * (1 - PLANT_BIAS);
  const lam = fuelActMg > 0 ? airMgPerCyl(airTrue, rpm) / (AFR_STOICH * fuelActMg) : 9.99;

  /* oxygen sensor and short-term trim (a limit cycle around lambda = 1) */
  let o2raw = f === 'o2' ? 0.45 : (ECU.ect < ECT_CLOSED ? 0.45 : o2Volts(lam));
  if (noStart) o2raw = 0.05;
  if (dt > 0) {
    /* the sensor sits downstream of the cylinders: its reading is O2_DELAY seconds old, then smoothed by its own lag */
    ECU.clk += dt; ECU.q.push([ECU.clk, o2raw]);
    while (ECU.q.length > 1 && ECU.q[1][0] <= ECU.clk - O2_DELAY) ECU.q.shift();
    const seen = ECU.q[0][1];
    ECU.o2v += (seen - ECU.o2v) * (1 - Math.exp(-dt / O2_TAU));
    if (closed) {
      ECU.stft = clampN(ECU.stft + (ECU.o2v > 0.45 ? -K_STFT : K_STFT) * dt, -TRIM_LIM, TRIM_LIM);
      ECU.ltft = clampN(ECU.ltft + K_LTFT * ECU.stft * dt, -TRIM_LIM, TRIM_LIM);
    } else {
      ECU.stft += (0 - ECU.stft) * (1 - Math.exp(-dt / 0.5));
    }
  }

  /* spark: map, then knock control */
  const advMap = noStart ? 0 : bilerp(ADV_TAB, fi, fj);
  const limit = knockLimitDeg(L, f === 'knock');
  const advCmd = advMap - ECU.knockRet;
  const knocking = !noStart && advCmd > limit;
  if (dt > 0) {
    if (knocking) {
      ECU.knockT += dt;
      if (ECU.knockT >= 0.25) { ECU.knockT = 0; ECU.knockRet = Math.min(KNOCK_MAX, ECU.knockRet + KNOCK_STEP); }
    } else {
      ECU.knockT = 0;
      ECU.knockRet = Math.max(0, ECU.knockRet - KNOCK_DECAY * dt);
    }
  }
  ECU.knocking = knocking;

  const loopTxt = noStart ? 'No start'
    : limp ? 'Limp home (load capped)'
    : f === 'o2' ? 'Open loop (default)'
    : f === 'maf' && closed ? 'Speed-density'
    : !closed && ECU.ect <= ECT_CLOSED ? 'Open loop (warm-up)'
    : !closed ? 'Open loop (power)'
    : 'Closed loop';

  const duty = pw > 0 && rpm > 1 ? pw / (120000 / rpm) : 0;                            /* injector duty over the 720 deg cycle */
  const egrDuty = (closed && L > 0.15 && L < 0.8 && ECU.ect > 60) ? 0.25 + 0.5 * L : 0;  /* purge / EGR valve schedule */
  const R = { f, noStart, limp, L, rpm, rN, map, fi, fj, veTab, airTrue, airEst, lamTgt, lam, closed, pw, duty, egrDuty,
    adv: advCmd, advMap, limit, knockRet: ECU.knockRet, knocking, stft: ECU.stft, ltft: ECU.ltft, o2v: ECU.o2v, ect: ECU.ect, warm, loopTxt,
    dtc: FAULT_DTC[f] || 'None', mil: f !== 'none', mapKey };
  ECU.R = R;
  return R;
}

/* ═══════════════════════════════════════════════════════════════════════
   SCENE
   ═══════════════════════════════════════════════════════════════════════ */
const built = Base.buildScene({
  fov: 42,
  camPos: [6.6, 4.8, 8.8],
  target: [0, 0.75, 0],
  floorY: -1.6,
  fogDensity: 0.028
});
const { scene, camera, renderer, controls, wrap, viewManager, quality } = built;
Base.attachResize(camera, renderer, wrap, built.baseFov);
const lowEnd = quality.isLowEnd;

/* ═══════════════════════════════════════════════════════════════════════
   MATERIALS
   ═══════════════════════════════════════════════════════════════════════ */
const M = Base.createMaterials();
const root = new THREE.Group();
scene.add(root);

const mat = (color, metal = .3, rough = .6, extra = {}) =>
  new THREE.MeshStandardMaterial({ color, metalness: metal, roughness: rough, ...extra });
const glassMat = (color, op = .25) => new THREE.MeshStandardMaterial({ color, metalness: .1, roughness: .2, transparent: true, opacity: op, depthWrite: false, side: THREE.DoubleSide });
const glowMat = (color, i = 1) => new THREE.MeshStandardMaterial({ color, emissive: new THREE.Color(color), emissiveIntensity: i, metalness: 0, roughness: .5 });
const addMesh = (geo, m, x, y, z, parent) => { const o = new THREE.Mesh(geo, m); o.position.set(x || 0, y || 0, z || 0); o.castShadow = !lowEnd; (parent || root).add(o); return o; };
const BOX = (w, h, d, m, x, y, z, p) => addMesh(new THREE.BoxGeometry(w, h, d), m, x, y, z, p);
const CYL = (rt, rb, h, m, x, y, z, p, seg = 16) => addMesh(new THREE.CylinderGeometry(rt, rb, h, seg), m, x, y, z, p);
const CYLZ = (rt, rb, h, m, x, y, z, p, seg = 20) => { const o = CYL(rt, rb, h, m, x, y, z, p, seg); o.rotation.x = Math.PI / 2; return o; };
const CYLX = (rt, rb, h, m, x, y, z, p, seg = 16) => { const o = CYL(rt, rb, h, m, x, y, z, p, seg); o.rotation.z = Math.PI / 2; return o; };

const MAT = {
  caseMat:  M.matMetalDark || mat(0x1f242e, .65, .42),
  pcb:      mat(0x135c35, .06, .82),
  pcbChip:  mat(0x11151a, .35, .52),
  pin:      mat(0xc8b270, .85, .30),
  cap:      mat(0x2a2f38, .30, .55),
  capTop:   mat(0x0f1218, .10, .75),
  resistor: mat(0x1a1d24, .30, .70),
  crystal:  mat(0xb9c2cc, .85, .25),
  screw:    mat(0x9aa3ae, .90, .30),
  sink:     mat(0xc0c8d2, .85, .30),
  sinkFin:  mat(0xa8b0bc, .80, .35),
  conn:     mat(0x1a1e26, .55, .55),
  pcbEdge:  mat(0x0d2016, .10, .80),
  steel:    mat(0x9aa3ae, .85, .30),
  darkM:    mat(0x2a2f38, .55, .50),
  brass:    mat(0xc8a24a, .80, .35)
};

/* deterministic scatter so the board looks the same on every load */
let seed = 20241;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* ═══════════════════════════════════════════════════════════════════════
   ECU ENCLOSURE
   ═══════════════════════════════════════════════════════════════════════ */
const ECU_W = 2.6, ECU_H = 0.72, ECU_D = 1.8;
const ECU_Y = 0.36;
const TOP_Y = ECU_Y + ECU_H / 2;

const caseMesh = BOX(ECU_W, ECU_H, ECU_D, MAT.caseMat, 0, ECU_Y, 0);
caseMesh.receiveShadow = true;

/* Case walls (slightly darker, to read as a chassis) */
const wallMat = mat(0x11151c, .55, .55);
const wallT = 0.04;
[
  [0, ECU_Y + ECU_H / 2 - wallT / 2, 0, ECU_W, wallT, ECU_D],
  [0, ECU_Y - ECU_H / 2 + wallT / 2, 0, ECU_W, wallT, ECU_D],
  [0, ECU_Y, ECU_D / 2 - wallT / 2, ECU_W, ECU_H, wallT],
  [0, ECU_Y, -ECU_D / 2 + wallT / 2, ECU_W, ECU_H, wallT]
].forEach(([x, y, z, w, h, d]) => BOX(w, h, d, wallMat, x, y, z));

/* Mounting screws - 4 corners */
const slotMat = mat(0x2a2f38, .5, .7);
[[-1, 1], [1, 1], [-1, -1], [1, -1]].forEach(([sx, sz], i) => {
  const x = sx * (ECU_W / 2 - 0.16), z = sz * (ECU_D / 2 - 0.16);
  CYL(0.055, 0.055, 0.028, MAT.screw, x, TOP_Y + 0.005, z, null, 14);
  const slot = BOX(0.075, 0.006, 0.010, slotMat, x, TOP_Y + 0.02, z);
  slot.rotation.y = i * 0.9;
});

/* Heat sink on top - base plate + fins */
BOX(1.9, 0.05, 1.1, MAT.sink, 0.15, TOP_Y + 0.025, 0);
for (let i = 0; i < 9; i++) BOX(1.9, 0.18, 0.045, MAT.sinkFin, 0.15, TOP_Y + 0.14, -0.45 + i * 0.11);

/* PCB sitting inside */
BOX(2.32, 0.06, 1.52, MAT.pcb, 0, ECU_Y + 0.39, 0);
BOX(2.34, 0.02, 1.54, MAT.pcbEdge, 0, ECU_Y + 0.36, 0);

/* Main processor with a glowing die strip */
const mainChip = BOX(0.66, 0.12, 0.52, MAT.pcbChip, -0.72, ECU_Y + 0.48, 0);
const chipTop = BOX(0.58, 0.01, 0.44, glowMat(0xa855f7, 0.6), -0.72, ECU_Y + 0.545, 0);
for (let i = 0; i < 10; i++) {
  BOX(0.02, 0.05, 0.16, MAT.pin, -0.72 - 0.36 + i * 0.08, ECU_Y + 0.415, 0.34);
  BOX(0.02, 0.05, 0.16, MAT.pin, -0.72 - 0.36 + i * 0.08, ECU_Y + 0.415, -0.34);
}
/* Co-processor and two memory chips (the flash holds the maps) */
BOX(0.42, 0.10, 0.36, MAT.pcbChip, 0.35, ECU_Y + 0.47, -0.42);
const flashChip = BOX(0.34, 0.09, 0.24, MAT.pcbChip, 0.35, ECU_Y + 0.465, 0.42);
const flashGlow = BOX(0.26, 0.006, 0.16, glowMat(0x38bdf8, 0.3), 0.35, ECU_Y + 0.515, 0.42);
BOX(0.34, 0.09, 0.24, MAT.pcbChip, -0.15, ECU_Y + 0.465, 0.42);

/* Electrolytic capacitors */
function addCap(x, z, r = 0.075, h = 0.20) {
  CYL(r, r, h, MAT.cap, x, ECU_Y + 0.39 + h / 2, z, null, 14);
  CYL(r + 0.002, r + 0.002, 0.006, MAT.capTop, x, ECU_Y + 0.39 + h + 0.003, z, null, 14);
}
[[-0.05, -0.62], [0.05, -0.62], [0.15, -0.62]].forEach(([x, z]) => addCap(x, z, 0.075, 0.22));
[[0.55, 0.62], [0.68, 0.62]].forEach(([x, z]) => addCap(x, z, 0.090, 0.26));
addCap(0.95, -0.10, 0.065, 0.18);

/* SMD scatter */
const smdGeo = new THREE.BoxGeometry(0.045, 0.028, 0.030);
const smdMats = [mat(0x2a1810, .3, .7), mat(0x1a1d24, .3, .7), mat(0x102030, .3, .7)];
for (let i = 0; i < 46; i++) {
  const x = -1.05 + rnd() * 2.1, z = -0.68 + rnd() * 1.36;
  if (Math.abs(x + 0.72) < 0.35 && Math.abs(z) < 0.30) continue;
  const m = addMesh(smdGeo, smdMats[i % 3], x, ECU_Y + 0.42, z);
  m.rotation.y = rnd() < 0.5 ? 0 : Math.PI / 2;
}
for (let i = 0; i < 5; i++) BOX(0.28, 0.045, 0.055, MAT.resistor, -0.35 + i * 0.14, ECU_Y + 0.42, 0.62);
BOX(0.14, 0.06, 0.10, MAT.crystal, -0.95, ECU_Y + 0.45, -0.35);

/* Side connectors with visible pins */
function addConnector(sideSign) {
  BOX(0.26, 0.50, 1.30, MAT.conn, sideSign * 1.42, ECU_Y, 0);
  const pinGeo = new THREE.CylinderGeometry(0.012, 0.012, 0.09, 8);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 6; c++) {
    const p = addMesh(pinGeo, MAT.pin, sideSign * 1.58, ECU_Y - 0.20 + r * 0.20, -0.50 + c * 0.20);
    p.rotation.z = Math.PI / 2;
  }
  BOX(0.05, 0.54, 1.34, mat(0x0d1015, .55, .55), sideSign * 1.29, ECU_Y, 0);
}
addConnector(-1);
addConnector(1);

/* Status LEDs on the PCB */
function addPCB_LED(x, z, color) {
  const lm = new THREE.MeshStandardMaterial({ color, emissive: new THREE.Color(color), emissiveIntensity: 0.2, roughness: .4, metalness: .2 });
  CYL(0.035, 0.035, 0.03, lm, x, ECU_Y + 0.42, z, null, 10);
  return { mat: lm };
}
const ledPWR = addPCB_LED(-1.05, 0.70, 0x22ff88);
const ledCAN = addPCB_LED(-0.95, 0.62, 0xffcc22);
const ledMIL = addPCB_LED(-0.85, 0.70, 0xff3333);
const ledACT = addPCB_LED(-0.75, 0.62, 0xa855f7);

/* ═══════════════════════════════════════════════════════════════════════
   MAP SURFACE - the fuel / spark map as a 7 x 5 bar chart floating above the ECU
   ═══════════════════════════════════════════════════════════════════════ */
const MAP_Y = 1.42, BAR_DX = 0.30, BAR_DZ = 0.24, BAR_MIN = 0.05, BAR_RANGE = 0.46;
const mapGroup = new THREE.Group(); mapGroup.position.set(0.15, MAP_Y, 0); root.add(mapGroup);
BOX(2.34, 0.02, 1.42, glassMat(0xa855f7, .16), 0, -0.015, 0, mapGroup);
mapGroup.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(2.34, 0.02, 1.42)),
  new THREE.LineBasicMaterial({ color: 0xa855f7, transparent: true, opacity: 0.7 })));
[[-1.1, -0.65], [1.1, -0.65], [-1.1, 0.65], [1.1, 0.65]].forEach(([x, z]) =>
  CYL(0.012, 0.012, MAP_Y - TOP_Y - 0.16, MAT.steel, 0.15 + x, TOP_Y + 0.16 + (MAP_Y - TOP_Y - 0.16) / 2, z, null, 6));

}

function makeLink(a, b, colour) {
  const linkMat = mat(0x556074, .45, .55);
  const tube = Base.tubeBetween(a, b, 0.022, 0.022, linkMat, true);
  tube.castShadow = false;
  root.add(tube);
  const parts = [];
  const n = lowEnd ? 3 : 4;
  for (let i = 0; i < n; i++) {
    const p = new THREE.Mesh(pGeo, new THREE.MeshBasicMaterial({ color: colour, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false }));
    root.add(p);
    parts.push(p);
  }
  const rec = { a: a.clone(), b: b.clone(), parts, mat: linkMat, dead: false, baseColor: colour };
  lines.push(rec);
  return rec;
}
function makeNode(spec, side) {
  spec.tints = [];
  const grp = new THREE.Group();
  grp.position.set(side * 3.0, NODE_Y, spec.z);
  root.add(grp);
  BUILD[spec.id](grp, spec);
  spec.mesh = grp;
  spec.side = side;
  return grp;
}

  /* The injected fault, the map shown and two actions live in the dock options row */
  options: [
    { id: 'fault', type: 'choice', layout: 'select', label: 'Injected fault', ariaLabel: 'Injected fault',
      options: [{ id: 'none', label: 'None' }, { id: 'o2', label: 'O\u2082 open' }, { id: 'maf', label: 'MAF open' },
                { id: 'ckp', label: 'Crank no-signal', tone: 'crit' }, { id: 'tps', label: 'Throttle sensor', tone: 'crit' }, { id: 'knock', label: 'Knock event', tone: 'crit' }],
      onChange: (id) => { if (id !== state.fault) setFault(id); } },
    { id: 'map', type: 'choice', layout: 'segmented', label: 'Map shown', ariaLabel: 'Map shown above the ECU',
      options: [{ id: 'fuel', label: 'Fuel' }, { id: 'spark', label: 'Spark' }], def: 'fuel',
      onChange: (id) => { mapMode = id; refreshNow(); } },
    { id: 'coldstart', type: 'action', label: 'Cold start', ariaLabel: 'Restart with a cold engine',
      onAction: () => { ECU.ect = ECT_COLD; refreshNow(); } },
    { id: 'relearn', type: 'action', label: 'Reset trims', ariaLabel: 'Erase the learned fuel trims',
      onAction: () => { ECU.stft = 0; ECU.ltft = 0; refreshNow(); } }
  ]
});

/* ── tab host ─────────────────────────────────────────────────────── */
const tabHost = document.createElement('div');
tabHost.id = 'al-tabs';
tabHost.className = 'al-tabs';
ui.panel.body.appendChild(tabHost);
Widgets.wireQuiz(tabHost);            /* one click handler; the tab content is swapped underneath it */

function renderTab(id) {
  tabHost.innerHTML = (TABS[id] || TABS.overview)();
}
renderTab('overview');

/* ── fault switching ──────────────────────────────────────────────── */
function setFault(f) {
  state.fault = f;
  ui.controls.setValue('fault', f);                       /* keep the dock choice in step (no-op when it already matches) */
  applyFaultVisuals();
  refreshNow();
}

/* ═══════════════════════════════════════════════════════════════════════
   FAULT VISUALS
   ═══════════════════════════════════════════════════════════════════════ */
function setBadge(text, colour) {
  const badge = document.getElementById('stroke-badge') || document.querySelector('.al-badge');
  if (badge) {
    badge.style.background = `color-mix(in oklch, ${colour} 18%, transparent)`;
    badge.style.color = colour;
  }
  const label = document.getElementById('badge-text') || (badge && badge.querySelector('.al-badge-text'));
  if (label) label.textContent = text;
  else if (badge) badge.textContent = text;
}

function markDead(n) {
  n.dead = true;
  n.link.dead = true;
  n.link.mat.color.setHex(0xb03030);
  n.tints.forEach((t) => t.m.color.setHex(0x8a2222));
  n.ledMat.color.setHex(0xff3333);
  n.ledMat.emissive.setHex(0xff3333);
}
function applyFaultVisuals() {
  const f = state.fault;
  [...INPUTS, ...OUTPUTS].forEach((n) => {
    n.dead = false;
    n.link.dead = false;
    n.link.mat.color.setHex(0x556074);
    n.tints.forEach((t) => t.m.color.copy(t.base));
    n.ledMat.color.setHex(0x22ff88);
    n.ledMat.emissive.setHex(0x22ff88);
  });
  const node = (id) => [...INPUTS, ...OUTPUTS].find((x) => x.id === id);
  if (f === 'o2') markDead(node('o2'));
  else if (f === 'maf') markDead(node('maf'));
  else if (f === 'ckp') { markDead(node('ckp')); OUTPUTS.forEach(markDead); }
  else if (f === 'tps') { markDead(node('tps')); markDead(node('thr')); }
  else if (f === 'knock') {
    const ig = node('ign');
    ig.tints.forEach((t) => t.m.color.setHex(0xff8844));
    ig.ledMat.color.setHex(0xffcc22);
    ig.ledMat.emissive.setHex(0xffcc22);
  }

  const txt = f === 'none'  ? 'Closed loop'
            : f === 'o2'    ? 'Open loop \u00B7 default'
            : f === 'maf'   ? 'Speed-density fallback'
            : f === 'ckp'   ? 'No start \u00B7 cranking'
            : f === 'tps'   ? 'Limp home'
            : f === 'knock' ? 'Knock retard active'
            : 'Fault';
  setBadge(txt, f === 'none' ? CFG.accent : '#ef4444');
}
applyFaultVisuals();

/* ═══════════════════════════════════════════════════════════════════════
   READOUTS - one Monitor update per call
   ═══════════════════════════════════════════════════════════════════════ */
const sgn = (v) => (v >= 0 ? '+' : '\u2212') + Math.abs(v).toFixed(1);
function pushReadouts(R) {
  const f = R.f, ns = R.noStart;
  const dev = Math.abs(R.lam - R.lamTgt) / R.lamTgt;
  const status = ns ? ['No start', false]
    : R.limp ? ['Limp home', false]
    : f === 'o2' ? ['Open loop', false]
    : f === 'maf' ? ['Fallback', false]
    : R.knocking || R.knockRet > 0.2 ? ['Knock retard', false]
    : !R.closed && R.ect <= ECT_CLOSED ? ['Warm-up', false]
    : ['Running', true];
  ui.monitor.update({
    value: { text: ns ? '\u2014' : String(Math.round(R.rpm)), unit: ' rpm', bar: clampN(R.rpm / RPM_MAX * 100, 0, 100),
      barColor: (ns || R.limp || f === 'o2') ? 'var(--crit)' : 'var(--al-accent)' },
    rows: {
      adv:  ns ? '\u2014' : R.adv.toFixed(1) + '\u00B0 BTDC',
      pw:   ns ? '\u2014' : R.pw.toFixed(2) + ' ms',
      kr:   [R.knockRet > 0.05 ? '\u2212' + R.knockRet.toFixed(1) + '\u00B0' : '0.0\u00B0', R.knocking ? 'crit' : (R.knockRet > 0.05 ? 'warn' : 'ok')],
      lam:  ns ? '\u2014' : [R.lam.toFixed(3), dev < 0.04 ? 'ok' : (dev < 0.12 ? 'warn' : 'crit')],
      air:  ns ? '\u2014' : (f === 'maf' ? R.airEst.toFixed(1) + ' g/s (est.)' : R.airTrue.toFixed(1) + ' g/s'),
      o2:   f === 'o2' ? ['0.45 V (fixed)', 'crit'] : R.o2v.toFixed(2) + ' V',
      stft: [sgn(R.stft * 100) + ' %', (f === 'o2' || ns) ? 'crit' : 'ok'],
      ltft: [sgn(R.ltft * 100) + ' %', Math.abs(R.ltft) > 0.10 ? 'warn' : 'ok'],
      ect:  [R.ect.toFixed(0) + ' \u00B0C', R.ect < ECT_CLOSED ? 'warn' : 'ok'],
      loop: [R.loopTxt, (f === 'o2' || ns || R.limp) ? 'crit' : (R.closed ? 'ok' : 'warn')],
      dtc:  [R.dtc, f === 'none' ? 'ok' : 'warn'],
      mil:  [R.mil ? 'ON' : 'OFF', R.mil ? 'warn' : '']
    },
    status
  });
}

function readInputs() { return [ui.controls.value('load') / 100, ui.controls.value('rpm')]; }
function refreshNow() {                               /* re-evaluate without advancing time (slider, fault or map changes) */
  const [L, rpm] = readInputs();
  pushReadouts(stepModel(0, L, rpm, state.fault, mapMode));
}

/* ═══════════════════════════════════════════════════════════════════════
   MESSAGING
   ═══════════════════════════════════════════════════════════════════════ */
const bridge = ui.wireBridge({
  viewManager,
  state,
  onCommand: (d) => {
    if (d.action === 'reset') {
      ui.controls.resetAll();
      resetModel();
      mapMode = 'fuel';
      setFault('none');
    }
  }
});
bridge.ready();
bridge.setStatus('ECU online', '#a855f7');

/* ═══════════════════════════════════════════════════════════════════════
   ANIMATION
   ═══════════════════════════════════════════════════════════════════════ */
let t = 0;
let last = performance.now();
let raf = 0;
let roClock = 0;

const tmp = new THREE.Vector3();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DEG = Math.PI / 180;

const C_OK    = new THREE.Color(0x22ff88);
const C_WARN  = new THREE.Color(0xffcc22);
const C_FAULT = new THREE.Color(0xff3333);
const MAP_COL = { fuel: [new THREE.Color(0x1e3a8a), new THREE.Color(0xc084fc)], spark: [new THREE.Color(0x0e7490), new THREE.Color(0xfbbf24)] };
const tmpCol = new THREE.Color();

function updateMapSurface(R, dt) {
  const tab = mapMode === 'spark' ? ADV_TAB : VE_TAB;
  const rng = mapMode === 'spark' ? ADV_RANGE : VE_RANGE;
  const [c0, c1] = MAP_COL[mapMode];
  const i0 = Math.min(Math.floor(R.fi), RPM_AX.length - 2), j0 = Math.min(Math.floor(R.fj), MAP_AX.length - 2);
  const a = R.fi - i0, b = R.fj - j0;
  const k = Math.min(1, dt * 8 + 0.02);
  for (let i = 0; i < RPM_AX.length; i++) for (let j = 0; j < MAP_AX.length; j++) {
    const bar = bars[i][j];
    const n = clampN((tab[i][j] - rng[0]) / (rng[1] - rng[0]), 0, 1);
    const target = BAR_MIN + BAR_RANGE * n;
    bar.h += (target - bar.h) * k;
    bar.mesh.scale.y = bar.h;
    bar.mesh.position.y = bar.h / 2;
    bar.mat.color.copy(c0).lerp(c1, n);
    const wi = i === i0 ? 1 - a : (i === i0 + 1 ? a : 0), wj = j === j0 ? 1 - b : (j === j0 + 1 ? b : 0);
    bar.mat.emissive.copy(bar.mat.color);
    bar.mat.emissiveIntensity = R.noStart ? 0 : 0.75 * wi * wj;
  }
  const hh = lerpN(lerpN(bars[i0][j0].h, bars[i0 + 1][j0].h, a), lerpN(bars[i0][j0 + 1].h, bars[i0 + 1][j0 + 1].h, a), b);
  const px = (R.fi - 3) * BAR_DX, pz = (R.fj - 2) * BAR_DZ;
  probe.position.set(px, hh + 0.09, pz);
  probeLine.position.set(px, (hh + 0.09) / 2, pz);
  probeLine.scale.y = hh + 0.09;
  probe.visible = probeLine.visible = !R.noStart;
}

function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  const sp = state.playing ? state.speedMul : 0;
  const dtp = dt * sp;
  t += dtp;

  /* ── engine + ECU model ── */
  const [L, rpmReq] = readInputs();
  const R = stepModel(dtp, L, rpmReq, state.fault, mapMode);
  ECU.cyc += dtp * (R.noStart ? 0.25 : 0.30 + 1.1 * R.rN) * 360;     /* visual crank: slowed so strokes can be followed */
  const ctx = { cyc: ECU.cyc, crank: ECU.cyc * DEG, throttle: R.limp ? 0.12 : 0.05 + 0.95 * R.L };

  /* ── ECU chip activity glow ── */
  const activity = 0.35 + 0.55 * Math.abs(Math.sin(t * 6.5)) * (0.5 + L / 2);
  chipTop.material.emissiveIntensity = activity * (state.fault === 'none' ? 1.0 : 0.35);
  flashGlow.material.emissiveIntensity = 0.3 + 0.9 * Math.abs(Math.sin(t * 9)) * (R.noStart ? 0.2 : 1);

  /* ── PCB LEDs ── */
  ledPWR.mat.emissiveIntensity = 0.9;
  ledCAN.mat.emissiveIntensity = 0.35 + 0.55 * Math.abs(Math.sin(t * 3.1));
  ledMIL.mat.emissiveIntensity = state.fault === 'none' ? 0.10 : 0.9 + 0.6 * Math.abs(Math.sin(t * 5.0));
  ledACT.mat.emissiveIntensity = 0.30 + 0.80 * Math.abs(Math.sin(t * 11.0));

  /* ── sensor / actuator assemblies and their LEDs ── */
  [...INPUTS, ...OUTPUTS].forEach((n) => {
    if (n.anim) n.anim(R, ctx);
    const target = n.dead ? C_FAULT : (state.fault === 'knock' && n.id === 'ign' ? C_WARN : C_OK);
    n.ledMat.emissive.lerp(target, 0.15);
    n.ledMat.color.copy(n.ledMat.emissive);
  });

  /* ── map surface and probe ── */
  updateMapSurface(R, dt);

  /* ── flowing signal particles ── */
  const baseHz = CFG.flowHz * (0.6 + R.rN * 1.4);
  for (const Lk of lines) {
    const n = Lk.parts.length;
    for (let i = 0; i < n; i++) {
      const p = Lk.parts[i];
      if (Lk.dead) { p.visible = false; continue; }
      p.visible = true;
      let u = (t * baseHz + i / n) % 1;
      if (u < 0) u += 1;
      p.position.lerpVectors(Lk.a, Lk.b, u);
      p.scale.setScalar(0.45 + 0.85 * Math.sin(Math.PI * u));
      p.material.opacity = 0.35 + 0.65 * Math.sin(Math.PI * u);
    }
  }

  /* ── labels ── */
  labels.hideAll();
  if (state.showLabels) {
    labels.project('ecu', tmp.set(-0.9, ECU_Y - 0.1, ECU_D / 2 + 0.25), camera, wrap);
    labels.project('map', tmp.set(0.15, MAP_Y + 0.85, 0), camera, wrap);
    labels.project('obd', tmp.set(OBD_POS.x, OBD_POS.y + 0.35, OBD_POS.z), camera, wrap);
    for (const n of INPUTS) labels.project('in-' + n.id, tmp.set(n.mesh.position.x, n.mesh.position.y + 0.85, n.mesh.position.z), camera, wrap);
    for (const n of OUTPUTS) labels.project('out-' + n.id, tmp.set(n.mesh.position.x, n.mesh.position.y + 0.85, n.mesh.position.z), camera, wrap);
  }

  controls.update();
  renderer.render(scene, camera);

  roClock += dt;
  if (roClock > 0.12) { roClock = 0; pushReadouts(R); }
}

if (reduced) {
  setInterval(() => { refreshNow(); renderer.render(scene, camera); }, 120);
} else {
  raf = requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', () => {
  if (reduced) return;
  if (document.hidden) {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  } else if (!raf) {
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }
});

/* first paint */
refreshNow();
</script>
</body>
</html>
