    '<div class="al-sec"><h4>What pushes the gas round</h4><p>Gas only flows from high pressure to low. The valve opening sets the <b>area</b>, but the flow also scales with the square root of the <b>exhaust-minus-intake pressure</b>. At light load the throttled intake is below atmosphere and EGR flows freely; at full load the boosted intake nearly matches the exhaust, so even a wide-open valve moves little gas. That is why high-load EGR needs a back-pressure flap or a venturi.</p></div>' +

/* ═══════════════════════════════════════════════════════════════════
   PHYSICS MODEL — pure, named functions.
   Simplified physical trends, not a bench lookup table.
   Direction of every effect is stated above its function.
   ═══════════════════════════════════════════════════════════════════ */

function clampN(x, a, b) {
  if (!Number.isFinite(x)) return a;
  return x < a ? a : (x > b ? b : x);
}
const num = (x, d) => (Number.isFinite(x) ? x : d);
const smooth = (a, b, x) => { const t = clampN((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* ── named constants ─────────────────────────────────────────────── */
const EGR_MAX      = 0.30;   /* maximum EGR fraction of the charge (valve fully open, full pressure drive) */
const TAU_VALVE    = 0.28;   /* s, EGR valve actuator time constant            */
const TAU_WARM     = 75;     /* s, coolant warm-up time constant (before time scale) */
const ECT_RUN      = 90;     /* °C, warm engine coolant                        */
const ECT_COLD     = 20;     /* °C, cold-start coolant                         */
const ECT_MIN_EGR  = 60;     /* °C, ECU keeps EGR off below this coolant temperature */
const COOLER_OK    = 0.78;   /* EGR cooler effectiveness, clean                */
const FRESH_AIR_C  = 35;     /* °C, fresh charge air after the intercooler     */
const NOX_SCALE    = 1500;   /* ppm, NOx at 2400 °C peak flame temperature     */
const NOX_T_REF    = 2400;   /* °C, reference peak temperature                 */
const NOX_T_SPAN   = 300;    /* °C, exponential sensitivity of NOx to temperature */
const LIFT_MAX_MM  = 6.0;    /* mm, full poppet travel                         */
const DP_REF       = 20;     /* kPa, exhaust-minus-intake pressure that gives full flow */
const K_CARBON     = 0.0103; /* 1/s, carbon deposition per unit (soot + 0.15) x flow */
const K_BURN       = 0.0008; /* 1/s, deposits burned off by hot fast gas at high load and rpm */
const K_FOUL       = 0.004;  /* 1/s, cooler fouling per unit soot x flow       */
const TRIM_KI      = 0.6;    /* 1/s, ECU closed-loop EGR trim gain             */

/* Exhaust gas temperature entering the cooler (°C). Direction: more
   load and more speed -> hotter. */
function exhaustTempC(load, rN) {
  return 250 + 430 * clampN(num(load, 0), 0, 1) + 40 * clampN(num(rN, 0), 0, 1);
}

/* Exhaust manifold pressure (kPa abs). Direction: rises with load and rpm
   (more mass flow through the turbine / silencer). */
function exhaustPressureKpa(load, rN) {
  const L = clampN(num(load, 0), 0, 1), r = clampN(num(rN, 0), 0, 1);
  return 101 + 38 * L * (0.45 + 0.55 * r);
}

/* Intake manifold pressure (kPa abs). Direction: throttled and below
   atmosphere at light load, boosted at high load and speed. */
function intakePressureKpa(load, rN) {
  const L = clampN(num(load, 0), 0, 1), r = clampN(num(rN, 0), 0, 1);
  return 101 - 30 * (1 - L) + 26 * L * L * (0.4 + 0.6 * r);
}

/* Flow factor 0..1 from the pressure difference (orifice flow ~ sqrt(dp)).
   Direction: no flow when the intake is at or above the exhaust pressure. */
function dpFlowFactor(dpKpa) {
  return clampN(Math.sqrt(Math.max(num(dpKpa, 0), 0) / DP_REF), 0, 1);
}

/* EGR cooler effectiveness. Direction: fouled tubes transfer less heat. */
function coolerEffectiveness(foul) {
  return COOLER_OK * (1 - 0.85 * clampN(num(foul, 0), 0, 0.9));
}

/* EGR cooler outlet temperature (°C). Direction: higher effectiveness
   and colder coolant pull the gas temperature further down. */
function egrCoolerOutC(egrInC, coolantC, effectiveness) {
  const inC = clampN(num(egrInC, 600), 0, 1200);
  const cw  = clampN(num(coolantC, ECT_RUN), 0, 130);
  const eff = clampN(num(effectiveness, COOLER_OK), 0, 1);
  return clampN(inC - (inC - cw) * eff, Math.min(cw, inC), inC);
}

/* Intake charge temperature (°C): mass-weighted blend of fresh air and
   cooled EGR using the true EGR fraction. Direction: hotter EGR or more
   EGR -> hotter charge. */
function intakeChargeC(freshC, egrC, egrFrac) {
  const e = clampN(num(egrFrac, 0), 0, 0.5);
  const f = clampN(num(freshC, FRESH_AIR_C), -20, 120);
  const g = clampN(num(egrC, 200), -20, 900);
  return clampN((1 - e) * f + e * g, -20, 900);
}

/* Peak flame temperature (°C). Directions: more load -> hotter; more
   EGR -> cooler, and cooled EGR (dense, so more inert mass) dilutes
   better than hot EGR; a hotter intake charge carries straight through
   to a hotter flame. */
function peakFlameTempC(load, egrFrac, coolerEff, chargeC) {
  const L = clampN(num(load, 0), 0, 1);
  const e = clampN(num(egrFrac, 0), 0, EGR_MAX);
  const cool = clampN(num(coolerEff, COOLER_OK) / COOLER_OK, 0, 1.2);
  const base = 850 + 1550 * L;
  const dilution = 3600 * e * L * (0.6 + 0.4 * cool);
  const carry = 0.8 * (clampN(num(chargeC, FRESH_AIR_C), -20, 900) - FRESH_AIR_C);
  return clampN(base - dilution + carry, 500, 2600);
}

/* NOx concentration (ppm). Direction: falls almost exponentially as peak
   flame temperature drops (Zeldovich, simplified); a little less oxygen
   in the diluted charge trims it further. */
function noxPpm(Tpeak, egrFrac) {
  const T = clampN(num(Tpeak, 1200), 500, 3000);
  const o2 = Math.sqrt(clampN(1 - 1.4 * num(egrFrac, 0), 0.3, 1));
  return clampN(NOX_SCALE * Math.exp((T - NOX_T_REF) / NOX_T_SPAN) * o2, 8, 2500);
}

/* Soot knee: the EGR fraction where soot starts to climb. Direction: it
   falls with load, at low speed (poor mixing) and with a hot charge. */
function sootKnee(load, rN, chargeC) {
  const L = clampN(num(load, 0), 0, 1), r = clampN(num(rN, 0), 0, 1);
  return clampN(0.19 - 0.07 * L - 0.03 * (1 - r) - (clampN(num(chargeC, FRESH_AIR_C), -20, 900) - FRESH_AIR_C) / 3000, 0.04, 0.3);
}

/* Soot index 0..1. Direction: small baseline, rising steeply once EGR
   passes the knee. */
function sootIndex(load, egrFrac, rN, chargeC) {
  const L = clampN(num(load, 0), 0, 1), r = clampN(num(rN, 0), 0, 1);
  const e = clampN(num(egrFrac, 0), 0, EGR_MAX);
  const excess = clampN(e - sootKnee(L, r, chargeC), 0, 0.2);
  return clampN(0.03 + 0.07 * L * L * (1 - 0.5 * r) + 8.0 * excess * L, 0, 1);
}

/* Combustion roughness 0..1. Direction: too much inert gas for the load
   quenches the flame, so the stable limit rises with load. */
function roughness(load, egrFrac) {
  const L = clampN(num(load, 0), 0, 1);
  return clampN((clampN(num(egrFrac, 0), 0, 0.4) - (0.10 + 0.5 * L)) / 0.2, 0, 1);
}

/* Power lost to EGR displacement and rough running, 0..40 %. Direction:
   more EGR -> less fresh air -> less torque. */
function powerLossPct(egrFrac, rough) {
  return clampN(80 * clampN(num(egrFrac, 0), 0, EGR_MAX) + 8 * clampN(num(rough, 0), 0, 1), 0, 40);
}

/* EGR rate the ECU asks for (fraction of the charge). Direction: peak in
   the mid-load cruise region, off at idle, off while the engine is cold,
   faded out at very low and very high speed, and held just under the soot
   knee so the map never trades NOx for smoke. */
function ecuEgrTarget(load, rpm, ect) {
  const L = clampN(num(load, 0), 0, 1);
  if (L < 0.10 || num(ect, ECT_RUN) < ECT_MIN_EGR) return 0;
  const rN = clampN((num(rpm, 2000) - 800) / 3700, 0, 1);
  const shape = EGR_MAX * (1 - Math.pow(Math.abs(L - 0.45) / 0.55, 1.6));
  const rpmWin = smooth(900, 1400, num(rpm, 2000)) * (1 - smooth(3600, 4400, num(rpm, 2000)));
  const ceiling = sootKnee(L, rN, FRESH_AIR_C + 40) - 0.015;
  return clampN(Math.min(shape, ceiling) * rpmWin, 0, EGR_MAX);
}

const FAULT_INFO = {
  none:     { label: 'None (healthy)',            warn: '' },
  carboned: { label: 'Carboned-up valve (P0401)',  warn: 'The poppet and seat are caking with soot, so the actual EGR rate falls well below the commanded rate. Expect rough idle, hesitation and a P0401 insufficient-flow code once the valve runs out of travel.' },
  stuckopen:{ label: 'Valve stuck open',           warn: 'The valve is jammed off its seat. Even at idle the engine swallows inert gas, combustion becomes unstable and cylinders start to misfire. Black smoke and a strong diesel smell are common.' },
  stuckshut:{ label: 'Valve stuck closed',         warn: 'The valve will not open, so no EGR is delivered. Driveability is normal but NOx rises sharply. Compare the white command mark with the violet position mark beside the valve.' },
  coolerleak:{ label: 'EGR cooler leak',           warn: 'Coolant is leaking through a cracked cooler tube into the exhaust. White vapour from the tailpipe, coolant loss with no external leak and a sweet smell. The coolant level is falling and the engine runs hotter.' },
  clogcooler:{ label: 'Clogged EGR cooler',        warn: 'The cooler tubes are sooted up so heat transfer has collapsed. Charge temperature rises, NOx creeps back up even with the valve working correctly.' }
};

/* ═══════════════════════════════════════════════════════════════════
   MODULE STATE
   ═══════════════════════════════════════════════════════════════════ */
const S = {
  load: 0.45,
  rpm: 2200,
  auto: false,
  fault: 'none',
  speed: 1
};

/* ── simulation state (module level so Reset can reach it) ───────── */
/* The history lives in the Monitor (CFG.traces); the module only hands over one normalised sample
   per ~140 ms while the sim runs (0..100 % of each old axis range) and the current warning sentence. */
let traceSample = null, traceClear = false, warnText = '';
const traceN = (v, lo, hi) => Math.round(clampN((v - lo) / (hi - lo), 0, 1) * 1000) / 10;
const sim = {
  valve: 0.0,      /* 0..1 actual poppet position                       */
  carbon: 0.0,     /* 0..0.95 deposits on poppet and seat                */
  foul: 0.0,       /* 0..0.9 EGR cooler tube fouling                     */
  coolant: 1.0,    /* 0..1 coolant level                                 */
  ect: ECT_RUN,    /* °C engine coolant temperature                      */
  trim: 0.0,       /* ECU closed-loop valve trim (auto mode)             */
  rate: 0.0,       /* last actual EGR fraction (fed back to the ECU)     */
  tLow: 0.0,       /* s, ECU has been starved of flow                    */
  tHigh: 0.0,      /* s, ECU has seen flow it did not ask for            */
  dtc: '',         /* stored code, '' / P0401 / P0402                    */
  lastT: -1
};

function resetModel() {
  sim.valve = 0.0; sim.carbon = 0.0; sim.foul = 0.0; sim.coolant = 1.0; sim.ect = ECT_RUN;
  sim.trim = 0.0; sim.rate = 0.0; sim.tLow = 0.0; sim.tHigh = 0.0; sim.dtc = '';
  sim.lastT = -1;
  traceClear = true;                  /* Monitor trace is cleared on the next update */
}
function resetAll() {
  S.load = 0.45;
  S.rpm = 2200;
  S.fault = 'none';
  S.auto = false;
  S.speed = 1;
  resetModel();
  controls.resetAll();                 /* every axis back to its default (store -> onChange -> S) */
}

/* ═══════════════════════════════════════════════════════════════════
   MODULE SCENE (per-module 3D parts)
   Layout (x right, y up): intake manifold on top, exhaust manifold below.
   The EGR loop runs up the left side: tap -> cooler -> valve -> intake.
   ═══════════════════════════════════════════════════════════════════ */
function build(H){
 const { box, cyl, cylX, mat, glass, glow, pipe, stream, lc, clamp, root, THREE, lowEnd } = H;
 const DEG = Math.PI / 180;

 const steel   = mat(0x8a93a5, .80, .35);
 const dark    = mat(0x374151, .50, .50);
 const pistonM = mat(0xd4dbe6, .65, .35);
 const valveMat = mat(0xa78bfa, .50, .40, { emissive: 0x000000, emissiveIntensity: 0 });
 const carbonColor = 0x4a3524;

 /* ── engine block (x-ray glass + outline) with four live cylinders ── */
 const eng = new THREE.Group(); root.add(eng);
 const blockM = glass(0x4a5160, .26);
 blockM.emissive.setHex(0xff6a1a); blockM.emissiveIntensity = 0;
 box(4.4, 1.4, 1.6, blockM, 0, 0, 0, eng);
 const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(4.4, 1.4, 1.6)),
   new THREE.LineBasicMaterial({ color: 0x6b7280, transparent: true, opacity: .75 }));
 eng.add(edges);
 const CYL_X = [-1.5, -.5, .5, 1.5];
 const CYL_PH = [0, 540, 180, 360];                 /* firing order 1-3-4-2, degrees of the 720 cycle */
 const pistons = [], flames = [];
 CYL_X.forEach((x) => {
   pistons.push(cyl(.34, .34, .26, pistonM, x, 0, 0, eng, 24));
   const fm = new THREE.MeshBasicMaterial({ color: 0xff8a2a, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending });
   const f = new THREE.Mesh(new THREE.SphereGeometry(.30, 14, 10), fm);
   f.scale.set(1, .75, 1); f.position.set(x, .46, 0); eng.add(f);
   flames.push(fm);
 });

 /* ── manifolds and runners (x-ray glass) ────────────────────────── */
 const intakeMat  = glass(0x7dd3fc, .24);
 const exhaustMat = glass(0xf97316, .28);
 cylX(.45, .45, 7.9, intakeMat, -.25, 1.75, 0, null, 32, true);
 cylX(.45, .45, 7.2, exhaustMat, .1, -1.75, 0, null, 32, true);
 const runIn = glass(0x7dd3fc, .34), runEx = glass(0xf97316, .34);
 CYL_X.forEach((x) => {
   cyl(.16, .16, .62, runIn, x, 1.01, 0, null, 20, true);
   cyl(.16, .16, .62, runEx, x, -1.01, 0, null, 20, true);
 });

 /* ── air inlet: filter box on the left end of the intake ─────────── */
 box(.5, .95, .95, mat(0xcbd5e1, .30, .60), -4.6, 1.75, 0);
 cylX(.30, .30, .3, steel, -4.25, 1.75, 0, null, 24, true);

 /* ── exhaust tail pipe beyond the EGR tap ────────────────────────── */
 cylX(.24, .24, 1.9, glass(0x9ca3af, .30), -4.45, -1.75, 0, null, 24, true);
 const TAIL_END = [-5.4, -1.75, 0];

 /* ── EGR loop ─────────────────────────────────────────────────────── */
 const hotPipeM  = glass(0xf97316, .40);          /* tap -> cooler: hot gas   */
 const coolPipeM = glass(0x93c5fd, .40);          /* cooler -> valve -> intake */
 pipe([[-3.5, -1.75, 0], [-3.5, -1.5, 0], [-3.5, -1.3, 0]], .15, hotPipeM);

 /* cooler: coolant shell, 3 x 3 tube bundle, end plates, two coolant stubs */
 const shellM = glass(0x38bdf8, .22);
 shellM.emissive.setHex(0x000000); shellM.emissiveIntensity = 0;
 box(.70, 1.10, .70, shellM, -3.5, -.75, 0);
 const tubeM = new THREE.MeshStandardMaterial({ color: 0xc5ccd6, metalness: .70, roughness: .40, emissive: 0x000000, emissiveIntensity: 0 });
 for (let ix = -1; ix <= 1; ix++) for (let iz = -1; iz <= 1; iz++) cyl(.04, .04, 1.06, tubeM, -3.5 + ix * .19, -.75, iz * .19, null, 10);
 box(.74, .05, .74, dark, -3.5, -1.29, 0);
 box(.74, .05, .74, dark, -3.5, -.21, 0);
 const stubM = glass(0x38bdf8, .45);
 cylX(.07, .07, .55, stubM, -2.92, -1.05, 0, null, 14, true);
 cylX(.07, .07, .55, stubM, -2.92, -.45, 0, null, 14, true);

 const seatCarbonM = new THREE.MeshStandardMaterial({ color: carbonColor, roughness: .95, metalness: 0, transparent: true, opacity: 0, depthWrite: false });

 function puffs(color, n, opMax) {
   const list = [];
   for (let i = 0; i < n; i++) {
     const m = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, depthWrite: false });
     const s = new THREE.Mesh(new THREE.SphereGeometry(.12, 8, 6), m);
     s.visible = false; root.add(s); list.push({ s, m, k: i });
   }
   return {
     update(time, intensity, rise) {
       const I = clamp(intensity);
       list.forEach((p) => {
         const u = (((p.k / n) + time) % 1 + 1) % 1;
         p.s.visible = I > 0.02;
         p.s.position.set(TAIL_END[0] - .15 - 1.5 * u, TAIL_END[1] + .08 + (.25 + rise) * u * u * 2.2, Math.sin(p.k * 7.3) * .30 * u);
         p.s.scale.setScalar(.7 + 2.4 * u);
         p.m.opacity = I * opMax * (1 - u) * Math.min(1, u * 8);
       });
     }
   };

 const nAir = lowEnd ?  8 : 14;

    ['EGR cooler', [-3.5, -1.5, .5]],
    ['EGR valve', [-3.5, .1, .5]],

    ['Air inlet', [-4.7, 2.4, 0]],

  update(c){
   /* ── 1. inputs ─────────────────────────────────────────────── */

   const k     = clampN(c.k, 0, 1);               /* main slider = manual EGR command */
   const load  = clampN(S.load, 0, 1);

   const fault = S.fault;

   if (sim.lastT >= 0 && c.t + 1e-4 < sim.lastT) resetModel();

   /* ── 2. coolant temperature (warm-up, overheating on a leak) ── */

   /* ── 3. pressures: what drives the flow ───────────────────── */

   const flowK = dpFlowFactor(dp);
   const area  = clampN(1 - 0.85 * sim.carbon, 0.10, 1.0);   /* carbon restricts flow area */

   /* ── 4. command: manual slider or ECU map with closed-loop trim ─ */
   let tgt = 0, cmd;
   if (S.auto) {
     tgt = ecuEgrTarget(load, rpm, sim.ect);
     const ff = tgt > 0 ? clampN(tgt / (EGR_MAX * Math.max(flowK, 0.25)), 0, 1) : 0;   /* feed-forward from the target and the measured pressure drop */
     if (dtR > 0) {
       if (tgt > 0.005) sim.trim = clampN(sim.trim + TRIM_KI * ((tgt - sim.rate) / EGR_MAX) * dtR, -0.5, 0.6);
       else sim.trim += (0 - sim.trim) * (1 - Math.exp(-dtR / 2));
     }
     cmd = clampN(ff + sim.trim, 0, 1);
   } else {
     cmd = k;
     sim.trim = 0;
   }
   cmdShown = cmd;

   /* ── 5. actual valve position (actuator lag; stuck faults ignore the command) ─ */
   let drive = cmd;
   if (fault === 'stuckopen') drive = 1.0;
   if (fault === 'stuckshut') drive = 0.0;
   if (dtR > 0) sim.valve += (drive - sim.valve) * (1 - Math.exp(-dtR / TAU_VALVE));
   sim.valve = clampN(sim.valve, 0, 1);

   /* actual EGR fraction of the charge: lift x pressure drive x flow area */
   const egrFrac = clampN(sim.valve * EGR_MAX * area * flowK, 0, EGR_MAX);
   const flowN = egrFrac / EGR_MAX;

   /* ── 6. EGR cooler + intake charge ────────────────────────── */
   let eff = coolerEffectiveness(sim.foul);
   if (fault === 'coolerleak') eff *= 0.55;
   const tExh    = exhaustTempC(load, rN);
   const egrOutC = egrCoolerOutC(tExh, sim.ect, eff);
   const chargeC = intakeChargeC(FRESH_AIR_C, egrOutC, egrFrac);

   /* ── 7. combustion model ──────────────────────────────────── */
   const Tpeak = peakFlameTempC(load, egrFrac, eff, chargeC);
   const nox   = noxPpm(Tpeak, egrFrac);
   const soot  = sootIndex(load, egrFrac, rN, chargeC);
   const rough = roughness(load, egrFrac);
   const ploss = powerLossPct(egrFrac, rough);

   /* ── 8. slow processes: deposits, cooler fouling, coolant ──── */
   if (dtS > 0) {
     const dep  = K_CARBON * (0.15 + soot) * flowN * (fault === 'carboned' ? 6 : 1);
     const burn = (load > 0.85 && rpm > 3000 && sim.carbon > 0) ? K_BURN : 0;
     sim.carbon = clampN(sim.carbon + (dep - burn) * dtS, 0, 0.95);
     if (fault === 'clogcooler') sim.foul += (0.9 - sim.foul) * (1 - Math.exp(-dtS / 8));
     else sim.foul += K_FOUL * (0.1 + soot) * flowN * dtS;
     sim.foul = clampN(sim.foul, 0, 0.9);
     if (fault === 'coolerleak') sim.coolant -= dtS * 0.006;
     else sim.coolant += (1.0 - sim.coolant) * (1 - Math.exp(-dtS / 30));
     sim.coolant = clampN(sim.coolant, 0.05, 1.0);
   }

   /* ── 9. ECU diagnostics (auto mode only: the ECU is in charge) ─ */
   if (S.auto) {
     if (dtR > 0) {
       const starved = tgt > 0.02 && sim.rate < 0.6 * tgt && (sim.trim > 0.58 || cmd > 0.97);   /* valve driven to its limit and still short */
       const excess  = sim.rate > tgt + 0.05;                                                   /* flow the ECU did not ask for */
       sim.tLow  = starved ? sim.tLow + dtR : Math.max(0, sim.tLow - 2 * dtR);
       sim.tHigh = excess  ? sim.tHigh + dtR : Math.max(0, sim.tHigh - 2 * dtR);
       if (sim.tLow > 3) sim.dtc = 'P0401';
       else if (sim.tHigh > 3) sim.dtc = 'P0402';
       else if (sim.tLow < 0.5 && sim.tHigh < 0.5) sim.dtc = '';   /* demo only: real codes stay stored until cleared with a scan tool */
     }
   } else { sim.dtc = ''; sim.tLow = 0; sim.tHigh = 0; }
   sim.rate = egrFrac;

   /* ── 10. status text ──────────────────────────────────────── */
   const cold = S.auto && sim.ect < ECT_MIN_EGR;
   let stateTxt;
   if (fault === 'stuckopen')       stateTxt = rough > 0.2 ? 'ROUGH RUNNING (valve open)' : 'VALVE STUCK OPEN';
   else if (fault === 'stuckshut')  stateTxt = 'NO EGR - HIGH NOx';
   else if (fault === 'coolerleak') stateTxt = 'COOLANT LEAK';
   else if (sim.dtc)                stateTxt = 'ECU code ' + sim.dtc;
   else if (cold)                   stateTxt = 'ECU: EGR off (cold engine)';
   else if (S.auto && tgt < 0.005)  stateTxt = 'ECU: EGR off (map)';
   else if (rough > 0.25)           stateTxt = 'Rough running';
   else if (sim.carbon > 0.55)      stateTxt = 'CARBONED (P0401)';
   else if (soot > 0.55)            stateTxt = 'Soot / roughness risk';

       } else if (rough > 0.3) {
         warn = 'Combustion is unstable: too much inert gas for this load, so cylinders start to miss. Expect a rough idle and power loss.';
       } else if (sim.carbon > 0.55) {
         warn = 'Carbon build-up at ' + (sim.carbon * 100).toFixed(0) + ' % - the actual EGR rate is falling below commanded. Expect P0401 and rough running. Use "Clean valve" to clear it.';
       } else if (soot > 0.55) {
         warn = 'Soot index ' + (soot * 100).toFixed(0) + ' % - EGR is past the soot knee at this load. The engine will feel rough and the DPF will load quickly.';
       } else if (cmd > 0.3 && dp < 10) {
         warn = 'Exhaust and intake pressures are only ' + Math.max(dp, 0).toFixed(0) + ' kPa apart - the valve is open but little gas can flow. This is why high-load EGR needs a back-pressure flap or venturi.';
       } else if (chargeC > 100) {
         warn = 'Intake charge at ' + chargeC.toFixed(0) + ' \u00B0C - the cooler is not doing its job, so NOx will creep back up.';
       } else if (nox > 900) {
         warn = 'NOx at ' + nox.toFixed(0) + ' ppm - very high. Add EGR to bring peak flame temperature down.';
       }
     }

   }

   /* ── 13. readouts ─────────────────────────────────────────── */
   const noxState    = nox > 900 ? 'crit' : (nox > 400 ? 'warn' : 'ok');
   const tempState   = Tpeak > 2100 ? 'crit' : (Tpeak > 1800 ? 'warn' : 'ok');
   const sootState   = soot > 0.60 ? 'crit' : (soot > 0.30 ? 'warn' : 'ok');
   const tinState    = chargeC > 150 ? 'crit' : (chargeC > 100 ? 'warn' : 'ok');
   const lossState   = ploss > 25 ? 'crit' : (ploss > 15 ? 'warn' : 'ok');
   const foulState   = sim.foul > 0.60 ? 'crit' : (sim.foul > 0.30 ? 'warn' : 'ok');
   const carbonState = sim.carbon > 0.55 ? 'crit' : (sim.carbon > 0.25 ? 'warn' : 'ok');
   const coolState   = sim.coolant < 0.35 ? 'crit' : (sim.coolant < 0.70 ? 'warn' : 'ok');
   const rateState   = (flowN < 0.02) ? 'warn' : 'ok';
   const dpState     = dp < 5 ? 'crit' : (dp < 12 ? 'warn' : 'ok');
   const stState     = (nox > 900 || sim.coolant < 0.35 || fault === 'coolerleak' || sim.dtc) ? 'crit'
                     : (soot > 0.55 || sim.carbon > 0.5 || rough > 0.25 || fault === 'stuckopen') ? 'warn'
                     : 'ok';

   let tr;
   if (traceClear) { traceClear = false; traceSample = null; tr = { hist: null }; }
   else if (traceSample) { tr = { hist: traceSample }; traceSample = null; }

   return {
     big: nox.toFixed(0),
     unit: ' ppm',
     bar: clampN(nox / 1600 * 100, 0, 100),
     rows: {
       lift: (sim.valve * LIFT_MAX_MM).toFixed(1) + ' mm',
       temp: Tpeak.toFixed(0) + ' \u00B0C'
     },
     ro: {
       rate:   [(egrFrac * 100).toFixed(1) + ' %', rateState],
       lift:   [(sim.valve * LIFT_MAX_MM).toFixed(1) + ' mm', 'hi'],
       dp:     [dp.toFixed(0) + ' kPa', dpState],
       nox:    [nox.toFixed(0) + ' ppm', noxState],
       temp:   [Tpeak.toFixed(0) + ' \u00B0C', tempState],
       soot:   [(soot * 100).toFixed(0) + ' %', sootState],
       tin:    [chargeC.toFixed(0) + ' \u00B0C', tinState],
       ploss:  [ploss.toFixed(0) + ' %', lossState],
       foul:   [(sim.foul * 100).toFixed(0) + ' %', foulState],
       carbon: [(sim.carbon * 100).toFixed(0) + ' %', carbonState],
       cool:   [(sim.coolant * 100).toFixed(0) + ' %', coolState],
       state:  [stateTxt, stState]
     },
     status: [warnText || stateTxt, true, warnText ? 'warn' : ''],
     traces: tr,
     ctl: S.auto ? ('ECU ' + (cmd * 100).toFixed(0) + ' %') : ((egrFrac * 100).toFixed(0) + ' % EGR')
   };
  }
 };
}

/* Every option / action lives in the dock (controls.js), nothing interactive is left in the panel.
   'Time scale' is the module's own physics time-compression (warm-up, deposits, coolant); the menu's Sim speed is separate. */
CFG.options = [
  { id: "fault", type: 'choice', layout: 'select', label: "Fault injection", options: Object.keys(FAULT_INFO).map(id => ({ id, label: FAULT_INFO[id].label })), def: 'none',
    onChange: (id) => { S.fault = id; } },
  { id: 'auto', type: 'toggle', label: 'ECU auto map', ariaLabel: 'Let the ECU schedule the EGR rate from load, speed and coolant temperature',
    onChange: (on) => { S.auto = !!on; } },
  { id: 'timeScale', type: 'choice', layout: 'segmented', label: 'Time scale', options: [{ id: '1', label: '1×' }, { id: '5', label: '5×' }, { id: '20', label: '20×' }], def: '1',
    onChange: (id) => { S.speed = Number(id) || 1; } },
  { id: "coldstart", type: 'action', label: "Cold start",
    onAction: () => { sim.ect = ECT_COLD; } },
  { id: "clean", type: 'action', label: "Clean valve",
    onAction: () => { sim.carbon = 0.0; } },
  { id: "cleancooler", type: 'action', label: "Clean cooler",
    onAction: () => { sim.foul = 0.0; } }
];
CFG.onReset = resetAll;      /* the dock Reset runs the module reset (model + every control) */
/* The history is a Monitor trace. Both series are drawn as 0..100 % of their old axis ranges. */
CFG.traces = [{ id: 'hist', label: 'NOx and peak flame temperature history (% of full scale)', min: 0, max: 100, length: 150,
  series: [
    { id: 'a', label: 'NOx ppm', color: 'var(--accent)' },
    { id: 'b', label: 'Peak \u00B0C', color: 'var(--warn)' }
  ] }];
runGuidedModule(CFG, build);
</script>
</body>
</html>
