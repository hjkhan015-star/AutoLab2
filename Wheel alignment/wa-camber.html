<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camber — Wheel Alignment — Auto Lab</title>
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="../controls.css">
<link rel="stylesheet" href="../components.css">
<style>
:root { --al-accent: #14b8a6; }
html.light-theme { --al-accent: color-mix(in oklch, #14b8a6 62%, black); }
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<div id="labels-root"></div>

<script src="../guard.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import { runGuidedModule } from '../components.js';
import { RACK_H } from './alignment-rack.js';
import { controls } from '../controls.js';
import { fromReal } from '../controls-core.js';
import { buildCamberScene } from './wa-camber-scene.js';
import { makeState, getPreset, setAxleCamber, setWheelCamber, axleCamber, camberToSpec, camberToZero, applyCamberPreset, randomCamberFault,
  CAMBER_PRESETS, CAMBER_LIMIT, EXAGGERATIONS, DEFAULT_EXAGGERATION, WA_PAGES } from './alignment-model.js';

const PRESET = 'hatchback';
const SPEC = getPreset(PRESET).spec;
/* S is the session the scene reads; the controls below write it. */
const S = { st: makeState(PRESET), exag: DEFAULT_EXAGGERATION, cam: 'front', ver: 0,
  flags: { plumb: true, heat: true, wear: true, tint: false, turn: false } };
let syncing = false;

const deg2 = (v) => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2) + '°';
const FADERS = {
  camF: { label: 'Front camber', axle: 'F', band: SPEC.frontCamber },
  camR: { label: 'Rear camber', axle: 'R', band: SPEC.rearCamber },
  camFL: { label: 'Front-left camber', corner: 'FL', band: SPEC.frontCamber },
  camFR: { label: 'Front-right camber', corner: 'FR', band: SPEC.frontCamber },
  camRL: { label: 'Rear-left camber', corner: 'RL', band: SPEC.rearCamber },
  camRR: { label: 'Rear-right camber', corner: 'RR', band: SPEC.rearCamber }
};
const realOf = (id) => { const f = FADERS[id]; return f.axle ? axleCamber(S.st, f.axle) : S.st[f.corner].camber; };
/* write the model's values back into every fader */
function sync() {
  syncing = true;
  for (const id in FADERS) controls.set(id, fromReal(realOf(id), controls.spec(id)));
  syncing = false; S.ver++;
}
function showMode(mode) {
  for (const id in FADERS) controls.setHidden(id, mode === 'axle' ? !FADERS[id].axle : !!FADERS[id].axle);
}
const spec = (lo, hi) => ({ spec: { min: -CAMBER_LIMIT, max: CAMBER_LIMIT, lo, hi } });

const CFG = {
  moduleId: 'wa-camber',
  title: 'Camber',
  kicker: 'Wheel Alignment',
  accent: '#14b8a6',
  badge: 'Camber',
  camPos: [0, 0.95, 6.4],
  target: [0, 0.45, 0],
  floorY: -RACK_H,   /* shared kit floor sits one rack-height below the tyres */
  ctl: null,
  chipLabel: 'Camber (front)',
  rows: [],
  ro: [
    ['camFL', 'Front-left camber', spec(SPEC.frontCamber[0], SPEC.frontCamber[1])],
    ['camFR', 'Front-right camber', spec(SPEC.frontCamber[0], SPEC.frontCamber[1])],
    ['camRL', 'Rear-left camber', spec(SPEC.rearCamber[0], SPEC.rearCamber[1])],
    ['camRR', 'Rear-right camber', spec(SPEC.rearCamber[0], SPEC.rearCamber[1])],
    ['cross', 'Cross-camber (front)', { spec: { min: -1.5, max: 1.5, lo: -SPEC.maxCamberDiff, hi: SPEC.maxCamberDiff } }],
    ['incl', 'Included angle L / R'],
    ['bias', 'Pressure inner / outer'],
    ['life', 'Tyre life vs perfect'],
    ['pull', 'Pull'],
    ['grip', 'Grip index']
  ],
  legend: [['var(--c-blue)', 'Low pressure'], ['var(--c-green)', 'Even'], ['var(--c-red)', 'High pressure']],
  overview: '<div class="al-sec"><h4>Camber</h4><p>Camber is the sideways lean of the wheel seen from the front: negative camber leans the top toward the car. The wheel pivots about its <b>contact patch</b>, so the patch stays put while the centre moves. Yellow is the wheel plane, white the plumb line. The <b>Visual ×</b> option scales the drawing only.</p><p>The footprint colours show where the load sits across the tread. Switch on <b>Load transfer in turn</b> to watch body roll change the outside wheel&#39;s camber.</p></div>',
  faults: [
    ['Inner-edge wear', 'Inner shoulder bald, centre fine.', 'Too much negative camber: check sagging springs, bent strut, or adjust camber.'],
    ['Outer-edge wear', 'Outer shoulder worn.', 'Positive camber: check springs and bushes.'],
    ['Pulls to one side', 'Drifts on a flat road.', 'Compare left and right camber; the car pulls toward the more positive side.']
  ],
  quiz: [
    ['Negative camber means…', ['Top of the wheel leans in', 'Top leans out', 'Wheel points inward'], 0, 'The top of the wheel tilts toward the car.'],
    ['Too much negative camber wears…', ['The inner shoulder', 'The outer shoulder', 'The centre'], 0, 'The inner shoulder carries the load.'],
    ['A wheel with camber tilts about…', ['The contact patch', 'The wheel centre', 'The brake disc'], 0, 'The tyre stays on the road, so the centre moves sideways.'],
    ['In a corner the outside wheel gains…', ['Positive camber (relative to the road)', 'More negative camber', 'No change'], 0, 'Body roll tilts it toward positive.']
  ],
  onReset: () => { S.st = makeState(PRESET); sync(); }
};

CFG.ctls = Object.keys(FADERS).map((id) => {
  const f = FADERS[id];
  return { id, look: 'equalizer', label: f.label, ariaLabel: f.label + ': negative leans the top in, positive leans it out', min: -CAMBER_LIMIT, max: CAMBER_LIMIT, step: 0.05, decimals: 2,
    def: f.axle ? axleCamber(S.st, f.axle) : S.st[f.corner].camber, detent: 0.05, band: f.band, tickEvery: 0.25, ends: ['− Negative', 'Positive +'], format: deg2,
    onChange: (v) => { if (syncing) return; if (f.axle) setAxleCamber(S.st, f.axle, v); else setWheelCamber(S.st, f.corner, v); sync(); } };
});
const flag = (id, label, def) => ({ id, type: 'toggle', label, def, onChange: (on) => { S.flags[id] = !!on; } });
CFG.options = [
  { id: 'mode', type: 'choice', layout: 'segmented', label: 'Adjust', def: 'axle', onChange: showMode,
    options: [{ id: 'axle', label: 'Axle' }, { id: 'individual', label: 'Individual' }] },
  { id: 'exag', type: 'choice', layout: 'segmented', label: 'Visual ×', def: String(DEFAULT_EXAGGERATION), onChange: (id) => { S.exag = Number(id); },
    options: EXAGGERATIONS.map((e) => ({ id: String(e), label: e + '×' })) },
  { id: 'cpreset', type: 'choice', layout: 'select', label: 'Preset', def: 'spec', onChange: (id) => { applyCamberPreset(S.st, id); sync(); }, options: CAMBER_PRESETS },
  { id: 'cam', type: 'choice', layout: 'segmented', label: 'Camera', def: 'front', onChange: (id) => { S.cam = id; },
    options: [{ id: 'front', label: 'Front' }, { id: 'close', label: 'Close' }, { id: 'low', label: 'Low' }, { id: 'orbit', label: 'Orbit' }] },
  flag('turn', 'Load transfer in turn', false), flag('heat', 'Contact-patch heat-map', true), flag('plumb', 'Plumb line', true), flag('wear', 'Tyre wear overlay', true), flag('tint', 'Wheel tint', false),
  { id: 'toSpec', type: 'action', label: 'Reset to spec', onAction: () => { camberToSpec(S.st); sync(); } },
  { id: 'toZero', type: 'action', label: 'Set to 0', onAction: () => { camberToZero(S.st); sync(); } },
  { id: 'fault', type: 'action', label: 'Randomise fault', onAction: () => { randomCamberFault(S.st); sync(); } },
  { id: 'page', type: 'choice', layout: 'segmented', label: 'Page', def: 'camber',
    onChange: (id) => { const pg = WA_PAGES.find((x) => x.id === id); if (pg && !location.pathname.endsWith(pg.file)) location.href = pg.file; },
    options: WA_PAGES.map((x) => ({ id: x.id, label: x.label })) }
];

runGuidedModule(CFG, (H) => buildCamberScene(H, S));
showMode('axle');
</script>
</body>
</html>
