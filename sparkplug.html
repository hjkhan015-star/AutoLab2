<style>

#sp-ui .sp-row { display: flex; gap: 5px; align-items: center; }

#sp-ui .sp-btn {
  cursor: pointer; border: 1px solid rgba(148,163,184,.32);
  background: rgba(15,23,42,.72); color: #e2e8f0;
  border-radius: 999px; padding: 4px 9px; font-size: 10.5px;
  transition: background .15s, border-color .15s, color .15s;
}
#sp-ui .sp-btn.on { background: var(--al-accent, #facc15); color: #111827; border-color: transparent; }
#sp-ui input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 3px;

}

}
#sp-ui input[type=range]::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--al-accent, #facc15); cursor: pointer; border: 0;
}

#sp-ui .sp-slider .sp-head { display: flex; justify-content: space-between; color: #94a3b8; font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; }

<body>
<div id="canvas-wrap"></div>
<div id="labels-root"></div>

<script src="guard.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import { runGuidedModule } from './components.js';

/* ── CONFIG (module content) ─────────────────────────────────────── */
const CFG = {
  "moduleId": "sparkplug",
  "title": "Spark Plugs",
  "kicker": "Ignition",
  "accent": "#facc15",
  "badge": "Gap · Voltage · Heat range",
  "camPos": [4.1, 2.2, 5.2],
  "target": [0, 0.75, 0],
  "floorY": -1.75,
  "ctl": { "label": "Electrode gap", "val": 35, "caption": "Plug gap" },
  "chipLabel": "Required voltage",
  "rows": [["gap", "Gap"], ["burn", "Burn time"]],
  "ro": [
    ["gap",    "Gap"],
    ["req",    "Required voltage"],
    ["avail",  "Coil available"],
    ["burn",   "Spark duration"],
    ["energy", "Spark energy"],
    ["temp",   "Tip temperature"],
    ["risk",   "Misfire risk"]
  ],
  "legend": [
    ["#f1f5f9", "Ceramic insulator"],
    ["#e8a05a", "Copper core"],
    ["#a5f3fc", "Spark"],
    ["#ff8a2b", "Combustion"],
    ["#e8e8ea", "Pt / Ir pad"]
  ],
  "overview": "<div class=\"al-sec\"><h4>Ignition point<\/h4><p>The plug delivers the coil’s high voltage across a small gap. The spark ignites the compressed mixture; the gap, electrode material, compression and heat range decide how reliably.<\/p><p>Use the panel on the right: toggle <b>Cutaway<\/b> to slice the plug open, change the <b>heat range<\/b> to see the insulator nose grow or shrink, pick an <b>electrode material<\/b>, or drag <b>RPM<\/b> and <b>Load<\/b> to watch the coil’s available voltage and the required voltage cross over.<\/p><\/div><div class=\"al-sec\"><h4>Gap<\/h4><ul><li>Small gap – easy to fire but a small flame kernel.<\/li><li>Large gap – bigger kernel but needs more voltage; risk of misfire at high load.<\/li><li>Typical gap is 0.7–1.1 mm (check the engine spec).<\/li><\/ul><\/div><div class=\"al-sec\"><h4>Heat range<\/h4><p>A “hot” plug has a long insulator nose that keeps tip temperature high; a “cold” plug sheds heat faster. Too hot risks pre-ignition; too cold fouls with carbon. The tip self-cleans above about 450&nbsp;°C.<\/p><\/div><div class=\"al-sec\"><h4>Electrode material<\/h4><p>Copper tips are cheap but erode; platinum and iridium last far longer and can be made much thinner, which lowers the required voltage slightly and sharpens the flame kernel.<\/p><\/div>",
  "faults": [
    ["Worn electrodes", "Hard start, misfire under load, poor economy.", "Measure the gap with a feeler gauge; inspect for rounded edges."],
    ["Carbon fouled", "Black dry deposits, weak spark, rough idle.", "Check mixture, air filter and heat range."],
    ["Oil fouled or cracked insulator", "Wet black tip, tracking on the ceramic.", "Inspect valve seals and rings; replace the plug."]
  ],
  "quiz": [
    ["A larger plug gap needs…", ["Less voltage", "More voltage", "Same voltage"], 1, "Breaking down a wider gap needs a higher voltage from the coil."],
    ["A “cold” plug…", ["Holds heat in", "Sheds heat faster", "Has no electrode"], 1, "It has a short insulator nose and conducts heat away quickly."],
    ["Carbon deposits usually mean…", ["Plug too cold or rich mixture", "Perfect running", "Plug too hot"], 0, "Low tip temperature or a rich mixture leaves soot on the insulator."],
    ["At very high RPM the coil has…", ["More time to charge", "Less time to charge", "No effect"], 1, "Dwell time shortens with RPM, so the coil may not fully saturate."]
  ]
};

/* ══════════════════════════════════════════════════════════════════
   MODULE SCENE — realistic cross-sectioned spark plug
   ══════════════════════════════════════════════════════════════════ */
function build(H) {
  const THREE = H.THREE;
  const root  = H.root;
  const clamp = H.clamp || ((v, a, b) => Math.max(a, Math.min(b, v)));
  const lerp  = H.lerp  || ((a, b, t) => a + (b - a) * t);
  const frac  = x => x - Math.floor(x);

  /* ─────────────── materials ─────────────── */
  const std = (color, metal, rough) => new THREE.MeshStandardMaterial({
    color, metalness: metal, roughness: rough, side: THREE.DoubleSide
  });

  const M = {
    steel:     std(0x9aa3b2, 0.92, 0.32),
    nickel:    std(0xc9cfd8, 0.90, 0.26),
    ceramic:   std(0xf2f6fb, 0.02, 0.42),
    copper:    std(0xe8a05a, 0.95, 0.30),
    glass:     std(0x333844, 0.30, 0.50),
    elec:      std(0xd8dde5, 0.90, 0.28),
    groundE:   std(0xc9cfd8, 0.90, 0.30),
    carbon:    std(0x14100d, 0.05, 0.95),
    platinum:  std(0xe8e8ea, 0.98, 0.20),
    iridium:   std(0xd8d2c8, 0.98, 0.22),
    // cut-face (matte, darker) variants
    cs:        std(0x6f7886, 0.30, 0.65),
    cn:        std(0x8f97a4, 0.30, 0.60),
    cc:        std(0xd6dee9, 0.02, 0.72),
    ccu:       std(0xb8763a, 0.35, 0.60),
    cg:        std(0x2a2e38, 0.20, 0.65),
    ce:        std(0x8f97a4, 0.30, 0.60)
  };

  /* ─────────────── cross-section profiles (r , y) ─────────────── */
  const RIB_BASE = 0.244, RIB_AMP = 0.068, RIB_H = 0.32, RIB_N = 4;

  const PROFILE = {
    shell: () => [
      [0.245, -0.790], [0.245,  0.630], [0.300,  0.690],
      [0.300,  0.070], [0.318, -0.010], [0.345, -0.090],
      [0.345, -0.720], [0.315, -0.790], [0.245, -0.790]
    ],

    ceramic: (heat) => {
      const noseY = heat === 'hot' ? 0.17 : heat === 'cold' ? 0.54 : 0.36;
      const p = [];
      p.push([0.076, noseY + 0.12]);          // bore bottom
      p.push([0.076, 2.620]);                 // bore top
      p.push([0.190, 2.620]);                 // top face
      p.push([0.198, 2.540]);
      p.push([0.235, 2.360]);
      p.push([0.268, 2.130]);
      for (let i = RIB_N - 1; i >= 0; i--) {  // ribs (top → bottom)
        const y0 = 0.78 + i * 0.34;
        for (let j = 10; j >= 0; j--) {
          const f = j / 10;
          p.push([RIB_BASE + RIB_AMP * Math.sin(f * Math.PI), y0 + f * RIB_H]);
        }
      }
      p.push([0.240, 0.62]);
      p.push([0.230, noseY]);                 // lower wall
      p.push([0.150, noseY + 0.03]);          // bottom face
      p.push([0.076, noseY + 0.12]);
      return p;
    },

    terminal: () => [
      [0.000, 1.320], [0.068, 1.320], [0.068, 2.520], [0.115, 2.560],
      [0.115, 2.740], [0.068, 2.780], [0.068, 2.960], [0.000, 2.960]
    ],

    seal: () => [
      [0.000, 1.190], [0.074, 1.190], [0.074, 1.330], [0.000, 1.330]
    ],

    elec: () => [
      [0.000, -0.800], [0.058, -0.800], [0.070, -0.760], [0.070, 1.200],
      [0.040,  1.200], [0.040, -0.700], [0.000, -0.700]
    ],

    core: () => [
      [0.000, -0.680], [0.036, -0.680], [0.036, 1.180], [0.000, 1.180]
    ],

    washer: () => {
      const p = [];
      for (let i = 0; i < 16; i++) {
        const a = i / 16 * Math.PI * 2;
        p.push([0.368 + 0.030 * Math.cos(a), -0.045 + 0.030 * Math.sin(a)]);
      }
      p.push(p[0].slice());
      return p;
    }
  };

  /* ─────────────── real helical threads ─────────────── */
  class Helix extends THREE.Curve {
    constructor(r, y0, y1, a0, a1) {
      super(); this.r = r; this.y0 = y0; this.y1 = y1; this.a0 = a0; this.a1 = a1;
    }
    getPoint(t, target = new THREE.Vector3()) {
      const a = this.a0 + (this.a1 - this.a0) * t;
      return target.set(this.r * Math.sin(a), this.y0 + (this.y1 - this.y0) * t, this.r * Math.cos(a));
    }
  }

  const THREAD_R     = 0.345;
  const THREAD_BOT   = -0.795;
  const THREAD_TOP   = -0.085;
  const THREAD_PITCH = 0.0616;                 // ~1.25 mm at M14 scale
  const THREAD_TURNS = (THREAD_TOP - THREAD_BOT) / THREAD_PITCH;

  /* ─────────────── one complete plug ─────────────── */
  function buildPlug(cut, heat) {
    const g = new THREE.Group();
    const pStart = cut ? Math.PI : 0;
    const pLen   = cut ? Math.PI : Math.PI * 2;

    const lathe = (prof, material) => {
      const pts = prof.map(p => new THREE.Vector2(p[0], p[1]));
      const geo = new THREE.LatheGeometry(pts, 72, pStart, pLen);
      const m = new THREE.Mesh(geo, material);
      g.add(m);
      return m;
    };

    const sect = (prof, material) => {
      if (!cut) return;
      const pts = prof.map(p => new THREE.Vector2(p[0], p[1]));
      if (pts.length < 3) return;
      const shape = new THREE.Shape(pts);
      const geo = new THREE.ShapeGeometry(shape);
      const m1 = new THREE.Mesh(geo, material); m1.rotation.y =  Math.PI / 2; g.add(m1);
      const m2 = new THREE.Mesh(geo, material); m2.rotation.y = -Math.PI / 2; g.add(m2);
    };

    const P_SHELL = PROFILE.shell();
    const P_CERAM = PROFILE.ceramic(heat);
    const P_TERM  = PROFILE.terminal();
    const P_SEAL  = PROFILE.seal();
    const P_ELEC  = PROFILE.elec();
    const P_CORE  = PROFILE.core();
    const P_WASH  = PROFILE.washer();

    lathe(P_SHELL, M.steel);   sect(P_SHELL, M.cs);
    lathe(P_WASH,  M.steel);   sect(P_WASH,  M.cs);

    /* hex */
    const hexGeo = new THREE.CylinderGeometry(
      0.445, 0.445, 0.52, cut ? 3 : 6, 1, false,
      cut ? Math.PI : 0, cut ? Math.PI : Math.PI * 2
    );
    const hex = new THREE.Mesh(hexGeo, M.steel);
    hex.position.y = 0.31;
    g.add(hex);
    sect([[0, 0.05], [0.445, 0.05], [0.445, 0.57], [0, 0.57]], M.cs);

    /* threads */
    if (!cut) {
      const curve = new Helix(THREAD_R, THREAD_BOT, THREAD_TOP, 0, THREAD_TURNS * Math.PI * 2);
      g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 320, 0.021, 6, false), M.steel));
    } else {
      const halves = Math.round(THREAD_TURNS * 2);
      for (let i = 0; i < halves; i++) {
        const y0 = THREAD_BOT + (i / halves) * (THREAD_TOP - THREAD_BOT);
        const y1 = THREAD_BOT + ((i + 1) / halves) * (THREAD_TOP - THREAD_BOT);
        const curve = new Helix(THREAD_R, y0, y1, Math.PI, Math.PI * 2);
        g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 22, 0.021, 6, false), M.steel));
      }
    }

    /* internals */
    lathe(P_CERAM, M.ceramic); sect(P_CERAM, M.cc);
    lathe(P_TERM,  M.nickel);  sect(P_TERM,  M.cn);
    lathe(P_SEAL,  M.glass);   sect(P_SEAL,  M.cg);
    lathe(P_CORE,  M.copper);  sect(P_CORE,  M.ccu);
    lathe(P_ELEC,  M.elec);    sect(P_ELEC,  M.ce);

    /* carbon deposit blobs on the ceramic nose + exposed electrode */
    const carbon = new THREE.Group();
    const noseY = PROFILE.ceramic(heat)[3][1];         // bottom of the insulator nose
    let seed = 12345;
    const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
    for (let i = 0; i < 26; i++) {
      const ang = rnd() * Math.PI * 2;
      const y   = noseY + 0.02 + rnd() * 0.30;
      const r   = 0.225 + rnd() * 0.020;
      const rr  = 0.018 + rnd() * 0.022;
      const blob = new THREE.Mesh(new THREE.SphereGeometry(rr, 7, 6), M.carbon);
      blob.position.set(Math.sin(ang) * r, y, Math.cos(ang) * r);
      blob.scale.y = 0.7 + rnd() * 0.5;
      carbon.add(blob);
    }
    for (let i = 0; i < 10; i++) {
      const ang = rnd() * Math.PI * 2;
      const y   = -0.70 - rnd() * 0.10;
      const r   = 0.060 + rnd() * 0.008;
      const blob = new THREE.Mesh(new THREE.SphereGeometry(0.014 + rnd() * 0.010, 6, 5), M.carbon);
      blob.position.set(Math.sin(ang) * r, y, Math.cos(ang) * r);
      carbon.add(blob);
    }
    carbon.visible = false;
    g.add(carbon);

    /* centre electrode firing pad (Pt/Ir) */
    const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.048, 0.048, 0.012, 20), M.platinum);
    pad.position.y = -0.796;
    pad.visible = false;
    g.add(pad);

    return { group: g, carbon, pad };
  }

  /* ─────────────── ground electrode (rebuilds with gap) ─────────────── */
  const T_STRAP = 0.055;
  const W_STRAP = 0.148;

  function makeGround(phi, hookY) {
    const grp = new THREE.Group();
    const dirR = new THREE.Vector3(Math.sin(phi), 0, Math.cos(phi));
    const rotY = phi - Math.PI / 2;

    const place = (mesh, r, y) => {
      mesh.position.set(dirR.x * r, y, dirR.z * r);
      mesh.rotation.y = rotY;
      return mesh;
    };

    const topY = -0.785;
    const h = topY - (hookY - T_STRAP);
    if (h > 0.012) {
      const v = new THREE.Mesh(new THREE.BoxGeometry(T_STRAP, h, W_STRAP), M.groundE);
      place(v, 0.302, (topY + hookY - T_STRAP) / 2);
      grp.add(v);
    }
    const len = 0.420;
    const hz = new THREE.Mesh(new THREE.BoxGeometry(len, T_STRAP, W_STRAP), M.groundE);
    place(hz, len / 2 - 0.058, hookY - T_STRAP / 2);
    grp.add(hz);

    /* ground pad */
    const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.048, 0.048, 0.012, 20), M.platinum);
    pad.position.set(0, hookY - 0.006, 0);
    pad.visible = false;
    grp.add(pad);
    grp.userData.pad = pad;

    return grp;
  }

  /* ─────────────── state ─────────────── */
  const state = {
    gapK: 0.35,
    rpm: 2800,
    load: 0.55,
    material: 'copper',
    heat: 'normal',
    cut: false,
    forceFoul: false,
    hookY: 999
  };

  const PHI_FULL = Math.PI * 0.25;
  const PHI_CUT  = Math.PI * 1.50;

  /* ─────────────── assemble plugs ─────────────── */
  let plugFull = null, plugCut = null;
  let groundFull = null, groundCut = null;
  let carbonRefs = [], padRefs = [];

  function disposeGroup(g) {
    if (!g) return;
    g.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  }

  function rebuildPlugs() {
    if (plugFull) { root.remove(plugFull); disposeGroup(plugFull); }
    if (plugCut)  { root.remove(plugCut);  disposeGroup(plugCut);  }

    const a = buildPlug(false, state.heat);
    const b = buildPlug(true,  state.heat);
    plugFull = a.group; plugCut = b.group;
    carbonRefs = [a.carbon, b.carbon];
    padRefs    = [a.pad,    b.pad];

    plugFull.visible = !state.cut;
    plugCut.visible  =  state.cut;

    root.add(plugFull); root.add(plugCut);

    /* build ground electrodes at current hook position */
    state.hookY = 999;      // force a rebuild
  }

  function updateGround(hookY) {
    const kill = (grp, parent) => {
      if (!grp) return;
      parent.remove(grp);
      grp.traverse(o => { if (o.geometry) o.geometry.dispose(); });
    };
    kill(groundFull, plugFull);
    kill(groundCut,  plugCut);

    groundFull = makeGround(PHI_FULL, hookY);
    groundCut  = makeGround(PHI_CUT,  hookY);
    plugFull.add(groundFull);
    plugCut.add(groundCut);

    /* pick up their pads for material visibility */
    padRefs[0] = plugFull.userData.pad ? plugFull.userData.pad : padRefs[0];
    padRefs = padRefs.filter(Boolean);
    padRefs.push(groundFull.userData.pad, groundCut.userData.pad);
  }

  rebuildPlugs();
  updateGround(-0.89);

  /* ─────────────── spark / flame effects ─────────────── */
  const fx = new THREE.Group();
  root.add(fx);

  const ARC_N = 18;
  const arcPos = new Float32Array(ARC_N * 3);
  const arcGeo = new THREE.BufferGeometry();
  arcGeo.setAttribute('position', new THREE.BufferAttribute(arcPos, 3));
  const arcMat = new THREE.LineBasicMaterial({
    color: 0xbdf6ff, transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const arc = new THREE.Line(arcGeo, arcMat);
  arc.frustumCulled = false;
  fx.add(arc);

  const arc2Mat = new THREE.LineBasicMaterial({
    color: 0x7dd3fc, transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const arc2Geo = new THREE.BufferGeometry();
  arc2Geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(ARC_N * 3), 3));
  const arc2 = new THREE.Line(arc2Geo, arc2Mat);
  arc2.frustumCulled = false;
  fx.add(arc2);

  const coreMat = new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.055, 12, 10), coreMat);
  fx.add(core);

  const haloMat = new THREE.MeshBasicMaterial({
    color: 0x67e8f9, transparent: true, opacity: 0,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  const halo = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 12), haloMat);
  fx.add(halo);

  const flameInnerMat = new THREE.MeshBasicMaterial({
    color: 0xfff3b0, transparent: true, opacity: 0,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  const flameInner = new THREE.Mesh(new THREE.SphereGeometry(0.20, 16, 12), flameInnerMat);
  fx.add(flameInner);

  const flameOuterMat = new THREE.MeshBasicMaterial({
    color: 0xff7a1a, transparent: true, opacity: 0,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  const flameOuter = new THREE.Mesh(new THREE.SphereGeometry(0.30, 16, 12), flameOuterMat);
  fx.add(flameOuter);

  const sparkLight = new THREE.PointLight(0x9fe8ff, 0, 3.2, 2);
  fx.add(sparkLight);

  /* ─────────────── heat-range / material model ─────────────── */
  const HEAT_BASE = { hot: 780, normal: 600, cold: 430 };
  const HEAT_LOAD = { hot: 230, normal: 185, cold: 140 };
  const MAT_FAC   = { copper: 1.00, platinum: 1.08, iridium: 1.15 };

  /* ─────────────── side panel + waveform ─────────────── */
  let setHeatBtn = null, setMatBtn = null, setViewBtn = null, setFoulBtn = null;
  let rpmRange = null, loadRange = null;
  let rpmVal = null, loadVal = null;
  let waveCanvas = null, wctx = null;

  try {
    const panel = document.createElement('div');
    panel.id = 'sp-ui';
    panel.style.cssText = [
      'position:fixed', 'right:14px', 'bottom:14px', 'z-index:9999',
      'display:flex', 'flex-direction:column', 'gap:9px',
      'padding:12px', 'border-radius:12px', 'width:216px',
      'background:rgba(8,11,18,.72)', 'backdrop-filter:blur(10px)',
      'border:1px solid rgba(148,163,184,.22)',
      'color:#cbd5e1', 'user-select:none'
    ].join(';');
    document.body.appendChild(panel);

    function makeRow(label, options, initial, onPick) {
      const wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex;flex-direction:column;gap:4px';
      const lab = document.createElement('div');
      lab.className = 'sp-lab';
      lab.textContent = label;
      wrap.appendChild(lab);
      const row = document.createElement('div');
      row.className = 'sp-row';
      const btns = {};
      options.forEach(([key, text]) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'sp-btn';
        b.textContent = text;
        b.addEventListener('click', () => { onPick(key); select(key); });
        btns[key] = b;
        row.appendChild(b);
      });
      function select(key) {
        Object.keys(btns).forEach(kk => btns[kk].classList.toggle('on', kk === key));
      }
      select(initial);
      wrap.appendChild(row);
      panel.appendChild(wrap);
      return select;
    }

    setHeatBtn = makeRow('Heat range', [['hot', 'Hot'], ['normal', 'Normal'], ['cold', 'Cold']], 'normal', v => {
      state.heat = v;
      rebuildPlugs();
      updateGround(state.hookY === 999 ? -0.89 : state.hookY);
    });

    setMatBtn = makeRow('Electrode', [['copper', 'Cu'], ['platinum', 'Pt'], ['iridium', 'Ir']], 'copper', v => {
      state.material = v;
    });

    setViewBtn = makeRow('View', [['full', 'Full'], ['cut', 'Cutaway']], 'full', v => {
      state.cut = (v === 'cut');
      plugFull.visible = !state.cut;
      plugCut.visible  =  state.cut;
    });

    setFoulBtn = makeRow('Condition', [['clean', 'Clean'], ['foul', 'Foul']], 'clean', v => {
      state.forceFoul = (v === 'foul');
    });

    /* RPM slider */
    (function () {
      const wrap = document.createElement('div');
      wrap.className = 'sp-slider';
      const head = document.createElement('div');
      head.className = 'sp-head';
      const l = document.createElement('span'); l.textContent = 'RPM';
      const v = document.createElement('span'); v.className = 'sp-val'; v.textContent = state.rpm + '';
      head.appendChild(l); head.appendChild(v);
      const inp = document.createElement('input');
      inp.type = 'range'; inp.min = '800'; inp.max = '7000'; inp.step = '100'; inp.value = state.rpm + '';
      inp.addEventListener('input', () => {
        state.rpm = parseFloat(inp.value);
        v.textContent = state.rpm + '';
      });
      wrap.appendChild(head); wrap.appendChild(inp);
      panel.appendChild(wrap);
      rpmRange = inp; rpmVal = v;
    })();

    /* Load slider */
    (function () {
      const wrap = document.createElement('div');
      wrap.className = 'sp-slider';
      const head = document.createElement('div');
      head.className = 'sp-head';
      const l = document.createElement('span'); l.textContent = 'Load';
      const v = document.createElement('span'); v.className = 'sp-val'; v.textContent = Math.round(state.load * 100) + '%';
      head.appendChild(l); head.appendChild(v);
      const inp = document.createElement('input');
      inp.type = 'range'; inp.min = '0'; inp.max = '100'; inp.step = '1'; inp.value = (state.load * 100) + '';
      inp.addEventListener('input', () => {
        state.load = parseFloat(inp.value) / 100;
        v.textContent = Math.round(state.load * 100) + '%';
      });
      wrap.appendChild(head); wrap.appendChild(inp);
      panel.appendChild(wrap);
      loadRange = inp; loadVal = v;
    })();

    /* waveform canvas */
    waveCanvas = document.createElement('canvas');
    waveCanvas.width = 192; waveCanvas.height = 64;
    waveCanvas.style.cssText = 'width:100%;height:64px;border-radius:7px;background:rgba(2,6,16,.7);border:1px solid rgba(148,163,184,.18);display:block';
    panel.appendChild(waveCanvas);
    wctx = waveCanvas.getContext('2d');
  } catch (e) { /* overlay is optional */ }

  /* ─────────────── waveform helpers ─────────────── */
  function voltageAt(ph, misfire, Vreq) {
    if (ph < 0.58) return 0;
    if (ph < 0.62) return Vreq * (ph - 0.58) / 0.04;
    if (ph < 0.80) {
      if (misfire) return Vreq * 0.32 * (1 - (ph - 0.62) / 0.18);
      const f = (ph - 0.62) / 0.18;
      if (f < 0.14) return Vreq * (1 - f / 0.14 * 0.90);
      return 1.35 + 0.30 * Math.sin(f * 60) * Math.exp(-f * 7);
    }
    const f = (ph - 0.80) / 0.20;
    if (misfire) return 0;
    return (1.35 + 0.30 * Math.sin(f * 50)) * Math.exp(-f * 5);
  }

  function misfireAt(cyc, ratio) {
    const rnd = frac(Math.sin(cyc * 127.1 + 3.7) * 43758.5453);
    const chance = ratio > 0.58 ? 0.55 : ratio > 0.46 ? 0.18 : 0.0;
    return rnd < chance;
  }

  function drawWave(t, Vreq, avail, ratio, CYCLE_HZ) {
    if (!wctx) return;
    const W = waveCanvas.width, H = waveCanvas.height;
    wctx.clearRect(0, 0, W, H);

    /* grid */
    wctx.strokeStyle = 'rgba(148,163,184,0.13)';
    wctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
      const y = Math.round(H * i / 4) + 0.5;
      wctx.beginPath(); wctx.moveTo(0, y); wctx.lineTo(W, y); wctx.stroke();
    }

    /* trace */
    const winSec = 2.4;
    const yMax   = Math.max(avail * 1.02, Vreq * 1.12, 20);
    wctx.strokeStyle = '#7dd3fc';
    wctx.lineWidth = 1.4;
    wctx.beginPath();
    for (let x = 0; x <= W; x++) {
      const tPast = t - (1 - x / W) * winSec;
      const cyc   = Math.floor(tPast * CYCLE_HZ);
      const ph    = tPast * CYCLE_HZ - cyc;
      const mis   = misfireAt(cyc, ratio);
      const V     = voltageAt(ph, mis, Vreq);
      const y     = H - (V / yMax) * (H - 8) - 4;
      if (x === 0) wctx.moveTo(x, y); else wctx.lineTo(x, y);
    }
    wctx.stroke();

    /* labels */
    wctx.fillStyle = 'rgba(148,163,184,0.7)';
    wctx.font = '600 8px ui-sans-serif,system-ui,sans-serif';
    wctx.fillText('SECONDARY kV', 6, 10);
    wctx.fillText(yMax.toFixed(0), 6, H - 4);
  }

  /* ─────────────── animation state ─────────────── */
  const CYCLE_HZ = 0.85;
  let lastCycle = -1, misfireThisCycle = false;

  return {
    labels: [
      ['Terminal',          [ 0.00,  3.16, 0.00]],
      ['Ceramic insulator', [ 0.58,  2.05, 0.00]],
      ['Hex shell',         [ 0.72,  0.36, 0.00]],
      ['Thread',            [ 0.62, -0.46, 0.00]],
      ['Glass seal',        [-0.58,  1.26, 0.00]],
      ['Copper core',       [-0.50,  0.58, 0.00]],
      ['Centre electrode',  [-0.54, -0.28, 0.00]],
      ['Ground electrode',  [ 0.72, -1.06, 0.00]],
      ['Spark gap',         [-0.56, -0.96, 0.34]]
    ],

    update(c) {
      const k = clamp(typeof c.k === 'number' ? c.k : state.gapK, 0, 1);
      state.gapK = k;
      const t = (typeof c.t === 'number' ? c.t : 0);

      /* keep sliders in sync (framework slider may drive gap only) */
      if (rpmRange)  { state.rpm  = parseFloat(rpmRange.value);  if (rpmVal)  rpmVal.textContent  = state.rpm + ''; }
      if (loadRange) { state.load = parseFloat(loadRange.value) / 100; if (loadVal) loadVal.textContent = Math.round(state.load * 100) + '%'; }

      /* ── tip temperature ── */
      const tipTemp = HEAT_BASE[state.heat]
                    + state.load * HEAT_LOAD[state.heat]
                    + (state.rpm / 6000) * 55;

      /* ── geometry: gap ── */
      const gapMm = 0.60 + k * 1.00;                // 0.60 – 1.60 mm
      const gapU  = 0.090 + k * 0.245;              // visual (exaggerated) gap
      const tipY  = -0.800;
      const hookY = tipY - gapU;

      if (Math.abs(hookY - state.hookY) > 0.0004) {
        state.hookY = hookY;
        updateGround(hookY);
      }

      /* ── carbon fouling ── */
      const autoFoul = tipTemp < 450;
      const showCarbon = state.forceFoul || autoFoul;
      carbonRefs.forEach(g => { if (g) g.visible = showCarbon; });

      /* ── material / pad visibility ── */
      const usePads = state.material !== 'copper';
      const padMat = state.material === 'iridium' ? M.iridium : M.platinum;
      padRefs.forEach(p => {
        if (!p) return;
        p.visible = usePads;
        if (p.material !== padMat) p.material = padMat;
      });
      if (plugFull) plugFull.traverse(o => { if (o.userData && o.userData.pad) { o.userData.pad.material = padMat; o.userData.pad.visible = usePads; } });
      if (plugCut)  plugCut.traverse(o => { if (o.userData && o.userData.pad) { o.userData.pad.material = padMat; o.userData.pad.visible = usePads; } });

      /* ── electrode glow from tip temperature ── */
      const gn = clamp((tipTemp - 430) / 520, 0, 1);
      M.elec.emissive.setRGB(gn * 1.00, gn * gn * 0.32, gn * gn * gn * 0.05);
      M.elec.emissiveIntensity = gn * 1.15;
      M.groundE.emissive.setRGB(gn * 0.95, gn * gn * 0.28, gn * gn * gn * 0.04);
      M.groundE.emissiveIntensity = gn * 1.05;

      /* ── electrical model ── */
      const loadFactor = 0.85 + state.load * 0.55;
      const matFactor  = MAT_FAC[state.material] || 1;
      const tempVFac   = 1 - clamp((tipTemp - 400) / 1200, 0, 0.25);
      const carbonFac  = showCarbon ? 1.28 : 1;
      const Vreq = (5.0 + 12.0 * gapMm) * loadFactor * matFactor * tempVFac * carbonFac;

      const interSparkMs = 120000 / (state.rpm * 4);
      const dwellMs = interSparkMs * 0.70;
      const tauMs = 3.5;
      const Ipeak = 10 * (1 - Math.exp(-dwellMs / tauMs));
      const Ifull = 10 * (1 - Math.exp(-7 / tauMs));
      const satRatio = clamp(Ipeak / Ifull, 0, 1);
      const avail = 30 * (0.75 + 0.25 * satRatio);
      const energy = 0.5 * 1e-3 * Ipeak * Ipeak * 1000;   // mJ

      const ratio = Vreq / avail;
      const riskTxt = ratio > 0.58 ? 'High' : ratio > 0.46 ? 'Medium' : 'Low';
      const riskCls = ratio > 0.58 ? 'crit' : ratio > 0.46 ? 'warn' : 'ok';

      /* pre-ignition warning */
      const preIgn = tipTemp > 900;

      /* ── ignition cycle ── */
      const cyc = frac(t * CYCLE_HZ);
      const charging = cyc < 0.58;
      const firing   = cyc >= 0.58 && cyc < 0.80;
      const burning  = cyc >= 0.80;

      const cycleIndex = Math.floor(t * CYCLE_HZ);
      if (cycleIndex !== lastCycle) {
        lastCycle = cycleIndex;
        misfireThisCycle = misfireAt(cycleIndex, ratio);
      }

      const sparkOn = firing && !misfireThisCycle;
      const flicker = Math.sin(t * 92.0) > -0.32;
      const showArc = sparkOn && flicker;

      /* ── arc geometry ── */
      const midY = (tipY + hookY) * 0.5;
      arc.visible = showArc;
      arc2.visible = showArc;
      if (showArc) {
        const p2 = arc2Geo.attributes.position.array;
        for (let i = 0; i < ARC_N; i++) {
          const f = i / (ARC_N - 1);
          const j = (i === 0 || i === ARC_N - 1) ? 0 : 0.038;
          arcPos[i * 3    ] = (Math.random() - 0.5) * j;
          arcPos[i * 3 + 1] = lerp(tipY - 0.006, hookY + 0.006, f);
          arcPos[i * 3 + 2] = (Math.random() - 0.5) * j;
          const j2 = (i === 0 || i === ARC_N - 1) ? 0 : 0.060;
          p2[i * 3    ] = (Math.random() - 0.5) * j2;
          p2[i * 3 + 1] = lerp(tipY - 0.006, hookY + 0.006, f);
          p2[i * 3 + 2] = (Math.random() - 0.5) * j2;
        }
        arcGeo.attributes.position.needsUpdate = true;
        arc2Geo.attributes.position.needsUpdate = true;
        arcGeo.computeBoundingSphere();
        arc2Geo.computeBoundingSphere();
      }

      core.position.set(0, midY, 0);
      halo.position.set(0, midY, 0);
      coreMat.opacity = showArc ? 0.95 : 0;
      haloMat.opacity = showArc ? 0.42 : 0;
      halo.scale.setScalar(0.9 + Math.random() * 0.55);

      sparkLight.position.set(0, midY, 0);
      sparkLight.intensity = showArc ? 2.9 : 0;

      /* ── combustion kernel ── */
      if (burning) {
        const f = (cyc - 0.80) / 0.20;
        const r = 0.30 + f * 1.65;
        flameInner.position.set(0, midY - 0.04, 0);
        flameOuter.position.set(0, midY - 0.04, 0);
        flameInner.scale.setScalar(r * 0.85);
        flameOuter.scale.setScalar(r);
        flameInnerMat.opacity = Math.sin(f * Math.PI) * 0.55;
        flameOuterMat.opacity = Math.sin(f * Math.PI) * 0.40;
      } else {
        flameInnerMat.opacity = 0;
        flameOuterMat.opacity = 0;
      }

      /* ── waveform ── */
      drawWave(t, Vreq, avail, ratio, CYCLE_HZ);

      /* ── HUD ── */
      const burnMs = 1.85 - 0.85 * k;
      const statusText = misfireThisCycle && firing ? 'MISFIRE'
                       : showArc ? 'SPARK'
                       : burning ? 'COMBUSTION'
                       : preIgn ? 'PRE-IGNITION'
                       : 'CHARGING';

      const tempStr = tipTemp.toFixed(0) + ' °C' + (preIgn ? ' ⚠' : '');

      return {
        big: Vreq.toFixed(1),
        unit: ' kV',
        bar: clamp(ratio * 100, 0, 100),
        rows: {
          gap:  gapMm.toFixed(2) + ' mm',
          burn: burnMs.toFixed(1) + ' ms'
        },
        ro: {
          gap:    [gapMm.toFixed(2) + ' mm', 'hi'],
          req:    [Vreq.toFixed(1) + ' kV', ''],
          avail:  [avail.toFixed(1) + ' kV', satRatio < 0.75 ? 'warn' : ''],
          burn:   [burnMs.toFixed(1) + ' ms', ''],
          energy: [energy.toFixed(0) + ' mJ', energy < 22 ? 'warn' : ''],
          temp:   [tempStr, preIgn ? 'crit' : tipTemp < 450 ? 'warn' : 'ok'],
          risk:   [riskTxt, riskCls]
        },
        status: [statusText, showArc || burning],
        ctl: gapMm.toFixed(2) + ' mm'
      };
    }
  };
}

runGuidedModule(CFG, build);
</script>
</body>
</html>
