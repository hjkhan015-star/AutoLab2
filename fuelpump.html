<script type="module">
import { runGuidedModule, controls } from './components.js';

/* ── CONFIG (module content) ─────────────────────────────────────── */
const CFG = {
  "moduleId": "fuelpump",
  "title": "Fuel Pump & Tank",
  "kicker": "Fuel Supply",
  "accent": "#10b981",
  "badge": "In-tank electric pump",
  "camPos": [5.6, 3.4, 7.2],
  "target": [1.2, 0, 0],
  "floorY": -1.6,
  ctls: [   /* Phase 3: sliders live in the dock as axis controls; ctls[0] (id 'ctl') = the main 0-100 % control */
    { id:'ctl', label:"Engine demand", caption:"Load", preset:'percent', def:40 },
    { id:'volts', preset:'voltage', label:'Battery voltage', onChange:(v)=>{ S.volts = v; } },
    { id:'ambient', min:-10, max:50, step:1, def:25, unit:'\u00B0C', label:'Under-bonnet temp', onChange:(v)=>{ S.ambient = v; } },
  ],
  "chipLabel": "Rail pressure",
  "rows": [["supply", "Supply"], ["cur", "Pump current"]],
  "ro": [
    ["press",  "Rail pressure"],
    ["supply", "Pump supply"],
    ["demand", "Engine demand"],
    ["cur",    "Pump current"],
    ["lvl",    "Tank level"],
    ["temp",   "Fuel temperature"],
    ["filt",   "Filter drop"],
    ["state",  "State"]
  ],
  "legend": [
    ["var(--c-orange)", "Fuel (cool)"],
    ["var(--c-orange)", "Fuel (hot)"],
    ["var(--c-cyan)", "Filter"],
    ["var(--c-lime)", "Regulator"],
    ["var(--c-red)", "Low pressure warning"],
    ["var(--c-slate)", "Vapour / no prime"]
  ],
  "overview": "<div class=\"al-sec\"><h4>Job of the system<\/h4><p>The tank stores fuel; the electric pump lifts it and pushes it through the filter to the fuel rail at a steady pressure (about 3–4&nbsp;bar for port injection). The regulator returns whatever the engine does not need.<\/p><\/div><div class=\"al-sec\"><h4>Parts<\/h4><ul><li><b>Tank &amp; baffles<\/b> – stop fuel surging away from the pickup under cornering.<\/li><li><b>In-tank pump<\/b> – a small DC motor driving a roller or turbine element; cooled and lubricated by the fuel itself.<\/li><li><b>Filter \/ sock<\/b> – traps particles down to ~10&nbsp;&micro;m.<\/li><li><b>Pressure regulator<\/b> – bleeds surplus fuel back to the tank so rail pressure stays constant as demand changes.<\/li><\/ul><\/div><div class=\"al-sec\"><h4>Flow, not pressure<\/h4><p>The pump is a <i>flow<\/i> device. The regulator turns that flow into a pressure by holding a spring-loaded seat closed. If the pump cannot deliver more than the engine uses, the regulator has nothing to return and the rail pressure collapses — the engine runs lean.<\/p><\/div><div class=\"al-sec\"><h4>Why voltage matters<\/h4><p>A DC motor's speed is roughly proportional to its supply voltage. A tired battery, a corroded connector or a failing relay all reduce voltage at the pump, and flow falls with it. A 30&nbsp;% voltage drop can be a 30&nbsp;% flow loss right when the engine needs fuel most.<\/p><\/div><div class=\"al-sec\"><h4>Heat and vapour lock<\/h4><p>Fuel absorbs heat from the pump motor and from the returned fuel. With a low tank level there is less fuel to absorb it, so temperature climbs and light ends start to vaporise — the pump then tries to compress a gas instead of a liquid and flow collapses.<\/p><\/div><div class=\"al-sec\"><h4>Try this<\/h4><p>Set full load and drag the <b>Battery voltage<\/b> down to 9&nbsp;V — watch supply fall below demand and the rail pressure sag. Then select <b>Failed relay \/ no prime<\/b> and see everything drop to zero. Refuel and reset to recover.<\/p><\/div>",
  "faults": [
    ["Weak pump (worn / low voltage)", "Loss of power under load, hesitation, long cranking. Rail pressure falls as demand rises but returns at idle.", "Measure rail pressure at idle and under load; measure voltage at the pump connector while running; check pump current draw."],
    ["Clogged filter / sock", "Starving at high speed and high load; pressure drops away as flow demand increases. Pump may whine.", "Compare pressure before and after the filter; inspect the in-tank sock for debris; replace the filter."],
    ["Stuck regulator (high)", "Rich running, black smoke, high fuel consumption, fuel smell, hard hot starting. Rail pressure well above spec at idle.", "Check rail pressure at idle against spec; pull the vacuum hose on a vacuum-referenced regulator and watch for fuel or no change."],
    ["Stuck regulator (low)", "Lean running, misfire, hesitation, P0171. Rail pressure low at all loads even with a healthy pump.", "Measure rail pressure; clamp the return line briefly (carefully) — if pressure jumps, the regulator is bypassing."],
    ["Failed relay / no prime", "Engine cranks but will not start, or dies immediately. No pump noise on key-on.", "Check the fuel pump fuse and relay, listen for the two-second prime, and measure voltage at the pump connector during cranking."],
    ["Vapour lock (hot fuel)", "Hot restart problems, lean stumble at low tank level in summer traffic.", "Check fuel temperature, keep the tank above a quarter, and verify the tank return line is not restricted."]
  ],
  "quiz": [
    ["Why is the pump inside the tank?", ["To save space only", "Fuel cools and lubricates it", "To heat the fuel"], 1, "Submerged, the pump is cooled and lubricated by the fuel - running consistently low can overheat it."],
    ["What does the regulator do?", ["Filters dirt", "Holds rail pressure by returning surplus fuel", "Measures fuel level"], 1, "It bleeds off surplus so pressure stays constant regardless of how much the engine is using."],
    ["A clogged filter typically causes…", ["Low pressure under load", "Higher octane", "Colder intake"], 0, "Restriction limits flow, so pressure falls exactly when the engine needs fuel most."],
    ["Pump flow falls when…", ["Supply voltage falls", "Fuel is cold", "Tank is full"], 0, "A DC motor's speed is roughly proportional to supply voltage, so flow tracks voltage."],
    ["Rail pressure sags below the regulator setting when…", ["Supply is less than engine demand", "The tank is full", "The engine is idling"], 0, "With no surplus to return the regulator cannot hold pressure - the engine runs lean."],
    ["Hot fuel at a low tank level is a problem because…", ["Less liquid fuel to absorb heat, so vapour forms", "It is heavier", "It damages the filter"], 0, "Vapour in the pump destroys flow - the pump cannot move gas efficiently."]
  ]
};

/* ═══════════════════════════════════════════════════════════════════
   PHYSICS MODEL — pure, named functions.
   Simplified physical trends, not a bench lookup table.
   ═══════════════════════════════════════════════════════════════════ */

function clampN(x, a, b) {
  if (!Number.isFinite(x)) return a;
  return x < a ? a : (x > b ? b : x);
}
const num = (x, d) => (Number.isFinite(x) ? x : d);

/* ── named constants ─────────────────────────────────────────────── */
const V_NOM        = 13.5;   /* V, nominal supply with the alternator charging   */
const V_CUTIN      = 6.0;    /* V, below this the pump motor will not turn       */
const FLOW_NOM     = 120;    /* L/h, free flow at nominal voltage                */
const REG_SET      = 3.5;    /* bar, healthy regulator set pressure              */
const DEMAND_IDLE  = 4;      /* L/h, idle consumption                            */
const DEMAND_MAX   = 90;     /* L/h, extra at full load + redline                */
const TANK_LITRES  = 50;     /* L, tank capacity (for the level drain rate)      */
const TAU_FUELT    = 60;     /* s, fuel temperature time constant                */
const TAU_LEVEL    = 2.0;    /* s, level slosh / settle time constant            */
const VAPOUR_C     = 65;     /* °C, fuel temperature where vapour lock is a risk */
const FILT_NORMAL  = 0.08;   /* fraction of flow lost to a healthy filter        */
const FILT_CLOGGED = 0.72;   /* fraction lost with a clogged filter              */

/* Pump free-flow (L/h). Direction: more volts -> faster motor -> more
   flow; more filter restriction -> less. A dead relay gives zero. */
function pumpFlowLph(volts, filtRestriction, fault) {
  const V = clampN(num(volts, V_NOM), 0, 15);
  const vN = clampN((V - V_CUTIN) / (V_NOM - V_CUTIN), 0, 1.20);
  let f = FLOW_NOM * vN;
  f *= (1 - 0.65 * clampN(num(filtRestriction, 0), 0, 1));
  if (fault === 'relay') f = 0;
  if (fault === 'weak')  f *= 0.45;
  if (fault === 'vapour') f *= 0.30;
  return clampN(f, 0, 200);
}

/* Engine fuel demand (L/h). Direction: more load, more rpm -> more. */
function fuelDemandLph(load, rpm) {
  const L = clampN(num(load, 0), 0, 1);
  const n = clampN((num(rpm, 800) - 800) / 5200, 0, 1);
  return DEMAND_IDLE + DEMAND_MAX * L * (0.50 + 0.50 * n);
}

/* Rail pressure (bar). The regulator holds its setting while the pump
   can supply at least the engine demand; below that the rail sags
   proportionally. A stuck regulator scales the whole curve. */
function railPressureBar(supplyLph, demandLph, fault) {
  const s = Math.max(0, num(supplyLph, 0));
  const d = Math.max(1, num(demandLph, 1));
  if (s < 0.5) return 0;
  const ratio = clampN(s / d, 0, 1.30);
  let k = 1.0;
  if (fault === 'reghigh') k = 1.55;
  if (fault === 'reglow')  k = 0.45;
  return clampN(REG_SET * k * Math.min(1, ratio), 0, 8);
}

/* Pump current (A). Direction: more flow -> more torque -> more
   current; lower supply voltage -> more current for the same power;
   a weak pump draws noticeably less. */
function pumpCurrentA(volts, flowLph, fault) {
  if (fault === 'relay') return 0;
  const base = 3.0 + 5.5 * clampN(num(flowLph, 0) / FLOW_NOM, 0, 1.2);
  const vDrop = clampN((V_NOM - clampN(num(volts, V_NOM), 6, 15)) / V_NOM, 0, 0.6);
  let i = base * (1 + 0.8 * vDrop);
  if (fault === 'weak')   i *= 0.60;
  if (fault === 'vapour') i *= 0.55;
  return clampN(i, 0, 20);
}

/* Fuel temperature the tank settles at. Direction: more load (more
   return heat) and a lower tank level (less thermal mass) -> hotter. */
function fuelTempTarget(load, level, ambient) {
  const L   = clampN(num(load, 0), 0, 1);
  const lvl = clampN(num(level, 1), 0, 1);
  const amb = clampN(num(ambient, 25), -10, 50);
  const low = clampN((0.50 - lvl) / 0.50, 0, 1);
  return 28 + 0.20 * amb + 15 * L + 40 * low;
}

const FAULT_INFO = {
  none:    { label: 'None (healthy)',               warn: '' },
  weak:    { label: 'Weak pump (worn / low voltage)', warn: 'The pump cannot deliver its rated flow. Supply falls below engine demand under load, so rail pressure sags and the mixture goes lean. Diagnostic: P0087 fuel rail pressure too low.' },
  filter:  { label: 'Clogged filter / sock',        warn: 'The filter is restricted. Flow is throttled, pressure drop across the filter is high and the rail starves at high demand. Diagnostic: P0087 / P0088 at high load only.' },
  reghigh: { label: 'Stuck regulator (high)',       warn: 'The regulator is jammed closed so it cannot return surplus fuel. Rail pressure sits well above spec: rich running, black smoke, fuel smell. Diagnostic: P0088.' },
  reglow:  { label: 'Stuck regulator (low)',        warn: 'The regulator is stuck open and bypasses fuel straight back to the tank. Rail pressure stays low at all loads. Diagnostic: P0087 / P0171 lean bank.' },
  relay:   { label: 'Failed relay / no prime',      warn: 'The pump never runs - no prime on key-on. The engine cranks but will not start. Check fuse, relay and voltage at the pump connector.' },
  vapour:  { label: 'Vapour lock (hot fuel)',       warn: 'Fuel is hot enough at this tank level that light ends are vaporising. The pump is moving gas, not liquid, so flow and pressure collapse. Diagnostic: hot-restart lean stumble.' }
};

/* ═══════════════════════════════════════════════════════════════════
   EXTRA CONTROLS (built here; the runtime only provides one slider)
   ═══════════════════════════════════════════════════════════════════ */
const S = {
  volts: 13.5,
  ambient: 25,
  fault: 'none',
  speed: 1
};



/* ── simulation state (module level so Reset can reach it) ───────── */
/* Phase 7a: the history lives in the Monitor (CFG.traces); the module only hands over one normalised sample
   per ~140 ms while the sim runs (0..100 % of each old axis range) and the current warning sentence. */
let traceSample = null, traceClear = false, warnText = '';
let domLast = 0;                /* throttle clock for the DOM work in update() (was never declared) */
const traceN = (v, lo, hi) => Math.round(clampN((v - lo) / (hi - lo), 0, 1) * 1000) / 10;
const sim = {
  level: 0.85,
  Tfuel: 30,
  lastT: -1
};

function resetModel() {
  sim.level = 0.85;
  sim.Tfuel = 30;
  sim.lastT = -1;
  traceClear = true;                  /* Monitor trace is cleared on the next update */
}
function resetAll() {
  S.volts = 13.5;
  S.ambient = 25;
  S.fault = 'none';
  S.speed = 1;
  resetModel();
  controls.resetAll();                 /* every axis back to its default (store -> onChange -> S) */
}

/* ═══════════════════════════════════════════════════════════════════
   MODULE SCENE (per-module 3D parts)
   ═══════════════════════════════════════════════════════════════════ */
function build(H){
 const { box, cyl, cylX, cylZ, mat, glass, pipe, stream, lc, clamp, root, THREE, lowEnd } = H;

 const steel = mat(0x8a93a5, .80, .30);
 const blue  = mat(0x38bdf8, .50, .40);
 const hose  = mat(0x1f2937, .20, .80);
 const grn   = mat(0xa3e635, .50, .40, { emissive: 0x000000, emissiveIntensity: 0 });

 /* ── tank + baffles ───────────────────────────────────────────── */
 box(3.4, 1.4, 2.2, glass(0x94a3b8, .16), 0, 0, 0);
 box(0.06, 1.3, 2.0, mat(0x64748b, .5, .5), -0.6, 0, 0);
 box(0.06, 1.3, 2.0, mat(0x64748b, .5, .5),  0.9, 0, 0);

 /* ── fuel (scales with level) ─────────────────────────────────── */
 const fuelMat = glass(0xf59e0b, .46);
 const fuel = box(3.3, 1.3, 2.1, fuelMat, 0, 0, 0);

 /* ── in-tank pump + impeller ──────────────────────────────────── */
 const pumpMat = glass(0x64748b, .45);
 cyl(.34, .34, .90, pumpMat, -0.9, -.15, 0);
 const imp = new THREE.Group(); imp.position.set(-0.9, -.15, 0); root.add(imp);
 for (let i = 0; i < 6; i++) {
   const v = box(.30, .70, .04, mat(0xf97316, .4, .4), 0, 0, 0, imp);
   v.rotation.y = i * Math.PI / 6;
 }
 cyl(.36, .36, .14, steel, -0.9, .37, 0);

 /* ── filter canister ──────────────────────────────────────────── */
 const filtMat = mat(0x38bdf8, .50, .40, { emissive: 0x000000, emissiveIntensity: 0 });
 cyl(.35, .35, 1.20, filtMat, 2.0, .50, 0);

 /* ── fuel rail + bosses ───────────────────────────────────────── */
 const railMat = mat(0x9aa3b2, .85, .30, { emissive: 0x000000, emissiveIntensity: 0 });
 cylZ(.15, .15, 2.20, railMat, 4.0, -.25, 0);
 [-0.8, -0.27, 0.27, 0.8].forEach(z => cyl(.08, .08, .50, steel, 4.0, -.55, z));

 /* ── pressure regulator ───────────────────────────────────────── */
 const regMat = mat(0xa3e635, .50, .40, { emissive: 0x000000, emissiveIntensity: 0 });
 cyl(.20, .20, .50, regMat, 3.2, -.60, .95);

 /* ── hoses ────────────────────────────────────────────────────── */
 pipe([[-0.9, .4, 0], [-0.9, 1.5, 0], [2, 1.5, 0], [2, 1.1, 0]], .07, hose);
 pipe([[2, -.1, 0], [2, -.6, 0], [3.2, -.6, 0], [4, -.6, 0]], .07, hose);
 pipe([[4, -.3, .95], [3.2, -.3, .95], [2.6, -.3, .95], [1.4, -.3, .95]], .06, hose);

 /* ── particle streams ─────────────────────────────────────────── */
 const nA = lowEnd ? 10 : 18;
 const nB = lowEnd ?  8 : 14;
 const nC = lowEnd ?  8 : 12;
 const nV = lowEnd ?  6 : 10;

 const sA = stream([[-0.9, .4, 0], [-0.9, 1.5, 0], [2, 1.5, 0], [2, 1.1, 0]], nA, 0xf59e0b, .11);
 const sB = stream([[2, -.1, 0], [2, -.6, 0], [3.2, -.6, 0], [4, -.6, 0]], nB, 0xf59e0b, .11);
 const sC = stream([[4, -.3, .95], [3.2, -.3, .95], [2.6, -.3, .95], [1.4, -.3, .95]], nC, 0xf59e0b, .09);
 const vap = stream([[1.4, -.55, .95], [2.4, -.45, .95], [3.4, -.55, .95]], nV, 0xf1f5f9, .10);

 /* ── injector spray stubs (rail -> engine) ────────────────────── */
 const inj = [];
 [-0.8, -0.27, 0.27, 0.8].forEach(z => {
   inj.push(stream([[4.0, -.85, z], [4.0, -1.35, z]], lowEnd ? 4 : 6, 0xf59e0b, .09));
 });

 let ang = 0, lastDom = 0;
 const tmpCol = new THREE.Color();

 return {
  labels: [
    ['Fuel tank', [-1.3, .95, 1.1]],
    ['In-tank pump', [-0.9, .75, 0]],
    ['Fuel filter', [2.0, 1.25, 0]],
    ['Fuel rail', [4.0, .05, 0]],
    ['Pressure regulator', [3.2, -.20, .95]],
    ['Return line', [1.9, -.05, .95]]
  ],
  update(c){
   /* ── 1. inputs ─────────────────────────────────────────────── */
   const dt    = Math.max(0, num(c.dt, 0)) * S.speed;
   const k     = clampN(c.k, 0, 1);
   const rpm   = 800 + 5200 * k;
   const fault = S.fault;

   if (sim.lastT >= 0 && c.t + 1e-4 < sim.lastT) resetModel();
   sim.lastT = c.t;

   /* ── 2. filter restriction ────────────────────────────────── */
   const filt = (fault === 'filter') ? FILT_CLOGGED : FILT_NORMAL;

   /* ── 3. flow, demand, pressure ────────────────────────────── */
   const supply = pumpFlowLph(S.volts, filt, fault);
   const demand = fuelDemandLph(k, rpm);
   const press  = railPressureBar(supply, demand, fault);
   const cur    = pumpCurrentA(S.volts, supply, fault);

   /* ── 4. tank level state ──────────────────────────────────── */
   if (dt > 0) {
     const drain = demand / 3600 / TANK_LITRES;    /* fraction per second */
     sim.level -= drain * dt * 12;                 /* x12 so the demo is watchable */
   }
   if (fault === 'vapour' || sim.Tfuel > VAPOUR_C) sim.level = Math.max(0.05, sim.level - 0.0000);
   sim.level = clampN(sim.level, 0.03, 1.0);

   /* ── 5. fuel temperature state ────────────────────────────── */
   const Ttgt = fuelTempTarget(k, sim.level, S.ambient);
   if (dt > 0) sim.Tfuel += (Ttgt - sim.Tfuel) * (1 - Math.exp(-dt / TAU_FUELT));
   sim.Tfuel = clampN(sim.Tfuel, -20, 120);

   const vapouring = (sim.Tfuel > VAPOUR_C && sim.level < 0.30) || fault === 'vapour';

   /* ── 6. status text ───────────────────────────────────────── */
   let stateTxt;
   if (fault === 'relay' || supply < 0.5)  stateTxt = 'NO PRIME';
   else if (press < 1.8)                   stateTxt = 'LEAN / LOW PRESS';
   else if (press > 4.6)                   stateTxt = 'OVER-PRESSURE';
   else if (vapouring)                     stateTxt = 'VAPOUR RISK';
   else if (sim.level < 0.12)              stateTxt = 'LOW FUEL';
   else                                    stateTxt = 'Normal';

   /* ── 7. 3D visuals ────────────────────────────────────────── */
   const lvl = clampN(sim.level, 0.05, 1);
   fuel.scale.y = lvl;
   fuel.position.y = -0.65 + 1.3 * lvl / 2;
   fuelMat.color.copy(lc(0xf59e0b, 0xb45309, clampN((sim.Tfuel - 20) / 70, 0, 1)));

   /* impeller spin follows voltage (and stops with a dead relay) */
   const running = (fault !== 'relay') && supply > 0.5;
   const motorRpm = running ? (S.volts / V_NOM) * 3000 : 0;
   ang += (motorRpm / 60) * Math.PI * 2 * dt;
   imp.rotation.y = ang;

   /* filter / regulator / rail feedback */
   filtMat.emissive.setHex(fault === 'filter' ? 0xef4444 : 0x000000);
   filtMat.emissiveIntensity = fault === 'filter' ? 0.45 + 0.35 * Math.abs(Math.sin(c.t * 3.5)) : 0;
   filtMat.color.copy(lc(0x38bdf8, 0x1a1410, fault === 'filter' ? 0.75 : 0));

   if (fault === 'reghigh' || fault === 'reglow') {
     regMat.emissive.setHex(0xef4444);
     regMat.emissiveIntensity = 0.45 + 0.35 * Math.abs(Math.sin(c.t * 4));
     regMat.color.copy(fault === 'reghigh' ? lc(0xa3e635, 0xef4444, 0.8) : lc(0xa3e635, 0x1f2937, 0.8));
   } else {
     regMat.emissive.setHex(0x000000);
     regMat.emissiveIntensity = 0;
     regMat.color.setHex(0xa3e635);
   }

   const railGlow = clampN((press - 2.6) / 2.0, 0, 1);
   railMat.emissive.copy(lc(0x000000, 0xff3a00, railGlow * 0.7));
   railMat.emissiveIntensity = railGlow * 0.7;
   railMat.color.copy(lc(0x9aa3b2, 0xef4444, press < 1.8 ? 0.7 : 0));

   /* streams */
   const flowN = clampN(supply / FLOW_NOM, 0, 1.2);
   const spd   = 0.06 + 0.42 * flowN;
   const dens  = running ? (0.18 + 0.82 * flowN) : 0;
   tmpCol.copy(lc(0xf59e0b, 0xb45309, clampN((sim.Tfuel - 20) / 70, 0, 1)));
   if (vapouring) tmpCol.lerp(new THREE.Color(0xf1f5f9), 0.65);

   sA.update(c.t, spd, dens);      sA.mat.color.copy(tmpCol);
   sB.update(c.t, spd, dens);      sB.mat.color.copy(tmpCol);
   const retFrac = clampN(1 - demand / Math.max(1, supply), 0, 1);
   sC.update(c.t, 0.06 + 0.35 * flowN, dens * (0.15 + 0.85 * retFrac));
   sC.mat.color.copy(tmpCol);
   vap.update(c.t, 0.30, vapouring ? 0.85 : 0);

   const injDens = running ? clampN(0.25 + 0.75 * k, 0, 1) : 0;
   for (let i = 0; i < inj.length; i++) {
     inj[i].update(c.t, 0.55 + 0.4 * k, injDens);
     inj[i].mat.color.copy(tmpCol);
   }

   /* ── 8. throttled DOM work (graph + warning) ──────────────── */
   const now = performance.now();
   if (now - domLast > 140) {
     domLast = now;
     if (dt > 0) traceSample = [traceN(press, 0, 6), traceN(sim.Tfuel, 0, 110)];
     let warn = FAULT_INFO[fault] ? FAULT_INFO[fault].warn : '';
     if (!warn) {
       if (supply < 0.5) {
         warn = 'No fuel supply - the pump is not running. Check the fuse, relay and voltage at the pump connector.';
       } else if (press < 1.8) {
         warn = 'Rail pressure ' + press.toFixed(2) + ' bar - supply (' + supply.toFixed(0) + ' L/h) is below engine demand (' + demand.toFixed(0) + ' L/h). The engine will run lean.';
       } else if (press > 4.6) {
         warn = 'Rail pressure ' + press.toFixed(2) + ' bar - well above spec. Expect rich running, black smoke and hard hot starting.';
       } else if (vapouring) {
         warn = 'Fuel at ' + sim.Tfuel.toFixed(0) + ' \u00B0C with a ' + (sim.level * 100).toFixed(0) + ' % tank - vapour lock risk. Keep the tank above a quarter.';
       } else if (sim.level < 0.15) {
         warn = 'Tank level at ' + (sim.level * 100).toFixed(0) + ' % - the pump relies on fuel for cooling. Refuel before it runs dry.';
       }
     }
     warnText = warn;
   }

   /* ── 9. readouts ──────────────────────────────────────────── */
   const pState   = press < 1.8 ? 'crit' : (press < 2.6 ? 'warn' : (press > 4.6 ? 'crit' : 'ok'));
   const supState = supply < demand ? 'warn' : 'ok';
   const curState = cur > 8.5 ? 'warn' : (cur < 1 ? 'crit' : 'ok');
   const lvlState = sim.level < 0.15 ? 'crit' : (sim.level < 0.35 ? 'warn' : 'ok');
   const tState   = sim.Tfuel > VAPOUR_C ? 'crit' : (sim.Tfuel > 50 ? 'warn' : 'ok');
   const fState   = filt > 0.4 ? 'warn' : 'ok';
   const stState  = (press < 1.8 || supply < 0.5) ? 'crit'
                  : (press > 4.6 || vapouring || sim.level < 0.15) ? 'warn'
                  : 'ok';

   let tr;
   if (traceClear) { traceClear = false; traceSample = null; tr = { hist: null }; }
   else if (traceSample) { tr = { hist: traceSample }; traceSample = null; }

   return {
     big: press.toFixed(2),
     unit: ' bar',
     bar: clampN(press / 5 * 100, 0, 100),
     rows: {
       supply: supply.toFixed(0) + ' L/h',
       cur:    cur.toFixed(1) + ' A'
     },
     ro: {
       press:  [press.toFixed(2) + ' bar', pState],
       supply: [supply.toFixed(0) + ' L/h', supState],
       demand: [demand.toFixed(0) + ' L/h', ''],
       cur:    [cur.toFixed(1) + ' A', curState],
       lvl:    [(sim.level * 100).toFixed(0) + ' %', lvlState],
       temp:   [sim.Tfuel.toFixed(0) + ' \u00B0C', tState],
       filt:   ['-' + (filt * 100).toFixed(0) + ' % flow', fState],
       state:  [stateTxt, stState]
     },
     status: [warnText || stateTxt, true, warnText ? 'warn' : ''],
      traces: tr,
     ctl: Math.round(k * 100) + ' % load'
   };
  }
 };
}

/* Phase 6: every option / action lives in the dock (controls.js), nothing interactive is left in the panel.
   'Time scale' is the module's own physics time-compression (thermal warm-up); the menu's Sim speed is separate. */
CFG.options = [
  { id: "fault", type: 'choice', layout: 'select', label: "Fault injection", options: Object.keys(FAULT_INFO).map(id => ({ id, label: FAULT_INFO[id].label })), def: 'none',
    onChange: (id) => { S.fault = id; } },
  { id: 'timeScale', type: 'choice', layout: 'segmented', label: 'Time scale', options: [{ id: '1', label: '1×' }, { id: '5', label: '5×' }, { id: '20', label: '20×' }], def: '1',
    onChange: (id) => { S.speed = Number(id) || 1; } },
  { id: "refuel", type: 'action', label: "Refuel",
    onAction: () => { sim.level = 1.0; } }
];
CFG.onReset = resetAll;      /* the dock Reset runs the module reset (model + every control) */
/* Phase 7a: the old history canvas is a Monitor trace. Both series are drawn as 0..100 % of their old axis ranges. */
CFG.traces = [{ id: 'hist', label: 'Rail pressure and fuel temperature history (% of full scale)', min: 0, max: 100, length: 150,
  series: [
    { id: 'a', label: 'Rail bar', color: 'var(--accent)' },
    { id: 'b', label: 'Fuel \u00B0C', color: 'var(--warn)' }
  ] }];
runGuidedModule(CFG, build);
</script>
</body>
</html>
