  ],
  "overview": "<div class=\"al-sec\"><h4>Job of the system</h4><p>The tank stores fuel; the electric pump lifts it and pushes it through the filter to the fuel rail at a steady pressure (about 3–4&nbsp;bar for port injection). The regulator returns whatever the engine does not need.</p></div><div class=\"al-sec\"><h4>Parts</h4><ul><li><b>Tank, baffles &amp; filler neck</b> – baffles stop fuel surging away from the pickup in corners; the filler neck and cap seal the tank.</li><li><b>Pump module</b> – hangs from a flange in the top of the tank. A <b>swirl pot</b> (cup) keeps the pump covered, a <b>sock</b> strains the fuel, a <b>check valve</b> holds pressure after shut-down, and a <b>float</b> on an arm reads the level.</li><li><b>In-tank pump</b> – a small DC motor driving a turbine impeller; fuel flows through the motor, cooling and lubricating it.</li><li><b>Fuel filter</b> – clamped to the chassis, traps particles down to ~10&nbsp;&micro;m.</li><li><b>Fuel rail &amp; injectors</b> – the rail feeds every injector; the gauge on its test port shows rail pressure.</li><li><b>Pressure regulator</b> – a spring-loaded diaphragm valve on the rail end. It opens against the spring and bleeds surplus fuel back to the tank through the return line. Its vacuum port lets manifold vacuum help open it at idle.</li><li><b>Pump relay</b> – switches battery power to the pump; the ECU closes it at key-on and while the engine turns.</li></ul></div><div class=\"al-sec\"><h4>Flow, not pressure</h4><p>The pump is a <i>flow</i> device. The regulator turns that flow into a pressure by holding a spring-loaded seat closed. If the pump cannot deliver more than the engine uses, the regulator has nothing to return and the rail pressure collapses — the engine runs lean.</p></div><div class=\"al-sec\"><h4>Why voltage matters</h4><p>A DC motor's speed is roughly proportional to its supply voltage. A tired battery, a corroded connector or a failing relay all reduce voltage at the pump, and flow falls with it. A 30&nbsp;% voltage drop can be a 30&nbsp;% flow loss right when the engine needs fuel most.</p></div><div class=\"al-sec\"><h4>Heat and vapour lock</h4><p>Fuel absorbs heat from the pump motor and from the returned fuel. With a low tank level there is less fuel to absorb it, so temperature climbs and light ends start to vaporise — the pump then tries to compress a gas instead of a liquid and flow collapses.</p></div><div class=\"al-sec\"><h4>Read the gauge</h4><p>Green is 2.6–4.6&nbsp;bar. At idle the manifold vacuum lowers the regulator setting slightly, so a healthy rail reads a little lower than at full load. Red below 1.8&nbsp;bar means starving; red above 4.6&nbsp;bar means the regulator is not returning fuel.</p></div><div class=\"al-sec\"><h4>Try this</h4><p>Set full load and drag the <b>Battery voltage</b> down to 9&nbsp;V — watch supply fall below demand and the rail pressure sag. Then select <b>Stuck regulator (high)</b> and watch the return line go quiet while the gauge climbs. Select <b>Failed relay / no prime</b> and see everything drop to zero. Refuel and reset to recover.</p></div>",

    ["Rail pressure sags below the regulator setting when…", ["Supply is less than engine demand", "The tank is full", "The engine is idling"], 0, "With no surplus to return the regulator cannot hold pressure - the engine runs lean."],
    ["Hot fuel at a low tank level is a problem because…", ["Less liquid fuel to absorb heat, so vapour forms", "It is heavier", "It damages the filter"], 0, "Vapour in the pump destroys flow - the pump cannot move gas efficiently."],
    ["What does the check valve in the pump outlet do?", ["Filters the fuel", "Holds pressure in the line after the pump stops", "Limits the pump speed"], 1, "It keeps the line full and pressurised, so the engine restarts quickly instead of waiting for the pump to refill the rail."],
    ["Why is the pump sitting in a swirl pot (cup)?", ["To heat the fuel", "To keep the pickup covered in corners or when the tank is nearly empty", "To store the filter"], 1, "The cup stays full from the return jet, so the pump keeps drawing liquid even when fuel sloshes away from the tank floor."],
    ["The regulator is stuck closed. What happens at the return line?", ["More fuel returns", "Nothing returns and rail pressure rises", "Air is drawn in"], 1, "With the seat jammed shut the surplus has nowhere to go, so the rail pressure climbs well above spec."]
  ]
};

/* ═══════════════════════════════════════════════════════════════════
   PHYSICS MODEL — pure, named functions.
   Simplified physical trends, not a bench lookup table.
   ═══════════════════════════════════════════════════════════════════ */

function clampN(x, a, b) {
  if (!Number.isFinite(x)) return a;
  return x < a ? a : (x > b ? b : x);
}
const num = (x, d) => (Number.isFinite(x) ? x : d);

/* ── named constants ─────────────────────────────────────────────── */
const V_NOM        = 13.5;   /* V, nominal supply with the alternator charging   */
const V_CUTIN      = 6.0;    /* V, below this the pump motor will not turn       */
const FLOW_NOM     = 120;    /* L/h, free flow at nominal voltage                */
const REG_SET      = 3.5;    /* bar, healthy regulator set pressure (wide-open throttle) */
const VAC_DROP     = 0.45;   /* bar, manifold vacuum at idle lowers the set pressure     */
const DEMAND_IDLE  = 4;      /* L/h, idle consumption                            */
const DEMAND_MAX   = 90;     /* L/h, extra at full load + redline                */
const TANK_LITRES  = 50;     /* L, tank capacity (for the level drain rate)      */
const TAU_FUELT    = 60;     /* s, fuel temperature time constant                */
const TAU_LEVEL    = 2.0;    /* s, level slosh / settle time constant            */
const VAPOUR_C     = 65;     /* °C, fuel temperature where vapour lock is a risk */
const FILT_NORMAL  = 0.08;   /* fraction of flow lost to a healthy filter        */
const FILT_CLOGGED = 0.72;   /* fraction lost with a clogged filter              */

/* Pump free-flow (L/h). Direction: more volts -> faster motor -> more
   flow; more filter restriction -> less. A dead relay gives zero. */
function pumpFlowLph(volts, filtRestriction, fault) {
  const V = clampN(num(volts, V_NOM), 0, 15);
  const vN = clampN((V - V_CUTIN) / (V_NOM - V_CUTIN), 0, 1.20);
  let f = FLOW_NOM * vN;
  f *= (1 - 0.65 * clampN(num(filtRestriction, 0), 0, 1));
  if (fault === 'relay') f = 0;
  if (fault === 'weak')  f *= 0.45;
  if (fault === 'vapour') f *= 0.30;
  return clampN(f, 0, 200);
}

/* Engine fuel demand (L/h). Direction: more load, more rpm -> more. */
function fuelDemandLph(load, rpm) {
  const L = clampN(num(load, 0), 0, 1);
  const n = clampN((num(rpm, 800) - 800) / 5200, 0, 1);
  return DEMAND_IDLE + DEMAND_MAX * L * (0.50 + 0.50 * n);
}

/* Rail pressure (bar). The regulator holds its setting while the pump
   can supply at least the engine demand; below that the rail sags
   proportionally. The set pressure is vacuum-referenced: at idle the
   manifold vacuum pulls the diaphragm open a little more, so the rail
   sits about VAC_DROP lower than at full load (the injector sees a
   constant pressure difference). A stuck regulator scales the curve. */
function railPressureBar(supplyLph, demandLph, fault, load) {
  const s = Math.max(0, num(supplyLph, 0));
  const d = Math.max(1, num(demandLph, 1));
  if (s < 0.5) return 0;
  const ratio = clampN(s / d, 0, 1.30);
  const setP = REG_SET - VAC_DROP * (1 - clampN(num(load, 1), 0, 1));
  let k = 1.0;
  if (fault === 'reghigh') k = 1.55;
  if (fault === 'reglow')  k = 0.45;
  return clampN(setP * k * Math.min(1, ratio), 0, 8);
}

/* Pump current (A). Direction: more flow -> more torque -> more
   current; lower supply voltage -> more current for the same power;
   a weak pump draws noticeably less. */
function pumpCurrentA(volts, flowLph, fault) {
  if (fault === 'relay') return 0;
  const base = 3.0 + 5.5 * clampN(num(flowLph, 0) / FLOW_NOM, 0, 1.2);
  const vDrop = clampN((V_NOM - clampN(num(volts, V_NOM), 6, 15)) / V_NOM, 0, 0.6);
  let i = base * (1 + 0.8 * vDrop);
  if (fault === 'weak')   i *= 0.60;
  if (fault === 'vapour') i *= 0.55;
  return clampN(i, 0, 20);
}

/* Fuel temperature the tank settles at. Direction: more load (more
   return heat) and a lower tank level (less thermal mass) -> hotter. */
function fuelTempTarget(load, level, ambient) {
  const L   = clampN(num(load, 0), 0, 1);
  const lvl = clampN(num(level, 1), 0, 1);
  const amb = clampN(num(ambient, 25), -10, 50);
  const low = clampN((0.50 - lvl) / 0.50, 0, 1);
  return 28 + 0.20 * amb + 15 * L + 40 * low;
}

const FAULT_INFO = {
  none:    { label: 'None (healthy)',               warn: '' },
  weak:    { label: 'Weak pump (worn / low voltage)', warn: 'The pump cannot deliver its rated flow. Supply falls below engine demand under load, so rail pressure sags and the mixture goes lean. Diagnostic: P0087 fuel rail pressure too low.' },
  filter:  { label: 'Clogged filter / sock',        warn: 'The filter is restricted. Flow is throttled, pressure drop across the filter is high and the rail starves at high demand. Diagnostic: P0087 / P0088 at high load only.' },
  reghigh: { label: 'Stuck regulator (high)',       warn: 'The regulator is jammed closed so it cannot return surplus fuel. Rail pressure sits well above spec: rich running, black smoke, fuel smell. Diagnostic: P0088.' },
  reglow:  { label: 'Stuck regulator (low)',        warn: 'The regulator is stuck open and bypasses fuel straight back to the tank. Rail pressure stays low at all loads. Diagnostic: P0087 / P0171 lean bank.' },
  relay:   { label: 'Failed relay / no prime',      warn: 'The pump never runs - no prime on key-on. The engine cranks but will not start. Check fuse, relay and voltage at the pump connector.' },
  vapour:  { label: 'Vapour lock (hot fuel)',       warn: 'Fuel is hot enough at this tank level that light ends are vaporising. The pump is moving gas, not liquid, so flow and pressure collapse. Diagnostic: hot-restart lean stumble.' }
};

/* ═══════════════════════════════════════════════════════════════════
   EXTRA CONTROLS (built here; the runtime only provides one slider)
   ═══════════════════════════════════════════════════════════════════ */
const S = {
  volts: 13.5,
  ambient: 25,
  fault: 'none',
  speed: 1
};



/* ── simulation state (module level so Reset can reach it) ───────── */
/* Phase 7a: the history lives in the Monitor (CFG.traces); the module only hands over one normalised sample
   per ~140 ms while the sim runs (0..100 % of each old axis range) and the current warning sentence. */
let traceSample = null, traceClear = false, warnText = '';
const traceN = (v, lo, hi) => Math.round(clampN((v - lo) / (hi - lo), 0, 1) * 1000) / 10;
const sim = {
  level: 0.85,
  Tfuel: 30,
  lastT: -1
};

function resetModel() {
  sim.level = 0.85;
  sim.Tfuel = 30;
  sim.lastT = -1;
  traceClear = true;                  /* Monitor trace is cleared on the next update */
}
function resetAll() {
  S.volts = 13.5;
  S.ambient = 25;
  S.fault = 'none';
  S.speed = 1;
  resetModel();
  controls.resetAll();                 /* every axis back to its default (store -> onChange -> S) */
}

/* ═══════════════════════════════════════════════════════════════════
   MODULE SCENE (per-module 3D parts)
   ═══════════════════════════════════════════════════════════════════ */
function build(H){
 const { box, cyl, cylX, cylZ, sph, tor, mat, glass, pipe, stream, lc, root, THREE, lowEnd, Parts } = H;
 const V = (a) => new THREE.Vector3(a[0], a[1], a[2]);

 /* ── materials ────────────────────────────────────────────────── */
 const steel     = mat(0x8a93a5, .80, .30);
 const steelDark = mat(0x3d4555, .70, .40);
 const frameMat  = mat(0x4b5563, .55, .55);
 const hose      = mat(0x1f2937, .20, .80);
 const brass     = mat(0xc9a24a, .90, .30);
 const copper    = mat(0xd97706, .80, .35);
 const rubber    = mat(0x111827, .10, .90);
 const sockMat   = mat(0xd9cfae, .05, .95);
 const cableRed  = mat(0xdc2626, .30, .60);
 const cableBlk  = mat(0x0f172a, .30, .60);

 /* ── helpers ──────────────────────────────────────────────────── */
 /* cylinder between two points (struts, arms) */
 const rod = (a, b, r, m, seg = 12) => {
   const A = V(a), B = V(b), d = B.clone().sub(A);
   const o = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), seg), m);
   o.position.copy(A).addScaledVector(d, 0.5);
   o.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
   o.castShadow = !lowEnd; root.add(o); return o;
 };
 /* polyline with rounded corners, so hoses and the particle streams that ride inside them share one path */
 const rounded = (pts, r = 0.16, steps = 5) => {
   const out = [pts[0]];
   for (let i = 1; i < pts.length - 1; i++) {
     const p0 = V(pts[i - 1]), p1 = V(pts[i]), p2 = V(pts[i + 1]);
     const a = p0.clone().sub(p1), b = p2.clone().sub(p1);
     const rr = Math.min(r, a.length() / 2, b.length() / 2);
     const pa = p1.clone().addScaledVector(a.normalize(), rr);
     const pb = p1.clone().addScaledVector(b.normalize(), rr);
     for (let s = 0; s <= steps; s++) {
       const t = s / steps, u = 1 - t;
       out.push([u * u * pa.x + 2 * u * t * p1.x + t * t * pb.x,
                 u * u * pa.y + 2 * u * t * p1.y + t * t * pb.y,
                 u * u * pa.z + 2 * u * t * p1.z + t * t * pb.z]);
     }
   }
   out.push(pts[pts.length - 1]);
   return out;
 };

 /* ── layout constants (world units) ───────────────────────────── */
 const X0 = -0.95;                     /* pump module axis                       */
 const RAIL_X = 4.1, RAIL_Y = -0.2;    /* fuel rail axis (runs along Z)          */
 const FILT_X = 2.75, FILT_Y = -0.42;  /* fuel filter axis (runs along X)        */
 const INJ_Z = [-0.8, -0.27, 0.27, 0.8];

 /* ═══ CHASSIS: everything below is bolted to this ═════════════════ */
 [-1, 1].forEach(s => box(7.8, 0.22, 0.14, frameMat, 1.5, -0.93, s * 1.5));          /* side rails            */
 [-1.0, 1.0, FILT_X, RAIL_X].forEach(x => box(0.2, 0.2, 3.0, frameMat, x, -0.88, 0)); /* cross-members         */
 box(3.5, 0.08, 2.6, steelDark, 0, -0.74, 0);                                         /* tank cradle plate     */

 /* ═══ TANK: shell, baffles, straps, filler neck ═══════════════════ */
 box(3.4, 1.4, 2.2, glass(0x94a3b8, .16), 0, 0, 0);
 const baffleMat = mat(0x64748b, .5, .5);
 [0.6, 1.25].forEach(x => box(0.05, 1.2, 2.2, baffleMat, x, 0.1, 0));                 /* slosh baffles: gap along the floor lets fuel cross */
 [-1.2, 1.2].forEach(x => {                                                           /* straps: over the top, down both sides, into the cradle */
   box(0.12, 0.04, 2.3, steel, x, 0.72, 0);
   [-1, 1].forEach(s => box(0.12, 1.5, 0.04, steel, x, -0.03, s * 1.12));
 });
 const fuelMat = glass(0xf59e0b, .46);
 const fuel = box(3.3, 1.3, 2.1, fuelMat, 0, 0, 0);

 /* filler neck + cap (back right corner of the tank) */
 rod([1.40, 0.62, -0.78], [1.95, 1.38, -1.02], 0.16, steelDark, 16);
 const cap = rod([1.93, 1.34, -1.01], [2.04, 1.49, -1.06], 0.20, mat(0x1f2937, .3, .6), 20);

 /* ═══ PUMP MODULE: hangs from the flange, rests in the swirl pot ═══ */
 /* flange + bolts + connector + two nipples */
 cyl(.46, .46, .07, steelDark, X0, 0.735, 0);
 for (let i = 0; i < 8; i++) {
   const a = i / 8 * Math.PI * 2;
   cyl(.03, .03, .04, steel, X0 + Math.cos(a) * .38, 0.79, Math.sin(a) * .38);
 }
 box(0.22, 0.16, 0.16, steelDark, X0 - 0.28, 0.85, 0);                 /* electrical connector            */
 cyl(.06, .06, .22, steel, X0, 0.88, 0);                               /* pressure outlet nipple (to filter) */
 cyl(.055, .055, .20, steel, X0 + 0.24, 0.87, 0.22);                   /* return inlet nipple (from regulator) */

 /* swirl pot (reservoir cup) on the tank floor, kept full by the return jet */
 cyl(.5, .5, .38, glass(0x93c5fd, .18), X0, -0.49, 0, undefined, 40, true);
 cyl(.5, .5, .03, steelDark, X0, -0.685, 0);                           /* cup floor                       */
 tor(.5, .02, steelDark, X0, -0.30, 0).rotation.x = Math.PI / 2;       /* cup rim                         */

 /* guide struts: flange -> rim of the cup, and return jet tube into the cup */
 [[.32, .32], [-.32, -.32]].forEach(([dx, dz]) => rod([X0 + dx, 0.72, dz], [X0 + dx, -0.32, dz], .028, steel));
 rod([X0 + 0.24, 0.72, 0.22], [X0 + 0.24, -0.46, 0.22], .028, hose);

 /* sock strainer + inlet nozzle */
 cyl(.34, .34, .06, sockMat, X0, -0.63, 0);
 cyl(.09, .09, .08, steelDark, X0, -0.59, 0);

 /* pump stage (translucent, impeller visible) and motor (translucent, armature visible) */
 cyl(.2, .2, .22, glass(0x64748b, .40), X0, -0.46, 0);
 const imp = new THREE.Group(); imp.position.set(X0, -0.46, 0); root.add(imp);
 for (let i = 0; i < 8; i++) {
   const v = box(.34, .16, .035, mat(0xf97316, .4, .4), 0, 0, 0, imp);
   v.rotation.y = i * Math.PI / 8;
 }
 cyl(.2, .2, .36, glass(0x334155, .38), X0, -0.17, 0);
 tor(.205, .02, mat(0x8b5cf6, .5, .4), X0, -0.17, 0).rotation.x = Math.PI / 2;
 const arm = new THREE.Group(); arm.position.set(X0, -0.17, 0); root.add(arm);
 cyl(.11, .11, .30, copper, 0, 0, 0, arm);                              /* armature windings */
 box(.04, .31, .26, mat(0xf1f5f9, .2, .5), 0, 0, 0, arm);              /* marker, so the spin is visible */
 cyl(.21, .21, .06, steelDark, X0, 0.04, 0);                           /* top cap                          */
 cyl(.05, .05, .63, steel, X0, 0.385, 0);                              /* pressure tube, pump -> flange    */
 cyl(.075, .075, .12, brass, X0, 0.26, 0);                             /* check valve (holds residual pressure) */
 /* power leads: connector -> pump cap */
 pipe([[X0 - 0.28, 0.8, 0.03], [X0 - 0.28, 0.3, 0.03], [X0 - 0.14, 0.07, 0.03]], .018, cableRed);
 pipe([[X0 - 0.28, 0.8, -0.03], [X0 - 0.28, 0.3, -0.03], [X0 - 0.14, 0.07, -0.03]], .018, cableBlk);

 /* fuel level sender: bracket from the flange, pivot, arm and float that rides the surface */
 const PIV = [X0 + 0.62, 0.12, -0.10];
 box(0.30, 0.05, 0.05, steel, X0 + 0.50, 0.72, PIV[2]);
 rod([PIV[0], 0.72, PIV[2]], [PIV[0], PIV[1], PIV[2]], .022, steel);
 const piv = new THREE.Group(); piv.position.set(...PIV); root.add(piv);
 sph(.04, brass, 0, 0, 0, piv);
 const ARM_L = 0.70;
 box(ARM_L, 0.03, 0.03, steel, ARM_L / 2, 0, 0, piv);
 const floatMesh = cyl(.1, .1, .09, mat(0xf8fafc, .1, .6), ARM_L, 0, 0, piv);

 /* ═══ FILTER (clamped on a cross-member) ══════════════════════════ */
 const filtMat = mat(0x38bdf8, .50, .40, { emissive: 0x000000, emissiveIntensity: 0 });
 box(0.7, 0.10, 0.34, steelDark, FILT_X, -0.73, 0);
 cylX(.26, .26, .90, filtMat, FILT_X, FILT_Y, 0);
 tor(.27, .02, steel, FILT_X, FILT_Y, 0).rotation.y = Math.PI / 2;
 [-1, 1].forEach(s => {
   cylX(.30, .30, .06, steelDark, FILT_X + s * 0.45, FILT_Y, 0);
   cylX(.07, .07, .16, steel, FILT_X + s * 0.53, FILT_Y, 0);
 });

 /* ═══ FUEL RAIL, INJECTORS, GAUGE, INTAKE HEAD ════════════════════ */
 const railMat = mat(0x9aa3b2, .85, .30, { emissive: 0x000000, emissiveIntensity: 0 });
 cylZ(.15, .15, 2.30, railMat, RAIL_X, RAIL_Y, 0);
 [-1, 1].forEach(s => cylZ(.17, .17, .06, steel, RAIL_X, RAIL_Y, s * 1.18));
 cylX(.08, .08, .12, steel, RAIL_X - 0.15, RAIL_Y, 0);                 /* inlet banjo */

 box(1.3, 0.6, 2.6, glass(0x64748b, .30), RAIL_X, -1.0, 0);            /* intake head (cut-away) */
 INJ_Z.forEach(z => {
   cyl(.075, .075, .35, steelDark, RAIL_X, -0.525, z);                 /* injector body */
   cyl(.04, .04, .10, brass, RAIL_X, -0.74, z);                        /* nozzle, in the port */
   box(0.10, 0.08, 0.10, rubber, RAIL_X + 0.1, -0.45, z);              /* connector */
   cylX(.13, .13, 1.30, steel, RAIL_X, -1.05, z);                      /* intake runner */
 });
 cylZ(.04, .04, .14, steel, RAIL_X, -0.75, 1.37);                      /* vacuum port on the head */

 /* rail test port + pressure gauge */
 cyl(.05, .05, .24, steel, RAIL_X, 0.07, -0.55);
 const gauge = new THREE.Group(); gauge.position.set(RAIL_X, 0.46, -0.55); gauge.rotation.y = 0.6; root.add(gauge);
 cylZ(.27, .27, .10, steelDark, 0, 0, 0, gauge);
 cylZ(.235, .235, .02, mat(0xe8edf5, .05, .8), 0, 0, 0.055, gauge);
 tor(.255, .02, steel, 0, 0, 0.05, gauge);
 const pToPhi = (p) => (135 - 270 * p / 6 + 90) * Math.PI / 180;       /* bar -> torus angle */
 [[0, 1.8, 0xef4444], [1.8, 2.6, 0xf59e0b], [2.6, 4.6, 0x22c55e], [4.6, 6, 0xef4444]].forEach(([p1, p2, col]) => {
   const g = new THREE.Mesh(new THREE.TorusGeometry(.185, .016, 6, 24, pToPhi(p1) - pToPhi(p2)), mat(col, .1, .6));
   g.rotation.z = pToPhi(p2); g.position.z = 0.068; gauge.add(g);
 });
 for (let i = 0; i <= 6; i++) {
   const a = pToPhi(i);
   const t = box(.012, .05, .012, mat(0x0f172a, .1, .8), Math.cos(a) * .15, Math.sin(a) * .15, 0.068, gauge);
   t.rotation.z = a - Math.PI / 2;
 }
 const needle = new THREE.Group(); needle.position.z = 0.078; gauge.add(needle);
 box(.02, .20, .01, mat(0xdc2626, .2, .5), 0, .085, 0, needle);
 cylZ(.03, .03, .02, steel, 0, 0, 0, needle);

 /* ═══ PRESSURE REGULATOR (diaphragm + spring + seat), on the rail end ═ */
 const regMat = mat(0xa3e635, .50, .40, { emissive: 0x000000, emissiveIntensity: 0 });
 const regGlass = glass(0xa3e635, .26);
 const regG = new THREE.Group(); regG.position.set(RAIL_X, RAIL_Y, 1.46); root.add(regG);
 cylZ(.24, .24, .44, regGlass, 0, 0, 0, regG);                          /* shorter than the collars so no faces coincide */
 cylZ(.245, .245, .07, regMat, 0, 0, -0.215, regG);                    /* fuel-side collar (touches the rail cap) */
 cylZ(.245, .245, .07, regMat, 0, 0,  0.215, regG);                    /* vacuum-side cover */
 tor(.07, .018, steel, 0, 0, -0.17, regG);                              /* valve seat */
 cyl(.06, .06, .14, regMat, 0, .31, -0.06, regG);                       /* return nipple */
 cylZ(.04, .04, .16, steel, 0, 0, .30, regG);                           /* vacuum nipple */
 const regMove = new THREE.Group(); regG.add(regMove);
 cylZ(.2, .2, .02, mat(0x1f2937, .2, .8), 0, 0, .05, regMove);          /* diaphragm */
 cylZ(.018, .018, .20, steel, 0, 0, -.06, regMove);                     /* stem */
 sph(.055, brass, 0, 0, -.14, regMove);                                 /* valve ball */
 const spring = Parts.coilSpring({ radius: .1, length: .14, turns: 5, wire: .014, mat: steel, axis: 'z', centered: true });
 spring.position.z = .13; regG.add(spring);

 /* ═══ PUMP RELAY, on the frame rail ═══════════════════════════════ */
 box(0.34, 0.30, 0.26, steelDark, -2.0, -0.67, 1.5);
 const ledMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, emissive: 0x22c55e, emissiveIntensity: 1 });
 sph(.035, ledMat, -2.0, -0.50, 1.58);

 /* ═══ HOSES + PARTICLE STREAMS (share one path each) ══════════════ */
 const supplyPts = rounded([[X0, .95, 0], [X0, 1.2, 0], [2.0, 1.2, 0], [2.0, FILT_Y, 0], [FILT_X - 0.61, FILT_Y, 0]], .22);
 const toRailPts = rounded([[FILT_X + 0.61, FILT_Y, 0], [3.6, FILT_Y, 0], [3.6, RAIL_Y, 0], [RAIL_X - 0.21, RAIL_Y, 0]], .12);
 const returnPts = rounded([[RAIL_X, .18, 1.40], [RAIL_X, 1.0, 1.40], [X0 + .24, 1.0, 1.40], [X0 + .24, 1.0, .22], [X0 + .24, .97, .22]], .22);
 const vacPts    = rounded([[RAIL_X, RAIL_Y, 1.86], [RAIL_X, RAIL_Y, 2.0], [RAIL_X, -0.75, 2.0], [RAIL_X, -0.75, 1.44]], .14);
 const cablePts  = rounded([[-2.0, -0.52, 1.5], [-2.0, .95, 1.5], [-2.0, .95, 0], [X0 - .28, .95, 0], [X0 - .28, .92, 0]], .18);
 pipe(supplyPts, .07, hose);
 pipe(toRailPts, .07, hose);
 pipe(returnPts, .06, hose);
 pipe(vacPts, .03, mat(0x334155, .1, .8));
 pipe(cablePts, .03, cableRed);

 const nA = lowEnd ? 10 : 18, nB = lowEnd ? 8 : 14, nC = lowEnd ? 8 : 12, nV = lowEnd ? 6 : 10;
 const sP = stream([[X0, -0.62, 0], [X0, -0.4, 0], [X0, 0.7, 0], [X0, 0.95, 0]], lowEnd ? 5 : 8, 0xf59e0b, .10);   /* sock -> pump -> outlet */
 const sA = stream(supplyPts, nA, 0xf59e0b, .11);
 const sB = stream(toRailPts, nB, 0xf59e0b, .11);
 const sC = stream(returnPts, nC, 0xf59e0b, .09);
 const sJ = stream([[X0 + .24, .72, .22], [X0 + .24, -0.1, .22], [X0 + .24, -0.44, .22]], lowEnd ? 4 : 6, 0xf59e0b, .08);  /* jet tube refills the cup */
 const vap = stream(supplyPts, nV, 0xf1f5f9, .10);
 const cur = stream(cablePts, lowEnd ? 5 : 8, 0xfde68a, .07);
 const inj = INJ_Z.map(z => stream([[RAIL_X, -0.80, z], [RAIL_X, -1.02, z]], lowEnd ? 4 : 6, 0xf59e0b, .09));
 const streams = [sP, sA, sB, sC, sJ, vap, cur, ...inj];

 let ang = 0, gaugeP = null, lightMode = null, domLast = 0;
 const tmpCol = new THREE.Color();
 const white = new THREE.Color(0xf1f5f9), slate = new THREE.Color(0x64748b);

 return {
  labels: [
    ['Fuel tank', [0.6, 0.35, 1.1]],
    ['Filler neck & cap', [2.05, 1.62, -1.06]],
    ['Pump module flange', [X0 - 0.15, 0.95, 0.25]],
    ['In-tank pump', [X0, -0.17, 0.25]],
    ['Sock strainer', [X0 - 0.25, -0.64, 0.35]],
    ['Level float', [PIV[0], 0.2, PIV[2]]],
    ['Fuel filter', [FILT_X, -0.1, 0]],
    ['Fuel rail & injectors', [RAIL_X, -0.05, 0.85]],
    ['Pressure gauge', [RAIL_X, 0.82, -0.55]],
    ['Pressure regulator', [RAIL_X + 0.1, 0.35, 1.46]],
    ['Return line', [1.2, 1.1, 1.40]],
    ['Pump relay', [-2.0, -0.40, 1.5]]
  ],
  update(c){
   /* ── 1. inputs ─────────────────────────────────────────────── */
   const dt    = Math.max(0, num(c.dt, 0)) * S.speed;
   const k     = clampN(c.k, 0, 1);
   const rpm   = 800 + 5200 * k;
   const fault = S.fault;

   if (sim.lastT >= 0 && c.t + 1e-4 < sim.lastT) resetModel();
   sim.lastT = c.t;

   /* ── 2. filter restriction ────────────────────────────────── */
   const filt = (fault === 'filter') ? FILT_CLOGGED : FILT_NORMAL;

   /* ── 3. flow, demand, pressure ────────────────────────────── */
   const supply = pumpFlowLph(S.volts, filt, fault);
   const demand = fuelDemandLph(k, rpm);
   const press  = railPressureBar(supply, demand, fault, k);
   const cur_A  = pumpCurrentA(S.volts, supply, fault);

   /* ── 4. tank level state ──────────────────────────────────── */
   if (dt > 0) {
     const drain = demand / 3600 / TANK_LITRES;    /* fraction per second */
     sim.level -= drain * dt * 12;                 /* x12 so the demo is watchable */
   }
   sim.level = clampN(sim.level, 0.03, 1.0);

   /* ── 5. fuel temperature state ────────────────────────────── */
   const Ttgt = fuelTempTarget(k, sim.level, S.ambient);
   if (dt > 0) sim.Tfuel += (Ttgt - sim.Tfuel) * (1 - Math.exp(-dt / TAU_FUELT));
   sim.Tfuel = clampN(sim.Tfuel, -20, 120);

   const vapouring = (sim.Tfuel > VAPOUR_C && sim.level < 0.30) || fault === 'vapour';

   /* ── 6. status text ───────────────────────────────────────── */
   let stateTxt;
   if (fault === 'relay' || supply < 0.5)  stateTxt = 'NO PRIME';
   else if (press < 1.8)                   stateTxt = 'LEAN / LOW PRESS';
   else if (press > 4.6)                   stateTxt = 'OVER-PRESSURE';
   else if (vapouring)                     stateTxt = 'VAPOUR RISK';
   else if (sim.level < 0.12)              stateTxt = 'LOW FUEL';
   else                                    stateTxt = 'Normal';

   /* ── 7. 3D visuals ────────────────────────────────────────── */
   const light = document.documentElement.classList.contains('light-theme');
   if (light !== lightMode) {            /* additive glow is invisible on the light theme: use normal blending there */
     lightMode = light;
     streams.forEach(s => { s.mat.blending = light ? THREE.NormalBlending : THREE.AdditiveBlending; s.mat.needsUpdate = true; });
   }

   const lvl = clampN(sim.level, 0.05, 1);
   fuel.scale.y = lvl;
   fuel.position.y = -0.65 + 1.3 * lvl / 2;
   fuelMat.color.copy(lc(0xf59e0b, 0xb45309, clampN((sim.Tfuel - 20) / 70, 0, 1)));

   /* level sender: the arm swings so the float always sits on the fuel surface */
   const surfY = -0.65 + 1.3 * lvl;
   const alpha = Math.asin(clampN((surfY - PIV[1]) / ARM_L, -1, 1));
   piv.rotation.z = alpha;
   floatMesh.rotation.z = -alpha;

   /* pump: impeller + armature spin with the supply voltage; a dead relay stops them */
   const running = (fault !== 'relay') && supply > 0.5;
   const motorRpm = running ? (S.volts / V_NOM) * 3000 : 0;
   ang += (motorRpm / 60) * Math.PI * 2 * dt;
   imp.rotation.y = ang;
   arm.rotation.y = ang;

   /* relay LED: green = pump powered, red = relay failed */
   ledMat.color.setHex(fault === 'relay' ? 0xef4444 : (S.volts < 8 ? 0xf59e0b : 0x22c55e));
   ledMat.emissive.copy(ledMat.color);
   ledMat.emissiveIntensity = fault === 'relay' ? 0.5 + 0.5 * Math.abs(Math.sin(c.t * 5)) : 1;

   /* filter / regulator / rail feedback */
   filtMat.emissive.setHex(fault === 'filter' ? 0xef4444 : 0x000000);
   filtMat.emissiveIntensity = fault === 'filter' ? 0.45 + 0.35 * Math.abs(Math.sin(c.t * 3.5)) : 0;
   filtMat.color.copy(lc(0x38bdf8, 0x1a1410, fault === 'filter' ? 0.75 : 0));

   /* regulator internals: the valve opens by the surplus the pump delivers; stuck-closed / stuck-open override it */
   const surplus = clampN(1 - demand / Math.max(1, supply), 0, 1);
   const regOpen = !running ? 0 : (fault === 'reghigh' ? 0 : (fault === 'reglow' ? 1 : surplus));
   const dz = regOpen * 0.06;
   regMove.position.z = dz;
   spring.position.z = 0.13 + dz / 2;
   spring.scale.z = 1 - dz / 0.14;

   if (fault === 'reghigh' || fault === 'reglow') {
     regMat.emissive.setHex(0xef4444);
     regMat.emissiveIntensity = 0.45 + 0.35 * Math.abs(Math.sin(c.t * 4));
     regMat.color.copy(fault === 'reghigh' ? lc(0xa3e635, 0xef4444, 0.8) : lc(0xa3e635, 0x1f2937, 0.8));
   } else {
     regMat.emissive.setHex(0x000000);
     regMat.emissiveIntensity = 0;
     regMat.color.setHex(0xa3e635);
   }

   const railGlow = clampN((press - 2.6) / 2.0, 0, 1);
   railMat.emissive.copy(lc(0x000000, 0xff3a00, railGlow * 0.7));
   railMat.emissiveIntensity = railGlow * 0.7;
   railMat.color.copy(lc(0x9aa3b2, 0xef4444, press < 1.8 ? 0.7 : 0));

   /* gauge needle follows the rail pressure (smoothed) */
   if (gaugeP === null) gaugeP = press;
   gaugeP += (press - gaugeP) * Math.min(1, Math.max(dt, 0.016) * 9);
   needle.rotation.z = (135 - 270 * clampN(gaugeP, 0, 6) / 6) * Math.PI / 180;

   /* streams */
   const flowN = clampN(supply / FLOW_NOM, 0, 1.2);
   const spd   = 0.06 + 0.42 * flowN;
   const dens  = running ? (0.18 + 0.82 * flowN) : 0;
   tmpCol.copy(lc(0xf59e0b, 0xb45309, clampN((sim.Tfuel - 20) / 70, 0, 1)));
   if (vapouring) tmpCol.lerp(light ? slate : white, 0.65);
   else if (light) tmpCol.multiplyScalar(0.8);

   [sP, sA, sB, sJ].forEach(s => { s.mat.color.copy(tmpCol); });
   sP.update(c.t, spd, dens);
   sA.update(c.t, spd, dens);
   sB.update(c.t, spd, dens);
   /* what comes back through the regulator: nothing when it is stuck closed, everything when stuck open */
   const retFrac = fault === 'reghigh' ? 0 : (fault === 'reglow' ? 1 : surplus);
   const retDens = running ? clampN(0.10 + 0.9 * retFrac, 0, 1) * (fault === 'reghigh' ? 0 : 1) : 0;
   sC.update(c.t, 0.06 + 0.35 * flowN, retDens);
   sC.mat.color.copy(tmpCol);
   sJ.update(c.t, 0.06 + 0.25 * flowN, retDens);
   vap.update(c.t, 0.30, vapouring ? 0.85 : 0);
   vap.mat.color.copy(light ? slate : white);

   const injDens = running ? clampN(0.25 + 0.75 * k, 0, 1) : 0;
   for (let i = 0; i < inj.length; i++) {
     inj[i].update(c.t, 0.55 + 0.4 * k, injDens);
     inj[i].mat.color.copy(tmpCol);
   }
   cur.update(c.t, 0.12 + 0.55 * clampN(cur_A / 12, 0, 1), cur_A > 0.5 ? 0.9 : 0);
   cur.mat.color.setHex(light ? 0xb45309 : 0xfde68a);

   /* ── 8. throttled DOM work (trace + warning) ──────────────── */
   const now = performance.now();
   if (now - domLast > 140) {
     domLast = now;
     if (dt > 0) traceSample = [traceN(press, 0, 6), traceN(sim.Tfuel, 0, 110)];
     let warn = FAULT_INFO[fault] ? FAULT_INFO[fault].warn : '';
     if (!warn) {
       if (supply < 0.5) {
         warn = 'No fuel supply - the pump is not running. Check the fuse, relay and voltage at the pump connector.';
       } else if (press < 1.8) {
         warn = 'Rail pressure ' + press.toFixed(2) + ' bar - supply (' + supply.toFixed(0) + ' L/h) is below engine demand (' + demand.toFixed(0) + ' L/h). The engine will run lean.';
       } else if (press > 4.6) {
         warn = 'Rail pressure ' + press.toFixed(2) + ' bar - well above spec. Expect rich running, black smoke and hard hot starting.';
       } else if (vapouring) {
         warn = 'Fuel at ' + sim.Tfuel.toFixed(0) + ' \u00B0C with a ' + (sim.level * 100).toFixed(0) + ' % tank - vapour lock risk. Keep the tank above a quarter.';
       } else if (sim.level < 0.15) {
         warn = 'Tank level at ' + (sim.level * 100).toFixed(0) + ' % - the pump relies on fuel for cooling. Refuel before it runs dry.';
       }
     }
     warnText = warn;
   }

   /* ── 9. readouts ──────────────────────────────────────────── */
   const pState   = press < 1.8 ? 'crit' : (press < 2.6 ? 'warn' : (press > 4.6 ? 'crit' : 'ok'));
   const supState = supply < demand ? 'warn' : 'ok';
   const curState = cur_A > 8.5 ? 'warn' : (cur_A < 1 ? 'crit' : 'ok');
   const lvlState = sim.level < 0.15 ? 'crit' : (sim.level < 0.35 ? 'warn' : 'ok');
   const tState   = sim.Tfuel > VAPOUR_C ? 'crit' : (sim.Tfuel > 50 ? 'warn' : 'ok');
   const fState   = filt > 0.4 ? 'warn' : 'ok';
   const stState  = (press < 1.8 || supply < 0.5) ? 'crit'
                  : (press > 4.6 || vapouring || sim.level < 0.15) ? 'warn'
                  : 'ok';

   let tr;
   if (traceClear) { traceClear = false; traceSample = null; tr = { hist: null }; }
   else if (traceSample) { tr = { hist: traceSample }; traceSample = null; }

   return {
     big: press.toFixed(2),
     unit: ' bar',
     bar: clampN(press / 5 * 100, 0, 100),
     rows: {
       supply: supply.toFixed(0) + ' L/h',
       cur:    cur_A.toFixed(1) + ' A'
     },
     ro: {
       press:  [press.toFixed(2) + ' bar', pState],
       supply: [supply.toFixed(0) + ' L/h', supState],
       demand: [demand.toFixed(0) + ' L/h', ''],
       cur:    [cur_A.toFixed(1) + ' A', curState],
       lvl:    [(sim.level * 100).toFixed(0) + ' %', lvlState],
       temp:   [sim.Tfuel.toFixed(0) + ' \u00B0C', tState],
       filt:   ['-' + (filt * 100).toFixed(0) + ' % flow', fState],
       state:  [stateTxt, stState]
     },
     status: [warnText || stateTxt, true, warnText ? 'warn' : ''],
      traces: tr,
     ctl: Math.round(k * 100) + ' % load'
   };
  }
 };
}

/* Phase 6: every option / action lives in the dock (controls.js), nothing interactive is left in the panel.
   'Time scale' is the module's own physics time-compression (thermal warm-up); the menu's Sim speed is separate. */
CFG.options = [
  { id: "fault", type: 'choice', layout: 'select', label: "Fault injection", options: Object.keys(FAULT_INFO).map(id => ({ id, label: FAULT_INFO[id].label })), def: 'none',
    onChange: (id) => { S.fault = id; } },
  { id: 'timeScale', type: 'choice', layout: 'segmented', label: 'Time scale', options: [{ id: '1', label: '1×' }, { id: '5', label: '5×' }, { id: '20', label: '20×' }], def: '1',
    onChange: (id) => { S.speed = Number(id) || 1; } },
  { id: "refuel", type: 'action', label: "Refuel",
    onAction: () => { sim.level = 1.0; } }
];
CFG.onReset = resetAll;      /* the dock Reset runs the module reset (model + every control) */
/* Phase 7a: the old history canvas is a Monitor trace. Both series are drawn as 0..100 % of their old axis ranges. */
CFG.traces = [{ id: 'hist', label: 'Rail pressure and fuel temperature history (% of full scale)', min: 0, max: 100, length: 150,
  series: [
    { id: 'a', label: 'Rail bar', color: 'var(--accent)' },
    { id: 'b', label: 'Fuel \u00B0C', color: 'var(--warn)' }
  ] }];
runGuidedModule(CFG, build);
</script>
</body>
</html>
