<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d13">
<title>4-Stroke Engine — Auto Lab</title>
<link rel="stylesheet" href="app.css">
<style>
  /* ═══════════════════════════════════════════════════════════════════
     Engine module — instrument panel + crank widget interiors.
     All chrome (panel, chip, toolbar, widget container/caption) is
     provided by app.css. Only the interiors of custom pieces live here.
     ═══════════════════════════════════════════════════════════════════ */

  /* ── Panel body: live mechanism readout ── */
  .mechanism-readout {
    display: flex; gap: 14px;
    margin: 10px 0 4px;
    color: var(--text-mute);
    font-size: 10.5px;
    font-family: var(--font-mono);
  }
  .mechanism-readout b { color: var(--text); font-weight: 800; }
  #cam-deg { color: var(--warn) !important; }

  /* ── Panel badge: crank-degree chip appended after badge text ── */
  .engine-crank-deg {
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 700;
    letter-spacing: .02em; margin-left: 8px;
    opacity: .78;
    transition: color var(--dur-fast) var(--ease-out);
  }

  /* ── Simplified / Advanced toggle ── */
  .view-mode { display: flex; gap: 6px; margin-top: 12px; }
  .vm-btn {
    flex: 1; padding: 8px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-dim);
    font-size: 11px; font-weight: 700;
    letter-spacing: .03em;
    cursor: pointer; font-family: inherit;
    transition: background var(--dur-fast) var(--ease-out),
                color var(--dur-fast) var(--ease-out),
                border-color var(--dur-fast) var(--ease-out),
                box-shadow var(--dur-fast) var(--ease-out);
  }
  .vm-btn:hover { background: var(--surface-3); }
  .vm-btn.active {
    background: var(--accent); color: #0b0e14;
    border-color: var(--accent);
    box-shadow: 0 0 12px color-mix(in oklch, var(--accent) 40%, transparent);
  }

  /* ── Timeline (4 stroke buttons) ── */
  .timeline {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 5px; margin: 12px 0;
  }
  .tl-btn {
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-dim);
    border-radius: 10px;
    padding: 7px 3px;
    font-size: 10.5px; font-weight: 600;
    cursor: pointer;
    transition: all var(--dur-fast) var(--ease-out);
    text-align: center; line-height: 1.25;
    font-family: inherit;
  }
  .tl-btn:hover { border-color: var(--border-hi); color: var(--text); }
  .tl-btn.active { color: #0b0e14; border-color: transparent; }
  .tl-btn .num { display: block; font-size: 14px; font-weight: 800; margin-bottom: 1px; }

  /* ── Cycle bar + scale ── */
  .cycle-bar {
    position: relative; margin-top: 10px;
    height: 6px;
    background: var(--surface-3);
    border-radius: 6px; overflow: hidden;
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease-out);
  }
  .cycle-bar:hover { background: color-mix(in oklch, var(--text) 12%, transparent); }
  #cycle-fill {
    height: 100%; width: 0%;
    background: var(--accent);
    border-radius: 6px;
    transition: background var(--dur-base) var(--ease-out);
  }
  .cycle-bar .tick {
    position: absolute; top: 0; bottom: 0; width: 1px;
    background: color-mix(in oklch, var(--text) 25%, transparent);
    pointer-events: none;
  }
  .cycle-scale {
    display: flex; justify-content: space-between;
    font-size: 10px; letter-spacing: .08em;
    color: var(--text-mute);
    margin-top: 5px; text-transform: uppercase;
  }

  /* ── Crank widget (bottom-right slot) ── */
  #crank-wheel {
    width: clamp(118px, 26vw, 174px);
    height: clamp(118px, 26vw, 174px);
    pointer-events: auto;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    filter: drop-shadow(0 10px 20px oklch(0 0 0 / .65));
  }
  #crank-wheel svg { display: block; width: 100%; height: 100%; }
  #crank-wheel.grabbing { cursor: grabbing; }
  #crank-wheel.grabbing #crank-rotor {
    filter: drop-shadow(0 0 16px color-mix(in oklch, var(--accent) 55%, transparent))
            drop-shadow(0 10px 18px oklch(0 0 0 / .7));
  }
  #crank-rotor {
    transform-origin: 50% 50%;
    transition: transform .035s linear;
    will-change: transform;
  }
  .crank-bg {
    fill: color-mix(in oklch, var(--bg) 88%, transparent);
    stroke: var(--border);
    stroke-width: 1.5;
  }
  .crank-ring { fill: none; stroke: color-mix(in oklch, var(--text) 25%, transparent); stroke-width: 8; }
  .crank-ring-hi { fill: none; stroke: color-mix(in oklch, var(--text) 65%, transparent); stroke-width: 2; opacity: .45; }
  .crank-spoke { fill: color-mix(in oklch, var(--text) 30%, transparent); }
  .crank-hub {
    fill: color-mix(in oklch, var(--bg) 78%, transparent);
    stroke: color-mix(in oklch, var(--text) 65%, transparent);
    stroke-width: 2;
  }
  .crank-marker {
    fill: var(--accent);
    filter: drop-shadow(0 0 5px color-mix(in oklch, var(--accent) 75%, transparent));
  }
  .crank-handle {
    fill: color-mix(in oklch, var(--bg) 90%, transparent);
    stroke: color-mix(in oklch, var(--text) 45%, transparent);
    stroke-width: 1.6;
  }
  .crank-handle-end {
    fill: color-mix(in oklch, var(--text) 35%, transparent);
    stroke: color-mix(in oklch, var(--text) 55%, transparent);
    stroke-width: 1.4;
  }

  /* ── Slow-mo toggle (override accent to warn colour) ── */
  #btn-slowmo.active {
    background: color-mix(in oklch, var(--warn) 22%, transparent);
    border-color: color-mix(in oklch, var(--warn) 48%, transparent);
    color: var(--warn);
  }
  #rpm-label.slow { color: var(--warn) !important; font-weight: 800; }

  /* ── Engine-config switcher (lives inside toolbar extras) ── */
  .cfg-group {
    display: flex; align-items: center; gap: 4px;
    padding-left: 8px; margin-left: 4px;
    border-left: 1px solid var(--border);
  }
  .cfg-arrow {
    width: 22px; height: 22px; border-radius: 50%;
    border: none; background: var(--surface-3);
    color: var(--text); font-size: 14px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-family: inherit; padding: 0;
    transition: background var(--dur-fast) var(--ease-out),
                color var(--dur-fast) var(--ease-out);
  }
  .cfg-arrow:hover, .cfg-arrow:active { background: var(--accent); color: #0b0e14; }
  #cfg-label {
    min-width: 78px; text-align: center; white-space: nowrap;
    font-size: 10.5px; font-weight: 700; letter-spacing: .02em;
    color: var(--text); font-family: var(--font-mono);
  }

  /* ── Chip: the stroke name is text, so reduce the big-value font ── */
  #ui-chip #chip-value {
    font-size: 15px; letter-spacing: -.01em; font-weight: 800;
    line-height: 1.15;
  }

  @media (max-width: 600px) {
    .cfg-arrow { width: 19px; height: 19px; font-size: 12px; }
    #cfg-label { min-width: 62px; font-size: 10px; }
    #crank-wheel { width: 100px; height: 100px; }
  }
</style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div id="labels-root"></div>

  <script src="guard.js"></script>
  <script type="importmap">
  { "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import * as Base from './kit.js';
  import { UI } from './kit.js';

  const DEG = Base.DEG, TAU = Base.TAU;
  const TAU2 = TAU * 2;

  /* ═══════════════════════════════════════════════════════════════════
     ADAPTIVE QUALITY
     ═══════════════════════════════════════════════════════════════════ */
  const isCoarse = matchMedia('(pointer: coarse)').matches;
  const cores    = navigator.hardwareConcurrency || 4;
  const mem      = navigator.deviceMemory || 4;
  const isLowEnd = cores <= 4 || mem <= 2;
  const isMidEnd = !isLowEnd && (cores <= 6 || isCoarse);

  const PARTICLE_COUNT = isLowEnd ? 50 : isMidEnd ? 90 : 140;
  const STREAM_COUNT   = isLowEnd ? 25 : isMidEnd ? 40 : 60;
  const LINER_SEGS     = isLowEnd ? 32 : isMidEnd ? 40 : 48;
  const PISTON_SEGS    = isLowEnd ? 24 : isMidEnd ? 32 : 40;
  const BELT_CURVE_SEG = isLowEnd ? 24 : isMidEnd ? 30 : 36;
  const REF_BAND_SEGS  = isLowEnd ? 24 : 48;

  /* ---------- Geometry constants ---------- */
  const R = 0.55, L = 1.85, BORE = 1.15, STROKE = 2 * R;
  const CROWN_H = 0.35;
  const TDC_WRIST = R + L;
  const HEAD_Y = TDC_WRIST + CROWN_H + 0.15;
  const VALVE_X = 0.38;
  const TDC_CROWN_Y = TDC_WRIST + CROWN_H;
  const BDC_CROWN_Y = (L - R) + CROWN_H;

  const strokes = [
    { name:'Intake',      color:'#38bdf8', bg:'rgba(56,189,248,.18)',
      desc:'<strong>Intake stroke (0°–180°).</strong> Piston moves from TDC to BDC. Intake valve opens. Fresh air–fuel mixture is drawn into the cylinder through the intake port.' },
    { name:'Compression', color:'#818cf8', bg:'rgba(129,140,248,.18)',
      desc:'<strong>Compression stroke (180°–360°).</strong> Both valves closed. Piston rises from BDC to TDC, compressing the mixture. Pressure and temperature rise sharply.' },
    { name:'Power',       color:'#f97316', bg:'rgba(249,115,22,.20)',
      desc:'<strong>Power stroke (360°–540°).</strong> Near TDC a spark ignites the mixture. Rapid expansion of hot gases drives the piston down — the only stroke that produces useful work.' },
    { name:'Exhaust',     color:'#94a3b8', bg:'rgba(148,163,184,.18)',
      desc:'<strong>Exhaust stroke (540°–720°).</strong> Exhaust valve opens. Piston rises and pushes burnt gases out through the exhaust port, preparing the cylinder for the next intake.' }
  ];

  /* ---------- Bootstrap ---------- */
  const { scene, camera, renderer, controls, wrap, viewManager } = Base.buildScene({
    fov: 42,
    camPos: isCoarse ? [4.8, 3.2, 6.4] : [5.6, 3.7, 7.4],
    target: [0, 1.9, 0],
    floorY: -2.15
  });
  Base.attachResize(camera, renderer, wrap, 42);

  const M = Base.createMaterials();
  const particleTex = Base.createParticleTexture();
  const labels = Base.createLabelSystem();

  /* ---------- Engine group ---------- */
  const engine = new THREE.Group();
  scene.add(engine);

  /* Liner + fins */
  const linerH = STROKE + 0.9;
  const liner = Base.halfCylShell(BORE + 0.12, BORE, linerH, M, LINER_SEGS);
  liner.position.y = HEAD_Y - linerH / 2 - 0.05;
  engine.add(liner);

  const fins = Base.makeCoolingFins(BORE + 0.12, 7, 0.22, 0.04, M.matAlu, M.matCut);
  fins.position.y = liner.position.y;
  engine.add(fins);

  function refBand(y, color) {
    const b = new THREE.Mesh(
      new THREE.CylinderGeometry(BORE + 0.14, BORE + 0.14, 0.035, REF_BAND_SEGS, 1, true, Math.PI/2, Math.PI),
      new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide })
    );
    b.position.y = y;
    engine.add(b);
  }
  refBand(TDC_CROWN_Y, 0x22c55e);
  refBand(BDC_CROWN_Y, 0xef4444);

  /* Head shell */
  const headW = BORE * 2.4, headH = 0.90, headD = BORE * 1.10, wallT = 0.10;
  const headGroup = new THREE.Group();
  headGroup.position.y = HEAD_Y + headH / 2;
  engine.add(headGroup);

  const wallMats = [M.matIronDS, M.matIronDS, M.matIronDS, M.matIronDS, M.matCut, M.matIronDS];
  const headTop = new THREE.Mesh(new THREE.BoxGeometry(headW, wallT, headD), wallMats);
  headTop.position.set(0, headH/2 - wallT/2, -headD/2);
  headGroup.add(headTop);
  const headLeft = new THREE.Mesh(new THREE.BoxGeometry(wallT, headH - 2*wallT, headD), wallMats);
  headLeft.position.set(-headW/2 + wallT/2, 0, -headD/2);
  headGroup.add(headLeft);
  const headRight = new THREE.Mesh(new THREE.BoxGeometry(wallT, headH - 2*wallT, headD), wallMats);
  headRight.position.set(headW/2 - wallT/2, 0, -headD/2);
  headGroup.add(headRight);
  const headBack = new THREE.Mesh(new THREE.BoxGeometry(headW - 2*wallT, headH - 2*wallT, wallT), M.matIronDS);
  headBack.position.set(0, 0, -headD + wallT/2);
  headGroup.add(headBack);

  const deckShape = new THREE.Shape();
  deckShape.moveTo(-headW/2, -headD/2);
  deckShape.lineTo( headW/2, -headD/2);
  deckShape.lineTo( headW/2,  headD/2);
  deckShape.lineTo(-headW/2,  headD/2);
  deckShape.closePath();
  [-VALVE_X, VALVE_X].forEach(vx => {
    const h = new THREE.Path();
    h.absarc(vx, -0.2325, 0.30, 0, Math.PI * 2, true);
    deckShape.holes.push(h);
  });
  const deck = new THREE.Mesh(
    new THREE.ExtrudeGeometry(deckShape, { depth: wallT, bevelEnabled: false, curveSegments: 28 }),
    M.matIronDS
  );
  deck.rotation.x = -Math.PI / 2;
  deck.position.set(0, -headH/2, -headD/2);
  headGroup.add(deck);
  const deckCut = new THREE.Mesh(new THREE.BoxGeometry(headW, wallT, 0.02), M.matCut);
  deckCut.position.set(0, -headH/2 + wallT/2, 0.011);
  headGroup.add(deckCut);

  const inP0 = new THREE.Vector3(-0.50, -0.22, -0.42);
  const inP1 = new THREE.Vector3(-2.10,  0.12, -0.50);
  headGroup.add(Base.tubeBetween(inP0, inP1, 0.22, 0.26, M.matPortIn, true));
  const inDir = new THREE.Vector3().subVectors(inP1, inP0).normalize();
  headGroup.add(Base.makeFlange(inP1.clone().addScaledVector(inDir, 0.045), inDir, 0.34, 0.07, M.matFlangeGlass));

  const exP0 = new THREE.Vector3( 0.50, -0.22, -0.42);
  const exP1 = new THREE.Vector3( 2.10,  0.12, -0.50);
  headGroup.add(Base.tubeBetween(exP0, exP1, 0.20, 0.24, M.matPortEx, true));
  const exDir = new THREE.Vector3().subVectors(exP1, exP0).normalize();
  headGroup.add(Base.makeFlange(exP1.clone().addScaledVector(exDir, 0.045), exDir, 0.32, 0.07, M.matFlangeGlass));

  /* ═══════════════════════════════════════════════════════════════════
     VALVE TRAIN
     ═══════════════════════════════════════════════════════════════════ */
  const mechanismAccent = new THREE.MeshStandardMaterial({
    color: 0x38bdf8, metalness: 0.55, roughness: 0.28,
    emissive: 0x38bdf8, emissiveIntensity: 0.65
  });

  const CAM_Y      = HEAD_Y + 1.24;
  const CAM_Z      = -0.40;
  const PIVOT_Y    = HEAD_Y + 1.02;
  const ROLLER_Y   = HEAD_Y + 1.075;
  const ROCKER_ARM = 0.64;
  const BELT_R1    = 0.22;
  const BELT_R2    = 0.44;
  const BELT_T     = 0.04;
  const BELT_Z     = 1.21;

  const mechParts = [];

  /* Camshaft */
  const camGroup = new THREE.Group();
  camGroup.position.set(0, CAM_Y, CAM_Z);
  engine.add(camGroup);
  mechParts.push(camGroup);

  const camShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 1.58, 20), M.matMetalDark);
  camShaft.rotation.x = Math.PI / 2; camShaft.position.z = -0.09;
  camShaft.castShadow = true; camGroup.add(camShaft);

  const camNose = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 1.02, 16), M.matMetal);
  camNose.rotation.x = Math.PI / 2; camNose.position.z = 1.19; camGroup.add(camNose);

  const camHubF = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.10, 0.12, 20), M.matMetal);
  camHubF.rotation.x = Math.PI / 2; camHubF.position.z = 0.62; camGroup.add(camHubF);
  const camHubR = camHubF.clone(); camHubR.position.z = -0.80; camGroup.add(camHubR);

  function makeCamLobe(z, phase) {
    const lobeGroup = new THREE.Group();
    lobeGroup.position.z = z;
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.18, 24), M.matMetal);
    base.rotation.x = Math.PI / 2; base.castShadow = true; lobeGroup.add(base);
    const nose = new THREE.Mesh(new THREE.SphereGeometry(0.065, 16, 12), M.matMetal);
    nose.position.y = -0.125; lobeGroup.add(nose);
    lobeGroup.rotation.z = phase;
    camGroup.add(lobeGroup);
    return lobeGroup;
  }
  makeCamLobe(-0.12,  45 * DEG);
  makeCamLobe( 0.10, 315 * DEG);

  const camTowers = new THREE.Group();
  engine.add(camTowers);
  mechParts.push(camTowers);
  [-0.85, -0.09].forEach(z => {
    const tower = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.48, 0.22), M.matIron);
    tower.position.set(0, HEAD_Y + 1.14, z);
    tower.castShadow = true;
    camTowers.add(tower);
  });

  /* Rocker arms */
  function beamBetween(a, b, mat) {
    const dir = new THREE.Vector3().subVectors(b, a);
    const len = dir.length();
    const beam = new THREE.Mesh(new THREE.BoxGeometry(len, 0.10, 0.045), mat);
    beam.position.copy(a).addScaledVector(dir, 0.5);
    beam.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), dir.normalize());
    beam.castShadow = true;
    return beam;
  }

  function makeRocker(pivotX, pivotZ, rollerZ) {
    const g = new THREE.Group();
    g.position.set(pivotX, PIVOT_Y, pivotZ);
    const boss = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.17, 16), M.matMetalDark);
    boss.rotation.x = Math.PI / 2; g.add(boss);
    const roll = new THREE.Vector3(-pivotX, ROLLER_Y - PIVOT_Y, rollerZ - pivotZ);
    const roller = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.13, 18), M.matMetal);
    roller.rotation.x = Math.PI / 2; roller.position.copy(roll); g.add(roller);
    const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.16, 10), M.matMetalDark);
    pin.rotation.x = Math.PI / 2; pin.position.copy(roll); g.add(pin);
    g.add(beamBetween(new THREE.Vector3(0, 0.02, 0), roll, M.matMetal));
    const valveX = -Math.sign(pivotX) * VALVE_X;
    const vEnd = new THREE.Vector3(valveX - pivotX, 3.845 - PIVOT_Y, -0.40 - pivotZ);
    g.add(beamBetween(new THREE.Vector3(0, 0, 0), vEnd, M.matMetal));
    const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.07, 14), M.matMetalDark);
    pad.position.set(vEnd.x, vEnd.y - 0.07, vEnd.z); g.add(pad);
    engine.add(g); mechParts.push(g);
    return g;
  }
  const rockerIn = makeRocker( 0.26, -0.49, -0.52);
  const rockerEx = makeRocker(-0.26, -0.33, -0.30);

  const rockerPosts = new THREE.Group();
  engine.add(rockerPosts);
  mechParts.push(rockerPosts);
  [[0.26, -0.49], [-0.26, -0.33]].forEach(([x, z]) => {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.065, 0.14, 14), M.matIron);
    post.position.set(x, HEAD_Y + 0.965, z);
    rockerPosts.add(post);
  });

  /* Timing belt */
  const beltPsi = Math.asin((BELT_R1 - BELT_R2) / CAM_Y);
  const cPS = Math.cos(beltPsi), sPS = Math.sin(beltPsi);

  const beltShape = new THREE.Shape();
  beltShape.moveTo((BELT_R1 + BELT_T) * cPS, (BELT_R1 + BELT_T) * sPS);
  beltShape.absarc(0, 0, BELT_R1 + BELT_T, beltPsi, -Math.PI - beltPsi, true);
  beltShape.lineTo(-(BELT_R2 + BELT_T) * cPS, CAM_Y + (BELT_R2 + BELT_T) * sPS);
  beltShape.absarc(0, CAM_Y, BELT_R2 + BELT_T, Math.PI - beltPsi, beltPsi, true);
  beltShape.closePath();
  const beltHole = new THREE.Path();
  beltHole.moveTo(BELT_R1 * cPS, BELT_R1 * sPS);
  beltHole.absarc(0, 0, BELT_R1, beltPsi, -Math.PI - beltPsi, true);
  beltHole.lineTo(-BELT_R2 * cPS, CAM_Y + BELT_R2 * sPS);
  beltHole.absarc(0, CAM_Y, BELT_R2, Math.PI - beltPsi, beltPsi, true);
  beltHole.closePath();
  beltShape.holes.push(beltHole);

  const belt = new THREE.Mesh(
    new THREE.ExtrudeGeometry(beltShape, { depth: 0.07, bevelEnabled: false, curveSegments: BELT_CURVE_SEG }),
    new THREE.MeshStandardMaterial({ color: 0x232a38, roughness: 0.85, metalness: 0.05 })
  );
  belt.position.z = BELT_Z - 0.035;
  belt.castShadow = true;
  engine.add(belt); mechParts.push(belt);

  const camPulley = new THREE.Group();
  camPulley.position.z = BELT_Z - CAM_Z;
  const camDisc = new THREE.Mesh(new THREE.CylinderGeometry(BELT_R2 + 0.015, BELT_R2 + 0.015, 0.06, 36), M.matMetalDark);
  camDisc.rotation.x = Math.PI / 2; camDisc.castShadow = true; camPulley.add(camDisc);
  for (let i = 0; i < 4; i++) {
    const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.022, 10), M.matMetal);
    bolt.rotation.x = Math.PI / 2;
    bolt.position.set(Math.cos(i * Math.PI / 2) * 0.30, Math.sin(i * Math.PI / 2) * 0.30, 0.045);
    camPulley.add(bolt);
  }
  const camTimingDot = new THREE.Mesh(new THREE.SphereGeometry(0.038, 14, 10), mechanismAccent);
  camTimingDot.position.set(0.38, 0, 0.05);
  camPulley.add(camTimingDot);

function buildCylinder(exhaustSide = 1) {
  const g = new THREE.Group();

  const finCount = 12;

    fin.position.y = y; fin.castShadow = true; g.add(fin);

  head.position.y = CYL_HEAD - 0.08; head.castShadow = true; g.add(head);
  for (let i = 0; i < 3; i++) {
    const fin = new THREE.Mesh(new THREE.CylinderGeometry(FIN_OD + 0.04, FIN_OD + 0.04, 0.02, 32, 1, true), matFins);
    fin.position.y = CYL_HEAD - 0.18 + i * 0.055; g.add(fin);

  const rockerBox = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.24, 0.34), matAlu);
  rockerBox.position.y = CYL_HEAD + 0.10; rockerBox.castShadow = true; g.add(rockerBox);
  const rockerCover = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.06, 0.30), matAluDark);
  rockerCover.position.y = CYL_HEAD + 0.24; g.add(rockerCover);

  exhaust.position.set(exhaustSide * (CYL_OD + 0.06), CYL_HEAD - 0.12, 0.02);

}

function buildRod(length, isMaster) {
  const g = new THREE.Group();
  const beam = new THREE.Mesh(new THREE.BoxGeometry(0.11, length - 0.30, 0.09), matRod);
  beam.position.y = length / 2; beam.castShadow = true; g.add(beam);

  const bigEnd = new THREE.Mesh(new THREE.CylinderGeometry(bigR, bigR, bigW, 20), matAluDark);
  bigEnd.rotation.x = Math.PI / 2; bigEnd.castShadow = true; g.add(bigEnd);

      pin.rotation.x = Math.PI / 2;

  smallEnd.rotation.x = Math.PI / 2; smallEnd.position.y = length; g.add(smallEnd);
  return g;
}

function buildCrank(throws) {
  const g = new THREE.Group();
  throws.forEach(t => {
    const throwUnit = new THREE.Group();
    throwUnit.position.z = t.z;
    throwUnit.rotation.z = -t.phase * DEG;
    [-0.16, 0.16].forEach(dz => {
      const web = new THREE.Mesh(new THREE.BoxGeometry(0.50, R + 0.30, 0.11), matSteel);
      web.position.set(0, R / 2, dz); web.castShadow = true; throwUnit.add(web);
    });
    const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.45, 20), matPin);
    pin.rotation.x = Math.PI / 2; pin.position.y = R; pin.castShadow = true; throwUnit.add(pin);
    const cw = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.20, 24, 1, false, 0, Math.PI), matSteel);
    cw.rotation.x = Math.PI / 2; cw.rotation.z = Math.PI; cw.position.y = -R * 0.18; throwUnit.add(cw);
    g.add(throwUnit);
  });
  const zs = throws.map(t => t.z).sort((a, b) => a - b);
  const journalZ = [zs[0] - 0.55];
  for (let i = 0; i < zs.length - 1; i++) journalZ.push((zs[i] + zs[i + 1]) / 2);
  journalZ.push(zs[zs.length - 1] + 0.55);
  journalZ.forEach(z => {
    const j = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.60, 20), matAluDark);
    j.rotation.x = Math.PI / 2; j.position.z = z; j.castShadow = true; g.add(j);
  });
  return g;
}

function tubeFromPath(points, radius, mat) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  const geo = new THREE.TubeGeometry(curve, 48, radius, 12, false);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  return mesh;
}

function makeBox(w, h, d, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function setupCyl(engineGroup, bankDeg, throwPhase, z, exhaustSide) {
  const rig = new THREE.Group();
  rig.position.z = z; rig.rotation.z = -bankDeg * DEG;
  engineGroup.add(rig);
  rig.add(buildCylinder(exhaustSide));
  const piston = buildPiston(); rig.add(piston);
  const rod = buildRod(L, false); rig.add(rod);
  return { rig, piston, rod, bankDeg, throwPhase };
}

function stepSimple(cyl, theta) {
  const psi = theta + cyl.throwPhase * DEG - cyl.bankDeg * DEG;
  const s = Math.sin(psi), c = Math.cos(psi);
  const d = R * c + Math.sqrt(Math.max(0, L * L - R * R * s * s));
  const px = R * s, py = R * c;
  cyl.piston.position.set(0, d, 0);
  cyl.rod.position.set(px, py, 0);
  cyl.rod.rotation.z = Math.atan2(px, d - py);
}

function buildBlockCrankcase(width, depth, topY = CYL_BASE, bottomY = -0.75) {
  const g = new THREE.Group();
  const h = topY - bottomY, cy = (topY + bottomY) / 2;
  g.add(makeBox(width, h, depth, matAlu, 0, cy, 0));
  const ribCount = Math.max(3, Math.round(depth / 0.45));
  for (let i = 0; i < ribCount; i++) {
    const z = -depth / 2 + (i + 0.5) * (depth / ribCount);
    [-1, 1].forEach(side => {
      g.add(makeBox(0.03, h * 0.9, 0.04, matAluDark, side * (width / 2 + 0.01), cy, z));
    });

  g.add(makeBox(width + 0.10, 0.24, depth * 0.96, matIron, 0, bottomY + 0.12, 0));

function buildFlywheel(z, radius = 0.55) {
  const g = new THREE.Group(); g.position.z = z;
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, 0.09, 40), matSteel);
  disc.rotation.x = Math.PI / 2; disc.castShadow = true; g.add(disc);
  const teeth = 30;
  for (let i = 0; i < teeth; i++) {
    const a = (i / teeth) * Math.PI * 2;
    const tooth = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.06, 0.09), matSteel);
    tooth.position.set(Math.cos(a) * (radius + 0.02), Math.sin(a) * (radius + 0.02), 0);
    tooth.rotation.z = a; g.add(tooth);

  return g;
}

  groove.rotation.x = Math.PI / 2; g.add(groove);
  return g;
}

function createInline4() {
  const group = new THREE.Group();
  const throwZ = [-1.65, -0.55, 0.55, 1.65];
  const throwPhase = [0, 180, 180, 0];
  const throws = throwZ.map((z, i) => ({ z, phase: throwPhase[i] }));
  group.add(buildCrank(throws));
  group.add(buildBlockCrankcase(0.9, 4.4));
  group.add(buildFlywheel(2.20, 0.60));
  group.add(buildPulley(-2.20, 0.32));
  const cylinders = throwZ.map((z, i) => setupCyl(group, 0, throwPhase[i], z, 1));
  group.add(tubeFromPath([
    [CYL_OD + 0.30, CYL_HEAD - 0.12, throwZ[0] - 0.55],
    [CYL_OD + 0.30, CYL_HEAD - 0.12, throwZ[1]],
    [CYL_OD + 0.30, CYL_HEAD - 0.12, throwZ[2]],
    [CYL_OD + 0.30, CYL_HEAD - 0.12, throwZ[3] + 0.55]

  ], 0.11, matExhaust));
  group.add(tubeFromPath([
    [-(CYL_OD + 0.30), CYL_HEAD - 0.12, throwZ[0] - 0.55],
    [-(CYL_OD + 0.30), CYL_HEAD - 0.12, throwZ[1]],
    [-(CYL_OD + 0.30), CYL_HEAD - 0.12, throwZ[2]],
    [-(CYL_OD + 0.30), CYL_HEAD - 0.12, throwZ[3] + 0.55]
  ], 0.085, matIntake));
  return {
    group, crankGroup: group.children[0], cylinders,
    step: (theta) => cylinders.forEach(c => stepSimple(c, theta)),

function createVTwin() {

  const cylR = setupCyl(group,  22.5, 0,  0.11,  1);
  const endL = [
    -Math.sin(22.5 * DEG) * (CYL_HEAD - 0.12) - Math.cos(22.5 * DEG) * (CYL_OD + 0.20),
     Math.cos(22.5 * DEG) * (CYL_HEAD - 0.12) - Math.sin(22.5 * DEG) * (CYL_OD + 0.20),

  ];

    [endL[0] - 0.55, endL[1] - 0.85, endL[2] - 0.75]
  ], 0.075, matExhaust));

     Math.sin(22.5 * DEG) * (CYL_HEAD - 0.12) + Math.cos(22.5 * DEG) * (CYL_OD + 0.20),
     Math.cos(22.5 * DEG) * (CYL_HEAD - 0.12) - Math.sin(22.5 * DEG) * (CYL_OD + 0.20),

}

function createV8() {
  const group = new THREE.Group();
  const throwZ = [-1.65, -0.55, 0.55, 1.65];
  const throwPhase = [0, 90, 180, 270];
  const throws = throwZ.map((z, i) => ({ z, phase: throwPhase[i] }));
  group.add(buildCrank(throws));
  group.add(buildBlockCrankcase(1.65, 4.4));
  group.add(buildFlywheel(2.20, 0.62));
  group.add(buildPulley(-2.20, 0.34));
  const leftCyls = [], rightCyls = [];
  for (let i = 0; i < 4; i++) {
    leftCyls.push( setupCyl(group, -45, throwPhase[i], throwZ[i] - 0.11, -1) );
    rightCyls.push(setupCyl(group,  45, throwPhase[i], throwZ[i] + 0.11,  1) );
  }
  const bankAngle = 45 * DEG;
  const endX = -Math.sin(bankAngle) * (CYL_HEAD - 0.12) - Math.cos(bankAngle) * (CYL_OD + 0.20);
  const endY =  Math.cos(bankAngle) * (CYL_HEAD - 0.12) - Math.sin(bankAngle) * (CYL_OD + 0.20);
  group.add(tubeFromPath([
    [endX, endY, throwZ[0] - 0.55],
    [endX, endY, throwZ[1]],
    [endX, endY, throwZ[2]],
    [endX, endY, throwZ[3] + 0.55]
  ], 0.10, matExhaust));
  group.add(tubeFromPath([
    [endX, endY, throwZ[3] + 0.55],
    [endX - 0.15, endY - 0.55, throwZ[3] + 0.85],
    [endX - 0.20, 0.85, throwZ[3] + 1.15],
    [endX - 0.20, 0.30, throwZ[3] + 1.40]
  ], 0.115, matExhaust));
  group.add(tubeFromPath([
    [-endX, endY, throwZ[0] - 0.55],
    [-endX, endY, throwZ[1]],
    [-endX, endY, throwZ[2]],
    [-endX, endY, throwZ[3] + 0.55]
  ], 0.10, matExhaust));
  group.add(tubeFromPath([
    [-endX, endY, throwZ[3] + 0.55],
    [-endX + 0.15, endY - 0.55, throwZ[3] + 0.85],
    [-endX + 0.20, 0.85, throwZ[3] + 1.15],
    [-endX + 0.20, 0.30, throwZ[3] + 1.40]
  ], 0.115, matExhaust));
  group.add(tubeFromPath([
    [0, CYL_HEAD * 0.72, throwZ[0] - 0.55],
    [0, CYL_HEAD * 0.72, throwZ[1]],
    [0, CYL_HEAD * 0.72, throwZ[2]],
    [0, CYL_HEAD * 0.72, throwZ[3] + 0.55]
  ], 0.13, matIntake));
  group.add(makeBox(0.30, 0.26, 0.34, matAluDark, 0, CYL_HEAD * 0.72, throwZ[0] - 0.80));
  const cylinders = [...leftCyls, ...rightCyls];
  return {
    group, crankGroup: group.children[0], cylinders,
    step: (theta) => cylinders.forEach(c => stepSimple(c, theta)),
    title: 'V8 Cross‑plane Engine',
    sub: 'Two banks of four · 90° V'
  };
}

function createRadial5() {
  const group = new THREE.Group();
  const throws = [{ z: 0, phase: 0 }];
  group.add(buildCrank(throws));
  group.add(buildRoundCrankcase());
  const propHub = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 0.28, 24), matAluDark);
  propHub.rotation.x = Math.PI / 2; propHub.position.z = 0.72; propHub.castShadow = true;
  group.children[0].add(propHub);
  const propGeo = (() => {
    const shape = new THREE.Shape();
    shape.moveTo(-0.10, 0.05);
    shape.bezierCurveTo(-0.22, 0.35, -0.27, 0.95, -0.18, 1.58);
    shape.bezierCurveTo(-0.09, 1.70,  0.09, 1.70,  0.18, 1.58);
    shape.bezierCurveTo( 0.27, 0.95,  0.22, 0.35,  0.10, 0.05);
    shape.closePath();
    const g = new THREE.ExtrudeGeometry(shape, {
      depth: 0.055, bevelEnabled: true,
      bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 3, curveSegments: 22
    });
    g.translate(0, 0, -0.0275);
    return g;
  })();
  const propeller = new THREE.Group();
  propeller.position.z = 0.88;
  const blade1 = new THREE.Mesh(propGeo, matWood);
  blade1.castShadow = true; propeller.add(blade1);
  const blade2 = blade1.clone(); blade2.rotation.z = Math.PI; propeller.add(blade2);
  group.children[0].add(propeller);
  const spinner = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.34, 24), matAlu);
  spinner.rotation.x = Math.PI / 2; spinner.position.z = 1.06; spinner.castShadow = true;
  group.children[0].add(spinner);
  const cylinders = [];
  for (let i = 0; i < 5; i++) {
    const phi = PHI_RAD[i];
    const isMaster = i === 0;
    const rig = new THREE.Group();
    rig.rotation.z = -phi;
    group.add(rig);
    rig.add(buildCylinder(1));
    const piston = buildPiston(); rig.add(piston);
    const rod = buildRod(isMaster ? L : L_ARTIC, isMaster); rig.add(rod);
    cylinders.push({ rig, piston, rod, isMaster, phi });
  }
  function step(theta) {
    const pinX = R * Math.sin(theta);
    const pinY = R * Math.cos(theta);
    const d0 = R * Math.cos(theta) + Math.sqrt(Math.max(0, L * L - R * R * Math.sin(theta) ** 2));
    const rot0 = Math.atan2(R * Math.sin(theta), d0 - R * Math.cos(theta));
    const delta0 = -rot0;
    const c0 = cylinders[0];
    c0.piston.position.y = d0;
    c0.rod.position.set(pinX, pinY, 0);
    c0.rod.rotation.z = rot0;
    for (let i = 1; i < 5; i++) {
      const phi = PHI_RAD[i];
      const beta = phi;
      const Qx = pinX + R_LINK * Math.sin(delta0 + beta);
      const Qy = pinY + R_LINK * Math.cos(delta0 + beta);
      const a  = Qx * Math.sin(phi) + Qy * Math.cos(phi);
      const qq = Qx * Qx + Qy * Qy;
      const disc = a * a - qq + L_ARTIC * L_ARTIC;
      const d  = a + Math.sqrt(Math.max(0.001, disc));
      const cP = Math.cos(phi), sP = Math.sin(phi);
      const Qlx = Qx * cP - Qy * sP;
      const Qly = Qx * sP + Qy * cP;
      const rot = Math.atan2(Qlx, d - Qly);
      const c = cylinders[i];
      c.piston.position.y = d;
      c.rod.position.set(Qlx, Qly, 0);
      c.rod.rotation.z = rot;
    }
  }
  return {
    group, crankGroup: group.children[0], cylinders, step,
    title: 'Radial‑5 Engine',
    sub: 'Fixed crankcase · rotating crankshaft & propeller',
    yOffset: 2.20
  };
}

    return {

  }));

  /* Cycle bar — scrub to a crank angle */
  if (cycleBarEl) cycleBarEl.addEventListener('click', (e) => {
    const rect = cycleBarEl.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    theta = pct * TAU2;
    flashT = 0;
  });

  /* ═══════════════════════════════════════════════════════════════════
     ENGINE CONFIG SWITCHER
     ═══════════════════════════════════════════════════════════════════ */
  const CONFIG_ORDER = ['inline1', 'inline4', 'vtwin', 'v8', 'radial5'];
  const CONFIG_LABELS = {
    inline1: 'Inline‑1', inline4: 'Inline‑4', vtwin: 'V‑Twin 45°',
    v8: 'V8 Cross‑plane', radial5: 'Radial‑5'
  };
  let activeConfig = 'inline1';

  const cfgLabelEl = document.getElementById('cfg-label');
  const cfgPrevEl  = document.getElementById('cfg-prev');
  const cfgNextEl  = document.getElementById('cfg-next');

  function applyEngineConfig(id) {
    activeConfig = id;
    engine.visible = (id === 'inline1');
    Object.keys(extraEngines).forEach(key => {
      extraEngines[key].group.visible = (key === id);
    });
    if (cfgLabelEl) cfgLabelEl.textContent = CONFIG_LABELS[id];
    theta = 0; flashT = 0;
    mechLabelsDirty = true;
  }
  function stepEngineConfig(dir) {
    const i = CONFIG_ORDER.indexOf(activeConfig);
    applyEngineConfig(CONFIG_ORDER[(i + dir + CONFIG_ORDER.length) % CONFIG_ORDER.length]);
  }
  if (cfgPrevEl) cfgPrevEl.addEventListener('click', () => stepEngineConfig(-1));
  if (cfgNextEl) cfgNextEl.addEventListener('click', () => stepEngineConfig(1));
  applyEngineConfig('inline1');

  /* ═══════════════════════════════════════════════════════════════════
     RPM LABEL + SLOW-MO
     ═══════════════════════════════════════════════════════════════════ */
  function updateRpmLabel() {
    const label = document.getElementById('rpm-label');
    if (!label) return;
    if (slowMo) {
      label.textContent = 'SLO-MO';
      label.classList.add('slow');
    } else {
      const eff = state.speedMul;
      const rpm = Math.round((300 + eff * 800) / 50) * 50;
      label.textContent = `~${rpm} rpm`;
      label.classList.remove('slow');
    }
  }
  updateRpmLabel();

  const btnSlow = document.getElementById('btn-slowmo');
  if (btnSlow) btnSlow.addEventListener('click', () => {
    slowMo = !slowMo;
    btnSlow.classList.toggle('active', slowMo);
    updateRpmLabel();
  });

  /* ═══════════════════════════════════════════════════════════════════
     MANUAL CRANK WIDGET
     ═══════════════════════════════════════════════════════════════════ */
  function wireCrankWidget(root) {
    const crankWheelEl = root.querySelector('#crank-wheel');
    const crankRotorEl = root.querySelector('#crank-rotor');
    const captionEl    = document.getElementById('ui-widget-br-cap');

    let dragging = false;
    let pointerId = null;
    let lastPointerAngle = 0;
    let resumeAfterDrag = false;
    let resumeAfterKeys = false;

    function setPlaying(p) { state.playing = p; }

    function crankPointerAngle(e) {
      const r = crankWheelEl.getBoundingClientRect();
      return Math.atan2(
        e.clientY - (r.top + r.height / 2),
        e.clientX - (r.left + r.width / 2)
      );
    }
    function normalize(a) {
      a %= TAU2;
      if (a < 0) a += TAU2;
      return a;
    }
    function updateCaption() {
      const deg = normalize(theta) / DEG;
      if (crankRotorEl) {
        crankRotorEl.style.transform = 'rotate(' + (theta / DEG).toFixed(2) + 'deg)';
      }
      if (crankWheelEl) crankWheelEl.setAttribute('aria-valuenow', String(Math.round(deg)));
      if (captionEl) {
        const span = captionEl.querySelector('[data-crank-deg]');
        if (span) span.textContent = Math.round(deg) + '°';
      }
    }

    crankWheelEl.addEventListener('pointerdown', e => {
      e.preventDefault();
      dragging = true; pointerId = e.pointerId;
      lastPointerAngle = crankPointerAngle(e);
      try { crankWheelEl.setPointerCapture(e.pointerId); } catch (_) {}
      crankWheelEl.classList.add('grabbing');
      if (captionEl) captionEl.classList.add('active');
      if (state.playing) { resumeAfterDrag = true; setPlaying(false); }
    });
    crankWheelEl.addEventListener('pointermove', e => {
      if (!dragging || e.pointerId !== pointerId) return;
      e.preventDefault();
      const a = crankPointerAngle(e);
      let d = a - lastPointerAngle;
      if (d >  Math.PI) d -= TAU;
      if (d < -Math.PI) d += TAU;
      lastPointerAngle = a;
      theta = normalize(theta + d);
      updateCaption();
    });
    function endDrag() {
      if (!dragging) return;
      dragging = false; pointerId = null;
      crankWheelEl.classList.remove('grabbing');
      if (captionEl) captionEl.classList.remove('active');
      if (resumeAfterDrag) { resumeAfterDrag = false; setPlaying(true); }
    }
    crankWheelEl.addEventListener('pointerup', endDrag);
    crankWheelEl.addEventListener('pointercancel', endDrag);
    crankWheelEl.addEventListener('lostpointercapture', endDrag);

    crankWheelEl.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') { e.preventDefault(); if (state.playing) resumeAfterKeys = true; setPlaying(false); theta = normalize(theta + 10 * DEG); updateCaption(); }
      if (e.key === 'ArrowLeft')  { e.preventDefault(); if (state.playing) resumeAfterKeys = true; setPlaying(false); theta = normalize(theta - 10 * DEG); updateCaption(); }
      if (e.key === 'Home')       { e.preventDefault(); if (state.playing) resumeAfterKeys = true; setPlaying(false); theta = 0; updateCaption(); }
    });
    crankWheelEl.addEventListener('keyup', e => {
      if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === 'Home') && resumeAfterKeys) {
        resumeAfterKeys = false;
        setPlaying(true);
      }
    });
    crankWheelEl.addEventListener('blur', () => {
      if (resumeAfterKeys) { resumeAfterKeys = false; setPlaying(true); }
    });

    updateCaption();
    root.__updateCrank = updateCaption;
    root.__setPlaying = setPlaying;
  }

  /* ═══════════════════════════════════════════════════════════════════
     KINEMATICS
     ═══════════════════════════════════════════════════════════════════ */
  function pistonY(th) {
    return R*Math.cos(th) + Math.sqrt(Math.max(0, L*L - R*R*Math.sin(th)*Math.sin(th)));
  }

  function updateMechanism(th) {
    crankGroup.rotation.z = -th;
    camGroup.rotation.z = -th * 0.5;

    const py = pistonY(th);
    pistonGroup.position.set(0, py, 0);

    const pinX = R * Math.sin(th);
    const pinY = R * Math.cos(th);
    const rodAngle = Math.atan2(pinX, py - pinY);
    rodGroup.position.set(pinX, pinY, 0);
    rodGroup.rotation.z = rodAngle;

    const deg = (((th % TAU2) + TAU2) % TAU2) / DEG;

    let inLift = 0;
    if (deg >= 0 && deg <= 180) inLift = Math.sin(deg * DEG) * maxValveLift;
    let exLift = 0;
    if (deg >= 540 && deg <= 720) exLift = Math.sin((deg - 540) * DEG) * maxValveLift;

    valveIn.position.y = valveRestY - inLift;
    valveEx.position.y = valveRestY - exLift;
    rockerIn.rotation.z =  inLift / ROCKER_ARM;
    rockerEx.rotation.z = -exLift / ROCKER_ARM;

    const sIn = valveIn.getObjectByName('spring');
    const sEx = valveEx.getObjectByName('spring');
    if (sIn) { sIn.position.y = SPRING_BASE + inLift; sIn.scale.y = 1 - inLift / SPRING_H; }
    if (sEx) { sEx.position.y = SPRING_BASE + exLift; sEx.scale.y = 1 - exLift / SPRING_H; }

    const crownY = py + CROWN_H;
    const chamberTop = HEAD_Y - 0.02;
    const gasH = Math.max(0.05, chamberTop - crownY);
    gasMesh.position.y = (chamberTop + crownY) / 2;
    gasMesh.scale.set(1, gasH, 1);
    gasMesh.visible = state.showGas;
    particles.visible = state.showGas;

    const strokeIdx = Math.floor(deg / 180) % 4;
    const phase = strokes[strokeIdx];
    const gasColor = new THREE.Color(phase.color);
    let opacity = 0.32;
    if (strokeIdx === 0) opacity = 0.22 + 0.20 * (deg / 180);
    else if (strokeIdx === 1) { opacity = 0.35 + 0.25 * ((deg-180)/180); gasColor.lerp(new THREE.Color(0xa5b4fc), (deg-180)/180); }
    else if (strokeIdx === 2) { opacity = 0.55 - 0.30 * ((deg-360)/180); gasColor.set(0xf97316).lerp(new THREE.Color(0xfbbf24), 0.3); }
    else { opacity = 0.35 - 0.25 * ((deg-540)/180); gasColor.set(0x94a3b8); }
    M.matGas.color.copy(gasColor); M.matGas.opacity = opacity;
    particleMat.color.copy(gasColor);

    if (deg >= 358 && prevDeg < 358) flashT = 1.0;
    prevDeg = deg;

    const posAttr = particleGeo.attributes.position;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const p = particleData[i];
      p.angle += 0.02 * p.speed * (strokeIdx === 2 ? 2.2 : 1);
      if (strokeIdx === 0)      p.h += 0.006 * p.speed;
      else if (strokeIdx === 1) p.h += 0.001 * p.speed;
      else if (strokeIdx === 2) p.h += 0.010 * p.speed;
      else                      p.h -= 0.008 * p.speed;
      if (p.h > 1) p.h = 0;
      if (p.h < 0) p.h = 1;
      const rr = p.radius * BORE * 0.85;
      const yy = crownY + p.h * gasH;
      posAttr.setXYZ(i, Math.cos(p.angle)*rr, yy, Math.sin(p.angle)*rr);
    }
    posAttr.needsUpdate = true;
    return { strokeIdx, deg };
  }

  function updateFlash(dt) {
    if (flashT > 0) {
      flashT = Math.max(0, flashT - dt * 2.2);
      M.matFlash.opacity = flashT * 0.85;
      flashLight.intensity = flashT * 6;
      flashMesh.scale.setScalar(0.7 + (1 - flashT) * 1.8);
      flameMaterial.opacity = Math.min(0.72, flashT * 1.25);
      const expansion = 0.5 + (1 - flashT) * 1.9;
      flameCore.scale.set(expansion, expansion * 0.72, expansion);
    } else {
      M.matFlash.opacity = 0;
      flashLight.intensity = 0;
      flameMaterial.opacity = 0;
      flameCore.scale.setScalar(1);
    }
  }

  function updateStream(s, dt, g, isIntake) {
    s.points.visible = state.showGas && g > 0.01;
    if (!s.points.visible) return;
    const posAttr = s.geo.attributes.position;
    const colAttr = s.geo.attributes.color;
    for (let i = 0; i < s.count; i++) {
      const p = s.data[i];
      p.t += dt * p.speed * 0.55; if (p.t > 1) p.t -= 1;
      const v = s.curve.getPoint(p.t);
      posAttr.setXYZ(i, v.x, v.y, v.z);
      const pi = isIntake ? 0.45 + 0.55*(1-p.t) : 0.45 + 0.55*p.t;
      const I = pi * g;
      colAttr.setXYZ(i, s.baseColor.r*I, s.baseColor.g*I, s.baseColor.b*I);
    }
    posAttr.needsUpdate = true; colAttr.needsUpdate = true;
  }

  function updateStreams(dt, deg, timeScale) {
    let gIn = 0;
    if (deg < 20) gIn = deg / 20; else if (deg < 160) gIn = 1; else if (deg < 180) gIn = 1 - (deg-160)/20;
    let gEx = 0;
    if (deg >= 540 && deg < 560) gEx = (deg-540)/20;
    else if (deg >= 560 && deg < 700) gEx = 1;
    else if (deg >= 700 && deg <= 720) gEx = 1 - (deg-700)/20;
    updateStream(intakeStream,  dt * timeScale, gIn, true);
    updateStream(exhaustStream, dt * timeScale, gEx, false);
  }

  /* ═══════════════════════════════════════════════════════════════════
     RESET + BRIDGE
     ═══════════════════════════════════════════════════════════════════ */
  function resetSim() {
    theta = 0;
    flashT = 0;
    slowMo = false;
    if (btnSlow) btnSlow.classList.remove('active');
    updateRpmLabel();
  }

  const bridge = ui.wireBridge({
    viewManager,
    state,
    onCommand: (d) => {
      switch (d.action) {
        case 'setPlaying': state.playing = !!d.value; break;
        case 'setSpeed':   state.speedMul = +d.value; updateRpmLabel(); break;
        case 'setLabels':  state.showLabels = !!d.value; break;
        case 'setGas':     state.showGas    = !!d.value; break;
        case 'setMech':    setMechView(!!d.value); break;
        case 'setStroke':  { const i = Math.max(0, Math.min(3, +d.value | 0)); theta = i * Math.PI + 5 * DEG; flashT = 0; break; }
        case 'reset':      resetSim(); break;
      }
    }
  });
  bridge.ready();
  bridge.setStatus(strokes[0].name, strokes[0].color);

  /* ═══════════════════════════════════════════════════════════════════
     RENDER LOOP
     ═══════════════════════════════════════════════════════════════════ */
  const clock = new THREE.Clock();
  let lastStatus = '';
  let lastSpeedMul = -1;
  let frame = 0;

  function animate() {
    requestAnimationFrame(animate);
    frame++;
    const dt = Math.min(clock.getDelta(), 0.05);

    const effSpeed = slowMo ? SLOWMO_MULT : state.speedMul;

    if (state.playing) {
      theta += dt * effSpeed * 1.6;
      if (theta >= TAU2) theta -= TAU2;
    }

    let crankDegText = '', camDegText = '';

    if (activeConfig === 'inline1') {
      const { strokeIdx, deg } = updateMechanism(theta);

      updateFlash(dt);
      const streamScale = slowMo ? 0.15 : 1;
      updateStreams(dt, deg, streamScale);
      setStrokeUI(strokeIdx);

      const camDeg = ((((theta * 0.5) % TAU) + TAU) % TAU) / DEG;
      crankDegText = Math.round(deg) + '°';
      camDegText   = Math.round(camDeg) + '°';

      if (cycleFillEl) {
        cycleFillEl.style.width = (deg / 720 * 100).toFixed(1) + '%';
        cycleFillEl.style.background = strokes[strokeIdx].color;
      }

      if (state.showLabels) {
        if (mechLabelsDirty) { labels.hideAll(); mechLabelsDirty = false; }
        if (frame % 2 === 0) {
          labelDefs.forEach(d => {
            if (d.mech && !state.showMech) return;
            labels.project(d.id, d.pos(), camera, wrap);
          });
        }
      } else {
        labels.hideAll();
      }

      const name = strokes[strokeIdx].name;
      if (name !== lastStatus) {
        lastStatus = name;
        bridge.setStatus(name, strokes[strokeIdx].color);
      }
    } else {
      const eng = extraEngines[activeConfig];
      eng.crankGroup.rotation.z = -theta;
      eng.step(theta);

      const crankDeg = (((theta % TAU) + TAU) % TAU) / DEG;
      crankDegText = Math.round(crankDeg) + '°';
      camDegText = '—';
      labels.hideAll();
    }

    /* Update the crank widget caption + rotation */
    const brWidget = document.getElementById('ui-widget-br');
    if (brWidget && brWidget.__updateCrank) brWidget.__updateCrank();

    if (mechCrankDegEl) mechCrankDegEl.textContent = crankDegText;
    if (camDegEl)       camDegEl.textContent       = camDegText;
    if (engineCrankDegEl) engineCrankDegEl.textContent = crankDegText;

    /* Update the chip rows */
    if (frame % 4 === 0) {
      ui.chip.set('crank', crankDegText);
      ui.chip.set('cam',   camDegText);
    }

    if (state.speedMul !== lastSpeedMul) {
      lastSpeedMul = state.speedMul;
      updateRpmLabel();
    }

    controls.update();
    renderer.render(scene, camera);
  }

  updateMechanism(theta);
  setStrokeUI(0);
  animate();
  </script>
</body>
