<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infotainment &amp; Audio — Auto Lab</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="controls.css">
<link rel="stylesheet" href="components.css">
<style>
:root { --al-accent: #6366f1; }
html.light-theme { --al-accent: color-mix(in oklch, #6366f1 68%, black); }
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<div id="labels-root"></div>

<script src="guard.js"></script>
  <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import { runGuidedModule } from './components.js';

/* ── CONFIG (module content) ─────────────────────────────────────── */
const CFG = {"moduleId":"headunit","title":"Infotainment & Audio","kicker":"Infotainment & Navigation","accent":"#6366f1","badge":"Head unit · Amplifier · Speakers","camPos":[0,1.2,8.6],"target":[0,-0.1,0],"floorY":-2.2,"ctl":{"label":"Volume","val":40,"caption":"Set level"},"chipLabel":"Output volume","rows":[],"ro":[["src","Source"],["setv","Set volume"],["boost","Speed boost"],["lock","Driver lock-out"],["net","In-car network load"],["sig","Signal"]],"legend":[["var(--c-amber)","Audio signal"],["var(--c-cyan)","Vehicle network (data)"],["var(--c-violet)","Radio / GPS / phone"]],"overview":"<div class=\"al-sec\"><h4>The car’s media computer<\/h4><p>The <b>head unit<\/b> is a small computer with a touchscreen, radio tuner, Bluetooth, USB and often Wi-Fi and a mobile modem. It plays the chosen <b>source<\/b>, sends audio to the <b>amplifier<\/b> and then to the speakers, and shows the reversing camera and navigation.<\/p><\/div><div class=\"al-sec\"><h4>It talks to the car<\/h4><p>Through a gateway on the vehicle network (CAN / Ethernet) it receives road speed, gear position, door state and steering-wheel buttons, and can show warnings from other systems.<\/p><\/div><div class=\"al-sec\"><h4>Smart behaviours to try<\/h4><ul><li><b>Speed-compensated volume<\/b> raises the level as road noise grows.<\/li><li><b>Driver lock-out<\/b> disables video and typing above walking speed.<\/li><li><b>Reverse gear<\/b> switches the screen to the rear camera automatically.<\/li><\/ul><\/div><div class=\"al-sec\"><h4>Try it<\/h4><p>Change <b>Source<\/b>, drag <b>Volume<\/b> and <b>Speed<\/b>, and toggle <b>Reverse<\/b> (it only works at crawling speed).<\/p><\/div>","faults":[["Head unit frozen or rebooting","Black screen, restarts, slow touch.","Hold the power button to reset, install the latest software, check battery voltage and the fuse."],["Bluetooth will not pair","Phone connects then drops.","Delete the old pairing on both phone and car, then pair again."],["Noisy or weak radio","Hiss, fading, one band dead.","Check the antenna base for water, the cable and connector, and the antenna amplifier."],["One speaker silent or crackling","Missing channel or crackle at volume.","Check balance / fader, speaker wiring and the amplifier channel."]],"quiz":[["What does speed-compensated volume do?",["Raises volume as road noise rises","Lowers volume at speed","Turns the radio off"],0,"It keeps the music audible over road and wind noise."],["Why is video locked while driving?",["To save power","To reduce driver distraction","Because of radio interference"],1,"Safety rules and design guidelines limit distraction."],["Which network carries speed and gear to the head unit?",["The vehicle network (CAN)","The fuel line","The audio speaker wire"],0,"Data from other modules arrives over the in-car network."]]};

/* ── module state + dock options ─────────────────────────────────── */
const S = { src: 'radio', rev: false, scv: true, spd: 0 };
const SRC = { radio: ['FM / DAB radio', 0xf59e0b], bt: ['Bluetooth audio', 0x3b82f6], usb: ['USB / phone', 0x22c55e], nav: ['Navigation', 0x14b8a6], cam: ['Reverse camera', 0xef4444] };
CFG.ctls = [
  { id: 'ctl', preset: 'percent', label: 'Volume', unit: '', min: 0, max: 30, step: 1, def: 12 },
  { id: 'spd', preset: 'vehicle-speed', max: 140, step: 5, def: 0, label: 'Speed', onChange: (v) => { S.spd = v; } }
];
CFG.options = [
  { id: 'src', type: 'choice', layout: 'select', label: 'Source', options: Object.keys(SRC).filter((k) => k !== 'cam').map((k) => ({ id: k, label: SRC[k][0] })), def: 'radio', onChange: (id) => { S.src = id; } },
  { id: 'rev', type: 'toggle', label: 'Reverse gear', def: false, onChange: (on) => { S.rev = !!on; } },
  { id: 'scv', type: 'toggle', label: 'Speed volume', def: true, onChange: (on) => { S.scv = !!on; } }
];
CFG.onReset = () => { S.src = 'radio'; S.rev = false; S.scv = true; };

/* ── MODULE SCENE (per-module 3D parts) ──────────────────────────── */
function build(H) {
    const { box, cylX, cyl, tor, mat, glow, pipe, stream, clamp } = H;
    const dark = mat(0x1f2937, .3, .6), panel = mat(0x334155, .3, .6);
    box(2.0, 1.3, .3, dark, 0, .25, 0);
    const scr = glow(0xf59e0b, .9); box(1.6, .95, .04, scr, -.08, .32, .17);
    const btn = ['radio', 'bt', 'usb', 'nav', 'cam'].map((k, i) => { const m = glow(0x64748b, .15); box(.26, .12, .05, m, -.72 + i * .36, -.28, .17); return { k, m }; });
    const bars = []; for (let i = 0; i < 10; i++) { const m = glow(0x64748b, .1); box(.07, .06, .05, m, .78, -.2 + i * .09, .17); bars.push(m); }
    const phoneM = glow(0x3b82f6, 0); box(.35, .62, .05, phoneM, 1.7, -.2, .6);
    box(1.0, .4, .6, panel, 0, -1.55, 0); box(.9, .4, .6, panel, 2.3, -1.2, 0);
    const spk = [], rings = [];
    [[-3, -1.3], [-3, 1.3], [3, -1.3], [3, 1.3]].forEach((p, i) => {
      const s = cylX(.3, .3, .2, mat(0x0f172a, .3, .7), p[0], -.3, p[1]); spk.push(s);
      pipe([[0, -1.55, 0], [p[0] * .6, -1.5, p[1] * .5], [p[0], -.5, p[1]]], .025, mat(0xf59e0b, .3, .5));
      for (let r = 0; r < 2; r++) { const m = mat(0xf59e0b, .1, .5, { transparent: true, opacity: .5, depthWrite: false }), t = tor(.4, .02, m, p[0] + (p[0] > 0 ? -.2 : .2), -.3, p[1]); t.rotation.y = Math.PI / 2; rings.push({ t, m, ph: r * .5 + i * .13, d: p[0] > 0 ? -1 : 1, x0: p[0] }); }
    });
    cyl(.08, .26, .5, dark, 0, 1.95, 0);
    const ant = [0x8b5cf6, 0x14b8a6, 0x3b82f6].map((c, i) => { const m = mat(c, .1, .5, { transparent: true, opacity: .5, depthWrite: false }); const t = tor(.4, .015, m, 0, 2.3 + i * .0, 0); t.rotation.x = Math.PI / 2; return { t, m, ph: i / 3 }; });
    const wire = pipe([[0, -.45, 0], [0, -1.0, 0], [2.3, -1.0, 0], [2.3, -.95, 0]], .025, mat(0x22d3ee, .3, .5));
    wire.castShadow = false;
    const net = stream([[0, -.5, 0], [0, -1.0, 0], [2.3, -1.0, 0]], 14, 0x22d3ee, .1), aud = stream([[0, -.5, .1], [0, -1.35, .1]], 12, 0xf59e0b, .1);
    return {
      labels: [['Head unit + screen', [0, 1.1, 0]], ['Amplifier', [0, -2.0, 0]], ['Speaker', [-3, .15, 1.3]], ['Antenna (shark fin)', [0, 2.7, 0]], ['Gateway (vehicle network)', [2.3, -1.7, 0]], ['Phone', [1.7, .3, .6]]],
      update(c) {
        const set = c.k * 30, boost = S.scv ? 8 * Math.pow(S.spd / 140, 1.2) : 0;
        const camOn = S.rev && S.spd <= 15, eff = clamp((set + boost) / 30) * 30 * (camOn ? .6 : 1);
        const key = camOn ? 'cam' : S.src;
        scr.color.setHex(SRC[key][1]); scr.emissive.setHex(SRC[key][1]);
        btn.forEach((o) => { o.m.emissiveIntensity = o.k === key ? 2 : .15; o.m.color.setHex(o.k === key ? SRC[o.k][1] : 0x64748b); o.m.emissive.setHex(o.k === key ? SRC[o.k][1] : 0x64748b); });
        const lit = Math.round(eff / 30 * 10);
        bars.forEach((m, i) => { const on = i < lit, col = on ? (i > 7 ? 0xef4444 : i > 5 ? 0xf59e0b : 0x22c55e) : 0x475569; m.emissiveIntensity = on ? 1.6 : .08; m.color.setHex(col); m.emissive.setHex(col); });
        phoneM.emissiveIntensity = key === 'bt' || key === 'usb' ? 1.6 : 0;
        const a = eff / 30, mute = key === 'cam' || key === 'nav' ? .6 : 1;
        spk.forEach((s, i) => { const p = 1 + .16 * a * Math.sin(c.t * 18 + i); s.scale.set(1, p, p); });
        rings.forEach((r) => { const u = (c.t * .8 + r.ph) % 1; r.t.visible = a > .03; r.t.position.x = r.x0 + r.d * (-.2 + u * 1.0) * -1; r.t.scale.setScalar(.6 + u * 1.4); r.m.opacity = (1 - u) * .6 * a * mute; });
        ant.forEach((r) => { const u = (c.t * .6 + r.ph) % 1; r.t.scale.setScalar(.4 + u * 1.8); r.m.opacity = (1 - u) * .55; });
        net.update(c.t, .25, 1); aud.update(c.t, .3, a);
        const sig = key === 'radio' ? (70 + 12 * Math.sin(c.t * .5)).toFixed(0) + ' %' : key === 'bt' ? 'Paired' : key === 'nav' ? 'GPS fix' : 'Wired';
        const lockOn = S.spd > 5, load = 12 + (key === 'nav' ? 18 : key === 'cam' ? 35 : key === 'usb' ? 12 : 6) + S.spd / 140 * 15;
        const ctl_ = S.rev && S.spd > 15 ? 'Reverse ignored above 15 km/h' : SRC[key][0];
        return {
          big: eff.toFixed(0), unit: ' / 30', bar: eff / 30 * 100,
          ro: { src: [SRC[key][0], 'hi'], setv: [set.toFixed(0), ''], boost: ['+' + boost.toFixed(1), boost > 0 ? 'ok' : ''], lock: [lockOn ? 'Video & typing locked' : 'Open', lockOn ? 'warn' : 'ok'], net: [load.toFixed(0) + ' %', ''], sig: [sig, ''] },
          status: [ctl_, !(S.rev && S.spd > 15)], ctl: set.toFixed(0) + ' / 30'
        };
      }
    };
  }

runGuidedModule(CFG, build);
</script>
</body>
</html>
