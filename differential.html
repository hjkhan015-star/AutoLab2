<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d13">
<title>Differential — Auto Lab</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="controls.css">
<style>
  /* ═══════════════════════════════════════════════════════════
     PANEL READOUT INTERIOR — wheel-speed split bars
     ═══════════════════════════════════════════════════════════ */
  #diff-readout { margin: 6px 0 8px; }
  .diff-row {
    display: flex; align-items: center; gap: 8px;
    margin: 6px 0; font-size: 12px;
    font-family: var(--font-mono);
  }
  .diff-name {
    min-width: 74px; display: flex; align-items: center; gap: 6px;
    color: var(--text-dim, #94a3b8);
    font-family: var(--font-sans);
    font-weight: 600; letter-spacing: 0.02em;
  }
  .diff-dot {
    width: 7px; height: 7px; border-radius: 50%;
    display: inline-block; box-shadow: 0 0 6px currentColor;
  }
  .diff-bar {
    flex: 1; height: 5px; background: rgba(255,255,255,.06);
    border-radius: 3px; overflow: hidden; position: relative;
  }
  .diff-bar::after {
    content: ""; position: absolute; inset: 0; border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
    pointer-events: none;
  }
  .diff-fill {
    height: 100%; border-radius: 3px;
    transition: width var(--dur-fast, .08s) linear;
    width: 50%; box-shadow: 0 0 8px currentColor;
  }
  .diff-num {
    min-width: 50px; text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--text, #e5e7eb);
    font-weight: 700; font-size: 11.5px; letter-spacing: 0.01em;
  }
  #diff-eq {
    text-align: center; color: var(--text-dim, #8b96a5);
    font-size: 11.5px; margin: 8px 0 2px;
    font-family: var(--font-mono);
    letter-spacing: 0.03em;
    padding: 6px 8px;
    border-top: 1px solid var(--border, rgba(255,255,255,.08));
    border-bottom: 1px solid var(--border, rgba(255,255,255,.08));
  }
  #wheel-speed-extra {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--border, rgba(255,255,255,.08));
    display: flex; flex-direction: column; gap: 5px;
    font-size: 11.5px; color: var(--text-dim, #94a3b8);
  }
  #wheel-speed-extra .row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
  }
  #wheel-speed-extra .row > span:first-child {
    font-family: var(--font-sans);
    font-weight: 500; letter-spacing: 0.01em;
  }
  #wheel-speed-extra .val {
    color: var(--text, #e5e7eb); font-weight: 700;
    font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
  }
  #wheel-speed-extra .warn { color: #f87171; font-weight: 800; }
  #diff-mode-row .val { color: var(--accent, #38bdf8); }

  /* ═══════════════════════════════════════════════════════════
     WIDGET INTERIOR — traction / display controls (bottom-left)
     ═══════════════════════════════════════════════════════════ */

  /* ═══════════════════════════════════════════════════════════
     OVERLAY — camera presets (top-right)
     ═══════════════════════════════════════════════════════════ */

  /* ═══════════════════════════════════════════════════════════
     OVERLAY — wheel-slip flash
     ═══════════════════════════════════════════════════════════ */
  #status-flash {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #f87171;
    font-family: var(--font-mono);
    font-size: 20px; font-weight: 800; letter-spacing: 0.14em;
    text-transform: uppercase; pointer-events: none;
    opacity: 0; transition: opacity var(--dur-fast, .2s);
    text-shadow: 0 0 24px rgba(248,113,113,.85), 0 0 60px rgba(248,113,113,.5);
    z-index: 60; text-align: center; max-width: 80vw;
    padding: 8px 18px; border-radius: var(--r-sm, 8px);
    background: rgba(20,26,36,.55);
    border: 1px solid rgba(248,113,113,.28);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #status-flash.on { opacity: 1; animation: flashPulse 1s infinite; }
  @keyframes flashPulse { 50% { opacity: 0.55; } }

  /* ═══════════════════════════════════════════════════════════
     OVERLAY — tyre speed chips
     ═══════════════════════════════════════════════════════════ */
  .tyre-speed-chip {
    position: fixed; z-index: 41;
    display: flex; flex-direction: column; gap: 2px;
    padding: 6px 11px; border-radius: 10px;
    background: rgba(10,14,20,.82);
    border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font-family: var(--font-mono);
    pointer-events: none;
    transform: translate(-50%, -50%);
    left: -999px; top: -999px; white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }
  .tyre-speed-chip .tsc-label {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    font-weight: 700;
    font-family: var(--font-sans);
  }
  .tyre-speed-chip .tsc-val {
    font-size: 12px; font-weight: 800;
    color: var(--text, #e5e7eb);
    font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
  }
  #tyre-speed-left {
    border-color: rgba(56,189,248,.45);
    box-shadow: 0 4px 14px rgba(0,0,0,.4), inset 0 0 0 1px rgba(56,189,248,.08);
  }
  #tyre-speed-right {
    border-color: rgba(245,158,11,.45);
    box-shadow: 0 4px 14px rgba(0,0,0,.4), inset 0 0 0 1px rgba(245,158,11,.08);
  }

  /* ═══════════════════════════════════════════════════════════
     LIGHT THEME
     ═══════════════════════════════════════════════════════════ */
  html.light-theme .diff-num,
  html.light-theme #wheel-speed-extra .val { color: #0a0d13; }
  html.light-theme .diff-name,
  html.light-theme #wheel-speed-extra,
  html.light-theme #diff-eq { color: #475569; }
  html.light-theme .diff-bar { background: rgba(15,23,42,.08); }
  html.light-theme #diff-eq,
  html.light-theme #wheel-speed-extra { border-color: rgba(15,23,42,.12); }

  html.light-theme  html.light-theme  html.light-theme

  html.light-theme .tyre-speed-chip {
    background: rgba(255,255,255,.94);
    border-color: rgba(15,23,42,.16);
  }
  html.light-theme .tyre-speed-chip .tsc-val { color: #0a0d13; }
  html.light-theme #tyre-speed-left { border-color: rgba(37,99,235,.45); }
  html.light-theme #tyre-speed-right { border-color: rgba(217,119,6,.45); }

  html.light-theme #status-flash {
    color: #dc2626;
    background: rgba(255,255,255,.85);
    border-color: rgba(220,38,38,.28);
    text-shadow: 0 0 20px rgba(220,38,38,.4);
  }

  @media (max-width: 720px) {
    .tyre-speed-chip { padding: 4px 8px; }
    .tyre-speed-chip .tsc-label { font-size: 10px; }
    .tyre-speed-chip .tsc-val { font-size: 10.5px; }
  }
</style>
</head>
<body>
  <div id="canvas-wrap"></div>

  <div id="status-flash"></div>

  <svg id="tyre-dim-svg" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40;"></svg>
  <div id="tyre-speed-left" class="tyre-speed-chip" style="border-color:rgba(56,189,248,.45)">
    <span class="tsc-label" style="color:#38bdf8">Left tyre</span>
    <span class="tsc-val" id="tyre-speed-left-val">0.0 u/s</span>
  </div>
  <div id="tyre-speed-right" class="tyre-speed-chip" style="border-color:rgba(245,158,11,.45)">
    <span class="tsc-label" style="color:#f59e0b">Right tyre</span>
    <span class="tsc-val" id="tyre-speed-right-val">0.0 u/s</span>
  </div>

  <div id="labels-root"></div>

  <script src="guard.js"></script>
  <script type="importmap">
  { "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import * as Base from './kit.js';
  import { UI } from './kit.js';
  import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

  window.addEventListener('error', (e) => {
    console.error('[Differential] error:', e.error || e.message);
  });

  const DEG = Base.DEG;

  const isCoarse = matchMedia('(pointer: coarse)').matches;
  const cores    = navigator.hardwareConcurrency || 4;
  const mem      = navigator.deviceMemory || 4;
  const isLowEnd = cores <= 4 || mem <= 2;
  const isMidEnd = !isLowEnd && (cores <= 6 || isCoarse);

  const RING_TEETH    = 40;                       /* crown wheel (ratio 4 : 1 with the pinion) */
  const PINION_TEETH  = 10;
  const BEVEL_SEGS    = isLowEnd ? 4  : 6;
  const WHEEL_SEGS    = isLowEnd ? 24 : 36;
  const TRAIL_REAR_N  = isLowEnd ? 100 : 180;
  const TRAIL_FRONT_N = isLowEnd ? 70  : 120;

  /* ═══════════════════════════════════════════════════════════
     SPIRAL BEVEL GEAR GENERATOR
     ═══════════════════════════════════════════════════════════ */
  function makeSpiralBevelGear(opts) {
    const {
      outerR, innerR, toothCount, toothHeight, toothWidth,
      spiralAngle = 0.35, thickness = 0.14,
      bodyMat, toothMat, segments = 6,
      toothTaper = 0.35,
    } = opts;

    const group = new THREE.Group();
    const shape = new THREE.Shape();
    shape.absarc(0, 0, outerR, 0, Math.PI * 2, false);
    const hole = new THREE.Path();
    hole.absarc(0, 0, innerR, 0, Math.PI * 2, true);
    shape.holes.push(hole);
    const bodyGeo = new THREE.ExtrudeGeometry(shape, {
      depth: thickness, bevelEnabled: false, curveSegments: 32
    });
    bodyGeo.translate(0, 0, -thickness * 0.5);
    group.add(new THREE.Mesh(bodyGeo, bodyMat));

    const toothAngle = (Math.PI * 2) / toothCount;
    const toothGeos = [];
    for (let t = 0; t < toothCount; t++) {
      const pts = [];
      for (let s = 0; s <= segments; s++) {
        const frac = s / segments;
        const r = outerR - (outerR - innerR) * frac;
        const theta = t * toothAngle + spiralAngle * frac;
        pts.push(new THREE.Vector3(Math.cos(theta) * r, Math.sin(theta) * r, 0));
      }
      for (let s = 0; s < segments; s++) {
        const a = pts[s], b = pts[s + 1];
        const mid = a.clone().add(b).multiplyScalar(0.5);
        const dir = b.clone().sub(a);
        const segLen = dir.length() * 1.05;
        dir.normalize();
        const perp = new THREE.Vector3(-dir.y, dir.x, 0);
        const w = toothWidth * (1 - toothTaper * (s / segments));
        const h = toothHeight;
        const box = new THREE.BoxGeometry(segLen, w, h);
        const m = new THREE.Matrix4().makeBasis(dir, perp, new THREE.Vector3(0, 0, 1));
        const q = new THREE.Quaternion().setFromRotationMatrix(m);
        const pos = new THREE.Vector3(mid.x, mid.y, thickness * 0.5 + h * 0.5 - 0.008);
        const mat4 = new THREE.Matrix4().compose(pos, q, new THREE.Vector3(1, 1, 1));
        box.applyMatrix4(mat4);
        toothGeos.push(box);
      }
    }
    const merged = mergeGeometries(toothGeos, false);
    if (merged) group.add(new THREE.Mesh(merged, toothMat));
    return group;
  }

  /* ═══════════════════════════════════════════════════════════
     MATERIALS
     ═══════════════════════════════════════════════════════════ */
  const diffMats = {
    ring:    new THREE.MeshStandardMaterial({ color:0xa8b0be, metalness:0.88, roughness:0.28 }),
    teeth:   new THREE.MeshStandardMaterial({ color:0xbcc4d0, metalness:0.88, roughness:0.26 }),
    pinion:  new THREE.MeshStandardMaterial({ color:0x9aa3b0, metalness:0.88, roughness:0.30 }),
    side:    new THREE.MeshStandardMaterial({ color:0xd4a34a, metalness:0.82, roughness:0.30 }),
    spider:  new THREE.MeshStandardMaterial({ color:0xc9984a, metalness:0.82, roughness:0.32 }),
    carrier: new THREE.MeshStandardMaterial({ color:0x8fa0b8, metalness:0.55, roughness:0.35,
               transparent:true, opacity:0.16, side:THREE.DoubleSide, depthWrite:false }),
    housing: new THREE.MeshStandardMaterial({ color:0xb8c6da, metalness:0.25, roughness:0.30,
               transparent:true, opacity:0.07, side:THREE.DoubleSide, depthWrite:false }),
    frame:      new THREE.MeshStandardMaterial({ color:0x5a6577, metalness:0.80, roughness:0.32 }),
    frameDark:  new THREE.MeshStandardMaterial({ color:0x2e3742, metalness:0.70, roughness:0.42 }),
    frameAccent:new THREE.MeshStandardMaterial({ color:0x38bdf8, metalness:0.60, roughness:0.35,
                  emissive:0x38bdf8, emissiveIntensity:0.18 }),
    axle:    new THREE.MeshStandardMaterial({ color:0x7a8393, metalness:0.78, roughness:0.32 }),
    drive:   new THREE.MeshStandardMaterial({ color:0x6a7383, metalness:0.78, roughness:0.32 }),
    tyre:    new THREE.MeshStandardMaterial({ color:0x16191f, metalness:0.05, roughness:0.94 }),
    tyreGroove: new THREE.MeshStandardMaterial({ color:0x05070a, metalness:0.05, roughness:0.98 }),
    frontTyre: new THREE.MeshStandardMaterial({ color:0x16191f, metalness:0.05, roughness:0.94 }),
    rim:      new THREE.MeshStandardMaterial({ color:0xb4bdc9, metalness:0.88, roughness:0.24 }),
    rimDark:  new THREE.MeshStandardMaterial({ color:0x7a8391, metalness:0.85, roughness:0.30 }),
    hub:      new THREE.MeshStandardMaterial({ color:0xc4ccd7, metalness:0.90, roughness:0.22 }),
    frontHub: new THREE.MeshStandardMaterial({ color:0xb4bdc9, metalness:0.88, roughness:0.26 }),
    chassis: new THREE.LineBasicMaterial({ color: 0x4a5568, transparent: true, opacity: 0.35 }),
    kingpin: new THREE.MeshStandardMaterial({ color:0x6b7a8f, metalness:0.80, roughness:0.30 }),
    tieRod:  new THREE.MeshStandardMaterial({ color:0x7a8a9e, metalness:0.70, roughness:0.35 }),
    shockBody: new THREE.MeshStandardMaterial({ color:0x2b3038, metalness:0.65, roughness:0.55 }),
    shockRod:  new THREE.MeshStandardMaterial({ color:0xc4ccd7, metalness:0.92, roughness:0.18 }),
    mudFlap:   new THREE.MeshStandardMaterial({ color:0x14161a, metalness:0.05, roughness:0.95 }),
  };

  /* ═══════════════════════════════════════════════════════════
     CROSS-SECTION CLIP PLANE
     ═══════════════════════════════════════════════════════════ */
  const sectionPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  const pumpkinEdgeMat = new THREE.LineBasicMaterial({
    color: 0x38bdf8, transparent: true, opacity: 0.14
  });

  const SECTION_MATS = [
    diffMats.housing,
    diffMats.carrier,
    pumpkinEdgeMat,
  ];

  let sectionActive = false;
  function applySection(on) {
    on = !!on;
    sectionActive = on;
    SECTION_MATS.forEach(m => {
      m.clippingPlanes = on ? [sectionPlane] : null;
      m.clipIntersection = false;
      m.needsUpdate = true;
    });
  }

  /* ═══════════════════════════════════════════════════════════
     SCENE
     ═══════════════════════════════════════════════════════════ */
  const { scene, camera, renderer, controls, wrap, viewManager } = Base.buildScene({
    fov: 42, camPos: [3.2, 2.0, 4.5], target: [0, 0, 0.5], fogDensity: 0.012, floorY: -2.15
  });

  Base.attachResize(camera, renderer, wrap, 42);
  const labels = Base.createLabelSystem();
  const state = Base.createUIState();

  renderer.localClippingEnabled = true;

  try {
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
    scene.environment = envRT.texture;
    pmrem.dispose();
  } catch (e) {
    console.warn('[Differential] env map failed:', e);
  }

  const GROUND_Y = -0.44;
  const BOUNDARY_HALF = 46;                      /* arena enlarged for the circuit */
  const CLAMP_HALF    = 42;

  function isLightTheme() {
    if (document.documentElement.classList.contains('light-theme')) return true;
    if (document.body.classList.contains('light-theme')) return true;
    const dt = document.documentElement.getAttribute('data-theme');
    if (dt === 'light') return true;
    if (dt === 'dark') return false;
    if (document.body.classList.contains('light')) return true;
    if (document.body.classList.contains('dark')) return false;
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
  }

  function makeGroundTex(light) {
    const size = 512;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    g.fillStyle = light ? '#e8ecf3' : '#0a0d13';
    g.fillRect(0, 0, size, size);
    g.strokeStyle = light ? 'rgba(30,64,110,0.09)' : 'rgba(56,189,248,0.055)';
    g.lineWidth = 1;
    const div = 4;
    for (let i = 1; i < div; i++) {
      const p = Math.round((i / div) * size) + 0.5;
      g.beginPath(); g.moveTo(p, 0); g.lineTo(p, size); g.stroke();
      g.beginPath(); g.moveTo(0, p); g.lineTo(size, p); g.stroke();
    }
    g.strokeStyle = light ? 'rgba(30,64,110,0.22)' : 'rgba(56,189,248,0.14)';
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(0.5, 0.5); g.lineTo(size - 0.5, 0.5);
    g.lineTo(size - 0.5, size - 0.5); g.lineTo(0.5, size - 0.5);
    g.closePath(); g.stroke();
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(20, 20);
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  const groundMat = new THREE.MeshStandardMaterial({
    map: makeGroundTex(isLightTheme()), color: 0xffffff, roughness: 0.95, metalness: 0.05
  });
  const groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), groundMat);
  groundMesh.rotation.x = -Math.PI / 2;
  groundMesh.position.y = GROUND_Y - 0.01;
  groundMesh.receiveShadow = true;
  scene.add(groundMesh);

  const boundaryGeo = new THREE.EdgesGeometry(
    new THREE.PlaneGeometry(BOUNDARY_HALF * 2, BOUNDARY_HALF * 2)
  );
  const boundaryMat = new THREE.LineBasicMaterial({
    color: 0x38bdf8, transparent: true, opacity: 0.55
  });
  const boundaryRect = new THREE.LineSegments(boundaryGeo, boundaryMat);
  boundaryRect.rotation.x = -Math.PI / 2;
  boundaryRect.position.y = GROUND_Y + 0.005;
  scene.add(boundaryRect);

  const cornerMat = new THREE.MeshStandardMaterial({
    color: 0x38bdf8, emissive: 0x38bdf8, emissiveIntensity: 0.7
  });
  [-1, 1].forEach(sx => {
    [-1, 1].forEach(sz => {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.7, 8), cornerMat);
      post.position.set(sx * BOUNDARY_HALF, GROUND_Y + 0.35, sz * BOUNDARY_HALF);
      post.castShadow = true;
      scene.add(post);
      const cap = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 8), cornerMat);
      cap.position.set(sx * BOUNDARY_HALF, GROUND_Y + 0.72, sz * BOUNDARY_HALF);
      scene.add(cap);
    });
  });

  function applyGroundTheme() {
    const light = isLightTheme();
    const oldMap = groundMat.map;
    groundMat.map = makeGroundTex(light);
    groundMat.needsUpdate = true;
    if (oldMap) oldMap.dispose();
    if (scene.fog && scene.fog.color) scene.fog.color.set(light ? 0xc7d0dc : 0x0b0e14);
    if (scene.background && scene.background.isColor) scene.background.set(light ? 0xc7d0dc : 0x0b0e14);
    const boundaryColor = light ? 0x2563eb : 0x38bdf8;
    boundaryMat.color.set(boundaryColor);
    cornerMat.color.set(boundaryColor);
    cornerMat.emissive.set(boundaryColor);
  }
  applyGroundTheme();
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    (mq.addEventListener ? mq.addEventListener.bind(mq) : mq.addListener.bind(mq))('change', applyGroundTheme);
  }
  new MutationObserver(applyGroundTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class'] });
  new MutationObserver(applyGroundTheme).observe(document.body, { attributes: true, attributeFilter: ['class'] });

  /* ═══════════════════════════════════════════════════════════
     ROAD
     ═══════════════════════════════════════════════════════════ */
  /* ═══════════════════════════════════════════════════════════
     ROAD — a symmetric, game-style circuit (mirror-symmetric about both axes):
     a rounded-rectangle loop with a chicane bump in the middle of each long straight
     and a bulge at each end. Asphalt, kerbs, edge lines, centre dashes, start/finish line.
     ═══════════════════════════════════════════════════════════ */
  const ROAD_HALF_WIDTH = 3.4;
  const TRACK_A = 30, TRACK_B = 18, TRACK_N = 2.6;               /* half length, half width, squareness of the loop   */
  const TRACK_BUMP = 6.0, TRACK_BUMP_W = 0.6, TRACK_END = 3.0;    /* inward chicane (top/bottom) · outward end bulge    */
  const TRACK_T0 = -Math.PI / 2 - 0.65;                           /* where the lap (and the start grid) begins          */

  function buildCircuitPoints(count) {
    const DENSE = 1440, p = 2 / TRACK_N, dense = [];
    const sp = (v) => Math.sign(v) * Math.pow(Math.abs(v), p);
    const raw = [];
    for (let i = 0; i < DENSE; i++) {
      const t = TRACK_T0 + (i / DENSE) * Math.PI * 2;
      raw.push({ t, x: TRACK_A * sp(Math.cos(t)), z: TRACK_B * sp(Math.sin(t)) });
    }
    const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
    for (let i = 0; i < DENSE; i++) {
      const a = raw[(i + DENSE - 1) % DENSE], b = raw[(i + 1) % DENSE], c = raw[i];
      let tx = b.x - a.x, tz = b.z - a.z; const L = Math.hypot(tx, tz) || 1; tx /= L; tz /= L;
      const nx = -tz, nz = tx;                                    /* inward (left) normal for this direction of travel */
      let f = 0;
      [Math.PI / 2, -Math.PI / 2].forEach(c0 => { const d = wrap(c.t - c0) / TRACK_BUMP_W; f += TRACK_BUMP * Math.exp(-d * d); });

    for (let k = 0, j = 0; k < count; k++) {

  function makeTyreCarcass(radius, width, segs) {
    const halfW = width * 0.5;

    const shoulder = radius * 0.94;

    const profile = [
      new THREE.Vector2(rimSeat,             -halfW),
      new THREE.Vector2(shoulder * 0.97,     -halfW),
      new THREE.Vector2(shoulder,            -halfW * 0.90),
      new THREE.Vector2(shoulder * 1.015,    -halfW * 0.78),
      new THREE.Vector2(tread,               -halfW * 0.72),
      new THREE.Vector2(tread,                halfW * 0.72),
      new THREE.Vector2(shoulder * 1.015,     halfW * 0.78),
      new THREE.Vector2(shoulder,             halfW * 0.90),
      new THREE.Vector2(shoulder * 0.97,      halfW),
      new THREE.Vector2(rimSeat,              halfW),
    ];
    const lathe = new THREE.LatheGeometry(profile, segs);
    lathe.rotateZ(Math.PI / 2);
    const mesh = new THREE.Mesh(lathe, diffMats.tyre);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  }

  function makeWheelAssembly(radius, width, markerColor, opts = {}) {

  /* ═══════════════════════════════════════════════════════════
     CUTAWAY DIFFERENTIAL MODEL (ported in)
     Real bevel gears: teeth are swept along the pitch cone and shrink toward the apex,
     so pinion/crown and the small/large gears mesh on a shared contact line.
     Built in "model units" (crown radius ≈ 1.6) and scaled by DX.S into this scene.
     ═══════════════════════════════════════════════════════════ */
  const DX = (() => {
    const PI = Math.PI, TAU = PI * 2, S = 0.19;
    const at = (axis, u, r, a) => axis === 'x' ? [u, r * Math.cos(a), r * Math.sin(a)]
                                : axis === 'y' ? [r * Math.cos(a), u, r * Math.sin(a)]
                                :                [r * Math.cos(a), r * Math.sin(a), u];
    /* surface of revolution; prof = [[axial, radius], …]; each profile segment keeps its own vertices (crisp edges) */
    function revolve(prof, seg, axis, a0 = 0, aLen = TAU, closed = true) {
      const p = [], idx = [], n = prof.length, last = closed ? n : n - 1;
      for (let s = 0; s < last; s++) {
        const A = prof[s], B = prof[(s + 1) % n];
        if (A[0] === B[0] && A[1] === B[1]) continue;
        const base = p.length / 3;
        for (let i = 0; i <= seg; i++) { const a = a0 + aLen * i / seg; p.push(...at(axis, A[0], A[1], a), ...at(axis, B[0], B[1], a)); }
        for (let i = 0; i < seg; i++) { const v = base + i * 2; idx.push(v, v + 2, v + 1, v + 1, v + 2, v + 3); }
      }
      return { p, i: idx };
    }
    const cylinder = (axis, r, u0, u1, seg = 24) => revolve([[u0, 0], [u0, r], [u1, r], [u1, 0]], seg, axis);
    function box(w, h, d, cx, cy, cz) {
      const x = w / 2, y = h / 2, z = d / 2, V = [];
      for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) V.push([cx + sx * x, cy + sy * y, cz + sz * z]);
      const Q = [[0, 1, 3, 2], [4, 6, 7, 5], [0, 4, 5, 1], [2, 3, 7, 6], [0, 2, 6, 4], [1, 5, 7, 3]], p = [];
      for (const q of Q) for (const k of [0, 1, 2, 0, 2, 3]) p.push(...V[q[k]]);
      return { p, i: null };
    }
    function merge(list) {
      const p = [], idx = [];
      for (const g of list) {
        const base = p.length / 3;
        for (const v of g.p) p.push(v);
        if (g.i) for (const k of g.i) idx.push(k + base); else for (let k = 0; k < g.p.length / 3; k++) idx.push(base + k);
      }
      return { p, i: idx };
    }
    function xform(g, f) { const p = g.p.slice(); for (let k = 0; k < p.length; k += 3) { const q = f(p[k], p[k + 1], p[k + 2]); p[k] = q[0]; p[k + 1] = q[1]; p[k + 2] = q[2]; } return { p, i: g.i }; }
    const mkGeo = (g) => {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(g.p.map(v => v * S)), 3));
      if (g.i) geo.setIndex(g.i);
      geo.computeVertexNormals();
      return geo;
    };
    /* bevel gear in its own frame: apex at the origin, axis +Z; teeth lie on the pitch cone of half-angle `delta`.
       twist = total angular turn of every tooth from the outer end (s = 0) to the inner end (s = 1) → spiral teeth. */
    function bevelGear(o) {
      const { N, delta, dIn, dOut, toothH, twist = 0, stations = 1, phase = 0, back = 0.1, boreR = 0, hubR = 0, hubLen = 0,
              tip = 0.30, root = 0.62, sink = 0.9, bodyOff = 0.55, dStart } = o;
      const sD = Math.sin(delta), cD = Math.cos(delta), pitch = TAU / N;
      const P = (d, th, off) => { const r = d * sD + off * cD, z = d * cD - off * sD; return [r * Math.cos(th), r * Math.sin(th), z]; };
      const tp = [];
      const quad = (a, b, c, d) => { tp.push(...a, ...b, ...c, ...a, ...c, ...d); };
      for (let k = 0; k < N; k++) {
        let prev = null;
        for (let j = 0; j <= stations; j++) {
          const s = j / stations, d = dOut - (dOut - dIn) * s, h = toothH * d / dOut, th = k * pitch + phase + twist * s;
          const wR = root * pitch / 2, wT = tip * pitch / 2;
          const cur = { rL: P(d, th - wR, -sink * h * 0.5), rR: P(d, th + wR, -sink * h * 0.5), tL: P(d, th - wT, h * 0.55), tR: P(d, th + wT, h * 0.55) };
          if (j === 0) quad(cur.rL, cur.rR, cur.tR, cur.tL);
          if (prev) { quad(prev.tL, prev.tR, cur.tR, cur.tL); quad(prev.rL, prev.tL, cur.tL, cur.rL); quad(prev.rR, cur.rR, cur.tR, prev.tR); }
          if (j === stations) quad(cur.rL, cur.tL, cur.tR, cur.rR);
          prev = cur;
        }
      }
      const surf = (d) => { const off = -bodyOff * toothH * d / dOut; const r = d * sD + off * cD, z = d * cD - off * sD; return [z, r]; };
      const d0 = Math.max(dStart != null ? dStart : dIn, boreR > 0 ? boreR / sD + 0.002 : 0);
      const A = surf(d0), B = surf(dOut), zEnd = B[0] + back;
      const prof = [[A[0], boreR], A, B, [zEnd, B[1]], [zEnd, Math.max(hubR, boreR)]];
      if (hubLen > 0) prof.push([zEnd + hubLen, Math.max(hubR, boreR)], [zEnd + hubLen, boreR]); else prof.push([zEnd, boreR]);
      return { body: revolve(prof, 56, 'z'), teeth: { p: tp, i: null }, zEnd: zEnd + hubLen };
    }
    return { PI, TAU, S, revolve, cylinder, box, merge, xform, mkGeo, bevelGear };
  })();

  /* gear data (the ratios drive the animation below) */
  const DIFF_NC = RING_TEETH, DIFF_NP = PINION_TEETH;              /* crown wheel / pinion teeth   (40 : 10 = 4 : 1) */
  const DIFF_NS = 14, DIFF_NSP = 10;                               /* large (side) / small (spider) gear teeth */
  const SPIDER_RATIO = DIFF_NS / DIFF_NSP;
  const D_PINION = Math.atan2(DIFF_NP, DIFF_NC), D_CROWN = Math.PI / 2 - D_PINION;      /* pitch-cone half angles (axes at 90°) */
  const D_SPIDER = Math.atan2(DIFF_NSP, DIFF_NS), D_SIDE = Math.PI / 2 - D_SPIDER;
  const DX_XA = -1.25;                          /* crown wheel / pinion apex on the axle axis (model units); crown sits on the –X side */
  const PIN_X = DX_XA * DX.S;                   /* …in scene units */
  const CAGE_OPACITY = 0.08;                    /* the rotating cage is see-through so every gear stays visible */

  const dxStd = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, metalness: 0.28, roughness: 0.46, side: THREE.DoubleSide }, o));
  const DM = {
    crown: dxStd(0xe9a420), crownTooth: dxStd(0xf8c23c),
    green: dxStd(0x49aa4d), greenTooth: dxStd(0x6cc56f),
    blue: dxStd(0x86bce6), blueTooth: dxStd(0xa9d3f2), blueShaft: dxStd(0x8ec3ea),
    pin: dxStd(0x2f7d36), bolt: dxStd(0xc9ced6, { metalness: 0.7, roughness: 0.3 })
  };
  const cageMat = diffMats.carrier.clone();
  cageMat.transparent = true; cageMat.opacity = CAGE_OPACITY; cageMat.depthWrite = false; cageMat.side = THREE.DoubleSide;
  SECTION_MATS.push(cageMat);                   /* the existing Section toggle still cuts it */

  const dxGear = (parent, spec, matBody, matTeeth) => {
    const g = DX.bevelGear(spec), grp = new THREE.Group();
    parent.add(grp);
    grp.add(new THREE.Mesh(DX.mkGeo(g.body), matBody));
    grp.add(new THREE.Mesh(DX.mkGeo(g.teeth), matTeeth));
    grp.userData.zEnd = g.zEnd;
    return grp;
  };

  const carrierGroup = new THREE.Group();
  differentialGroup.add(carrierGroup);

  /* ── rotating cage (fully see-through): hub tubes, end wall, shell, flange lip ── */
  const shellOut = [[-1.95, 0.34], [-0.70, 0.34], [-0.70, 1.10], [-0.50, 1.22], [-0.10, 1.22], [0.30, 1.12], [0.78, 0.84], [1.00, 0.56], [1.08, 0.36], [1.30, 0.36]];
  const SHELL_T = 0.09;
  const shellIn = shellOut.map(([x, r]) => [x + (x === -0.70 ? SHELL_T : 0), Math.max(0, r - SHELL_T)]);
  const drum = new THREE.Mesh(DX.mkGeo(DX.merge([
    DX.revolve(shellOut, 64, 'x', 0, DX.TAU, false),
    DX.revolve(shellIn, 64, 'x', 0, DX.TAU, false),
    DX.revolve([[-0.70, 1.00], [-0.70, 1.15], [-0.62, 1.15], [-0.62, 1.00]], 64, 'x')
  ])), cageMat);
  carrierGroup.add(drum);

  /* flange bolt heads — they show the cage turning */
  const ringBoltMat = DM.bolt;
  const ringBolts = [];
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    const g = DX.xform(DX.cylinder('x', 0.05, -0.64, -0.55, 6), (x, y, z) => [x, y + 1.075 * Math.cos(a), z + 1.075 * Math.sin(a)]);
    const bolt = new THREE.Mesh(DX.mkGeo(g), ringBoltMat);
    carrierGroup.add(bolt);
    ringBolts.push(bolt);
  }

  /* crown wheel — MIRRORED: its teeth face +X (toward the cage, side gears and small gears); the pinion meshes on that face */
  const ringGear = dxGear(carrierGroup, {
    N: DIFF_NC, delta: D_CROWN, dIn: 0.74, dOut: 1.62, toothH: 0.085, twist: -0.30, stations: isLowEnd ? 5 : 9,
    phase: (DX.TAU / DIFF_NC) / 2,                       /* a tooth GAP sits exactly where the pinion tooth enters */
    back: 0.16, boreR: 0.345
  }, DM.crown, DM.crownTooth);
  ringGear.position.x = PIN_X;
  ringGear.rotation.y = -Math.PI / 2;                    /* local +Z → world –X */

  /* large (side) gears, with the stub of each half shaft inside the cage hub */
  const sideSpec = { N: DIFF_NS, delta: D_SIDE, dIn: 0.46, dOut: 0.90, toothH: 0.12, stations: 1,
                     phase: Math.PI / 2 + (DX.TAU / DIFF_NS) / 2, back: 0.10, boreR: 0.15, hubR: 0.22, hubLen: 0.32 };
  const sideLGroup = new THREE.Group(); carrierGroup.add(sideLGroup);
  const sideRGroup = new THREE.Group(); carrierGroup.add(sideRGroup);
  const sideGearL = dxGear(sideLGroup, sideSpec, DM.blue, DM.blueTooth); sideGearL.rotation.y = -Math.PI / 2;   /* local +Z → –X */
  const sideGearR = dxGear(sideRGroup, sideSpec, DM.blue, DM.blueTooth); sideGearR.rotation.y =  Math.PI / 2;   /* local +Z → +X */
  const STUB_L_END = shellOut[0][0] * DX.S;              /* where the visible half shaft takes over (outer end of the cage hub) */
  const STUB_R_END = shellOut[shellOut.length - 1][0] * DX.S;
  sideLGroup.add(new THREE.Mesh(DX.mkGeo(DX.cylinder('x', 0.14, shellOut[0][0], -0.20, 20)), DM.blueShaft));
  sideRGroup.add(new THREE.Mesh(DX.mkGeo(DX.cylinder('x', 0.14, 0.20, shellOut[shellOut.length - 1][0], 20)), DM.blueShaft));

  /* cross pin (vertical) + end caps, held by the cage */
  const crossPin = new THREE.Mesh(DX.mkGeo(DX.cylinder('y', 0.05, -1.0, 1.0, 14)), DM.pin);
  carrierGroup.add(crossPin);
  const crossPinCaps = [];
  [[1.0, 1.06], [-1.06, -1.0]].forEach(([u0, u1]) => {
    const b = new THREE.Mesh(DX.mkGeo(DX.cylinder('y', 0.075, u0, u1, 10)), DM.pin);
    carrierGroup.add(b);
    crossPinCaps.push(b);
  });

  /* small gears (spiders): top and bottom, spin about the cross pin */
  const SPIDER_MARKER_MAT = new THREE.MeshBasicMaterial({ color: 0xff5c8a });
  const spiderSpec = { N: DIFF_NSP, delta: D_SPIDER, dIn: 0.46, dOut: 0.90, toothH: 0.12, stations: 1,
                       phase: Math.PI, back: 0.08, boreR: 0.07, hubR: 0.14, hubLen: 0.32 };
  const spiderTopGroup = new THREE.Group(); carrierGroup.add(spiderTopGroup);
  const spiderBotGroup = new THREE.Group(); carrierGroup.add(spiderBotGroup);
  dxGear(spiderTopGroup, spiderSpec, DM.green, DM.greenTooth).rotation.x = -Math.PI / 2;   /* local +Z → +Y */
  dxGear(spiderBotGroup, spiderSpec, DM.green, DM.greenTooth).rotation.x =  Math.PI / 2;   /* local +Z → –Y */
  const spiderTopMarker = new THREE.Mesh(DX.mkGeo(DX.box(0.05, 0.14, 0.05,  0.13,  1.06, 0)), SPIDER_MARKER_MAT);
  spiderTopGroup.add(spiderTopMarker);
  const spiderBotMarker = new THREE.Mesh(DX.mkGeo(DX.box(0.05, 0.14, 0.05,  0.13, -1.06, 0)), SPIDER_MARKER_MAT);
  spiderBotGroup.add(spiderBotMarker);

  const axleAssemblyL = new THREE.Group(); differentialGroup.add(axleAssemblyL);
  const axleAssemblyR = new THREE.Group(); differentialGroup.add(axleAssemblyR);

  /* visible half shafts now start where the cage hubs end (the stubs above carry them into the side gears) */
  const AXLE_OUT = SIDE_X + AXLE_LEN - 0.15;                         /* wheel end of the half shafts (unchanged: 1.62) */
  const AXLE_L_LEN = AXLE_OUT + STUB_L_END,  AXLE_L_MID = (-AXLE_OUT + STUB_L_END) / 2;
  const AXLE_R_LEN = AXLE_OUT - STUB_R_END,  AXLE_R_MID = ( AXLE_OUT + STUB_R_END) / 2;

  const axleL = new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.085,AXLE_L_LEN,16), diffMats.axle);
  axleL.rotation.z = Math.PI / 2; axleL.position.x = AXLE_L_MID;
  axleAssemblyL.add(axleL);
  const axleR = new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.085,AXLE_R_LEN,16), diffMats.axle);
  axleR.rotation.z = Math.PI / 2; axleR.position.x = AXLE_R_MID;
  axleAssemblyR.add(axleR);

  const HUB_FLANGE_X = SIDE_X + AXLE_LEN - 0.20;
  [[-1, axleAssemblyL], [1, axleAssemblyR]].forEach(([dir, assembly]) => {
    const f = new THREE.Mesh(new THREE.CylinderGeometry(0.20,0.20,0.05,24), diffMats.hub);
    f.rotation.z = Math.PI / 2; f.position.x = dir * HUB_FLANGE_X;
    assembly.add(f);
    for (let i = 0; i < 5; i++) {
      const a = (i/5)*Math.PI*2;
      const lug = new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.04,6), diffMats.hub);
      lug.rotation.z = Math.PI / 2;
      lug.position.set(dir*(HUB_FLANGE_X+0.03), Math.cos(a)*0.12, Math.sin(a)*0.12);
      assembly.add(lug);
    }
  });

  const DUAL_TYRE_GAP = 0.30;

  const wheelL = makeWheelAssembly(WHEEL_R, WHEEL_WIDTH, 0x38bdf8, { showDual: -1 });
  wheelL.position.x = wheelLX;
  differentialGroup.add(wheelL);

  const wheelR = makeWheelAssembly(WHEEL_R, WHEEL_WIDTH, 0xf59e0b, { showDual: 1 });
  wheelR.position.x = wheelRX;
  differentialGroup.add(wheelR);

  /* pinion: on the axle axis, shaft pointing forward (+Z); it meshes with the teeth-side (+X face) of the mirrored crown wheel */
  const pinionGroup = new THREE.Group();
  pinionGroup.position.set(PIN_X, 0, 0);
  differentialGroup.add(pinionGroup);
  const pinionSpinGroup = new THREE.Group(); pinionGroup.add(pinionSpinGroup);

  const pinionGearData = DX.bevelGear({ N: DIFF_NP, delta: D_PINION, dIn: 0.74, dOut: 1.62, toothH: 0.085, twist: 0.80,
                                        stations: isLowEnd ? 6 : 12, phase: Math.PI, back: 0.12, hubR: 0.16, hubLen: 0, dStart: 0.74 });
  pinionSpinGroup.add(new THREE.Mesh(DX.mkGeo(pinionGearData.body), DM.green));
  pinionSpinGroup.add(new THREE.Mesh(DX.mkGeo(pinionGearData.teeth), DM.greenTooth));
  const PINION_ZEND = pinionGearData.zEnd * DX.S;

  const pinionBearing = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.015, 8, 24), diffMats.housing);
  pinionBearing.position.z = PINION_ZEND + 0.01; pinionGroup.add(pinionBearing);

  const driveAssembly = new THREE.Group();
  driveAssembly.position.z = PINION_ZEND - 0.02;
  pinionSpinGroup.add(driveAssembly);
  const driveShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,1.2,16), diffMats.drive);
  driveShaft.rotation.x = Math.PI / 2; driveShaft.position.z = 0.6;
  driveAssembly.add(driveShaft);

  const yoke1 = new THREE.Group(); yoke1.position.z = 1.2; driveAssembly.add(yoke1);
  const y1L = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.25,0.10), diffMats.drive);
  y1L.position.set(0, 0.12, -0.05); yoke1.add(y1L);
  const y1R = y1L.clone(); y1R.position.y = -0.12; yoke1.add(y1R);

  const ujCross = new THREE.Group(); ujCross.position.z = 1.25; driveAssembly.add(ujCross);
  const cV = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.30,8), diffMats.spider); ujCross.add(cV);
  const cH = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.30,8), diffMats.spider); cH.rotation.z = Math.PI/2; ujCross.add(cH);
  ujCross.add(new THREE.Mesh(new THREE.SphereGeometry(0.05,12,8), diffMats.spider));

  const yoke2 = new THREE.Group(); yoke2.position.z = 1.3; driveAssembly.add(yoke2);
  const y2L = new THREE.Mesh(new THREE.BoxGeometry(0.25,0.05,0.10), diffMats.drive);
  y2L.position.set(0.12, 0, -0.05); yoke2.add(y2L);
  const y2R = y2L.clone(); y2R.position.x = -0.12; yoke2.add(y2R);

  const engineFlange = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,0.06,20), diffMats.drive);
  engineFlange.rotation.x = Math.PI / 2; engineFlange.position.z = 1.42; driveAssembly.add(engineFlange);

  const housingGroup = new THREE.Group(); differentialGroup.add(housingGroup);
  const PUMPKIN_R = RING_R * 1.05;

  const pumpkinGeo = new THREE.SphereGeometry(PUMPKIN_R, 24, 16);
  const pumpkinMesh = new THREE.Mesh(pumpkinGeo, diffMats.housing);
  housingGroup.add(pumpkinMesh);

  const pumpkinEdges = new THREE.LineSegments(
    new THREE.WireframeGeometry(pumpkinGeo),
    pumpkinEdgeMat
  );
  housingGroup.add(pumpkinEdges);
  /* stretch the ghost housing so it wraps the crown wheel as well as the cage */
  [pumpkinMesh, pumpkinEdges].forEach(o => { o.scale.set(1.27, 1.08, 1.08); o.position.x = -0.10; });

  const housingAxleTubes = [];
  const housingTorusCollars = [];
  [-1,1].forEach(dir => {
    const tube = new THREE.Mesh(
      new THREE.CylinderGeometry(0.28, 0.28, 1.8, 20, 1, true),
      diffMats.housing
    );
    tube.rotation.z = Math.PI / 2;
    tube.position.x = dir * 1.2;
    housingGroup.add(tube);
    housingAxleTubes.push(tube);

    const tf = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.05, 8, 20), diffMats.housing);
    tf.rotation.y = Math.PI / 2;
    tf.position.x = dir * 2.1;
    housingGroup.add(tf);
    housingTorusCollars.push(tf);
  });

  const frontCover = new THREE.Mesh(
    new THREE.SphereGeometry(RING_R*0.85, 24, 16, 0, Math.PI*2, 0, Math.PI/2),
    diffMats.housing
  );
  frontCover.rotation.x = -Math.PI / 2;
  frontCover.position.z = -0.3;
  housingGroup.add(frontCover);

  /* ═══════════════════════════════════════════════════════════
     TORQUE FLOW ARROWS
     Cones placed along the driveline path. Each pulses with a
     phase offset so the "flow" visually travels through the diff.
     ═══════════════════════════════════════════════════════════ */
  const flowArrows = [];
  function makeFlowArrow(x, y, z, dir, color, phase) {
    const geo = new THREE.ConeGeometry(0.055, 0.16, 12);
    const mat = new THREE.MeshBasicMaterial({
      color,
      transparent: true,
      opacity: 0.85,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);

    /* Orient cone (+Y default) along the requested direction */
    if (dir === '+X') mesh.rotation.z = -Math.PI / 2;
    else if (dir === '-X') mesh.rotation.z = Math.PI / 2;
    else if (dir === '+Z') mesh.rotation.x = Math.PI / 2;
    else if (dir === '-Z') mesh.rotation.x = -Math.PI / 2;
    else if (dir === '-Y') mesh.rotation.x = Math.PI;

    mesh.userData.phase = phase;
    differentialGroup.add(mesh);
    flowArrows.push(mesh);
    return mesh;
  }

  /* Input flow (cyan) — engine → pinion */
  makeFlowArrow(PIN_X, 0, 1.05, '-Z', 0x38bdf8, 0);
  makeFlowArrow(PIN_X, 0, 0.75, '-Z', 0x38bdf8, Math.PI * 0.5);
  /* Pinion → crown wheel (cyan) */
  makeFlowArrow(PIN_X, 0, 0.47, '-Z', 0x38bdf8, Math.PI);
  /* Crown → side gears (amber, split) */
  makeFlowArrow(-SIDE_X - 0.20, 0, 0, '-X', 0xf59e0b, Math.PI * 1.5);
  makeFlowArrow( SIDE_X + 0.20, 0, 0, '+X', 0xf59e0b, Math.PI * 1.5);
  /* Side gears → wheels (amber) */
  makeFlowArrow(-1.05, 0, 0, '-X', 0xf59e0b, Math.PI * 2);
  makeFlowArrow( 1.05, 0, 0, '+X', 0xf59e0b, Math.PI * 2);

  /* ═══════════════════════════════════════════════════════════
     EXPLODED VIEW REGISTRATION
     Each part stores its base position and a direction vector.
     explodeAmount lerps 0↔1 and offsets all registered parts.
     ═══════════════════════════════════════════════════════════ */
  const explodedParts = [];
  function registerExplode(obj, dx, dy, dz) {
    obj.userData.explode = {
      base: obj.position.clone(),
      dir: new THREE.Vector3(dx, dy, dz)
    };
    explodedParts.push(obj);
  }

  registerExplode(ringGear,         -0.70,  0.00,  0.00);
  registerExplode(sideLGroup,       -0.55,  0.00,  0.00);
  registerExplode(sideRGroup,        0.55,  0.00,  0.00);
  registerExplode(spiderTopGroup,    0.00,  0.90,  0.00);
  registerExplode(spiderBotGroup,    0.00, -0.90,  0.00);
  registerExplode(crossPin,          0.00,  0.62,  0.00);
  registerExplode(crossPinCaps[0],   0.00,  0.62,  0.00);
  registerExplode(crossPinCaps[1],   0.00,  0.62,  0.00);
  registerExplode(drum,              0.00,  0.50,  0.00);
  registerExplode(pinionGroup,       0.00, -0.55,  0.00);
  registerExplode(axleAssemblyL,    -0.35,  0.00,  0.00);
  registerExplode(axleAssemblyR,     0.35,  0.00,  0.00);
  registerExplode(pumpkinMesh,       0.00,  1.10,  0.00);
  registerExplode(pumpkinEdges,      0.00,  1.10,  0.00);
  registerExplode(housingAxleTubes[0], -0.50, 0.00, 0.00);
  registerExplode(housingAxleTubes[1],  0.50, 0.00, 0.00);
  registerExplode(housingTorusCollars[0], -0.70, 0.00, 0.00);
  registerExplode(housingTorusCollars[1],  0.70, 0.00, 0.00);
  registerExplode(frontCover,        0.00,  0.00, -0.55);

  let explodeAmount = 0;
  let explodeTarget = 0;
  function updateExplode(dt) {
    const k = Math.min(1, dt * 3.0);
    explodeAmount += (explodeTarget - explodeAmount) * k;
    if (Math.abs(explodeAmount - explodeTarget) < 0.001) explodeAmount = explodeTarget;
    explodedParts.forEach(obj => {
      const ex = obj.userData.explode;
      if (!ex) return;
      obj.position.copy(ex.base).addScaledVector(ex.dir, explodeAmount);
    });
  }

  /* ═══════════════════════════════════════════════════════════
     SUSPENSION — leaf springs, shocks, mud flaps
     ═══════════════════════════════════════════════════════════ */
  const suspensionParts = [];

  /* Rear leaf springs — 4 stacked leaves each side, sitting under the rail */
  [-1, 1].forEach(side => {
    const springX = side * 0.55;
    const zStart = -1.55;
    const zEnd = 0.55;
    const zCenter = (zStart + zEnd) * 0.5;
    const len = zEnd - zStart;
    const leafCount = 4;
    for (let i = 0; i < leafCount; i++) {
      const t = i / (leafCount - 1);
      const leafLen = len * (1 - t * 0.35);
      const leafH = 0.028;
      const leaf = new THREE.Mesh(
        new THREE.BoxGeometry(0.11, leafH, leafLen),
        i === 0 ? diffMats.frame : diffMats.frameDark
      );
      leaf.position.set(springX, -0.09 - i * (leafH + 0.008), zCenter);
      leaf.castShadow = true;
      vehicleGroup.add(leaf);
      suspensionParts.push(leaf);
    }

    /* U-bolt blocks at each end */
    [zStart + 0.15, zEnd - 0.15].forEach(zPos => {
      const clamp = new THREE.Mesh(
        new THREE.BoxGeometry(0.14, 0.10, 0.08),
        diffMats.frameDark
      );
      clamp.position.set(springX, -0.16, zPos);
      vehicleGroup.add(clamp);
      suspensionParts.push(clamp);
    });
  });

  /* Shock absorbers — one per corner */
  function makeShockUnit(totalLen) {
    const g = new THREE.Group();
    const bodyLen = totalLen * 0.55;
    const rodLen = totalLen * 0.45;
    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(0.035, 0.035, bodyLen, 10),
      diffMats.shockBody
    );
    body.position.y = -bodyLen / 2;
    g.add(body);

    const rod = new THREE.Mesh(
      new THREE.CylinderGeometry(0.018, 0.018, rodLen, 8),
      diffMats.shockRod
    );
    rod.position.y = rodLen / 2;
    g.add(rod);

    const boot = new THREE.Mesh(
      new THREE.CylinderGeometry(0.042, 0.042, bodyLen * 0.35, 10),
      diffMats.shockBody
    );
    boot.position.y = -bodyLen * 0.1;
    g.add(boot);

    return g;
  }

  const shockDefs = [
    /* Rear left, rear right */
    { from: new THREE.Vector3( 1.02, -0.18,  0.00), to: new THREE.Vector3( 0.62,  0.18, -0.32) },
    { from: new THREE.Vector3(-1.02, -0.18,  0.00), to: new THREE.Vector3(-0.62,  0.18, -0.32) },
    /* Front left, front right */
    { from: new THREE.Vector3( 0.96, -0.16,  2.80), to: new THREE.Vector3( 0.62,  0.18,  2.55) },
    { from: new THREE.Vector3(-0.96, -0.16,  2.80), to: new THREE.Vector3(-0.62,  0.18,  2.55) },
  ];
  shockDefs.forEach(def => {
    const len = def.from.distanceTo(def.to);
    const shock = makeShockUnit(len);
    const dir = def.to.clone().sub(def.from).normalize();
    shock.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    shock.position.copy(def.from).addScaledVector(dir, len * 0.5);
    vehicleGroup.add(shock);
    suspensionParts.push(shock);
  });

  /* Mud flaps — hanging behind each rear wheel */
  [-1, 1].forEach(side => {
    const flapX = side * Math.abs(wheelLX) * 0.92;
    const flap = new THREE.Mesh(
      new THREE.BoxGeometry(0.26, 0.34, 0.018),
      diffMats.mudFlap
    );
    flap.position.set(flapX, -0.22, -0.38);
    flap.rotation.x = 0.16;
    flap.castShadow = true;
    vehicleGroup.add(flap);
    suspensionParts.push(flap);

    /* Small bracket at the top attaching it to the rail */
    const bracket = new THREE.Mesh(
      new THREE.BoxGeometry(0.06, 0.06, 0.06),
      diffMats.frameDark
    );
    bracket.position.set(flapX, -0.04, -0.36);
    vehicleGroup.add(bracket);
    suspensionParts.push(bracket);
  });

  /* ═══════════════════════════════════════════════════════════
     ISOLATION MODE
     When the "Diff" camera preset is active, hide chassis, wheels,
     suspension, shadows and trails so the differential reads alone.
     ═══════════════════════════════════════════════════════════ */
  const isolationHiddenParts = [];
  vehicleGroup.children.forEach(child => {
    if (child === differentialGroup) return;
    isolationHiddenParts.push(child);
  });
  isolationHiddenParts.push(wheelL, wheelR);
  /* NOTE: contact shadows are registered later, once they exist. */

  let isolationActive = false;
  function setIsolation(on) {
    on = !!on;
    isolationActive = on;
    isolationHiddenParts.forEach(o => { if (o) o.visible = !on; });
    trailRearL.points.visible  = !on;
    trailRearR.points.visible  = !on;
    trailFrontL.points.visible = !on;
    trailFrontR.points.visible = !on;
  }

  /* ═══════════════════════════════════════════════════════════
     FRONT AXLE
     ═══════════════════════════════════════════════════════════ */
  const frontAxleGroup = new THREE.Group();
  frontAxleGroup.position.set(0, 0, FRONT_AXLE_Z);
  vehicleGroup.add(frontAxleGroup);

  const frontBeam = new THREE.Mesh(
    new THREE.CylinderGeometry(0.06, 0.06, FRONT_TRACK + 0.4, 10),
    new THREE.MeshStandardMaterial({ color: 0x4a5568, metalness: 0.7, roughness: 0.4 })
  );
  frontBeam.rotation.z = Math.PI / 2;
  frontAxleGroup.add(frontBeam);

  [-1, 1].forEach(dir => {
    const kp = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.40, 8), diffMats.kingpin);
    kp.position.set(dir * (FRONT_TRACK/2), -0.05, 0);
    frontAxleGroup.add(kp);
  });

  const frontPivotL = new THREE.Group();
  frontPivotL.position.set(-FRONT_TRACK/2, 0, 0);
  frontAxleGroup.add(frontPivotL);
  const frontWheelL = makeWheelAssembly(FRONT_WHEEL_R, 0.22, 0x38bdf8, { rimScale: 0.62, spokeCount: 5 });
  frontPivotL.add(frontWheelL);

  const frontPivotR = new THREE.Group();
  frontPivotR.position.set(FRONT_TRACK/2, 0, 0);
  frontAxleGroup.add(frontPivotR);
  const frontWheelR = makeWheelAssembly(FRONT_WHEEL_R, 0.22, 0xf59e0b, { rimScale: 0.62, spokeCount: 5 });
  frontPivotR.add(frontWheelR);

  const tieRod = new THREE.Mesh(
    new THREE.CylinderGeometry(0.03, 0.03, FRONT_TRACK - 0.2, 8), diffMats.tieRod);
  tieRod.rotation.z = Math.PI / 2;
  tieRod.position.set(0, -0.20, 0.28);
  frontAxleGroup.add(tieRod);

  isolationHiddenParts.push(frontAxleGroup);

  /* ═══════════════════════════════════════════════════════════
     CONTACT SHADOWS
     ═══════════════════════════════════════════════════════════ */
  function makeContactShadowTex() {
    const size = 128;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    grad.addColorStop(0,    'rgba(0,0,0,0.60)');
    grad.addColorStop(0.55, 'rgba(0,0,0,0.22)');
    grad.addColorStop(1,    'rgba(0,0,0,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }
  const contactShadowMat = new THREE.MeshBasicMaterial({
    map: makeContactShadowTex(),
    transparent: true,
    depthWrite: false,
    opacity: 0.9
  });
  function makeContactShadow(size) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), contactShadowMat);
    m.rotation.x = -Math.PI / 2;
    m.renderOrder = 1;
    return m;
  }
  const shadowRL = makeContactShadow(1.15);
  const shadowRR = makeContactShadow(1.15);
  const shadowFL = makeContactShadow(1.00);
  const shadowFR = makeContactShadow(1.00);
  scene.add(shadowRL, shadowRR, shadowFL, shadowFR);

  /* Register shadows with isolation mode now that they exist */
  isolationHiddenParts.push(shadowRL, shadowRR, shadowFL, shadowFR);

  /* Ground trails */
  class Trail {
    constructor(count, colorHex, size = 0.10) {
      this.count = count;
      this.idx = 0;
      this.positions = new Float32Array(count * 3);
      this.colors = new Float32Array(count * 3);
      this.baseColor = new THREE.Color(colorHex);
      for (let i = 0; i < count; i++) this.positions[i*3+1] = -999;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(this.colors, 3));
      const mat = new THREE.PointsMaterial({
        size, vertexColors: true, transparent: true,
        depthWrite: false, sizeAttenuation: true, opacity: 0.95
      });
      this.points = new THREE.Points(geo, mat);
      this.points.frustumCulled = false;
    }
    add(x, y, z) {
      const i = this.idx;
      this.positions[i*3]   = x; this.positions[i*3+1] = y; this.positions[i*3+2] = z;
      this.colors[i*3]   = this.baseColor.r;
      this.colors[i*3+1] = this.baseColor.g;
      this.colors[i*3+2] = this.baseColor.b;
      this.idx = (this.idx + 1) % this.count;
    }
    fade(f) { const c = this.colors; for (let i = 0; i < c.length; i++) c[i] *= f; }
    commit() {
      this.points.geometry.attributes.position.needsUpdate = true;
      this.points.geometry.attributes.color.needsUpdate = true;
    }
    clear() {
      for (let i = 0; i < this.count; i++) {
        this.positions[i*3+1] = -999;
        this.colors[i*3] = this.colors[i*3+1] = this.colors[i*3+2] = 0;
      }
      this.commit();
    }
  }

  const trailRearL  = new Trail(TRAIL_REAR_N, 0x38bdf8, 0.11);
  const trailRearR  = new Trail(TRAIL_REAR_N, 0xf59e0b, 0.11);
  const trailFrontL = new Trail(TRAIL_FRONT_N, 0x22d3ee, 0.09);
  const trailFrontR = new Trail(TRAIL_FRONT_N, 0xfbbf24, 0.09);
  scene.add(trailRearL.points, trailRearR.points, trailFrontL.points, trailFrontR.points);

  const labelDefs = [
    { id:'ring',    text:'Crown wheel',     pos: new THREE.Vector3(-0.30, 0.24, 0.12) },
    { id:'pinion',  text:'Prop-shaft pinion', pos: new THREE.Vector3(-0.19, 0.05, 0.20) },
    { id:'drive',   text:'Propeller shaft', pos: new THREE.Vector3(PIN_X, 0.0, 1.10) },
    { id:'carrier', text:'Carrier',         pos: new THREE.Vector3(0.14, 0.26, 0) },
    { id:'spider',  text:'Half-shaft pinions', pos: new THREE.Vector3(0.03, 0.13, 0.10) },
    { id:'sideL',   text:'Side gear (L)',   pos: new THREE.Vector3(-0.09,-0.10, 0.12) },
    { id:'sideR',   text:'Side gear (R)',   pos: new THREE.Vector3(0.09,-0.10, 0.12) },
    { id:'axleL',   text:'Half shaft (L)',  pos: new THREE.Vector3(-1.55, 0.35, 0.35) },
    { id:'axleR',   text:'Half shaft (R)',  pos: new THREE.Vector3(1.55, 0.35, 0.35) },
    { id:'wheelL',  text:'Rear wheel',      pos: new THREE.Vector3(-2.05,-0.35, 0) },
    { id:'wheelR',  text:'Rear wheel',      pos: new THREE.Vector3(2.05,-0.35, 0) },
    { id:'frontL',  text:'Front L (steer)', pos: new THREE.Vector3(-1.55,-0.55, FRONT_AXLE_Z + 0.15) },
    { id:'frontR',  text:'Front R (steer)', pos: new THREE.Vector3(1.55,-0.55, FRONT_AXLE_Z + 0.15) },
  ];
  labelDefs.forEach(d => labels.add(d.id, d.text));

  /* ═══════════════════════════════════════════════════════════
     AUTO DRIVE
     ═══════════════════════════════════════════════════════════ */
  let autoDrive = true;
    function disengageAutoDrive() {
    if (autoDrive) { autoDrive = false; ui.controls.set('autodrive', false); }
  }

  const AUTO_LOOKAHEAD   = 5.5;
  const AUTO_STEER_RATE  = 3.2;
  const roadSamplePts    = roadCurve.getSpacedPoints(480);
  const roadSampleStepLen = roadCurve.getLength() / roadSamplePts.length;

  function nearestRoadIndex(pos) {
    let best = 0, bestD = Infinity;
    for (let i = 0; i < roadSamplePts.length; i++) {
      const d = roadSamplePts[i].distanceToSquared(pos);
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  function computeAutoSteerInput(pos, heading) {
    const nearest = nearestRoadIndex(pos);
    const stepsAhead = Math.max(1, Math.round(AUTO_LOOKAHEAD / roadSampleStepLen));
    const target = roadSamplePts[(nearest + stepsAhead) % roadSamplePts.length];
    const dx = target.x - pos.x, dz = target.z - pos.z;
    const cosH = Math.cos(heading), sinH = Math.sin(heading);
    const localX = dx * cosH - dz * sinH;
    const localZ = dx * sinH + dz * cosH;
    const Ld = Math.max(0.75, Math.sqrt(localX * localX + localZ * localZ));
    const curvature = 2 * localX / (Ld * Ld);
    const desiredRoadAngle = Math.atan(WHEELBASE * curvature);
    return Math.max(-1, Math.min(1, -desiredRoadAngle / MAX_ROAD_ANGLE));
  }

  /* ═══════════════════════════════════════════════════════════
     STEERING STATE
     ═══════════════════════════════════════════════════════════ */
  let steerAngle = 0, steerInput = 0;   /* radians, > 0 = clockwise; the 'wheel' dial owns the value */

  /* ═══════════════════════════════════════════════════════════
     UI — kit-driven chrome + module widgets
     ═══════════════════════════════════════════════════════════ */
  let diffLocked = false;
  let tractionMode = 'none';
  let camMode = 'orbit';

  /* Widget DOM refs (assigned in onMount) */

  const ui = UI.create({
    moduleId: 'differential',

    panel: {

      badge:  { text: 'Differential', color: '#eab308' },
      readout: `

            <span class="diff-num" data-diff="left-val">1.00×</span>
          </div>
          <div class="diff-row">
            <span class="diff-name"><span class="diff-dot" style="background:#94a3b8;color:#94a3b8"></span>Carrier</span>
            <div class="diff-bar"><div class="diff-fill" style="background:#94a3b8;color:#94a3b8;width:50%"></div></div>
            <span class="diff-num" data-diff="carrier-val">1.00×</span>
          </div>
          <div class="diff-row">
            <span class="diff-name"><span class="diff-dot" style="background:#f59e0b;color:#f59e0b"></span>Right</span>
            <div class="diff-bar"><div class="diff-fill" data-diff="fill-right" style="background:#f59e0b;color:#f59e0b;width:50%"></div></div>
            <span class="diff-num" data-diff="right-val">1.00×</span>
          </div>
        </div>
        <div id="diff-eq">ω<sub>L</sub> + ω<sub>R</sub> = 2 ω<sub>C</sub></div>
        <div id="wheel-speed-extra">
          <div class="row"><span>↻ Turn radius</span><span class="val" data-diff="turn-radius">∞</span></div>
          <div class="row" id="diff-mode-row"><span>⚙ Diff state</span><span class="val" data-diff="mode">Open</span></div>
        </div>
      `,
      desc: `<strong>Differential.</strong> The engine (front) drives the propeller shaft, which turns the
             spiral-bevel pinion, which drives the crown wheel (ring gear) and its carrier. Driving straight,
             the spider gears ride along without spinning, so both axles turn at the same speed. In a turn the
             outer wheel travels further than the inner one — the spider gears now spin on their pins, letting
             the two side gears turn at different speeds.`
    },

    monitor: {
      config: { label: 'Vehicle speed', value: { label: 'Vehicle speed', unit: 'u/s', max: 100, bar: true }, rows: [['rpmL', 'Rear L'], ['rpmR', 'Rear R'], ['rpm', 'Input speed']], status: { text: 'Open' } },
      initial: { value: { text: '0', unit: 'u/s' }, rows: { rpmL: '0 rpm', rpmR: '0 rpm', rpm: '—' }, status: ['Open', false] }
    },

    toolbar: {
      play: true, reset: true,
      speed: { label: 'Speed', min: 0.15, max: 2.5, step: 0.05, value: 0.85 },
      labels: true, gas: true
    },

    /* Phase 6: traction, the four display toggles and the camera preset are controls.js controls in the dock options row */
    options: [
      { id: 'traction', type: 'choice', layout: 'select', label: 'Traction', ariaLabel: 'Traction mode',
        options: [{ id: 'none', label: 'Full grip' }, { id: 'left', label: 'Left wheel slip' }, { id: 'right', label: 'Right wheel slip' }],
        onChange: (id) => { tractionMode = id; } },
      { id: 'locked', type: 'toggle', label: 'Locked', ariaLabel: 'Locked differential', onChange: (on) => { diffLocked = on; } },
      { id: 'autodrive', type: 'toggle', label: 'Auto drive', def: true, onChange: (on) => { autoDrive = on; } },
      { id: 'section', type: 'toggle', label: 'Section', onChange: (on) => { applySection(on); } },
      { id: 'explode', type: 'toggle', label: 'Explode', onChange: (on) => { explodeTarget = on ? 1 : 0; } },
      { id: 'camera', type: 'choice', layout: 'select', label: 'Camera', ariaLabel: 'Camera preset',

        onChange: (id) => { const prev = camMode; camMode = id; if ((prev === 'diff') !== (camMode === 'diff')) setIsolation(camMode === 'diff'); } }
    ],

    /* Phase 5: the steering wheel is a controls.js dial (id 'wheel'). Range = ±MAX_STEER_ANGLE (±129.6°), clockwise =
       right = positive, exactly the old steerAngle sign (steerInput = dial). It springs back to centre unless Auto
       Drive is steering (the module then drives it with controls.set, which never springs). Enter / Home = centre.
       k = 4.14 s⁻¹ is the old return rate 4.0 (0.933 / frame at 60 Hz) as a time constant. */
    axes: [
      { id: 'wheel', type: 'dial', look: 'wheel', label: 'Steering', ariaLabel: 'Steering wheel',
        range: 2 * MAX_STEER_ANGLE * 180 / Math.PI, def: 0, step: 1, spring: 'return', k: 4.14, side: 'right',
        onGrab: (on) => { if (on) disengageAutoDrive(); } }
    ]
  });

  /* ── panel readout element handles ── */
  const panelBody   = ui.panel.body;
  const elLeftVal   = panelBody ? panelBody.querySelector('[data-diff="left-val"]')   : null;
  const elRightVal  = panelBody ? panelBody.querySelector('[data-diff="right-val"]')  : null;
  const elFillL     = panelBody ? panelBody.querySelector('[data-diff="fill-left"]')  : null;
  const elFillR     = panelBody ? panelBody.querySelector('[data-diff="fill-right"]') : null;
  const elTurnR     = panelBody ? panelBody.querySelector('[data-diff="turn-radius"]'): null;
  const elDiffMode  = panelBody ? panelBody.querySelector('[data-diff="mode"]')       : null;

  /* ═══════════════════════════════════════════════════════════
     CAMERA PRESETS
     ═══════════════════════════════════════════════════════════ */
  function resetAll() {
    ui.controls.resetAll();                       /* wheel back to centre */
    steerAngle = 0; steerInput = 0;
    autoDrive = true;                              /* the toggles themselves are reset by controls.resetAll() above */
    vehiclePos.copy(START_POS); vehicleHeading = START_HEADING;
    vehicleGroup.position.copy(vehiclePos);
    vehicleGroup.rotation.set(0, vehicleHeading, 0);
    trailRearL.clear(); trailRearR.clear();
    trailFrontL.clear(); trailFrontR.clear();
    explodeTarget = 0; explodeAmount = 0;
    flowArrows.forEach(a => { a.visible = true; });
    if (controls && controls.target) { controls.target.set(vehiclePos.x, 0.5, vehiclePos.z + 0.5); camera.position.set(vehiclePos.x + 3.2, 2.0, vehiclePos.z + 4.5); }
    bodyRoll = 0; bodyPitch = 0; lastV = 0;
    camMode = 'orbit';
    setIsolation(false);
  }

  /* ═══════════════════════════════════════════════════════════
     BRIDGE
     ═══════════════════════════════════════════════════════════ */
  const bridge = ui.wireBridge({
    viewManager,
    state,
    onCommand: (d) => {
      switch (d.action) {
        case 'reset': resetAll(); break;
      }
    }
  });
  bridge.ready();

  /* ═══════════════════════════════════════════════════════════
     KINEMATICS
     ═══════════════════════════════════════════════════════════ */
  let phCarrier = 0, phSideL = 0, phSideR = 0, phSpider = 0, phPinion = 0;
  let phFrontL = 0, phFrontR = 0;
  let trailAccum = 0;
  let bodyRoll = 0, bodyPitch = 0, lastV = 0;
  let flowTime = 0;

  const statusFlash = document.getElementById('status-flash');
  let flashTimer = 0;
  function setFlash(msg) {
    if (!statusFlash) return;
    statusFlash.textContent = msg;
    statusFlash.classList.add('on');
    flashTimer = 0.9;
  }

  function ackermannAngles(roadAngle) {
    const absA = Math.abs(roadAngle);
    if (absA < 1e-4) return { inner: 0, outer: 0 };
    const R = WHEELBASE / Math.tan(absA);
    const inner = Math.atan(WHEELBASE / (R - FRONT_TRACK/2));
    const outer = Math.atan(WHEELBASE / (R + FRONT_TRACK/2));
    return { inner, outer };
  }

  const _l2w_scratch = { x: 0, z: 0 };

  const _sectionN = new THREE.Vector3();
  const _vehicleQuat = new THREE.Quaternion();
  function updateSectionPlane() {
    if (!sectionActive) return;
    vehicleGroup.getWorldQuaternion(_vehicleQuat);
    _sectionN.set(0, 0, 1).applyQuaternion(_vehicleQuat).normalize();
    sectionPlane.normal.copy(_sectionN);
    sectionPlane.constant = -_sectionN.dot(vehicleGroup.position);
  }

  function updateDiff(dt) {
    if (autoDrive && !ui.controls.dragging('wheel')) {
      const desiredInput = computeAutoSteerInput(vehiclePos, vehicleHeading);
      const desiredAngle = desiredInput * MAX_STEER_ANGLE;
      steerAngle += (desiredAngle - steerAngle) * Math.min(1, dt * AUTO_STEER_RATE);
      ui.controls.set('wheel', steerAngle / MAX_STEER_ANGLE);     /* Auto Drive turns the wheel (no spring) */
    } else {
      steerAngle = ui.controls.get('wheel') * MAX_STEER_ANGLE;    /* the dial owns it: drag, ←/→, spring-back */
    }

    steerInput = steerAngle / MAX_STEER_ANGLE;

    const omega_c = 2.2 * state.speedMul;
    const roadAngle = -steerInput * MAX_ROAD_ANGLE;
    const tanRoad = Math.tan(roadAngle);

    const halfTrackOverL = (REAR_TRACK / 2) / WHEELBASE;
    let omegaL, omegaR;
    let slip = false;

    if (diffLocked) {
      omegaL = omega_c; omegaR = omega_c;
    } else if (tractionMode === 'left') {
      omegaL = 2 * omega_c; omegaR = 0; slip = true;
    } else if (tractionMode === 'right') {
      omegaL = 0; omegaR = 2 * omega_c; slip = true;
    } else {
      const ratio = halfTrackOverL * tanRoad;
      omegaL = omega_c * (1 + ratio);
      omegaR = omega_c * (1 - ratio);
    }

    let v = omega_c * WHEEL_R;
    if (slip && !diffLocked) v = 0;

    hudTyreSpeedL = omegaL * WHEEL_R;
    hudTyreSpeedR = omegaR * WHEEL_R;

    const yawRate = v * tanRoad / WHEELBASE;
    vehicleHeading += yawRate * dt;

    const dx = v * Math.sin(vehicleHeading) * dt;
    const dz = v * Math.cos(vehicleHeading) * dt;
    const newX = vehiclePos.x + dx;
    const newZ = vehiclePos.z + dz;

    let clampedX = newX;
    let clampedZ = newZ;
    if (clampedX >  CLAMP_HALF) clampedX =  CLAMP_HALF;
    if (clampedX < -CLAMP_HALF) clampedX = -CLAMP_HALF;
    if (clampedZ >  CLAMP_HALF) clampedZ =  CLAMP_HALF;
    if (clampedZ < -CLAMP_HALF) clampedZ = -CLAMP_HALF;

    vehiclePos.x = clampedX;
    vehiclePos.z = clampedZ;

    vehicleGroup.position.copy(vehiclePos);

    const lateralAccel = v * yawRate;
    const rollTarget   = Math.max(-0.055, Math.min(0.055, lateralAccel * 0.010));
    const accel        = (v - lastV) / Math.max(dt, 0.001);
    const pitchTarget  = Math.max(-0.040, Math.min(0.040, -accel * 0.004));
    lastV = v;
    const smooth = Math.min(1, dt * 3.5);
    bodyRoll  += (rollTarget  - bodyRoll)  * smooth;
    bodyPitch += (pitchTarget - bodyPitch) * smooth;
    vehicleGroup.rotation.set(bodyPitch, vehicleHeading, bodyRoll);

    phCarrier += dt * omega_c;
    phSideL   += dt * (omegaL - omega_c);
    phSideR   += dt * (omegaR - omega_c);
    phSpider  += dt * (omegaL - omegaR) * 0.5 * SPIDER_RATIO;   /* small gears turn faster than the relative side-gear speed by the tooth ratio */
    phPinion  += dt * omega_c * (DIFF_NC / DIFF_NP);

    carrierGroup.rotation.x    =  phCarrier;
    sideLGroup.rotation.x      =  phSideL;
    sideRGroup.rotation.x      =  phSideR;
    spiderTopGroup.rotation.y  =  phSpider;
    spiderBotGroup.rotation.y  = -phSpider;               /* top and bottom small gears turn opposite ways about the cross pin */
    pinionSpinGroup.rotation.z =  phPinion;

    wheelL.rotation.x = phCarrier + phSideL;
    wheelR.rotation.x = phCarrier + phSideR;
    axleAssemblyL.rotation.x = phCarrier + phSideL;
    axleAssemblyR.rotation.x = phCarrier + phSideR;

    const ack = ackermannAngles(roadAngle);
    if (Math.abs(roadAngle) < 1e-4) {
      frontPivotL.rotation.y = 0;
      frontPivotR.rotation.y = 0;
    } else if (roadAngle < 0) {
      frontPivotL.rotation.y = -ack.inner;
      frontPivotR.rotation.y = -ack.outer;
    } else {
      frontPivotR.rotation.y =  ack.inner;
      frontPivotL.rotation.y =  ack.outer;
    }

    const steerL = frontPivotL.rotation.y;
    const steerR = frontPivotR.rotation.y;
    phFrontL += dt * v * Math.cos(steerL) / FRONT_WHEEL_R;
    phFrontR += dt * v * Math.cos(steerR) / FRONT_WHEEL_R;
    frontWheelL.rotation.x = phFrontL;
    frontWheelR.rotation.x = phFrontR;
    tieRod.rotation.z = Math.PI / 2 + roadAngle * 0.4;

    const cosH = Math.cos(vehicleHeading), sinH = Math.sin(vehicleHeading);
    function l2w(lx, lz) {
      _l2w_scratch.x = vehiclePos.x + lx * cosH + lz * sinH;
      _l2w_scratch.z = vehiclePos.z - lx * sinH + lz * cosH;
      return _l2w_scratch;
    }
    const rl = l2w(wheelLX, 0);
    const rr = l2w(wheelRX, 0);
    const fl = l2w(-FRONT_TRACK/2, FRONT_AXLE_Z);
    const fr = l2w( FRONT_TRACK/2, FRONT_AXLE_Z);

    trailAccum += dt;
    if (trailAccum >= 0.030) {
      trailAccum = 0;
      trailRearL.add(rl.x, GROUND_Y + 0.014, rl.z);
      trailRearR.add(rr.x, GROUND_Y + 0.014, rr.z);
      trailFrontL.add(fl.x, GROUND_Y + 0.014, fl.z);
      trailFrontR.add(fr.x, GROUND_Y + 0.014, fr.z);
    }
    const fadeFactor = Math.pow(0.982, dt * 60);
    trailRearL.fade(fadeFactor);  trailRearR.fade(fadeFactor);
    trailFrontL.fade(fadeFactor); trailFrontR.fade(fadeFactor);
    trailRearL.commit();  trailRearR.commit();
    trailFrontL.commit(); trailFrontR.commit();

    shadowRL.position.set(rl.x, GROUND_Y + 0.016, rl.z);
    shadowRR.position.set(rr.x, GROUND_Y + 0.016, rr.z);
    shadowFL.position.set(fl.x, GROUND_Y + 0.016, fl.z);
    shadowFR.position.set(fr.x, GROUND_Y + 0.016, fr.z);

    /* ─── Flow arrow pulse ─── */
    if (state.showGas !== false) {
      flowTime += dt * (2 + state.speedMul * 3);
      flowArrows.forEach(a => {
        const phase = a.userData.phase || 0;
        const pulse = 0.5 + 0.5 * Math.sin(flowTime - phase);
        a.material.opacity = 0.25 + pulse * 0.65;
        const s = 0.85 + pulse * 0.35;
        a.scale.set(s, s, s);
      });
    } else {
      flowArrows.forEach(a => { a.material.opacity = 0; });
    }

    /* ─── Readouts ─── */
    const rL = omegaL / omega_c, rR = omegaR / omega_c;
    if (elLeftVal)  elLeftVal.textContent  = rL.toFixed(2) + '×';
    if (elRightVal) elRightVal.textContent = rR.toFixed(2) + '×';
    if (elFillL) elFillL.style.width  = Math.max(2, Math.min(100, rL*50)) + '%';
    if (elFillR) elFillR.style.width = Math.max(2, Math.min(100, rR*50)) + '%';

    const rpmBase = 900 * (state.speedMul / 0.85);
    const rpmL = (omegaL / omega_c) * rpmBase;
    const rpmR = (omegaR / omega_c) * rpmBase;
    ui.monitor.update({
      rows: { rpmL: Math.round(rpmL) + (slip && tractionMode === 'left' ? ' ⚠' : '') + ' rpm', rpmR: Math.round(rpmR) + (slip && tractionMode === 'right' ? ' ⚠' : '') + ' rpm', rpm: `~${Math.round(rpmBase)} rpm` }
    });

    if (elTurnR) {
      if (Math.abs(tanRoad) < 0.008) elTurnR.textContent = '∞ (straight)';
      else elTurnR.textContent = Math.abs(WHEELBASE / tanRoad).toFixed(2) + ' u';
    }

    /* Chip big number + bar = vehicle speed */
    ui.monitor.update({ value: { text: String((v * 3.6).toFixed(1)), unit: 'u/s', bar: Math.min(100, Math.abs(v) * 25), barColor: '#38bdf8' } });

    if (elDiffMode) {
      if (diffLocked) elDiffMode.textContent = 'Locked 🔒';
      else if (slip)  elDiffMode.textContent = 'Open · SLIP ⚠';
      else            elDiffMode.textContent = 'Open';
    }

    if (diffLocked) ui.monitor.update({ status: ['Locked 🔒', true] });
    else if (slip)  ui.monitor.update({ status: ['Open · SLIP ⚠', false] });
    else            ui.monitor.update({ status: ['Open', true] });

    if (slip && !diffLocked && flashTimer <= 0) setFlash('Wheel Slip — Torque Lost!');
  }

  const _v = new THREE.Vector3();
  const _diffCenter = new THREE.Vector3();
  let diffOrbitAngle = 0;
  function updateCamera(dt) {
    if (!controls) return;
    const targetCenter = _v.set(vehiclePos.x, 0.4, vehiclePos.z);

    if (camMode === 'orbit') {
      controls.enabled = true;
      const dx = targetCenter.x - controls.target.x;
      const dz = targetCenter.z - controls.target.z;
      const k = Math.min(1, dt * 3.0);
      controls.target.x += dx * k;
      controls.target.z += dz * k;
      camera.position.x += dx * k;
      camera.position.z += dz * k;
      controls.update();
      return;
    }

    controls.enabled = false;
    const forward = new THREE.Vector3(Math.sin(vehicleHeading), 0, Math.cos(vehicleHeading));
    const right   = new THREE.Vector3(Math.cos(vehicleHeading), 0, -Math.sin(vehicleHeading));
    let desiredPos, lookAt;

    if (camMode === 'chase') {
      desiredPos = vehiclePos.clone()
        .add(forward.clone().multiplyScalar(-5.2))
        .add(new THREE.Vector3(0, 2.3, 0));
      lookAt = targetCenter.clone().add(forward.clone().multiplyScalar(1.0));
    } else if (camMode === 'top') {
      desiredPos = vehiclePos.clone().add(new THREE.Vector3(0, 10, 0.01));
      lookAt = targetCenter.clone();
    } else if (camMode === 'diff') {
      /* Slow orbiting close-up on the differential */
      diffOrbitAngle += dt * 0.35;
      _diffCenter.set(vehiclePos.x, 0.10, vehiclePos.z);
      const dist = 1.1;
      desiredPos = _diffCenter.clone().add(new THREE.Vector3(
        Math.sin(diffOrbitAngle) * dist,
        0.35,
        Math.cos(diffOrbitAngle) * dist
      ));
      lookAt = _diffCenter.clone();
    } else {
      desiredPos = vehiclePos.clone()
        .add(right.clone().multiplyScalar(7.5))
        .add(new THREE.Vector3(0, 1.6, 0));
      lookAt = targetCenter.clone();
    }

    const k = Math.min(1, dt * 4.0);
    camera.position.lerp(desiredPos, k);
    if (!camera.userData.lookAt) camera.userData.lookAt = lookAt.clone();
    camera.userData.lookAt.lerp(lookAt, k);
    camera.lookAt(camera.userData.lookAt);
  }

  const clock = new THREE.Clock();
  let frame = 0;

  const tyreDimSvg  = document.getElementById('tyre-dim-svg');
  const tyreChipL   = document.getElementById('tyre-speed-left');
  const tyreChipR   = document.getElementById('tyre-speed-right');
  const tyreChipLVal = document.getElementById('tyre-speed-left-val');
  const tyreChipRVal = document.getElementById('tyre-speed-right-val');
  const dimLineL = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  const dimLineR = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  [[dimLineL, '#38bdf8'], [dimLineR, '#f59e0b']].forEach(([el, color]) => {
    el.setAttribute('stroke', color);
    el.setAttribute('stroke-width', '1.5');
    el.setAttribute('stroke-dasharray', '3,3');
    if (tyreDimSvg) tyreDimSvg.appendChild(el);
  });
  const _hudWL = new THREE.Vector3(), _hudWR = new THREE.Vector3();

  function worldToScreenPx(pos) {
    const v = pos.clone().project(camera);
    const rect = renderer.domElement.getBoundingClientRect();
    return {
      x: rect.left + (v.x * 0.5 + 0.5) * rect.width,
      y: rect.top + (-v.y * 0.5 + 0.5) * rect.height,
      behind: v.z > 1
    };
  }

  function placeTyreChip(chip, valEl, line, screenPt, speed) {
    if (!chip) return;
    if (screenPt.behind || isolationActive) {
      chip.style.display = 'none';
      line.style.display = 'none';
      return;
    }
    chip.style.display = 'flex';
    line.style.display = '';
    const chipX = screenPt.x, chipY = screenPt.y - 68;
    chip.style.left = chipX + 'px';
    chip.style.top  = chipY + 'px';
    if (valEl) valEl.textContent = (speed * 3.6).toFixed(1) + ' u/s';
    line.setAttribute('x1', screenPt.x); line.setAttribute('y1', screenPt.y);
    line.setAttribute('x2', chipX);      line.setAttribute('y2', chipY + 12);
  }

  function updateTyreHud() {
    wheelL.getWorldPosition(_hudWL);
    wheelR.getWorldPosition(_hudWR);
    placeTyreChip(tyreChipL, tyreChipLVal, dimLineL, worldToScreenPx(_hudWL), hudTyreSpeedL);
    placeTyreChip(tyreChipR, tyreChipRVal, dimLineR, worldToScreenPx(_hudWR), hudTyreSpeedR);
  }

  function animate() {
    requestAnimationFrame(animate);
    frame++;
    const dt = Math.min(clock.getDelta(), 0.05);
    try {
      if (state.playing) {
        updateDiff(dt);
        updateSectionPlane();
      } else {
        const f = Math.pow(0.982, dt * 60);
        trailRearL.fade(f); trailRearR.fade(f);
        trailFrontL.fade(f); trailFrontR.fade(f);
        trailRearL.commit(); trailRearR.commit();
        trailFrontL.commit(); trailFrontR.commit();
      }
      updateExplode(dt);
      if (flashTimer > 0) {
        flashTimer -= dt;
        if (flashTimer <= 0 && statusFlash) statusFlash.classList.remove('on');
      }
      if (state.showLabels && frame % 2 === 0 && !isolationActive) {
        labelDefs.forEach(d => {
          const wp = d.pos.clone();
          vehicleGroup.localToWorld(wp);
          labels.project(d.id, wp, camera, wrap);
        });
      } else if (!state.showLabels || isolationActive) {
        labels.hideAll();
      }
      updateCamera(dt);
      renderer.render(scene, camera);
      updateTyreHud();
    } catch (err) {
      console.error('[Differential] frame error:', err);
    }
  }
  animate();

  bridge.setStatus('Differential', '#38bdf8');

  vehicleGroup.position.copy(vehiclePos);
  vehicleGroup.rotation.set(0, vehicleHeading, 0);
  if (controls && controls.target) { controls.target.set(vehiclePos.x, 0.5, vehiclePos.z + 0.5); camera.position.set(vehiclePos.x + 3.2, 2.0, vehiclePos.z + 4.5); }
  </script>
</body>
