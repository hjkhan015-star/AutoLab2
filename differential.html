<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Differential — Auto Lab</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="controls.css">
<link rel="stylesheet" href="components.css">
<style>
:root { --al-accent: #eab308; }
html.light-theme { --al-accent: color-mix(in oklch, #eab308 68%, black); }
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<div id="labels-root"></div>

<script src="guard.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import { runGuidedModule } from './components.js';

/* ── module content ──────────────────────────────────────────────── */
const NC = 40, NP = 10, NS = 14, NSP = 10;          /* teeth: crown wheel / pinion, large / small gears */
const RATIO = NC / NP, SR = NS / NSP;                /* final drive 4 : 1 ; large gear turns 1 per 1.4 small-gear turns */
const RPM_FULL = 3000;                               /* propeller-shaft rpm at 100 % input */
const TURN_MAX = 0.30;                               /* shaft speed difference at full steering: ±30 % of cage speed */
const SLOW = 1 / 16;                                 /* the animation runs 16× slower than the real rpm */

const CFG = {
  moduleId: 'differential',
  title: 'Differential',
  kicker: 'Drivetrain',
  accent: '#eab308',
  badge: 'Open differential · bevel gears',
  camPos: [-3.6, 2.5, 8.6],
  target: [0.1, -0.85, 0],
  floorY: -3.3,
  ctls: [
    { id: 'ctl', label: 'Input speed', caption: 'Propeller shaft', min: 0, max: 100, def: 40, step: 1, unit: '%' },
    { id: 'turn', label: 'Steering', min: -100, max: 100, def: 0, step: 1, unit: '%', onChange: (v) => { S.turn = v / 100; } }
  ],
  chipLabel: 'Propeller shaft',
  rows: [['inner', 'Inner half shaft'], ['outer', 'Outer half shaft']],
  ro: [
    ['cage',   'Crown wheel + cage'],
    ['pinion', 'Pinion'],
    ['inner',  'Inner half shaft'],
    ['outer',  'Outer half shaft'],
    ['spider', 'Small gears spin'],
    ['avg',    'Average of the shafts'],
    ['turn',   'Turning'],
    ['split',  'Torque split'],
    ['mode',   'Differential']
  ],
  legend: [
    ['var(--c-orange)', 'Crown wheel'],
    ['var(--c-green)', 'Pinion / small gears'],
    ['var(--c-sky)', 'Large gears / half shafts'],
    ['var(--c-red)', 'Rotating cage'],
    ['var(--c-amber)', 'Rotation arrows']
  ],
  overview: `
<div class="al-sec"><h4>What it does</h4>
<p>When a car turns, the outer wheel travels a longer path than the inner wheel, so it must spin faster. The differential splits the engine's drive between the two half shafts and lets them turn at <b>different speeds</b> while still sharing the torque equally.</p></div>

<div class="al-sec"><h4>Follow the power</h4>
<ul>
<li><b>1 · Propeller shaft</b> carries the drive from the gearbox. A universal joint lets it move with the suspension.</li>
<li><b>2 · Pinion</b> (small bevel gear on its end) meshes with the <b>crown wheel</b>. It turns the drive through 90° and cuts the speed (here 4 : 1).</li>
<li><b>3 · Rotating cage</b> is bolted to the crown wheel, so it turns with it. It carries the cross pin.</li>
<li><b>4 · Small gears</b> sit on the cross pin and are carried round with the cage. Each one meshes with both large gears.</li>
<li><b>5 · Large gears</b> are splined to the inner and outer half shafts, which go to the wheels.</li>
</ul></div>

<div class="al-sec"><h4>Straight ahead vs. a corner</h4>
<ul>
<li><b>Straight:</b> both wheels have the same grip and speed. The small gears are carried round with the cage but <b>do not spin</b>. They act like a bar locking the two large gears together.</li>
<li><b>Cornering:</b> one wheel is held back by the road. The small gears <b>roll on their pin</b>, so one large gear speeds up by exactly as much as the other slows down. Their average stays equal to the cage speed.</li>
<li><b>Rule:</b> inner shaft speed + outer shaft speed = 2 × cage speed.</li>
</ul></div>

<div class="al-sec"><h4>Read the screen</h4>
<ul>
<li><b>Arrows:</b> the direction and speed of each part. Yellow = crown wheel, blue = half shafts, green = pinion / propeller shaft / small gears.</li>
<li><b>Cutaway:</b> the front half of the cage is removed so you can see the gears inside. Switch it off to see the closed cage.</li>
<li><b>Speed:</b> the animation is slowed 16×; the readouts show the real rpm.</li>
</ul></div>

<div class="al-sec"><h4>Try this</h4>
<ul>
<li>Steering centred: watch the small gears stay still while the cage turns.</li>
<li>Slide the steering: the small gears start to spin and the two shafts split.</li>
<li>Pick <b>Inner wheel slipping</b>: the inner shaft doubles its speed and the outer one stops. This is why an open differential wastes power on ice.</li>
<li>Switch on <b>Diff lock</b> to force both shafts to the same speed.</li>
</ul></div>`,
  faults: [
    ['Clunk when turning', 'Worn small gears, side gears or cross pin, or too much backlash between the gears.', 'Check the gear backlash and the wear on the cross pin and thrust washers.'],
    ['Whine or howl under power', 'Crown wheel and pinion are worn, out of adjustment, or the oil level is low.', 'Check the oil level, then the contact pattern and the backlash of the crown wheel and pinion.'],
    ['Howl that changes with speed, not load', 'Worn pinion or carrier bearings.', 'Check the pinion bearing preload and the carrier bearing play.'],
    ['One wheel spins on ice or mud', 'Not a fault. An open differential sends the drive to the wheel with the least grip.', 'Use a limited-slip or locking differential, or traction control.'],
    ['Oil leak at the pinion or axle seals', 'Hardened or worn seals, or a clogged breather.', 'Replace the seal and check the breather and the oil level.']
  ],
  quiz: [
    ['Why does a car need a differential?', ['Both wheels must turn at different speeds in a corner', 'To make the engine turn faster', 'To change gear'], 0, 'On a bend the outer wheel travels farther in the same time, so it must turn faster than the inner one.'],
    ['What turns the drive through 90° and reduces the speed?', ['The cross pin', 'The pinion and crown wheel', 'The half shafts'], 1, 'The small pinion drives the large crown wheel, which gives both the right-angle turn and the final-drive reduction.'],
    ['Driving straight, what do the small gears do?', ['Spin fast', 'Are carried round with the cage and do not spin', 'Stop the cage'], 1, 'With equal wheel speeds there is no relative motion, so they simply ride round with the cage.'],
    ['In a corner, the outer shaft turns 10 % faster than the cage. The inner shaft turns…', ['10 % slower than the cage', '10 % faster too', 'At the same speed'], 0, 'The two speeds average to the cage speed, so what one gains the other loses.'],
    ['An open differential and one wheel on ice. What happens?', ['That wheel spins and the other gets almost no drive', 'Both wheels get full drive', 'The car speeds up'], 0, 'Torque is shared equally, and the icy wheel can only take a tiny torque, so the other wheel gets the same tiny amount.'],
    ['What does a differential lock do?', ['Locks the pinion', 'Forces both half shafts to the same speed', 'Splits the torque 70 / 30'], 1, 'The two shafts are joined, so both turn at the cage speed whatever the grip, which is useful off-road and bad on dry tarmac in a corner.'],
    ['Which part is bolted directly to the crown wheel?', ['The rotating cage', 'The pinion', 'The outer half shaft'], 0, 'The cage turns with the crown wheel and carries the cross pin and the small gears.']
  ]
};

/* ── module state ── */
const S = { turn: 0, traction: 'none', lock: false, cut: true };
const sim = { phC: 0, phL: 0, phR: 0, phP: 0, phSp: 0 };
let scene3 = null, traceSample = null, traceClear = false, sampleClock = 0;

function resetAll() {
  S.turn = 0; S.traction = 'none'; S.lock = false; S.cut = true;
  sim.phC = sim.phL = sim.phR = sim.phP = sim.phSp = 0;
  if (scene3) scene3.setCut(true);
  traceClear = true; sampleClock = 0;
}
CFG.onReset = resetAll;

CFG.options = [
  { id: 'traction', type: 'choice', layout: 'select', label: 'Traction', ariaLabel: 'Traction',
    options: [{ id: 'none', label: 'Full grip' }, { id: 'inner', label: 'Inner wheel slipping' }, { id: 'outer', label: 'Outer wheel slipping' }], def: 'none',
    onChange: (id) => { S.traction = id; } },
  { id: 'lock', type: 'toggle', label: 'Diff lock', ariaLabel: 'Differential lock', def: false, onChange: (on) => { S.lock = !!on; } },
  { id: 'cutaway', type: 'toggle', label: 'Cutaway', def: true, onChange: (on) => { S.cut = !!on; if (scene3) scene3.setCut(S.cut); } }
];

CFG.traces = [{ id: 'hist', label: 'Shaft rpm (0–1500) · inner · outer · cage', min: 0, max: 100, length: 150,
  series: [
    { id: 'a', label: 'Inner shaft', color: 'var(--accent)' },
    { id: 'b', label: 'Outer shaft', color: 'var(--ok)' },
    { id: 'c', label: 'Cage', color: 'var(--warn)' }
  ] }];

/*DIFF-SCENE-START*/
/* ═══════════════════════════════════════════════════════════════════════
   DIFFERENTIAL SCENE — a cutaway built to match the classic reference drawing:
   propeller shaft + pinion (green), crown wheel (yellow), rotating cage (red,
   cut open), two small gears on a cross pin (green), two large side gears and
   the two half shafts (blue), with rotation arrows.

   Geometry is plain arrays (no three.js primitives), gears are real bevel gears:
   teeth are swept along the pitch cone and shrink toward the apex, so the pinion /
   crown wheel and the small / large gears mesh on a shared contact line.
   ═══════════════════════════════════════════════════════════════════════ */
function buildDiffScene(THREE) {
  const PI = Math.PI, TAU = PI * 2, DS = THREE.DoubleSide;

  /* ── gear data ── */
  const NC = 40, NP = 10;                 /* crown wheel / pinion teeth   (ratio 4 : 1) */
  const NS = 14, NSP = 10;                /* large (side) / small (spider) gear teeth   */
  const RATIO = NC / NP, SPIDER_RATIO = NS / NSP;
  const D_PINION = Math.atan2(NP, NC), D_CROWN = PI / 2 - D_PINION;   /* pitch-cone half angles (axes at 90°) */
  const D_SPIDER = Math.atan2(NSP, NS), D_SIDE = PI / 2 - D_SPIDER;
  const XA = -1.15;                       /* crown wheel / pinion apex, on the half-shaft axis */
  const BETA = 0.60;                      /* propeller shaft points this far below the front direction (rad) */
  const CROWN_TWIST = 0.30;               /* spiral: crown teeth turn this much from outer to inner edge */

  /* ═════════ plain-array geometry ═════════ */
  const at = (axis, u, r, a) => axis === 'x' ? [u, r * Math.cos(a), r * Math.sin(a)]
                              : axis === 'y' ? [r * Math.cos(a), u, r * Math.sin(a)]
                              :                [r * Math.cos(a), r * Math.sin(a), u];
  /* surface of revolution; prof = [[axial, radius], …]; each profile segment has its own vertices (crisp edges) */
  function revolve(prof, seg, axis, a0 = 0, aLen = TAU, closed = true) {
    const p = [], idx = [], n = prof.length, last = closed ? n : n - 1;
    for (let s = 0; s < last; s++) {
      const A = prof[s], B = prof[(s + 1) % n];
      if (A[0] === B[0] && A[1] === B[1]) continue;
      const base = p.length / 3;
      for (let i = 0; i <= seg; i++) { const a = a0 + aLen * i / seg; p.push(...at(axis, A[0], A[1], a), ...at(axis, B[0], B[1], a)); }
      for (let i = 0; i < seg; i++) { const v = base + i * 2; idx.push(v, v + 2, v + 1, v + 1, v + 2, v + 3); }
    }
    return { p, i: idx };
  }
  const cylinder = (axis, r, u0, u1, seg = 24) => revolve([[u0, 0], [u0, r], [u1, r], [u1, 0]], seg, axis);
  function box(w, h, d, cx, cy, cz) {
    const x = w / 2, y = h / 2, z = d / 2, V = [];
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) V.push([cx + sx * x, cy + sy * y, cz + sz * z]);
    const Q = [[0, 1, 3, 2], [4, 6, 7, 5], [0, 4, 5, 1], [2, 3, 7, 6], [0, 2, 6, 4], [1, 5, 7, 3]], p = [];
    for (const q of Q) for (const k of [0, 1, 2, 0, 2, 3]) p.push(...V[q[k]]);
    return { p, i: null };
  }
  function merge(list) {
    const p = [], idx = [];
    for (const g of list) {
      const base = p.length / 3;
      for (const v of g.p) p.push(v);
      if (g.i) for (const k of g.i) idx.push(k + base); else for (let k = 0; k < g.p.length / 3; k++) idx.push(base + k);
    }
    return { p, i: idx };
  }
  function xform(g, f) { const p = g.p.slice(); for (let k = 0; k < p.length; k += 3) { const q = f(p[k], p[k + 1], p[k + 2]); p[k] = q[0]; p[k + 1] = q[1]; p[k + 2] = q[2]; } return { p, i: g.i }; }
  const mkGeo = (g) => {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(g.p), 3));
    if (g.i) geo.setIndex(g.i);
    geo.computeVertexNormals();
    return geo;
  };

  /* bevel gear in its own frame: apex at the origin, axis +Z; teeth lie on the pitch cone of half-angle `delta`.
     twist = total angular turn of every tooth from the outer end (s = 0) to the inner end (s = 1)  → spiral teeth. */
  function bevelGear(o) {
    const { N, delta, dIn, dOut, toothH, twist = 0, stations = 1, phase = 0, back = 0.1, boreR = 0, hubR = 0, hubLen = 0,
            tip = 0.30, root = 0.62, sink = 0.9, bodyOff = 0.55, dStart } = o;
    const sD = Math.sin(delta), cD = Math.cos(delta), pitch = TAU / N;
    const P = (d, th, off) => { const r = d * sD + off * cD, z = d * cD - off * sD; return [r * Math.cos(th), r * Math.sin(th), z]; };
    const tp = [];
    const quad = (a, b, c, d) => { tp.push(...a, ...b, ...c, ...a, ...c, ...d); };
    for (let k = 0; k < N; k++) {
      let prev = null;
      for (let j = 0; j <= stations; j++) {
        const s = j / stations, d = dOut - (dOut - dIn) * s, h = toothH * d / dOut, th = k * pitch + phase + twist * s;
        const wR = root * pitch / 2, wT = tip * pitch / 2;
        const cur = { rL: P(d, th - wR, -sink * h * 0.5), rR: P(d, th + wR, -sink * h * 0.5), tL: P(d, th - wT, h * 0.55), tR: P(d, th + wT, h * 0.55) };
        if (j === 0) quad(cur.rL, cur.rR, cur.tR, cur.tL);
        if (prev) { quad(prev.tL, prev.tR, cur.tR, cur.tL); quad(prev.rL, prev.tL, cur.tL, cur.rL); quad(prev.rR, cur.rR, cur.tR, prev.tR); }
        if (j === stations) quad(cur.rL, cur.tL, cur.tR, cur.rR);
        prev = cur;
      }
    }
    const surf = (d) => { const off = -bodyOff * toothH * d / dOut; const r = d * sD + off * cD, z = d * cD - off * sD; return [z, r]; };
    const d0 = Math.max(dStart != null ? dStart : dIn, boreR > 0 ? boreR / sD + 0.002 : 0);
    const A = surf(d0), B = surf(dOut), zEnd = B[0] + back;
    const prof = [[A[0], boreR], A, B, [zEnd, B[1]], [zEnd, Math.max(hubR, boreR)]];
    if (hubLen > 0) prof.push([zEnd + hubLen, Math.max(hubR, boreR)], [zEnd + hubLen, boreR]); else prof.push([zEnd, boreR]);
    return { body: revolve(prof, 56, 'z'), teeth: { p: tp, i: null }, zEnd: zEnd + hubLen };
  }

  /* curved arrow in the XY plane around +Z, counter-clockwise from a0 to a1 (head at a1) */
  function arrowGeo(R, a0, a1, rt, headLen, headR) {
    const p = [], idx = [], segs = Math.max(14, Math.round((a1 - a0) * 12)), ring = 8;
    const aEnd = a1 - headLen / R;
    const c = (a) => [R * Math.cos(a), R * Math.sin(a), 0];
    for (let i = 0; i <= segs; i++) {
      const a = a0 + (aEnd - a0) * i / segs, C = c(a), ra = [Math.cos(a), Math.sin(a), 0];
      for (let j = 0; j < ring; j++) { const f = TAU * j / ring; p.push(C[0] + rt * Math.cos(f) * ra[0], C[1] + rt * Math.cos(f) * ra[1], rt * Math.sin(f)); }
    }
    for (let i = 0; i < segs; i++) for (let j = 0; j < ring; j++) {
      const a = i * ring + j, b = i * ring + (j + 1) % ring, c2 = (i + 1) * ring + j, d = (i + 1) * ring + (j + 1) % ring;
      idx.push(a, c2, b, b, c2, d);
    }
    const C0 = c(aEnd), T = [-Math.sin(aEnd), Math.cos(aEnd), 0], ra = [Math.cos(aEnd), Math.sin(aEnd), 0];
    const base = p.length / 3;
    for (let j = 0; j < ring; j++) { const f = TAU * j / ring; p.push(C0[0] + headR * Math.cos(f) * ra[0], C0[1] + headR * Math.cos(f) * ra[1], headR * Math.sin(f)); }
    p.push(C0[0] + T[0] * headLen, C0[1] + T[1] * headLen, 0);
    p.push(C0[0], C0[1], 0);
    for (let j = 0; j < ring; j++) { idx.push(base + j, base + (j + 1) % ring, base + ring); idx.push(base + (j + 1) % ring, base + j, base + ring + 1); }
    return { p, i: idx };
  }

  /* ═════════ materials ═════════ */
  const std = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, metalness: 0.22, roughness: 0.48, side: DS }, o));
  const cutPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0);          /* keeps z ≤ 0: the front half of the cage is cut away */
  const M = {
    crown: std(0xe9a420), crownTooth: std(0xf8c23c),
    green: std(0x49aa4d), greenTooth: std(0x6cc56f), greenDark: std(0x2f7d36),
    blue: std(0x86bce6), blueTooth: std(0xa9d3f2), blueShaft: std(0x8ec3ea), blueIn: std(0xe8f3fb), blueKey: std(0x2f6f9f),
    red: std(0xd8402c, { clippingPlanes: [cutPlane] }), redIn: std(0x6d8fb5, { clippingPlanes: [cutPlane], roughness: 0.6 }),
    cut: std(0xb5301f, { roughness: 0.6 }), bolt: std(0xc9ced6, { metalness: 0.7, roughness: 0.3, clippingPlanes: [cutPlane] }),
    pin: std(0x2f7d36)
  };

  /* ═════════ scene graph ═════════ */
  const root = new THREE.Group();
  const grp = (parent) => { const g = new THREE.Group(); (parent || root).add(g); return g; };
  const add = (parent, g, mat, extra) => { const m = new THREE.Mesh(mkGeo(g), mat); parent.add(m); return m; };
  const gear = (parent, spec, matBody, matTeeth) => {
    const g = bevelGear(spec), grpG = grp(parent);
    add(grpG, g.body, matBody); add(grpG, g.teeth, matTeeth);
    return grpG;
  };

  /* ── rotating assembly: cage + crown wheel + cross pin + small gears ── */
  const cageG = grp();
  const crownPhase = (PI + BETA) + (TAU / NC) / 2;           /* a tooth GAP sits exactly where the pinion tooth enters */
  const crown = gear(cageG, { N: NC, delta: D_CROWN, dIn: 0.74, dOut: 1.62, toothH: 0.085, twist: CROWN_TWIST, stations: 9, phase: crownPhase,
                             back: 0.16, boreR: 0.34 }, M.crown, M.crownTooth);
  crown.position.x = XA; crown.rotation.y = PI / 2;                   /* local +Z → world +X */

  /* cage shell: surface of revolution, cut along z = 0 (front half removed with a clipping plane) */
  const shellOut = [[-1.10, 0.34], [-0.70, 0.34], [-0.70, 1.10], [-0.50, 1.22], [-0.10, 1.22], [0.30, 1.12], [0.78, 0.84], [1.00, 0.56], [1.08, 0.36], [1.30, 0.36]];
  const T = 0.09;
  const shellIn = shellOut.map(([x, r]) => [x + (x === -0.70 ? T : 0), Math.max(0.0, r - T)]);
  add(cageG, revolve(shellOut, 64, 'x', 0, TAU, false), M.red);
  add(cageG, revolve(shellIn, 64, 'x', 0, TAU, false), M.redIn);
  /* flange lip with bolt heads — visible rotation of the cage */
  add(cageG, revolve([[-0.70, 1.00], [-0.70, 1.15], [-0.62, 1.15], [-0.62, 1.00]], 64, 'x'), M.red);
  for (let k = 0; k < 10; k++) {
    const a = k / 10 * TAU, g = cylinder('x', 0.05, -0.64, -0.55, 6);
    add(cageG, xform(g, (x, y, z) => [x, y + 1.075 * Math.cos(a) - 0 * z, z + 1.075 * Math.sin(a)]), M.bolt);
  }
  /* cross pin (vertical) — held by the cage */
  add(cageG, cylinder('y', 0.05, -1.0, 1.0, 14), M.pin);
  /* small gears (spiders): top and bottom, spin about the cross pin */
  const spiderSpec = (flip) => ({ N: NSP, delta: D_SPIDER, dIn: 0.46, dOut: 0.90, toothH: 0.12, stations: 1, phase: PI, back: 0.08, boreR: 0.07, hubR: 0.14, hubLen: 0.32 });
  const spTopSpin = grp(cageG), spBotSpin = grp(cageG);
  const spTop = gear(spTopSpin, spiderSpec(), M.green, M.greenTooth); spTop.rotation.x = -PI / 2;
  const spBot = gear(spBotSpin, spiderSpec(), M.green, M.greenTooth); spBot.rotation.x = PI / 2;
  /* marks on the hubs so the spin is visible */
  add(spTopSpin, box(0.05, 0.14, 0.05, 0.13, 1.06, 0), M.greenDark);
  add(spBotSpin, box(0.05, 0.14, 0.05, 0.13, -1.06, 0), M.greenDark);

  /* static cut face of the cage (a world-fixed plane, so it does not turn with the cage) */
  const cutParts = [];
  for (const sgn of [1, -1]) for (let k = 0; k < shellOut.length - 1; k++) {
    const a = shellOut[k], b = shellOut[k + 1], ai = shellIn[k], bi = shellIn[k + 1];
    if (a[1] === 0 && b[1] === 0) continue;
    const q = [[a[0], sgn * a[1], 0], [b[0], sgn * b[1], 0], [bi[0], sgn * bi[1], 0], [ai[0], sgn * ai[1], 0]], p = [];
    for (const t of [0, 1, 2, 0, 2, 3]) p.push(...q[t]);
    cutParts.push({ p, i: null });
  }
  const cutFace = add(root, merge(cutParts), M.cut);

  /* ── side (large) gears + half shafts ── */
  const sideSpec = () => ({ N: NS, delta: D_SIDE, dIn: 0.46, dOut: 0.90, toothH: 0.12, stations: 1, phase: PI / 2 + (TAU / NS) / 2, back: 0.10, boreR: 0.15, hubR: 0.22, hubLen: 0.32 });
  const sideL = grp(), sideR = grp();                                 /* inner (–X) and outer (+X) half shaft units */
  const gL = gear(sideL, sideSpec(), M.blue, M.blueTooth); gL.rotation.y = -PI / 2;   /* local +Z → world –X */
  const gR = gear(sideR, sideSpec(), M.blue, M.blueTooth); gR.rotation.y = PI / 2;    /* local +Z → world +X */
  const SHAFT_R = 0.15, X_END = 3.3, TILT = 0.70;
  const endPlane = (sign) => new THREE.Plane(new THREE.Vector3(-sign * Math.cos(TILT), Math.sin(TILT), 0), Math.cos(TILT) * X_END);
  const hollow = (parent, g1, g2, plane, cOut = 0x8ec3ea, cIn = 0xe8f3fb) => {
    const a = new THREE.Mesh(mkGeo(g1), std(cOut, { clippingPlanes: [plane] }));
    const b = new THREE.Mesh(mkGeo(g2), std(cIn, { clippingPlanes: [plane], roughness: 0.8 }));
    parent.add(a); parent.add(b);
  };
  hollow(sideL, revolve([[-X_END - 0.3, SHAFT_R], [-0.2, SHAFT_R]], 32, 'x', 0, TAU, false), revolve([[-X_END - 0.3, SHAFT_R - 0.03], [-0.2, SHAFT_R - 0.03]], 32, 'x', 0, TAU, false), endPlane(1));
  hollow(sideR, revolve([[0.2, SHAFT_R], [X_END + 0.3, SHAFT_R]], 32, 'x', 0, TAU, false), revolve([[0.2, SHAFT_R - 0.03], [X_END + 0.3, SHAFT_R - 0.03]], 32, 'x', 0, TAU, false), endPlane(-1));
  add(sideL, box(1.5, 0.04, 0.07, -2.4, SHAFT_R + 0.005, 0), M.blueKey);
  add(sideR, box(1.5, 0.04, 0.07, 2.4, SHAFT_R + 0.005, 0), M.blueKey);

  /* ── pinion + propeller shaft (own axis, tilted toward the viewer) ── */
  const pinBase = grp(); pinBase.position.set(XA, 0, 0); pinBase.rotation.x = BETA;
  const pinSpin = grp(pinBase);
  const pg = bevelGear({ N: NP, delta: D_PINION, dIn: 0.74, dOut: 1.62, toothH: 0.085, twist: -0.80, stations: 12, phase: 0,
                         back: 0.12, hubR: 0.16, hubLen: 0.0, dStart: 0.74 });
  add(pinSpin, pg.body, M.green); add(pinSpin, pg.teeth, M.greenTooth);
  const zS = pg.zEnd, zJ = 2.75;
  add(pinSpin, cylinder('z', 0.14, zS - 0.02, zJ - 0.32, 20), M.green);
  add(pinSpin, cylinder('z', 0.23, zJ - 0.42, zJ - 0.26, 24), M.green);                                  /* yoke A base */
  for (const s of [-1, 1]) add(pinSpin, box(0.07, 0.36, 0.46, s * 0.21, 0, zJ - 0.05), M.green);       /* yoke A ears (±X) */
  add(pinSpin, cylinder('x', 0.045, -0.31, 0.31, 12), M.greenDark);                                      /* cross arm X */
  add(pinSpin, xform(cylinder('y', 0.045, -0.31, 0.31, 12), (x, y, z) => [x, y, z]), M.greenDark);
  add(pinSpin, box(0.2, 0.2, 0.2, 0, 0, 0), M.greenDark);
  /* the two cross arms sit at the joint centre */
  pinSpin.children.slice(-3).forEach((m) => { m.position.z = zJ; });
  add(pinSpin, cylinder('z', 0.23, zJ + 0.26, zJ + 0.42, 24), M.green);                                 /* yoke B base */
  for (const s of [-1, 1]) add(pinSpin, box(0.36, 0.07, 0.46, 0, s * 0.21, zJ + 0.05), M.green);       /* yoke B ears (±Y) */
  const zT0 = zJ + 0.4, zT1 = 4.3;
  const uDir = new THREE.Vector3(0, -Math.sin(BETA), Math.cos(BETA));
  const endC = new THREE.Vector3(XA, 0, 0).addScaledVector(uDir, zT1 + 0.1);
  const pn = uDir.clone().multiplyScalar(-Math.cos(TILT)); pn.x += Math.sin(TILT);
  const pPlane = new THREE.Plane(pn.normalize(), -pn.dot(endC));
  hollow(pinSpin, revolve([[zT0, 0.2], [zT1 + 0.3, 0.2]], 32, 'z', 0, TAU, false), revolve([[zT0, 0.17], [zT1 + 0.3, 0.17]], 32, 'z', 0, TAU, false), pPlane, 0x49aa4d, 0xd6efd8);
  add(pinSpin, box(0.07, 0.04, 1.4, 0, 0.2, 3.5), M.greenDark);

  /* ── rotation arrows (world-fixed; direction follows the real rotation) ── */
  const arrows = [];
  const mkArrow = (parent, color, R, a0, a1, rt, hl, hr) => {
    const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, depthWrite: false, side: DS });
    const holder = grp(parent), m = new THREE.Mesh(mkGeo(arrowGeo(R, a0, a1, rt, hl, hr)), mat);
    holder.add(m); arrows.push({ holder, mat }); return holder;
  };
  const aIn = mkArrow(root, 0x4aa8e8, 0.62, -0.5, 3.9, 0.035, 0.2, 0.09);  aIn.position.x = -2.65; aIn.rotation.y = PI / 2;
  const aOut = mkArrow(root, 0x4aa8e8, 0.7, -0.5, 3.9, 0.035, 0.2, 0.09); aOut.position.x = 2.65; aOut.rotation.y = PI / 2;
  const aCrown = mkArrow(root, 0xffc400, 1.78, -0.2, 1.5, 0.05, 0.28, 0.13); aCrown.position.x = XA - 0.28; aCrown.rotation.y = PI / 2;
  const aProp = mkArrow(pinBase, 0x6cd36f, 0.5, -0.6, 3.7, 0.035, 0.2, 0.09); aProp.position.z = 1.75;
  const aTop = mkArrow(root, 0x6cd36f, 0.34, -0.5, 3.6, 0.03, 0.17, 0.08); aTop.position.y = 1.28; aTop.rotation.x = -PI / 2;
  const aBot = mkArrow(root, 0x6cd36f, 0.34, -0.5, 3.6, 0.03, 0.17, 0.08); aBot.position.y = -1.28; aBot.rotation.x = -PI / 2;

  /* ── label anchors (static world points on the parts) ── */
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const pAt = (d, r) => V(XA + r, -d * Math.sin(BETA), d * Math.cos(BETA));
  const anchors = [
    ['pinion',     'Pinion',            pAt(1.0, 0.24)],
    ['crown',      'Crown wheel',       V(XA + 0.30, 1.25, 0.55)],
    ['cage',       'Rotating cage',     V(0.62, 0.52, -0.5)],
    ['small1',     'Small gear',        V(0.0, 0.66, 0.50)],
    ['small2',     'Small gear',        V(0.0, -0.66, 0.50)],
    ['large1',     'Large gear',        V(-0.46, 0.0, 0.64)],
    ['large2',     'Large gear',        V(0.46, 0.0, 0.64)],
    ['inner',      'Inner half shaft',  V(-2.3, 0.16, 0.0)],
    ['outer',      'Outer half shaft',  V(2.3, 0.16, 0.0)],
    ['prop',       'Propeller shaft',   pAt(3.7, 0.2)]
  ];

  /* ── per-frame pose ──
     k = { phC, phL, phR, phP, phSp, wC, wL, wR, wP, wSp }  (phases in rad, rates in true rad/s; sign = direction about +X / +u / +Y) */
  const fade = (w) => Math.min(1, Math.max(0, (Math.abs(w) - 0.05) / 0.5)) * 0.95;
  const setArrow = (a, w, sign) => { const s = (w * sign) >= 0 ? 1 : -1; a.holder.scale.x = s; a.mat.opacity = fade(w); a.holder.visible = a.mat.opacity > 0.02; };
  function update(k) {
    cageG.rotation.x = k.phC;
    sideL.rotation.x = k.phL; sideR.rotation.x = k.phR;
    pinSpin.rotation.z = k.phP;
    spTopSpin.rotation.y = k.phSp; spBotSpin.rotation.y = -k.phSp;
    const A = arrows;
    setArrow(A[0], k.wL, 1); setArrow(A[1], k.wR, 1); setArrow(A[2], k.wC, 1); setArrow(A[3], k.wP, 1);
    setArrow(A[4], k.wSp, 1); setArrow(A[5], -k.wSp, 1);
  }
  function setCut(on) {
    for (const m of [M.red, M.redIn, M.bolt]) { m.clippingPlanes = on ? [cutPlane] : null; m.needsUpdate = true; }
    cutFace.visible = !!on;
  }
  return { root, update, setCut, anchors, RATIO, SPIDER_RATIO, arrows };
}
/*DIFF-SCENE-END*/


/* ═══════════════════════════════════════════════════════════════════
   MODULE
   ═══════════════════════════════════════════════════════════════════ */
function build(H) {
  if (H.renderer) H.renderer.localClippingEnabled = true;      /* the cage is cut open with a clipping plane */
  scene3 = buildDiffScene(H.THREE);
  H.root.add(scene3.root);
  scene3.setCut(S.cut);
  const clamp = H.clamp || ((x, a, b) => Math.min(b, Math.max(a, x)));
  const RPM = 60 / (Math.PI * 2);

  return {
    labels: scene3.anchors.map((a) => [a[1], [a[2].x, a[2].y, a[2].z]]),

    update(c) {
      const dt = Math.max(0, c.dt || 0);
      const k = clamp(c.k, 0, 1);

      /* ── the real kinematics (rad/s of the real machine) ── */
      const propRpm = k * RPM_FULL;
      const wP = propRpm / RPM;                     /* propeller shaft */
      const wC = wP / RATIO;                        /* crown wheel and cage */
      let wL, wR, mode;
      if (S.lock) { wL = wC; wR = wC; mode = 'lock'; }
      else if (S.traction === 'inner') { wL = 2 * wC; wR = 0; mode = 'slip'; }
      else if (S.traction === 'outer') { wL = 0; wR = 2 * wC; mode = 'slip'; }
      else { const r = TURN_MAX * S.turn; wL = wC * (1 + r); wR = wC * (1 - r); mode = 'open'; }
      const wSp = SR * (wL - wR) / 2;               /* small gears spin about the cross pin (relative to the cage) */

      /* ── pose (slowed down for the eye); the pinion turns the opposite way to the crown wheel ── */
      sim.phC += wC * SLOW * dt; sim.phL += wL * SLOW * dt; sim.phR += wR * SLOW * dt;
      sim.phP -= RATIO * wC * SLOW * dt; sim.phSp += wSp * SLOW * dt;
      scene3.update({ phC: sim.phC, phL: sim.phL, phR: sim.phR, phP: sim.phP, phSp: sim.phSp,
                      wC: wC * SLOW, wL: wL * SLOW, wR: wR * SLOW, wP: -RATIO * wC * SLOW, wSp: wSp * SLOW });

      /* ── readouts ── */
      const rC = wC * RPM, rL = wL * RPM, rR = wR * RPM, rS = Math.abs(wSp) * RPM;
      const f0 = (v) => Math.round(v) + ' rpm';
      const turning = Math.abs(S.turn) < 0.03 ? 'Straight ahead' : (S.turn > 0 ? 'Toward the outer shaft' : 'Toward the inner shaft');
      let status, tone, split;
      if (mode === 'lock') { status = 'LOCKED · both shafts at cage speed'; tone = 'warn'; split = 'Any split, up to grip'; }
      else if (mode === 'slip') { status = 'WHEEL SLIP · power goes to the free wheel'; tone = 'crit'; split = '≈ 0 / ≈ 0 (limited by the slipping wheel)'; }
      else if (Math.abs(S.turn) < 0.03) { status = 'Open · small gears carried round, not spinning'; tone = 'ok'; split = '50 / 50'; }
      else { status = 'Open · small gears spinning, shafts at different speeds'; tone = 'ok'; split = '50 / 50 (equal torque)'; }

      let tr;
      if (traceClear) { traceClear = false; traceSample = null; tr = { hist: null }; }
      else {
        if (dt > 0) { sampleClock += dt; if (sampleClock >= 0.25) { sampleClock = 0; traceSample = [clamp(rL / 15, 0, 100), clamp(rR / 15, 0, 100), clamp(rC / 15, 0, 100)]; } }
        if (traceSample) { tr = { hist: traceSample }; traceSample = null; }
      }

      return {
        big: Math.round(propRpm), unit: ' rpm', bar: k * 100,
        rows: { inner: f0(rL), outer: f0(rR) },
        ro: {
          cage:   [f0(rC), ''],
          pinion: [f0(RATIO * rC), ''],
          inner:  [f0(rL), mode === 'slip' && S.traction === 'inner' ? 'warn' : ''],
          outer:  [f0(rR), mode === 'slip' && S.traction === 'outer' ? 'warn' : ''],
          spider: [f0(rS), rS > 1 ? 'hi' : ''],
          avg:    [f0((rL + rR) / 2), ''],
          turn:   [turning, ''],
          split:  [split, mode === 'slip' ? 'warn' : ''],
          mode:   [mode === 'lock' ? 'Locked' : mode === 'slip' ? 'Open · slipping' : 'Open', mode === 'open' ? '' : 'warn']
        },
        status: [status, true, tone === 'ok' ? '' : tone],
        traces: tr,
        ctl: f0(propRpm)
      };
    }
  };
}

runGuidedModule(CFG, build);
</script>
