<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Body &amp; Frame — Auto Lab</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="controls.css">
<link rel="stylesheet" href="components.css">
<style>
:root { --al-accent: #0ea5e9; }
html.light-theme { --al-accent: color-mix(in oklch, #0ea5e9 68%, black); }
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<div id="labels-root"></div>

<script src="guard.js"></script>
  <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import { runGuidedModule } from './components.js';

/* ── CONFIG (module content) ─────────────────────────────────────── */
const CFG = {"moduleId":"bodyframe","title":"Body & Frame","kicker":"Body, Safety & Comfort","accent":"#0ea5e9","badge":"Ladder frame · Unibody","camPos":[5.6,3.4,7.2],"target":[0,0,0],"floorY":-1.3,"ctl":{"label":"Twist load","val":50,"caption":"Axle twist"},"chipLabel":"Body twist","rows":[],"ro":[["tq","Twist torque"],["stiff","Torsional stiffness"],["mass","Structure mass"],["use","Typical use"]],"legend":[["var(--c-amber)","Ladder frame"],["var(--c-sky)","Unibody structure"],["var(--c-slate)","Rubber body mounts"]],"overview":"<div class=\"al-sec\"><h4>What the body does<\/h4><p>The structure carries every other system: engine, suspension, seats and cargo. It must be stiff (so the suspension, not the body, absorbs bumps), light, and strong in a crash.<\/p><\/div><div class=\"al-sec\"><h4>Two ways to build it<\/h4><ul><li><b>Body-on-frame (ladder)<\/b> – two long rails and cross-members form a strong chassis; a separate body sits on rubber mounts. Used by trucks, big SUVs and off-roaders because it tows well and survives abuse.<\/li><li><b>Unibody (monocoque)<\/b> – floor, sills, pillars and roof are welded into one shell that is the chassis. Lighter and much stiffer in twist, so almost every car and crossover uses it.<\/li><\/ul><\/div><div class=\"al-sec\"><h4>Try it<\/h4><p>Pick a structure in the options row, then drag <b>Twist load<\/b>. The drawing exaggerates the twist about 14 times so you can see it. The ladder frame twists roughly three times more than the unibody for the same load.<\/p><\/div><div class=\"al-sec\"><h4>Torsional stiffness<\/h4><p>Stiffness is torque per degree of twist (kN·m/deg). A stiffer body keeps wheel alignment steady, gives sharper handling, fewer rattles and a safer crash structure. The numbers here are typical, not for one model.<\/p><\/div>","faults":[["Rusted sills or rails","Soft or flaky metal, holes, MOT/inspection failure, doors that sag.","Tap and probe sills, rail ends and mounting points; look for bubbling paint."],["Collision-bent structure","Uneven panel gaps, pulling, uneven tyre wear, door or boot misaligned.","Measure body diagonals and compare with the maker data; check gaps and seam sealer."],["Worn body mounts (body-on-frame)","Clunk over bumps, vibration, body shifting on the frame.","Inspect rubber mounts for cracks and compression, check bolt torque."]],"quiz":[["Which layout has the body and chassis as one welded shell?",["Ladder frame","Unibody","Space frame only"],1,"A unibody (monocoque) uses the body shell itself as the structure."],["Why do trucks still use ladder frames?",["They are lighter","Strong for towing and rough use","They are stiffer in twist"],1,"Separate rails take towing and heavy loads and are easy to repair or modify."],["More torsional stiffness gives…",["More body twist","Steadier handling and alignment","Lower crash safety"],1,"A stiff structure holds suspension geometry steady."]]};

/* ── module state + dock options ─────────────────────────────────── */
const S = { type: 'unibody', shell: true };
CFG.options = [
  { id: 'type', type: 'choice', layout: 'segmented', label: 'Structure', options: [{ id: 'unibody', label: 'Unibody' }, { id: 'ladder', label: 'Ladder' }], def: 'unibody', onChange: (id) => { S.type = id; } },
  { id: 'shell', type: 'toggle', label: 'Body shell', def: true, onChange: (on) => { S.shell = !!on; } }
];

/* ── MODULE SCENE (per-module 3D parts) ──────────────────────────── */
function build(H) {
    const { box, cyl, mat, glass, glow } = H;
    const L = 3, N = 12, sg = 2 * L / N;
    const amber = mat(0xf59e0b, .4, .5), sky = mat(0x38bdf8, .35, .5), rub = mat(0x1f2937, .1, .9), pan = glass(0x38bdf8, .22), shl = glass(0x94a3b8, .2);
    const lad = [], uni = [], bod = [];
    const add = (list, m, x, y, z, f) => { list.push({ m, x, y, z, f: f || 1 }); return m; };
    for (let i = 0; i < N; i++) {
      const x = -L + sg * (i + .5);
      [-.8, .8].forEach((z) => add(lad, box(sg * 1.02, .2, .14, amber, x, -.5, z), x, -.5, z));
      [-.95, .95].forEach((z) => add(uni, box(sg * 1.02, .2, .12, sky, x, -.45, z), x, -.45, z));
      add(uni, box(sg * 1.02, .05, 1.8, pan, x, -.5, 0), x, -.5, 0);
    }
    [-2.6, -1.4, 0, 1.4, 2.6].forEach((x) => { add(lad, box(.14, .14, 1.6, amber, x, -.5, 0), x, -.5, 0); add(uni, box(.12, .12, 1.8, sky, x, -.5, 0), x, -.5, 0); });
    [-2.4, 0, 2.4].forEach((x) => [-.8, .8].forEach((z) => add(lad, cyl(.13, .13, .22, rub, x, -.3, z), x, -.3, z)));
    for (let i = 0; i < 7; i++) {
      const x = -1.8 + i * .5;
      [-.9, .9].forEach((z) => add(uni, box(.52, .1, .1, sky, x, 1.15, z), x, 1.15, z));
    }
    [-1.8, -.2, 1.4].forEach((x) => {
      [-.9, .9].forEach((z) => add(uni, box(.12, 1.6, .12, sky, x, .35, z), x, .35, z));
      add(uni, box(.1, .1, 1.8, sky, x, 1.15, 0), x, 1.15, 0);
    });
    [-3, 3].forEach((x) => add(uni, box(.15, .2, 1.9, sky, x, -.2, 0), x, -.2, 0));
    for (let i = 0; i < 6; i++) { const x = -L + sg * (2 * i + 1); add(bod, box(sg * 2.02, .8, 1.9, shl, x, .3, 0), x, .3, 0, .55); }
    [-1, 1].forEach((s) => box(.5, .35, .5, mat(0x64748b, .3, .6), -2.95, -1.05, s));
    const up = cyl(0, .14, .5, glow(0xef4444, 1.1), 2.9, -1.1, -1.0), dn = cyl(0, .14, .5, glow(0xef4444, 1.1), 2.9, -.1, 1.0);
    dn.rotation.z = Math.PI;
    const place = (list, tw, on) => list.forEach((p) => {
      p.m.visible = on;
      const th = tw * p.x / L * p.f, c = Math.cos(th), s = Math.sin(th);
      p.m.position.set(p.x, p.y * c - p.z * s, p.y * s + p.z * c); p.m.rotation.x = th;
    });
    return {
      labels: [['Rail / sill', [-1.2, -.95, 1.0]], ['Cross-member', [0, -.95, 0]], ['A / B / C pillars', [-.2, 1.35, 1.0]], ['Rubber body mount', [-2.4, -.55, .95]], ['Rear mounts (fixed)', [-2.95, -1.5, 0]]],
      update(c) {
        const lad_ = S.type === 'ladder', T = 6 * c.k, stiff = lad_ ? 8 : 22, deg = T / stiff;
        const tw = deg * 14 * Math.PI / 360;
        place(lad, tw, lad_); place(uni, tw, !lad_); place(bod, tw, lad_ && S.shell);
        up.scale.y = dn.scale.y = .3 + .9 * c.k;
        up.position.y = -1.1 + .1 * c.k; dn.position.y = -.1 - .1 * c.k;
        const sev = deg > .55;
        return {
          big: deg.toFixed(2), unit: ' °', bar: deg / .95 * 100,
          ro: { tq: [T.toFixed(1) + ' kN·m', ''], stiff: [stiff + ' kN·m/°', lad_ ? 'warn' : 'ok'], mass: [lad_ ? '≈ 480 kg' : '≈ 330 kg', ''], use: [lad_ ? 'Trucks, towing' : 'Cars, crossovers', ''] },
          status: [lad_ ? (sev ? 'Frame flexing' : 'Ladder frame') : 'Stiff shell', true], ctl: T.toFixed(1) + ' kN·m'
        };
      }
    };
  }

runGuidedModule(CFG, build);
</script>
</body>
</html>
