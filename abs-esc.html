<script type="module">
import * as THREE from 'three';
import * as Base from './kit.js';
import { Widgets } from './components.js';

const CFG = {
  moduleId: 'absesc',
  accent:   '#f43f5e'
};

/* ═══════════════════════════════════════════════════════════════════════
   PHYSICS MODEL: pure functions + one Car class. No DOM, no three.js.
   Four-wheel vehicle with a combined-slip tyre (friction circle), wheel dynamics, an ABS controller per wheel and a
   simple ESC. Simplified, but the trends are right: ABS keeps the wheel near peak slip, a locked wheel has less grip and
   no steering, and every surface has its own peak and sliding friction.
   ═══════════════════════════════════════════════════════════════════════ */
//@@MODEL-START
const G = 9.81;
const VEH = { M: 1500, IZ: 2500, A: 1.2, B: 1.5, HCG: 0.55, TRACK: 1.6, RW: 0.32, IW: 1.2, TBRAKE: 2400, FRONT_BIAS: 0.68 };
VEH.L = VEH.A + VEH.B;

/* Surfaces: peak friction mu, and the shape of the slip curve (Pacejka-style B, C, E). `slide` is how much of the peak
   friction is left when the tyre is fully locked. */
const SURFACES = {
  dry:  { mu: 0.95, B: 11.5, C: 1.5,  E: 0.3,  label: 'Dry asphalt', short: 'Dry 0.95' },
  wet:  { mu: 0.68, B: 10.5, C: 1.75, E: 0.7,  label: 'Wet road',    short: 'Wet 0.68' },
  snow: { mu: 0.32, B: 8.0,  C: 1.8,  E: 0.6,  label: 'Snow',        short: 'Snow 0.32' },
  ice:  { mu: 0.14, B: 6.0,  C: 1.75, E: -0.2, label: 'Ice',         short: 'Ice 0.14' }
};
const clampN = (x, a, b) => Math.min(b, Math.max(a, x));
const sign = (x) => (x < 0 ? -1 : 1);

/* Friction coefficient from the combined slip s (slip ratio and tan(slip angle) together). */
function tyreMu(surf, s) {
  const Bs = surf.B * s;
  return surf.mu * Math.sin(surf.C * Math.atan(Bs - surf.E * (Bs - Math.atan(Bs))));
}

const ABS_CFG = { lamHi: 0.22, lamLo: 0.12, dump: 14, apply: 5, decelThr: 22 };   /* slip thresholds; pressure rates (1/s) */

/* Normal load on one wheel (N): the static share, plus the weight moved by braking / accelerating. ax < 0 = braking. */
function wheelLoad(front, ax) {
  const m = VEH.M;
  const axle = front ? m * G * VEH.B / VEH.L - m * ax * VEH.HCG / VEH.L : m * G * VEH.A / VEH.L + m * ax * VEH.HCG / VEH.L;
  return Math.max(200, axle / 2);
}

/* One vehicle. State: body (x, z, psi, vx, vy, r), four wheels, ABS pressure factors, ESC outputs. Wheel order FL, FR, RL, RR. */
class Car {
  constructor(opts) {
    this.opts = Object.assign({ x: 0, z: 0, lane: 0, absOn: true, escOn: true, wssFault: false }, opts || {});
    this.reset(opts && opts.v0 != null ? opts.v0 : 16.7);
  }
  reset(v0) {
    const o = this.opts;
    this.X = o.x; this.Z = o.z; this.psi = 0; this.vx = v0; this.vy = 0; this.r = 0; this.delta = 0;
    this.w = [v0 / VEH.RW, v0 / VEH.RW, v0 / VEH.RW, v0 / VEH.RW];           /* wheel angular speed, rad/s */
    this.p = [1, 1, 1, 1];                                                    /* ABS pressure factor per wheel (1 = full driver pressure) */
    this.mode = ['apply', 'apply', 'apply', 'apply'];                        /* ABS valve state per wheel */
    this.slip = [0, 0, 0, 0]; this.alpha = [0, 0, 0, 0]; this.Fx = [0, 0, 0, 0]; this.Fy = [0, 0, 0, 0]; this.Fz = [0, 0, 0, 0];
    this.vref = v0; this.ax = 0; this.ay = 0; this.pedalEff = 0;
    this.escCmd = [0, 0, 0, 0]; this.escActive = false; this.absActive = false; this.rDes = 0;
    this.s = 0; this.brakeS = 0; this.braking = false; this.brakeV0 = 0; this.stopped = false; this.lastStop = null; this.absTime = 0;
    this.pDisp = [0, 0, 0, 0]; this.dpdt = [0, 0, 0, 0]; this.cycles = 0; this.offTrack = false; this.t = 0;
  }
  /* Steering demand (rad). straight: hold the lane (heading + lateral error). corner: follow a circle of radius Rp whose
     centre is at (0, Rp + z0). */
  steerDemand(cornering, Rp, z0) {
    let d;
    if (cornering) {
      const cx = 0, cz = Rp + z0;
      const dx = this.X - cx, dz = this.Z - cz, dist = Math.hypot(dx, dz);
      const err = dist - Rp;                                                   /* + = outside the lane */
      const tang = Math.atan2(dx, -dz);                                        /* heading of a clockwise circle at this point */
      let ePsi = tang - this.psi; while (ePsi > Math.PI) ePsi -= 2 * Math.PI; while (ePsi < -Math.PI) ePsi += 2 * Math.PI;
      d = Math.atan(VEH.L / Rp) + 0.9 * ePsi - 0.06 * err;
    } else {
      d = -1.2 * this.psi - 0.25 * (this.Z - z0 + 0) * 0.0 - 0.5 * this.r;
    }
    return clampN(d, -0.5, 0.5);
  }
  /* One physics step. in: { dt, vset, pedal 0..1, surf, cornering, Rp, z0 } */
  step(inp) {
    const o = this.opts, surf = inp.surf, h = inp.dt;
    const pedal = clampN(inp.pedal, 0, 1);
    this.t += h;
    /* steering with a little lag */
    const dem = this.steerDemand(inp.cornering, inp.Rp || 45, inp.z0 || 0);
    this.delta += (dem - this.delta) * (1 - Math.exp(-h / 0.08));
    const d = this.delta, cd = Math.cos(d), sd = Math.sin(d);

    /* ABS reference speed: the fastest wheel, but it may not fall faster than the surface allows (so it survives all wheels locking) */
    let vwmax = 0; for (let i = 0; i < 4; i++) vwmax = Math.max(vwmax, this.w[i] * VEH.RW);
    this.vref = Math.max(vwmax, this.vref - 1.05 * surf.mu * G * h);
    const vref = Math.max(this.vref, 0.5);
    const absEnabled = o.absOn && !o.wssFault;

    /* ESC: compare the yaw rate the driver asks for with the real one, and brake one wheel */
    this.escCmd = [0, 0, 0, 0]; this.escActive = false;
    const vsafe = Math.max(this.vx, 1);
    this.rDes = clampN(vsafe * d / (VEH.L + 0.0025 * vsafe * vsafe), -0.85 * surf.mu * G / vsafe, 0.85 * surf.mu * G / vsafe);
    if (o.escOn && !o.wssFault && this.vx > 4) {
      const e = this.r - this.rDes, beta = this.vy / vsafe;
      const big = Math.abs(e) > 0.05 || Math.abs(beta) > 0.08;
      if (big) {
        this.escActive = true;
        const k = clampN((Math.abs(e) - 0.03) * 4 + Math.abs(beta) * 3, 0, 0.6);
        if (Math.abs(this.r) > Math.abs(this.rDes) + 0.02 || Math.abs(beta) > 0.08) { const oi = (this.r > 0) ? 0 : 1; this.escCmd[oi] = k; }   /* oversteer: outer front */
        else { const ii = (this.r > 0) ? 3 : 2; this.escCmd[ii] = k; }                                                                           /* understeer: inner rear */
      }
    }

    /* wheel kinematics and forces */
    const pos = [[VEH.A, -VEH.TRACK / 2], [VEH.A, VEH.TRACK / 2], [-VEH.B, -VEH.TRACK / 2], [-VEH.B, VEH.TRACK / 2]];     /* (x, y: right +) */
    const ax0 = this.ax;
    let Fxb = 0, Fyb = 0, Mz = 0;
    this.absActive = false;
    for (let i = 0; i < 4; i++) {
      const front = i < 2, xi = pos[i][0], yi = pos[i][1];
      const vxi = this.vx - this.r * yi, vyi = this.vy + this.r * xi;
      const di = front ? d : 0, cdi = Math.cos(di), sdi = Math.sin(di);
      const vlong = vxi * cdi + vyi * sdi, vlat = -vxi * sdi + vyi * cdi;
      const vl = Math.max(Math.abs(vlong), 0.4);
      const lam = clampN((vlong - this.w[i] * VEH.RW) / Math.max(vl, 1.2), -1, 1);          /* slip ratio, + when the wheel is slower than the road */
      const sa = vlat / vl;                                                                   /* tan of the slip angle (+ when sliding to the right) */
      const s = Math.hypot(lam, sa * 1.0);
      const Fz = wheelLoad(front, ax0);
      let muc = tyreMu(surf, s);
      if (s > 0.85) muc *= 0.97;
      const f = muc * Fz;
      const sSafe = Math.max(s, 1e-6);
      const FxW = -(f * lam / sSafe), FyW = -(f * sa / sSafe);                               /* tyre force on the car, wheel frame */
      this.slip[i] = Math.max(0, lam); this.alpha[i] = Math.atan(sa); this.Fx[i] = FxW; this.Fy[i] = FyW; this.Fz[i] = Fz;
      Fxb += FxW * cdi - FyW * sdi; Fyb += FxW * sdi + FyW * cdi;
      Mz += xi * (FxW * sdi + FyW * cdi) - yi * (FxW * cdi - FyW * sdi);

      /* ABS: hold / dump / apply the pressure factor of this wheel */
      const pOld = this.p[i];
      if (absEnabled && pedal > 0.04) {
        const lamE = (vref - this.w[i] * VEH.RW) / Math.max(vref, 1.5);
        const wdot = this.wdot ? this.wdot[i] : 0;
        /* cornering ABS: the more lateral grip the corner already uses, the less slip the brake may take, so the tyre keeps
           side force and the car can still steer */
        const latUse = clampN(Math.abs(this.ay) / Math.max(0.3, surf.mu * G), 0, 1);
        const lamHi = ABS_CFG.lamHi * (1 - 0.65 * latUse), lamLo = ABS_CFG.lamLo * (1 - 0.65 * latUse);
        let mode;
        if (vref < 2.2) mode = 'apply';
        else if (lamE > lamHi || (wdot * VEH.RW < -ABS_CFG.decelThr && lamE > 0.08)) mode = 'dump';
        else if (lamE < lamLo) mode = 'apply';
        else mode = 'hold';
        if (mode === 'dump') this.p[i] = Math.max(0, this.p[i] - ABS_CFG.dump * h);
        else if (mode === 'apply') this.p[i] = Math.min(1, this.p[i] + ABS_CFG.apply * h);
        if (mode !== this.mode[i] && (mode === 'dump')) this.cycles++;
        this.mode[i] = mode;
        if (mode !== 'apply' || this.p[i] < 0.98) this.absActive = true;
      } else { this.p[i] = Math.min(1, this.p[i] + 40 * h); this.mode[i] = 'apply'; }
      this.dpdt[i] = (this.p[i] - pOld) / h;
    }

    /* drive torque (rear wheels) while the pedal is off: cruise to vset, limited by the engine */
    const res = 180 + 0.42 * this.vx * this.vx;
    let Fd = 0;
    if (pedal < 0.03 && !this.stopped) Fd = clampN(VEH.M * 1.4 * (inp.vset - this.vx) + res, 0, 5200);
    if (pedal < 0.03 && this.stopped && inp.vset > 0.5) { this.stopped = false; }
    const Fdrive = Fd;

    /* wheel dynamics: I dw/dt = ground force x R - brake torque + drive torque */
    this.wdot = this.wdot || [0, 0, 0, 0];
    for (let i = 0; i < 4; i++) {
      const front = i < 2;
      const Tmax = VEH.TBRAKE * (front ? VEH.FRONT_BIAS * 1.0 : (1 - VEH.FRONT_BIAS) * 1.0);
      const cmd = clampN(pedal + this.escCmd[i], 0, 1);
      const Tb = Tmax * cmd * this.p[i];
      const Tdr = front ? 0 : Fdrive * VEH.RW / 2;
      const FgroundLong = -(this.Fx[i]);                                                      /* braking force the ground gives the wheel (+ when braking) */
      let acc = (FgroundLong * VEH.RW - Tb + Tdr) / VEH.IW;
      let wn = this.w[i] + acc * h;
      if (wn < 0) wn = 0;
      this.wdot[i] = (wn - this.w[i]) / h;
      this.w[i] = wn;
      this.pDisp[i] = this.p[i] * cmd;
    }

    /* body */
    const m = VEH.M;
    const vxOld = this.vx;
    let dvx = (Fxb - res + Fdrive) / m + this.r * this.vy;
    let dvy = Fyb / m - this.r * this.vx;
    let dr = Mz / VEH.IZ;
    this.vx += dvx * h; this.vy += dvy * h; this.r += dr * h;
    this.ax = (this.vx - vxOld) / h * 0.15 + this.ax * 0.85;                                 /* smoothed longitudinal acceleration for the load transfer */
    this.ay = (dvy + this.r * this.vx);
    /* come to rest: below ~0.5 m/s the tyre model is stiff, so finish the stop explicitly */
    if (this.vx < 0.45 && pedal > 0.05) {
      this.vx = Math.max(0, this.vx - 6 * h); this.vy *= 0.9; this.r *= 0.9;
      for (let i = 0; i < 4; i++) this.w[i] = Math.min(this.w[i], this.vx / VEH.RW);
      if (this.vx <= 0.02) { this.vx = 0; this.stopped = true; for (let i = 0; i < 4; i++) this.w[i] = 0; }
    }
    if (this.vx < 0) { this.vx = 0; }
    this.psi += this.r * h;
    this.X += (this.vx * Math.cos(this.psi) - this.vy * Math.sin(this.psi)) * h;
    this.Z += (this.vx * Math.sin(this.psi) + this.vy * Math.cos(this.psi)) * h;
    const ds = Math.hypot(this.vx, this.vy) * h;
    this.s += ds;

    /* braking bookkeeping */
    if (pedal > 0.08 && !this.braking && this.vx > 0.5) { this.braking = true; this.brakeS = 0; this.brakeV0 = Math.hypot(this.vx, this.vy); this.stoppedAt = null; }
    if (this.braking) {
      this.brakeS += ds;
      if (this.vx < 0.15) { this.lastStop = { dist: this.brakeS, v0: this.brakeV0, abs: o.absOn && !o.wssFault, surf: inp.surfId }; this.braking = false; }
      else if (pedal < 0.03) { this.braking = false; }
    }
  }
}
//@@MODEL-END

/* ═══════════════════════════════════════════════════════════════════════
   SCENE: a road, two cars (yours, and an optional comparison twin), the ABS/ESC hardware inside yours
   Units are metres. World: the car heads +X, +Z is to its right, +Y is up. Car frame: x forward, z right.
   ═══════════════════════════════════════════════════════════════════════ */
const built = Base.buildScene({
  fov: 44,
  camPos: [4.2, 3.0, 6.4],
  target: [0.2, 0.5, 0],
  floorY: -0.05,
  fogDensity: 0.012
});
const { scene, camera, renderer, controls, wrap, viewManager, quality } = built;
Base.attachResize(camera, renderer, wrap, built.baseFov);
const lowEnd = quality.isLowEnd;
camera.far = 420; camera.updateProjectionMatrix();
controls.minDistance = 2.5; controls.maxDistance = 48; controls.maxPolarAngle = Math.PI * 0.49;
scene.traverse((o) => { if (o.userData && (o.userData.__isFloor || o.userData.__isGrid)) o.visible = false; });   /* the road replaces the stage floor */

const root = new THREE.Group();
scene.add(root);
const TAU = Math.PI * 2;
const mk = (c, m, r, o) => new THREE.MeshStandardMaterial(Object.assign({ color: c, metalness: m == null ? 0.3 : m, roughness: r == null ? 0.6 : r }, o || {}));
const glassM = (c, op) => new THREE.MeshStandardMaterial({ color: c, metalness: 0.1, roughness: 0.2, transparent: true, opacity: op, depthWrite: false, side: THREE.DoubleSide });
const dotTex = (() => {
  if (typeof document === 'undefined') return null;
  const cv = document.createElement('canvas'); cv.width = cv.height = 32;
  const cx = cv.getContext('2d'), g = cx.createRadialGradient(16, 16, 0, 16, 16, 16);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.4, 'rgba(255,255,255,0.7)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  cx.fillStyle = g; cx.fillRect(0, 0, 32, 32);
  return new THREE.CanvasTexture(cv);
})();
const add = (geo, m, x, y, z, p) => { const o = new THREE.Mesh(geo, m); o.position.set(x || 0, y || 0, z || 0); (p || root).add(o); return o; };
const bx = (w, h, d, m, x, y, z, p) => add(new THREE.BoxGeometry(w, h, d), m, x, y, z, p);
const cyZ = (r, len, m, x, y, z, p, seg) => { const o = add(new THREE.CylinderGeometry(r, r, len, seg || 24), m, x, y, z, p); o.rotation.x = Math.PI / 2; return o; };
const cyX = (r, len, m, x, y, z, p, seg) => { const o = add(new THREE.CylinderGeometry(r, r, len, seg || 24), m, x, y, z, p); o.rotation.z = Math.PI / 2; return o; };
const cyY = (r, len, m, x, y, z, p, seg) => add(new THREE.CylinderGeometry(r, r, len, seg || 24), m, x, y, z, p);

/* ── road, ground, markings ─────────────────────────────────────── */
const LANE = 3.6, RP = 45;                     /* lane width; radius of the inner (your) lane on the circular track */
const groundM = mk(0x161b22, 0.0, 0.95), roadM = mk(0x4a4f58, 0.1, 0.85);
const ground = add(new THREE.PlaneGeometry(1400, 1400), groundM, 0, -0.03, 0); ground.rotation.x = -Math.PI / 2;
const straight = new THREE.Group(); root.add(straight);
const road = add(new THREE.PlaneGeometry(1400, LANE * 2), roadM, 0, 0, LANE / 2, straight); road.rotation.x = -Math.PI / 2;
const paintM = new THREE.MeshBasicMaterial({ color: 0xe5e7eb }), edgeM = new THREE.MeshBasicMaterial({ color: 0xf8fafc });
const N_DASH = 130, dashI = new THREE.InstancedMesh(new THREE.BoxGeometry(3, 0.01, 0.16), paintM, N_DASH); straight.add(dashI);
bx(1400, 0.012, 0.14, edgeM, 0, 0.005, -LANE / 2, straight); bx(1400, 0.012, 0.14, edgeM, 0, 0.005, LANE * 1.5, straight);
const N_MARK = 70, markI = new THREE.InstancedMesh(new THREE.BoxGeometry(0.28, 0.012, LANE * 2), new THREE.MeshBasicMaterial({ color: 0xfacc15, transparent: true, opacity: 0.55 }), N_MARK); straight.add(markI);
const dm = new THREE.Object3D();
let lastBin = NaN;
function layoutStraight(cx) {                  /* re-centre the dashes and the 10 m distance bars around the camera so the road never ends */
  const bin = Math.round(cx / 30);
  if (bin === lastBin) return; lastBin = bin;
  const x0 = bin * 30;
  for (let i = 0; i < N_DASH; i++) { dm.position.set(x0 + (i - N_DASH / 2) * 6, 0.008, LANE / 2); dm.rotation.set(0, 0, 0); dm.scale.set(1, 1, 1); dm.updateMatrix(); dashI.setMatrixAt(i, dm.matrix); }
  for (let i = 0; i < N_MARK; i++) { const x = Math.round(x0 / 10) * 10 + (i - N_MARK / 2) * 10, big = Math.round(x / 10) % 5 === 0; dm.position.set(x, 0.01, LANE / 2); dm.rotation.set(0, 0, 0); dm.scale.set(big ? 2.2 : 1, 1, 1); dm.updateMatrix(); markI.setMatrixAt(i, dm.matrix); }
  dashI.instanceMatrix.needsUpdate = true; markI.instanceMatrix.needsUpdate = true;
}
const circle = new THREE.Group(); circle.position.set(0, 0, RP); circle.visible = false; root.add(circle);
const ringRoad = add(new THREE.RingGeometry(RP - LANE / 2, RP + LANE * 1.5, lowEnd ? 96 : 192), roadM, 0, 0, 0, circle); ringRoad.rotation.x = -Math.PI / 2;
const cDash = new THREE.InstancedMesh(new THREE.BoxGeometry(1.4, 0.01, 0.16), paintM, 120); circle.add(cDash);
for (let i = 0; i < 120; i += 1) { const a = i / 120 * TAU; dm.position.set(Math.sin(a) * (RP + LANE / 2), 0.012, -Math.cos(a) * (RP + LANE / 2)); dm.rotation.set(0, -a, 0); dm.scale.set(i % 2 ? 0.0001 : 1, 1, 1); dm.updateMatrix(); cDash.setMatrixAt(i, dm.matrix); }
const cMark = new THREE.InstancedMesh(new THREE.BoxGeometry(LANE * 2, 0.012, 0.28), new THREE.MeshBasicMaterial({ color: 0xfacc15, transparent: true, opacity: 0.55 }), 72); circle.add(cMark);
for (let i = 0; i < 72; i++) { const a = i / 72 * TAU; dm.position.set(Math.sin(a) * (RP + LANE / 2), 0.014, -Math.cos(a) * (RP + LANE / 2)); dm.rotation.set(0, Math.PI / 2 - a, 0); dm.scale.set(1, 1, 1); dm.updateMatrix(); cMark.setMatrixAt(i, dm.matrix); }
const SURF_LOOK = { dry: [0x4a4f58, 0.1, 0.85, 0x161b22], wet: [0x2a3646, 0.55, 0.22, 0x131a22], snow: [0xe6edf5, 0.0, 0.95, 0xdce5ef], ice: [0xbfe6f4, 0.35, 0.08, 0x9fc3d6] };
let surfShown = '';
function showSurface(id) {
  if (id === surfShown) return; surfShown = id;
  const l = SURF_LOOK[id] || SURF_LOOK.dry; roadM.color.setHex(l[0]); roadM.metalness = l[1]; roadM.roughness = l[2]; groundM.color.setHex(l[3]);
}

/* ── skid marks: a ring buffer of dark patches, one per 0.25 m of a locked tyre ── */
const N_SKID = lowEnd ? 700 : 1800, skidI = new THREE.InstancedMesh(new THREE.BoxGeometry(0.3, 0.004, 0.17), new THREE.MeshBasicMaterial({ color: 0x050607, transparent: true, opacity: 0.8 }), N_SKID);
skidI.frustumCulled = false; root.add(skidI);
dm.scale.set(0, 0, 0); dm.updateMatrix(); for (let i = 0; i < N_SKID; i++) skidI.setMatrixAt(i, dm.matrix);
let skidN = 0;
function addSkid(x, z, psi) { dm.position.set(x, 0.016, z); dm.rotation.set(0, -psi, 0); dm.scale.set(1, 1, 1); dm.updateMatrix(); skidI.setMatrixAt(skidN % N_SKID, dm.matrix); skidN++; skidI.instanceMatrix.needsUpdate = true; }
function clearSkids() { dm.scale.set(0, 0, 0); dm.updateMatrix(); for (let i = 0; i < N_SKID; i++) skidI.setMatrixAt(i, dm.matrix); skidI.instanceMatrix.needsUpdate = true; skidN = 0; }

/* ── data pulses that follow a cable corner to corner ────────────── */
function polyStream(pts, n, color, size) {
  const P = pts.map((a) => new THREE.Vector3(a[0], a[1], a[2])), cum = [0];
  for (let i = 1; i < P.length; i++) cum.push(cum[i - 1] + P[i].distanceTo(P[i - 1]));

  },
  axes: [
    { id: 'speed', preset: 'vehicle-speed', max: 140, def: 60, label: 'Vehicle speed', side: 'left' },
    /* Phase 4: the interim slider is now a pedal (same id, same 0–100 % mapping). A pedal springs back to 0, so press the pedal to brake.
       k = -ln(0.88)·60. The speed axis is the cruise speed: the car holds it until you brake, then picks it up again. */
    { id: 'brake', look: 'pedal', preset: 'percent', label: 'Brake', ariaLabel: 'Brake pedal', spring: 'return', k: 7.67, keys: 'arrows', side: 'right', color: 'var(--crit)' }
  ],
  /* the dock options row: road surface, the ABS and ESC buttons, the cornering and comparison scenarios, the sensor fault, and a restart */
  options: [
    { id: 'surface', type: 'choice', layout: 'segmented', label: 'Surface', ariaLabel: 'Road surface',
      options: [{ id: 'dry', label: 'Dry' }, { id: 'wet', label: 'Wet' }, { id: 'snow', label: 'Snow' }, { id: 'ice', label: 'Ice' }],
      onChange: (id) => { state.surface = id; restartRun(); } },
    { id: 'abs', type: 'toggle', label: 'ABS', ariaLabel: 'ABS on or off', def: true, onChange: (on) => { state.absOn = !!on; applyBadge(); } },
    { id: 'esc', type: 'toggle', label: 'ESC', ariaLabel: 'Electronic stability control on or off', def: true, onChange: (on) => { state.escOn = !!on; } },
    { id: 'corner', type: 'toggle', label: 'Cornering', ariaLabel: 'Drive round a circular track', def: false, onChange: (on) => { state.corner = !!on; restartRun(); } },
    { id: 'compare', type: 'toggle', label: 'Compare', ariaLabel: 'Run a twin car with the opposite ABS setting', def: false, onChange: (on) => { state.compare = !!on; restartRun(); } },
    { id: 'wss', type: 'toggle', label: 'WSS fault', ariaLabel: 'Front-left wheel-speed sensor fault', onChange: (on) => { state.wssFault = !!on; applyBadge(); } },
    { id: 'restart', type: 'action', label: 'Restart run', ariaLabel: 'Put the cars back at the start', onAction: () => restartRun() }
  ]
});

const tabHost = document.createElement('div');
tabHost.id = 'al-tabs';
tabHost.className = 'al-tabs';
ui.panel.body.appendChild(tabHost);
Widgets.wireQuiz(tabHost);
function renderTab(id) { tabHost.innerHTML = (TABS[id] || TABS.overview)(); }
renderTab('overview');

function applyBadge() {
  const dead = state.wssFault, off = !state.absOn;
  const col = dead ? '#ef4444' : (off ? '#f59e0b' : CFG.accent);
  const badge = document.getElementById('stroke-badge');
  const text  = document.getElementById('badge-text');
  if (badge) {
    badge.style.background = `color-mix(in oklch, ${col} 18%, transparent)`;
    badge.style.color = col;
  }
  if (text) text.textContent = dead ? 'ABS disabled · EBD active' : (off ? 'ABS switched off' : 'ABS ready');
}
applyBadge();

/* ═══════════════════════════════════════════════════════════════════════
   SIMULATION WIRING
   ═══════════════════════════════════════════════════════════════════════ */
const simMain = new Car({ x: 0, z: 0 });
const simTwin = new Car({ x: 0, z: LANE });
const results = {};                 /* stopping distances by surface / start speed / track: { abs, noabs } */
let lastKey = '', lastRegTime = 0, cyclesMark = 0, regHz = 0, offTrack = false, cornerLimited = false;
const seenStop = new WeakMap();

function startSpeed() { return ui.controls.value('speed') / 3.6; }
function laneOf(isTwin) { return state.corner ? { Rp: RP + (isTwin ? LANE : 0), z0: isTwin ? -LANE : 0 } : { Rp: RP, z0: isTwin ? LANE : 0 }; }
function cruiseFor(car, isTwin, vset) {                    /* in a corner the car cannot cruise faster than the tyres allow */
  if (!state.corner) return vset;
  const l = laneOf(isTwin), vmax = 0.88 * Math.sqrt(SURFACES[state.surface].mu * G * l.Rp);
  return Math.min(vset, vmax);
}
function restartRun() {
  if (!simReady) return;
  const v0 = startSpeed();
  for (const [car, isTwin] of [[simMain, false], [simTwin, true]]) {
    const l = laneOf(isTwin);
    car.opts.x = 0; car.opts.z = l.z0;
    car.reset(cruiseFor(car, isTwin, v0));
    car.lastStop = null;
  }
  clearSkids();
  straight.visible = !state.corner; circle.visible = state.corner;
  twinCar.group.visible = state.compare;
  for (const f of [...brakeFlags, ...stopFlags]) f.visible = false;
  offTrack = false; lastRegTime = 0; cyclesMark = 0;
  showSurface(state.surface);
}
simReady = true;
restartRun();

const absEffective = () => state.absOn && !state.wssFault;

/* ═══════════════════════════════════════════════════════════════════════
   READOUTS
   ═══════════════════════════════════════════════════════════════════════ */
const WSIGN = (v) => v.toFixed(0) + ' km/h';
function recordStops() {
  for (const [c, isTwin] of [[simMain, false], [simTwin, true]]) {
    const ls = c.lastStop;
    if (!ls || seenStop.get(c) === ls) continue;
    seenStop.set(c, ls);
    const key = `${ls.surf}|${Math.round(ls.v0 * 3.6 / 5) * 5}|${state.corner ? 'c' : 's'}`;
    results[key] = results[key] || {}; results[key][ls.abs ? 'abs' : 'noabs'] = ls.dist; lastKey = key;
    const f = stopFlags[isTwin ? 1 : 0], dir = isTwin ? 1 : -1;
    f.position.set(c.X + (-Math.sin(c.psi)) * 2.4 * dir, 0, c.Z + Math.cos(c.psi) * 2.4 * dir); f.visible = true;
  }
}
function cmpText() {
  const r = results[lastKey];
  if (!r) return '—';
  if (r.abs != null && r.noabs != null) return `${r.abs.toFixed(1)} m / ${r.noabs.toFixed(1)} m  (no ABS ${r.noabs >= r.abs ? '+' : ''}${((r.noabs / r.abs - 1) * 100).toFixed(0)} %)`;
  return r.abs != null ? `${r.abs.toFixed(1)} m with ABS · brake again with ABS off` : `${r.noabs.toFixed(1)} m with ABS off · brake again with ABS on`;
}
function updateReadouts(dtReal) {
  const c = simMain, v = Math.hypot(c.vx, c.vy) * 3.6, pedal = ui.controls.value('brake');
  const wk = c.w.map((w) => w * VEH.RW * 3.6);
  const maxSlip = Math.max(...c.slip), eff = absEffective();
  /* ABS activity: pressure cycles per second, averaged over about a second of real time */
  lastRegTime += dtReal;
  if (lastRegTime > 1) { regHz = (c.cycles - cyclesMark) / lastRegTime / 4; cyclesMark = c.cycles; lastRegTime = 0; }
  const regulating = c.absActive && pedal > 4;
  let absTxt, absTone = 'ok';
  if (state.wssFault) { absTxt = 'Disabled · sensor fault'; absTone = 'crit'; }
  else if (!state.absOn) { absTxt = 'Switched off'; absTone = 'warn'; }
  else if (regulating) { absTxt = 'Regulating · ' + regHz.toFixed(0) + ' Hz'; absTone = 'warn'; }
  else absTxt = 'Idle';
  const bar = (f) => (f * 160).toFixed(0);
  const pdrv = pedal / 100;
  const escTxt = c.escActive ? 'Intervening' : (state.escOn && !state.wssFault ? 'Standby' : 'Off');
  const yawTxt = (c.r * 57.296).toFixed(1) + ' °/s (asked ' + (c.rDes * 57.296).toFixed(1) + ')';
  const off = state.corner ? Math.abs(Math.hypot(c.X, c.Z - (RP)) - RP) > LANE * 0.9 : Math.abs(c.Z) > LANE * 0.5;
  offTrack = off;
  const dist = c.braking ? c.brakeS.toFixed(1) + ' m' : (c.lastStop ? c.lastStop.dist.toFixed(1) + ' m (last stop)' : '—');
  let statusTxt = 'Monitoring', ok = true;
  if (state.wssFault) { statusTxt = 'Sensor fault'; ok = false; }
  else if (off && c.vx > 1) { statusTxt = state.corner ? 'Running wide: left the lane' : 'Left the lane'; ok = false; }
  else if (regulating) statusTxt = 'ABS active';
  else if (c.escActive) statusTxt = 'ESC intervening';
  else if (!state.absOn) { statusTxt = 'ABS off'; ok = false; }
  else if (cornerLimited) statusTxt = 'Cruise limited for the corner';
  ui.monitor.update({
    value: { text: String(Math.round(v)), unit: ' km/h', bar: pdrv * 100, barColor: regulating ? 'var(--warn)' : 'var(--al-accent)' },
    rows: {
      slip: [Math.round(maxSlip * 100) + ' %', maxSlip > 0.5 ? 'crit' : maxSlip > 0.28 ? 'warn' : 'ok'],
      abs: [absTxt, absTone],
      fl: [state.wssFault ? 'no signal' : WSIGN(wk[0]), state.wssFault ? 'crit' : (wk[0] < v * 0.5 && v > 10 ? 'crit' : '')],
      fr: WSIGN(wk[1]), rl: WSIGN(wk[2]), rr: WSIGN(wk[3]),
      press: pedal > 2 ? 'driver ' + bar(pdrv) + ' bar · FL ' + bar(c.pDisp[0]) + ' · RL ' + bar(c.pDisp[2]) : '0 bar',
      yaw: yawTxt,
      esc: [escTxt, c.escActive ? 'warn' : ''],
      dist, cmp: cmpText()
    },
    status: [statusTxt, ok]
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   MESSAGING
   ═══════════════════════════════════════════════════════════════════════ */
const bridge = ui.wireBridge({
  viewManager,
  state,
  onCommand: (d) => {
    if (d.action === 'reset') {
      ui.controls.resetAll();
      state.surface = 'dry'; state.absOn = true; state.escOn = true; state.corner = false; state.compare = false; state.wssFault = false;
      for (const k of Object.keys(results)) delete results[k];
      lastKey = '';
      applyBadge();
      restartRun();
    }
  }
});
bridge.ready();
bridge.setStatus('Brakes online', '#f43f5e');

/* ═══════════════════════════════════════════════════════════════════════
   ANIMATION
   ═══════════════════════════════════════════════════════════════════════ */
let last = performance.now(), raf = 0, roClock = 0, trClock = 0;
const tmp = new THREE.Vector3(), camTarget = new THREE.Vector3(), prevTarget = new THREE.Vector3(0.2, 0.5, 0), delta = new THREE.Vector3();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const valveState = new WeakMap();
function setValve(mesh, mat) { if (valveState.get(mesh) === mat) return; valveState.set(mesh, mat); viewManager.setMeshMaterial(mesh, mat); }
let pumpSpin = 0;
const VIS_SPIN = 0.25;                                     /* wheels are drawn turning at a quarter of their true rate so fast ones do not strobe */

function poseCar(vis, c, isMain, dt) {
  vis.group.position.set(c.X, 0, c.Z);
  vis.group.rotation.y = -c.psi;
  vis.body.rotation.z = clampN(c.ax * 0.006, -0.07, 0.04);                                      /* nose dives under braking */
  for (let i = 0; i < 4; i++) {
    const w = vis.wheels[i];
    w.spin.rotation.z -= c.w[i] * dt * VIS_SPIN;
    if (w.front) w.yaw.rotation.y = -c.delta;
    const locked = c.slip[i] > 0.75 && c.vx > 1.5;
    const reg = (c.mode[i] !== 'apply' || c.p[i] < 0.98) && c.absActive && c.pedalEff > 0.04;
    w.ringM.color.setHex(locked ? 0xef4444 : (reg ? 0xf59e0b : 0x22c55e));
    /* brake disc heat */
    const heatIn = c.pDisp[i] * (i < 2 ? VEH.FRONT_BIAS : 1 - VEH.FRONT_BIAS) * c.w[i] * 0.0009;
    vis.hot[i] = clampN(vis.hot[i] + (heatIn - vis.hot[i] * 0.35) * dt * 3, 0, 1);
    w.discM.emissive.setHex(0xff5a1f); w.discM.emissiveIntensity = vis.hot[i] * 1.6;
    /* skid mark */
    if (locked && c.slip[i] > 0.75) {
      vis.skidAcc[i] += Math.hypot(c.vx, c.vy) * dt;
      if (vis.skidAcc[i] > 0.25) {
        vis.skidAcc[i] = 0;
        const x = c.X + AX[i] * Math.cos(c.psi) - AZ[i] * Math.sin(c.psi), z = c.Z + AX[i] * Math.sin(c.psi) + AZ[i] * Math.cos(c.psi);
        addSkid(x, z, c.psi + (i < 2 ? c.delta * 0.0 : 0));
      }
    } else vis.skidAcc[i] = 0.25;
  }
  if (!isMain) return;
  /* hardware: pulses, valve lamps, LEDs */
  const hw = vis.hw, pedal = ui.controls.value('brake') / 100, eff = absEffective();
  let anyDump = false;
  for (let i = 0; i < 4; i++) {
    const wr = c.w[i];
    const dead = state.wssFault && i === 0;
    hw.wss[i].update(dt, dead ? 0 : clampN(wr / 35, 0, 2.5) * 0.9, dead ? 0 : (wr > 0.8 ? 1 : 0));
    hw.wss[i].mat.color.setHex(wr > 0.8 ? 0x67e8f9 : 0xef4444);
    if (i === 0) vis.wheels[0].sensorMesh.material.color.setHex(state.wssFault ? 0xef4444 : 0x94a3b8);
    const modeI = pedal > 0.04 && eff ? c.mode[i] : 'idle';
    const v = hw.valves[i];
    setValve(v.inlet, modeI === 'apply' && c.absActive ? valveApplyM : (pedal > 0.04 && !c.absActive ? valveApplyM : valveOffM));
    setValve(v.outlet, modeI === 'dump' ? valveDumpM : valveOffM);
    if (modeI === 'dump') anyDump = true;
    const P = c.pDisp[i];
    hw.brake[i].update(dt, modeI === 'dump' ? -0.9 : 0.35 + 0.8 * P, P > 0.03 ? clampN(0.25 + P, 0, 1) : 0);
  }
  pumpSpin += (anyDump ? 30 : -pumpSpin * 4) * dt * (anyDump ? 1 : 1);
  hw.pump.rotation.z -= (anyDump ? 30 : 4) * dt * (anyDump ? 1 : 0);
  const act = c.absActive && eff && pedal > 0.04;
  hw.cmd.update(dt, act ? 1.4 : 0.3, pedal > 0.04 ? (act ? 1 : 0.35) : 0.15);
  hw.mc.update(dt, 0.5 + pedal, pedal > 0.03 ? 1 : 0);
  hw.yawP.update(dt, 0.6, clampN(0.2 + Math.abs(c.r) * 3, 0, 1)); hw.sasP.update(dt, 0.6, clampN(0.2 + Math.abs(c.delta) * 3, 0, 1));
  hw.ledM.abs.emissiveIntensity = act ? 2.5 : 0; hw.ledM.esc.emissiveIntensity = c.escActive ? 2.5 : 0; hw.ledM.flt.emissiveIntensity = state.wssFault ? 2.5 : 0;
}

function tick(now) {
  const dtReal = Math.min(0.05, (now - last) / 1000);
  last = now;
  const running = state.playing;
  const simDt = running ? dtReal * state.speedMul : 0;

  /* ── physics: small fixed steps so the ABS cycle and the tyre model stay stable ── */
  if (simDt > 0) {
    const n = Math.min(40, Math.max(1, Math.ceil(simDt / (1 / 300)))), h = simDt / n;
    const surf = SURFACES[state.surface], pedal = ui.controls.value('brake') / 100, vsetRaw = ui.controls.value('speed') / 3.6;
    simMain.opts.absOn = state.absOn; simMain.opts.wssFault = state.wssFault; simMain.opts.escOn = state.escOn;
    simTwin.opts.absOn = state.compare ? !absEffective() : true; simTwin.opts.wssFault = false; simTwin.opts.escOn = state.escOn;
    const lM = laneOf(false), lT = laneOf(true);
    const vM = cruiseFor(simMain, false, vsetRaw), vT = cruiseFor(simTwin, true, vsetRaw);
    cornerLimited = state.corner && vM < vsetRaw - 0.05;
    simMain.pedalEff = pedal; simTwin.pedalEff = pedal;
    for (let k = 0; k < n; k++) {
      simMain.step({ dt: h, vset: vM, pedal, surf, surfId: state.surface, cornering: state.corner, Rp: lM.Rp, z0: lM.z0 });
      if (state.compare) simTwin.step({ dt: h, vset: vT, pedal, surf, surfId: state.surface, cornering: state.corner, Rp: lT.Rp, z0: lT.z0 });
    }
    /* brake-point flags on the frame braking starts */
    for (const [c, isTwin] of [[simMain, false], [simTwin, true]]) {
      if (isTwin && !state.compare) continue;
      const f = brakeFlags[isTwin ? 1 : 0];
      if (c.braking && !f.visible) { const dir = isTwin ? 1 : -1; f.position.set(c.X + (-Math.sin(c.psi)) * 2.4 * dir, 0, c.Z + Math.cos(c.psi) * 2.4 * dir); f.visible = true; stopFlags[isTwin ? 1 : 0].visible = false; }
    }
    recordStops();
  }

  /* ── drawing ── */
  showSurface(state.surface);
  poseCar(mainCar, simMain, true, simDt);
  if (state.compare) poseCar(twinCar, simTwin, false, simDt);
  if (!state.corner) layoutStraight(simMain.X);
  ground.position.set(simMain.X, -0.03, simMain.Z);
  if (!state.corner) { road.position.x = simMain.X; }

  /* camera follows the cars; the user's orbit angle is kept */
  const mx = state.compare ? (simMain.X + simTwin.X) / 2 : simMain.X, mz = state.compare ? (simMain.Z + simTwin.Z) / 2 : simMain.Z;
  camTarget.set(mx, 0.5, mz);
  delta.subVectors(camTarget, prevTarget).multiplyScalar(Math.min(1, dtReal * 8 + 0.0));
  camera.position.add(delta); controls.target.add(delta); prevTarget.add(delta);

  /* ── labels ── */
  labels.hideAll();
  if (state.showLabels) {
    const L = (id, lx, ly, lz) => labels.project(id, mainCar.group.localToWorld(tmp.set(lx, ly, lz)), camera, wrap);
    L('ecu', 0.3, 0.85, 0); L('mod', 0.85, 0.75, 0.0); L('valves', 0.85, 0.75, -0.2); L('pump', 0.85, 0.5, 0.36); L('wss', AX[0], 0.8, AZ[0] * 1.15);
    L('yaw', -0.2, 0.6, 0); L('sas', 0.62, 1.1, 0); L('mc', 1.4, 0.8, 0);
    L('you', 0, 1.9, 0);
    if (state.compare) labels.project('twin', twinCar.group.localToWorld(tmp.set(0, 1.9, 0)), camera, wrap);
    if (brakeFlags[0].visible) labels.project('bf', tmp.set(brakeFlags[0].position.x, 2.5, brakeFlags[0].position.z), camera, wrap);
    if (stopFlags[0].visible) labels.project('sf1', tmp.set(stopFlags[0].position.x, 2.5, stopFlags[0].position.z), camera, wrap);
    if (stopFlags[1].visible && state.compare) labels.project('sf2', tmp.set(stopFlags[1].position.x, 2.5, stopFlags[1].position.z), camera, wrap);
  }

  controls.update();
  renderer.render(scene, camera);

  /* ── readouts ── */
  roClock += dtReal; trClock += dtReal;
  if (roClock > 0.12) { updateReadouts(roClock); roClock = 0; }
  if (trClock > 0.033) {
    trClock = 0;
    const c = simMain, v = Math.hypot(c.vx, c.vy) * 3.6, wk = c.w.map((w) => w * VEH.RW * 3.6);
    ui.monitor.update({ traces: {
      spd: [v, state.wssFault ? 0 : wk[0], wk[1], wk[2], wk[3]],
      prs: [ui.controls.value('brake'), c.pDisp[0] * 100, c.pDisp[2] * 100]
    } });
  }
}

function frame(now) { raf = requestAnimationFrame(frame); tick(now); }
if (reduced) {
  setInterval(() => tick(performance.now()), 120);
} else {
  raf = requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', () => {
  if (reduced) return;
  if (document.hidden) {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  } else if (!raf) {
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }
});

updateReadouts(0);
</script>
</body>
</html>
