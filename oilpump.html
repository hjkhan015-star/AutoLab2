/* ═══════════════════════════════════════════════════════════════════
   PHYSICS MODEL — pure, named functions.
   Simplified physical trends, not a bench lookup table.
   ═══════════════════════════════════════════════════════════════════ */

function clampN(x, a, b) {
  if (!Number.isFinite(x)) return a;
  return x < a ? a : (x > b ? b : x);
}
const num = (x, d) => (Number.isFinite(x) ? x : d);

/* ── named constants ─────────────────────────────────────────────── */
const VISC_40     = 100;     /* cSt, reference kinematic viscosity at 40 °C        */
const VISC_SLOPE  = 0.0385;  /* 1/°C, exponential fall of viscosity with temp      */
const VISC_MIN    = 2.5;     /* cSt, floor for very hot oil                        */
const VISC_MAX    = 4000;    /* cSt, ceiling for very cold oil                     */
const R_BASE      = 0.80;    /* bar per L/min at reference viscosity & new bearings*/
const CLEAR_WEAR  = 1.2;     /* extra clearance factor at 100 % bearing wear       */
const RELIEF_SET  = 4.5;     /* bar, healthy relief cracking pressure              */
const RELIEF_STUCK= 1.2;     /* bar, when the relief valve is stuck open           */
const TAU_OIL     = 45;      /* s, oil warm-up time constant                       */
const OIL_COLD    = 20;      /* °C, oil temperature on a cold start                */
const DISP_CC     = { gear: 12, gerotor: 10, vane: 14 };   /* cc per pump revolution */
const RIPPLE      = { gear: 0.075, gerotor: 0.035, vane: 0.018 }; /* ±fraction */
const TYPE_NAME   = { gear: 'External gear', gerotor: 'Gerotor', vane: 'Vane' };

/* Kinematic viscosity of engine oil. Direction: hotter oil -> thinner.
   Simplified exponential (Walther-ish), not a full ASTM chart. */
function oilViscosity(Tc) {
  const T = clampN(num(Tc, 90), -20, 160);
  return clampN(VISC_40 * Math.exp(-VISC_SLOPE * (T - 40)), VISC_MIN, VISC_MAX);
}

/* Volumetric efficiency 0.15..0.99. Direction: more wear -> worse
   sealing -> less flow; thicker oil -> better sealing -> more flow. */
function pumpVolEff(wear, Tc) {
  const w = clampN(num(wear, 0), 0, 1);
  const seal = clampN((oilViscosity(Tc) - 3) / 50, 0, 1);
  return clampN(0.94 - 0.40 * w + 0.05 * seal, 0.15, 0.99);
}

/* Delivered flow (L/min). Direction: more rpm -> more flow; more wear
   -> less; entrained air -> much less. */
function pumpFlowLpm(rpm, type, wear, Tc, aeration) {
  const disp = DISP_CC[type] || DISP_CC.gear;
  const eff = pumpVolEff(wear, Tc) * (1 - 0.55 * clampN(aeration, 0, 1));
  return Math.max(0, clampN(num(rpm, 800), 0, 8000) * disp / 1000 * eff);
}

/* Oil pressure (bar) developed across the bearings. Direction: more
   flow / thicker oil -> more pressure; bigger bearing clearance (wear)
   -> less. Capped by the relief valve setting. */
function oilPressure(flowLpm, Tc, wear, reliefSet) {
  const viscR = clampN(oilViscosity(Tc) / 60, 0.04, 8);
  const clearance = 1 + CLEAR_WEAR * clampN(num(wear, 0), 0, 1);
  const raw = Math.max(0, num(flowLpm, 0)) * R_BASE * viscR / clearance;
  const set = clampN(num(reliefSet, RELIEF_SET), 0.2, 12);
  return { p: Math.min(raw, set), raw: raw, open: raw > set };
}

/* Entrained-air fraction 0..0.95. Direction: high rpm + low sump level
   or a restricted pickup screen -> the pump draws air. */
function aerationPct(rpm, level, screenClog) {
  const rpmN = clampN((num(rpm, 800) - 1400) / 5000, 0, 1);
  const lowL = clampN((0.55 - clampN(num(level, 1), 0, 1)) / 0.55, 0, 1);
  const clog = clampN(num(screenClog, 0), 0, 1);
  return clampN(100 * (0.55 * rpmN * lowL + 0.75 * rpmN * clog), 0, 95);
}

/* Oil temperature the engine settles at. Direction: more rpm / more
   load -> hotter oil. The state chases this with a first-order lag. */
function oilTempTarget(rpm, load) {
  const rpmN = clampN((num(rpm, 800) - 800) / 5700, 0, 1);
  return 80 + 22 * rpmN + 15 * clampN(num(load, 0), 0, 1);
}

/* Bearing clearance in mm for display. Direction: more wear -> bigger. */
function bearingClearanceMm(wear) {
  return 0.040 + 0.060 * clampN(num(wear, 0), 0, 1);
}

/* ── rolling graph ───────────────────────────────────────────────── */
function drawGraph() {
  const W = gcv.width, Hh = gcv.height;
  gctx.clearRect(0, 0, W, Hh);
  gctx.strokeStyle = 'rgba(148,163,184,0.16)';
  gctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const y = Math.round(Hh * i / 4) + 0.5;
    gctx.beginPath(); gctx.moveTo(0, y); gctx.lineTo(W, y); gctx.stroke();
  }
  const n = sim.samples.length;
  if (n < 2) return;
  const xAt = (i) => ((i + (GRAPH_N - n)) / (GRAPH_N - 1)) * W;
  const yP  = (v) => Hh - clampN(v / 6, 0, 1) * (Hh - 6) - 3;
  const yT  = (v) => Hh - clampN((v - 0) / 140, 0, 1) * (Hh - 6) - 3;

  gctx.beginPath();
  gctx.moveTo(xAt(0), Hh);
  for (let i = 0; i < n; i++) gctx.lineTo(xAt(i), yP(sim.samples[i].P));
  gctx.lineTo(xAt(n - 1), Hh);
  gctx.closePath();
  gctx.fillStyle = 'rgba(132,204,22,0.16)';
  gctx.fill();

  gctx.beginPath();
  for (let i = 0; i < n; i++) {
    const x = xAt(i), y = yP(sim.samples[i].P);
    if (i) gctx.lineTo(x, y); else gctx.moveTo(x, y);
  }
  gctx.strokeStyle = '#84cc16'; gctx.lineWidth = 1.6; gctx.stroke();

  gctx.beginPath();
  for (let i = 0; i < n; i++) {
    const x = xAt(i), y = yT(sim.samples[i].T);
    if (i) gctx.lineTo(x, y); else gctx.moveTo(x, y);
  }
  gctx.strokeStyle = '#fb923c'; gctx.lineWidth = 1.4; gctx.stroke();
}

/* ═══════════════════════════════════════════════════════════════════
   MODULE SCENE (per-module 3D parts)
   ═══════════════════════════════════════════════════════════════════ */
function build(H){
 const { box, cyl, cylZ, mat, glass, pipe, stream, lc, clamp, root, THREE, lowEnd } = H;

 const steel = mat(0x94a3b8, .85, .30);
 const gm    = mat(0xb8c0cc, .85, .30);
 const dark  = mat(0x3d4555, .60, .50);
 const N = 10;

 /* ── housing ──────────────────────────────────────────────────── */
 box(2.6, 1.9, .12, dark, 0, 0, -.55);
 box(2.6, 1.9, .90, glass(0x94a3b8, .20), 0, 0, 0);

 /* ── gear pump internals ──────────────────────────────────────── */
 const gearGroup = new THREE.Group(); root.add(gearGroup);
 function gear(x){
   const w = new THREE.Group(); w.position.set(x, 0, 0); gearGroup.add(w);
   const g = Base.makeCog(.42, .6, N, .16, .14, gm, gm);
   g.rotation.x = Math.PI / 2; w.add(g);
   cylZ(.10, .10, 1.40, steel, 0, 0, 0, w);
   return w;
 }
 const gA = gear(-.5), gB = gear(.5);

 /* ── gerotor internals ────────────────────────────────────────── */
 const gerotorGroup = new THREE.Group(); gerotorGroup.visible = false; root.add(gerotorGroup);
 const gerOuterG = new THREE.Group(); gerotorGroup.add(gerOuterG);
 const gerOuter = Base.makeCog(.50, .6, 10, .16, .12, gm, gm);
 gerOuter.rotation.x = Math.PI / 2; gerOuterG.add(gerOuter);
 const gerInnerG = new THREE.Group(); gerotorGroup.add(gerInnerG);
 const gerInner = Base.makeCog(.33, .6, 9, .16, .12, steel, steel);
 gerInner.rotation.x = Math.PI / 2; gerInnerG.add(gerInner);
 cylZ(.10, .10, 1.40, steel, 0, 0, 0, gerotorGroup);

 /* ── vane internals ───────────────────────────────────────────── */
 const vaneGroup = new THREE.Group(); vaneGroup.visible = false; root.add(vaneGroup);
 cylZ(.62, .62, .50, glass(0x64748b, .30), 0, 0, 0, vaneGroup);
 cylZ(.22, .22, .50, gm, 0, 0, 0, vaneGroup);
 for (let i = 0; i < 5; i++) {
   const a = i / 5 * Math.PI * 2;
   const v = box(.09, .36, .46, steel, Math.cos(a) * .34, Math.sin(a) * .34, 0, vaneGroup);
   v.rotation.z = a;
 }
 cylZ(.10, .10, 1.40, steel, 0, 0, 0, vaneGroup);

 /* ── wear warning ring around the pump ────────────────────────── */
 const wearMat = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xef4444, emissiveIntensity: 0, transparent: true, opacity: 0.95 });
 H.put(new THREE.Mesh(new THREE.TorusGeometry(1.02, 0.045, 8, 44), wearMat), 0, 0, 0.46);

 /* ── sump + oil ───────────────────────────────────────────────── */
 box(3.6, .5, 2.0, glass(0x94a3b8, .14), 0, -2.75, 0);
 const sumpOilMat = glass(0xf59e0b, .44);
 const sumpOil = box(3.4, .46, 1.8, sumpOilMat, 0, -2.75, 0);

 /* ── pickup + strainer ────────────────────────────────────────── */
 cyl(.38, .38, .35, mat(0x64748b, .4, .6), 0, -2.3, 0);
 const clogMat = glass(0x1a1410, 0.0);
 const clogMesh = cyl(.44, .44, .40, clogMat, 0, -2.3, 0);
 clogMesh.visible = false;

 /* ── pipes + relief valve ─────────────────────────────────────── */
 pipe([[0, -2.3, 0], [0, -.85, 0]], .16, dark);
 pipe([[0, .85, 0], [0, 1.7, 0], [2.6, 1.7, 0]], .16, dark);
 cyl(.30, .30, 1.00, glass(0x64748b, .35), 2.0, 1.05, 0);
 cyl(.36, .36, .14, dark, 2.0, .50, 0);
 const reliefMat = mat(0xa3e635, .6, .4, { emissive: 0x000000, emissiveIntensity: 0 });
 const plunger = cyl(.20, .20, .30, reliefMat, 2.0, .75, 0);
 const spring = H.put(Base.makeHelixSpring(.14, .025, 7, 1, mat(0x9aa3b2, .8, .3), 40), 2.0, 0, 0);

 /* ── particle streams ─────────────────────────────────────────── */
 const nIn  = lowEnd ?  8 : 14;
 const nG   = lowEnd ? 10 : 18;
 const nOut = lowEnd ? 10 : 18;
 const nCav = lowEnd ?  6 : 10;

 const inL = stream([[0, -2.3, 0], [0, -.9, 0]], nIn, 0xfbbf24, .11);
 const sL  = stream([[0, -.9, 0], [-.75, -.75, 0], [-.95, 0, 0], [-.75, .75, 0], [0, .9, 0]], nG, 0xfbbf24, .10);
 const sR  = stream([[0, -.9, 0], [.75, -.75, 0], [.95, 0, 0], [.75, .75, 0], [0, .9, 0]], nG, 0xfbbf24, .10);
 const outS = stream([[0, .9, 0], [0, 1.7, 0], [2.6, 1.7, 0], [3.6, 1.7, 0]], nOut, 0xfbbf24, .11);
 const cavS = stream([[0, -2.05, 0], [0, -1.55, 0], [0, -1.0, 0]], nCav, 0xf1f5f9, .10);

 let spin = 0, lastDom = 0;
 const tmpCol = new THREE.Color();

 return {
  labels: [
    ['Drive gear', [-.5, .85, .5]],
    ['Driven gear', [.5, -.85, .5]],
    ['Pump rotors', [0, 0, .55]],
    ['Pickup strainer', [0, -2.0, .6]],
    ['Outlet to galleries', [3.0, 2.05, 0]],
    ['Relief valve', [2.0, 1.7, .5]],
    ['Sump', [-1.7, -2.5, 1]]
  ],
  update(c){
   /* ── 1. inputs ─────────────────────────────────────────────── */
   const dt    = Math.max(0, num(c.dt, 0)) * S.speed;
   const k     = clampN(c.k, 0, 1);
   const rpm   = 800 + 5700 * k;
   const fault = S.fault;
   const type  = TYPE_NAME[S.type] ? S.type : 'gear';

   /* toolbar Reset rewinds simT -> detect and clear the model */
   if (sim.lastT >= 0 && c.t + 1e-4 < sim.lastT) resetModel();
   sim.lastT = c.t;

   /* ── 2. wear, level, screen, relief set ───────────────────── */
   let wear = clampN(S.wear, 0, 1);
   if (fault === 'worn') wear = Math.max(wear, 0.85);
   const level      = (fault === 'lowlevel') ? 0.22 : 0.92;
   const screenClog = (fault === 'screen') ? 0.85 : 0;
   let reliefSet = (fault === 'relief') ? RELIEF_STUCK : RELIEF_SET;
   if (fault === 'filter') reliefSet = RELIEF_SET;

   /* ── 3. aeration ──────────────────────────────────────────── */
   const aer = aerationPct(rpm, level, screenClog) / 100;

   /* ── 4. flow with pump-type ripple ────────────────────────── */
   const ripple = 1 + RIPPLE[type] * (0.5 * Math.sin(c.t * 9.0) + 0.5 * Math.sin(c.t * 15.3));
   const flow = pumpFlowLpm(rpm, type, wear, sim.Toil, aer) * ripple;

   /* ── 5. pressure ──────────────────────────────────────────── */
   const pres = oilPressure(flow, sim.Toil, wear, reliefSet);
   let p = pres.p;
   if (fault === 'filter') p = Math.min(reliefSet, p + 1.4);   /* bypass blocked -> spike */
   p *= (1 - 0.14 * Math.abs(Math.sin(c.t * 3.1)) * aer);

   /* ── 6. oil temperature state ─────────────────────────────── */
   const Ttgt = oilTempTarget(rpm, S.load);
   if (dt > 0) sim.Toil += (Ttgt - sim.Toil) * (1 - Math.exp(-dt / TAU_OIL));
   sim.Toil = clampN(sim.Toil, 0, 145);

   const visc = oilViscosity(sim.Toil);
   const clr  = bearingClearanceMm(wear);

   /* ── 7. status text ───────────────────────────────────────── */
   let stateTxt;
   if (aer > 0.35)          stateTxt = 'CAVITATING';
   else if (p < 1.0)        stateTxt = 'LOW PRESSURE';
   else if (pres.open)      stateTxt = 'Relief open';
   else if (sim.Toil < 50)  stateTxt = 'Warming up';
   else                     stateTxt = 'Normal';

   /* ── 8. 3D visuals ────────────────────────────────────────── */
   gearGroup.visible    = (type === 'gear');
   gerotorGroup.visible = (type === 'gerotor');
   vaneGroup.visible    = (type === 'vane');

   spin += (rpm / 60) * Math.PI * 2 * dt;
   gA.rotation.z = -spin;
   gB.rotation.z =  spin + Math.PI / N;
   gerOuterG.rotation.z = spin * 0.80;
   gerInnerG.rotation.z = spin;
   vaneGroup.rotation.z = spin;

   /* wear ring glows red with wear */
   wearMat.emissiveIntensity = clampN((wear - 0.35) / 0.65, 0, 1) * (0.55 + 0.45 * Math.abs(Math.sin(c.t * 3.5)));

   /* relief plunger lift */
   const lift = clampN((pres.raw - reliefSet) / 2.5, 0, 1) * 0.30;
   const py = 0.75 + lift;
   plunger.position.y = py;
   spring.position.y  = py + 0.15;
   spring.scale.y     = Math.max(0.15, (1.55 - (py + 0.15)));
   if (fault === 'relief') {
     reliefMat.emissive.setHex(0xef4444);
     reliefMat.emissiveIntensity = 0.45 + 0.35 * Math.abs(Math.sin(c.t * 4));
     plunger.position.y = 1.05;
     spring.scale.y = 0.30;
   } else {
     reliefMat.emissive.setHex(0x000000);
     reliefMat.emissiveIntensity = 0;
   }

   /* clogged screen overlay + sump level */
   clogMesh.visible = (screenClog > 0.05);
   clogMat.opacity = screenClog * 0.92;
   const lvlScale = clampN(level, 0.05, 1);
   sumpOil.scale.y = Math.max(0.12, lvlScale);
   sumpOil.position.y = -2.75 - (1 - lvlScale) * 0.22;
   sumpOilMat.color.copy(lc(0xf59e0b, 0xb45309, clampN((sim.Toil - 20) / 110, 0, 1)));

   /* stream speed / density / colour */
   const flowN = clampN(flow / 70, 0, 1.3);
   const spd   = 0.05 + 0.45 * flowN;
   const dens  = 0.20 + 0.80 * flowN;
   tmpCol.copy(lc(0xfbbf24, 0xb45309, clampN((sim.Toil - 20) / 110, 0, 1)));
   tmpCol.lerp(new THREE.Color(0xf1f5f9), clampN(aer, 0, 1) * 0.8);

   inL.update(c.t, spd, dens);  inL.mat.color.copy(tmpCol);
   sL.update(c.t, spd, dens);   sL.mat.color.copy(tmpCol);
   sR.update(c.t, spd, dens);   sR.mat.color.copy(tmpCol);
   outS.update(c.t, spd, dens); outS.mat.color.copy(tmpCol);
   cavS.update(c.t, 0.35, clampN(aer * 1.4, 0, 1));

   /* ── 9. throttled DOM work (graph + warning) ──────────────── */
   const now = performance.now();
   if (now - lastDom > 140) {
     lastDom = now;
     if (dt > 0) {
       sim.samples.push({ P: p, T: sim.Toil });
       if (sim.samples.length > GRAPH_N) sim.samples.shift();
       drawGraph();
     }
     let warn = FAULT_INFO[fault] ? FAULT_INFO[fault].warn : '';
     if (!warn) {
       if (aer > 0.35) {
         warn = 'Aeration at ' + (aer * 100).toFixed(0) + ' % - the pump is drawing air. Check the sump level and the pickup screen before revving further.';
       } else if (p < 1.0) {
         warn = 'Oil pressure ' + p.toFixed(2) + ' bar - below the low-pressure threshold. Stop the engine and check the level before driving.';
       } else if (p < 2.0) {
         warn = 'Oil pressure is low (' + p.toFixed(2) + ' bar). Typical of worn bearings or a weak pump when the oil is hot.';
       } else if (sim.Toil > 130) {
         warn = 'Oil temperature ' + sim.Toil.toFixed(0) + ' \u00B0C - the oil is thinning fast. Reduce load and let it cool.';
       }
     }
     elWarn.textContent = warn;
     elWarn.classList.toggle('show', !!warn);
   }

   /* ── 10. readouts ─────────────────────────────────────────── */
   const pState    = p < 1.0 ? 'crit' : (p < 2.0 ? 'warn' : (p > 5.6 ? 'warn' : 'ok'));
   const flowState = flow < 4 ? 'crit' : (flow < 10 ? 'warn' : 'ok');
   const relState  = pres.open ? 'warn' : 'ok';
   const tState    = sim.Toil > 130 ? 'crit' : (sim.Toil > 115 ? 'warn' : 'ok');
   const vState    = visc > 600 ? 'warn' : (visc < 5 ? 'warn' : 'ok');
   const aState    = aer > 0.40 ? 'crit' : (aer > 0.15 ? 'warn' : 'ok');
   const cState    = clr > 0.085 ? 'warn' : 'ok';
   const sState    = (aer > 0.40 || p < 1.0) ? 'crit' : ((p < 2.0 || pres.open) ? 'warn' : 'ok');

   return {
     big: p.toFixed(2),
     unit: ' bar',
     bar: clampN(p / 6 * 100, 0, 100),
     rows: {
       flow:   flow.toFixed(1) + ' L/min',
       relief: pres.open ? 'Open (bypassing)' : 'Closed'
     },
     ro: {
       press:  [p.toFixed(2) + ' bar', pState],
       flow:   [flow.toFixed(1) + ' L/min', flowState],
       relief: [pres.open ? 'Open (bypassing)' : 'Closed', relState],
       temp:   [sim.Toil.toFixed(0) + ' \u00B0C', tState],
       visc:   [visc.toFixed(1) + ' cSt', vState],
       aer:    [(aer * 100).toFixed(0) + ' %', aState],
       clr:    [clr.toFixed(3) + ' mm', cState],
       type:   [TYPE_NAME[type], ''],
       state:  [stateTxt, sState]
     },
     status: [stateTxt, true],
     ctl: rpm.toFixed(0) + ' rpm'
   };
  }
 };
}

runGuidedModule(CFG, build);
</script>
</body>
</html>
