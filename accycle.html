<script type="module">
import { runGuidedModule } from './components.js';


/* ── CONFIG (module content) ─────────────────────────────────────── */
const CFG = {
  "moduleId": "accycle",
  "title": "A/C Refrigeration Cycle",
  "kicker": "Climate Control (HVAC)",
  "accent": "#06b6d4",
  "badge": "Compressor · Condenser · Evaporator",
  "camPos": [2.4, 1.6, 15.8],
  "target": [-0.2, -0.1, 0],
  "floorY": -3.6,
  "ctl": { "label": "Compressor speed", "val": 40, "caption": "rpm" },
  "chipLabel": "Vent air",
  "rows": [],
  "ro": [
    ["hi", "High side (gauge)"], ["lo", "Low side (gauge)"], ["ev", "Evaporator temp"], ["cond", "Condenser temp"],
    ["clutch", "Compressor clutch"], ["cabin", "Cabin temp"], ["air", "Cabin air flow"], ["diag", "Gauge diagnosis"]
  ],
  "legend": [
    ["var(--c-red)", "Hot high-pressure gas"],
    ["var(--c-yellow)", "High-pressure liquid"],
    ["var(--c-blue)", "Cold low-pressure liquid / gas mix"],
    ["var(--c-sky)", "Cold vapour back to the compressor"]
  ],
  "overview": "<div class=\"al-sec\"><h4>Moving heat out of the cabin</h4><p>An A/C does not make cold, it moves heat. A refrigerant (R-134a or R-1234yf) boils at a very low temperature when its pressure is low, soaking up heat from the cabin air, then is compressed and condensed to dump that heat outside.</p></div><div class=\"al-sec\"><h4>Follow the colours round the loop</h4><ul><li><b>Compressor</b> (red line out) &ndash; the clutch pulley turns the pumping pistons; low-pressure vapour leaves as hot, high-pressure gas.</li><li><b>Condenser + fan</b> &ndash; air through the fins cools the gas until it turns to liquid (red tubes turn yellow).</li><li><b>Receiver-drier</b> (yellow line) &ndash; stores liquid, filters it and its desiccant bag absorbs moisture.</li><li><b>Expansion valve</b> &ndash; a tiny restriction; pressure drops and the liquid turns cold (blue line). The bulb on the outlet pipe senses the superheat and opens or closes it.</li><li><b>Evaporator</b> &ndash; the cold liquid boils inside the core, absorbing heat from the blower air, and returns as cold vapour (light blue) to the compressor.</li></ul></div><div class=\"al-sec\"><h4>The cabin fan control panel</h4><p>The knobs on the dashboard panel are live: <b>Blower speed</b> sets how much cabin air crosses the evaporator, <b>Set temp</b> sets where the thermostat cycles the clutch, and the <b>A/C</b> and <b>Recirc</b> buttons light up when on. Use the dock to move them and watch the panel follow.</p></div><div class=\"al-sec\"><h4>Try it</h4><p>Change <b>Compressor speed</b>, <b>Outside temp</b> and the blower, then pick a fault and read the two gauges the way a technician does: the pair of readings tells you what is wrong.</p></div><div class=\"al-sec\"><h4>Safety and service</h4><p>Refrigerant must be recovered with a machine, never vented. The system is dried with a vacuum before recharging, because moisture freezes and forms acid.</p></div>",
  "faults": [
    ["Low refrigerant (leak)", "Warm vent air, both gauges low, clutch cycles rapidly.", "Leak-test with UV dye or a sniffer, repair, evacuate and recharge by weight."],
    ["Overcharge", "High pressures, poor cooling, compressor strain.", "Recover the charge and refill to the exact specified weight."],
    ["Blocked expansion valve / orifice tube", "Low side near vacuum, frost on the valve, high side normal.", "Replace the valve or tube and the receiver-drier; flush debris."],
    ["Condenser fan not working", "High side very high at idle, better at speed.", "Check fan relay, fuse and motor; clean the condenser fins."],
    ["Weak compressor", "Low side too high and high side too low.", "Check the clutch gap, then replace the compressor and flush the system."]
  ],
  "quiz": [
    ["Where does the refrigerant boil and absorb heat?", ["Condenser", "Evaporator", "Compressor"], 1, "The evaporator boils the refrigerant, taking heat from the cabin air."],
    ["Which part causes the pressure drop that makes it cold?", ["Expansion valve", "Compressor", "Receiver-drier"], 0, "The restriction drops the pressure so the liquid flashes and chills."],
    ["Both gauges low and warm air suggests...", ["Overcharge", "Low refrigerant", "Good system"], 1, "Too little refrigerant gives low pressures and weak cooling."],
    ["What does the receiver-drier's desiccant bag do?", ["Cools the liquid", "Absorbs moisture", "Raises the pressure"], 1, "Moisture would freeze at the valve and form acid in the system."],
    ["Why does the compressor clutch cycle on and off?", ["The thermostat stops the evaporator freezing", "The belt slips", "The fan is too slow"], 0, "When the evaporator nears 0 degrees C the clutch drops out so the core does not ice up."],
    ["Which line is the hottest?", ["Compressor to condenser", "Valve to evaporator", "Evaporator to compressor"], 0, "Compressing the gas heats it, so the discharge line is the hottest."]
  ]
};

/* ── module state + dock options ─────────────────────────────────── */
const S = { amb: 32, fault: 'ok', fan: 2, set: 22, ac: true, recirc: false };
CFG.ctls = [
  { id: 'ctl', preset: 'percent', label: 'Compressor speed', unit: 'rpm', min: 800, max: 4500, step: 50, def: 1800 },
  { id: 'amb', preset: 'percent', label: 'Outside temp', unit: '°C', min: 15, max: 45, step: 1, def: 32, onChange: (v) => { S.amb = v; } },
  { id: 'fan', preset: 'percent', label: 'Blower speed', unit: '', min: 0, max: 4, step: 1, def: 2, onChange: (v) => { S.fan = v; } },
  { id: 'set', preset: 'percent', label: 'Set temp', unit: '°C', min: 16, max: 30, step: 1, def: 22, onChange: (v) => { S.set = v; } }
];
CFG.options = [
  { id: 'ac', type: 'toggle', label: 'A/C', def: true, onChange: (on) => { S.ac = !!on; } },
  { id: 'recirc', type: 'toggle', label: 'Recirc', def: false, onChange: (on) => { S.recirc = !!on; } },
  { id: 'fault', type: 'choice', layout: 'select', label: 'Fault', options: [{ id: 'ok', label: 'Normal' }, { id: 'low', label: 'Low refrigerant' }, { id: 'over', label: 'Overcharged' }, { id: 'clog', label: 'Blocked expansion valve' }, { id: 'fan', label: 'Condenser fan failed' }, { id: 'comp', label: 'Weak compressor' }], def: 'ok', onChange: (id) => { S.fault = id; } }
];
const sim = { Tev: 20, cabin: 32, clutch: false, run: 0, lastT: -1 };
CFG.onReset = () => { S.amb = 32; S.fault = 'ok'; S.fan = 2; S.set = 22; S.ac = true; S.recirc = false; sim.Tev = 20; sim.cabin = 32; sim.clutch = false; sim.run = 0; sim.lastT = -1; };

/* ── MODULE SCENE (per-module 3D parts) ──────────────────────────── */
function build(H) {
  const { box, cyl, cylX, cylZ, sph, mat, glass, glow, stream, lc, clamp, V3, THREE, root, lowEnd } = H;
  const TAU = Math.PI * 2;
  /* saturation pressure of R-134a (kPa abs) against temperature (deg C): a short lookup, linear in between */
  const SAT = [[-10, 201], [0, 293], [10, 414], [20, 572], [30, 770], [40, 1017], [50, 1319], [60, 1682], [70, 2117]];
  const psat = (T) => { for (let i = 1; i < SAT.length; i++) if (T <= SAT[i][0]) { const a = SAT[i - 1], b = SAT[i]; return Math.max(60, a[1] + (b[1] - a[1]) * (T - a[0]) / (b[0] - a[0])); } return SAT[SAT.length - 1][1]; };

  /* materials */
  const alu = mat(0xb9c2cf, 0.85, 0.32), aluD = mat(0x8794a6, 0.8, 0.4), steel = mat(0x94a3b8, 0.8, 0.35), dark = mat(0x1f2937, 0.3, 0.6),
        black = mat(0x0f141c, 0.2, 0.7), brass = mat(0xc9a227, 0.85, 0.3), rubber = mat(0x111418, 0.05, 0.95), finM = mat(0xd5dbe4, 0.8, 0.35),
        plastic = mat(0x2b3340, 0.2, 0.55), caseM = glass(0x94a3b8, 0.13);
  const RED = 0xef4444, YEL = 0xfacc15, BLU = 0x3b82f6, LBL = 0x93c5fd;

  /* ── 90-degree pipes: straight runs + a sphere at every elbow + fittings at the ends ── */
  function lpipe(pts, r, color, glowI) {
    const m = new THREE.MeshStandardMaterial({ color, metalness: 0.45, roughness: 0.4, emissive: color, emissiveIntensity: glowI == null ? 0.25 : glowI });
    const P = pts.map(V3), dirs = [];
    for (let i = 1; i < P.length; i++) {
      const d = new THREE.Vector3().subVectors(P[i], P[i - 1]), L = d.length(); d.normalize(); dirs.push(d);
      const seg = new THREE.Mesh(new THREE.CylinderGeometry(r, r, L, 14), m);
      seg.position.copy(P[i - 1]).addScaledVector(d, L / 2);
      seg.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d); root.add(seg);
    }
    for (let i = 1; i < P.length - 1; i++) { const e = new THREE.Mesh(new THREE.SphereGeometry(r * 1.02, 16, 12), m); e.position.copy(P[i]); root.add(e); }
    for (const [pi, di, s] of [[0, 0, 1], [P.length - 1, P.length - 2, -1]]) {   /* crimped end fittings */
      const f = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.55, r * 1.55, 0.16, 16), aluD);
      f.position.copy(P[pi]).addScaledVector(dirs[di], s * 0.1); f.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirs[di]); root.add(f);
    }
    return { mat: m, pts };
  }
  /* flow dots that follow the pipe exactly, corner to corner (the shared stream() rounds the corners) */
  const seed = stream([[0, 0, 0], [1, 0, 0]], 1, 0xffffff, 0.1); seed.points.visible = false;
  function polyStream(pts, n, color, size) {
    const P = pts.map(V3), cum = [0];
    for (let i = 1; i < P.length; i++) cum.push(cum[i - 1] + P[i].distanceTo(P[i - 1]));
    const total = cum[cum.length - 1], pos = new Float32Array(n * 3), g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const m = seed.mat.clone(); m.color.set(color); m.size = size || 0.12;
    const pt = new THREE.Points(g, m); pt.frustumCulled = false; root.add(pt);
    const v = new THREE.Vector3();
    return {
      mat: m,
      update(time, speed, density) {
        const cnt = Math.round(n * clamp(density == null ? 1 : density));
        for (let i = 0; i < n; i++) {
          if (i >= cnt) { pos[i * 3] = pos[i * 3 + 1] = pos[i * 3 + 2] = 1e4; continue; }
          let u = ((i / n) + time * speed) % 1; if (u < 0) u += 1;
          const s = u * total; let k = 1; while (k < cum.length - 1 && cum[k] < s) k++;
          const f = (s - cum[k - 1]) / Math.max(1e-6, cum[k] - cum[k - 1]);
          v.lerpVectors(P[k - 1], P[k], f); pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z;
        }
        g.attributes.position.needsUpdate = true;
      }
    };
  }

  /* ═════════ COMPRESSOR (swash-plate type, axis toward the viewer) ═════════ */
  const CP = [-3.9, 1.55, 0];
  const comp = new THREE.Group(); comp.position.set(...CP); comp.rotation.y = Math.PI / 2; root.add(comp);   /* local +z (pulley end) points right */
  cylZ(0.72, 0.72, 1.3, alu, 0, 0, -0.1, comp);                                     /* body */
  for (let i = 0; i < 6; i++) cylZ(0.76, 0.76, 0.05, aluD, 0, 0, -0.55 + i * 0.2, comp);   /* cooling ribs */
  for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; cylZ(0.17, 0.17, 1.15, aluD, Math.cos(a) * 0.62, Math.sin(a) * 0.62, -0.05, comp); }   /* piston pods */
  cylZ(0.7, 0.7, 0.3, aluD, 0, 0, -0.85, comp);                                     /* rear head */
  box(0.34, 0.42, 0.3, aluD, 0, 0.82, -0.3, comp);                                  /* discharge port block (top, toward the pulley) */
  box(0.34, 0.42, 0.3, aluD, 0, 0.82, -0.85, comp);                                 /* suction port block (top, rear) */
  cylZ(0.42, 0.42, 0.35, steel, 0, 0, 0.7, comp);                                   /* front bearing housing */
  box(0.5, 0.18, 0.3, aluD, 0.55, -0.78, -0.2, comp); box(0.5, 0.18, 0.3, aluD, -0.55, -0.78, -0.2, comp);  /* mounting lugs */
  const pulley = new THREE.Group(); pulley.position.set(0, 0, 1.0); comp.add(pulley);
  cylZ(0.78, 0.78, 0.32, steel, 0, 0, 0, pulley);
  for (let i = -2; i <= 2; i++) cylZ(0.8, 0.8, 0.022, dark, 0, 0, i * 0.06, pulley);   /* five belt grooves */
  const coilM = glow(0x22c55e, 0); cylZ(0.62, 0.62, 0.05, coilM, 0, 0, -0.18, comp);   /* field coil */
  const plate = new THREE.Group(); plate.position.set(0, 0, 1.22); comp.add(plate);
  cylZ(0.58, 0.58, 0.07, aluD, 0, 0, 0, plate);
  for (let i = 0; i < 3; i++) { const a = i / 3 * TAU; box(0.1, 0.1, 0.06, steel, Math.cos(a) * 0.45, Math.sin(a) * 0.45, 0.05, plate); }
  cylZ(0.14, 0.14, 0.14, steel, 0, 0, 0.08, plate);
  box(0.5, 0.07, 0.03, mat(0xfde047, 0.1, 0.5), 0.25, 0, 0.1, plate);               /* rotation marker */
  box(0.08, 0.1, 0.34, mat(0xfde047, 0.1, 0.5), 0.8, 0, 0, pulley);                 /* marker on the pulley rim (visible edge-on) */
  for (let i = 0; i < 4; i++) { const a = i / 4 * TAU; box(0.08, 0.08, 0.34, dark, Math.cos(a) * 0.79, Math.sin(a) * 0.79, 0, pulley).rotation.z = a; }

  /* ═════════ CONDENSER (serpentine tubes between corrugated fins) + FAN ═════════ */
  const CC = [1.6, 1.45, 0], CW = 3.6, CH = 2.1, CD = 0.34, NT = 9, tubePitch = (CH - 0.3) / (NT - 1), ty0 = CC[1] + CH / 2 - 0.15;
  box(CW, 0.08, CD, alu, CC[0], CC[1] + CH / 2 - 0.04, 0); box(CW, 0.08, CD, alu, CC[0], CC[1] - CH / 2 + 0.04, 0);
  box(0.08, CH, CD, alu, CC[0] - CW / 2 + 0.04, CC[1], 0); box(0.08, CH, CD, alu, CC[0] + CW / 2 - 0.04, CC[1], 0);
  const tubeX0 = CC[0] - CW / 2 + 0.15, tubeX1 = CC[0] + CW / 2 - 0.15;
  const condMats = [], R_U = tubePitch / 2;
  for (let i = 0; i < NT; i++) {
    const m = new THREE.MeshStandardMaterial({ color: RED, metalness: 0.4, roughness: 0.4, emissive: RED, emissiveIntensity: 0.4 }); condMats.push(m);
    cylX(0.055, 0.055, tubeX1 - tubeX0, m, CC[0], ty0 - i * tubePitch, 0);
    if (i < NT - 1) {                                                   /* U-bend joining this tube to the next */
      const right = i % 2 === 0, u = new THREE.Mesh(new THREE.TorusGeometry(R_U, 0.055, 8, 18, Math.PI), m);
      u.position.set(right ? tubeX1 : tubeX0, ty0 - i * tubePitch - R_U, 0); u.rotation.z = right ? -Math.PI / 2 : Math.PI / 2; root.add(u);
    }
  }
  const finGeo = new THREE.BoxGeometry(0.012, tubePitch - 0.05, CD - 0.04), nFinCol = lowEnd ? 40 : 82, finInst = new THREE.InstancedMesh(finGeo, finM, (NT - 1) * nFinCol);
  const dm = new THREE.Object3D();
  for (let r = 0; r < NT - 1; r++) for (let c = 0; c < nFinCol; c++) {
    dm.position.set(tubeX0 + 0.1 + (tubeX1 - tubeX0 - 0.2) * c / (nFinCol - 1), ty0 - (r + 0.5) * tubePitch, 0);
    dm.rotation.set(0, 0, (c % 2 ? 0.45 : -0.45)); dm.updateMatrix(); finInst.setMatrixAt(r * nFinCol + c, dm.matrix);
  }
  root.add(finInst);
  /* fan shroud + 7-blade fan behind the condenser */
  box(CW + 0.5, CH - 0.2, 0.12, plastic, CC[0] + 0.25, CC[1], -0.62);
  const fanP = [CC[0] + 1.0, CC[1], -0.45];
  const ringM = new THREE.Mesh(new THREE.TorusGeometry(0.92, 0.05, 10, 40), dark); ringM.position.set(...fanP); root.add(ringM);
  const fan = new THREE.Group(); fan.position.set(...fanP); root.add(fan);
  for (let i = 0; i < 7; i++) { const a = i / 7 * TAU, b = box(0.8, 0.3, 0.025, black, 0, 0, 0, fan); b.position.set(Math.cos(a) * 0.55, Math.sin(a) * 0.55, 0); b.rotation.z = a; b.rotation.x = 0.5; }
  cylZ(0.22, 0.22, 0.18, steel, 0, 0, 0.0, fan);
  cylZ(0.3, 0.3, 0.3, dark, fanP[0], fanP[1], -0.78);                                     /* fan motor */
  for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + Math.PI / 4, s = box(0.9, 0.05, 0.05, dark, 0, 0, 0); s.position.set(fanP[0] + Math.cos(a) * 0.5, fanP[1] + Math.sin(a) * 0.5, -0.62); s.rotation.z = a; }

  /* ═════════ RECEIVER-DRIER (cut-away can: desiccant bag, pick-up tube, liquid level) ═════════ */
  const DP = [4.55, -1.3];
  const canGlass = glass(0xcbd5e1, 0.2);
  cyl(0.32, 0.32, 1.5, canGlass, DP[0], DP[1], 0);
  sph(0.32, canGlass, DP[0], DP[1] - 0.75, 0).scale.set(1, 0.5, 1);
  box(0.9, 0.22, 0.5, aluD, DP[0], DP[1] + 0.86, 0);                                  /* head block with the two ports */
  cyl(0.22, 0.22, 0.85, mat(0xd6b25e, 0.1, 0.9), DP[0] - 0.02, DP[1] - 0.3, 0);       /* desiccant bag */
  cyl(0.04, 0.04, 1.5, steel, DP[0] - 0.2, DP[1] - 0.05, 0);                          /* pick-up tube */
  cyl(0.1, 0.1, 0.05, glass(0x7dd3fc, 0.7), DP[0] + 0.1, DP[1] + 0.97, 0.25);         /* sight glass */
  const liq = cyl(0.3, 0.3, 1, glass(YEL, 0.4), DP[0], DP[1] - 0.7, 0);               /* liquid level (scaled in update) */

  /* ═════════ EXPANSION VALVE (thermostatic, with sensing bulb) ═════════ */
  const VP = [3.0, -1.25];
  box(0.5, 0.5, 0.44, brass, VP[0], VP[1], 0);
  cyl(0.28, 0.28, 0.12, brass, VP[0], VP[1] + 0.32, 0);
  const dome = sph(0.27, brass, VP[0], VP[1] + 0.38, 0); dome.scale.set(1, 0.6, 1);
  cylX(0.07, 0.07, 0.25, brass, VP[0] - 0.36, VP[1], 0);                              /* outlet stub */
  const needle = cyl(0.0, 0.07, 0.3, steel, VP[0], VP[1] - 0.25, 0);                 /* adjusting needle underneath */
  cyl(0.06, 0.06, 0.3, brass, VP[0], VP[1] + 0.52, 0);
  const frostV = sph(0.38, mat(0xf8fafc, 0.1, 0.9, { transparent: true, opacity: 0.0 }), VP[0], VP[1], 0.0); frostV.scale.set(1.3, 1, 1.1);

  /* ═════════ EVAPORATOR in its case, with the blower ═════════ */
  const EC = [-3.1, -2.1, 0], EW = 3.2, EH = 1.6, ED = 0.9, NE = 7, ePitch = 0.175, ey0 = -2.5, eX0 = EC[0] - EW / 2 + 0.15, eX1 = EC[0] + EW / 2 - 0.15;
  box(EW, EH, ED, caseM, EC[0], EC[1], 0);
  box(EW + 0.06, 0.08, ED + 0.06, plastic, EC[0], EC[1] + EH / 2, 0); box(EW + 0.06, 0.08, ED + 0.06, plastic, EC[0], EC[1] - EH / 2, 0);
  const evMats = [];
  for (let i = 0; i < NE; i++) {
    const m = new THREE.MeshStandardMaterial({ color: BLU, metalness: 0.4, roughness: 0.4, emissive: BLU, emissiveIntensity: 0.4 }); evMats.push(m);
    cylX(0.05, 0.05, eX1 - eX0, m, EC[0], ey0 + i * ePitch, 0);
    if (i < NE - 1) { const right = i % 2 === 1, u = new THREE.Mesh(new THREE.TorusGeometry(ePitch / 2, 0.05, 8, 16, Math.PI), m); u.position.set(right ? eX1 : eX0, ey0 + i * ePitch + ePitch / 2, 0); u.rotation.z = right ? -Math.PI / 2 : Math.PI / 2; root.add(u); }
  }
  const eFin = new THREE.InstancedMesh(new THREE.BoxGeometry(0.012, ePitch * 6 + 0.1, 0.4), finM, lowEnd ? 40 : 70);
  for (let c = 0; c < eFin.count; c++) { dm.position.set(eX0 + 0.1 + (eX1 - eX0 - 0.2) * c / (eFin.count - 1), ey0 + ePitch * 3, -0.22); dm.rotation.set(0, 0, 0); dm.updateMatrix(); eFin.setMatrixAt(c, dm.matrix); }
  root.add(eFin);
  const frostE = box(EW - 0.2, EH - 0.3, ED - 0.1, mat(0xf8fafc, 0.1, 0.9, { transparent: true, opacity: 0 }), EC[0], EC[1], 0);
  cyl(0.03, 0.03, 0.3, steel, EC[0] - 0.4, EC[1] - EH / 2 - 0.12, 0);   /* condensate drain */
  const drops = []; for (let i = 0; i < 4; i++) drops.push(sph(0.045, glass(0x7dd3fc, 0.8), EC[0] - 0.4, EC[1] - EH / 2 - 0.3, 0));
  /* blower: motor + squirrel-cage wheel in a scroll housing, behind the evaporator */
  const BP = [EC[0], EC[1] + 0.1, -1.25];
  const blower = new THREE.Group(); blower.position.set(...BP); root.add(blower);
  const cageGeo = new THREE.BoxGeometry(0.03, 0.34, 0.5);
  for (let i = 0; i < 24; i++) { const a = i / 24 * TAU, b = new THREE.Mesh(cageGeo, steel); b.position.set(Math.cos(a) * 0.55, Math.sin(a) * 0.55, 0); b.rotation.z = a + 0.5; blower.add(b); }
  cylZ(0.5, 0.5, 0.04, aluD, 0, 0, 0.26, blower); cylZ(0.5, 0.5, 0.04, aluD, 0, 0, -0.26, blower); cylZ(0.12, 0.12, 0.6, steel, 0, 0, 0, blower);
