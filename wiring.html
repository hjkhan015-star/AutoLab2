<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wiring Harness — Auto Lab</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="controls.css">
<link rel="stylesheet" href="components.css">
<style>
:root { --al-accent: #f43f5e; }
html.light-theme { --al-accent: color-mix(in oklch, #f43f5e 68%, black); }

/* ══ MODAL ══ */
#fb-overlay {
  position: fixed; inset: 0; z-index: 100000;
  display: none; align-items: center; justify-content: center;
  background: color-mix(in oklch, var(--ink) 75%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  padding: 16px;
  font: 500 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--text);
  animation: fbFadeIn .18s ease;
}
#fb-overlay.open { display: flex; }
@keyframes fbFadeIn { from { opacity: 0; } to { opacity: 1; } }

#fb-modal {
  max-width: 960px; width: 100%;
  max-height: calc(100dvh - 32px);
  background: var(--bg);
  border: 1px solid color-mix(in oklch, var(--text) 22%, transparent);
  border-radius: 16px;
  box-shadow: 0 24px 72px color-mix(in oklch, var(--ink) 80%, transparent), 0 0 0 1px color-mix(in oklch, var(--text) 3%, transparent);
  display: flex; flex-direction: column; overflow: hidden;
  animation: fbSlideIn .22s cubic-bezier(.2,.9,.3,1);
}
@keyframes fbSlideIn { from { transform: translateY(16px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }

#fb-modal .fb-head {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid color-mix(in oklch, var(--text) 14%, transparent);
  background: linear-gradient(180deg, color-mix(in oklch, var(--c-red) 8%, transparent), transparent);
  flex-shrink: 0;
}
#fb-modal .fb-head-icon {
  width: 38px; height: 38px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--c-red), var(--c-orange));
  font-size: 20px;
  box-shadow: 0 4px 12px color-mix(in oklch, var(--c-red) 35%, transparent);
}
#fb-modal .fb-head-text { flex: 1; min-width: 0; }
#fb-modal .fb-head-title { font-size: 15px; font-weight: 700; letter-spacing: .01em; }
#fb-modal .fb-head-sub { font-size: 10px; color: var(--text-dim); letter-spacing: .1em; text-transform: uppercase; margin-top: 2px; }
#fb-modal .fb-close {
  background: transparent; border: 1px solid color-mix(in oklch, var(--text) 30%, transparent);
  color: var(--text-dim); width: 32px; height: 32px; border-radius: 50%;
  cursor: pointer; font-size: 20px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, color .15s, border-color .15s;
  flex-shrink: 0;
}
#fb-modal .fb-close:hover { background: color-mix(in oklch, var(--text) 15%, transparent); color: var(--text); border-color: color-mix(in oklch, var(--text) 50%, transparent); }

#fb-modal .fb-body {
  display: flex; flex: 1; overflow: hidden; min-height: 0;
}
#fb-modal .fb-left {
  flex: 1.15; padding: 18px; overflow-y: auto; min-width: 0;
  border-right: 1px solid color-mix(in oklch, var(--text) 14%, transparent);
}
#fb-modal .fb-right {
  flex: 1; padding: 18px; overflow-y: auto; min-width: 0;
}

.fb-grid {
  display: flex; gap: 8px;
  padding: 14px;
  background: var(--bg);
  background-image: linear-gradient(180deg, var(--bg), var(--bg));
  border: 2px solid var(--bg);
  border-radius: 10px;
  box-shadow: inset 0 2px 8px color-mix(in oklch, var(--ink) 60%, transparent), 0 2px 4px color-mix(in oklch, var(--ink) 50%, transparent);
  position: relative;
}
.fb-grid::before {
  content: '';
  position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
  width: 40px; height: 3px; background: var(--surface-3); border-radius: 2px;
}
.fb-col {
  display: flex; flex-direction: column; gap: 5px;
  flex: 1; min-width: 0;
}
.fb-fuse {
  height: 28px;
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font: 700 10.5px ui-sans-serif, system-ui, sans-serif;
  cursor: pointer;
  border: 1px solid color-mix(in oklch, var(--ink) 50%, transparent);
  box-shadow: inset 0 -2px 3px color-mix(in oklch, var(--ink) 35%, transparent),
              inset 0 2px 2px color-mix(in oklch, var(--text) 18%, transparent),
              0 1px 2px color-mix(in oklch, var(--ink) 30%, transparent);
  position: relative;
  transition: transform .12s, box-shadow .12s;
  user-select: none;
  letter-spacing: .02em;
}
.fb-fuse:hover {
  transform: scale(1.06);
  box-shadow: 0 0 0 2px color-mix(in oklch, var(--c-amber) 70%, transparent),
              inset 0 -2px 3px color-mix(in oklch, var(--ink) 35%, transparent),
              inset 0 2px 2px color-mix(in oklch, var(--text) 18%, transparent),
              0 2px 8px color-mix(in oklch, var(--c-amber) 40%, transparent);
  z-index: 3;
}
.fb-fuse.selected {
  box-shadow: 0 0 0 2px var(--c-amber),
              inset 0 -2px 3px color-mix(in oklch, var(--ink) 35%, transparent),
              0 0 16px color-mix(in oklch, var(--c-amber) 55%, transparent);
  z-index: 3;
}
.fb-fuse .cat-dot {
  position: absolute; top: 2px; right: 2px;
  width: 7px; height: 7px; border-radius: 50%;
  box-shadow: 0 0 0 1.5px color-mix(in oklch, var(--ink) 55%, transparent);
  pointer-events: none;
}
.fb-fuse .fb-amp {
  font-size: 10.5px;
  font-weight: 800;
  pointer-events: none;
}
.fb-fuse .fb-icon {
  position: absolute; left: 3px; top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  line-height: 1;
  pointer-events: none;
  opacity: .9;
}
.fb-relay {
  height: 66px;
  border-radius: 6px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 3px;
  cursor: pointer;
  border: 1px solid color-mix(in oklch, var(--ink) 50%, transparent);
  box-shadow: inset 0 -3px 6px color-mix(in oklch, var(--ink) 40%, transparent),
              inset 0 2px 4px color-mix(in oklch, var(--text) 15%, transparent),
              0 1px 3px color-mix(in oklch, var(--ink) 40%, transparent);
  font: 700 9.5px ui-sans-serif, system-ui, sans-serif;
  color: var(--paper);
  transition: transform .12s, box-shadow .12s;
  user-select: none;
  position: relative;
}
.fb-relay:hover {
  transform: scale(1.05);
  box-shadow: 0 0 0 2px color-mix(in oklch, var(--c-amber) 70%, transparent),
              inset 0 -3px 6px color-mix(in oklch, var(--ink) 40%, transparent),
              0 2px 8px color-mix(in oklch, var(--c-amber) 40%, transparent);
  z-index: 3;
}
.fb-relay.selected {
  box-shadow: 0 0 0 2px var(--c-amber),
              inset 0 -3px 6px color-mix(in oklch, var(--ink) 40%, transparent),
              0 0 16px color-mix(in oklch, var(--c-amber) 55%, transparent);
  z-index: 3;
}
.fb-relay .fb-relay-icon { font-size: 18px; }
.fb-relay .cat-dot {
  position: absolute; top: 3px; right: 3px;
  width: 7px; height: 7px; border-radius: 50%;
  box-shadow: 0 0 0 1.5px color-mix(in oklch, var(--ink) 55%, transparent);
}
.fb-large { height: 38px; font-size: 11px; }

.fb-legend {
  margin-top: 14px;
  display: flex; flex-wrap: wrap; gap: 10px 16px;
  font-size: 10.5px; color: var(--text-dim);
  letter-spacing: .04em;
}
.fb-legend span { display: inline-flex; align-items: center; gap: 6px; }
.fb-legend i {
  width: 12px; height: 12px; border-radius: 3px;
  box-shadow: inset 0 -1px 2px color-mix(in oklch, var(--ink) 40%, transparent), 0 0 0 1px color-mix(in oklch, var(--ink) 50%, transparent);
}

.fb-info h3 { font-size: 15px; font-weight: 700; margin: 0 0 10px 0; color: var(--text); letter-spacing: .01em; }
.fb-info h4 { font-size: 11px; font-weight: 700; margin: 18px 0 8px 0; color: var(--c-amber); letter-spacing: .1em; text-transform: uppercase; }
.fb-info p { margin: 0 0 10px 0; color: var(--text); font-size: 12.5px; line-height: 1.6; }
.fb-info ul { margin: 0 0 10px 0; padding-left: 18px; color: var(--text); font-size: 12.5px; line-height: 1.6; }
.fb-info ul li { margin-bottom: 5px; }
.fb-info ul li b { color: var(--text); }
.fb-info .fb-color-row {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin: 8px 0 12px 0;
  font-size: 10.5px;
  color: var(--text);
}
.fb-info .fb-color-row span { display: inline-flex; align-items: center; gap: 5px; }
.fb-info .fb-color-row i {
  width: 14px; height: 14px; border-radius: 3px;
  box-shadow: inset 0 -1px 2px color-mix(in oklch, var(--ink) 40%, transparent), 0 0 0 1px color-mix(in oklch, var(--ink) 50%, transparent);
}
.fb-info .fb-hint {
  margin-top: 16px;
  padding: 10px 12px;
  background: color-mix(in oklch, var(--c-amber) 8%, transparent);
  border-left: 3px solid var(--c-amber);
  border-radius: 4px;
  font-size: 11.5px;
  color: var(--c-amber);
}

.fb-selected-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.fb-selected-big {
  width: 62px; height: 62px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font: 800 18px ui-sans-serif, system-ui, sans-serif;
  box-shadow: inset 0 -3px 6px color-mix(in oklch, var(--ink) 35%, transparent), inset 0 3px 4px color-mix(in oklch, var(--text) 20%, transparent), 0 3px 8px color-mix(in oklch, var(--ink) 50%, transparent);
  flex-shrink: 0;
}
.fb-selected-meta h3 { margin: 0 0 2px 0; font-size: 16px; color: var(--text); }
.fb-selected-meta .fb-selected-cat { font-size: 10.5px; color: var(--text-dim); letter-spacing: .1em; text-transform: uppercase; }
.fb-fuse-facts {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px 14px; margin: 12px 0 16px 0; padding: 12px;
  background: color-mix(in oklch, var(--text) 6%, transparent);
  border: 1px solid color-mix(in oklch, var(--text) 14%, transparent);
  border-radius: 8px; font-size: 11.5px;
}
.fb-fuse-facts > div { display: flex; flex-direction: column; gap: 2px; }
.fb-fuse-facts span { color: var(--text-dim); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.fb-fuse-facts b { color: var(--text); font-weight: 600; }
.fb-back {
  background: transparent;
  border: 1px solid color-mix(in oklch, var(--text) 35%, transparent);
  color: var(--text); padding: 7px 14px; border-radius: 8px;
  cursor: pointer; font: inherit; font-size: 11.5px; margin-top: 12px;
  transition: background .15s, color .15s;
}
.fb-back:hover { background: color-mix(in oklch, var(--text) 12%, transparent); color: var(--text); }

@media (max-width: 768px) {

  #fb-modal .fb-body { flex-direction: column; }
  #fb-modal .fb-left {
    flex: none !important;
    border-right: 0;
    border-bottom: 1px solid color-mix(in oklch, var(--text) 14%, transparent);
    max-height: 55vh;
  }
  #fb-modal .fb-right { flex: none !important; }
  .fb-grid { padding: 10px; gap: 6px; }
  .fb-fuse { height: 24px; font-size: 9.5px; }
  .fb-fuse .fb-icon { display: none; }
  .fb-relay { height: 54px; font-size: 8.5px; }
  .fb-relay .fb-relay-icon { font-size: 15px; }
  .fb-large { height: 32px; font-size: 10px; }
  .fb-fuse-facts { grid-template-columns: 1fr; }

}
</style>
</head>

function ampColor(a) {
  if (a == null) return '#3a3f48';
  if (a <= 5)    return '#d4b483';
  if (a <= 7.5)  return '#92400e';
  if (a <= 10)   return '#dc2626';
  if (a <= 15)   return '#3b82f6';
  if (a <= 20)   return '#eab308';
  if (a <= 25)   return '#f1f5f9';
  if (a <= 30)   return '#22c55e';
  if (a <= 40)   return '#f97316';
  return '#7f1d1d';
}
function ampTextColor(a) {
  if (a == null) return '#94a3b8';
  if (a <= 5)   return '#1a1a1a';
  if (a === 20) return '#1a1a1a';
  if (a === 25) return '#1a1a1a';
  return '#ffffff';
}

const _c1 = [0x000000, 0x220000, 0x880000, 0xdd2200, 0xff8800, 0xffdd66, 0xffffcc];
const _ct = [25, 300, 500, 700, 900, 1100, 1400];
function tempToGlow(T) {
  if (T <= _ct[0]) return new THREE.Color(_c1[0]);
  for (let i = 1; i < _ct.length; i++) {
    if (T <= _ct[i]) {
      const f = (T - _ct[i-1]) / (_ct[i] - _ct[i-1]);
      const a = new THREE.Color(_c1[i-1]);
      const b = new THREE.Color(_c1[i]);
      return a.lerp(b, f);
    }
  }
  return new THREE.Color(_c1[_c1.length - 1]);
}
function tempToGlowIntensity(T) {
  if (T < 200) return 0;
  if (T < 700) return (T - 200) / 500 * 0.55;
  return 0.55 + Math.min(1.6, (T - 700) / 500 * 1.6);
}

/* ═══════════════════════════════════════════════════════════
   BUILD
   ═══════════════════════════════════════════════════════════ */
function build(H) {
  const { box, cyl, sph, mat, glass, glow, pipe, stream, lc, clamp, root, THREE } = H;
  const CL = clamp || ((v, a, b) => Math.max(a, Math.min(b, v)));

  const matF = (c, m, r) => {
    const mm = (mat ? mat(c, m, r) : null) ||
      new THREE.MeshStandardMaterial({ color: c, metalness: m, roughness: r });
    mm.side = THREE.DoubleSide;
    return mm;
  };

  /* ── Materials ── */
  const MRED   = matF(0xdc2626, .15, .55);
  const MBLK   = matF(0x080808, .10, .82);
  const MYEL   = matF(0xeab308, .15, .55);
  const MBLU   = matF(0x3b82f6, .15, .55);
  const MGRN   = matF(0x22c55e, .15, .55);
  const MORG   = matF(0xf97316, .15, .55);
  const MGRY   = matF(0x94a3b8, .20, .55);
  const MMET   = matF(0xcbd5e1, .80, .28);
  const MMDK   = matF(0x475569, .65, .38);
  const MPLS   = matF(0x1c232f, .10, .82);
  const MPLSL  = matF(0x2c3442, .10, .82);
  const MDIF   = matF(0xf1f5f9, .05, .75);
  const MBRS   = matF(0xd4a34a, .80, .35);
  const MLOOM  = matF(0x0e0e0e, .05, .90);   // harness wrap
  const MGLASSLID = new THREE.MeshStandardMaterial({
    color: 0x222a36, metalness: .20, roughness: .12,
    transparent: true, opacity: .48, side: THREE.DoubleSide,
    depthWrite: false
  });
  const MDIAL  = matF(0x0a0e14, .05, .85);
  const MNEEDLE = matF(0xef4444, .20, .55);

  /* dynamic */
  const M_HOTWIRE = new THREE.MeshStandardMaterial({
    color: 0xb91c1c, metalness: .15, roughness: .55,
    emissive: 0x000000, emissiveIntensity: 0
  });
  const M_MAINFUSE = new THREE.MeshStandardMaterial({
    color: 0xf59e0b, metalness: .10, roughness: .5,
    emissive: 0x000000, emissiveIntensity: 0
  });
  const M_LAMP = new THREE.MeshStandardMaterial({
    color: 0xfef3c7, emissive: 0xffe066, emissiveIntensity: 0, roughness: .4
  });
  const M_ARC = new THREE.LineBasicMaterial({
    color: 0xc7f2ff, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
  });

  /* ═══════════════ FLOOR PLATE ═══════════════ */
  const floorGeo = new THREE.PlaneGeometry(22, 16);
  const floorMat = new THREE.MeshStandardMaterial({
    color: 0x0a0c11, metalness: .15, roughness: .90, side: THREE.DoubleSide
  });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -2.72;
  root.add(floor);

  /* ═══════════════ LAYOUT ═══════════════ */
  const P = {
    batt:  [-3.4, -0.35],
    ign:   [-3.4,  1.20],
    fuse:  [-1.5,  1.30],
    ecu:   [-1.4, -0.60],
    clu:   [ 1.0,  1.90],
    obd:   [ 3.1,  1.90],
    cool:  [ 3.1,  0.20],
    oil:   [ 3.1, -1.40],
    fuel:  [-2.9, -1.90],
    gnd:   [ 0.0, -2.30]
  };

  /* ═══════════════ BATTERY ═══════════════ */
  const battG = new THREE.Group();
  battG.position.set(P.batt[0], P.batt[1], 0);
  root.add(battG);

  const battBody = new THREE.Mesh(new THREE.BoxGeometry(1.55, .92, .70), MPLS);
  battG.add(battBody);
  // dark ribbed top
  const battTop = new THREE.Mesh(new THREE.BoxGeometry(1.42, .10, .62), MPLSL);
  battTop.position.y = .51;
  battG.add(battTop);
  // cap rows
  for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) {
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(.06, .06, .06, 12), MMDK);
    cap.position.set(-.30 + c * .30, .58, -.10 + r * .20);
    battG.add(cap);
  }
  // posts
  const postPos = new THREE.Mesh(new THREE.CylinderGeometry(.10, .10, .26, 16), MRED);
  postPos.position.set(-.50, .56, 0); battG.add(postPos);
  const postNeg = new THREE.Mesh(new THREE.CylinderGeometry(.10, .10, .26, 16), MBLK);
  postNeg.position.set(.50, .56, 0); battG.add(postNeg);
  // post clamps (torus rings)
  [postPos, postNeg].forEach(p => {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(.105, .022, 6, 16), MMET);
    ring.position.copy(p.position);
    ring.position.y += .04;
    ring.rotation.x = Math.PI / 2;
    battG.add(ring);
  });
  // label plate
  const label = new THREE.Mesh(new THREE.BoxGeometry(1.05, .28, .02), MDIF);
  label.position.set(0, -.05, .36);
  battG.add(label);
  // thin black frame around the label
  const frame = new THREE.Mesh(new THREE.BoxGeometry(1.10, .32, .015), MBLK);
  frame.position.set(0, -.05, .365);
  battG.add(frame);
  // symbolic stripe
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(.9, .04, .01), MRED);
  stripe.position.set(0, .05, .375);
  battG.add(stripe);

  /* ═══════════════ IGNITION SWITCH ═══════════════ */
  const ignG = new THREE.Group();
  ignG.position.set(P.ign[0], P.ign[1], 0);
  root.add(ignG);

  const ignBase = new THREE.Mesh(new THREE.CylinderGeometry(.38, .38, .22, 20), MMET);
  ignG.add(ignBase);
  const ignTower = new THREE.Mesh(new THREE.CylinderGeometry(.24, .24, .30, 16), MMDK);
  ignTower.position.y = .14;
  ignG.add(ignTower);
  const ignKey = new THREE.Mesh(new THREE.BoxGeometry(.07, .22, .08), matF(0x000000, .5, .8));
  ignKey.position.set(0, .30, .13);
  ignG.add(ignKey);
  // back plate with three position dots
  const backPlate = new THREE.Mesh(new THREE.BoxGeometry(1.10, .48, .06), MPLS);
  backPlate.position.set(0, -.18, 0);
  ignG.add(backPlate);
  [
    { x: -.36, c: 0x64748b },   // ACC
    { x: 0,    c: 0x000000 },   // OFF
    { x: .36,  c: 0x22c55e }    // START
  ].forEach(d => {
    const dot = new THREE.Mesh(new THREE.CylinderGeometry(.045, .045, .04, 10),
      new THREE.MeshBasicMaterial({ color: d.c }));
    dot.position.set(d.x, -.18, .045);
    dot.rotation.x = Math.PI / 2;
    ignG.add(dot);
  });

  /* ═══════════════ FUSE BOX ═══════════════ */
  const fuseBoxGroup = new THREE.Group();
  fuseBoxGroup.position.set(P.fuse[0], P.fuse[1], 0);
  root.add(fuseBoxGroup);

  // Case
  const caseMesh = new THREE.Mesh(new THREE.BoxGeometry(2.05, .82, .62), MPLS);
  caseMesh.userData.isFuseBox = true;
  fuseBoxGroup.add(caseMesh);
  // Slightly recessed interior (dark) so the fuses pop against a backdrop
  const interior = new THREE.Mesh(new THREE.BoxGeometry(1.85, .66, .04), matF(0x05080f, .05, .9));
  interior.position.y = .02;
  interior.position.z = .30;
  fuseBoxGroup.add(interior);

  // Branch fuses — coloured cylinders that poke up
  const fuseBranchCols = [
    0xdc2626, 0x3b82f6, 0xeab308, 0xdc2626, 0x22c55e, 0xf1f5f9, 0xf97316
  ];
  const fuseBranchPos = [
    [-0.72, +.12], [-0.36, +.12], [0, +.12], [.36, +.12], [.72, +.12],
    [-0.54, -.14], [ 0, -.14]
  ];
  fuseBranchPos.forEach(([dx, dy], i) => {
    const f = new THREE.Mesh(
      new THREE.CylinderGeometry(.09, .09, .22, 12),
      matF(fuseBranchCols[i], .10, .5)
    );
    f.position.set(dx, dy, .32);
    f.userData.isFuseBox = true;
    fuseBoxGroup.add(f);
  });
  // MAIN fuse (larger, animated)
  const mainFuse = new THREE.Mesh(
    new THREE.CylinderGeometry(.13, .13, .28, 16),
    M_MAINFUSE
  );
  mainFuse.position.set(-0.90, .18, .34);
  mainFuse.userData.isFuseBox = true;
  fuseBoxGroup.add(mainFuse);

  // Translucent lid
  const lid = new THREE.Mesh(new THREE.BoxGeometry(2.10, .08, .68), MGLASSLID);
  lid.position.y = .46;
  lid.userData.isFuseBox = true;
  fuseBoxGroup.add(lid);
  // Lid frame edges (dark plastic rim)
  const lidRim = new THREE.Mesh(new THREE.BoxGeometry(2.14, .04, .72), MPLSL);
  lidRim.position.y = .50;
  fuseBoxGroup.add(lidRim);
  // "FUSE" label on lid
  const lidLabel = new THREE.Mesh(new THREE.BoxGeometry(1.0, .22, .02), MDIF);
  lidLabel.position.set(0, .55, .30);
  fuseBoxGroup.add(lidLabel);

  // Glowing click hint ring
  const hintRingMat = new THREE.MeshBasicMaterial({
    color: 0xfacc15, transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
  });
  const hintRing = new THREE.Mesh(new THREE.TorusGeometry(1.30, .028, 8, 56), hintRingMat);
  hintRing.position.set(P.fuse[0], P.fuse[1] + .05, .55);
  root.add(hintRing);

  // Mounting posts
  [[-0.94, -.44], [0.94, -.44]].forEach(([dx, dy]) => {
    const p = new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, .12, 10), MMDK);
    p.position.set(dx, dy, 0);
    p.rotation.x = Math.PI / 2;
    fuseBoxGroup.add(p);
  });

  /* ═══════════════ ECU ═══════════════ */
  const ecuG = new THREE.Group();
  ecuG.position.set(P.ecu[0], P.ecu[1], 0);
  root.add(ecuG);

  const ecuBody = new THREE.Mesh(new THREE.BoxGeometry(2.05, 1.05, .62), MMET);
  ecuG.add(ecuBody);
  // Heat sink fins on top
  for (let i = 0; i < 8; i++) {
    const f = new THREE.Mesh(new THREE.BoxGeometry(1.85, .045, .56), MMDK);
    f.position.y = .30 + i * .062;
    ecuG.add(f);
  }
  // Big connector block on one side
  const conn = new THREE.Mesh(new THREE.BoxGeometry(.55, .85, .58), MPLS);
  conn.position.set(1.15, 0, 0);
  ecuG.add(conn);
  // Pin rows
  for (let r = 0; r < 3; r++) for (let c = 0; c < 6; c++) {
    const pin = new THREE.Mesh(new THREE.CylinderGeometry(.012, .012, .08, 8), MBRS);
    pin.position.set(1.30 + .01, -.28 + r * .28, -.20 + c * .08);
    pin.rotation.z = Math.PI / 2;
    ecuG.add(pin);
  }
  // Label
  const ecuLabel = new THREE.Mesh(new THREE.BoxGeometry(.9, .18, .02), MDIF);
  ecuLabel.position.set(-.55, .22, .33);
  ecuG.add(ecuLabel);

  /* ═══════════════ INSTRUMENT CLUSTER ═══════════════ */
  const cluG = new THREE.Group();
  cluG.position.set(P.clu[0], P.clu[1], 0);
  root.add(cluG);

  const cluBody = new THREE.Mesh(new THREE.BoxGeometry(2.20, 1.05, .32), MPLS);
  cluG.add(cluBody);
  // Hood (visor)
  const visor = new THREE.Mesh(new THREE.BoxGeometry(2.20, .10, .55), MPLSL);
  visor.position.set(0, .55, .18);
  cluG.add(visor);

  // Three dials
  for (let i = 0; i < 3; i++) {
    const dx = -0.70 + i * 0.70;
    // Dial face
    const face = new THREE.Mesh(new THREE.CylinderGeometry(.28, .28, .02, 32), MDIAL);
    face.rotation.x = Math.PI / 2;
    face.position.set(dx, .10, .17);
    cluG.add(face);
    // Bezel
    const bez = new THREE.Mesh(new THREE.TorusGeometry(.29, .018, 6, 32), MMDK);
    bez.position.set(dx, .10, .18);
    cluG.add(bez);
    // Ticks (radiating)
    for (let k = 0; k < 9; k++) {
      const a = -Math.PI * 0.75 + k * (Math.PI * 1.5 / 8);
      const tick = new THREE.Mesh(new THREE.BoxGeometry(.020, .055, .015),
        new THREE.MeshBasicMaterial({ color: 0xe2e8f0 }));
      tick.position.set(dx + Math.cos(a) * .21, .10 + Math.sin(a) * .21, .18);
      tick.rotation.z = a - Math.PI / 2;
      cluG.add(tick);
    }
    // Needle
    const needle = new THREE.Mesh(new THREE.BoxGeometry(.19, .022, .012), MNEEDLE);
    needle.position.set(dx + Math.cos(-Math.PI * 0.35) * .095,
                        .10 + Math.sin(-Math.PI * 0.35) * .095, .19);
    needle.rotation.z = -Math.PI * 0.35;
    cluG.add(needle);
    // Hub
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(.045, .045, .04, 12), MMDK);
    hub.rotation.x = Math.PI / 2;
    hub.position.set(dx, .10, .20);
    cluG.add(hub);
  }
  // Warning light strip at bottom
  for (let i = 0; i < 5; i++) {
    const light = new THREE.Mesh(new THREE.SphereGeometry(.045, 8, 6), M_LAMP);
    light.position.set(-0.64 + i * 0.32, -.30, .19);
    cluG.add(light);
  }

  /* ═══════════════ OBD2 ═══════════════ */
  const obdG = new THREE.Group();
  obdG.position.set(P.obd[0], P.obd[1], 0);
  root.add(obdG);
  const obdBody = new THREE.Mesh(new THREE.BoxGeometry(.80, .60, .38), MPLS);
  obdG.add(obdBody);
  // D-shaped face (two bevels to fake the trapezoid)
  const obdBevel = new THREE.Mesh(new THREE.BoxGeometry(.62, .34, .04), matF(0x11151c, .10, .80));
  obdBevel.position.z = .21;
  obdG.add(obdBevel);
  // 16 pins in two rows
  for (let r = 0; r < 2; r++) for (let c = 0; c < 8; c++) {
    const pin = new THREE.Mesh(new THREE.CylinderGeometry(.011, .011, .06, 8), MBRS);
    pin.position.set(-.22 + c * .063, r === 0 ? .06 : -.06, .24);
    pin.rotation.x = Math.PI / 2;
    obdG.add(pin);
  }

  /* ═══════════════ COOLANT SENSOR ═══════════════ */
  const coolG = new THREE.Group();
  coolG.position.set(P.cool[0], P.cool[1], 0);
  root.add(coolG);
  const coolBody = new THREE.Mesh(new THREE.CylinderGeometry(.20, .15, .55, 20), MBRS);
  coolBody.rotation.z = Math.PI / 2;
  coolBody.position.x = -.22;
  coolG.add(coolBody);
  const coolHex = new THREE.Mesh(new THREE.CylinderGeometry(.20, .20, .10, 6), MMET);
  coolHex.rotation.z = Math.PI / 2;
  coolHex.position.x = .05;
  coolG.add(coolHex);
  const coolPlug = new THREE.Mesh(new THREE.BoxGeometry(.34, .34, .40), MPLS);
  coolPlug.position.x = .38;
  coolG.add(coolPlug);
  const coolRing = new THREE.Mesh(new THREE.TorusGeometry(.11, .020, 6, 16), MBLU);
  coolRing.position.set(.55, 0, 0);
  coolRing.rotation.y = Math.PI / 2;
  coolG.add(coolRing);

  /* ═══════════════ OIL PRESSURE SENSOR ═══════════════ */
  const oilG = new THREE.Group();
  oilG.position.set(P.oil[0], P.oil[1], 0);
  root.add(oilG);
  const oilBody = new THREE.Mesh(new THREE.CylinderGeometry(.20, .15, .55, 20), MBRS);
  oilBody.rotation.z = Math.PI / 2;
  oilBody.position.x = -.22;
  oilG.add(oilBody);
  const oilHex = new THREE.Mesh(new THREE.CylinderGeometry(.20, .20, .10, 6), MMET);
  oilHex.rotation.z = Math.PI / 2;
  oilHex.position.x = .05;
  oilG.add(oilHex);
  const oilPlug = new THREE.Mesh(new THREE.BoxGeometry(.34, .34, .40), MPLS);
  oilPlug.position.x = .38;
  oilG.add(oilPlug);
  const oilRing = new THREE.Mesh(new THREE.TorusGeometry(.11, .020, 6, 16), MGRN);
  oilRing.position.set(.55, 0, 0);
  oilRing.rotation.y = Math.PI / 2;
  oilG.add(oilRing);

  /* ═══════════════ FUEL SENDER ═══════════════ */
  const fuelG = new THREE.Group();
  fuelG.position.set(P.fuel[0], P.fuel[1], 0);
  root.add(fuelG);
  const tank = new THREE.Mesh(new THREE.BoxGeometry(1.65, .75, .58), MPLSL);
  fuelG.add(tank);
  // Top ridge
  const ridge = new THREE.Mesh(new THREE.BoxGeometry(1.50, .06, .50), MMDK);
  ridge.position.y = .40;
  fuelG.add(ridge);
  // Float arm
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(.030, .030, .85, 8), MMET);
  arm.rotation.z = 0.55;
  arm.position.set(-.28, .22, .20);
  fuelG.add(arm);
  // Float ball
  const float = new THREE.Mesh(new THREE.SphereGeometry(.10, 12, 10), matF(0xea580c, .30, .60));
  float.position.set(-.58, .48, .20);
  fuelG.add(float);
  // Sender top
  const sender = new THREE.Mesh(new THREE.BoxGeometry(.38, .38, .36), MPLS);
  sender.position.set(.50, .30, .20);
  fuelG.add(sender);
  const senderRing = new THREE.Mesh(new THREE.TorusGeometry(.10, .018, 6, 16), MYEL);
  senderRing.position.set(.50, .30, .40);
  fuelG.add(senderRing);

  /* ═══════════════ GROUND BUS ═══════════════ */
  const busG = new THREE.Group();
  busG.position.set(P.gnd[0], P.gnd[1], 0);
  root.add(busG);
  const bus = new THREE.Mesh(new THREE.BoxGeometry(3.6, .12, .30), matF(0x374151, .85, .32));
  busG.add(bus);
  // Copper strip inset
  const busInset = new THREE.Mesh(new THREE.BoxGeometry(3.4, .02, .18), MBRS);
  busInset.position.y = .07;
  busG.add(busInset);
  // Bolted posts
  for (let i = 0; i < 6; i++) {
    const bx = -1.55 + i * .62;
    const post = new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, .14, 10), MMET);
    post.position.set(bx, .12, 0);
    busG.add(post);
    const bolt = new THREE.Mesh(new THREE.CylinderGeometry(.035, .035, .06, 6), MBRS);
    bolt.position.set(bx, .22, 0);
    busG.add(bolt);
  }
  // Vertical strut dropping to the floor
  const strut = new THREE.Mesh(new THREE.BoxGeometry(.10, .42, .10), matF(0x2a2f38, .80, .38));
  strut.position.set(1.75, -.28, 0);
  busG.add(strut);

  /* ═══════════════ WIRES ═══════════════ */
  const pth = (pts) => pts.map(p => [p[0], p[1], 0]);

  function addLoomRings(points, wireR, count) {
    const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0], p[1], p[2] || 0)));
    for (let i = 1; i <= count; i++) {
      const u = i / (count + 1);
      const p = curve.getPointAt(u);
      const t = curve.getTangentAt(u);
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(wireR + .010, .011, 6, 12),
        MLOOM
      );
      ring.position.copy(p);
      ring.lookAt(p.clone().add(t));
      root.add(ring);
    }
  }

  // 1. Battery + → ignition
  const pBatIgn = pth([
    [P.batt[0] - .50, P.batt[1] + .85],
    [P.batt[0] - 1.02, P.batt[1] + 1.00],
    [P.batt[0] - 1.02, P.ign[1] + .05],
    [P.ign[0] - .38, P.ign[1] + .05]
  ]);
  pipe(pBatIgn, .082, MRED);
  addLoomRings(pBatIgn, .082, 3);

  // 2. Ignition → fuse box main input
  const pIgnFuse = pth([
    [P.ign[0] + .38, P.ign[1] + .05],
    [P.ign[0] + .90, P.ign[1] + .30],
    [P.fuse[0] - 1.35, P.fuse[1] - .05],
    [P.fuse[0] - .90, P.fuse[1] - .15]
  ]);
  pipe(pIgnFuse, .075, MORG);
  addLoomRings(pIgnFuse, .075, 3);

  // 3. Fuse box → ECU (hot wire — animated)
  const hotPath = pth([
    [P.fuse[0] - .90, P.fuse[1] - .30],
    [P.fuse[0] - .90, P.fuse[1] - .70],
    [P.fuse[0] - .70, P.ecu[1] + .80],
    [P.ecu[0] - .90, P.ecu[1] + .75]
  ]);
  pipe(hotPath, .085, M_HOTWIRE);
  addLoomRings(hotPath, .085, 3);

  // 4. ECU → cluster (multiconductor bundle)
  for (let i = 0; i < 3; i++) {
    const off = (i - 1) * .058;
    const col = [0x3b82f6, 0x22c55e, 0xeab308][i];
    const path = pth([
      [P.ecu[0] + .90, P.ecu[1] + .30 + off],
      [P.ecu[0] + 1.45, P.ecu[1] + .70 + off],
      [P.clu[0] - 1.20, P.clu[1] - .20 + off],
      [P.clu[0] - .70, P.clu[1] + .05 + off]
    ]);
    pipe(path, .028, matF(col, .15, .55));
  }

  // 5. ECU → OBD2 (grey diagnostic bundle)
  for (let i = 0; i < 2; i++) {
    const off = i * .055;

  return {

      ['Ignition switch',     [P.ign[0], P.ign[1] + .60, .3]],

    update(c) {
      const t = (typeof c.t === 'number' ? c.t : 0);
      const dt = Math.min(0.05, Math.max(0.001, c.dt || 0.016));

      /* pulse the hint ring */
      hintRingMat.opacity = state.fuseBlown

      const Rpos  = gauge.ohmPerM * (HARNESS_LEN * 0.7);

      const extraR = (state.fault === 'resistive') ? 0.9 : 0;

      /* ── load current from framework slider ── */
      let loadI = 40 * CL(c.k, 0, 1);

        // contact resistance at the short (0.02 Ω). Thin wire limits current.

        loadI = 12.6 / (Rpos + Rshort);

          state.fuseProgress = Math.max(0, state.fuseProgress - dt * 0.6);
        }

          state.fuseBlown = true;
          state.fuseProgress = 1;
        }
      }

      /* ── actual current after fuse consideration ── */
      const I = state.fuseBlown ? 0 : loadI;

      /* ── voltage drop & power ── */
      const Vdrop = I * (Rtotal + extraR);
      const Pwire = I * I * (Rtotal + extraR);

      /* ── wire heating model (normalized to ampacity) ── */
      const Tamb = 25;
      // At ampacity the insulation reaches ~105 °C (ΔT = 80 K).
      // ΔT scales with (I / ampacity)².
      const ratio2 = Math.pow(I / gauge.ampacity, 2);
      const TeqUncapped = Tamb + 80 * ratio2;
      const Teq = Math.min(TeqUncapped, 1200);

      // Thermal time constants: fast to heat, slower to cool (insulation mass)
      const tau = state.wireTemp < Teq ? 2.5 : 5.0;
      state.wireTemp += (Teq - state.wireTemp) * Math.min(1, dt / tau);

      /* ── emission from temperature ── */
      const glow = tempToGlow(state.wireTemp);
      const glowInt = tempToGlowIntensity(state.wireTemp);
      M_HOTWIRE.emissive.copy(glow);
      M_HOTWIRE.emissiveIntensity = glowInt;

      /* ── main fuse visual ── */
      if (state.fuseBlown) {
        M_MAINFUSE.color.setHex(0x080808);
        M_MAINFUSE.emissive.setHex(0x000000);
        M_MAINFUSE.emissiveIntensity = 0;

        M_MAINFUSE.color.setHex(0xf59e0b);
        // Fuse glows hotter as it approaches its blow point
        const fuseHeat = state.fuseProgress;
        M_MAINFUSE.emissive.setHex(fuseHeat > 0.02 ? 0xff5a00 : 0x000000);
        M_MAINFUSE.emissiveIntensity = fuseHeat * 1.6;
      }

      /* ── short arc ── */
      const arcActive = state.fault === 'short' && !state.fuseBlown && I > 20;
      if (arcActive) {
        M_ARC.opacity = 0.7 + 0.3 * Math.abs(Math.sin(t * 55));
        for (let i = 0; i < ARC_N; i++) {
          const f = i / (ARC_N - 1);
          const j = (i === 0 || i === ARC_N - 1) ? 0 : 0.09;
          arcPts[i * 3    ] = ARC_ORIGIN[0] + (Math.random() - 0.5) * j;
          arcPts[i * 3 + 1] = ARC_ORIGIN[1] + (Math.random() - 0.5) * j;
          arcPts[i * 3 + 2] = (Math.random() - 0.5) * j;
        }
        arcGeo.attributes.position.needsUpdate = true;
        arcGeo.computeBoundingSphere();
      } else {
        M_ARC.opacity = 0;
      }

      /* ── cluster brightness ── */
      const Vload = Math.max(0, 12.6 - Vdrop);
      const lampOn = I > 0.4 && !state.fuseBlown;
      M_LAMP.emissiveIntensity = lampOn
        ? CL(Vload / 12.6, 0, 1) * Math.min(1, I / 6) * 1.8
        : 0;

      /* ── flow particles ── */
      if (!state.flowPaused) state.phase = (state.phase + dt * 0.55) % 1;
      const flowSpeed = state.fuseBlown ? 0 : (0.03 + 0.10 * Math.min(I / 40, 2));
      const flowAlpha = state.fuseBlown ? 0 : CL(0.12 + I / 34, 0, 1);

      flowBat.update(t, flowSpeed, flowAlpha);
      flowIgn.update(t, flowSpeed, flowAlpha);
      flowHot.update(t, flowSpeed, flowAlpha);

      /* ── HUD ── */
      const fuseStatus = state.fuseBlown ? 'BLOWN'
                       : state.fuseProgress > 0.55 ? 'About to blow'
                       : state.fuseProgress > 0.15 ? 'Heating'
                       : 'OK';
      const fuseCls = state.fuseBlown ? 'crit'
                    : state.fuseProgress > 0.15 ? 'warn' : 'ok';
      const tempCls = state.wireTemp > 200 ? 'crit'
                    : state.wireTemp > 105 ? 'warn' : 'ok';
      const lampTxt = state.fuseBlown ? 'Dead'
                    : Vload < 11.0 ? 'Dim'
                    : lampOn ? 'Bright' : 'Off';

      // Headroom: how much of the wire's ampacity is left
      const headroom = (I > 0) ? gauge.ampacity / I : Infinity;
      const headTxt = !isFinite(headroom) ? '—'
                    : headroom > 1 ? (headroom.toFixed(1) + '×')
                    : 'overloaded';
      const headCls = !isFinite(headroom) ? ''
                    : headroom >= 1.2 ? 'ok'
                    : headroom >= 0.9 ? 'warn' : 'crit';

      return {
        big: I.toFixed(0),
        unit: ' A',
        bar: CL((I / Math.max(state.fuseRating * 1.2, 40)) * 100, 0, 100),
        rows: {
          fuse: fuseStatus,
          temp: state.wireTemp.toFixed(0) + ' °C'
        },
        ro: {
          amps: [I.toFixed(1) + ' A', 'hi'],
          fuse: [fuseStatus, fuseCls],
          temp: [state.wireTemp.toFixed(0) + ' °C', tempCls],
          vd:   [Vdrop.toFixed(2) + ' V', Vdrop > 0.8 ? 'warn' : ''],
          pwr:  [Pwire.toFixed(1) + ' W', Pwire > 20 ? 'warn' : ''],
          head: [headTxt, headCls],
          lamp: [lampTxt, state.fuseBlown ? 'crit' : lampOn ? 'ok' : ''],
          loop: [(Rtotal + extraR).toFixed(3) + ' Ω', ''],
          amp:  [gauge.ampacity + ' A (' + state.gauge + ' AWG)', '']
        },
        status: [
          state.fuseBlown ? 'Fuse blown — circuit open'
            : state.fault === 'short' ? 'SHORT TO GROUND'
            : state.fault === 'open'  ? 'Open circuit'
            : state.wireTemp > 500    ? 'Wire glowing — insulation will fail'
            : state.wireTemp > 200    ? 'Wire overheating'
            : state.wireTemp > 105    ? 'Above insulation rating'
            : lampOn ? 'Circuit live' : 'No load',
          !state.fuseBlown && state.fault !== 'short' && state.wireTemp < 105
        ],
        ctl: state.fuseBlown ? 'Fuse blown — replace' : I.toFixed(0) + ' A'
      };
    }
  };
}

runGuidedModule(CFG, build);
</script>
</body>
</html>
