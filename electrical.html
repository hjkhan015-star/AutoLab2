<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d13">
<title>Battery · Starter · Alternator — Auto Lab</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="controls.css">
<style>
  /* ═══════════════════════════════════════════════════════════
     PANEL TEXT — mode description, chemistry equation
     ═══════════════════════════════════════════════════════════ */
  #electrical-notes { margin-top: 4px; }

  #mode-desc {
    font-size: 12.5px; line-height: 1.55;
    color: var(--text-dim, #94a3b8);
  }
  #mode-desc strong { color: var(--text, #e5e7eb); font-weight: 700; }
  #mode-desc em { color: #f59e0b; font-style: normal; font-weight: 700; }

  #chem-eq {
    margin-top: 10px; padding: 7px 10px; border-radius: 8px;
    background: rgba(34,197,94,.10);
    border: 1px solid rgba(34,197,94,.28);
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 700;
    color: #86efac;
    text-align: center; letter-spacing: .02em;
  }
  html.light-theme #chem-eq { background: rgba(34,197,94,.10); color: #15803d; }
  #chem-eq .arrow { color: #f59e0b; padding: 0 6px; }

  /* ═══════════════════════════════════════════════════════════
     WIDGET INTERIOR — direction toggle (battery mode)
     ═══════════════════════════════════════════════════════════ */

  /* ═══════════════════════════════════════════════════════════
     WIDGET INTERIOR — ignition key selector (charging mode)
     ═══════════════════════════════════════════════════════════ */

</style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div id="labels-root"></div>

  <script src="guard.js"></script>
  <script type="importmap">
  { "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import * as Base from './kit.js';
import { Parts } from './components.js';
  import { UI } from './kit.js';

  const TAU = Base.TAU;
  const DEG = Base.DEG;

  /* ============================================================
     BOOTSTRAP
     ============================================================ */
  const isCoarse = matchMedia('(pointer: coarse)').matches;
  const cores    = navigator.hardwareConcurrency || 4;
  const mem      = navigator.deviceMemory || 4;
  const isLowEnd = cores <= 4 || mem <= 2;
  const isMidEnd = !isLowEnd && (cores <= 6 || isCoarse);

  const { scene, camera, renderer, controls, wrap, viewManager } = Base.buildScene({
    fov: 42,
    camPos: isCoarse ? [2.6, 2.2, 4.6] : [3.0, 2.5, 5.4],
    target: [0, 0.10, 0],
    floorY: -2.15
  });
  Base.attachResize(camera, renderer, wrap, 42);
  const particleTex = Base.createParticleTexture();
  const labels = Base.createLabelSystem();
  const state = Base.createUIState();

  /* ============================================================
     MATERIALS
     ============================================================ */
  const M = {
    steel:      new THREE.MeshStandardMaterial({ color:0xa8b0be, metalness:0.88, roughness:0.28 }),
    steelDark:  new THREE.MeshStandardMaterial({ color:0x3d4555, metalness:0.78, roughness:0.40 }),
    alum:       new THREE.MeshStandardMaterial({ color:0xc5ccd6, metalness:0.82, roughness:0.28 }),
    copper:     new THREE.MeshStandardMaterial({ color:0xc47a35, metalness:0.90, roughness:0.28,
                  emissive:0x3a1a00, emissiveIntensity:0.15 }),
    brass:      new THREE.MeshStandardMaterial({ color:0xd4a34a, metalness:0.88, roughness:0.28 }),
    leadDark:   new THREE.MeshStandardMaterial({ color:0x3a3a40, metalness:0.55, roughness:0.65 }),
    leadPos:    new THREE.MeshStandardMaterial({ color:0x4a2e15, metalness:0.45, roughness:0.75,
                  emissive:0x1a0e05, emissiveIntensity:0.20 }),
    leadNeg:    new THREE.MeshStandardMaterial({ color:0x6a6a72, metalness:0.62, roughness:0.60 }),
    batteryCase:new THREE.MeshStandardMaterial({ color:0x15181f, metalness:0.35, roughness:0.55,
                  transparent:true, opacity:0.22, depthWrite:false, side:THREE.DoubleSide }),
    batteryCap: new THREE.MeshStandardMaterial({ color:0x10131a, metalness:0.40, roughness:0.55 }),
    electrolyte:new THREE.MeshPhysicalMaterial({ color:0x60a5fa, metalness:0.10, roughness:0.15,
                  transmission:0.40, transparent:true, opacity:0.28, depthWrite:false,
                  side:THREE.DoubleSide }),
    battRed:    new THREE.MeshStandardMaterial({ color:0xc8202a, metalness:0.55, roughness:0.38 }),
    battBlk:    new THREE.MeshStandardMaterial({ color:0x0d0f14, metalness:0.55, roughness:0.45 }),
    glass:      new THREE.MeshStandardMaterial({ color:0xaebfd2, metalness:0.35, roughness:0.22,
                  transparent:true, opacity:0.16, depthWrite:false, side:THREE.DoubleSide }),
    cut:        new THREE.MeshStandardMaterial({ color:0xf0703a, metalness:0.10, roughness:0.55,
                  emissive:0xf0703a, emissiveIntensity:0.28, side:THREE.DoubleSide }),
    rotor:      new THREE.MeshStandardMaterial({ color:0xd4a34a, metalness:0.88, roughness:0.26,
                  emissive:0x8a4400, emissiveIntensity:0.15 }),
    statorCoil: new THREE.MeshStandardMaterial({ color:0xb87333, metalness:0.85, roughness:0.30,
                  emissive:0x4a1a00, emissiveIntensity:0.20 }),
    diodeOn:    new THREE.MeshStandardMaterial({ color:0x22c55e, metalness:0.55, roughness:0.35,
                  emissive:0x22c55e, emissiveIntensity:1.4 }),
    diodeOff:   new THREE.MeshStandardMaterial({ color:0x2a3038, metalness:0.70, roughness:0.55 }),
    regulator:  new THREE.MeshStandardMaterial({ color:0x1c2028, metalness:0.45, roughness:0.55 }),
    brush:      new THREE.MeshStandardMaterial({ color:0x1a1a1a, metalness:0.15, roughness:0.85 }),
    wireRed:    new THREE.MeshStandardMaterial({ color:0xd42030, metalness:0.25, roughness:0.55,
                  emissive:0xd42030, emissiveIntensity:0 }),
    wireBlack:  new THREE.MeshStandardMaterial({ color:0x14171d, metalness:0.30, roughness:0.65 }),
    loadBox:    new THREE.MeshStandardMaterial({ color:0x4a5568, metalness:0.55, roughness:0.45 }),
    ammeterRing:new THREE.MeshStandardMaterial({ color:0x2a3038, metalness:0.75, roughness:0.35 }),
    ammeterFace:new THREE.MeshStandardMaterial({ color:0xf1f5f9, metalness:0.05, roughness:0.55 }),
    needle:     new THREE.MeshBasicMaterial({ color:0xdc2626 })
  };

  /* ============================================================
     THREE VIEWS in one scene
     ============================================================ */
  const systemRoot = new THREE.Group();
  scene.add(systemRoot);

  const batteryView = new THREE.Group();
  const alternatorView = new THREE.Group();
  const chargingView = new THREE.Group();
  systemRoot.add(batteryView, alternatorView, chargingView);

  /* ============================================================
     BATTERY VIEW
     ============================================================ */
  const BAT_W = 1.9, BAT_H = 0.9, BAT_D = 0.62;
  const CELL_COUNT = 6;

  const caseGlassGeo = new THREE.BoxGeometry(BAT_W, BAT_H, BAT_D);
  const caseGlass = new THREE.Mesh(caseGlassGeo, M.batteryCase);
  batteryView.add(caseGlass);

  const caseEdges = new THREE.LineSegments(
    new THREE.EdgesGeometry(caseGlassGeo),
    new THREE.LineBasicMaterial({ color:0x5a6474, transparent:true, opacity:0.65 })
  );
  batteryView.add(caseEdges);

  const topCover = new THREE.Mesh(
    new THREE.BoxGeometry(BAT_W + 0.04, 0.06, BAT_D + 0.04), M.batteryCap
  );
  topCover.position.y = BAT_H / 2 + 0.03;
  batteryView.add(topCover);

  const cellWidth = (BAT_W - 0.10) / CELL_COUNT;
  const cellGroups = [];
  const cellPlates = [];

  for (let c = 0; c < CELL_COUNT; c++) {
    const cx = -(BAT_W / 2 - 0.05) + (c + 0.5) * cellWidth;
    const cellGroup = new THREE.Group();
    cellGroup.position.set(cx, 0, 0);
    batteryView.add(cellGroup);

    if (c < CELL_COUNT - 1) {
      const sep = new THREE.Mesh(
        new THREE.BoxGeometry(0.012, BAT_H - 0.08, BAT_D - 0.08),
        M.batteryCap
      );
      sep.position.set(cx + cellWidth / 2, 0, 0);
      batteryView.add(sep);
    }

    const plateCount = isLowEnd ? 6 : 8;
    const plateH = BAT_H - 0.18;
    const plateW = cellWidth - 0.10;
    const plateD = 0.035;
    const plateGap = (BAT_D - 0.14) / plateCount;

    for (let p = 0; p < plateCount; p++) {
      const isPositive = (p % 2 === 0);
      const pz = -(BAT_D - 0.14) / 2 + (p + 0.5) * plateGap;

      const plate = new THREE.Mesh(
        new THREE.BoxGeometry(plateW, plateH, plateD),
        isPositive ? M.leadPos : M.leadNeg
      );
      plate.position.set(0, -0.02, pz);
      cellGroup.add(plate);
      cellPlates.push({ mesh: plate, isPositive, cellIndex: c });
    }

    const cellTag = new THREE.Mesh(
      new THREE.CylinderGeometry(0.018, 0.018, 0.05, 10),
      M.brass
    );
    cellTag.position.set(cx, BAT_H / 2 + 0.06, -BAT_D / 4);
    batteryView.add(cellTag);

    const cap = new THREE.Mesh(
      new THREE.CylinderGeometry(0.032, 0.032, 0.03, 12),
      M.battBlk
    );
    cap.position.set(cx, BAT_H / 2 + 0.06, BAT_D / 4);
    batteryView.add(cap);

    cellGroups.push(cellGroup);
  }

  const electrolyteH = BAT_H * 0.75;
  const electrolyteMesh = new THREE.Mesh(
    new THREE.BoxGeometry(BAT_W - 0.08, electrolyteH, BAT_D - 0.08),
    M.electrolyte
  );
  electrolyteMesh.position.y = -BAT_H / 2 + electrolyteH / 2 + 0.04;
  electrolyteMesh.renderOrder = 2;
  batteryView.add(electrolyteMesh);

  for (let c = 0; c < CELL_COUNT - 1; c++) {
    const strapX = -(BAT_W / 2 - 0.05) + (c + 1) * cellWidth;
    const strap = new THREE.Mesh(
      new THREE.BoxGeometry(0.06, 0.03, 0.10),
      M.leadDark
    );
    strap.position.set(strapX, BAT_H / 2 + 0.045, -BAT_D / 6);
    batteryView.add(strap);
  }

  const batPosTerm = new THREE.Mesh(
    new THREE.CylinderGeometry(0.055, 0.055, 0.11, 14), M.battRed
  );
  batPosTerm.position.set(BAT_W / 2 - 0.15, BAT_H / 2 + 0.10, 0);
  batteryView.add(batPosTerm);

  const batNegTerm = new THREE.Mesh(
    new THREE.CylinderGeometry(0.045, 0.045, 0.09, 14), M.battBlk
  );
  batNegTerm.position.set(-BAT_W / 2 + 0.15, BAT_H / 2 + 0.10, 0);
  batteryView.add(batNegTerm);

  function makeSymbolPlane(sym, size, color) {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    g.fillStyle = color;
    g.font = 'bold 56px -apple-system, sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(sym, 32, 34);
    const t = new THREE.CanvasTexture(c);
    const mat = new THREE.MeshBasicMaterial({ map:t, transparent:true, depthWrite:false, side:THREE.DoubleSide });
    return new THREE.Mesh(new THREE.PlaneGeometry(size, size), mat);
  }
  const plusSym = makeSymbolPlane('+', 0.13, '#ff5566');
  plusSym.position.set(BAT_W / 2 - 0.15, BAT_H / 2 + 0.28, 0.06);
  plusSym.rotation.x = -Math.PI / 4;
  batteryView.add(plusSym);
  const minusSym = makeSymbolPlane('−', 0.13, '#aab4c3');
  minusSym.position.set(-BAT_W / 2 + 0.15, BAT_H / 2 + 0.26, 0.06);
  minusSym.rotation.x = -Math.PI / 4;
  batteryView.add(minusSym);

  const dischargeCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(BAT_W / 2 - 0.15, BAT_H / 2 + 0.15, 0),
    new THREE.Vector3(BAT_W / 2 + 0.30, BAT_H / 2 + 0.15, 0),
    new THREE.Vector3(BAT_W / 2 + 0.55, BAT_H / 2 + 0.20, 0),
    new THREE.Vector3(BAT_W / 2 + 0.55, BAT_H / 2 + 0.35, 0),
    new THREE.Vector3(0.10, BAT_H / 2 + 0.35, 0),
    new THREE.Vector3(-BAT_W / 2 - 0.55, BAT_H / 2 + 0.35, 0),
    new THREE.Vector3(-BAT_W / 2 - 0.55, BAT_H / 2 + 0.15, 0),
    new THREE.Vector3(-BAT_W / 2 - 0.30, BAT_H / 2 + 0.15, 0),
    new THREE.Vector3(-BAT_W / 2 + 0.15, BAT_H / 2 + 0.10, 0)
  ]);

  const extWire = new THREE.Mesh(
    new THREE.TubeGeometry(dischargeCurve, 60, 0.016, 8, false),
    M.wireRed
  );
  batteryView.add(extWire);

  const loadBox = new THREE.Mesh(
    new THREE.BoxGeometry(0.32, 0.16, 0.14), M.loadBox
  );
  loadBox.position.set(0.10, BAT_H / 2 + 0.35, 0);
  batteryView.add(loadBox);
  const loadCap = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05, 0.05, 0.04, 12), M.brass
  );
  loadCap.rotation.x = Math.PI / 2;
  loadCap.position.set(0.10, BAT_H / 2 + 0.35, 0.09);
  batteryView.add(loadCap);

  const battElectronCount = isLowEnd ? 20 : 32;
  const battElecGeo = new THREE.BufferGeometry();
  const battElecPos = new Float32Array(battElectronCount * 3);
  battElecGeo.setAttribute('position', new THREE.BufferAttribute(battElecPos, 3));
  const battElecMat = new THREE.PointsMaterial({
    map: particleTex, size: 0.09, sizeAttenuation: true,
    color: 0xffd166, transparent: true, opacity: 0.95,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  const battElectrons = new THREE.Points(battElecGeo, battElecMat);
  battElectrons.frustumCulled = false;
  batteryView.add(battElectrons);
  const battElecData = [];
  for (let i = 0; i < battElectronCount; i++) battElecData.push({ t: i / battElectronCount });

  const BUBBLE_N = isLowEnd ? 20 : 40;
  const bubbleGeo = new THREE.BufferGeometry();
  const bubblePos = new Float32Array(BUBBLE_N * 3);
  bubbleGeo.setAttribute('position', new THREE.BufferAttribute(bubblePos, 3));
  const bubbleMat = new THREE.PointsMaterial({
    map: particleTex, size: 0.055, sizeAttenuation: true,
    color: 0xd6e6ff, transparent: true, opacity: 0.85,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  const bubbles = new THREE.Points(bubbleGeo, bubbleMat);
  bubbles.frustumCulled = false;
  batteryView.add(bubbles);
  const bubbleData = [];
  for (let i = 0; i < BUBBLE_N; i++) {
    bubbleData.push({
      x: (Math.random() - 0.5) * (BAT_W - 0.30),
      y: -BAT_H / 2 + Math.random() * electrolyteH,
      z: (Math.random() - 0.5) * (BAT_D - 0.20),
      spd: 0.08 + Math.random() * 0.15
    });
  }

  const batteryLabelDefs = [
    { id:'bat-pos',  text:'Positive (+) · PbO₂',  pos: new THREE.Vector3( BAT_W / 2 - 0.15, BAT_H / 2 + 0.32, 0) },
    { id:'bat-neg',  text:'Negative (−) · Pb',    pos: new THREE.Vector3(-BAT_W / 2 + 0.15, BAT_H / 2 + 0.32, 0) },
    { id:'bat-elec', text:'Electrolyte (H₂SO₄)',  pos: new THREE.Vector3(-BAT_W / 2 - 0.35, -BAT_H / 2 + 0.10, 0) },
    { id:'bat-load', text:'Electrical load',      pos: new THREE.Vector3(0.10, BAT_H / 2 + 0.58, 0) },
    { id:'bat-cell', text:'6 cells × 2.1 V',      pos: new THREE.Vector3(0, -BAT_H / 2 - 0.30, 0) }
  ];
  batteryLabelDefs.forEach(d => labels.add(d.id, d.text));

  /* ============================================================
     ALTERNATOR VIEW
     ============================================================ */
  const ALT_R = 0.55;
  const ALT_LEN = 0.85;

  const altShellGeo = new THREE.CylinderGeometry(ALT_R, ALT_R, ALT_LEN, 32, 1, true, 0, Math.PI * 1.55);
  const altShell = new THREE.Mesh(altShellGeo, M.glass);
  altShell.rotation.z = Math.PI / 2;
  alternatorView.add(altShell);

  const altCut = new THREE.Mesh(
    new THREE.CircleGeometry(ALT_R, 32, Math.PI * 0.5, Math.PI),
    M.cut
  );
  altCut.rotation.y = Math.PI / 2;
  altCut.position.x = -ALT_LEN / 2;
  alternatorView.add(altCut);

  [-ALT_LEN / 2, ALT_LEN / 2].forEach(xPos => {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(ALT_R - 0.03, 0.04, 10, 32, Math.PI * 1.55),
      M.steelDark
    );
    ring.rotation.y = Math.PI / 2;
    ring.rotation.z = Math.PI * 0.225;
    ring.position.x = xPos;
    alternatorView.add(ring);
  });

  const altRotorGroup = new THREE.Group();
  alternatorView.add(altRotorGroup);

  const rotorCore = new THREE.Mesh(
    new THREE.CylinderGeometry(0.16, 0.16, ALT_LEN * 0.70, 20),
    M.steelDark
  );
  rotorCore.rotation.z = Math.PI / 2;
  altRotorGroup.add(rotorCore);

  const CLAW_N = isLowEnd ? 8 : 12;
  const clawLength = 0.10;
  const clawOffset = 0.18;
  const clawRadius = 0.32;

  const frontClaws = new THREE.Group();
  frontClaws.position.x = -clawOffset + clawLength * 0.5;
  altRotorGroup.add(frontClaws);

  const frontHub = new THREE.Mesh(
    new THREE.CylinderGeometry(0.18, 0.18, 0.08, 20),
    M.rotor
  );
  frontHub.rotation.z = Math.PI / 2;
  frontHub.position.x = -clawLength * 0.5;
  frontClaws.add(frontHub);

  for (let i = 0; i < CLAW_N; i++) {
    const a = (i / CLAW_N) * TAU;
    const claw = new THREE.Mesh(
      new THREE.BoxGeometry(clawLength, 0.10, 0.09),
      M.rotor
    );
    claw.position.set(0, Math.cos(a) * clawRadius * 0.72, Math.sin(a) * clawRadius * 0.72);
    claw.rotation.x = a;
    frontClaws.add(claw);
  }

  const rearClaws = new THREE.Group();
  rearClaws.position.x = clawOffset - clawLength * 0.5;
  altRotorGroup.add(rearClaws);

  const rearHub = new THREE.Mesh(
    new THREE.CylinderGeometry(0.18, 0.18, 0.08, 20),
    M.rotor
  );
  rearHub.rotation.z = Math.PI / 2;
  rearHub.position.x = clawLength * 0.5;
  rearClaws.add(rearHub);

  for (let i = 0; i < CLAW_N; i++) {
    const a = (i / CLAW_N) * TAU + Math.PI / CLAW_N;
    const claw = new THREE.Mesh(
      new THREE.BoxGeometry(clawLength, 0.10, 0.09),
      M.rotor
    );
    claw.position.set(0, Math.cos(a) * clawRadius * 0.72, Math.sin(a) * clawRadius * 0.72);
    claw.rotation.x = a;
    rearClaws.add(claw);
  }

  const fieldCoil = new THREE.Mesh(
    new THREE.TorusGeometry(0.22, 0.075, 10, 24),
    M.copper
  );
  fieldCoil.rotation.y = Math.PI / 2;
  altRotorGroup.add(fieldCoil);

  const rotorShaft = new THREE.Mesh(
    new THREE.CylinderGeometry(0.038, 0.038, ALT_LEN + 0.90, 14),
    M.steel
  );
  rotorShaft.rotation.z = Math.PI / 2;
  altRotorGroup.add(rotorShaft);

  const statorGroup = new THREE.Group();
  alternatorView.add(statorGroup);

  const COILS_PER_PHASE = isLowEnd ? 4 : 6;
  const PHASES = 3;
  const statorRadius = ALT_R - 0.10;

  for (let phase = 0; phase < PHASES; phase++) {
    const phaseGroup = new THREE.Group();
    statorGroup.add(phaseGroup);

    for (let i = 0; i < COILS_PER_PHASE; i++) {
      const slotIdx = i * PHASES + phase;
      const a = (slotIdx / (COILS_PER_PHASE * PHASES)) * TAU;

      const coil = new THREE.Mesh(
        new THREE.BoxGeometry(0.09, 0.10, 0.09),
        M.statorCoil
      );
      coil.position.set(0, Math.cos(a) * statorRadius, Math.sin(a) * statorRadius);
      coil.rotation.x = a;
      phaseGroup.add(coil);

      if (i < COILS_PER_PHASE - 1) {
        const nextA = ((i + 1) * PHASES + phase) / (COILS_PER_PHASE * PHASES) * TAU;
        const p1 = new THREE.Vector3(0, Math.cos(a) * statorRadius, Math.sin(a) * statorRadius);
        const p2 = new THREE.Vector3(0, Math.cos(nextA) * statorRadius, Math.sin(nextA) * statorRadius);
        const mid = p1.clone().add(p2).multiplyScalar(0.5);
        mid.x = -ALT_LEN * 0.42;
        const curve = new THREE.CatmullRomCurve3([p1, mid, p2]);
        const wire = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 12, 0.010, 6, false),
          M.copper
        );
        phaseGroup.add(wire);
      }
    }
    phaseGroup.rotation.x = phase * (Math.PI * 2 / (PHASES * 2));
  }

  const slipRingL = new THREE.Mesh(
    new THREE.CylinderGeometry(0.055, 0.055, 0.025, 16), M.brass
  );
  slipRingL.rotation.z = Math.PI / 2;
  slipRingL.position.x = -ALT_LEN / 2 - 0.30;
  alternatorView.add(slipRingL);

  const slipRingR = new THREE.Mesh(
    new THREE.CylinderGeometry(0.055, 0.055, 0.025, 16), M.brass
  );
  slipRingR.rotation.z = Math.PI / 2;
  slipRingR.position.x = -ALT_LEN / 2 - 0.36;
  alternatorView.add(slipRingR);

  const brushTop = new THREE.Mesh(
    new THREE.BoxGeometry(0.055, 0.030, 0.030), M.brush
  );
  brushTop.position.set(-ALT_LEN / 2 - 0.30, 0.07, 0);
  alternatorView.add(brushTop);

  const brushBot = new THREE.Mesh(
    new THREE.BoxGeometry(0.055, 0.030, 0.030), M.brush
  );
  brushBot.position.set(-ALT_LEN / 2 - 0.36, -0.07, 0);
  alternatorView.add(brushBot);

  const diodeGroup = new THREE.Group();
  diodeGroup.position.set(0, -ALT_R - 0.20, 0);
  alternatorView.add(diodeGroup);

  const heatSink = new THREE.Mesh(
    new THREE.BoxGeometry(0.55, 0.05, 0.30),
    M.steelDark
  );
  diodeGroup.add(heatSink);

  const diodeMeshes = [];
  const DIODE_POSITIONS = [
    { x: -0.22, z: -0.10 },
    { x:  0.00, z: -0.10 },
    { x:  0.22, z: -0.10 },
    { x: -0.22, z:  0.10 },
    { x:  0.00, z:  0.10 },
    { x:  0.22, z:  0.10 }
  ];
  DIODE_POSITIONS.forEach(p => {
    const diode = new THREE.Mesh(

  /* ============================================================
     PHYSICS
     ============================================================ */
  function stepPhysics(dt) {
    electronicsTime += dt;
    engineRPM = 700 + state.speedMul * 3300;

    const rpmFactor = Math.max(0, Math.min(1, (engineRPM - 600) / 3800));
    alternatorOutput = 40 + rpmFactor * 50;
    loadAmps = 8 + Math.max(0, (engineRPM - 700) / 4000) * 25;

    if (mode === 'battery') {
      if (direction === 'discharge') {
        batteryCurrent = -(12 + Math.random() * 3);
        const drain = Math.abs(batteryCurrent) / 3600 / 60 * 20;
        batterySOC = Math.max(0.05, batterySOC - drain * dt * 30);
      } else {
        batteryCurrent = +(15 + Math.random() * 3);
        const gain = batteryCurrent / 3600 / 60 * 20;
        batterySOC = Math.min(1.0, batterySOC + gain * dt * 30);
      }
    } else if (mode === 'alternator') {
      batteryCurrent = alternatorOutput - 8;
      const netDrain = -batteryCurrent;
      if (netDrain > 0) batterySOC = Math.max(0.05, batterySOC - netDrain / 3600 / 60 * dt * 30);
      else              batterySOC = Math.min(1.0, batterySOC + (-netDrain) / 3600 / 60 * dt * 30);
    } else {
      if (keyState === 'off') {
        alternatorOutput = 0;
        loadAmps = 0;
        batteryCurrent = 0;
      } else if (keyState === 'acc') {
        alternatorOutput = 0;
        loadAmps = 4;
        batteryCurrent = -loadAmps;
      } else if (keyState === 'start') {
        alternatorOutput = 0;
        loadAmps = 180;
        batteryCurrent = -loadAmps;
      } else {
        loadAmps = 8 + Math.max(0, (engineRPM - 700) / 4000) * 25;
        batteryCurrent = alternatorOutput - loadAmps;
      }
      const dSOC = -batteryCurrent / 3600 / 60 * dt * 30;
      batterySOC = Math.max(0.05, Math.min(1.0, batterySOC + dSOC));
    }

    if (batteryCurrent > 0) {
      const targetV = 12.6 + Math.min(1.8, batteryCurrent * 0.020);
      batteryVoltage += (targetV - batteryVoltage) * Math.min(1, dt * 2.0);
    } else if (batteryCurrent < 0) {
      const targetV = 12.6 - Math.min(2.5, Math.abs(batteryCurrent) * 0.008);
      batteryVoltage += (targetV - batteryVoltage) * Math.min(1, dt * 2.0);
    } else {
      batteryVoltage += (12.6 - batteryVoltage) * Math.min(1, dt * 1.0);
    }

    rotorAngle += dt * engineRPM * 0.0012 * 2.5;
    altRotorGroup.rotation.x = rotorAngle;
  }

        p.t = ((p.t + dt * speed * 2.0) % 1 + 1) % 1;
        const pt = dischargeCurve.getPoint(p.t);
        posAttr.setXYZ(i, pt.x, pt.y, pt.z);
      }
      posAttr.needsUpdate = true;
      battElectrons.visible = true;
    } else {
      battElectrons.visible = false;
    }

    const bPosAttr = bubbleGeo.attributes.position;
    const charging = direction === 'charge';
    for (let i = 0; i < BUBBLE_N; i++) {
      const b = bubbleData[i];
      if (charging) {
        b.y += dt * b.spd;
        if (b.y > -BAT_H / 2 + electrolyteH) {
          b.y = -BAT_H / 2 + 0.05;
          b.x = (Math.random() - 0.5) * (BAT_W - 0.30);
          b.z = (Math.random() - 0.5) * (BAT_D - 0.20);
        }
        bPosAttr.setXYZ(i, b.x, b.y, b.z);
      } else {
        bPosAttr.setXYZ(i, 0, -100, 0);
      }
    }
    bPosAttr.needsUpdate = true;
    bubbles.visible = charging && state.showGas !== false;
  }

  function updateAlternatorVisuals(dt) {
    const rpmFactor = Math.max(0, Math.min(1, (engineRPM - 600) / 3800));
    const pulseSpeed = 2 + rpmFactor * 8;
    phaseRings.forEach((ring, i) => {
      const phase = electronicsTime * pulseSpeed - i * (TAU / 3);
      const intensity = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(phase));
      ring.material.opacity = intensity * (0.4 + rpmFactor * 0.5);
      ring.scale.setScalar(1 + 0.06 * Math.sin(phase));
    });

    const diodeCycle = (electronicsTime * pulseSpeed * 0.5) % 6;
    for (let i = 0; i < 6; i++) {
      const near = Math.abs(((i - diodeCycle + 3) % 6) - 3) < 0.8;
      viewManager.setMeshMaterial(diodeMeshes[i], near ? M.diodeOn : M.diodeOff);
    }

    regLed.material.color.setHex(alternatorOutput > 20 ? 0x22c55e : 0xf59e0b);
    M.statorCoil.emissiveIntensity = 0.20 + (alternatorOutput / 90) * 0.5;
  }

  function updateChargingVisuals(dt) {
    const showFlow = state.showGas !== false;

    const altToBatActive = (alternatorOutput > 5);
    const altToBatSpeed = 0.15 + (alternatorOutput / 90) * 0.5;
    eStreamAltToBat.mat.opacity = showFlow && altToBatActive ? 0.95 : 0;
    if (altToBatActive && showFlow) {
      const posA = eStreamAltToBat.geo.attributes.position;
      for (let i = 0; i < E_N; i++) {
        const p = eStreamAltToBat.data[i];
        p.t = (p.t + dt * altToBatSpeed) % 1;
        const pt = eStreamAltToBat.curve.getPoint(p.t);
        posA.setXYZ(i, pt.x, pt.y, pt.z);
      }
      posA.needsUpdate = true;
    }

    const batToLoadsActive = (batteryCurrent < -0.5 || alternatorOutput > loadAmps);
    const batToLoadsSpeed = 0.20 + Math.min(1, loadAmps / 60) * 0.4;
    eStreamBatToLoads.mat.opacity = showFlow && batToLoadsActive ? 0.85 : 0;
    if (batToLoadsActive && showFlow) {
      const posA = eStreamBatToLoads.geo.attributes.position;
      for (let i = 0; i < E_N; i++) {
        const p = eStreamBatToLoads.data[i];
        p.t = (p.t + dt * batToLoadsSpeed) % 1;
        const pt = eStreamBatToLoads.curve.getPoint(p.t);
        posA.setXYZ(i, pt.x, pt.y, pt.z);
      }
      posA.needsUpdate = true;
    }

    const loadsToNegActive = batToLoadsActive;
    eStreamLoadsToNeg.mat.opacity = showFlow && loadsToNegActive ? 0.75 : 0;
    if (loadsToNegActive && showFlow) {
      const posA = eStreamLoadsToNeg.geo.attributes.position;
      for (let i = 0; i < E_N; i++) {
        const p = eStreamLoadsToNeg.data[i];
        p.t = (p.t + dt * batToLoadsSpeed) % 1;
        const pt = eStreamLoadsToNeg.curve.getPoint(p.t);
        posA.setXYZ(i, pt.x, pt.y, pt.z);
      }
      posA.needsUpdate = true;
    }

    const netCurrent = batteryCurrent;
    const clampNet = Math.max(-50, Math.min(50, netCurrent));
    const needleAngle = (clampNet / 50) * (Math.PI * 0.75);
    needleGroup.rotation.z = -needleAngle;

    loadMeshes.forEach((lm, i) => {
      const active = loadAmps > 0.5 && (keyState === 'on' || keyState === 'start');
      lm.led.material.color.setHex(active ? lm.data.color : 0x334155);
      const flicker = active ? 0.8 + 0.2 * Math.sin(electronicsTime * 8 + i * 2) : 0.2;
      lm.led.material.color.multiplyScalar(flicker);
    });

    chgAltRotor.rotation.x = rotorAngle;
  }

  /* ============================================================
     READOUTS
     ============================================================ */
  function updateReadouts() {
    const socPct = Math.round(batterySOC * 100);

    if (mode === 'battery') {
      const col = socPct > 60 ? '#22c55e' : socPct > 25 ? '#f59e0b' : '#ef4444';
      ui.monitor.update({
        value: { text: String(socPct), unit: '% SOC', color: col || '', bar: socPct, barColor: col },
        rows: { eng: Math.round(engineRPM) + ' rpm', net: batteryCurrent.toFixed(1) + ' A', v: batteryVoltage.toFixed(2) + ' V', cells: '6 × 2.1 V' },
        status: [direction === 'charge' ? 'Charging' : 'Discharging', direction === 'charge']
      });
    } else if (mode === 'alternator') {
      const outA = Math.round(alternatorOutput);
      const col = outA > 60 ? '#22c55e' : outA > 30 ? '#38bdf8' : '#f59e0b';
      ui.monitor.update({
        value: { text: String(outA), unit: 'A out', color: col || '', bar: Math.min(100, (outA / 90) * 100), barColor: col },
        rows: { eng: Math.round(engineRPM) + ' rpm', hz: Math.round(engineRPM / 60 * 6) + ' Hz', vdc: (13.8 + alternatorOutput / 90 * 0.9).toFixed(2) + ' V' },
        status: ['Generating', true]
      });
    } else {
      const netA = batteryCurrent;
      const col = netA > 2 ? '#22c55e' : netA > -2 ? '#38bdf8' : '#f59e0b';
      const status = keyState === 'off' ? ['Off', false] : keyState === 'acc' ? ['ACC', false] : keyState === 'start' ? ['Cranking', false]
                   : netA > 2 ? ['Charging', true] : netA < -2 ? ['Discharging', false] : ['Float', true];
      ui.monitor.update({
        value: { text: String((netA >= 0 ? '+' : '') + Math.round(netA)), unit: 'A', color: col || '', bar: socPct, barColor: socPct > 60 ? '#22c55e' : socPct > 25 ? '#f59e0b' : '#ef4444' },
        rows: { eng: Math.round(engineRPM) + ' rpm', net: Math.round(loadAmps) + ' A', alt: Math.round(alternatorOutput) + ' A' },
        status
      });
    }
  }

  /* ============================================================
     WAVEFORM → Monitor trace 'wave'
     The old canvas drew y = midY − v·amplitude over 3 cycles; the sample maths below is that formula, moved out of the draw function
     unchanged: A/B/C = sin(θ − p·τ/3), DC = −0.85 − 0.08·sin(6θ) (the old canvas drew the DC line below the mid line; kept as it was).
     Samples are taken at fixed PHASE steps (WF_STEP), so the picture always shows 3 cycles and scrolls as before.
     ============================================================ */
  function waveSamples(th) {
    return [Math.sin(th), Math.sin(th - TAU / 3), Math.sin(th - 2 * TAU / 3), -0.85 - 0.08 * Math.sin(th * 6)];
  }
  function primeWave() {                       /* fill the window at once, as the old canvas always showed 3 full cycles */
    for (let k = WF_LEN - 1; k >= 0; k--) ui.monitor.update({ traces: { wave: waveSamples(wavePhase - k * WF_STEP) } });
    wfPhase = wavePhase;
  }
  function pushWave() {
    if (monMode !== 'alternator') { wfPhase = wavePhase; return; }
    let n = 0;
    while (wfPhase + WF_STEP <= wavePhase && n++ < WF_LEN) {
      wfPhase += WF_STEP;
      ui.monitor.update({ traces: { wave: waveSamples(wfPhase) } });
    }
    if (n >= WF_LEN) wfPhase = wavePhase;
  }

  /* ============================================================
     RESET
     ============================================================ */
  function resetSim() {
    batterySOC = 0.85;
    batteryVoltage = 12.6;
    batteryCurrent = 0;
    alternatorOutput = 0;
    rotorAngle = 0;
    electronicsTime = 0;
    direction = 'discharge';
    keyState = 'on';
    ui.controls.resetAll();                  /* direction -> discharge, key -> On */
    if (elChemArrow) elChemArrow.textContent = '→';
  }

  /* ============================================================
     BRIDGE
     ============================================================ */
  const bridge = ui.wireBridge({
    viewManager,
    state,
    onCommand: (d) => {
      switch (d.action) {
        case 'reset': resetSim(); break;
      }
    }
  });
  bridge.ready();
  bridge.setStatus('Electrical', '#22c55e');

  applyMode('battery');

  /* ============================================================
     LOOP
     ============================================================ */
  const clock = new THREE.Clock();
  let frame = 0;
  let lastReadout = 0;

  function animate() {
    requestAnimationFrame(animate);
    frame++;
    const dt = Math.min(clock.getDelta(), 0.05);
    const sim = state.playing ? dt : 0;

    if (sim > 0) {
      stepPhysics(sim);

      if (mode === 'battery') {
        updateBatteryVisuals(sim);
      } else if (mode === 'alternator') {
        updateAlternatorVisuals(sim);
      } else {
        updateChargingVisuals(sim);
      }
    }

    wavePhase += dt * 1.6;
    pushWave();

    lastReadout += dt;
    if (lastReadout > 0.10) {
      lastReadout = 0;
      updateReadouts();
    }

    if (state.showLabels && frame % 2 === 0) {
      if (mode === 'battery') {
        batteryLabelDefs.forEach(d => labels.project(d.id, d.pos, camera, wrap));
      } else if (mode === 'alternator') {
        altLabelDefs.forEach(d => labels.project(d.id, d.pos, camera, wrap));
      } else {
        chgLabelDefs.forEach(d => labels.project(d.id, d.pos, camera, wrap));
      }
    } else if (!state.showLabels) {
      labels.hideAll();
    }

    controls.update();
    renderer.render(scene, camera);
  }

  updateReadouts();
  animate();
  </script>
</body>
</html>
