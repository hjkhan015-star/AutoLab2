/* ── CONFIG (module content) ─────────────────────────────────────── */

  ],

    ["rwheel",   "Rear L / R torque"],
    ["axload",   "Axle load F / R"],
    ["speed",    "Vehicle speed"],
    ["thrust",   "Tractive force"],
    ["gain",     "Gain vs best 2x4"],
    ["use",      "Grip used F / R"],
    ["fslip",    "Front slip"],
    ["rslip",    "Rear slip"],
    ["turn",     "Turn: wheel speed L / R"],
    ["mu",       "Surface grip"],
    ["state",    "State"]
  ],
  "legend": [
    ["var(--c-green)", "Driven wheel, gripping"],
    ["var(--c-orange)", "Driven wheel, slipping"],
    ["var(--c-slate)", "Free-rolling wheel (not driven)"],

  ],
  "overview": `<div class="al-sec"><h4>2x4 or 4x4: how many wheels receive torque?</h4><p>One engine feeds a gearbox, then a <b>transfer case</b>. In <b>2x4</b> the transfer case sends everything to one axle (rear by default, or front) and the other axle&rsquo;s propeller shaft, differential and half-shafts are <b>disconnected</b> (shown faded and still). In <b>4x4</b> the transfer case splits torque between a <b>rear propeller shaft</b> and a <b>front propeller shaft</b> driven by a chain, so all four wheels pull. Flip the toggle in the dock and watch the collars slide and the second driveline wake up.</p></div><div class="al-sec"><h4>The power path, part by part</h4><ul><li><b>Engine</b> &mdash; the pistons turn the crankshaft and flywheel.</li><li><b>Gearbox</b> &mdash; two gear pairs reduce speed 2:1 and raise torque.</li><li><b>Transfer case</b> &mdash; a planetary centre differential (sun to the front chain, ring to the rear shaft, carrier = input) splits 40 : 60 front : rear and lets the axles turn at different speeds. In 2x4 it is locked and a <b>disconnect collar</b> frees the unused output.</li><li><b>Propeller shafts</b> &mdash; carry torque to each axle. The <b>universal joints</b> at both ends let the rear shaft slope.</li><li><b>Axle differential</b> &mdash; a pinion drives the crown wheel (4 : 1 reduction). The carrier&rsquo;s spider gears let the left and right wheel turn at different speeds in a bend.</li><li><b>Half-shafts</b> &mdash; deliver the torque to each wheel.</li></ul></div><div class="al-sec"><h4>Why 4x4 helps &mdash; the traction limit</h4><p>Each tyre can transmit at most <b>&micro; &times; the load on it</b>. The bar above each wheel shows the torque it delivers; the white marker is its grip limit. In 2x4 two bars are tall and may hit the limit (the wheel spins, bar turns amber / red); in 4x4 four shorter bars share the same engine torque and stay under the limit. The Grip choice starts on <b>Snow</b> so the difference shows at once. On <b>Dry</b> road at part load there is almost none &mdash; raise the engine load or pick <b>Ice</b> to see where even 4x4 runs out of grip.</p></div><div class="al-sec"><h4>Weight transfer</h4><p>Accelerating moves weight to the rear. A rear-drive car gains traction, a front-drive car loses it (watch &ldquo;Axle load F / R&rdquo;). 4x4 does <b>not</b> improve braking or cornering grip &mdash; only how much drive torque the tyres can use.</p></div>`,
  "faults": [

    ["Stuck in 4x4 on dry tarmac", "With a locked centre the front and rear axles cannot turn at different speeds, so tight turns judder and scrub the tyres (driveline wind-up).", "Never use a locked centre on dry tarmac; check tyre sizes match and the shift linkage releases."],

    ["What is the job of the spider gears inside an axle differential?", ["Let the left and right wheel turn at different speeds", "Reduce the engine speed", "Cool the oil"], 0, "In a bend the outer wheel travels farther, so the spiders let it turn faster than the inner wheel."],
    ["Why can a planetary centre differential run at 40 : 60 front : rear?", ["The sun and ring gears have different tooth counts", "The wheels are different sizes", "The engine is mounted to one side"], 0, "Torque divides in proportion to the sun and ring gear sizes (24 : 36 teeth here)."],
    ["Why does a 4x4 car accelerate better on snow?", ["It has more engine power", "Four tyres share the torque, so each stays under its grip limit", "4x4 tyres have more grip"], 1, "Each tyre transmits at most friction x load; driving four wheels uses all four contact patches."],
    ["Under hard acceleration a front-drive car...", ["Gains front axle load", "Loses front axle load as weight moves rearward", "Is unaffected"], 1, "Weight transfers to the rear, so the driven front axle has less grip."],
    ["Does 4x4 improve braking grip?", ["Yes, it doubles it", "No, braking depends on the tyres and the surface", "Only on dry roads"], 1, "Four driven wheels only help put torque down; the same four contact patches do the stopping."]

/* ═══════════════════════════════════════════════════════════════════
   PHYSICS MODEL — pure, named functions (no DOM, no three.js).
   Simplified physical trends, not a dyno / bench lookup table.
   Torque numbers are "at the axle" (engine torque x gearing).
   ═══════════════════════════════════════════════════════════════════ */
//@@MODEL-START
function clampN(x, a, b) {
  return Math.min(b, Math.max(a, x));
}
const num = (x, d) => (Number.isFinite(x) ? x : d);

/* Vehicle and driveline constants */
const WHEEL_RADIUS   = 0.32;   /* m                                            */
const FRONT_LOAD_N   = 8800;   /* N, static front axle load                    */
const REAR_LOAD_N    = 5900;   /* N, static rear axle load                     */
const MASS           = 1500;   /* kg                                           */
const WHEELBASE      = 2.7;    /* m                                            */
const CG_HEIGHT      = 0.55;   /* m, centre-of-gravity height (weight transfer) */
const GEARBOX_RATIO  = 2.0;    /* two gear pairs: 12:24 then 18:18             */
const FINAL_DRIVE    = 4.0;    /* crown wheel 40 : pinion 10                   */
const GEAR_RATIO     = GEARBOX_RATIO * FINAL_DRIVE;
const SUN_TEETH      = 24;     /* transfer-case planetary: sun -> front        */
const RING_TEETH     = 36;     /*                          ring -> rear        */
const DIFF_FRONT     = SUN_TEETH / (SUN_TEETH + RING_TEETH);   /* 0.40: 40 front : 60 rear */
const TBR            = 2.5;    /* torque-bias ratio of the centre differential  */
const TAU_ACCEL      = 0.4;    /* s, smoothing of the acceleration used for load transfer */
const STEER_DIFF     = 0.22;   /* outer / inner wheel speed difference at full lock (front axle) */

/* Surface friction: less grip = less torque the tyres can transmit before they slip. */
const SURFACES = {
  dry:  { mu: 1.00, label: 'Dry tarmac', pad: 0x4b5563 },
  wet:  { mu: 0.70, label: 'Wet road',   pad: 0x2a4a6e },
  snow: { mu: 0.32, label: 'Snow',       pad: 0xe5eef7 },
  ice:  { mu: 0.14, label: 'Ice',        pad: 0xa5e4f5 }
};

/* Drive layouts. fwd / rwd = 2x4 (front / rear); diff = 4x4 through the planetary centre differential. */
function driveKind(drive, axle2) {
  if (drive === '4x4') return 'diff';
  return axle2 === 'front' ? 'fwd' : 'rwd';
}

/* Engine torque (Nm) at the flywheel. More load and more rpm -> more torque. Saturating curve, not a dyno map. */
function engineTorque(load, rpm) {
  const L = clampN(load, 0, 1);
  const N = clampN((num(rpm, 2400) - 800) / 4200, 0, 1);
  return clampN(60 + 280 * L * (0.55 + 0.45 * N), 20, 400);
}

/* One tyre's traction limit (Nm at the wheel): more grip or more load on it = more torque before it slips. */
function wheelLimit(mu, axleLoadN) {
  return clampN(num(mu, 0) * Math.max(0, num(axleLoadN, 0)) / 2 * WHEEL_RADIUS, 0, 3000);
}

/* Slip ratio (0 = gripped, 1 = spinning freely): demand above the limit -> the tyre spins. */
function slipRatio(torque, limit) {
  if (torque <= limit) return 0;
  return clampN((torque - limit) / Math.max(120, limit), 0, 1);
}

/* Open axle differential: both wheels get equal torque, so the weaker wheel limits the axle. */
function axleWheels(T, limL, limR) {
  if (!(T > 0)) return { tL: 0, tR: 0, sL: 0, sR: 0 };
  const half = T / 2, d = Math.min(half, Math.min(limL, limR));
  return { tL: d, tR: d, sL: slipRatio(half, limL), sR: slipRatio(half, limR) };
}

/* Centre differential with torque bias: 40:60 base split; when an axle slips, the other can still take up to
   TBR x the torque that the slipping axle can hold. The rest is lost to wheelspin on the slipping axle. */
function diffSplit(T, fc, rc) {
  let f = T * DIFF_FRONT, r = T - f;
  if (f > fc)      { const rn = Math.min(T - fc, fc * TBR); f = T - rn; r = rn; }
  else if (r > rc) { const fn = Math.min(T - rc, rc * TBR); r = T - fn; f = fn; }
  return [f, r];
}

/* Whole drivetrain for one instant. Inputs: { kind, load, rpm, mu, accel }. Wheel order: FL, FR, RL, RR. */
function solveDrivetrain(p) {
  const kind = p.kind;
  const load = clampN(p.load, 0, 1);
  const mu = clampN(num(p.mu, 1), 0, 1.2);
  const Ttot = engineTorque(load, p.rpm) * GEAR_RATIO;

  /* weight transfer from the (smoothed) acceleration of the previous step: +accel loads the rear axle */
  const dN = clampN(MASS * num(p.accel, 0) * CG_HEIGHT / WHEELBASE, -2500, 2500);
  const fLoad = FRONT_LOAD_N - dN, rLoad = REAR_LOAD_N + dN;

  const lim = { f: wheelLimit(mu, fLoad), r: wheelLimit(mu, rLoad) };
  const fCap = 2 * lim.f, rCap = 2 * lim.r;

  let fT = 0, rT = 0;
  if (kind === 'fwd')      fT = Ttot;
  else if (kind === 'rwd') rT = Ttot;
  else                     [fT, rT] = diffSplit(Ttot, fCap, rCap);

  const fDriven = fT > 8, rDriven = rT > 8;
  const fW = axleWheels(fDriven ? fT : 0, lim.f, lim.f);
  const rW = axleWheels(rDriven ? rT : 0, lim.r, lim.r);
  const wheels = [
    { driven: fDriven, torque: fW.tL, slip: fW.sL, limit: lim.f },
    { driven: fDriven, torque: fW.tR, slip: fW.sR, limit: lim.f },
    { driven: rDriven, torque: rW.tL, slip: rW.sL, limit: lim.r },
    { driven: rDriven, torque: rW.tR, slip: rW.sR, limit: lim.r }
  ];
  const fDel = fW.tL + fW.tR, rDel = rW.tL + rW.tR;
  const delivered = fDel + rDel;
  const rearShare = delivered > 1 ? clampN(rDel / delivered, 0, 1) : (fT + rT > 1 ? clampN(rT / (fT + rT), 0, 1) : 0);
  const fSlip = fDriven ? Math.max(fW.sL, fW.sR) : 0;
  const rSlip = rDriven ? Math.max(rW.sL, rW.sR) : 0;
  const fUse = fDriven ? clampN(fT / Math.max(1, fCap), 0, 1.5) : 0;      /* share of the axle's grip that the demand needs */
  const rUse = rDriven ? clampN(rT / Math.max(1, rCap), 0, 1.5) : 0;

  /* road speed from engine rpm and the gearing, tractive force and the acceleration it would give */
  const vMs = num(p.rpm, 2400) / (60 * GEAR_RATIO) * 2 * Math.PI * WHEEL_RADIUS;
  const thrust = delivered / WHEEL_RADIUS;                             /* N */
  const resist = 180 + 0.45 * vMs * vMs;                               /* rolling + drag, N */
  const accelRaw = clampN((thrust - resist) / MASS, -2, 10);

  return { Ttot, fT, rT, fCap, rCap, fLoad, rLoad, wheels, fDel, rDel, delivered, rearShare, fSlip, rSlip,
           fUse, rUse, vMs, thrust, accelRaw };
}
//@@MODEL-END

/* ═══════════════════════════════════════════════════════════════════
   MODULE STATE
   ═══════════════════════════════════════════════════════════════════ */
const S = {
  rpm: 2400,
  surface: 'snow',
  drive: '4x4',
  axle2: 'rear',
  steering: 0,
  steerSigned: 0,
  speed: 1
};

/* The history lives in the Monitor (traces); the module only hands over one normalised sample per ~140 ms while the
   sim runs (0..100 % of each axis range) and the current warning sentence. */
let traceSample = null, traceClear = false, warnText = '';
const traceN = (v, lo, hi) => Math.round(clampN((v - lo) / (hi - lo), 0, 1) * 1000) / 10;
const sim = { accel: 0, lastT: -1 };

function resetModel() {
  sim.accel = 0;
  sim.lastT = -1;
  traceClear = true;                  /* Monitor trace is cleared on the next update */
}
function syncHidden() {               /* which 2x4 axle only matters in 2x4 */
  controls.setHidden('axle2', S.drive === '4x4');
}
function resetAll() {
  S.rpm = 2400;
  S.surface = 'snow';
  S.drive = '4x4';
  S.axle2 = 'rear';
  S.steering = 0;
  S.steerSigned = 0;
  S.speed = 1;
  resetModel();
  controls.resetAll();                 /* every control back to its default (store -> onChange -> S) */
  syncHidden();
}

/* ═══════════════════════════════════════════════════════════════════
   MODULE SCENE
   Car seen from the front-left, FIXED in place (only the parts turn). Front of the car = -x. Wheel order: FL, FR, RL, RR
   (left = +z, the side nearest the camera). Shafts that run along the car are drawn along x.
   ═══════════════════════════════════════════════════════════════════ */
function build(H){
 const { box, cyl, cylX, cylZ, mat, stream, lc, root, THREE, lowEnd, V3 } = H;
 const TAU = Math.PI * 2;

 const car = new THREE.Group();
 root.add(car);
 const B  = (w, h, d, m, x, y, z, p) => box(w, h, d, m, x, y, z, p || car);
 const CX = (rt, rb, h, m, x, y, z, p) => cylX(rt, rb, h, m, x, y, z, p || car);
 const CZ = (rt, rb, h, m, x, y, z, p) => cylZ(rt, rb, h, m, x, y, z, p || car);
 const CY = (rt, rb, h, m, x, y, z, p) => cyl(rt, rb, h, m, x, y, z, p || car);

 const GREY = 0x64748b, GREEN = 0x22c55e, AMBER = 0xf59e0b, RED = 0xef4444, SKY = 0x38bdf8, ORANGE = 0xf97316, GOLD = 0xfacc15;

 /* ── layout constants (scene units) ─────────────────────────── */
 const A_Y = -0.45;                 /* axle centre height                                  */
 const M_Y = 0.05;                  /* crankshaft / gearbox / transfer-case input height   */
 const FX = -3.2, RX = 3.2;         /* front / rear axle x                                 */
 const WZ = 1.8;                    /* wheel centre z (+/-)                                */
 const TYRE_R = 0.7, TYRE_W = 0.5;
 const Z_SUN = SUN_TEETH, Z_RING = RING_TEETH, Z_PLANET = 6;

 /* ── ghosting: a driveline that is not used is faded and still ────────── */
 const sysMats = { front: [], rear: [] };
 const sm = (sys, color, metal, rough, extra) => {
   const m = mat(color, metal == null ? 0.6 : metal, rough == null ? 0.4 : rough, extra || {});
   m.userData.base = { t: m.transparent, o: m.opacity, dw: m.depthWrite, e: m.emissiveIntensity };
   sysMats[sys].push(m); return m;
 };
 const ghostState = { front: false, rear: false };
 function setGhost(sys, on) {
   if (ghostState[sys] === on) return;
   ghostState[sys] = on;
   for (const m of sysMats[sys]) {
     const b = m.userData.base;
     m.transparent = on || b.t;
     m.opacity = on ? (b.o > 0.5 ? 0.2 : b.o * 0.5) : b.o;
     m.depthWrite = on ? false : b.dw;
     m.needsUpdate = true;
   }
 }
 const ghostMat = (color, op) => new THREE.MeshStandardMaterial({ color, metalness: 0.2, roughness: 0.5, transparent: true, opacity: op, depthWrite: false, side: THREE.DoubleSide });

 /* ── base materials ───────────────────────────────────────────── */
 const dark   = mat(0x374151, 0.55, 0.50);
 const steel  = mat(0x94a3b8, 0.85, 0.30);
 const steelD = mat(0x64748b, 0.80, 0.35);
 const frameM = mat(0x1f2937, 0.50, 0.60);
 const markM  = new THREE.MeshBasicMaterial({ color: 0xfde047 });
 const stripeM = new THREE.MeshBasicMaterial({ color: 0xf8fafc });
 const engMat = ghostMat(0x6b7280, 0.22), gbMat = ghostMat(0x5b6678, 0.16), tcMat = ghostMat(0x5b6678, 0.14);
 const engHead = mat(0x4b5563, 0.5, 0.5), engRed = mat(0xb91c1c, 0.4, 0.5), goldM = mat(GOLD, 0.7, 0.35, { emissive: GOLD, emissiveIntensity: 0.25 }), carrierM = mat(0xb8860b, 0.6, 0.4);
 const gearYel = mat(0xe9a420, 0.5, 0.4), gearYelT = mat(0xf8c23c, 0.5, 0.4), gearBlue = mat(0x86bce6, 0.5, 0.4), gearBlueT = mat(0xa9d3f2, 0.5, 0.4), gearGreen = mat(0x49aa4d, 0.5, 0.4), gearGreenT = mat(0x6cc56f, 0.5, 0.4);

 /* ── chassis: a ladder frame, so the shafts and the engine have somewhere to sit ── */
 B(8.4, 0.14, 0.14, frameM, 0, 0.12, 0.95);
 B(8.4, 0.14, 0.14, frameM, 0, 0.12, -0.95);
 B(0.14, 0.14, 1.9, frameM, -3.9, 0.12, 0);
 B(0.14, 0.14, 1.9, frameM, -2.55, 0.12, 0);
 B(0.14, 0.14, 1.9, frameM, 1.6, 0.12, 0);
 B(0.14, 0.14, 1.9, frameM, 3.9, 0.12, 0);

 /* ═════════════════ helpers ═════════════════ */
 /* spur gear with its axis along x (spin about x); a coloured tooth marks the rotation */
 function cogX(radius, thick, teeth, m, tm, parent, x, y, z) {
   const g = new THREE.Group(); g.position.set(x, y, z); (parent || car).add(g);
   const toothLen = Math.max(0.025, radius * 0.16), wid = Math.min(0.12, Math.PI * radius / teeth * 0.82);
   const body = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, thick, 36), m); body.rotation.z = Math.PI / 2; g.add(body);
   const tg = new THREE.BoxGeometry(thick * 1.02, toothLen, wid);
   for (let i = 0; i < teeth; i++) {
     const a = i / teeth * TAU;
     const t = new THREE.Mesh(tg, i === 0 ? markM : (tm || m));
     t.position.set(0, Math.cos(a) * (radius + toothLen * 0.4), Math.sin(a) * (radius + toothLen * 0.4));
     t.rotation.x = a; g.add(t);
   }
   return g;
 }
 /* plain shaft along x with a stripe so the rotation is visible */
 function shaftX(r, x0, x1, m, parent, x, y, z) {
   const g = new THREE.Group(); g.position.set(x || 0, y, z || 0); (parent || car).add(g);
   const len = Math.abs(x1 - x0);
   CX(r, r, len, m, (x0 + x1) / 2 - (x || 0), 0, 0, g);
   B(len * 0.92, 0.035, 0.035, stripeM, (x0 + x1) / 2 - (x || 0), r + 0.005, 0, g);
   return g;
 }
 /* propeller shaft between two points, with a universal joint (cross + yokes) at each end */
 function makeProp(a, b, sys, color) {
   const A = V3(a), Bv = V3(b), dir = Bv.clone().sub(A), len = dir.length(); dir.normalize();
   const grp = new THREE.Group(); grp.position.copy(A).addScaledVector(dir, len / 2);
   grp.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir); car.add(grp);
   const spin = new THREE.Group(); grp.add(spin);
   const m = new THREE.MeshStandardMaterial({ color, metalness: 0.7, roughness: 0.35, emissive: color, emissiveIntensity: 0.3 });
   m.userData.base = { t: false, o: 1, dw: true, e: 0.3 }; sysMats[sys].push(m);
   const jm = sm(sys, 0x9aa3b0, 0.8, 0.3), cm = sm(sys, 0x2f7d36, 0.5, 0.4);
   const body = len - 0.5;
   CY(0.075, 0.075, body, m, 0, 0, 0, spin);
   B(0.035, body * 0.9, 0.035, stripeM, 0.082, 0, 0, spin);

       fslip:    [(R.fSlip * 100).toFixed(0) + ' %', fsState],
       rslip:    [(R.rSlip * 100).toFixed(0) + ' %', rsState],
       turn:     [Math.abs(t) < 0.005 ? 'straight ahead' : fac[0].toFixed(2) + ' / ' + fac[1].toFixed(2) + ' (front, \u00D7 road speed)', ''],
       mu:       [surfaceMu.toFixed(2) + ' ' + SURFACES[surface].label, surfaceMu < 0.4 ? 'warn' : 'ok'],
       state:    [stateTxt, stState]
     },
     status: [warnText || stateTxt, true, warnText ? 'warn' : ''],
      traces: tr,
     ctl: (load * 100).toFixed(0) + ' %'
   };
  }
 };
}


/* Every option lives in the dock (controls.js); nothing interactive is left in the panel.
   'Time scale' is the module's own animation-time compression; the menu's Sim speed is separate. */
CFG.options = [
  { id: "drive", type: 'choice', layout: 'segmented', primary: true, label: "Drive", options: [{ id: '2x4', label: '2x4' }, { id: '4x4', label: '4x4' }], def: "4x4",
    onChange: (id) => { S.drive = id; syncHidden(); } },
  { id: "axle2", type: 'choice', layout: 'segmented', label: "2x4 drives", options: [{ id: 'rear', label: 'Rear' }, { id: 'front', label: 'Front' }], def: "rear",
    onChange: (id) => { S.axle2 = id; } },
  { id: "surface", type: 'choice', layout: 'segmented', label: "Grip", options: [{ id: "dry", label: "Dry" }, { id: "wet", label: "Wet" }, { id: "snow", label: "Snow" }, { id: "ice", label: "Ice" }], def: "snow",
    onChange: (id) => { S.surface = id; } },
  { id: 'timeScale', type: 'choice', layout: 'segmented', label: 'Time scale', options: [{ id: '1', label: '1\u00D7' }, { id: '5', label: '5\u00D7' }, { id: '20', label: '20\u00D7' }], def: '1',
    onChange: (id) => { S.speed = Number(id) || 1; } }
];
CFG.onReset = resetAll;      /* the dock Reset runs the module reset (model + every control) */
/* The history is a Monitor trace. Both series are drawn as 0..100 % of their axis ranges. */
CFG.traces = [{ id: 'hist', label: 'Rear torque share and tractive force history (% of full scale)', min: 0, max: 100, length: 150,
  series: [
    { id: 'a', label: 'Rear %', color: 'var(--accent)' },
    { id: 'b', label: 'Tractive force', color: 'var(--warn)' }
  ] }];
runGuidedModule(CFG, build);
syncHidden();
</script>
</body>
</html>
