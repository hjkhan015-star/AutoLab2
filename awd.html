<script type="module">
import { runGuidedModule, controls } from './components.js';

/* ── CONFIG (module content) ─────────────────────────────────────── */
const CFG = {
  "moduleId": "awd",
  "title": "4WD / AWD Systems",
  "kicker": "Transmission & Drivetrain",
  "accent": "#22c55e",
  "badge": "Centre coupling",
  "camPos": [1.5, 8.8, 4.6],
  "target": [0, -0.4, 0],
  "floorY": -1.6,
  ctls: [   /* Phase 3: sliders live in the dock as axis controls; ctls[0] (id 'ctl') = the main 0-100 % control */
    { id:'ctl', label:"Engine load", caption:"Engine load", preset:'percent', def:60 },

    { id:'steer', type:'dial', look:'wheel', label:'Steering', ariaLabel:'Steering wheel', range:360, def:0, step:1,
      onChange:(v, raw, n)=>{ S.steering = Math.abs(n); } },
  ],
  "chipLabel": "Rear torque",
  "rows": [["fslip", "Front slip"], ["rslip", "Rear slip"]],
  "ro": [
    ["front",  "Front axle"],
    ["rear",   "Rear axle"],
    ["split",  "Bias"],
    ["clutch", "Coupling clamp"],
    ["ctemp",  "Coupling temp"],
    ["ftemp",  "Transfer fluid"],
    ["fslip",  "Front slip"],
    ["rslip",  "Rear slip"],
    ["windup", "Driveline windup"],
    ["mu",     "Surface grip"],
    ["state",  "State"]
  ],
  "legend": [
    ["#38bdf8", "Front driveshaft"],
    ["#f97316", "Rear driveshaft"],
    ["#94a3b8", "Multi-plate clutch"],
    ["#ef4444", "Overheated coupling / windup"],
    ["#22c55e", "Healthy coupling"]
  ],
  "overview": "<div class=\"al-sec\"><h4>Power to all four wheels<\/h4><p>A transfer case or centre coupling splits engine torque between the front and rear axles, improving traction on slippery surfaces. The <b>split is not fixed<\/b>: a modern AWD system continuously moves torque to whichever axle has grip.<\/p><\/div><div class=\"al-sec\"><h4>Three families<\/h4><ul><li><b>Part-time 4WD<\/b> &mdash; a locked centre sending 50:50 to both axles; great off-road, but the driveline winds up on dry tarmac because the front and rear arcs differ in a turn.<\/li><li><b>Full-time AWD with centre diff<\/b> &mdash; a differential lets the axles turn at different speeds; a lock is available for low grip.<\/li><li><b>On-demand AWD<\/b> &mdash; a multi-plate clutch (Haldex, viscous) sits between the axles and is clamped by the ECU when it detects slip.<\/li><\/ul><\/div><div class=\"al-sec\"><h4>What drives the clutch<\/h4><p>Two inputs: <b>speed difference<\/b> across the coupling (a passive viscous coupling responds to this alone) and <b>driver demand<\/b> (a clutch-pack type is pre-emptively clamped by the ECU when the throttle is opened). Both push torque from the faster axle to the slower one.<\/p><\/div><div class=\"al-sec\"><h4>Heat, fade and windup<\/h4><p>Every newton-metre the coupling transfers while the axles are turning at different speeds becomes <b>heat inside the clutch pack<\/b>. Above about 90&nbsp;&deg;C the clutch fades and rear drive disappears. A <b>locked<\/b> centre diff has the opposite problem &mdash; it cannot slip, so any speed difference the tyres demand (a turn on dry tarmac, mismatched tyre diameters) is absorbed as torsional wind-up in the propshafts.<\/p><\/div><div class=\"al-sec\"><h4>Try this<\/h4><p>Leave the coupling on <b>Clutch<\/b>, set load to 80&nbsp;% and drop the surface to <b>Snow<\/b>. Watch the front axle slip, the coupling transfer torque rearward and the coupling temperature climb. Then put the surface back to <b>Dry<\/b> and switch the coupling to <b>Locked<\/b> with the steering wheel turned about 125&deg; either way (70&nbsp;% of full lock) &mdash; the driveline windup readout goes red and the car judders on tight turns.<\/p><\/div>",
  "faults": [
    ["Worn / overheated coupling", "Rear drive disappears, the car understeers and spins its front wheels. The clutch pack is burnt or its oil has degraded, so it cannot transfer torque even when the ECU clamps it.", "Read AWD/haldex live data; check the coupling oil for a burnt smell and replace the clutch pack if the transfer rate is below spec."],
    ["Locked centre diff on dry tarmac", "Juddering, hopping and tyre scrub on tight turns - classic 'tight-corner braking'. The driveline winds up because the two axles cannot turn at different speeds.", "Never use 4H or diff-lock on dry tarmac; check tyre sizes match before re-engaging the lock."],
    ["Low or degraded transfer fluid", "Whine, delayed coupling engagement, high fluid temperature. The oil has lost its friction modifiers so the clutch pack slips and runs hot.", "Change the transfer-case oil to the specified fluid; check for leaks at the output seals."],
    ["Mismatched tyre diameters", "Constant coupling slip, gradual overheat and eventually clutch damage even on a straight road. A 3-4 mm tread difference is enough to trigger it.", "Measure tread depths on all four tyres; replace as a matched set or shave the new tyre to match."]
  ],
  "quiz": [
    ["Why can\u2019t a locked centre diff be used on dry tarmac in a turn?", ["The front and rear axles want different speeds", "The engine is too powerful", "The brakes overheat"], 0, "A locked centre forces both axles to the same speed; in a turn the tyres are dragged and the driveline winds up."],
    ["An on-demand AWD clutch sends torque rearward when\u2026", ["The ECU sees a speed difference or a throttle demand", "The engine is off", "The road is dry"], 0, "The ECU clamps the clutch pre-emptively on throttle and reactively on slip."],
    ["A viscous centre coupling responds to\u2026", ["Speed difference between the axles", "Engine rpm", "Ambient temperature"], 0, "A viscous coupling is passive - it reacts only to the slip across it."],
    ["Above roughly 90\u00a0\u00b0C the coupling fades because\u2026", ["The clutch pack overheats and loses friction capacity", "The oil cools it down too much", "The ECU disables AWD"], 0, "Heat degrades the friction surfaces and the clutch can no longer transfer its rated torque."],
    ["A mismatched tyre diameter causes\u2026", ["Constant coupling slip and overheat", "Better traction", "No effect on the coupling"], 0, "The axle turns at a slightly different speed from the others, so the coupling is always slipping - and always heating."],
    ["A wet road has \u00b5 \u2248 0.70. Compared with dry tarmac that means\u2026", ["Less torque can be transmitted before the tyres slip", "More traction at the rear", "The coupling locks automatically"], 0, "Lower \u00b5 reduces the traction limit on both axles, so the wheels break away at lower torque."]
  ]
};

/* ═══════════════════════════════════════════════════════════════════
   PHYSICS MODEL — pure, named functions.
   Simplified physical trends, not a dyno/bench lookup table.
   ═══════════════════════════════════════════════════════════════════ */
function clampN(x, a, b) {
  if (!Number.isFinite(x)) return a;
  return x < a ? a : (x > b ? b : x);
}
const num = (x, d) => (Number.isFinite(x) ? x : d);

/* ── named constants ─────────────────────────────────────────────── */
const WHEEL_RADIUS  = 0.32;   /* m */
const FRONT_LOAD_N  = 8800;   /* N, static front axle load            */
const REAR_LOAD_N   = 5900;   /* N, static rear axle load             */
const GEAR_RATIO    = 5.0;    /* combined gear × final drive          */
const TAU_COUPLING  = 15;     /* s, coupling thermal time constant    */
const TAU_FLUID     = 30;     /* s, transfer-fluid time constant      */
const TAU_WINDUP    = 3.0;    /* s, windup build time constant        */
const TAU_WINDUP_REL = 1.0;   /* s, windup release                    */
const AMBIENT       = 20;     /* °C                                   */
const WINDUP_WARN   = 0.45;   /* windup above this = noticeable bind  */
const WINDUP_CRIT   = 0.70;   /* windup above this = severe bind      */
const COUPLE_WARN   = 110;    /* °C, coupling warning                 */
const COUPLE_CRIT   = 160;    /* °C, coupling danger                  */
const FLUID_WARN    = 110;    /* °C, transfer-fluid warning           */
const FLUID_CRIT    = 150;    /* °C, transfer-fluid danger            */

/* Surface friction: direction - less grip means less torque the tyres
   can transmit before they slip. */
const SURFACES = {
  dry:    { mu: 1.00, label: 'Dry tarmac' },
  wet:    { mu: 0.70, label: 'Wet road'   },
  gravel: { mu: 0.55, label: 'Gravel'     },
  snow:   { mu: 0.32, label: 'Snow'       },
  ice:    { mu: 0.14, label: 'Ice'        }
};

/* Engine torque (Nm) at the flywheel. Direction: more load and more
   rpm -> more torque. Simple saturating curve, not a dyno map. */
function engineTorque(load, rpm) {
  const L = clampN(load, 0, 1);
  const N = clampN((num(rpm, 2400) - 800) / 4200, 0, 1);
  return clampN(60 + 280 * L * (0.55 + 0.45 * N), 20, 400);
}

/* Axle traction limit (Nm at the axle). Direction: more grip or more
   axle load -> more torque can be delivered before slipping. */
function axleTractionLimit(surfaceMu, axleLoadN) {
  return clampN(num(surfaceMu, 0) * num(axleLoadN, 0) * WHEEL_RADIUS, 0, 5000);
}

/* Wheel slip ratio (0 = gripped, 1 = spinning freely). Direction:
   demand above the traction limit -> tyre spins. */
function axleSlipRatio(torque, tractionLimit) {
  if (torque <= tractionLimit) return 0;
  return clampN((torque - tractionLimit) / Math.max(120, tractionLimit), 0, 1);
}

/* Coupling transfer torque (Nm) from the faster axle to the slower one.
   Direction: more speed difference, more throttle demand, a cooler
   coupling and a healthier pack all increase the transfer. Thermal fade
   above ~90 °C, cap depending on coupling type. */
function couplingTransfer(speedDiff, couplingType, couplingTemp, throttle, couplingHealth) {
  const K   = (couplingType === 'viscous') ?  60 :
              (couplingType === 'clutch')  ? 120 :
              /* locked uses 50:50 path, not this function */ 3000;
  const cap = (couplingType === 'viscous') ? 120 :
              (couplingType === 'clutch')  ? 260 : 500;
  const tempFade = clampN(1 - (num(couplingTemp, 20) - 90) / 90, 0.05, 1);
  const thGain   = (couplingType === 'clutch') ? (0.4 + 0.6 * clampN(throttle, 0, 1)) : 1;
  const health   = clampN(couplingHealth, 0, 1);
  return clampN(K * Math.abs(speedDiff) * tempFade * thGain * health, 0, cap);
}

/* ── fault table ─────────────────────────────────────────────────── */
const FAULT_INFO = {
  none:          { label: 'None (healthy)',                warn: '' },
  wornCoupling:  { label: 'Worn / overheated coupling',    warn: 'The centre coupling can no longer transfer its rated torque even when clamped: the pack is burnt or its oil has degraded. Rear drive effectively disappears and the car spins its front wheels.' },
  lockedDiff:    { label: 'Locked centre diff',            warn: 'Centre diff is locked. Front and rear axles cannot turn at different speeds, so any speed difference the tyres demand builds torsional wind-up in the propshafts - judder and tyre scrub on tight turns.' },
  lowFluid:      { label: 'Low / degraded transfer fluid', warn: 'Transfer-case fluid is low or has lost its friction modifiers. The coupling slips more, runs hotter and its temperature climbs quickly.' },
  tyreMismatch:  { label: 'Mismatched tyre diameters',     warn: 'Axle speeds differ even on a straight road, so the coupling is always slipping and always heating. A 3-4 mm tread depth difference is enough to cause it.' }
};

/* ═══════════════════════════════════════════════════════════════════
   EXTRA CONTROLS (built here; the runtime only provides one slider)
   ═══════════════════════════════════════════════════════════════════ */
const S = {
  rpm: 2400,
  surface: 'dry',
  couplingType: 'clutch',
  steering: 0,
  fault: 'none',
  speed: 1
};



/* ── simulation state (module level so Reset can reach it) ───────── */
/* Phase 7a: the history lives in the Monitor (CFG.traces); the module only hands over one normalised sample
   per ~140 ms while the sim runs (0..100 % of each old axis range) and the current warning sentence. */
let traceSample = null, traceClear = false, warnText = '';
const traceN = (v, lo, hi) => Math.round(clampN((v - lo) / (hi - lo), 0, 1) * 1000) / 10;
const sim = {
  couplingTemp: AMBIENT,
  fluidTemp: AMBIENT,
  windup: 0,
  wheelSpinF: 0,
  wheelSpinR: 0,
  lastT: -1
};

function resetModel() {
  sim.couplingTemp = AMBIENT;
  sim.fluidTemp = AMBIENT;
  sim.windup = 0;
  sim.wheelSpinF = 0;
  sim.wheelSpinR = 0;
  sim.lastT = -1;
  traceClear = true;                  /* Monitor trace is cleared on the next update */
}
function resetAll() {
  S.rpm = 2400;
  S.surface = 'dry';
  S.couplingType = 'clutch';
  S.steering = 0;
  S.fault = 'none';
  S.speed = 1;
  resetModel();
  controls.resetAll();                 /* every axis back to its default (store -> onChange -> S) */
}

/* ═══════════════════════════════════════════════════════════════════
   MODULE SCENE (per-module 3D parts)
   ═══════════════════════════════════════════════════════════════════ */
function build(H){
 const { box, cyl, cylX, cylZ, mat, glass, pipe, stream, lc, clamp, root, THREE, lowEnd, put } = H;

 /* ── base materials ───────────────────────────────────────────── */
 const dark  = mat(0x374151, 0.60, 0.50);
 const steel = mat(0x94a3b8, 0.85, 0.30);
 const rub   = mat(0x111827, 0.10, 0.90);

 /* ── engine + transfer case + housing ────────────────────────── */
 box(1.6, 0.9, 1.3, dark, -1.9, 0.3, 0);
 box(0.9, 0.7, 0.9, dark, -0.95, 0.25, 0);

 /* transfer case body: glass so we can see the clutch pack */
 const tcaseMat = mat(0x4b5563, 0.55, 0.45, { emissive: 0x000000, emissiveIntensity: 0 });
 box(1.3, 0.9, 1.1, tcaseMat, -0.15, -0.05, 0);

 /* ── 10 clutch discs (spacing reflects clamp) ─────────────────── */
 const discs = [];
 const discMatA = mat(0xcbd5e1, 0.80, 0.30);
 const discMatB = mat(0xb45309, 0.50, 0.60, { emissive: 0x000000, emissiveIntensity: 0 });
 for (let i = 0; i < 10; i++) {
   const d = cylX(0.36, 0.36, 0.03, i % 2 ? discMatA : discMatB, 0, -0.05, 0);
   discs.push(d);
 }

 /* ── driveshafts ──────────────────────────────────────────────── */
 const fM = new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness: 0.70, roughness: 0.35, emissive: 0x38bdf8, emissiveIntensity: 0.3 });
 const rM = new THREE.MeshStandardMaterial({ color: 0xf97316, metalness: 0.70, roughness: 0.35, emissive: 0xf97316, emissiveIntensity: 0.3 });
 const fs = cylX(0.10, 0.10, 2.9, fM, -1.95, -0.4, 0);
 const rs = cylX(0.10, 0.10, 3.9, rM,  1.55, -0.4, 0);

 /* ── differentials ───────────────────────────────────────────── */
 box(0.8, 0.5, 0.8, dark, -3.4, -0.4, 0);
 box(0.8, 0.5, 0.8, dark,  3.4, -0.4, 0);
 cylZ(0.09, 0.09, 3.6, steel, -3.4, -0.4, 0);
 cylZ(0.09, 0.09, 3.6, steel,  3.4, -0.4, 0);

 /* ── wheels (separate front / rear lists so they can slip
       at different rates) ─────────────────────────────────────── */
 const frontWheels = [], rearWheels = [];
 const wheelSpecs = [
   { x: -3.4, z: -1.9, axle: 'front' },
   { x: -3.4, z:  1.9, axle: 'front' },
   { x:  3.4, z: -1.9, axle: 'rear'  },
   { x:  3.4, z:  1.9, axle: 'rear'  }
 ];
 wheelSpecs.forEach(spec => {
   const w = new THREE.Group();
   w.position.set(spec.x, -0.4, spec.z);
   root.add(w);
   cylZ(0.75, 0.75, 0.5, rub,   0, 0, 0, w);
   cylZ(0.45, 0.45, 0.52, steel, 0, 0, 0, w);
   for (let i = 0; i < 5; i++) {
     const b = box(0.12, 0.8, 0.06, steel, 0, 0, spec.z > 0 ? 0.27 : -0.27, w);
     b.rotation.z = i * Math.PI * 2 / 5;
   }
   if (spec.axle === 'front') frontWheels.push(w);
   else                        rearWheels.push(w);
 });

 /* ── overheat / windup glow patches ──────────────────────────── */
 const coupleGlowMat = new THREE.MeshBasicMaterial({ color: 0xff3a00, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending });
 const coupleGlow = new THREE.Mesh(new THREE.SphereGeometry(0.72, 14, 10), coupleGlowMat);
 coupleGlow.position.set(-0.15, -0.05, 0);
 root.add(coupleGlow);

 const windupGlowMat = new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending });
 const windupGlow = new THREE.Mesh(new THREE.SphereGeometry(0.60, 14, 10), windupGlowMat);
 windupGlow.position.set(-0.95, 0.25, 0);
 root.add(windupGlow);

 /* ── tyre-mismatch indicator (small bright patch on one wheel) ── */
 const mismatchPatch = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.06, 6, 20),
   new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0, depthWrite: false }));
 mismatchPatch.position.set(3.4, -0.4, 1.9);
 mismatchPatch.rotation.y = Math.PI / 2;
 root.add(mismatchPatch);

 /* ── particle stream: torque flow from transfer case rearward ── */
 const nTorque = lowEnd ? 10 : 18;
 const torqueS = stream([[-0.15, -0.05, 0], [0.4, -0.4, 0], [1.55, -0.4, 0]], nTorque, 0xf97316, 0.12);

 let lastDom = 0;
 let frontWheelAngle = 0;
 let rearWheelAngle  = 0;

 return {
  labels: [
    ['Engine',               [-2.2, 1.0, 0]],
    ['Transfer case',        [-0.15, 0.75, 0]],
    ['Multi-plate clutch',   [-0.15, -0.75, 0]],
    ['Front driveshaft',     [-2.4, -0.7, 0.6]],
    ['Rear driveshaft',      [ 1.6, -0.7, 0.6]],
    ['Front differential',   [-3.4, -0.05, 0.6]],
    ['Rear differential',    [ 3.4, -0.05, 0.6]]
  ],
  update(c) {
   /* ── 1. inputs ─────────────────────────────────────────────── */
   const dt       = Math.max(0, num(c.dt, 0)) * S.speed;
   const load     = clampN(c.k, 0, 1);
   const rpm      = num(S.rpm, 2400);
   const surface  = S.surface in SURFACES ? S.surface : 'dry';
   const surfaceMu = SURFACES[surface].mu;
   const fault    = S.fault;
   const steering = clampN(S.steering, 0, 1);

   /* toolbar Reset rewinds simT -> detect and clear the model */
   if (sim.lastT >= 0 && c.t + 1e-4 < sim.lastT) resetModel();
   sim.lastT = c.t;

   /* fault overrides */
   let couplingType = S.couplingType;
   if (fault === 'lockedDiff') couplingType = 'locked';
   const couplingHealth = (fault === 'wornCoupling') ? 0.15 : 1.0;

   /* ── 2. engine torque and axle traction limits ─────────────── */
   const T_e = engineTorque(load, rpm);
   const T_total = T_e * GEAR_RATIO;
   const ftMax = axleTractionLimit(surfaceMu, FRONT_LOAD_N);
   const rtMax = axleTractionLimit(surfaceMu, REAR_LOAD_N);

   /* ── 3. torque split ───────────────────────────────────────── */
   let fTorque, rTorque, transfer = 0;
   if (couplingType === 'locked') {
     /* rigid 50:50, but capped by the traction available at each axle */
     const half = T_total / 2;
     if (half > ftMax && half > rtMax) { fTorque = ftMax; rTorque = rtMax; }
     else if (half > ftMax) { fTorque = ftMax; rTorque = T_total - ftMax; }
     else if (half > rtMax) { rTorque = rtMax; fTorque = T_total - rtMax; }
     else                   { fTorque = half; rTorque = half; }
     rTorque = clampN(rTorque, 0, rtMax * 1.5);
     fTorque = clampN(fTorque, 0, ftMax * 1.5);
     transfer = 0;
   } else {
     const fBase = T_total * 0.60;
     const rBase = T_total * 0.40;

     /* slips at the base split */
     const fSlipBase = axleSlipRatio(fBase, ftMax);
     const rSlipBase = axleSlipRatio(rBase, rtMax);

     /* tyre-mismatch fault adds a permanent speed difference */
     const mismatch = (fault === 'tyreMismatch') ? 0.22 : 0;

     /* the faster axle drives torque to the slower one */
     const speedDiffNorm = Math.abs(fSlipBase - rSlipBase) + mismatch;

     transfer = couplingTransfer(speedDiffNorm, couplingType, sim.couplingTemp, load, couplingHealth);

     if (fSlipBase >= rSlipBase) {
       rTorque = rBase + transfer;
       fTorque = fBase - transfer;
     } else {
       fTorque = fBase + transfer;
       rTorque = rBase - transfer;
     }
     fTorque = clampN(fTorque, 0, ftMax * 1.5);
     rTorque = clampN(rTorque, 0, rtMax * 1.5);
   }

   /* ── 4. final slip & delivered torque ──────────────────────── */
   const fSlip = axleSlipRatio(fTorque, ftMax);
   const rSlip = axleSlipRatio(rTorque, rtMax);
   const fDelivered = Math.min(fTorque, ftMax);
   const rDelivered = Math.min(rTorque, rtMax);
   const totalDelivered = Math.max(1, fDelivered + rDelivered);
   const rearShare = clampN(rDelivered / totalDelivered, 0, 1);

   /* ── 5. coupling heat & thermal state ──────────────────────── */
   const mismatch2 = (fault === 'tyreMismatch') ? 0.22 : 0;
   const couplingSpeedDiff = Math.abs(fSlip - rSlip) + mismatch2;
   let heat = 0;
   if (couplingType !== 'locked') {
     heat = transfer * couplingSpeedDiff * 0.04;   /* kW */
   } else {
     /* a locked diff still generates heat through the windup itself */
     heat = Math.abs(fSlip - rSlip) * 1.5;
   }
   const fluidMultiplier = (fault === 'lowFluid') ? 1.9 : 1;
   const coupTarget = AMBIENT + heat * 15 * fluidMultiplier;
   if (dt > 0) {
     sim.couplingTemp += (coupTarget - sim.couplingTemp) * (1 - Math.exp(-dt / TAU_COUPLING));
   }
   sim.couplingTemp = clampN(sim.couplingTemp, AMBIENT - 5, 320);

   /* ── 6. transfer-fluid temperature ─────────────────────────── */
   const fluidTarget = AMBIENT
                     + heat * 2.5 * fluidMultiplier
                     + Math.abs(fTorque - rTorque) * 0.015;
   if (dt > 0) {
     sim.fluidTemp += (fluidTarget - sim.fluidTemp) * (1 - Math.exp(-dt / TAU_FLUID));
   }
   sim.fluidTemp = clampN(sim.fluidTemp, AMBIENT - 5, 260);

   /* ── 7. driveline windup (locked diff only) ───────────────── */
   let windupTarget = 0;
   if (couplingType === 'locked') {
     windupTarget = clampN(steering * surfaceMu * 1.1 + Math.abs(fSlip - rSlip) * 0.6, 0, 1);
   }
   if (dt > 0) {
     const tau = (windupTarget > sim.windup) ? TAU_WINDUP : TAU_WINDUP_REL;
     sim.windup += (windupTarget - sim.windup) * (1 - Math.exp(-dt / tau));
   }
   sim.windup = clampN(sim.windup, 0, 1);

   /* ── 8. vehicle speed & wheel rotation ────────────────────── */
   const wheelRps   = rpm / (60 * GEAR_RATIO);
   const vVehicle   = wheelRps * 2 * Math.PI * WHEEL_RADIUS;      /* m/s */
   const vKph       = vVehicle * 3.6;
   /* visual rotation: wheels spin a bit faster when slipping */
   const baseAngRate = (vVehicle / WHEEL_RADIUS) * 0.35;          /* visual pace */
   frontWheelAngle += baseAngRate * (1 + 0.8 * fSlip) * dt;
   rearWheelAngle  += baseAngRate * (1 + 0.8 * rSlip) * dt;
   frontWheels.forEach(w => { w.rotation.z = -frontWheelAngle; });
   rearWheels.forEach(w  => { w.rotation.z = -rearWheelAngle;  });

   /* ── 9. 3D visuals ────────────────────────────────────────── */
   /* driveshaft scale follows its axle torque share */
   const fScale = 0.45 + 1.55 * clampN(fDelivered / Math.max(1, ftMax), 0.10, 1.0);
   const rScale = 0.45 + 1.55 * clampN(rDelivered / Math.max(1, rtMax), 0.10, 1.0);
   fs.scale.set(1, fScale, fScale);
   rs.scale.set(1, rScale, rScale);
   fM.emissiveIntensity = 0.15 + 1.10 * clampN(fDelivered / Math.max(1, ftMax), 0, 1);
   rM.emissiveIntensity = 0.15 + 1.10 * clampN(rDelivered / Math.max(1, rtMax), 0, 1);

   /* clutch discs: tighter pack when clamped hard */
   const clampNorm = clampN(transfer / 260, 0, 1);
   const sp = 0.14 - 0.09 * clampNorm;
   for (let i = 0; i < discs.length; i++) {
     discs[i].position.x = -0.30 + i * sp + (i % 2 ? 0.006 : -0.006);
   }
   /* disc emissive follows coupling temperature */
   const discHot = clampN((sim.couplingTemp - 90) / 90, 0, 1);
   discMatB.emissive.setHex(0xff3020);
   discMatB.emissiveIntensity = discHot * 1.3;

   /* transfer case body glows red when windup is high */
   const windupV = sim.windup;
   tcaseMat.emissive.copy(lc(0x000000, 0xff3020, windupV));
   tcaseMat.emissiveIntensity = windupV * 1.4;

   /* coupling glow: amber when warm, red when hot */
   const coupleHot = clampN((sim.couplingTemp - 90) / 130, 0, 1);
   coupleGlowMat.opacity = coupleHot * 0.45;
   coupleGlowMat.color.copy(lc(0xff8000, 0xff2020, coupleHot));

   /* windup glow patch */
   windupGlowMat.opacity = windupV * 0.55;

   /* tyre-mismatch indicator only when that fault is active */
   mismatchPatch.material.opacity = (fault === 'tyreMismatch') ? (0.35 + 0.25 * Math.abs(Math.sin(c.t * 3))) : 0;

   /* shake the whole assembly when there is windup bind */
   const shakeAmt = windupV * 0.05;
   root.position.x = shakeAmt * Math.sin(c.t * 32);
   root.position.z = shakeAmt * 0.6 * Math.sin(c.t * 37 + 1.1);
   if (sim.windup < 0.01) { root.position.x = 0; root.position.z = 0; }

   /* torque-flow particle stream density and speed follow the transfer */
   const flowDens  = clampN(0.15 + 0.85 * clampNorm + 0.15 * rearShare, 0, 1.05);
   const flowSpeed = 0.05 + 0.35 * clampNorm;
   torqueS.update(c.t, flowSpeed, flowDens);
   torqueS.mat.color.copy(lc(0x38bdf8, 0xff3020, clampN(sim.couplingTemp / 160, 0, 1)));

   /* ── 10. throttled DOM work (graph + warning) ─────────────── */
   const now = performance.now();
   if (now - lastDom > 140) {
     lastDom = now;
     if (dt > 0) traceSample = [traceN(rearShare, 0, 1), traceN(sim.couplingTemp, 10, 210)];

     let warn = FAULT_INFO[fault] ? FAULT_INFO[fault].warn : '';
     if (!warn) {
       if (sim.windup > WINDUP_CRIT) {
         warn = 'Driveline wind-up at ' + (sim.windup * 100).toFixed(0) + ' % - the axles cannot turn at different speeds. Releasing the lock on dry tarmac will stop the judder.';
       } else if (sim.couplingTemp > COUPLE_CRIT) {
         warn = 'Centre coupling at ' + sim.couplingTemp.toFixed(0) + ' \u00B0C - the clutch pack is overheating and beginning to fade. Reduce load or move to a high-grip surface.';
       } else if (sim.fluidTemp > FLUID_CRIT) {
         warn = 'Transfer-case fluid at ' + sim.fluidTemp.toFixed(0) + ' \u00B0C - change the fluid and check for leaks.';
       } else if (sim.windup > WINDUP_WARN) {
         warn = 'Tight-corner bind building (' + (sim.windup * 100).toFixed(0) + ' %) - the locked centre diff is scrubbing the tyres.';
       } else if (sim.couplingTemp > COUPLE_WARN) {
         warn = 'Centre coupling temperature ' + sim.couplingTemp.toFixed(0) + ' \u00B0C - above the comfort window. Watch for fade.';
       } else if (sim.fluidTemp > FLUID_WARN) {
         warn = 'Transfer-case fluid ' + sim.fluidTemp.toFixed(0) + ' \u00B0C - running hot.';
       } else if (fSlip > 0.35) {
         warn = 'Front axle slipping ' + (fSlip * 100).toFixed(0) + ' % - lower the load or choose a higher-grip surface.';
       } else if (rSlip > 0.35) {
         warn = 'Rear axle slipping ' + (rSlip * 100).toFixed(0) + ' % - the coupling is transferring torque forward.';
       }
     }
     warnText = warn;
   }

   /* ── 11. derived state ───────────────────────────────────── */
   let stateTxt;
   if (couplingType === 'locked' && sim.windup > WINDUP_CRIT)   stateTxt = 'BIND - release lock';
   else if (couplingType === 'locked' && sim.windup > WINDUP_WARN) stateTxt = 'Tight-corner bind';
   else if (sim.couplingTemp > COUPLE_CRIT)                     stateTxt = 'Coupling overheated';
   else if (sim.fluidTemp > FLUID_CRIT)                         stateTxt = 'Fluid overheating';
   else if (fSlip > 0.55 || rSlip > 0.55)                       stateTxt = 'Wheelspin';
   else if (fault === 'wornCoupling')                            stateTxt = 'Rear drive lost';
   else if (fault === 'tyreMismatch')                            stateTxt = 'Mismatched tyres';
   else if (couplingType === 'locked')                           stateTxt = 'Locked 50:50';
   else if (rearShare > 0.60)                                    stateTxt = 'Rear-biased';
   else if (rearShare < 0.45)                                    stateTxt = 'Front-biased';
   else                                                          stateTxt = 'Balanced';

   /* ── 12. readouts ─────────────────────────────────────────── */
   const frontPct = (1 - rearShare) * 100;
   const rearPct  = rearShare * 100;
   const splitTxt = frontPct.toFixed(0) + ' / ' + rearPct.toFixed(0);

   const cState = sim.couplingTemp > COUPLE_CRIT ? 'crit' : (sim.couplingTemp > COUPLE_WARN ? 'warn' : 'ok');
   const fState = sim.fluidTemp    > FLUID_CRIT  ? 'crit' : (sim.fluidTemp    > FLUID_WARN  ? 'warn' : 'ok');
   const wState = sim.windup > WINDUP_CRIT ? 'crit' : (sim.windup > WINDUP_WARN ? 'warn' : 'ok');
   const fsState = fSlip > 0.50 ? 'crit' : (fSlip > 0.25 ? 'warn' : 'ok');
   const rsState = rSlip > 0.50 ? 'crit' : (rSlip > 0.25 ? 'warn' : 'ok');
   const stState = (stateTxt === 'BIND - release lock' || stateTxt === 'Coupling overheated' ||
                    stateTxt === 'Fluid overheating'  || stateTxt === 'Wheelspin') ? 'crit'
                 : (stateTxt === 'Tight-corner bind' || stateTxt === 'Rear drive lost' ||
                    stateTxt === 'Mismatched tyres') ? 'warn'
                 : 'ok';

   const fluidPct = (1 - clampN((sim.fluidTemp - AMBIENT) / (FLUID_CRIT - AMBIENT), 0, 1)) * 100;

   let tr;
   if (traceClear) { traceClear = false; traceSample = null; tr = { hist: null }; }
   else if (traceSample) { tr = { hist: traceSample }; traceSample = null; }

   return {
     big: rearPct.toFixed(0),
     unit: ' %',
     bar: rearPct,
     rows: {
       fslip: (fSlip * 100).toFixed(0) + ' %',
       rslip: (rSlip * 100).toFixed(0) + ' %'
     },
     ro: {
       front:  [fDelivered.toFixed(0) + ' Nm', ''],
       rear:   [rDelivered.toFixed(0) + ' Nm', 'hi'],
       split:  [splitTxt, ''],
       clutch: [transfer.toFixed(0) + ' Nm', ''],
       ctemp:  [sim.couplingTemp.toFixed(0) + ' \u00B0C', cState],
       ftemp:  [sim.fluidTemp.toFixed(0) + ' \u00B0C', fState],
       fslip:  [(fSlip * 100).toFixed(0) + ' %', fsState],
       rslip:  [(rSlip * 100).toFixed(0) + ' %', rsState],
       windup: [(sim.windup * 100).toFixed(0) + ' %', wState],
       mu:     [surfaceMu.toFixed(2), surfaceMu < 0.4 ? 'warn' : 'ok'],
       state:  [stateTxt, stState]
     },
     status: [warnText || stateTxt, true, warnText ? 'warn' : ''],
      traces: tr,
     ctl: (load * 100).toFixed(0) + ' %'
   };
  }
 };
}


/* Phase 6: every option / action lives in the dock (controls.js), nothing interactive is left in the panel.
   'Time scale' is the module's own physics time-compression (thermal warm-up); the menu's Sim speed is separate. */
CFG.options = [
  { id: "surface", type: 'choice', layout: 'select', label: "Surface", options: [{ id: "dry", label: "Dry tarmac (µ 1.00)" }, { id: "wet", label: "Wet road (µ 0.70)" }, { id: "gravel", label: "Gravel (µ 0.55)" }, { id: "snow", label: "Snow (µ 0.32)" }, { id: "ice", label: "Ice (µ 0.14)" }], def: "dry",
    onChange: (id) => { S.surface = id; } },
  { id: "type", type: 'choice', layout: 'select', label: "Centre coupling", options: [{ id: "viscous", label: "Viscous (passive)" }, { id: "clutch", label: "Clutch pack (ECU)" }, { id: "locked", label: "Locked 50:50 (4H)" }], def: "clutch",
    onChange: (id) => { S.couplingType = id; } },
  { id: "fault", type: 'choice', layout: 'select', label: "Fault injection", options: Object.keys(FAULT_INFO).map(id => ({ id, label: FAULT_INFO[id].label })), def: 'none',
    onChange: (id) => { S.fault = id; } },
  { id: 'timeScale', type: 'choice', layout: 'segmented', label: 'Time scale', options: [{ id: '1', label: '1×' }, { id: '5', label: '5×' }, { id: '20', label: '20×' }], def: '1',
    onChange: (id) => { S.speed = Number(id) || 1; } },
  { id: "cool", type: 'action', label: "Cool down",
    onAction: () => { sim.couplingTemp = AMBIENT; sim.fluidTemp = AMBIENT; } }
];
CFG.onReset = resetAll;      /* the dock Reset runs the module reset (model + every control) */
/* Phase 7a: the old history canvas is a Monitor trace. Both series are drawn as 0..100 % of their old axis ranges. */
CFG.traces = [{ id: 'hist', label: 'Rear torque split and coupling temperature history (% of full scale)', min: 0, max: 100, length: 150,
  series: [
    { id: 'a', label: 'Rear %', color: 'var(--accent)' },
    { id: 'b', label: 'Coupling \u00B0C', color: 'var(--warn)' }
  ] }];
runGuidedModule(CFG, build);
</script>
</body>
</html>
