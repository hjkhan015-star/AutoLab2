<script type="module">
import { runGuidedModule, controls } from './components.js';

/* ── CONFIG (module content) ─────────────────────────────────────── */
const CFG = {
  "moduleId": "driveshaft",
  "title": "Driveshafts & U-Joints",
  "kicker": "Transmission & Drivetrain",
  "accent": "#38bdf8",
  "badge": "Universal joint",
  "camPos": [4.2, 2.8, 5.6],
  "target": [0, 0, 0],
  "floorY": -1.7,
  ctls: [   /* Phase 3: sliders live in the dock as axis controls; ctls[0] (id 'ctl') = the main 0-100 % control */
    { id:'ctl', label:"Joint angle", caption:"Working angle", preset:'percent', def:45 },
    { id:'rpm', preset:'rpm', max:6000, def:2400, label:'Input speed', onChange:(v)=>{ S.rpm = v; } },
    { id:'length', min:0.8, max:2.5, step:0.05, def:1.5, decimals:2, unit:'m', label:'Shaft length', onChange:(v)=>{ S.length = v; } },
    { id:'phase', min:0, max:90, step:5, def:0, unit:'\u00B0', label:'Yoke phase error', onChange:(v)=>{ S.phase = v; } },
  ],
  "chipLabel": "Speed swing",
  "rows": [["ratio", "Instant ratio"], ["rpm", "Input rpm"]],
  "ro": [
    ["ang",    "Joint angle"],
    ["rpm",    "Input speed"],
    ["range",  "Output range"],
    ["swing",  "Speed swing"],
    ["ratio",  "Instant ratio"],
    ["vib",    "Vibration"],
    ["crit",   "Critical speed"],
    ["margin", "Speed margin"],
    ["phase",  "Yoke phase"],
    ["type",   "Joint type"],
    ["state",  "State"]
  ],
  "legend": [
    ["var(--c-slate)", "Input shaft"],
    ["var(--c-cyan)", "Output shaft"],
    ["var(--c-orange)", "Reference marks"],
    ["var(--c-red)", "Worn joint / imbalance"],
    ["var(--c-violet)", "CV joint (constant velocity)"]
  ],
  "overview": "<div class=\"al-sec\"><h4>Transmitting power at an angle<\/h4><p>A cardan (universal) joint lets a shaft carry torque through an angle &mdash; for example from gearbox to rear axle as the suspension moves. On a rear-drive car the joint angle changes every time the car hits a bump.<\/p><\/div><div class=\"al-sec\"><h4>The catch<\/h4><p>A single U-joint at an angle makes the output speed fluctuate <b>twice per revolution<\/b>. The output speeds up to 1/cos&nbsp;&alpha; and slows to cos&nbsp;&alpha;, so the bigger the angle, the bigger the fluctuation. At 15&deg; the swing is about &plusmn;3.5&nbsp;%; at 30&deg; it is over &plusmn;14&nbsp;%, which shakes the whole drivetrain.<\/p><\/div><div class=\"al-sec\"><h4>Two cures<\/h4><ul><li><b>Two joints, in phase.<\/b> The second joint reverses the first joint&rsquo;s error, so a correctly phased pair transmits uniform speed. Get the yokes out of phase by 90&deg; and the errors add instead &mdash; the swing doubles.<\/li><li><b>Constant-velocity (CV) joints.<\/b> These transmit uniformly at any angle and are used on front-wheel-drive driveshafts. They are heavier and more expensive, so a U-joint pair still wins on a rear-drive propshaft.<\/li><\/ul><\/div><div class=\"al-sec\"><h4>Vibration and critical speed<\/h4><p>Every propshaft has a <b>critical speed<\/b> at which its own bending resonance is excited &mdash; roughly 3200&nbsp;rpm for a 1.5&nbsp;m shaft, less for a longer one. Imbalance, a worn cross or a sagging centre bearing all push vibration up; at the critical speed a small fault becomes a violent shake.<\/p><\/div><div class=\"al-sec\"><h4>Try this<\/h4><p>Hold the joint angle near zero and confirm the output is uniform. Now increase the working angle to 25&ndash;30&deg; and watch the speed-swing and vibration readouts climb. Then select the <b>out-of-phase yokes<\/b> fault and see the swing double &mdash; the same way a propshaft fitted one spline off shakes the car. Finally try <b>worn U-joint<\/b> or <b>imbalance<\/b> and watch the vibration build as rpm approaches the critical speed.<\/p><\/div>",
  "faults": [
    ["Worn U-joint (play in the cross)", "Clunk when taking up drive, chirp or vibration at low speed, a shake that gets worse under load. The needle rollers are dry or worn so the joint has radial play.", "Twist the shaft by hand with the transmission in neutral and feel for play at the cross; any perceptible movement means replace the joint."],
    ["Out-of-phase yokes", "A shake that starts at road speed and does not go away with balance weights. The second joint\u2019s yoke is fitted one spline out, so the two joints\u2019 errors add instead of cancelling.", "Compare reference marks on the yokes with the workshop manual; on a two-piece shaft the yoke ears must lie in the same plane."],
    ["Imbalance / lost balance weight", "A drone or shake that appears at one particular speed and eases off either side. Often after a U-joint replacement, a dent, or mud baked onto the shaft.", "Inspect the shaft for missing balance weights, dents or dried mud; re-balance or replace the shaft."],
    ["Failed centre support bearing", "Rumble under load, a shake at cruise and sometimes a small clonk over bumps. The rubber mount perishes and the bearing loses preload so the two-piece shaft runs out of line.", "Check the rubber mount for cracking and the bearing for roughness; replace the support with the shaft out of the car."]
  ],
  "quiz": [
    ["A single U-joint running at an angle causes\u2026", ["Speed fluctuation twice per revolution", "Constant output speed", "Zero torque"], 0, "The output speeds up to 1/cos alpha and slows to cos alpha twice per revolution."],
    ["Two joints on a propshaft cancel the fluctuation when\u2026", ["Their yokes are in phase and the angles are equal", "The shaft is longer", "The joint angle is zero"], 0, "The second joint reverses the first joint\u2019s error only if the yoke ears are in the same plane."],
    ["A 2-piece shaft yoked one spline out will\u2026", ["Double the speed swing and shake the car", "Run smoother", "Have no effect"], 0, "The errors add instead of cancelling, so the swing doubles."],
    ["CV joints differ from U-joints because\u2026", ["They transmit constant velocity at any angle", "They are cheaper", "They need no grease"], 0, "CV joints use balls running in curved tracks so the output stays uniform even at 45 degrees."],
    ["A propshaft\u2019s critical speed is reached when\u2026", ["Rpm coincides with the shaft\u2019s own bending resonance", "The car is fully loaded", "The gearbox is in neutral"], 0, "At this speed a small imbalance causes a large vibration - the shaft whirls."],
    ["A worn U-joint is usually diagnosed by\u2026", ["Feeling for play in the cross with the shaft unloaded", "Listening to the exhaust", "Reading the ECU fault memory"], 0, "Wear shows as radial play between the yokes - a classic dry-needle-roller failure."]
  ]
};

/* ═══════════════════════════════════════════════════════════════════
   PHYSICS MODEL — pure, named functions.
   Simplified physical trends, not a bench lookup table.
   ═══════════════════════════════════════════════════════════════════ */
function clampN(x, a, b) {
  if (!Number.isFinite(x)) return a;
  return x < a ? a : (x > b ? b : x);
}
const num = (x, d) => (Number.isFinite(x) ? x : d);
const DEG2RAD = Math.PI / 180;

/* ── named constants ─────────────────────────────────────────────── */
const UJ_SMOOTH_DEG = 8;    /* below this, a U-joint runs smoothly          */
const UJ_WARN_DEG   = 15;   /* above this, driveline shake is noticeable    */
const UJ_SEVERE_DEG = 22;   /* above this, CV or two-joint layout is needed */
const CRIT_K        = 3200; /* rpm, critical speed of a 1.5 m × 100 mm shaft */
const REF_LEN       = 1.5;  /* m, reference shaft length for CRIT_K          */
const REF_DIA       = 0.10; /* m, reference shaft diameter                   */
const VIB_TAU       = 0.8;  /* s, vibration envelope smoothing                */
const IMBAL_WARN    = 28;   /* mm/s rms, vibration warning                    */
const IMBAL_CRIT    = 45;   /* mm/s rms, vibration danger                     */

/* Half of the peak-to-peak speed swing of a single U-joint. Direction:
   bigger working angle -> bigger swing. Zero at alpha = 0. */
function ujointHalfSwing(angleDeg) {
  const a = clampN(angleDeg, 0, 45) * DEG2RAD;
  const ca = Math.cos(a);
  if (ca <= 0.01) return 0.5;
  return clampN((1 / ca - ca) / 2, 0, 0.5);
}

/* Instantaneous output / input speed ratio for a single U-joint.
   theta = input shaft angle, alpha = working angle. Direction:
   ratio swings between cos(alpha) and 1/cos(alpha) twice per rev. */
function ujointInstantRatio(theta, angleDeg) {
  const a = clampN(angleDeg, 0, 45) * DEG2RAD;
  const sa2 = Math.sin(a) * Math.sin(a);
  const ct2 = Math.cos(theta) * Math.cos(theta);
  const denom = 1 - sa2 * (1 - ct2);
  return clampN(Math.cos(a) / Math.max(0.05, denom), 0.5, 2.0);
}

/* Effect of yoke phase error on a two-joint system. Direction: 0 deg
   (in phase) -> 0 extra swing; 90 deg (worst) -> 2x single-joint swing. */
function phasingFactor(phaseErrDeg) {
  const p = clampN(phaseErrDeg, 0, 90) * DEG2RAD;
  return 2 * Math.abs(Math.sin(p));
}

/* Critical (whirl) speed of a hollow propshaft in rpm. Direction:
   longer shaft -> lower critical speed; bigger diameter -> higher. */
function criticalSpeed(lengthM, diameterM) {
  const L = clampN(num(lengthM, REF_LEN), 0.3, 3.0);
  const D = clampN(num(diameterM, REF_DIA), 0.03, 0.25);
  const scaleL = Math.pow(REF_LEN / L, 2);
  const scaleD = D / REF_DIA;
  return clampN(CRIT_K * scaleL * scaleD, 500, 12000);
}

/* Imbalance vibration velocity (mm/s rms). Direction: more imbalance
   or more rpm -> more vibration. Roughly linear in rpm and g·mm. */
function imbalanceVibration(rpm, imbalanceGmm) {
  const rpmN = clampN(num(rpm, 0) / 1000, 0, 10);
  return clampN(num(imbalanceGmm, 0) * rpmN * 0.55, 0, 200);
}

/* Resonance amplification at the shaft's critical speed. Direction:
   operating rpm near the critical speed -> large factor. */
function resonanceFactor(rpm, critRpm) {
  const r = clampN(num(rpm, 0) / Math.max(200, num(critRpm, 3000)), 0, 3);
  const zeta = 0.10;
  const den = Math.sqrt(Math.pow(1 - r * r, 2) + Math.pow(2 * zeta * r, 2));
  return clampN(1 / Math.max(0.15, den), 0.5, 6);
}

const FAULT_INFO = {
  none:          { label: 'None (healthy)',                    warn: '' },
  wornJoint:     { label: 'Worn U-joint (P-code n/a)',         warn: 'Worn U-joint: the needle rollers in the cross are dry or worn, so the joint has radial play. Typical symptom is a clunk when taking up drive, a chirp at low speed and a 2x-per-rev shake that gets worse with load. Twist the shaft by hand to feel for play and replace the joint.' },
  outOfPhase:    { label: 'Out-of-phase yokes',                warn: 'Yoke phase error is not a fault code but a fitting error: the second joint yoke is one spline off, so the two joints\u2019 errors add instead of cancelling. Result: the speed swing doubles and the whole car shakes at cruise. Reference marks on both yokes must lie in the same plane.' },
  imbalance:     { label: 'Imbalance / lost weight',           warn: 'Shaft imbalance produces a drone or shake at one particular speed that eases off either side. Common after a U-joint replacement, a dent, or dried mud stuck to the shaft. Re-balance or replace.' },
  centreBearing: { label: 'Failed centre support bearing',     warn: 'The centre support bearing is worn or its rubber mount has perished. The two-piece shaft runs out of line, causing a rumble under load and a shake at cruise. Inspect the rubber for cracking and the bearing for roughness.' }
};

/* ═══════════════════════════════════════════════════════════════════
   EXTRA CONTROLS (built here; the runtime only provides one slider)
   ═══════════════════════════════════════════════════════════════════ */
const S = {
  rpm: 2400,
  length: 1.5,
  phase: 0,
  jointType: 'ujoint',
  fault: 'none',
  speed: 1
};



/* ── simulation state (module level so Reset can reach it) ───────── */
/* Phase 7a: the history lives in the Monitor (CFG.traces); the module only hands over one normalised sample
   per ~140 ms while the sim runs (0..100 % of each old axis range) and the current warning sentence. */
let traceSample = null, traceClear = false, warnText = '';
const traceN = (v, lo, hi) => Math.round(clampN((v - lo) / (hi - lo), 0, 1) * 1000) / 10;
const sim = {
  thetaIn: 0,
  vibRms: 0,
  lastT: -1
};

function resetModel() {
  sim.thetaIn = 0;
  sim.vibRms = 0;
  sim.lastT = -1;
  traceClear = true;                  /* Monitor trace is cleared on the next update */
}
function resetAll() {
  S.rpm = 2400;
  S.length = 1.5;
  S.phase = 0;
  controls.setDisabled('phase', false);
  S.jointType = 'ujoint';
  S.fault = 'none';
  S.speed = 1;
  resetModel();
  controls.resetAll();                 /* every axis back to its default (store -> onChange -> S) */
}

/* ═══════════════════════════════════════════════════════════════════
   MODULE SCENE (per-module 3D parts)
   ═══════════════════════════════════════════════════════════════════ */
function build(H){
 const { box, cyl, cylX, cylZ, mat, glass, pipe, stream, lc, clamp, root, THREE, lowEnd, put } = H;

 /* ── assembly group (gets shaken on imbalance) ─────────────────── */
 const assembly = new THREE.Group();
 root.add(assembly);

 /* ── materials ─────────────────────────────────────────────────── */
 const steel  = mat(0xe2e8f0, 0.80, 0.30);
 const blue   = mat(0x38bdf8, 0.70, 0.35);
 const dark   = mat(0x3d4555, 0.60, 0.50);
 const or     = mat(0xf97316, 0.40, 0.50);
 const crossM = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.90, roughness: 0.25, emissive: 0x000000, emissiveIntensity: 0 });
 const bootM  = mat(0x1f2937, 0.15, 0.85);

 /* ── gearbox housing ───────────────────────────────────────────── */
 box(1.0, 1.4, 1.4, dark, -4.4, 0, 0, assembly);

 /* ── input shaft (attached to the input group so the reference
       mark spins with the shaft) ────────────────────────────────── */
 const gIn = new THREE.Group();
 gIn.position.set(0, 0, 0);
 assembly.add(gIn);
 cylX(0.22, 0.22, 3.6, steel, -2.1, 0, 0, gIn);

 /* input yoke ears + cross (all children of gIn) */
 box(0.35, 0.14, 0.16, steel, -0.15,  0.52, 0, gIn);
 box(0.35, 0.14, 0.16, steel, -0.15, -0.52, 0, gIn);
 box(0.08, 1.10, 0.16, steel,  0.02, 0, 0, gIn);
 /* reference mark on input shaft */
 box(0.10, 0.28, 0.28, or, -1.10, 0.32, 0, gIn);

 /* cross (spider) */
 cyl(0.075, 0.075, 1.06, crossM, 0, 0, 0, gIn);
 cylZ(0.075, 0.075, 1.06, crossM, 0, 0, 0, gIn);

 /* ── tilt group (sets the working angle) ──────────────────────── */
 const gTilt = new THREE.Group();
 gTilt.position.set(0, 0, 0);
 assembly.add(gTilt);

 /* ── output group (rotates within gTilt about its own axis) ───── */
 const gOut = new THREE.Group();
 gTilt.add(gOut);

 /* yoke phase group (visualises yoke misalignment) */
 const yokePhase = new THREE.Group();
 yokePhase.position.set(0.15, 0, 0);
 gOut.add(yokePhase);
 box(0.35, 0.16, 0.14, blue, 0,  0.52, 0, yokePhase);
 box(0.35, 0.16, 0.14, blue, 0, -0.52, 0, yokePhase);
 box(0.08, 0.16, 1.10, blue, 0, 0, 0, yokePhase);

 /* output shaft + reference mark */
 cylX(0.22, 0.22, 3.6, blue, 2.1, 0, 0, gOut);
 box(0.10, 0.28, 0.28, or, 1.10, 0.32, 0, gOut);

 /* differential / axle housing */
 box(1.0, 1.4, 1.4, dark, 4.4, 0, 0, gTilt);

 /* ── CV boot (hidden by default; shown when CV is selected) ───── */
 const cvBoot = new THREE.Group();
 gTilt.add(cvBoot);
 for (let i = -2; i <= 2; i++) {
   const r = 0.32 - Math.abs(i) * 0.015;
   const t = new THREE.Mesh(new THREE.TorusGeometry(r, 0.055, 8, 22), bootM);
   t.position.set(0.02 + i * 0.09, 0, 0);
   t.rotation.y = Math.PI / 2;
   cvBoot.add(t);
 }
 cvBoot.visible = false;

 /* ── centre support bearing on the input shaft ────────────────── */
 const cbMat = new THREE.MeshStandardMaterial({ color: 0x3d4555, metalness: 0.6, roughness: 0.5, emissive: 0x000000, emissiveIntensity: 0 });
 const cbRing = new THREE.Mesh(new THREE.TorusGeometry(0.30, 0.09, 8, 20), cbMat);
 cbRing.position.set(-1.4, 0, 0);
 cbRing.rotation.y = Math.PI / 2;
 assembly.add(cbRing);
 box(0.35, 0.55, 0.35, cbMat, -1.4, -0.50, 0, assembly);

 /* ── visible imbalance weight (hidden by default) ─────────────── */
 const imbalW = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.24, 0.24), or);
 imbalW.position.set(-2.0, 0.32, 0.30);
 imbalW.visible = false;
 assembly.add(imbalW);

 /* ── glow shell around the joint (visible when worn) ─────────── */
 const glowM = new THREE.MeshBasicMaterial({ color: 0xff3a3a, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending });
 const glow = new THREE.Mesh(new THREE.SphereGeometry(0.34, 12, 10), glowM);
 assembly.add(glow);

 /* ── air-through-the-joint particle stream (small, subtle) ───── */
 const nSpark = lowEnd ? 8 : 14;
 const sparkS = stream([[-0.2, 0.35, 0.35], [0.4, 0.20, 0.20]], nSpark, 0x94a3b8, 0.06);

 let lastDom = 0;

 return {
  labels: [
    ['Input shaft',    [-2.1, 0.75, 0]],
    ['Yoke',           [-0.15, 0.95, 0]],
    ['Cross (spider)', [ 0.0, -0.90, 0.45]],
    ['Output shaft',   [ 2.1, 0.75, 0]],
    ['Gearbox',        [-4.4, 1.10, 0]],
    ['Centre bearing', [-1.4, -0.90, 0]],
    ['Axle flange',    [ 4.4, 1.10, 0]]
  ],
  update(c) {
   /* ── 1. inputs ─────────────────────────────────────────────── */
   const dt      = Math.max(0, num(c.dt, 0)) * S.speed;
   const L       = clampN(c.k, 0, 1);
   const angleDeg = L * 30;                       /* runtime slider 0..30° */
   const rpm     = num(S.rpm, 2400);
   const lengthM = num(S.length, 1.5);
   let phaseErr  = num(S.phase, 0);
   const jointType = S.jointType;
   const fault     = S.fault;

   /* toolbar Reset detection */
   if (sim.lastT >= 0 && c.t + 1e-4 < sim.lastT) resetModel();
   sim.lastT = c.t;

   /* fault overrides */
   if (fault === 'outOfPhase') phaseErr = 90;
   if (jointType === 'cv')     phaseErr = 0;

   /* ── 2. swing & speed range ───────────────────────────────── */
   let halfSwing;
   if (jointType === 'cv') {
     halfSwing = 0;
   } else {
     halfSwing = ujointHalfSwing(angleDeg) * phasingFactor(phaseErr);
   }
   const swingPct = halfSwing * 100;
   const rpmAvg   = rpm;
   const rpmHi    = rpm * (1 + halfSwing);
   const rpmLo    = rpm * (1 - halfSwing);

   /* ── 3. critical speed & margin ───────────────────────────── */
   const critRpm   = criticalSpeed(lengthM, 0.10);
   const marginPct = (critRpm - rpm) / Math.max(200, critRpm) * 100;

   /* ── 4. vibration envelope ────────────────────────────────── */
   let imbG = 4;                                  /* healthy baseline */
   if (fault === 'wornJoint')     imbG = 14;
   if (fault === 'imbalance')     imbG = 55;
   if (fault === 'centreBearing') imbG = 20;
   /* U-joint speed swing itself contributes to perceived shake */
   const ujVib = jointType === 'cv' ? 0 : swingPct * 0.35;
   const rp    = resonanceFactor(rpm, critRpm);
   const vTarget = (imbalanceVibration(rpm, imbG) + ujVib) * rp;

   if (dt > 0) {
     const a = 1 - Math.exp(-dt / VIB_TAU);
     sim.vibRms += (vTarget - sim.vibRms) * a;
   }
   sim.vibRms = clampN(sim.vibRms, 0, 250);

   /* ── 5. shaft rotation & output kinematics ───────────────── */
   const omega = rpm * 2 * Math.PI / 60;
   if (dt > 0) {
     sim.thetaIn += omega * dt;
     if (sim.thetaIn > 1e6) sim.thetaIn -= 1e6;
   }
   const alpha = angleDeg * DEG2RAD;
   let thetaOut;
   if (jointType === 'cv') {
     thetaOut = sim.thetaIn;
   } else {
     thetaOut = Math.atan2(Math.sin(sim.thetaIn), Math.cos(sim.thetaIn) * Math.cos(alpha));
   }
   const instRatio = (jointType === 'cv') ? 1 : ujointInstantRatio(sim.thetaIn, angleDeg);

   /* ── 6. apply to 3D ───────────────────────────────────────── */
   gIn.rotation.x   = sim.thetaIn;
   gTilt.rotation.z = -alpha;
   gOut.rotation.x  = thetaOut;
   /* yoke misalignment visual: 0° = correct, 90° = worst */
   yokePhase.rotation.x = phaseErr * DEG2RAD;

   /* worn joint wobble & glow */
   if (fault === 'wornJoint') {
     gTilt.rotation.y = 0.02 * Math.sin(sim.thetaIn * 2);
     glowM.opacity = 0.42 + 0.20 * Math.sin(c.t * 6);
     crossM.emissive.setHex(0xef4444);
     crossM.emissiveIntensity = 0.40 + 0.20 * Math.abs(Math.sin(c.t * 5));
   } else {
     gTilt.rotation.y = 0;
     glowM.opacity = 0;
     crossM.emissive.setHex(0x000000);
     crossM.emissiveIntensity = 0;
   }

   /* imbalance weight visible only for that fault */
   imbalW.visible = (fault === 'imbalance');

   /* shake the whole assembly based on smoothed vibration */
   const shakeAmt = clampN(sim.vibRms / 160, 0, 1) * 0.09;
   assembly.position.y = shakeAmt * Math.sin(sim.thetaIn);
   assembly.position.z = shakeAmt * 0.50 * Math.sin(2 * sim.thetaIn + 0.6);
   assembly.rotation.x = shakeAmt * 0.25 * Math.sin(2 * sim.thetaIn + 0.3);

   /* centre bearing fault: pulsing red glow + small wobble */
   if (fault === 'centreBearing') {
     cbMat.emissive.setHex(0xef4444);
     cbMat.emissiveIntensity = 0.45 + 0.30 * Math.sin(c.t * 8);
     cbRing.position.y = 0.012 * Math.sin(c.t * 14);
   } else {
     cbMat.emissive.setHex(0x000000);
     cbMat.emissiveIntensity = 0;
     cbRing.position.y = 0;
   }

   /* CV boot visibility */
   cvBoot.visible = (jointType === 'cv');

   /* particle stream: small sparks near the joint, scaled with vibration */
   sparkS.update(c.t, 0.35, clampN(sim.vibRms / 60, 0.05, 1));

   /* ── 7. throttled DOM work (graph + warning) ──────────────── */
   const now = performance.now();
   if (now - lastDom > 140) {
     lastDom = now;
     if (dt > 0) traceSample = [traceN(swingPct, 0, 60), traceN(sim.vibRms, 0, 100)];
     let warn = FAULT_INFO[fault] ? FAULT_INFO[fault].warn : '';
     if (!warn) {
       if (Math.abs(rpm - critRpm) < 0.10 * critRpm) {
         warn = 'Operating at ' + rpm.toFixed(0) + ' rpm is within 10 % of the shaft\u2019s critical speed (' + critRpm.toFixed(0) + ' rpm). Reduce speed or fit a shorter / stiffer shaft.';
       } else if (sim.vibRms > IMBAL_CRIT) {
         warn = 'Driveline vibration ' + sim.vibRms.toFixed(0) + ' mm/s rms - well above the safe limit. Inspect for imbalance, worn U-joints and a sagging centre bearing.';
       } else if (angleDeg > UJ_SEVERE_DEG && jointType === 'ujoint') {
         warn = 'Working angle ' + angleDeg.toFixed(1) + ' \u00B0 is severe for a single U-joint (over ' + UJ_SEVERE_DEG + ' \u00B0). Use a CV joint or re-phase two joints to cancel the fluctuation.';
       } else if (sim.vibRms > IMBAL_WARN) {
         warn = 'Driveline vibration ' + sim.vibRms.toFixed(0) + ' mm/s rms - above the comfort limit. Check balance and U-joint condition.';
       } else if (angleDeg > UJ_WARN_DEG && jointType === 'ujoint') {
         warn = 'Joint angle ' + angleDeg.toFixed(1) + ' \u00B0 is above the ' + UJ_WARN_DEG + ' \u00B0 comfort threshold for a single U-joint.';
       } else if (phaseErr > 20 && jointType === 'ujoint') {
         warn = 'Yoke phase error ' + phaseErr.toFixed(0) + ' \u00B0 - the two joints are not cancelling. Re-index the yoke one spline so the ears lie in the same plane.';
       }
     }
     warnText = warn;
   }

   /* ── 8. derived state ─────────────────────────────────────── */
   let stateTxt;
   const nearCrit = Math.abs(rpm - critRpm) < 0.15 * critRpm;
   if (fault === 'wornJoint')           stateTxt = 'Worn U-joint - clunk';
   else if (fault === 'outOfPhase')     stateTxt = 'Out-of-phase yokes';
   else if (fault === 'imbalance')      stateTxt = 'Imbalance vibration';
   else if (fault === 'centreBearing')  stateTxt = 'Centre bearing rumble';
   else if (nearCrit)                   stateTxt = 'Near critical speed';
   else if (jointType === 'cv')         stateTxt = 'CV - constant velocity';
   else if (angleDeg < UJ_SMOOTH_DEG)   stateTxt = 'Smooth';
   else if (angleDeg < UJ_WARN_DEG)     stateTxt = 'Acceptable';
   else if (angleDeg < UJ_SEVERE_DEG)   stateTxt = 'Rough - above comfort';
   else                                 stateTxt = 'Severe angle';

   /* ── 9. readouts ──────────────────────────────────────────── */
   const angState  = angleDeg > UJ_SEVERE_DEG ? 'crit' : (angleDeg > UJ_WARN_DEG ? 'warn' : (angleDeg < UJ_SMOOTH_DEG ? 'ok' : 'hi'));
   const swState   = swingPct > 15 ? 'crit' : (swingPct > 5 ? 'warn' : 'ok');
   const vibState  = sim.vibRms > IMBAL_CRIT ? 'crit' : (sim.vibRms > IMBAL_WARN ? 'warn' : 'ok');
   const critState = nearCrit ? 'crit' : (Math.abs(marginPct) < 30 ? 'warn' : 'ok');
   const phaseState = (jointType === 'cv') ? 'ok' : (phaseErr > 45 ? 'crit' : (phaseErr > 10 ? 'warn' : 'ok'));
   const stState = (stateTxt.indexOf('Worn') >= 0 || stateTxt.indexOf('Out-of-phase') >= 0 ||
                    stateTxt.indexOf('Imbalance') >= 0 || stateTxt.indexOf('rumble') >= 0 ||
                    stateTxt.indexOf('Severe') >= 0 || stateTxt.indexOf('critical') >= 0 ||
                    stateTxt.indexOf('Near') >= 0) ? 'crit'
                 : (stateTxt.indexOf('Rough') >= 0) ? 'warn'
                 : 'ok';

   const rangeTxt = rpmLo.toFixed(0) + ' - ' + rpmHi.toFixed(0) + ' rpm';
   const typeTxt  = (jointType === 'cv') ? 'CV (constant velocity)' : 'Cardan (U-joint)';

   let tr;
   if (traceClear) { traceClear = false; traceSample = null; tr = { hist: null }; }
   else if (traceSample) { tr = { hist: traceSample }; traceSample = null; }

   return {
     big: swingPct.toFixed(1),
     unit: ' %',
     bar: clampN(swingPct / 30, 0, 1) * 100,
     rows: {
       ratio: instRatio.toFixed(3) + ' : 1',
       rpm:   rpmAvg.toFixed(0) + ' rpm'
     },
     ro: {
       ang:    [angleDeg.toFixed(1) + ' \u00B0', angState],
       rpm:    [rpmAvg.toFixed(0) + ' rpm', ''],
       range:  [rangeTxt, ''],
       swing:  ['\u00B1' + swingPct.toFixed(1) + ' %', swState],
       ratio:  [instRatio.toFixed(3) + ' : 1', ''],
       vib:    [sim.vibRms.toFixed(1) + ' mm/s', vibState],
       crit:   [critRpm.toFixed(0) + ' rpm', critState],
       margin: [marginPct.toFixed(0) + ' %', critState],
       phase:  [(jointType === 'cv') ? '\u2014 (CV)' : (phaseErr.toFixed(0) + ' \u00B0'), phaseState],
       type:   [typeTxt, ''],
       state:  [stateTxt, stState]
     },
     status: [warnText || stateTxt, true, warnText ? 'warn' : ''],
      traces: tr,
     ctl: angleDeg.toFixed(1) + ' \u00B0'
   };
  }
 };
}

/* Phase 6: every option / action lives in the dock (controls.js), nothing interactive is left in the panel.
   'Time scale' is the module's own physics time-compression (thermal warm-up); the menu's Sim speed is separate. */
CFG.options = [
  { id: "type", type: 'choice', layout: 'select', label: "Joint type", options: [{ id: "ujoint", label: "Cardan (U-joint)" }, { id: "cv", label: "Constant velocity (CV)" }], def: "ujoint",
    onChange: (id) => { S.jointType = id; /* grey out the phase slider when a CV joint is selected */
  const dim = (S.jointType === 'cv');
  controls.setDisabled('phase', dim); } },
  { id: "fault", type: 'choice', layout: 'select', label: "Fault injection", options: Object.keys(FAULT_INFO).map(id => ({ id, label: FAULT_INFO[id].label })), def: 'none',
    onChange: (id) => { S.fault = id; } },
  { id: 'timeScale', type: 'choice', layout: 'segmented', label: 'Time scale', options: [{ id: '1', label: '1×' }, { id: '5', label: '5×' }, { id: '20', label: '20×' }], def: '1',
    onChange: (id) => { S.speed = Number(id) || 1; } },
  { id: "zero", type: 'action', label: "Zero angle",
    onAction: () => { controls.set('ctl', 0); } }
];
CFG.onReset = resetAll;      /* the dock Reset runs the module reset (model + every control) */
/* Phase 7a: the old history canvas is a Monitor trace. Both series are drawn as 0..100 % of their old axis ranges. */
CFG.traces = [{ id: 'hist', label: 'Speed swing and vibration history (% of full scale)', min: 0, max: 100, length: 150,
  series: [
    { id: 'a', label: 'Swing %', color: 'var(--accent)' },
    { id: 'b', label: 'Vib mm/s', color: 'var(--warn)' }
  ] }];
runGuidedModule(CFG, build);
</script>
</body>
</html>
