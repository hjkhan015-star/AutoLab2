<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d13">
<title>Cooling System — Auto Lab</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="controls.css">
<style>
  /* ═══════════════════════════════════════════════════════════════════
     Cooling module — only the pieces that aren't part of the universal
     kit's standard chrome.
     ═══════════════════════════════════════════════════════════════════ */

  /* ── Panel readout: cooling-system flow chips ── */
  #system-flow {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin: 10px 0 4px;
  }
  .flow-chip {
    font-size: 11px;
    padding: 6px 8px;
    border-radius: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    transition: background var(--dur-fast) var(--ease-out),
                color var(--dur-fast) var(--ease-out);
  }

  /* ── Panel readout: fins note ── */
  #fins-note {
    margin-top: 11px;
    font-size: 12px;
    line-height: 1.55;
    padding: 9px 11px;
    border-radius: 9px;
    display: none;
  }
  #fins-note.fins-on {
    display: block;
    background: color-mix(in oklch, var(--accent) 12%, transparent);
    color: color-mix(in oklch, var(--accent) 82%, var(--text));
  }
  #fins-note.fins-off {
    display: block;
    background: color-mix(in oklch, var(--crit) 16%, transparent);
    color: color-mix(in oklch, var(--crit) 88%, var(--text));
  }

  /* ── Overheat screen overlay ── */
  #overheat-overlay {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 9;
    opacity: 0;
    transition: opacity .5s;
    background: radial-gradient(ellipse at center,
      transparent 42%, rgba(239,68,68,.42) 100%);
  }
  #overheat-overlay.on {
    opacity: 1;
    animation: heatPulse 1.4s infinite;
  }
  @keyframes heatPulse { 50% { opacity: .55; } }

  /* ── Alert chip ── */
  #alert-chip {
    position: fixed;
    z-index: 11;
    left: 50%;
    top: 22px;
    transform: translateX(-50%) translateY(-14px);
    background: rgba(60,10,10,.95);
    border: 1px solid rgba(239,68,68,.6);
    color: #fca5a5;
    padding: 11px 18px;
    border-radius: 12px;
    font-weight: 750;
    font-size: 13px;
    letter-spacing: .03em;
    box-shadow: 0 10px 30px rgba(239,68,68,.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s, transform .35s;
    max-width: calc(100vw - 40px);
    text-align: center;
  }
  #alert-chip.on {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── 3D callouts ── */
  .callout {
    position: fixed;
    z-index: 6;
    pointer-events: none;
    font-family: var(--font-sans);
    font-size: 11px; font-weight: 600; letter-spacing: .01em;
    padding: 3px 9px;
    border-radius: var(--r-pill);
    background: var(--surface-2);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    color: var(--text);
    white-space: nowrap;
    transform: translate(-50%,-50%);
    display: none;
  }
  html.light-theme .callout { background: var(--surface-2); }
  .callout-dot {
    position: fixed;
    z-index: 4;
    width: 6px; height: 6px;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%,-50%);
    background: currentColor;
    box-shadow: 0 0 8px currentColor;
    display: none;
  }
  .callout-line {
    position: fixed;
    z-index: 4;
    height: 1px;
    pointer-events: none;
    transform-origin: 0 50%;
    background: currentColor;
    opacity: .55;
    display: none;
  }

  /* ── Legend ── */
  #legend {
    position: fixed;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    left: calc(14px + env(safe-area-inset-left, 0px));
    z-index: 8;
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: var(--shadow-sm);
    font-size: 10.5px;
    color: var(--text-dim);
    pointer-events: none;
  }
  .legend-row {
    display: flex; align-items: center; gap: 7px;
  }
  .legend-row .sw {
    width: 10px; height: 10px;
    border-radius: 3px;
    flex: 0 0 auto;
  }
  body.embedded #legend {
    bottom: calc(80px + env(safe-area-inset-bottom, 0px));
    left: 12px;
  }
  @media (max-width: 700px) {
    body.embedded #legend { display: none; }
  }

  
  .callout { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-color: color-mix(in oklch, var(--c, currentColor) 42%, var(--border)); }
  .callout::before { content:''; display:inline-block; width:6px; height:6px; border-radius:50%;
    background: var(--c, currentColor); box-shadow: 0 0 6px var(--c, currentColor); margin-right:6px; vertical-align:1px; }
  #legend { min-width: 172px; }
  .legend-grad { height:5px; border-radius:3px; margin-top:3px; background: linear-gradient(90deg,#3aa8f0,#ffc24d,#ff3f1c); }
  .legend-ends { display:flex; justify-content:space-between; font-size:9.5px; opacity:.8; }
    @keyframes finWarn {
    50% { box-shadow: 0 0 16px color-mix(in oklch, var(--crit) 45%, transparent); }
  }

</style>

<script type="module">
import * as THREE from 'three';

/* ═══════════════════════════════════════════════════════════════════════
   SCENE SETUP
   ═══════════════════════════════════════════════════════════════════════ */

const { scene, camera, renderer, controls, wrap, baseFov, quality, viewManager } = Base.buildScene({
  camPos: isPortrait ? [7.0, 4.5, 9.0] : [8.5, 5.5, 11.0],

  floorY: -2.35,
  fov: 42
});

controls.maxDistance = 32;

renderer.toneMappingExposure = 1.12;

const floor = scene.children.find(c => c.userData.__isFloor);
if (floor) floor.scale.set(1.8, 1.8, 1.8);

/* Custom lights for cooling module */
const cyanLight = new THREE.PointLight(0x38bdf8, 20, 15, 2);
cyanLight.position.set(-5, 2.8, 4.0); scene.add(cyanLight);
const warmLight = new THREE.PointLight(0xff6a2b, 0, 10, 2);
warmLight.position.set(0, 1.0, 0); scene.add(warmLight);

const particleTex = Base.createParticleTexture();

/* ═══════════════════════════════════════════════════════════════════════
   SCENE GEOMETRY
   ═══════════════════════════════════════════════════════════════════════ */
const metal     = new THREE.MeshStandardMaterial({color:0x596575, roughness:.42, metalness:.72});
const darkMetal = new THREE.MeshStandardMaterial({color:0x252c35, roughness:.48, metalness:.70});
const black     = new THREE.MeshStandardMaterial({color:0x11161d, roughness:.72, metalness:.25});
const blueMat   = new THREE.MeshStandardMaterial({color:0x147bb8, roughness:.30, metalness:.45});
const redMat    = new THREE.MeshStandardMaterial({color:0xa62c28, roughness:.40, metalness:.30});
const copper    = new THREE.MeshStandardMaterial({color:0xc58a35, roughness:.35, metalness:.70});
const white     = new THREE.MeshStandardMaterial({color:0xd9e2eb, roughness:.30, metalness:.50});
const linerMat  = new THREE.MeshStandardMaterial({color:0x2a3038, roughness:.38, metalness:.88});
const pistonMat = new THREE.MeshStandardMaterial({color:0xc8d0da, roughness:.24, metalness:.92});

const barrelBaseColor = new THREE.Color(0xc2cad6);
const headBaseColor   = new THREE.Color(0x9aa2ae);
const finBaseColor    = new THREE.Color(0xd2dae6);
const barrelHotColor  = new THREE.Color(0x7a2410);
const headHotColor    = new THREE.Color(0x5e1a0c);
const finHotColor     = new THREE.Color(0x8a2c14);

const barrelMat = new THREE.MeshStandardMaterial({
  color: barrelBaseColor.clone(), roughness:.38, metalness:.80,

const headMat = new THREE.MeshStandardMaterial({

const radiatorFrameMat = new THREE.MeshStandardMaterial({color:0x22282f, metalness:.68, roughness:.44});

const serpentineMat    = new THREE.MeshPhysicalMaterial({
  color: 0xc08b3a, metalness: 0.90, roughness: 0.28,

});
const radiatorTankMat  = new THREE.MeshStandardMaterial({color:0x1a1f25, metalness:.16, roughness:.62});
const hoseMat          = new THREE.MeshStandardMaterial({
  color:0x14181c, metalness:.06, roughness:.84,
  transparent:true, opacity:0.66, depthWrite:false
});
const clampMat         = new THREE.MeshStandardMaterial({color:0x8d949b, metalness:.92, roughness:.26});
const shroudMat        = new THREE.MeshStandardMaterial({
  color:0x171b21, metalness:.20, roughness:.70, side:THREE.DoubleSide
});
const fanBladeMat      = new THREE.MeshStandardMaterial({
  color:0xcfd8e2, metalness:.55, roughness:.36, side:THREE.DoubleSide
});

const jacketMat = new THREE.MeshPhysicalMaterial({
  color:0x2b93bf, transparent:true, opacity:.11, roughness:.18, metalness:.10,
  transmission:0.20, side:THREE.DoubleSide, depthWrite:false
});
const blockMat = new THREE.MeshPhysicalMaterial({
  color:0x3a4555, metalness:.55, roughness:.55,
  transparent:true, opacity:.30, depthWrite:false, side:THREE.DoubleSide
});

const system = new THREE.Group();
scene.add(system);

function box(w,h,d,mat,x,y,z,parent=system){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
function cyl(r,h,mat,x,y,z,seg=32,parent=system){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg), mat);
  m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
function tube(a,b,r,mat,parent=system){
  const va = new THREE.Vector3(...a), vb = new THREE.Vector3(...b);
  const dir = new THREE.Vector3().subVectors(vb, va);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,dir.length(),20), mat);
  m.position.copy(va).add(vb).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  m.castShadow = true; parent.add(m); return m;
}
function roundedBox(w,h,d,r,mat,parent){
  const s = new THREE.Shape();
  const x = -w/2, y = -h/2;
  s.moveTo(x+r, y);
  s.lineTo(x+w-r, y);  s.quadraticCurveTo(x+w, y,     x+w, y+r);
  s.lineTo(x+w, y+h-r);s.quadraticCurveTo(x+w, y+h,   x+w-r, y+h);
  s.lineTo(x+r, y+h);  s.quadraticCurveTo(x,   y+h,   x,   y+h-r);
  s.lineTo(x, y+r);    s.quadraticCurveTo(x,   y,     x+r, y);
  const geo = new THREE.ExtrudeGeometry(s, {
    depth: d, bevelEnabled: true, bevelThickness: 0.012,
    bevelSize: 0.012, bevelSegments: 2, curveSegments: 6
  });
  geo.translate(0, 0, -d/2);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

function makeFormedCurve(points, bendRadius) {
  const pts = points.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const n = pts.length;
  const trims = new Array(n).fill(0);
  for (let i = 1; i < n - 1; i++) {
    const d1 = new THREE.Vector3().subVectors(pts[i], pts[i - 1]).normalize();
    const d2 = new THREE.Vector3().subVectors(pts[i + 1], pts[i]).normalize();
    const ang = Math.acos(THREE.MathUtils.clamp(d1.dot(d2), -1, 1));
    const raw = bendRadius * Math.tan(ang / 2);
    trims[i] = Math.min(raw,
                        pts[i].distanceTo(pts[i - 1]) * 0.45,
                        pts[i].distanceTo(pts[i + 1]) * 0.45);
  }
  const path = new THREE.CurvePath();
  for (let i = 0; i < n - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const dir = new THREE.Vector3().subVectors(b, a).normalize();
    const len = a.distanceTo(b);
    const t0 = i === 0 ? 0 : trims[i];
    const t1 = i === n - 2 ? len : len - trims[i + 1];
    const p0 = a.clone().addScaledVector(dir, t0);
    const p1 = a.clone().addScaledVector(dir, t1);
    if (p0.distanceTo(p1) > 1e-5) path.add(new THREE.LineCurve3(p0, p1));
    if (i < n - 2) {
      const nextDir = new THREE.Vector3().subVectors(pts[i + 2], b).normalize();
      const c0 = b.clone().addScaledVector(dir, -trims[i + 1]);
      const c1 = b.clone().addScaledVector(nextDir, trims[i + 1]);
      path.add(new THREE.QuadraticBezierCurve3(c0, b, c1));
    }
  }
  return path;
}

function curveToPolyline(curve, n) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const p = curve.getPoint(i / n);
    if (!p) continue;
    out.push([p.x, p.y, p.z]);
  }
  return out;
}

/* ═══════════════════════════════════════════════════════════════════════
   AIR-MODE ENGINE
   ═══════════════════════════════════════════════════════════════════════ */
const engine = new THREE.Group(); system.add(engine);
box(3.0, 1.15, 2.0, darkMetal, 0, -.85, 0, engine);
box(2.5, .42, 1.55, black, 0, -1.22, 0, engine);

const barrel = new THREE.Mesh(new THREE.CylinderGeometry(.78, .84, 2.05, 40), barrelMat);
barrel.position.y = .9; barrel.castShadow = true; barrel.receiveShadow = true; engine.add(barrel);

const head = new THREE.Mesh(new THREE.CylinderGeometry(.95, .95, .42, 36), headMat);
head.position.y = 2.13; head.castShadow = true; engine.add(head);

cyl(.07, .30, white, 0, 2.47, 0, 12, engine);
cyl(.045, .14, copper, 0, 2.65, 0, 10, engine);

tube([.6,1.3,-.5],[1.9,.72,-1.05], .13, redMat, engine);
box(1.05, .34, .36, metal, 2.7, .66, -1.22, engine);
tube([-.6,1.65,-.35],[-1.9,2.0,-.62], .15, blueMat, engine);

const fins = new THREE.Group(); engine.add(fins);
const finCount = 11;
const finSpacing = 0.175;
const finBaseY = 0.10;
const FIN_MULTIPLIER = 3.2;

for (let i = 0; i < finCount; i++) {
  const f = new THREE.Mesh(
    new THREE.CylinderGeometry(1.18, 1.18, 0.05, isLowEnd ? 24 : 48, 1, false), finMat);
  f.position.y = finBaseY + i * finSpacing;
  f.castShadow = true; f.receiveShadow = true;
  fins.add(f);
  const edge = new THREE.Mesh(new THREE.TorusGeometry(1.18, 0.012, 6, isLowEnd ? 24 : 48), darkMetal);
  edge.rotation.x = Math.PI / 2; edge.position.y = f.position.y; fins.add(edge);
}
for (let i = 0; i < 3; i++) {
  const f = new THREE.Mesh(new THREE.CylinderGeometry(1.10, 1.10, 0.045, 40), finMat);
  f.position.y = 1.99 + i * 0.155; f.castShadow = true; fins.add(f);
  const edge = new THREE.Mesh(new THREE.TorusGeometry(1.10, 0.010, 6, 40), darkMetal);
  edge.rotation.x = Math.PI / 2; edge.position.y = f.position.y; fins.add(edge);
}

/* ═══════════════════════════════════════════════════════════════════════
   RADIATOR MODE — engine cutaway
   ═══════════════════════════════════════════════════════════════════════ */
const radSys = new THREE.Group(); system.add(radSys);
radSys.visible = false;

const linerXs = [-1.2, -0.4, 0.4, 1.2];
const multiEngine = new THREE.Group();
radSys.add(multiEngine);

const blockMesh = new THREE.Mesh(new THREE.BoxGeometry(3.7, 1.5, 1.2), blockMat);
blockMesh.position.y = 0.25;
multiEngine.add(blockMesh);

const headBlock = new THREE.Mesh(new THREE.BoxGeometry(3.7, 0.35, 1.2), headMat);
headBlock.position.y = 1.175;
headBlock.castShadow = true;
multiEngine.add(headBlock);

const valveCover = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.20, 1.0), darkMetal);
valveCover.position.y = 1.45;
valveCover.castShadow = true;
multiEngine.add(valveCover);

const oilPan = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.4, 1.3), black);
oilPan.position.y = -0.65;
oilPan.castShadow = true;
multiEngine.add(oilPan);

const crank = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.10, 3.4, 16), darkMetal);
crank.rotation.z = Math.PI / 2;
crank.position.y = -0.42;
multiEngine.add(crank);

const pistons = [];
for (const x of linerXs) {
  const liner = new THREE.Mesh(
    new THREE.CylinderGeometry(0.32, 0.32, 1.4, isLowEnd ? 16 : 24, 1, true), linerMat);
  liner.position.set(x, 0.2, 0);
  multiEngine.add(liner);

  const jacket = new THREE.Mesh(
    new THREE.CylinderGeometry(0.52, 0.52, 1.35, isLowEnd ? 16 : 24, 1, true), jacketMat);
  jacket.position.set(x, 0.2, 0);
  multiEngine.add(jacket);

  [1, -1].forEach(dir => {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(0.52, 0.018, 8, 24), jacketMat);
    ring.rotation.x = Math.PI / 2;
    ring.position.set(x, 0.2 + dir * 0.675, 0);
    multiEngine.add(ring);
  });

  const piston = new THREE.Mesh(
    new THREE.CylinderGeometry(0.29, 0.29, 0.35, 20), pistonMat);
  piston.position.set(x, 0.2, 0);
  multiEngine.add(piston);
  pistons.push(piston);

  const plug = new THREE.Mesh(
    new THREE.CylinderGeometry(0.06, 0.06, 0.25, 10), white);
  plug.position.set(x, 1.55, 0);
  multiEngine.add(plug);
  const tip = new THREE.Mesh(
    new THREE.CylinderGeometry(0.035, 0.035, 0.10, 8), copper);
  tip.position.set(x, 1.70, 0);
  multiEngine.add(tip);
}

const intakeMf = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.20, 0.24), blueMat);
intakeMf.position.set(0, 0.85, -0.72);
multiEngine.add(intakeMf);
for (const x of linerXs) {
  const r = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.4), blueMat);
  r.position.set(x, 0.72, -0.55);
  r.rotation.x = Math.PI / 4;
  multiEngine.add(r);
}

const exhaustMf = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.20, 0.24), redMat);
exhaustMf.position.set(0, 0.55, 0.72);
multiEngine.add(exhaustMf);
for (const x of linerXs) {
  const r = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.4), redMat);
  r.position.set(x, 0.68, 0.55);
  r.rotation.x = -Math.PI / 4;
  multiEngine.add(r);
}

const pumpBody = cyl(.34, .36, metal, -1.75, -.5, .62, 24, radSys);
pumpBody.rotation.x = Math.PI / 2;
const pumpPulley = cyl(.22, .09, darkMetal, -1.75, -.5, .88, 20, radSys);
pumpPulley.rotation.x = Math.PI / 2;
const impeller = new THREE.Mesh(new THREE.TorusGeometry(.14, .025, 6, 16), copper);
impeller.rotation.x = Math.PI / 2; impeller.position.set(-1.75, -.5, .62);
radSys.add(impeller);

const thermoHousing = cyl(.19, .30, copper, -1.40, 1.62, 0.42, 18, radSys);
thermoHousing.rotation.z = Math.PI / 2;
const thermoNeck = cyl(.125, .22, copper, -1.40, 1.72, 0.42, 16, radSys);
thermoNeck.rotation.z = Math.PI / 2;

/* ═══════════════════════════════════════════════════════════════════════
   RADIATOR
   ═══════════════════════════════════════════════════════════════════════ */
const RAD_CX = 0;
const RAD_CY = 0.20;
const RAD_CZ = 3.40;

const radiator = new THREE.Group();
radiator.position.set(RAD_CX, RAD_CY, RAD_CZ);
radiator.rotation.y = 0.06;
radSys.add(radiator);

const CORE_H = 2.62;
const CORE_D = 0.40;

const FIN_N = isLowEnd ? 46 : 76;
const finGeoInstance = new THREE.BoxGeometry(0.011, CORE_H, 0.32);
const finInstanced = new THREE.InstancedMesh(finGeoInstance, radiatorFinMat, FIN_N);
finInstanced.castShadow = true;
finInstanced.receiveShadow = true;
{
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const s = new THREE.Vector3(1, 1, 1);
  for (let i = 0; i < FIN_N; i++) {
    const x = -0.98 + (i / (FIN_N - 1)) * 1.96;
    m.compose(new THREE.Vector3(x, 0, 0.08), q, s);
    finInstanced.setMatrixAt(i, m);
  }
  finInstanced.instanceMatrix.needsUpdate = true;
}

const _pv = new THREE.Vector3();
function polylineSampler(ptsArr, h0, h1) {
  const pts = ptsArr.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const n = pts.length - 1;
  const seg = new Array(n);
  let total = 0;
  for (let i = 0; i < n; i++) { seg[i] = pts[i].distanceTo(pts[i + 1]); total += seg[i]; }
  return function (t) {
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    let d = t * total, i = 0;
    while (i < n - 1 && d > seg[i]) { d -= seg[i]; i++; }
    const u = seg[i] > 0 ? d / seg[i] : 0;
    _pv.lerpVectors(pts[i], pts[i + 1], u);
    return { pos: _pv, h: h0 + (h1 - h0) * t };
  };
}

  document.getElementById('legend').innerHTML = LEG[state.mode].map(([c, t]) =>
    `<div class="legend-row"><span class="sw" style="background:${c}"></span>${t}</div>`).join('') +
    '<div class="legend-grad"></div><div class="legend-ends"><span>Cool</span><span>Hot</span></div>';
}

let _thSt = '';
function updateExtras(s) {
  const se = Math.max(0, s);
  fanBlur.material.opacity = clamp01((2.5 + 14 * se) / 16.5) * 0.2;
  if (state.mode !== 'radiator') return;
  const jk = clamp01((state.temp - 62) / 32);
  jacketMat.color.lerpColors(C_JKT_COOL, C_JKT_HOT, jk);
  jacketMat.opacity = 0.11 + 0.08 * jk;

  const open = clamp01((state.temp - 80) / 9);
  thermoRing.material.color.lerpColors(C_TH_CLOSED, C_TH_OPEN, open);
  thermoRing.material.emissive.copy(thermoRing.material.color);
  const st = open < 0.05 ? 'Closed' : open < 0.95 ? 'Opening' : 'Open';
  if (st !== _thSt) { _thSt = st; ui.monitor.update({ rows: { surface: [st, open < 0.05 ? 'warn' : 'ok'] } }); }

  for (let i = 0; i < flashes.length; i++) {
    const f = Math.pow(Math.max(0, Math.sin(state.time * 3 + i * Math.PI / 2)), 14);
    flashes[i].material.opacity = f * 0.9 * (0.4 + 0.6 * Math.min(1, se));
  }

  const frac = 0.35 + 0.25 * clamp01((state.temp - 60) / 35);
  const lh = (RES.h - 0.1) * frac;
  resLiquid.scale.y = lh;
  resLiquid.position.y = RES.y - RES.h / 2 + 0.04 + lh / 2;
  resLiquid.material.color.lerpColors(C_RES_COOL, C_RES_HOT, clamp01((state.temp - 70) / 25));
}

}

/* ═══════════════════════════════════════════════════════════════════════
   PHYSICS
   ═══════════════════════════════════════════════════════════════════════ */
function targetTemp() {
  const sp = engLevel();
  if (state.mode === 'radiator') return 87 + Math.max(0, sp - 1) * 2.5;
  const load = 24 + 36 * sp;
  const ram  = 1.6 * sp * (state.fins ? 1.0 : 0.33);
  return Math.min(135, 30 + load / Math.max(0.05, ram));
}

const _col = new THREE.Color();

function updateRadiatorCoolant(dt) {
  const pump = 0.45 + 0.85 * engLevel();
  flowTex.offset.x -= dt * 0.9 * pump;
  const posAttr = coolantGeo.attributes.position;
  const colAttr = coolantGeo.attributes.color;

  for (let i = 0; i < coolant.length; i++) {
    const p = coolant[i];
    p.t += dt * STAGE_RATE[p.stage] * pump * p.speed;

    let guard = 0;
    while (p.t >= 1 && guard++ < 4) {
      p.t -= 1;
      p.stage = (p.stage + 1) & 3;
    }
    if (p.t >= 1) p.t = 0;

    let r;
    if (p.stage === 0)      r = stageJacket(p.t);
    else if (p.stage === 1) r = stageUpper(p.t);
    else if (p.stage === 2) r = stageSerp(p.t);
    else                    r = stageReturn(p.t);

    posAttr.setXYZ(i,
      r.pos.x + Math.sin(state.time * 38 + p.ph) * 0.015,
      r.pos.y + Math.cos(state.time * 31 + p.ph * 1.3) * 0.015,
      r.pos.z + Math.cos(state.time * 34 + p.ph) * 0.015
    );

    heatColor(r.h, _col);
    colAttr.setXYZ(i, _col.r, _col.g, _col.b);
  }
  posAttr.needsUpdate = true;
  colAttr.needsUpdate = true;
}

function updateRadiatorAir(dt) {
  const flow = 0.55 + 1.2 * engLevel();
  for (let i = 0; i < AIR_STREAKS; i++) {
    const d = airData[i];
    d.z -= dt * d.speed * flow;
    if (d.z < AIR_BACK) {
      d.z = AIR_FRONT - Math.random() * 0.9;
      d.x = RAD_CX + (Math.random() - 0.5) * 1.95;
      d.y = RAD_CY + (Math.random() - 0.5) * 2.6;
    }
    const X = d.x, Y = d.y;
    const i6 = i * 6;
    airPositions[i6]     = X; airPositions[i6 + 1] = Y; airPositions[i6 + 2] = d.z;
    airPositions[i6 + 3] = X; airPositions[i6 + 4] = Y; airPositions[i6 + 5] = d.z - 0.32;
  }
  airGeo.attributes.position.needsUpdate = true;
  airLines.material.opacity = 0.12 + 0.22 * Math.min(1, engLevel());
}

function updateRadiatorHeat() {
  const h = THREE.MathUtils.clamp((state.temp - 65) / 30, 0, 1);
  heatOverlay.material.opacity = 0.04 + h * 0.26;
}

function updateSim(dt) {
  const s = engLevel();
  state.temp += (targetTemp() - state.temp) * Math.min(1, dt * 0.35);

  const pulse = 1 + 0.08 * Math.sin(state.time * 6);
  const heat    = THREE.MathUtils.clamp((state.temp - 85) / 35, 0, 1);
  const finHeat = heat * 0.6;

  barrelMat.color.copy(barrelBaseColor).lerp(barrelHotColor, heat);
  headMat.color.copy(headBaseColor).lerp(headHotColor, heat);
  finMat.color.copy(finBaseColor).lerp(finHotColor, finHeat);

  barrelMat.emissiveIntensity = heat * 0.22 * pulse;
  headMat.emissiveIntensity   = heat * 0.14 * pulse;
  finMat.emissiveIntensity    = (state.mode === 'air' && state.fins)
                                  ? finHeat * 0.18 * pulse : 0.0;

  warmLight.intensity = heat * 16 * pulse;

  if (state.mode === 'radiator' && state.playing) {
    for (let i = 0; i < pistons.length; i++) {
      const phase = state.time * 3 + i * Math.PI / 2;
      pistons[i].position.y = 0.2 + Math.sin(phase) * 0.28;
    }
  }

  radFan.spinner.rotation.z -= dt * (2.5 + 14 * s);
  updateExtras(s);

  if (state.mode === 'air') {
    const airStrength = Math.min(1, 0.15 + 0.85 * s);
    const finPickup   = state.fins ? 1.0 : 0.42;
    const posAttr = airflowGeo.attributes.position;
    const colAttr = airflowGeo.attributes.color;
    const tmpC = new THREE.Color();

    for (let i = 0; i < airflow.length; i++) {
      const p = airflow[i];
      p.t = (p.t + dt * (0.04 + 0.20 * s)) % 1;
      const x = -3.6 + p.t * 8.0;
      const hIn  = THREE.MathUtils.clamp((x + 1.35) / 1.9, 0, 1);
      const hOut = THREE.MathUtils.clamp((1.60 - x) / 1.4, 0, 1);
      const heatCurve = Math.min(hIn, hOut);
      const airHeat = heatCurve * p.heatMax * finPickup * (0.3 + 0.7 * heat);
      const rise = Math.max(0, x - 1.1) * 0.34 * airHeat;

      posAttr.setXYZ(i,
        x + Math.sin(state.time * 2.2 + p.ph) * 0.05,
        p.y0 + rise,
        p.z0 + Math.sin(p.ph * 3.1) * 0.13 * airHeat
      );

      if (airHeat < 0.5) tmpC.copy(C_AIR).lerp(C_AIRMID, airHeat * 2);
      else               tmpC.copy(C_AIRMID).lerp(C_AIRHOT, (airHeat - 0.5) * 2);

      const op = Math.min(1, p.t * 7) * Math.min(1, (1 - p.t) * 4) * airStrength;
      colAttr.setXYZ(i, tmpC.r * op, tmpC.g * op, tmpC.b * op);
    }
    posAttr.needsUpdate = true;
    colAttr.needsUpdate = true;
    airflowPoints.visible = true;

    const hf    = THREE.MathUtils.clamp((state.temp - 85) / 30, 0, 1);
    const smoke = THREE.MathUtils.clamp((state.temp - 110) / 22, 0, 1);
    const sPos = shimmerGeo.attributes.position;
    const sCol = shimmerGeo.attributes.color;
    const smC = new THREE.Color();

    for (let i = 0; i < shimmer.length; i++) {
      const p = shimmer[i];
      if (i > shimmer.length * hf) {
        sPos.setXYZ(i, 0, -999, 0);
        continue;
      }
      p.t = (p.t + dt * 0.32) % 1;
      sPos.setXYZ(i,
        p.x0 + Math.sin(p.t * 5 + p.ph) * 0.16 + p.t * 0.55,
        2.42 + p.t * 1.75,
        p.z0 + Math.cos(p.t * 4 + p.ph) * 0.14
      );
      smC.copy(C_SHIMMER).lerp(C_SMOKE, smoke);
      const op = (1 - p.t);
      sCol.setXYZ(i, smC.r * op, smC.g * op, smC.b * op);
    }
    sPos.needsUpdate = true;
    sCol.needsUpdate = true;
    shimmerPoints.visible = true;

    coolantPoints.visible = false;
    airLines.visible = false;

    for (const p of streaks) {
      p.t = (p.t + dt * (0.18 + 0.5 * s)) % 1;
      p.m.position.x = -7.5 + p.t * 15;
      p.m.material.opacity =
        Math.min(1, p.t * 6) * Math.min(1, (1 - p.t) * 6) *
        Math.min(1, 0.4 + 0.6 * s) * 0.42;
    }

  } else {
    airflowPoints.visible = false;
    shimmerPoints.visible = false;
    airLines.visible = true;

    updateRadiatorCoolant(dt);
    updateRadiatorAir(dt);
    updateRadiatorHeat();
  }
}

function updateTempCard() {
  const t = state.temp + Math.sin(state.time * 1.4) * 1.6;

  let c, label, tone = '';
  if (t < 88) { c = '#38bdf8'; label = 'Normal operating range'; }
  else if (t < 100) { c = '#fbbf24'; label = 'Running warm'; tone = 'warn'; }
  else {
    c = '#f87171';
    tone = 'crit';
    if (state.mode === 'radiator') label = 'OVERHEATING — check coolant';
    else label = state.fins ? 'OVERHEATING — raise speed' : 'OVERHEATING — refit fins';
  }

  ui.monitor.update({
    value: { text: String(Math.round(t)), unit: '°C', color: c, bar: THREE.MathUtils.clamp((t - 45) / 75 * 100, 4, 100), barColor: c },
    status: [label, false, tone]
  });

  const isOverheat = t > 105;
  overheat.classList.toggle('on', isOverheat);
  alertChip.classList.toggle('on', isOverheat);
  if (isOverheat) {
    if (state.mode === 'radiator') alertChip.textContent = '⚠ OVERHEATING — CHECK COOLANT';
    else alertChip.textContent = state.fins
      ? '⚠ OVERHEATING — RAISE ENGINE SPEED'
      : '⚠ OVERHEATING — REFIT THE FINS';
  }

  /* 7b2: the temperature graph is the Monitor trace 'temp' (same samples: one per update while playing; 55–125 °C fixed range) */
  if (state.playing) ui.monitor.update({ traces: { temp: THREE.MathUtils.clamp(state.temp, 55, 125) } });
}

const _proj = new THREE.Vector3();
function projectLabels() {
  if (state.frame % 2 !== 0) return;
  for (const co of callouts) {
    _proj.copy(co.anchor).project(camera);
    const _dens = window.__autolabDensity ?? 2;
    const _tier = co.tier ?? (callouts.indexOf(co) < Math.ceil(callouts.length / 2) ? 1 : 2);
    const visible = state.showLabels && _dens >= _tier && co.modes.includes(state.mode) && _proj.z < 1;
    const d = visible ? 'block' : 'none';
    co.label.style.display = d;
    co.dot.style.display = d;
    co.line.style.display = d;
    if (!visible) continue;

    const ax = (_proj.x * .5 + .5) * innerWidth;
    const ay = (-_proj.y * .5 + .5) * innerHeight;
    const lx = ax + co.offset[0];
    const ly = ay + co.offset[1];

    co.dot.style.left = ax + 'px';
    co.dot.style.top  = ay + 'px';
    co.label.style.left = lx + 'px';
    co.label.style.top  = ly + 'px';

    const dx = lx - ax, dy = ly - ay;
    co.line.style.left = ax + 'px';
    co.line.style.top  = ay + 'px';
    co.line.style.width = Math.hypot(dx, dy).toFixed(1) + 'px';
    co.line.style.transform = `rotate(${Math.atan2(dy, dx)}rad)`;
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   RENDER LOOP
   ═══════════════════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  state.frame++;
  const dt = Math.min(clock.getDelta(), .05);

  if (camGoal) {
    const k = 1 - Math.exp(-dt * 2.6);
    camera.position.lerp(camGoal.pos, k);
    controls.target.lerp(camGoal.target, k);
    if (camera.position.distanceTo(camGoal.pos) < 0.06) camGoal = null;
  }

  if (state.playing) {
    state.time += dt * state.speedMul;
    updateSim(dt);
  } else {
    const heat = THREE.MathUtils.clamp((state.temp - 85) / 35, 0, 1);
    const finHeat = heat * 0.6;
    barrelMat.color.copy(barrelBaseColor).lerp(barrelHotColor, heat);
    headMat.color.copy(headBaseColor).lerp(headHotColor, heat);
    finMat.color.copy(finBaseColor).lerp(finHotColor, finHeat);
    barrelMat.emissiveIntensity = heat * 0.22;
    headMat.emissiveIntensity   = heat * 0.14;
    finMat.emissiveIntensity    = (state.mode === 'air' && state.fins) ? finHeat * 0.18 : 0.0;
    warmLight.intensity = heat * 16;
    radFan.spinner.rotation.z -= dt * (2.5 + 14 * engLevel());
  }

  const now = performance.now() * 0.001;
  cyanLight.intensity = 18 + Math.sin(now * 1.3) * 4;

  updateTempCard();
  projectLabels();
  controls.update();
  renderer.render(scene, camera);
}

rebuildMode();
updateReadout();
Base.attachResize(camera, renderer, wrap, baseFov);
animate();
</script>
</body>
