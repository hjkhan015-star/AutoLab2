<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vehicle Lighting — Auto Lab</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="components.css">
<style>
:root { --al-accent: #fde047; }
html.light-theme { --al-accent: color-mix(in oklch, #fde047 68%, black); }
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<div id="labels-root"></div>

<script src="guard.js"></script>
  <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import { runGuidedModule } from './components.js';

/* ── CONFIG (module content) ─────────────────────────────────────── */
const CFG = {"moduleId": "lighting", "title": "Vehicle Lighting", "kicker": "Electrical & Starting", "accent": "#fde047", "badge": "Reflector headlamp", "camPos": [1.6, 2.4, 8.4], "target": [0.4, 0, 0], "floorY": -1.9, "ctl": {"label": "Light switch", "val": 45, "caption": "Off · Low · High"}, "chipLabel": "Lamp power", "rows": [["mode", "Mode"], ["range", "Reach"]], "ro": [["mode", "Switch position"], ["pw", "Lamp power"], ["cur", "Circuit current"], ["range", "Beam reach"], ["relay", "Relay"]], "legend": [["#fde047", "Beam / filament"], ["#ef4444", "Live wire"], ["#e5e7eb", "Reflector"]], "overview": "<div class=\"al-sec\"><h4>Optics<\/h4><p>A filament sits at the focus of a parabolic reflector. Light from the filament is collected and turned into a controlled beam; the lens or projector shapes the cut-off so oncoming drivers are not dazzled.<\/p><\/div><div class=\"al-sec\"><h4>Low vs high beam<\/h4><ul><li><b>Low beam<\/b> – tilted down with a sharp cut-off (about 40 m).<\/li><li><b>High beam<\/b> – full-power, level beam (100 m+).<\/li><li>LED and HID lamps produce more light per watt than halogen.<\/li><\/ul><\/div><div class=\"al-sec\"><h4>Circuit<\/h4><p>The dashboard switch only controls a small relay coil. The relay switches the heavy lamp current straight from the battery through a fuse – so thin switch wires stay cool.<\/p><\/div>", "faults": [["Blown bulb or fuse", "One or both lamps dark.", "Check fuse first; measure voltage at the lamp connector."], ["Corroded ground", "Dim lamps, flicker, warm connectors.", "Measure voltage drop on the ground side (should be under 0.2 V)."], ["Misaimed headlamps", "Poor range or dazzle.", "Adjust with the aiming screws against a wall at 10 m."]], "quiz": [["Why use a relay for headlamps?", ["Switch heavy current without thick dash wiring", "Make light brighter", "Save the fuse"], 0, "The switch carries only coil current; the relay carries the lamp current."], ["A parabolic reflector places the filament…", ["At the focus", "At the rim", "Outside the lamp"], 0, "Light from the focus reflects out as a parallel beam."], ["Dim lamps and warm connectors usually mean…", ["High resistance in the circuit", "Too much voltage", "Wrong colour bulb"], 0, "Corrosion or loose terminals add resistance and drop voltage."]]};

/* ── MODULE SCENE (per-module 3D parts) ──────────────────────────── */
function build(H){
 const {box,cyl,cylX,mat,glass,glow,pipe,stream,lc,clamp,root,THREE}=H;
 const chrome=new THREE.MeshStandardMaterial({color:0xdbe4ee,metalness:1,roughness:.15,side:THREE.DoubleSide});
 const refl=new THREE.Mesh(new THREE.SphereGeometry(1.2,40,20,0,Math.PI*2,0,Math.PI/2),chrome); refl.position.set(-1.4,0,0); refl.rotation.z=Math.PI/2; root.add(refl);
 cylX(1.2,1.2,.07,glass(0xbfdbfe,.18),-1.35,0,0);
 cylX(.16,.16,.7,glass(0xe2e8f0,.3),-1.9,0,0);
 const fil=mat(0xfff2b0,0,.5,{emissive:0xffe08a,emissiveIntensity:0}); cylX(.035,.035,.45,fil,-1.9,0,0);
 function beam(len,r,tilt,col){ const g=new THREE.Group(); g.position.set(-1.3,0,0); g.rotation.z=tilt; root.add(g);
   const m=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending});
   const o=cyl(.2,r,len,m,len/2,0,0,g,28,true); o.rotation.z=Math.PI/2; o.castShadow=false; return m; }
 const lowM=beam(4.6,1.5,-.14,0xfff1b8), highM=beam(7.0,1.8,0,0xdbeafe);
 box(1.0,.5,.7,mat(0x2563eb,.4,.6),3.3,-1.1,0); cyl(.07,.07,.15,mat(0xef4444,.4,.5),3.05,-.78,0); cyl(.07,.07,.15,mat(0x111827,.4,.5),3.55,-.78,0);
 box(.32,.32,.32,mat(0xfbbf24,.3,.6),2.3,-.1,0);
 const relayM=mat(0x1f2937,.3,.6,{emissive:0x22c55e,emissiveIntensity:0}); box(.6,.6,.6,relayM,1.2,.6,0);
 const stalk=box(.9,.12,.2,mat(0x9ca3af,.5,.5),4.3,.4,0);
 box(.7,.5,.5,mat(0x374151,.4,.6),4.3,.2,0);
 const path=[[3.3,-.75,0],[2.3,-.75,0],[2.3,.1,0],[1.2,.6,0],[-.3,.5,0],[-1.6,.15,0],[-1.9,.05,0]];
 pipe(path,.04,mat(0xef4444,.3,.6));
 const cur=stream(path,16,0xfde047,.1);
 let I=0;
 return {
  labels:[['Reflector',[-2.3,1.05,0]],['Filament',[-1.9,.3,0]],['Lens',[-1.3,1.3,0]],['Battery',[3.3,-1.6,0]],['Fuse',[2.3,.3,0]],['Relay',[1.2,1.1,0]],['Switch',[4.3,.9,0]]],
  update(c){
   const k=c.k, mode=k<.12?0:k<.6?1:2, tgt=mode===0?0:mode===1?55:60;
   I+=(tgt-I)*Math.min(1,c.dt*6+.02);
   const it=I/60; fil.emissiveIntensity=it*2.2; relayM.emissiveIntensity=mode?1.2:0;
   lowM.opacity=mode===1?.2:0; highM.opacity=mode===2?.17:0; if(mode===0&&I<1){ lowM.opacity=0; highM.opacity=0; }
   stalk.rotation.z=mode===0?0:mode===1?-.35:.35;
   cur.update(c.t,.16,I>1?1:0);
   const name=['OFF','LOW BEAM','HIGH BEAM'][mode], cA=I/13.8;
   return {big:I.toFixed(0),unit:' W',bar:I/60*100,rows:{mode:name,range:mode===0?'—':mode===1?'~40 m':'~100 m'},
    ro:{mode:[name,'hi'],pw:[I.toFixed(0)+' W',''],cur:[cA.toFixed(1)+' A',''],range:[mode===0?'—':mode===1?'40 m':'100 m+',''],relay:[mode?'Energised':'Off',mode?'ok':'']},
    status:[name,mode>0],ctl:name};
  }};
}

runGuidedModule(CFG, build);
</script>
</body>
</html>
