<script type="module">
import { runGuidedModule } from './components.js';

/* ── CONFIG (module content) ─────────────────────────────────────── */
const CFG = {
  moduleId: 'lighting',
  title: 'Vehicle Lighting',
  kicker: 'Electrical & Starting',
  accent: '#fde047',
  badge: 'H4 · dual-filament lab',
  camPos: [1.8, 2.6, 9.2],
  target: [0.4, -0.25, 0],
  floorY: -1.9,
  ctl: { label: 'Dip switch', val: 45, caption: 'Off · Low · High' },
  chipLabel: 'Lamp power',
  rows: [['mode', 'Mode'], ['range', 'Reach']],
  ro: [
    ['mode', 'Switch position'], ['pw', 'Lamp power'], ['cur', 'Circuit current'],
    ['volt', 'System voltage'], ['temp', 'Filament temp'],
    ['range', 'Beam reach'], ['relay', 'Relay']
  ],
  legend: [
    ['#fde047', 'Beam / filament'], ['#ef4444', 'Live feed'], ['#facc15', 'Low-beam wire'],
    ['#e8ecf2', 'High-beam wire'], ['#64748b', 'Ground'], ['#e5e7eb', 'Reflector']
  ],
  overview: `<div class="al-sec"><h4>Optics</h4><p>A tiny coil of tungsten sits at the <b>focus</b> of a parabolic reflector. Every ray leaving the focus bounces off the mirror parallel — that is how a point of light becomes a <b>beam</b>. The fluted lens then spreads and shapes it into a legal road pattern.</p></div>
<div class="al-sec"><h4>Two filaments, one bulb</h4><ul><li><b>High beam</b> — filament exactly at the focus, nothing in the way: a level, full-power beam reaching 100 m+.</li><li><b>Low beam</b> — filament lifted off the focus so the beam dips, and a small <b>metal shield</b> chops the top off the light. The sharp <b>cut-off</b> on the screen is that shield, projected — with its step lifted toward the roadside to light signs and pedestrians.</li></ul></div>
<div class="al-sec"><h4>Why a relay</h4><p>A 55 W lamp pulls about <b>4.5 A</b> — far too much for a thin dash switch. The stalk feeds only the relay coil (≈0.2 A); the relay contacts carry the lamp current straight from the battery, through the fuse.</p></div>
<div class="al-sec"><h4>Try this</h4><ul><li>Drag the dip switch and watch the ray fan, the light wedge and the screen pattern change together.</li><li>Follow the current: red feed → fuse → relay → yellow (low) or white (high) wire → bulb, and back on the black ground.</li><li>Listen for the relay click on every switch change.</li></ul></div>`,
  faults: [
    ["Blown bulb or fuse", "One or both beams dark.",
     "Check the fuse first, then probe for 12 V at the lamp connector with the switch on."],
    ["Corroded ground", "Dim lamps, flicker, warm connectors.",
     "Measure voltage drop on the ground side under load — anything over 0.2 V is resistance stealing your light."],
    ["Misaimed headlamps", "Short reach, or the cut-off dazzling oncoming drivers.",
     "Aim on level ground against a screen at 10 m using the aiming screws — exactly what the wall in this scene shows."],
    ["Yellowed plastic lens", "Milky beam, weak reach.",
     "The polycarbonate outer lens is UV-damaged. Polish it or replace it."],
    ["Relay clicks, lamps stay dark", "Coil pulls in, but no output.",
     "The contacts are burnt. Jump the relay output to confirm, then replace the relay."],
    ["'HID/LED retrofit' bulbs in halogen optics", "Glare, scattered light, failed inspection.",
     "The reflector is computed around a filament position — a random LED chip scatters everywhere except the road."]
  ],
  quiz: [
    ["Why do headlamps switch through a relay?",
     ["The switch carries only the small coil current — the contacts carry the heavy lamp current",
      "It makes the lamps brighter", "It protects the fuse"], 0,
     "A 55 W lamp draws about 4.5 A. Thin dash wiring and the switch would heat up, so a relay does the heavy lifting."],
    ["A filament placed at the focus of a parabolic reflector produces…",
     ["A parallel beam", "A wide flood", "A focused spot on the bulb"], 0,
     "Every ray from the focus reflects out parallel to the axis — that is what makes a beam."],
    ["What creates the sharp top edge of the low beam?",
     ["A metal shield blocking the top of the light", "A dimmer resistor in the stalk", "The yellow colour of the lens"], 0,
     "The cut-off is the projected image of the shield. The step at one end lifts light toward the roadside."],
    ["Dim lamps plus warm connectors usually mean…",
     ["High resistance in the circuit", "Too much voltage", "A bulb that is too efficient"], 0,
     "Corrosion or a loose terminal drops voltage across itself — the lamp never sees full power."],
    ["Low beam lights the road for roughly…",
     ["40 m", "400 m", "4 m"], 0,
     "Low beam must light the road without dazzling — about 40 m of reach, against 100 m+ for high beam."]
  ]
};

/* ── MODULE SCENE (per-module 3D parts) ──────────────────────────── */
function build(H){
const {box,cyl,cylX,pipe,stream,root,THREE}=H;

/* ═══ geometry constants — reflector is a true parabola ═══
   vertex X0, focal length FL, rim radius R. rim at RIMX, focus at FOC. */
const X0=-4.6, FL=.34, R=1.05;
const RIMX=X0+R*R/(4*FL);                 // ≈ -3.79
const FOC=[X0+FL,0];                      // high filament: exactly at the focus
const LOWF=[X0+.47,.08];                  // low filament: lifted + forward → beam dips
const LENSX=RIMX+.02, W_=512, H_=312;

/* ═══ small helpers ═══ */
const M=(c,m,r,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,metalness:m,roughness:r},o));
function tex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}
const dotT=tex(64,64,g=>{const r=g.createRadialGradient(32,32,0,32,32,30);
  r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.4,'rgba(255,255,255,.5)');r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r;g.fillRect(0,0,64,64);});
function glow(color,scale){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:dotT,color,transparent:true,
  opacity:0,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));
  s.scale.setScalar(scale);root.add(s);return s;}
function txtSprite(t,w){const T=tex(160,64,g=>{g.fillStyle='rgba(10,13,18,.88)';g.fillRect(0,0,160,64);
  g.strokeStyle='rgba(148,163,184,.45)';g.lineWidth=3;g.strokeRect(2,2,156,60);
  g.fillStyle='#e8ecf2';g.font='700 26px ui-monospace,Menlo,monospace';g.textAlign='center';g.textBaseline='middle';
  g.fillText(t,80,34);});
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:T,transparent:true,depthWrite:false}));
  s.scale.set(w,w*64/160,1);root.add(s);return s;}

/* ═══ headlamp: half-cutaway parabolic reflector, H4 bulb, shield, fluted lens ═══ */
const prof=[];for(let i=0;i<=26;i++){const r=.12+(R-.12)*i/26;prof.push(new THREE.Vector2(r,r*r/(4*FL)));}
const refl=new THREE.Mesh(new THREE.LatheGeometry(prof,44,Math.PI/2,Math.PI),
  M(0xf2f6fb,1,.06,{side:THREE.DoubleSide,envMapIntensity:1.5}));
refl.rotation.z=-Math.PI/2;root.add(refl);

/* flat cut-away face (the classic orange section) */
const shp=new THREE.Shape();shp.moveTo(0,0);
for(let i=0;i<=22;i++){const v=R*i/22;shp.lineTo(v*v/(4*FL),v);}
for(let i=22;i>=0;i--){const v=R*i/22;shp.lineTo(v*v/(4*FL),-v);}
const cutF=new THREE.Mesh(new THREE.ShapeGeometry(shp,26),M(0xc45c2a,.15,.7,{side:THREE.DoubleSide}));
cutF.position.x=X0;root.add(cutF);

/* housing rim + fluted glass lens (real fresnel ripples in the profile) */
const bez=new THREE.Mesh(new THREE.TorusGeometry(R+.02,.045,10,52),M(0x14171d,.5,.5));
bez.rotation.y=Math.PI/2;bez.position.x=RIMX;root.add(bez);
const lp=[];for(let i=0;i<=52;i++){const r=R*.99*i/52;lp.push(new THREE.Vector2(r,.085*(r/R)*(r/R)+.006*Math.sin(r*30)));}
const lens=new THREE.Mesh(new THREE.LatheGeometry(lp,52),
  new THREE.MeshPhysicalMaterial({color:0xe9f1fb,metalness:0,roughness:.05,transparent:true,opacity:.16,
    side:THREE.DoubleSide,envMapIntensity:2}));
lens.rotation.z=-Math.PI/2;lens.position.x=RIMX;root.add(lens);

/* H4-style bulb: envelope, base, collar, connector */
const bulb=new THREE.Mesh(new THREE.CapsuleGeometry(.1,.14,6,16),
  new THREE.MeshPhysicalMaterial({color:0xdfe9f5,transparent:true,opacity:.16,roughness:.05}));
bulb.rotation.z=Math.PI/2;bulb.position.set(-4.21,0,0);root.add(bulb);
cylX(.055,.055,.1,M(0xb9c2ce,.9,.3),-4.43,0,0);
cylX(.08,.08,.045,M(0x22262e,.4,.6),-4.505,0,0);
box(.12,.15,.19,M(0x1b1f27,.3,.7),-4.59,0,0);

/* two transverse filaments */
function filament(x,y){const m=M(0x9aa1ab,.6,.4,{emissive:0xff5a00,emissiveIntensity:0});
  const f=new THREE.Mesh(new THREE.CylinderGeometry(.016,.016,.18,10),m);
  f.rotation.x=Math.PI/2;f.position.set(x,y,0);root.add(f);return m;}
const filLowM=filament(LOWF[0],LOWF[1]), filHighM=filament(FOC[0],FOC[1]);

/* cut-off shield: metal canopy above the low filament */
const canopy=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,.26,20,1,true,Math.PI/2,Math.PI),
  M(0x2b303a,.85,.35,{side:THREE.DoubleSide}));
canopy.rotation.x=Math.PI/2;canopy.position.set(-4.02,.26,0);root.add(canopy);
box(.018,.06,.26,M(0x2b303a,.85,.35),-3.928,.27,0);

/* glow sprites + a real point light so the chrome bowl lights from inside */
const glowLow=glow(0xffdf9e,.2);  glowLow.position.set(LOWF[0],LOWF[1],0);
const glowHigh=glow(0xffe9c8,.2); glowHigh.position.set(FOC[0],FOC[1],0);
const glowMouth=glow(0xffe4b0,1.5); glowMouth.position.set(-3.72,0,0);
const lampLight=new THREE.PointLight(0xffe3b0,0,7,2);lampLight.position.set(FOC[0],.06,0);root.add(lampLight);

/* ═══ optics ray fan — filament → reflector → out ═══ */
function rays(from,count,phi0,phi1,dy){const p=[];
  for(let i=0;i<count;i++){const t=count===1?0:i/(count-1),phi=phi0+(phi1-phi0)*t;
    const ry=-R*Math.sin(phi),rz=R*Math.cos(phi),L=1.7;
    p.push(from[0],from[1],0, RIMX,ry,rz, RIMX+L,ry+dy(ry)*L,rz);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
  const m=new THREE.LineBasicMaterial({color:0xfff3c9,transparent:true,opacity:0,
    blending:THREE.AdditiveBlending,depthWrite:false});
  const l=new THREE.LineSegments(g,m);l.frustumCulled=false;root.add(l);return m;}
const rayHighM=rays(FOC,12,Math.PI/2,Math.PI*1.5,()=>0);          // focus → parallel, level
const rayLowM =rays(LOWF,10,Math.PI/2,3.4,ry=>-.13+.07*ry/R);     // lifted → fan dips down

/* rays the shield eats (only visible in LOW) */
const bp=[];for(let b=0;b<5;b++){const a=(-55+b*23)*Math.PI/180;
  bp.push(LOWF[0],LOWF[1],0, -4.02+.09*Math.cos(a), .26+.09*Math.sin(a), 0);}
const rayBlockM=(()=>{const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(bp,3));
  const m=new THREE.LineBasicMaterial({color:0xd97741,transparent:true,opacity:0,depthWrite:false});
  const l=new THREE.LineSegments(g,m);l.frustumCulled=false;root.add(l);return m;})();

/* ═══ volumetric beam wedges — low is a half-cone with a hard top edge ═══ */
function wedge(r1,len,half,tilt,col){
  const g=new THREE.CylinderGeometry(.2,r1,len,26,1,true,half?-Math.PI/2:0,half?Math.PI:Math.PI*2);
  g.rotateX(Math.PI/2);g.rotateY(Math.PI/2);g.translate(len/2,0,0);
  const m=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0,
    blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false});
  const gr=new THREE.Group();gr.position.set(LENSX,0,0);gr.rotation.z=tilt;
  gr.add(new THREE.Mesh(g,m));root.add(gr);return m;}
const lowWideM =wedge(1.5, 8.7,true, -.12,0xffe9b8);
const lowCoreM =wedge(.72, 8.4,true, -.105,0xfff3d0);
const highWideM=wedge(1.6, 9.3,false, 0,   0xdfeaff);
const highCoreM=wedge(.8,  9.3,false, 0,   0xf2f7ff);

/* ═══ aiming wall — live-rendered beam pattern ═══ */
const baseC=document.createElement('canvas');baseC.width=W_;baseC.height=H_;
(function(){const g=baseC.getContext('2d');
  g.fillStyle='#12161d';g.fillRect(0,0,W_,H_);
  const v=g.createLinearGradient(0,0,0,H_);v.addColorStop(0,'rgba(255,255,255,.035)');v.addColorStop(1,'rgba(0,0,0,.28)');
  g.fillStyle=v;g.fillRect(0,0,W_,H_);
  g.strokeStyle='rgba(148,163,184,.07)';g.beginPath();
  for(let x=32;x<W_;x+=32){g.moveTo(x+.5,0);g.lineTo(x+.5,H_);}
  for(let y=26;y<H_;y+=26){g.moveTo(0,y+.5);g.lineTo(W_,y+.5);}g.stroke();
  g.strokeStyle='rgba(148,163,184,.18)';g.beginPath();g.moveTo(W_/2,0);g.lineTo(W_/2,H_);g.stroke();
  g.setLineDash([7,6]);g.strokeStyle='rgba(253,224,71,.42)';
  g.beginPath();g.moveTo(0,.744*H_);g.lineTo(W_,.744*H_);g.stroke();g.setLineDash([]);
  g.fillStyle='rgba(253,224,71,.5)';for(let x=14;x<W_;x+=44)g.fillRect(x,.744*H_-4,2,8);
})();
const wallC=document.createElement('canvas');wallC.width=W_;wallC.height=H_;
const wg=wallC.getContext('2d');
const wallTex=new THREE.CanvasTexture(wallC);wallTex.colorSpace=THREE.SRGBColorSpace;
const wall=new THREE.Mesh(new THREE.PlaneGeometry(5.6,3.4),new THREE.MeshBasicMaterial({map:wallTex}));
wall.rotation.y=-Math.PI/2;wall.position.set(5.5,-.2,0);root.add(wall);
box(.16,3.6,.16,M(0x2a2f3a,.4,.6),5.6,-.1,2.88);
box(.16,3.6,.16,M(0x2a2f3a,.4,.6),5.6,-.1,-2.88);
box(.16,.14,5.9,M(0x2a2f3a,.4,.6),5.6,1.66,0);
function grad(x,y,r,col){if(r<=1)return;const G=wg.createRadialGradient(x,y,0,x,y,r);
  G.addColorStop(0,col);G.addColorStop(1,'rgba(0,0,0,0)');wg.fillStyle=G;
  wg.beginPath();wg.arc(x,y,r,0,6.2832);wg.fill();}
function drawWall(bL,bH){
  wg.globalCompositeOperation='source-over';wg.drawImage(baseC,0,0);
  if(bL>.004||bH>.004){wg.globalCompositeOperation='lighter';
    if(bL>.004){const yl=.744*H_,yr=.678*H_,xs=.62*W_;
      wg.save();wg.beginPath();wg.moveTo(0,yl);wg.lineTo(xs,yl);wg.lineTo(xs,yr);
      wg.lineTo(W_,yr);wg.lineTo(W_,H_);wg.lineTo(0,H_);wg.closePath();wg.clip();
      grad(.42*W_,.88*H_,.36*W_,'rgba(255,236,190,'+(.9*bL)+')');
      grad(.42*W_,.93*H_,.58*W_,'rgba(255,212,148,'+(.4*bL)+')');
      grad(.5*W_,1.04*H_,.55*W_,'rgba(255,230,180,'+(.28*bL)+')');
      wg.restore();
      wg.globalAlpha=Math.min(1,bL);wg.strokeStyle='rgba(255,246,222,.9)';wg.lineWidth=2.5;
      wg.beginPath();wg.moveTo(0,yl);wg.lineTo(xs,yl);wg.lineTo(xs,yr);wg.lineTo(W_,yr);wg.stroke();
      wg.globalAlpha=1;}
    if(bH>.004){
      grad(.5*W_,.40*H_,.5*W_,'rgba(205,224,255,'+(.5*bH)+')');
      grad(.5*W_,.41*H_,.27*W_,'rgba(233,242,255,'+(.9*bH)+')');
      grad(.5*W_,.42*H_,.115*W_,'rgba(255,255,255,'+(.95*bH)+')');}
    wg.globalCompositeOperation='source-over';}
  wallTex.needsUpdate=true;}

/* ground light pool */
const poolTex=tex(256,128,g=>{g.scale(1,.5);
  const r=g.createRadialGradient(128,128,4,128,128,118);
  r.addColorStop(0,'rgba(255,240,206,.95)');r.addColorStop(.55,'rgba(255,224,170,.34)');r.addColorStop(1,'rgba(255,210,150,0)');
  g.fillStyle=r;g.fillRect(0,0,256,256);});
const poolM=new THREE.MeshBasicMaterial({map:poolTex,transparent:true,opacity:0,
  blending:THREE.AdditiveBlending,depthWrite:false,fog:false});
const pool=new THREE.Mesh(new THREE.PlaneGeometry(1,1),poolM);
pool.rotation.x=-Math.PI/2;pool.position.y=-1.883;root.add(pool);

/* photon stream — light particles flying lamp → wall */
const PN=170,pPos=new Float32Array(PN*3),dots=[];
const pGeo=new THREE.BufferGeometry();pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
const pMat=new THREE.PointsMaterial({map:dotT,color:0xffe9c4,size:.09,transparent:true,opacity:0,
  blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});
const pts=new THREE.Points(pGeo,pMat);pts.frustumCulled=false;root.add(pts);
for(let i=0;i<PN;i++)dots.push({u:Math.random(),s:.3+Math.random()*.42,a:Math.random()*6.283,r:.3+Math.random()});
function roll(d,m){d.a=m===2?Math.random()*6.283:Math.PI+Math.random()*Math.PI;
  d.r=.25+Math.random()*(m===2?1.3:1.05);}

/* ═══ lab bench, stand, battery, fuse, relay, dip switch ═══ */
box(8.6,.16,1.8,M(0x272c36,.35,.6),-1.3,-1.33,0);
[[-5.15,.72],[2.55,.72],[-5.15,-.72],[2.55,-.72]].forEach(([x,z])=>box(.1,.55,.1,M(0x1a1e26,.3,.7),x,-1.62,z));
box(.09,.75,.09,M(0x303642,.4,.55),-5.0,-.87,0);     // stand pole
box(.6,.05,.05,M(0x303642,.4,.55),-4.7,-.53,0);      // arm
box(.05,.4,.05,M(0x303642,.4,.55),-4.62,-.33,0);     // riser
box(.07,.18,.22,M(0x3a4150,.4,.5),-4.64,-.12,0);     // lamp clamp

box(.6,.42,.9,M(0x23272e,.25,.55),-4.35,-1.04,0);    // battery
cyl(.05,.05,.09,M(0xb03434,.5,.4),-4.52,-.8,0);      // + post
cyl(.05,.05,.09,M(0x24262c,.5,.4),-4.18,-.8,0);      // − post
txtSprite('12 V',.42).position.set(-4.35,-.66,.4);

box(.22,.09,.16,M(0x1b1f27,.3,.6),-2.9,-1.2,0);      // fuse holder
const fuseB=new THREE.Mesh(new THREE.BoxGeometry(.05,.15,.05),
  new THREE.MeshPhysicalMaterial({color:0xf25c4a,transparent:true,opacity:.6,roughness:.15}));
fuseB.position.set(-2.9,-1.09,0);root.add(fuseB);     // blade fuse
box(.055,.02,.055,M(0x9aa4b0,.9,.3),-2.9,-1.015,0);
box(.055,.02,.055,M(0x9aa4b0,.9,.3),-2.9,-1.165,0);

/* relay — glass cube so the coil + contact arm are visible */
const rg=new THREE.Mesh(new THREE.BoxGeometry(.44,.44,.44),
  new THREE.MeshPhysicalMaterial({color:0xdfe9f5,transparent:true,opacity:.14,roughness:.05}));
rg.position.set(-1.3,-1.03,0);root.add(rg);
const coilM=M(0xb05a2a,.7,.35,{emissive:0xff7a33,emissiveIntensity:0});
const coil=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.2,14),coilM);
coil.rotation.x=Math.PI/2;coil.position.set(-1.4,-1.02,0);root.add(coil);
cylX(.02,.02,.26,M(0x6b7280,.8,.3),-1.4,-1.02,0);
const armPivot=new THREE.Group();armPivot.position.set(-1.46,-.88,0);root.add(armPivot);
const arm=new THREE.Mesh(new THREE.BoxGeometry(.33,.024,.05),M(0x9aa4b0,.9,.3));
arm.position.x=.165;armPivot.add(arm);
const tipM=M(0xc9a24a,.8,.35,{emissive:0xffcf7a,emissiveIntensity:0});
const tip=new THREE.Mesh(new THREE.BoxGeometry(.05,.05,.06),tipM);
tip.position.x=.33;armPivot.add(tip);
box(.05,.07,.07,M(0x6b7280,.8,.3),-1.11,-.93,0);
[-1.42,-1.32,-1.22,-1.12].forEach(x=>cylX(.02,.02,.12,M(0x9aa4b0,.9,.3),x,-1.28,0));

/* steering column + wheel + dip stalk */
cyl(.06,.06,.8,M(0x2a2f3a,.4,.5),.6,-.85,0);
const wheel=new THREE.Mesh(new THREE.TorusGeometry(.26,.024,10,36),M(0x1b1f27,.3,.6));
wheel.rotation.x=Math.PI/2;wheel.position.set(.6,-.44,0);root.add(wheel);
for(let i=0;i<3;i++){const sp=new THREE.Mesh(new THREE.BoxGeometry(.26,.02,.03),M(0x2a2f3a,.4,.5));
  sp.rotation.y=i*2.094;sp.position.set(.6,-.44,0);root.add(sp);}
const stalkPivot=new THREE.Group();stalkPivot.position.set(.66,-.6,.06);root.add(stalkPivot);
const lever=new THREE.Mesh(new THREE.BoxGeometry(.055,.05,.42),M(0x333a46,.4,.5));
lever.position.z=.21;stalkPivot.add(lever);
const knob=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,.09),M(0x101318,.2,.6));
knob.position.z=.43;stalkPivot.add(knob);

/* ═══ wiring loom + current streams ═══ */
const wRed=M(0xd23c3c,.3,.55),wYel=M(0xdcb23f,.3,.55),wWht=M(0xd8dde5,.3,.55),
      wGnd=M(0x39404d,.3,.6),wCtl=M(0xb03535,.3,.55);
const mainPath=[[-4.52,-.74,0],[-4.52,-1.02,0],[-3.5,-1.06,0],[-2.9,-1.06,0],
                [-2.35,-1.02,0],[-1.88,-.94,0],[-1.52,-.9,0]];
const feedLo=[[-1.08,-.9,-.06],[-1.0,-.62,-.06],[-.96,-.44,-.06],[-3.5,-.4,-.06],
               [-4.3,-.4,-.06],[-4.55,-.22,-.06],[-4.55,-.06,-.06]];
const feedHi=[[-1.08,-.9,.06],[-1.0,-.62,.06],[-.96,-.44,.06],[-3.5,-.4,.06],
               [-4.3,-.4,.06],[-4.55,-.22,.06],[-4.55,-.06,.06]];
const gndPath=[[-4.6,.04,.09],[-4.66,-.25,.09],[-4.66,-.6,.09],[-4.4,-1.02,.09],
               [-4.18,-1.0,.09],[-4.18,-.76,.09]];
const ctlPath=[[-4.52,-.74,.16],[-4.55,-1.1,.44],[.1,-1.1,.44],[.5,-.98,.4],[.58,-.84,.3],
               [.63,-.68,.2],[.6,-.72,-.14],[.52,-1.02,-.4],[-1.05,-1.02,-.4],
               [-1.18,-.98,-.22],[-1.3,-1.22,-.06]];
pipe(mainPath,.034,wRed);pipe(feedLo,.026,wYel);pipe(feedHi,.026,wWht);
pipe(gndPath,.03,wGnd);pipe(ctlPath,.02,wCtl);
const sMain=stream(mainPath,16,0xffd27a,.1),
      sLo  =stream(feedLo,13,0xfde047,.09),
      sHi  =stream(feedHi,13,0xffffff,.09),
      sGnd =stream(gndPath,13,0x9fb2c8,.09),
      sCtl =stream(ctlPath,8,0xff9d9d,.12);

/* roadside distance markers (10 m = the wall) */
[[-1.92,'2 m'],[.88,'5 m'],[3.68,'8 m']].forEach(([x,t])=>{
  cyl(.016,.016,.55,M(0x3a4150,.5,.5),x,-1.62,-2.35);
  txtSprite(t,.5).position.set(x,-1.28,-2.35);});

/* ═══ relay click (tiny synthesized clack) ═══ */
let AC=null;
document.addEventListener('pointerdown',()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  AC.resume&&AC.resume();}catch(e){}},{passive:true});
function click(on){try{if(!AC)return;if(AC.state==='suspended')AC.resume();
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type='square';o.frequency.setValueAtTime(on?2300:1400,t);
  o.frequency.exponentialRampToValueAtTime(on?160:100,t+.03);
  g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(1e-4,t+.06);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.07);}catch(e){}}

/* ═══ per-frame update ═══ */
let mode=-1,I=0,hL=0,hH=0,armA=.31;
function setFil(m,h){m.emissive.setRGB(.45+.55*h,.10+.78*h,.02+.55*h);m.emissiveIntensity=3.4*h;}

function update(c){
  const k=c.k, m=k<.12?0:k<.6?1:2;
  if(m!==mode){if(mode>=0)click(m>0);mode=m;for(const d of dots)d.u=Math.random()*.25;}
  const tgt=m===0?0:m===1?55:60;
  I +=(tgt-I )*Math.min(1,c.dt*(m?8.5:3.2));   // halogen lights in ~0.15 s
  hL+=((m===1?1:0)-hL)*Math.min(1,c.dt*(m===1?11:3.6));
  hH+=((m===2?1:0)-hH)*Math.min(1,c.dt*(m===2?11:3.6));
  const fl=1+.02*Math.sin(c.t*43)+.012*Math.sin(c.t*97+1.3), bL=hL*fl, bH=hH*fl;

  setFil(filLowM,hL*fl); setFil(filHighM,hH*fl);
  glowLow.material.opacity=.95*bL;  glowLow.scale.setScalar(.1+.5*hL);
  glowHigh.material.opacity=.95*bH; glowHigh.scale.setScalar(.1+.5*hH);
  glowMouth.material.opacity=.5*Math.min(1,bL+bH);
  glowMouth.scale.setScalar(1.5+.5*Math.min(1,hL+hH));
  lampLight.intensity=2.9*Math.min(1,bL+bH); lampLight.position.y=.09*hL-.02;

  rayHighM.opacity=.5*hH; rayLowM.opacity=.5*hL; rayBlockM.opacity=.4*hL;
  lowWideM.opacity=.15*bL; lowCoreM.opacity=.22*bL;
  highWideM.opacity=.12*bH; highCoreM.opacity=.2*bH;

  if(hL>=hH){pool.scale.set(4.8,2.8,1);pool.position.set(-1.6,-1.883,0);poolM.opacity=.5*bL;}
  else{pool.scale.set(8.8,3.2,1);pool.position.set(.8,-1.883,0);poolM.opacity=.55*bH;}

  pMat.opacity=Math.min(1,.85*(hL+hH));
  for(let i=0;i<PN;i++){const d=dots[i];d.u+=d.s*c.dt;
    if(d.u>1){d.u-=1;roll(d,m);}
    const u=d.u,r=d.r*u;
    if(m===2){pPos[i*3]=LENSX+u*9.2;pPos[i*3+1]=r*Math.sin(d.a);pPos[i*3+2]=r*Math.cos(d.a);}
    else{pPos[i*3]=LENSX+u*9.2;pPos[i*3+1]=r*Math.sin(d.a)-u*1.03;pPos[i*3+2]=r*Math.cos(d.a);}}
  pGeo.attributes.position.needsUpdate=true;

  drawWall(bL,bH);

  armA+=((m>0?1:0)-armA)*Math.min(1,c.dt*26);
  armPivot.rotation.z=.31-.47*armA;
  coilM.emissiveIntensity=.85*armA; tipM.emissiveIntensity=.4*armA;
  stalkPivot.rotation.x+=((m===1?.32:m===2?-.32:0)-stalkPivot.rotation.x)*Math.min(1,c.dt*10);

  const on=m>0&&I>1?1:0;
  sMain.update(c.t,.16,on); sCtl.update(c.t,.16,on);
  sLo.update(c.t,.16,m===1&&I>1?1:0); sHi.update(c.t,.16,m===2&&I>1?1:0);
  sGnd.update(c.t,.16,on);

  const name=['OFF','LOW BEAM','HIGH BEAM'][m], cur=I/12.4, volt=12.62-.28*(I/60), temp=25+44*I;
  return {big:Math.round(I),unit:' W',bar:I/60*100,
    rows:{mode:name,range:m===0?'—':m===1?'≈ 40 m':'100 m+'},
    ro:{mode:[name,'hi'],
        pw:[I.toFixed(0)+' W',''],
        cur:[cur.toFixed(1)+' A',''],
        volt:[volt.toFixed(1)+' V',''],
        temp:[I<1?'cold':Math.round(temp)+' °C',I>40?'warn':''],
        range:[m===0?'—':m===1?'≈ 40 m · cut-off':'100 m+',''],
        relay:[m?'closed · carrying':'open',m?'ok':'']},
    status:[name,m>0],ctl:name};
}

drawWall(0,0);
return {
  labels:[
    ['Parabolic reflector',[-4.85,.95,-.35]],
    ['Low-beam filament',[-4.13,.35,.05]],
    ['High-beam filament',[-4.28,-.42,-.05]],
    ['Cut-off shield',[-3.95,.6,0]],
    ['Fluted lens',[-3.79,1.3,0]],
    ['Aiming screen · 10 m',[5.4,2.15,0]],
    ['Sharp cut-off',[5.3,-.85,-1.75]],
    ['Battery 12 V',[-4.35,-.55,.5]],
    ['Fuse',[-2.9,-.8,.25]],
    ['Relay — cutaway',[-1.3,-.52,.4]],
    ['Dip switch',[.9,-.42,.5]],
    ['Live feed wire',[-3.0,-.2,.1]]
  ],
  update
};
}

runGuidedModule(CFG, build);
</script>
</body>
</html>
