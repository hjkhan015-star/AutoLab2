  "overview": "<div class=\"al-sec\"><h4>Two bricks, two jobs<\/h4><p>Gas first meets the <b>reduction catalyst</b> (rhodium) which strips oxygen from NOx, then the <b>oxidation catalyst</b> (platinum / palladium) which burns off the remaining CO and HC. A cerium-oxide (ceria) wash-coat stores oxygen when the mixture is lean and releases it when rich, widening the lambda window.<\/p><\/div><div class=\"al-sec\"><h4>Reactions<\/h4><ul><li>CO + &frac12;O&#8322; &rarr; CO&#8322;<\/li><li>2&nbsp;C&#8322;H&#8326; + 7O&#8322; &rarr; 4CO&#8322; + 6H&#8322;O (HC oxidation)<\/li><li>2CO + 2NO &rarr; 2CO&#8322; + N&#8322;<\/li><\/ul><\/div><div class=\"al-sec\"><h4>Three jobs at once<\/h4><ul><li>Oxidise carbon monoxide: CO &rarr; CO&#8322;<\/li><li>Oxidise unburnt hydrocarbons: HC &rarr; CO&#8322; + H&#8322;O<\/li><li>Reduce nitrogen oxides: NOx &rarr; N&#8322;<\/li><\/ul><\/div><div class=\"al-sec\"><h4>Light-off<\/h4><p>Platinum, palladium and rhodium on a ceramic honeycomb only work above about 250&ndash;300&nbsp;&deg;C. The catalyst starts <b>cold</b> in this simulation &mdash; watch the conversion climb as the exhaust heats the brick through the light-off S-curve.<\/p><\/div><div class=\"al-sec\"><h4>Lambda window<\/h4><p>The ECU keeps the mixture near &lambda;&nbsp;=&nbsp;1. CO and HC prefer it just lean of stoichiometric, NOx prefers it just rich. Push the &lambda; slider to either extreme and the conversion of one group collapses while the other improves &mdash; the classic three-way conflict.<\/p><\/div><div class=\"al-sec\"><h4>Misfire &amp; melt-down<\/h4><p>Raw fuel that reaches the catalyst burns on the precious-metal surface. A long enough misfire pushes the bed above 950&nbsp;&deg;C, the ceramic substrate melts, back pressure rises and conversion drops &mdash; and the damage is permanent until Reset.<\/p><\/div><div class=\"al-sec\"><h4>Chemistry beyond the three reactions<\/h4><p><b>Rich and hot:<\/b> NOx is over-reduced to ammonia (NH&#8323;), and the water- /* ═══════════════════════════════════════════════════════════════════
   PHYSICS MODEL — pure, named functions.
   Simplified physical trends, not a bench lookup table.
   Two stages, as in the diagram: a REDUCTION brick (Rh, NOx -> N2) in
   front and an OXIDATION brick (Pt/Pd, CO + HC) behind it, both coated
   with a ceria (CeO2) oxygen-storage wash-coat.
   ═══════════════════════════════════════════════════════════════════ */

/* finite, range-safe clamp (never returns NaN) */
function clampN(x, a, b) {
  if (!Number.isFinite(x)) return a;
  return x < a ? a : (x > b ? b : x);
}
const num = (x, d) => (Number.isFinite(x) ? x : d);
const fmtPpm = (v) => { v = Math.max(0, num(v, 0)); return v >= 10000 ? (v / 10000).toFixed(1) + '%' : (v >= 1000 ? (v / 1000).toFixed(1) + 'k' : v.toFixed(0)); };   /* ppm, or % above 1 % */

/* ── named constants ─────────────────────────────────────────────── */
const LIGHT_OFF     = 275;    /* °C, 50 % conversion (light-off midpoint)   */
const LIGHT_OFF_W   = 35;     /* °C, steepness of the S-curve               */
const MAX_CONV      = 0.995;  /* healthy conversion ceiling (CO, HC)        */
const NOX_CEILING   = 0.985;  /* NOx reduction is slightly harder           */
const MELT_TEMP     = 950;    /* °C, thermal damage starts above this       */
const MELT_RATE     = 0.0016; /* damage per (s · °C above the melt point)   */
const MISFIRE_HEAT  = 420;    /* °C, max extra bed temperature at full misfire */
const P0420_LIMIT   = 0.70;   /* measured efficiency below this = P0420     */
const P0420_DELAY   = 8;      /* s sustained above the limit before latching */
const MONITOR_MIN_T = 300;    /* °C, catalyst monitor only runs above this  */
const COLD_START_T  = 30;
const N_CELLS       = 6;      /* axial slices: 0-2 = reduction brick, 3-5 = oxidation brick */
const TAU_CELL      = 4.5;    /* s, per-slice thermal lag (a chain of three ≈ the old 12 s brick) */
const TAU_CELL_REAR = 6;      /* s, rear slices */
const EXO_CO        = 60;     /* °C of adiabatic rise per 1 % CO burnt on the brick */
const EXO_HC        = 30;     /* °C of adiabatic rise per 1 % HC (as C1) burnt */
/* species-specific light-off midpoints (°C): CO lights first, HC last */
const T50 = { co: 262, nox: 272, hc: 285 };     /* °C, initial bed temperature on a cold start */
const OSC_RATE      = 14;     /* ceria fill per second per unit of lambda error */
const OSC_BUFFER    = 0.80;   /* share of a lambda swing a healthy ceria bed absorbs */
const DITHER_AMP    = 0.012;  /* ECU closed-loop lambda wobble (± 1.2 %)    */
const DITHER_HZ     = 1.2;    /* Hz */

/* Catalyst ageing: hotter light-off, lower ceiling, less oxygen storage. */
const AGE = {
  new:  { shift: 0,  ceil: 1.00, osc: 1.00, label: 'New' },
  aged: { shift: 45, ceil: 0.93, osc: 0.75, label: 'Aged' },
  worn: { shift: 95, ceil: 0.80, osc: 0.45, label: 'Worn' }
};

/* Light-off S-curve: near-zero below ~200 °C, ~0.5 at 275 °C, ~1 by
   400 °C. Direction: hotter bed -> more conversion; ageing shifts it hotter. */
function lightOff(T, shift, kind) {
  const t50 = (kind && T50[kind]) ? T50[kind] : LIGHT_OFF;
  const x = (num(T, 0) - t50 - num(shift, 0)) / LIGHT_OFF_W;
  return 1 / (1 + Math.exp(-x));
}

/* Lambda window for each species. CO/HC oxidise best just lean of
   stoichiometric, NOx reduction best just rich; both drop away from
   their centre. Direction: further from centre -> lower factor. */
function lambdaWindow(lambda, kind) {
  const L = clampN(num(lambda, 1), 0.7, 1.3);
  const centre = (kind === 'nox') ? 0.985 : 1.005;
  const width  = 0.055;
  const x = (L - centre) / width;
  return clampN(1 - 0.55 * x * x, 0.02, 1);
}

/* Exhaust gas temperature at the catalyst inlet (°C). Rises with load
   (more fuel per cycle) and with rpm (more cycles per second); the
   ambient adds to the whole curve. Direction: more load/rpm -> hotter. */
function exhaustGasTemp(load, rpm, ambient) {
  const L = clampN(load, 0, 1);
  const N = clampN((num(rpm, 800) - 800) / 4200, 0, 1);
  const base = num(ambient, 20) + 150 + 700 * L * (0.6 + 0.4 * N) + 130 * N;
  return clampN(base, -30, 950);
}

/* Extra heat released on the brick when unburnt fuel (misfire) oxidises
   on the precious metal. Direction: more misfire + more load -> more
   heat. Gated by light-off before use, so a cold cat does not self-heat. */
function misfireHeat(misfire, load) {
  const M = clampN(misfire, 0, 1);
  const L = clampN(load, 0, 1);
  return MISFIRE_HEAT * M * (0.35 + 0.65 * L);
}

/* Conversion efficiency of ONE brick for ONE species. Ceiling drops with
   permanent poisoning, accumulated thermal damage and age. Direction: hot
   bed, λ near the species' window and a clean, undamaged brick -> higher. */
function conversion(kind, T, lambda, poison, damage, age) {
  const a = AGE[age] || AGE.new;
  const lo = lightOff(T, a.shift, kind);
  const lw = lambdaWindow(lambda, kind);
  let ceiling = (kind === 'nox') ? NOX_CEILING : MAX_CONV;
  ceiling *= a.ceil;
  ceiling *= (1 - 0.42 * clampN(poison, 0, 1));
  ceiling *= (1 - 0.60 * clampN(damage, 0, 1));
  return clampN(ceiling * lo * lw, 0, 0.995);
}

/* Combine two bricks in series: what the first misses the second may catch. */
function inSeries(c1, c2) {
  return clampN(1 - (1 - clampN(c1, 0, 1)) * (1 - clampN(c2, 0, 1)), 0, 0.995);
}

/* Instantaneous mixture the ECU is commanding: the slider value plus the
   closed-loop wobble when dither is on. */
function lambdaNow(lambda, phase, dither, bias) {
  return num(lambda, 1) + num(bias, 0) + (dither ? DITHER_AMP * Math.sin(phase) : 0);
}

/* Oxygen-storage capacity left (0..1): ageing, poisoning and melt damage
   all shrink it. */
function oscCapacity(age, poison, damage) {
  const a = AGE[age] || AGE.new;
  return clampN(a.osc * (1 - 0.6 * clampN(poison, 0, 1)) * (1 - 0.7 * clampN(damage, 0, 1)), 0, 1);
}

/* Ceria fill level (0 empty .. 1 full of O2). Lean exhaust (λ > 1) loads
   oxygen onto the ceria, rich exhaust (λ < 1) pulls it back off. Only
   works while the brick is hot. */
function oscStep(osc, lam, dt, hotGate) {
  return clampN(osc + (num(lam, 1) - 1) * OSC_RATE * num(dt, 0) * clampN(hotGate, 0, 1), 0, 1);
}

/* Lambda the oxidation brick actually "sees". A healthy ceria bed with room
   left absorbs most of a lean swing (empty store) or covers a rich swing
   (full store) - so the effective window is wider than the raw one. */
function effectiveLambda(lam, osc, cap, hotGate) {
  const dev = num(lam, 1) - 1;
  const room = dev >= 0 ? (1 - osc) : osc;
  const absorb = OSC_BUFFER * clampN(cap, 0, 1) * clampN(room, 0, 1) * clampN(hotGate, 0, 1);
  return 1 + dev * (1 - absorb);
}

/* Raw (engine-out) emissions in ppm. CO and HC climb as the mixture goes rich
   and with misfire (raw fuel); NOx peaks a little lean of stoichiometric where
   the flame is hot and oxygen is plentiful, and falls with misfire because the
   charge never burns. Direction: rich -> CO/HC up; load up -> NOx up. */
function engineOut(lambda, load, rpm, misfire) {
  const lam = clampN(num(lambda, 1), 0.7, 1.3);
  const L = clampN(load, 0, 1), M = clampN(misfire, 0, 1);
  const N = clampN((num(rpm, 1800) - 800) / 4200, 0, 1);
  const rich = Math.max(0, 1 - lam), lean = Math.max(0, lam - 1);
  const co  = 1800 + 500000 * rich + 2500 * L + 12000 * M * (0.4 + 0.6 * L);
  const hc  =  700 + 14000 * rich + 4000 * lean * lean * 100 * L + 25000 * M * (0.4 + 0.6 * L);
  const x = (lam - 1.06) / 0.08;
  const bell = 0.1 + 0.9 * Math.exp(-x * x);
  const nox = (400 + 4500 * L * (0.7 + 0.3 * N)) * bell * (1 - 0.7 * M);
  return { co, hc, nox };
}

/* Heat released on a brick by the CO and HC it burns (°C of adiabatic rise).
   ppm in, conversion fraction -> °C. Direction: richer exhaust -> hotter cat. */
function exoHeat(coPpm, hcPpm, coConv, hcConv) {
  return EXO_CO * (coPpm / 10000) * clampN(coConv, 0, 1) + EXO_HC * (hcPpm / 10000) * clampN(hcConv, 0, 1);
}

/* By-products of imperfect chemistry (ppm). Rich + hot: NOx is over-reduced
   all the way to ammonia (NH3). Around 300-400 °C light-off: nitrous oxide
   (N2O, a strong greenhouse gas) is formed. Direction: NH3 up with richness,
   N2O peaks mid light-off. */
function byProducts(noxInPpm, noxConv, lambda, T) {
  const reduced = Math.max(0, noxInPpm) * clampN(noxConv, 0, 1);
  const nh3 = reduced * 0.35 * clampN((0.985 - num(lambda, 1)) / 0.05, 0, 1) * clampN((num(T, 0) - 250) / 150, 0, 1);
  const y = (num(T, 0) - 340) / 70;
  const n2o = Math.max(0, noxInPpm) * 0.10 * Math.exp(-y * y) * clampN(noxConv * 3, 0, 1);
  return { nh3, n2o };
}

/* Annual-inspection style fast-idle check (typical limits: CO 0.3 %, HC 200 ppm,
   lambda 0.97-1.03). Returns the first failure or PASS. */
function inspectionVerdict(coPct, hcPpm, lambdaAvg, ready) {
  if (!ready) return { txt: 'Not ready (cold)', tone: 'warn' };
  const fails = [];
  if (coPct > 0.3) fails.push('CO');
  if (hcPpm > 200) fails.push('HC');
  if (lambdaAvg < 0.97 || lambdaAvg > 1.03) fails.push('λ');
  return fails.length ? { txt: 'FAIL: ' + fails.join(' + '), tone: 'crit' } : { txt: 'PASS', tone: 'ok' };
}

/* Back pressure across the brick (kPa). Rises with the square-ish of
   exhaust mass flow and with a melted/blocked substrate. Direction:
   more flow or more damage -> higher Δp. ~2 kPa clean at idle, >20 kPa
   with a badly melted brick at full flow. */
function backpressure(flowNorm, damage) {
  const f = clampN(flowNorm, 0, 1.2);
  const block = 26 * clampN(damage, 0, 1);
  return clampN((2.5 + block) * Math.pow(f, 1.5), 0, 80);
}

/* Post-cat O2 sensor voltage seen by the ECU. A healthy brick sits
   steady around 0.70 V; a bad brick oscillates and averages ~0.45 V. As
   oxygen storage fades the downstream sensor starts to follow the
   upstream wobble (swing). A failed sensor reports a healthy-looking
   0.68 V regardless of the real efficiency - which is exactly how it
   hides a P0420. */
function postCatO2Voltage(trueEff, sensorOk, swing) {
  if (!sensorOk) return 0.68;
  return clampN(0.45 + 0.25 * clampN(trueEff, 0, 1) + num(swing, 0), 0.10, 0.95);
}

/* Which of the diagram's reactions is doing most of the work right now. */
function dominantReaction(Tf, Tr, lam, shift) {
  if (lightOff(Math.max(Tf, Tr), shift) < 0.15) return 'None - not lit off';
  if (lam < 0.985) return 'NOx + CO → N2 + CO2';
  if (lam > 1.02)  return 'CO, HC + O2 → CO2 + H2O';
  return 'All three, balanced';
}

const FAULT_POISON = { none: 0,    poisoned: 0.85, melted: 0.10, sensor: 0,    rich: 0 };
const FAULT_DAMAGE = { none: 0,    poisoned: 0,    melted: 0.75, sensor: 0,    rich: 0 };
const FAULT_LAMBDA = { rich: -0.07 };   /* mixture bias a fault adds (leaking injector / bad ECT sensor) */
const FAULT_INFO = {
  none:     { label: 'None (healthy)',                          warn: '' },
  poisoned: { label: 'Poisoned (oil / lead / silicone, P0420)', warn: 'P0420 - catalyst efficiency below threshold. The precious-metal sites are blocked by oil, lead or silicone contamination, so even a hot brick cannot convert. Check for coolant or oil leaking into the exhaust.' },
  melted:   { label: 'Melted substrate (P0420 + high back pressure)', warn: 'P0420 + high back pressure. The ceramic substrate has partially melted and distorted, blocking gas flow. Usually caused by a sustained misfire dumping raw fuel onto the brick.' },
  rich:     { label: 'Rich-running engine (P0172, leaking injector)', warn: 'P0172 - system too rich. Raw CO and HC pour onto the brick and burn there, so the catalyst overheats; excess reduction makes ammonia and sulfur is released as rotten-egg H2S. Fix the injector / sensor first or the catalyst will be destroyed.' },
  sensor:   { label: 'Post-cat O2 sensor failed (P0420 hidden)', warn: 'P0136 / P0141 - downstream O2 sensor circuit. The sensor is stuck at a healthy-looking voltage, so the ECU cannot detect catalyst degradation and never sets P0420.' }
};

/* ═══════════════════════════════════════════════════════════════════
   EXTRA CONTROLS (built here; the runtime only provides one slider)
   ═══════════════════════════════════════════════════════════════════ */
const S = {
  rpm: 1800,
  lambda: 1.00,
  misfire: 0,
  fault: 'none',
  age: 'new',
  dither: true,
  speed: 1
};

/* ── simulation state (module level so Reset can reach it) ───────── */
/* Phase 7a: the history lives in the Monitor (CFG.traces); the module only hands over one normalised sample
   per ~140 ms while the sim runs (0..100 % of each old axis range) and the current warning sentence. */
let traceSample = null, traceClear = false, warnText = '';
const traceN = (v, lo, hi) => Math.round(clampN((v - lo) / (hi - lo), 0, 1) * 1000) / 10;
const sim = {
  cells: new Array(N_CELLS).fill(COLD_START_T),   /* axial slice temperatures, inlet -> outlet */
  Tbed: COLD_START_T,       /* front (reduction) brick = mean of cells 0-2 */
  Trear: COLD_START_T,      /* rear (oxidation) brick  = mean of cells 3-5 */
  disp: null,               /* smoothed ppm readouts */
  osc: 0.5,
  phase: 0,
  poison: 0,
  damage: 0,
  p0420: false,
  p0420Timer: 0,
  lastT: -1,
  lastSample: 0
};

function coldCells() {
  for (let i = 0; i < N_CELLS; i++) sim.cells[i] = COLD_START_T;
  sim.Tbed = COLD_START_T; sim.Trear = COLD_START_T;
}
function resetModel() {
  coldCells();
  sim.disp = null;
  sim.osc = 0.5;
  sim.phase = 0;
  sim.poison = 0;
  sim.damage = 0;
  sim.p0420 = false;
  sim.p0420Timer = 0;
  sim.lastT = -1;
  traceClear = true;                  /* Monitor trace is cleared on the next update */
  sim.lastSample = 0;
}
function resetAll() {
  S.rpm = 1800;
  S.lambda = 1.00;
  S.misfire = 0;
  S.fault = 'none';
  S.age = 'new';
  S.dither = true;
  S.speed = 1;
  resetModel();
  controls.resetAll();                 /* every axis back to its default (store -> onChange -> S) */
}

/* ═══════════════════════════════════════════════════════════════════
   MODULE SCENE (per-module 3D parts) — follows the "Catalytic Converter"
   cut-away diagram: stainless body, head shield, flanges, O2 sensor,
   reduction brick (Rh) then oxidation brick (Pt/Pd), ceria + ceramic
   honeycomb, red raw exhaust in / blue clean exhaust out, and a magnified
   channel showing the wash-coat and the precious-metal sites.
   ═══════════════════════════════════════════════════════════════════ */
function build(H){
 const {box,cyl,cylX,sph,mat,glass,stream,lc,clamp,root,THREE,lowEnd}=H;
 const SEG = lowEnd ? 24 : 48;
 const OVAL = 0.8;                       /* the real shell is oval, not round */
 const oval = (o) => { o.scale.z = OVAL; return o; };

 /* ── stainless body (transparent cut-away) ─────────────────────── */
 const steel     = mat(0xaab2bd,.9,.32);
 const steelDark = mat(0x7b8491,.85,.4);
 oval(cylX(.97,.97,3.7,glass(0xcbd5e1,.14),0,0,0,null,SEG,true));    /* shell        */
 oval(cylX(.42,.97,.7,steel,-2.2,0,0,null,SEG,true));                 /* inlet cone   */
 oval(cylX(.97,.42,.7,steel, 2.2,0,0,null,SEG,true));                 /* outlet cone  */
 [-1.85,1.85].forEach(x=>oval(cylX(1.0,1.0,.06,steelDark,x,0,0,null,SEG)));   /* weld seams */
 oval(cylX(.42,.42,1.3,steel,-3.2,0,0,null,24,true));                 /* inlet pipe   */
 oval(cylX(.42,.42,1.3,steel, 3.2,0,0,null,24,true));                 /* outlet pipe  */

 /* ── flanges with bolt holes (inlet / outlet) ──────────────────── */
 [-3.95,3.95].forEach(x=>{
   cylX(.62,.62,.12,steelDark,x,0,0,null,32);
   [[.42,.42],[.42,-.42],[-.42,.42],[-.42,-.42]].forEach(p=>{
     cylX(.055,.055,.2,mat(0x3f4650,.9,.3),x,p[0],p[1]*0.8,null,10);
   });
 });

 /* ── head shield: ribbed half-shell over the top of the body ──── */
 const shieldM = new THREE.MeshStandardMaterial({ color:0xd5dbe3, metalness:.85, roughness:.4, transparent:true, opacity:.34, side:THREE.DoubleSide, depthWrite:false });
 const shield = new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,2.7,SEG,1,true,0,Math.PI), shieldM);
 shield.rotation.z = Math.PI/2; shield.scale.z = OVAL; root.add(shield);
 const ribM = mat(0xe2e8f0,.9,.3);
 for(let i=0;i<7;i++){
   const rib = new THREE.Mesh(new THREE.TorusGeometry(1.1,.022,6,SEG,Math.PI), ribM);
   rib.rotation.y = Math.PI/2; rib.scale.x = OVAL;
   rib.position.x = -1.2 + i*0.4; root.add(rib);
 }
 [-1.35,1.35].forEach(x=>{                          /* shield stand-offs */
   const st = new THREE.Mesh(new THREE.TorusGeometry(1.05,.03,6,SEG,Math.PI), steelDark);
   st.rotation.y = Math.PI/2; st.scale.x = OVAL; st.position.x = x; root.add(st);
 });

 /* ── honeycomb face texture: square channels (wall + dark cell) ── */
 const mkFace=(wall,cell)=>{
   const cv=document.createElement('canvas'); cv.width=cv.height=256;
   const g=cv.getContext('2d');
   g.fillStyle=wall; g.fillRect(0,0,256,256);
   g.fillStyle=cell;
   for(let x=0;x<256;x+=16) for(let y=0;y<256;y+=16) g.fillRect(x+3,y+3,10,10);
   return new THREE.CanvasTexture(cv);
 };
 const faceRh = mkFace('#d8c79a','#3a2e1a');      /* ceria + ceramic, Rh-coated  */
 const facePt = mkFace('#cdbf9d','#2b2a2e');      /* ceria + ceramic, Pt/Pd-coated */

 /* ── two ceramic monoliths with insulating mat ─────────────────── */
 const BR = {x0:-1.45,x1:-.35, y0:-.05,y1:1.45};
 const mkMono=()=>new THREE.MeshStandardMaterial({color:0xd9c9a3,roughness:.9,metalness:0,emissive:new THREE.Color(0x3a1000),emissiveIntensity:0});
 const monos=[0,1,2,3,4,5].map(mkMono);
 const len1=BR.x1-BR.x0, len2=BR.y1-BR.y0, c1=(BR.x0+BR.x1)/2, c2=(BR.y0+BR.y1)/2;
 /* three axial slices per brick so the light-off front can be seen travelling through it */
 for(let i=0;i<3;i++){
   oval(cylX(.86,.86,len1/3,monos[i],BR.x0+len1*(i+.5)/3,0,0,null,SEG));
   oval(cylX(.86,.86,len2/3,monos[3+i],BR.y0+len2*(i+.5)/3,0,0,null,SEG));
 }
 const matM = new THREE.MeshStandardMaterial({color:0x8a8068,roughness:1,metalness:0,side:THREE.DoubleSide});
 oval(cylX(.905,.905,len1,matM,c1,0,0,null,SEG,true));
 oval(cylX(.905,.905,len2,matM,c2,0,0,null,SEG,true));

 /* end faces (heat tints them) */
 const faceMats=[];
 const face=(x,rot,tex)=>{
   const fm=new THREE.MeshBasicMaterial({map:tex}); faceMats.push(fm);
   const m=new THREE.Mesh(new THREE.CircleGeometry(.86,SEG),fm);
   m.position.x=x; m.rotation.y=rot; m.scale.x=OVAL; root.add(m);
 };
 face(BR.x0-.003,-Math.PI/2,faceRh); face(BR.x1+.003,Math.PI/2,faceRh);
 face(BR.y0-.003,-Math.PI/2,facePt); face(BR.y1+.003,Math.PI/2,facePt);

 /* damage overlay: dark patches when the brick has melted */
 const damageM = new THREE.MeshBasicMaterial({ color:0x1a0f08, transparent:true, opacity:0, depthWrite:false });
 oval(cylX(.87,.87,len1+.02,damageM,c1,0,0,null,SEG));
 oval(cylX(.87,.87,len2+.02,damageM,c2,0,0,null,SEG));

 /* ── ceria oxygen-storage gauge (under the body) ───────────────── */
 const gx=.7, gy=-1.3;
 box(.16,.62,.16,glass(0xe2e8f0,.25),gx,gy,0);
 const oscFillM = new THREE.MeshStandardMaterial({color:0xfacc15,emissive:0xfacc15,emissiveIntensity:.5,roughness:.5});
 const oscFill = new THREE.Mesh(new THREE.BoxGeometry(.11,.56,.11), oscFillM);
 oscFill.position.set(gx,gy-.28,0); oscFill.scale.y=.01; root.add(oscFill);

 /* ── O2 sensors: pre-cat (O2 sensor position) and post-cat ─────── */
 const sensorBody = mat(0x4b5563,.7,.5);
 const mkTip=()=>new THREE.MeshStandardMaterial({ color:0x334155, emissive:0x22d3ee, emissiveIntensity:.9, metalness:.4, roughness:.5 });
 const preTipM=mkTip(), postTipM=mkTip();
 const wireM = mat(0x111827,.2,.8);
 const sensor=(x,tipM)=>{
   oval(cyl(.1,.1,.12,steelDark,x,.4,0,null,12));                        /* weld boss */
   cyl(.05,.05,.30,sensorBody,x,.55,0,null,10);
   const tip = new THREE.Mesh(new THREE.SphereGeometry(.075,12,10), tipM);
   tip.position.set(x,.76,0); root.add(tip);
   H.pipe([[x,.8,0],[x+.1,1.05,0],[x+.5,1.15,.2]],.014,wireM);         /* signal wire */
 };
 sensor(-2.8,preTipM); sensor(2.7,postTipM);

 /* ── magnified channel cut-away (lower-right, in front of the outlet) ── */
 const CX=2.8, CY=-.95, CZ=1.9, CL=1.7, CW=.62;
 const ceramicM=mat(0xd9c9a3,0,.9), washM=mat(0xe6d28a,0,.8);   /* wash-coat colour follows Ce4+/Ce3+ */
 const t=.07, w=.025;
 box(CL,t,CW,ceramicM,CX,CY+CW/2,CZ);                 /* roof */
 box(CL,t,CW,ceramicM,CX,CY-CW/2,CZ);                 /* floor */
 box(CL,CW,t,ceramicM,CX,CY,CZ-CW/2);                 /* back wall (front wall cut away) */
 box(CL,w,CW-t,washM,CX,CY+CW/2-t/2-w/2,CZ);          /* wash-coat layers */
 box(CL,w,CW-t,washM,CX,CY-CW/2+t/2+w/2,CZ);
 box(CL,CW-t,w,washM,CX,CY,CZ-CW/2+t/2+w/2);
 /* precious-metal sites: Pt (white), Pd (blue-grey), Rh (amber) */
 const sites=[];
 const metals=[[0xf8fafc,0],[0x94a3b8,1],[0xf59e0b,2]];
 const rnd=(i)=>{const x=Math.sin(i*91.7)*43758.5453; return x-Math.floor(x);};
 for(let i=0;i<(lowEnd?14:26);i++){
   const m=metals[i%3];
   const u=-CL/2+.1+rnd(i)*(CL-.2), v=(rnd(i+50)-.5)*(CW-.25);
   const face=i%3, r=.026;
   let p;
   if(face===0) p=[CX+u,CY-CW/2+t/2+w+r,CZ+v];            /* floor */
   else if(face===1) p=[CX+u,CY+CW/2-t/2-w-r,CZ+v];        /* roof  */
   else p=[CX+u,CY+v,CZ-CW/2+t/2+w+r];                     /* back  */
   const sm=mat(m[0],.9,.3,{emissive:m[0],emissiveIntensity:.25});
   sites.push(sm);
   sph(r,sm,p[0],p[1],p[2]);
 }
 /* dashed leader from the brick to the close-up */
 const leadM=new THREE.LineBasicMaterial({color:0xfb923c,transparent:true,opacity:.5});
 [[[1.0,-.62,.5],[CX-CL/2,CY+CW/2,CZ+CW/2]],[[1.3,-.55,.5],[CX-CL/2,CY-CW/2,CZ+CW/2]]].forEach(p=>{
   root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p.map(a=>new THREE.Vector3(a[0],a[1],a[2]))),leadM));
 });

 /* ── particle streams ──────────────────────────────────────────── */
 const RED=0xef4444, BLUE=0x38bdf8;
 const nIn  = lowEnd ? 10 : 16;
 const nMid = lowEnd ?  6 : 10;
 const nOut = lowEnd ? 10 : 18;
 const rawA = stream([[-4.6, .12,0],[-1.5, .12,0]], nIn, RED, .13);
 const rawB = stream([[-4.6,-.14,.04],[-1.5,-.14,.04]], nIn, RED, .13);
 const s1 = [.38,0,-.38].map(y=>stream([[BR.x0+.02,y,0],[BR.x1-.02,y,0]], nMid, RED, .09));
 const s2 = [.38,0,-.38].map(y=>stream([[BR.y0+.02,y,0],[BR.y1-.02,y,0]], nMid, 0xc084fc, .09));
 const cleanOut = stream([[1.5,-.14,0],[4.7,-.14,0]], nOut, BLUE, .12);
 const dirtyOut = stream([[1.5, .14,0],[4.7, .14,0]], nOut, RED, .12);
 /* close-up: individual molecules. Reactants (CO, NO, HC) drift along the channel, stop at a
    metal site, react (white flash) and leave as products (CO2, N2, H2O) - or slip past unconverted. */
 const MOL_N = lowEnd ? 9 : 15;
 const molGeo = new THREE.SphereGeometry(.036,10,8);
 const REACT = [0xef4444,0xfb923c,0xa16207], PROD = [0x67e8f9,0x38bdf8,0xbfdbfe];
 const mols = [];
 for(let i=0;i<MOL_N;i++){
   const mm=new THREE.MeshStandardMaterial({color:REACT[i%3],emissive:REACT[i%3],emissiveIntensity:.6,roughness:.4});
   const mesh=new THREE.Mesh(molGeo,mm); root.add(mesh); mols.push({mesh,mm,st:-1});
 }
 const siteY = CY-CW/2+t/2+w+.045;

 let lastDom = 0;

 return {
  labels:[
    ['Raw exhaust in (HC, CO, NOx)',[-3.8,.78,0]],
    ['Inlet flange',[-3.95,-.75,0]],
    ['Pre-cat O2 sensor position',[-2.8,1.05,0]],
    ['Stainless steel body',[-1.9,-.95,.5]],
    ['Head shield',[-.2,1.18,0]],
    ['Reduction catalyst (Rh) - NOx',[-.9,-.2,.7]],
    ['Oxidation catalyst (Pt/Pd) - CO, HC',[.7,.2,.7]],
    ['Ceria + ceramic honeycomb',[.7,-.78,.55]],
    ['Post-cat O2 sensor',[2.7,1.05,0]],
    ['Cleaned exhaust (H2O, CO2, N2)',[3.8,.78,0]],
    ['Ceria O2 store',[gx,gy-.5,0]],
    ['Cell close-up: CO, NO, HC react at Pt/Pd/Rh',[CX,CY+.5,CZ]]
  ],
  update(c){
   /* ── 1. inputs ─────────────────────────────────────────────── */
   const dt      = Math.max(0, num(c.dt, 0)) * S.speed;
   const L       = clamp(c.k, 0, 1);
   const rpm     = num(S.rpm, 1800);
   const misfire = clampN(S.misfire, 0, 1);
   const fault   = S.fault;
   const age     = AGE[S.age] ? S.age : 'new';
   const ageShift = AGE[age].shift;

   /* toolbar Reset rewinds simT -> detect and clear the model */
   if (sim.lastT >= 0 && c.t + 1e-4 < sim.lastT) resetModel();
   sim.lastT = c.t;

   /* ECU closed-loop dither: advance the wobble phase with sim time */
   if (dt > 0) sim.phase = (sim.phase + dt * DITHER_HZ * 2 * Math.PI) % (2 * Math.PI * 1000);
   const lamBias = FAULT_LAMBDA[fault] || 0;
   const lamAvg = clampN(num(S.lambda, 1) + lamBias, 0.7, 1.3);
   const lambda = lambdaNow(S.lambda, sim.phase, S.dither, lamBias);

   /* ── 2. engine-out chemistry, exhaust gas temperature, misfire heat ── */
   const raw     = engineOut(lambda, L, rpm, misfire);
   const egt     = exhaustGasTemp(L, rpm, 20);
   const heatGate = lightOff(sim.Tbed, ageShift);
   const mHeat   = misfireHeat(misfire, L) * heatGate;

   /* ── 3. brick temperatures: a chain of axial slices ─────────── */
   /* Each slice relaxes toward (upstream slice + the step in its own steady-state profile), so
      during warm-up the inlet end heats first and a light-off front travels downstream. The
      steady state adds the heat released by the CO/HC burnt on each brick (richer = hotter). */
   const nowCo = conversion('co', sim.Tbed, lambda, sim.poison, sim.damage, age);
   const nowHc = conversion('hc', sim.Tbed, lambda, sim.poison, sim.damage, age);
   const coF = 0.45 * nowCo, hcF = 0.35 * nowHc;
   const coR = conversion('co', sim.Trear, lambda, sim.poison, sim.damage, age) * (1 - coF);
   const hcR = conversion('hc', sim.Trear, lambda, sim.poison, sim.damage, age) * (1 - hcF);
   const exoF = exoHeat(raw.co, raw.hc, coF, hcF);
   const exoR = exoHeat(raw.co, raw.hc, coR, hcR);
   const tin  = egt + mHeat;
   const tgt = [];
   for (let i = 0; i < 3; i++) tgt[i] = tin + exoF * (i + 1) / 3;
   for (let i = 3; i < N_CELLS; i++) tgt[i] = tin + exoF - 25 + exoR * (i - 2) / 3 + 0.35 * mHeat * (i - 2) / 3;
   if (dt > 0) {
     let prevT = tin, prevTgt = tin;
     for (let i = 0; i < N_CELLS; i++) {
       const tau = i < 3 ? TAU_CELL : TAU_CELL_REAR;
       const drive = prevT + (tgt[i] - prevTgt);
       sim.cells[i] += (drive - sim.cells[i]) * (1 - Math.exp(-dt / tau));
       sim.cells[i] = clampN(sim.cells[i], -20, 1400);
       prevT = sim.cells[i]; prevTgt = tgt[i];
     }
   }
   sim.Tbed  = (sim.cells[0] + sim.cells[1] + sim.cells[2]) / 3;
   sim.Trear = (sim.cells[3] + sim.cells[4] + sim.cells[5]) / 3;
   const Thot = Math.max.apply(null, sim.cells);

   /* ── 4. poison (reversible), damage (permanent) ────────────── */
   if (dt > 0) {
     const pTarget = FAULT_POISON[fault] || 0;
     sim.poison += (pTarget - sim.poison) * (1 - Math.exp(-dt / 5));

     const dTarget = FAULT_DAMAGE[fault] || 0;
     if (sim.damage < dTarget) {
       sim.damage += (dTarget - sim.damage) * (1 - Math.exp(-dt / 4));
     }
     if (Thot > MELT_TEMP) {
       sim.damage = clampN(sim.damage + MELT_RATE * (Thot - MELT_TEMP) * dt, 0, 1);
     }
   }
   sim.poison = clampN(sim.poison, 0, 1);
   sim.damage = clampN(sim.damage, 0, 1);

   /* ── 5. ceria oxygen store, then conversion of the species ─── */
   const cap = oscCapacity(age, sim.poison, sim.damage);
   const hotGate = lightOff(sim.Trear, ageShift);
   if (dt > 0) sim.osc = oscStep(sim.osc, lambda, dt, hotGate * cap);
   const lamOx = effectiveLambda(lambda, sim.osc, cap, hotGate);

   /* stage 1 (Rh): reduces NOx, also takes some CO/HC with it */
   const nox1 = conversion('nox', sim.Tbed, lambda, sim.poison, sim.damage, age);
   const co1  = coF;
   const hc1  = hcF;
   /* stage 2 (Pt/Pd): burns the CO/HC left over, using stored O2 */
   const co2  = conversion('co', sim.Trear, lamOx, sim.poison, sim.damage, age);
   const hc2  = conversion('hc', sim.Trear, lamOx, sim.poison, sim.damage, age);
   const co  = inSeries(co1, co2);
   const hc  = inSeries(hc1, hc2);
   const nox = nox1;
   const stage1 = (co1 / 0.45 + nox1) / 2;       /* 0..1 how hard the front brick is working */

   /* tailpipe ppm and by-products, smoothed so the readouts do not flicker with the dither */
   const bp2 = byProducts(raw.nox, nox, lambda, sim.Tbed);
   const cur = { rco: raw.co, rhc: raw.hc, rnox: raw.nox, tco: raw.co * (1 - co), thc: raw.hc * (1 - hc), tnox: raw.nox * (1 - nox), nh3: bp2.nh3, n2o: bp2.n2o };
   if (!sim.disp) sim.disp = Object.assign({}, cur);
   else if (dt > 0) { const k = 1 - Math.exp(-dt / 1.5); for (const key in cur) sim.disp[key] += (cur[key] - sim.disp[key]) * k; }
   const D = sim.disp;
   const insp = inspectionVerdict(D.tco / 10000, D.thc, lamAvg, sim.Trear > MONITOR_MIN_T);

   /* ── 6. exhaust flow proxy (0..1.2) and back pressure ──────── */
   const flowNorm = clampN(0.10 + 0.85 * (0.45 * L + 0.55 * clampN((rpm - 800) / 4200, 0, 1)), 0.05, 1.2);
   const bp = backpressure(flowNorm, sim.damage);

   /* ── 7. ECU view: post-cat O2 + P0420 latching ─────────────── */
   const sensorOk = (fault !== 'sensor');
   const swing = (1 - cap) * 0.25 * Math.sin(sim.phase * 1.0);   /* weak ceria -> downstream sensor follows upstream */
   const o2v = postCatO2Voltage(co, sensorOk, swing);
   const ecuEff = sensorOk ? co * (0.35 + 0.65 * cap) : 0.92;   /* P0420 monitors oxygen-storage, not just CO */

   /* enabling condition: like a real catalyst monitor, only judge the brick once it is warm */
   const monitorOn = sim.Trear > MONITOR_MIN_T;
   if (monitorOn && ecuEff < P0420_LIMIT) {
     if (dt > 0) sim.p0420Timer += dt;
     if (sim.p0420Timer >= P0420_DELAY) sim.p0420 = true;
   } else {
     if (dt > 0) sim.p0420Timer = Math.max(0, sim.p0420Timer - dt * 0.5);
     if (sim.p0420Timer <= 0) sim.p0420 = false;
   }

   /* ── 8. derived state string ───────────────────────────────── */
   let stateTxt;
   if (Thot < 200)                 stateTxt = 'Cold - not lit off';
   else if (Thot < 320 + ageShift) stateTxt = 'Light-off';
   else if (Thot <= 850)           stateTxt = 'Operating';
   else if (Thot <= MELT_TEMP)     stateTxt = 'Overheat risk';
   else                            stateTxt = 'MELTDOWN';
   if (sim.p0420)                  stateTxt += ' | P0420';

   /* ── 9. 3D visuals ─────────────────────────────────────────── */
   const cellHot = sim.cells.map(T => clampN((T - 250) / 600, 0, 1));
   monos.forEach((m, i) => {
     m.emissive.copy(lc(0x3a1000, 0xff5a1f, cellHot[i]));
     m.emissiveIntensity = 0.04 + 1.65 * cellHot[i];
     m.color.copy(lc(0xd9c9a3, 0x5a4a35, sim.poison));
   });
   [[0,0],[1,2],[2,3],[3,5]].forEach(p => faceMats[p[0]].color.copy(lc(0xffffff, 0xff9a60, cellHot[p[1]])));
   /* the shell and head shield warm up with the bed */
   const shellHot = clampN((Thot - 300) / 600, 0, 1);
   shieldM.color.copy(lc(0xd5dbe3, 0xff8a4a, shellHot * 0.8));
   shieldM.opacity = 0.34 + 0.25 * shellHot;
   /* ceria wash-coat colour: pale yellow (Ce4+, loaded with O2) <-> grey-blue (Ce3+, depleted) */
   washM.color.copy(lc(0x8fa3b8, 0xe6d28a, sim.osc));
   /* precious-metal sites glow while they work */
   const work = clampN((co + nox + hc) / 3, 0, 1);
   sites.forEach((sm, i) => { sm.emissiveIntensity = 0.2 + 0.9 * work * (0.5 + 0.5 * Math.sin(c.t * 5 + i * 1.7)); });
   /* molecules in the close-up */
   const mvel = (0.05 + 0.32 * flowNorm) * 2.5;
   mols.forEach((o, i) => {
     const type = i % 3;
     const p = i / MOL_N + c.t * mvel, k = Math.floor(p), u = p - k;
     const conv = type === 0 ? co : (type === 1 ? nox : hc);
     const reacts = rnd(i * 7.13 + k * 3.7) < conv;
     const after = reacts && u > 0.5;
     const w0 = Math.exp(-Math.pow((u - 0.5) / 0.07, 2));
     const flash = reacts && Math.abs(u - 0.5) < 0.045;
     const st = flash ? 2 : (after ? 1 : 0);
     if (st !== o.st) {
       o.st = st;
       const col = st === 2 ? 0xffffff : (st === 1 ? PROD[type] : REACT[type]);
       o.mm.color.setHex(col); o.mm.emissive.setHex(col);
     }
     const lane = ((i * 5) % 7 - 3) * 0.065;
     const y0 = CY + lane + Math.sin(c.t * 6 + i) * 0.012;
     o.mesh.position.set(CX - CL / 2 + 0.06 + u * (CL - 0.12), y0 + (siteY - y0) * w0 * 0.9, CZ + ((i * 3) % 5 - 2) * 0.05);
     const sc = 1 + (reacts ? 1.1 * w0 : 0) + (st === 1 && type === 0 ? 0.25 : 0);
     o.mesh.scale.set(sc, sc, sc);
   });
   damageM.opacity = 0.05 + 0.62 * sim.damage;

   /* ceria gauge: height = fill, colour = empty (blue) -> full (amber) */
   oscFill.scale.y = Math.max(0.01, sim.osc);
   oscFill.position.y = gy - 0.28 + 0.28 * Math.max(0.01, sim.osc);
   oscFillM.color.copy(lc(0x38bdf8, 0xfacc15, sim.osc));
   oscFillM.emissive.copy(oscFillM.color);

   /* O2 sensor tips: post-cat tip turns red on sensor failure */
   preTipM.emissiveIntensity = 0.55 + 0.55 * (0.5 + 0.5 * Math.sin(c.t * 3.0));
   if (fault === 'sensor') {
     postTipM.emissive.setHex(0xef4444);
     postTipM.emissiveIntensity = 0.30 + 0.15 * (0.5 + 0.5 * Math.sin(c.t * 2.0));
   } else {
     postTipM.emissive.setHex(0x22d3ee);
     postTipM.emissiveIntensity = 0.35 + 0.95 * clampN(o2v / 0.9, 0, 1);
   }

   /* streams: density follows flow; red (raw) -> blue (clean) follows conversion */
   const dens = clampN(flowNorm / 1.05, 0.05, 1);
   const spd  = 0.05 + 0.32 * flowNorm;
   rawA.update(c.t, spd, dens);
   rawB.update(c.t, spd, dens);
   const midMix = (co + hc + nox) / 3;
   s1.forEach(s => { s.mat.color.copy(lc(0xef4444, 0xf59e0b, stage1)); s.update(c.t, spd, dens * (1 - 0.35 * stage1)); });
   s2.forEach(s => { s.mat.color.copy(lc(0xef4444, 0x38bdf8, midMix)); s.update(c.t, spd, dens * (0.6 + 0.4 * midMix)); });
   cleanOut.update(c.t, spd, dens * midMix);
   dirtyOut.update(c.t, spd, dens * (1 - midMix));

   /* ── 10. throttled DOM work (graph + warning banner) ───────── */
   const now = performance.now();
   if (now - lastDom > 140) {
     lastDom = now;
     if (dt > 0) traceSample = [traceN(co, 0, 1), traceN(sim.Tbed, 0, 1000), traceN(sim.osc, 0, 1)];
     let warn = FAULT_INFO[fault] ? FAULT_INFO[fault].warn : '';
     if (!warn) {
       if (sim.p0420) {
         warn = 'P0420 - catalyst efficiency below threshold. The ECU has compared the pre- and post-cat O2 signals and decided the brick is not converting enough.';
       } else if (Thot > MELT_TEMP) {
         warn = 'Catalyst bed at ' + Thot.toFixed(0) + ' °C - the ceramic substrate is melting. Damage is permanent until Reset.';
       } else if (misfire > 0.55 && Thot > 780) {
         warn = 'Severe misfire is dumping raw fuel onto the catalyst. Bed temperature is climbing past the safe operating window.';
       } else if (sim.damage > 0.35) {
         warn = 'Substrate damage ' + (sim.damage * 100).toFixed(0) + ' % - back pressure is rising and conversion has fallen.';
       } else if (sim.poison > 0.35) {
         warn = 'Catalyst contamination ' + (sim.poison * 100).toFixed(0) + ' % - the precious-metal sites are being blocked.';
       } else if (lambda < 0.93 && Thot > 700) {
         warn = 'Rich mixture is burning on the catalyst and heating it to ' + Thot.toFixed(0) + ' °C. Expect ammonia and a rotten-egg smell.';
       } else if (age === 'worn') {
         warn = 'Worn catalyst - light-off is late and oxygen storage is low. Expect P0420 soon.';
       } else if (hotGate > 0.5 && cap > 0.3 && (sim.osc > 0.92 || sim.osc < 0.08)) {
         warn = sim.osc > 0.92 ? 'Ceria store full - lean exhaust now passes straight through, so NOx rises.' : 'Ceria store empty - rich exhaust now passes straight through, so CO and HC rise.';
       }
     }
     warnText = warn;
   }

   /* ── 11. readouts ──────────────────────────────────────────── */
   const coState  = co  < 0.70 ? 'crit' : (co  < 0.90 ? 'warn' : 'ok');
   const hcState  = hc  < 0.70 ? 'crit' : (hc  < 0.90 ? 'warn' : 'ok');
   const nxState  = nox < 0.65 ? 'crit' : (nox < 0.85 ? 'warn' : 'ok');
   const bpState  = bp > 18 ? 'crit' : (bp > 10 ? 'warn' : 'ok');
   const tState  = (T) => T < 200 ? 'warn' : (T > MELT_TEMP ? 'crit' : (T > 880 ? 'warn' : 'ok'));
   const oscState = (hotGate < 0.3) ? '' : ((sim.osc > 0.92 || sim.osc < 0.08) ? 'warn' : 'ok');
   const stState  = (Thot > MELT_TEMP || sim.p0420) ? 'crit'
                  : (Thot < 320 + ageShift || Thot > 850) ? 'warn' : 'ok';
   const o2State  = fault === 'sensor' ? 'crit' : 'ok';

   let tr;
   if (traceClear) { traceClear = false; traceSample = null; tr = { hist: null }; }
   else if (traceSample) { tr = { hist: traceSample }; traceSample = null; }

   return {
     big: (co * 100).toFixed(0),
     unit: ' % CO',
     bar: clampN(co * 100, 0, 100),
     rows: {
       hc:  (hc  * 100).toFixed(0) + ' %',
       nox: (nox * 100).toFixed(0) + ' %'
     },
     ro: {
       temp:  [sim.Tbed.toFixed(0) + ' °C', tState(sim.Tbed)],
       temp2: [sim.Trear.toFixed(0) + ' °C', tState(sim.Trear)],
       egt:   [egt.toFixed(0) + ' °C', egt > 780 ? 'warn' : ''],
       co:    [(co  * 100).toFixed(0) + ' %', coState],
       hc:    [(hc  * 100).toFixed(0) + ' %', hcState],
       nox:   [(nox * 100).toFixed(0) + ' %', nxState],
       lam:   [lambda.toFixed(2), Math.abs(lambda - 1.0) > 0.05 ? 'warn' : 'ok'],
       raw:   ['CO ' + fmtPpm(D.rco) + ' · HC ' + fmtPpm(D.rhc) + ' · NOx ' + fmtPpm(D.rnox), ''],
       tail:  ['CO ' + fmtPpm(D.tco) + ' · HC ' + fmtPpm(D.thc) + ' · NOx ' + fmtPpm(D.tnox), (D.tco > 3000 || D.thc > 200 || D.tnox > 400) ? 'warn' : 'ok'],
       byp:   ['NH3 ' + fmtPpm(D.nh3) + ' · N2O ' + fmtPpm(D.n2o), (D.nh3 > 100 || D.n2o > 60) ? 'warn' : ''],
       insp:  [insp.txt, insp.tone],
       osc:   [(sim.osc * 100).toFixed(0) + ' % of ' + (cap * 100).toFixed(0) + ' %', oscState],
       rxn:   [dominantReaction(sim.Tbed, sim.Trear, lambda, ageShift), ''],
       bp:    [bp.toFixed(1) + ' kPa', bpState],
       o2:    [o2v.toFixed(2) + ' V',  o2State],
       state: [stateTxt, stState]
     },
     status: [warnText || stateTxt, true, warnText ? 'warn' : ''],
      traces: tr,
     ctl: (L * 100).toFixed(0) + ' %'
   };
  }
 };
}

/* Phase 6: every option / action lives in the dock (controls.js), nothing interactive is left in the panel.
   'Time scale' is the module's own physics time-compression (thermal warm-up); the menu's Sim speed is separate. */
CFG.options = [
  { id: "fault", type: 'choice', layout: 'select', label: "Fault injection", options: Object.keys(FAULT_INFO).map(id => ({ id, label: FAULT_INFO[id].label })), def: 'none',
    onChange: (id) => { S.fault = id; } },
  { id: "age", type: 'choice', layout: 'segmented', label: "Catalyst age", options: Object.keys(AGE).map(id => ({ id, label: AGE[id].label })), def: 'new',
    onChange: (id) => { S.age = AGE[id] ? id : 'new'; } },
  { id: "dither", type: 'toggle', label: "ECU lambda dither", def: true,
    onChange: (on) => { S.dither = !!on; } },
  { id: 'timeScale', type: 'choice', layout: 'segmented', label: 'Time scale', options: [{ id: '1', label: '1×' }, { id: '5', label: '5×' }, { id: '20', label: '20×' }], def: '1',
    onChange: (id) => { S.speed = Number(id) || 1; } },
  { id: "cold", type: 'action', label: "Cold start",
    onAction: () => { coldCells(); sim.osc = 0.5; } }
];
CFG.onReset = resetAll;      /* the dock Reset runs the module reset (model + every control) */
/* Phase 7a: the old history canvas is a Monitor trace. All series are drawn as 0..100 % of their old axis ranges. */
CFG.traces = [{ id: 'hist', label: 'Conversion, catalyst temperature and ceria fill history (% of full scale)', min: 0, max: 100, length: 150,
  series: [
    { id: 'a', label: 'CO conv. %', color: 'var(--accent)' },
    { id: 'b', label: 'Bed \u00B0C', color: 'var(--warn)' },
    { id: 'c', label: 'Ceria O2 %', color: 'var(--ok)' }
  ] }];
runGuidedModule(CFG, build);
</script>
</body>
</html>
