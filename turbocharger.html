<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d13">
<title>Turbocharger — Auto Lab</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="controls.css">
</head>
<body>
  <div id="canvas-wrap"></div>
  <div id="labels-root"></div>

  <script src="guard.js"></script>
  <script type="importmap">
  { "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import * as Base from './kit.js';
import { Parts } from './components.js';
  import { UI } from './kit.js';

  const TAU = Base.TAU;
  const DEG = Base.DEG;

  /* ═══════════════════════════════════════════════════════════
     ADAPTIVE QUALITY
     ═══════════════════════════════════════════════════════════ */
  const isCoarse = matchMedia('(pointer: coarse)').matches;
  const cores    = navigator.hardwareConcurrency || 4;
  const mem      = navigator.deviceMemory || 4;
  const isLowEnd = cores <= 4 || mem <= 2;
  const isMidEnd = !isLowEnd && (cores <= 6 || isCoarse);

  const BLADE_N  = isLowEnd ? 8 : 12;
  const TUBE_RAD = isLowEnd ? 8 : 12;

  const P = {
    fresh:   isLowEnd ? 10 : isMidEnd ? 16 : 24,
    charge:  isLowEnd ? 34 : isMidEnd ? 56 : 84,
    cooled:  isLowEnd ? 40 : isMidEnd ? 64 : 96,
    exhaust: isLowEnd ? 34 : isMidEnd ? 54 : 80,
    tail:    isLowEnd ? 18 : isMidEnd ? 28 : 40,
    cyl:     isLowEnd ? 14 : isMidEnd ? 24 : 36,
    swirl:   isLowEnd ?  6 : isMidEnd ?  8 : 12,
    bov:     isLowEnd ? 12 : isMidEnd ? 18 : 24,
    wg:      isLowEnd ?  8 : isMidEnd ? 11 : 14
  };

  /* ═══════════════════════════════════════════════════════════
     SCENE
     ═══════════════════════════════════════════════════════════ */
  const { scene, camera, renderer, controls, wrap, viewManager } = Base.buildScene({
    fov: 42,
    camPos: isCoarse ? [1.5, 1.5, 5.5] : [1.8, 1.8, 6.5],
    target: [0.1, 0.25, 0],
    floorY: -2.15
  });
  Base.attachResize(camera, renderer, wrap, 42);
  const particleTex = Base.createParticleTexture();
  const labels = Base.createLabelSystem();
  const state  = Base.createUIState();

  /* ═══════════════════════════════════════════════════════════
     MATERIALS
     ═══════════════════════════════════════════════════════════ */
  const glassPipe = new THREE.MeshStandardMaterial({
    color: 0x9bb6cc, metalness: 0.55, roughness: 0.16,
    transparent: true, opacity: 0.28, depthWrite: false, side: THREE.FrontSide
  });
  const glassHousing = new THREE.MeshStandardMaterial({
    color: 0xaebfd2, metalness: 0.35, roughness: 0.22,
    transparent: true, opacity: 0.22, depthWrite: false, side: THREE.FrontSide
  });

  const M = {
    steel:        new THREE.MeshStandardMaterial({ color: 0xa8b0be, metalness: 0.88, roughness: 0.28 }),
    steelDark:    new THREE.MeshStandardMaterial({ color: 0x3d4555, metalness: 0.78, roughness: 0.42 }),
    alum:         new THREE.MeshStandardMaterial({ color: 0xc5ccd6, metalness: 0.82, roughness: 0.28 }),
    engineBlock:  new THREE.MeshStandardMaterial({ color: 0x6a7383, metalness: 0.62, roughness: 0.50 }),
    engineCut:    new THREE.MeshStandardMaterial({ color: 0xc45c2a, metalness: 0.15, roughness: 0.70, side: THREE.DoubleSide }),
    piston:       new THREE.MeshStandardMaterial({ color: 0xd4dbe6, metalness: 0.65, roughness: 0.32 }),
    ring:         new THREE.MeshStandardMaterial({ color: 0x6b7280, metalness: 0.90, roughness: 0.20 }),
    rod:          new THREE.MeshStandardMaterial({ color: 0x8a94a5, metalness: 0.85, roughness: 0.30 }),
    valve:        new THREE.MeshStandardMaterial({ color: 0xb8c0cc, metalness: 0.80, roughness: 0.25 }),
    spring:       new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.85, roughness: 0.30 }),
    sparkIns:     new THREE.MeshStandardMaterial({ color: 0xf1f5f9, metalness: 0.05, roughness: 0.40 }),
    bladeCold:    new THREE.MeshStandardMaterial({ color: 0xc8d0dd, metalness: 0.88, roughness: 0.25, transparent: true, opacity: 1, depthWrite: false }),
    bladeHot:     new THREE.MeshStandardMaterial({ color: 0xb9c1ce, metalness: 0.88, roughness: 0.28, transparent: true, opacity: 1, depthWrite: false }),
    shaft:        new THREE.MeshStandardMaterial({ color: 0x8a94a5, metalness: 0.90, roughness: 0.25 }),
    accent:       new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x38bdf8, emissiveIntensity: 0.9 }),
    icCore:       new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.82, roughness: 0.32 }),
    icFin:        new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.85, roughness: 0.40 }),
    icTank:       new THREE.MeshStandardMaterial({ color: 0x4a5568, metalness: 0.70, roughness: 0.42 }),
    filter:       new THREE.MeshStandardMaterial({ color: 0xb0b8c4, metalness: 0.65, roughness: 0.45 }),
    valveBrass:   new THREE.MeshStandardMaterial({ color: 0xc4874a, metalness: 0.80, roughness: 0.32 }),
    valveCap:     new THREE.MeshStandardMaterial({ color: 0xe0a94a, metalness: 0.90, roughness: 0.25 }),
    scBody:       new THREE.MeshStandardMaterial({ color: 0x7d869a, metalness: 0.78, roughness: 0.32 }),
    scTop:        new THREE.MeshPhysicalMaterial({ color: 0xaebfd2, metalness: 0.30, roughness: 0.20, transmission: 0.0, transparent: true, opacity: 0.35, depthWrite: false, side: THREE.DoubleSide }),
    scRotor:      new THREE.MeshStandardMaterial({ color: 0xdadfe8, metalness: 0.92, roughness: 0.18 }),
    scSnout:      new THREE.MeshStandardMaterial({ color: 0x4e5768, metalness: 0.85, roughness: 0.32 }),
    scPulley:     new THREE.MeshStandardMaterial({ color: 0x9aa3b0, metalness: 0.90, roughness: 0.24 }),
    belt:         new THREE.MeshStandardMaterial({ color: 0x14171d, metalness: 0.20, roughness: 0.88 })
  };

  const system = new THREE.Group();
  scene.add(system);

  /* ═══════════════════════════════════════════════════════════
     LAYOUT
     ═══════════════════════════════════════════════════════════ */
  const FILTER  = new THREE.Vector3(-1.50,  1.20, 0);
  const COMP    = new THREE.Vector3(-0.45,  1.20, 0);
  const BEARING = new THREE.Vector3( 0.00,  1.20, 0);
  const TURB    = new THREE.Vector3( 0.45,  1.20, 0);

  const IC_POS  = new THREE.Vector3(-1.10, -0.75, 0.35);
  const IC_W    = 1.10, IC_H = 0.45, IC_D = 0.34;

  const ENG     = new THREE.Vector3( 0.80, -0.75, 0);
  const BORE    = 0.30;
  const CRANK_R = 0.16;
  const ROD_LEN = 0.68;
  const CYL_BOTTOM = ENG.y + 0.05;
  const CYL_TOP    = ENG.y + 1.05;
  const CRANK_Y    = ENG.y - 0.55;
  const EY = (worldY) => worldY - ENG.y;

  const SC_POS   = new THREE.Vector3(ENG.x, ENG.y + 1.55, 0);
  const SC_W     = 0.95, SC_H = 0.50, SC_D = 0.75;
  const SC_PUL_Z = 0.75;
  const CRANK_PUL_Z = 0.75;
  const SC_PUL_R = 0.20;
  const CRANK_PUL_R = 0.20;
  const SC_PUL_Y = SC_POS.y - SC_H * 0.10;
  const CRANK_PUL_Y = ENG.y - 0.75;

  const PORT = {
    filterOut : new THREE.Vector3(FILTER.x + 0.16,  FILTER.y, 0),
    compIn    : new THREE.Vector3(COMP.x - 0.38,    COMP.y, 0),
    compOut   : new THREE.Vector3(COMP.x,           COMP.y - 0.55, 0),
    turbIn    : new THREE.Vector3(TURB.x,           TURB.y - 0.56, 0),
    turbOut   : new THREE.Vector3(TURB.x + 0.40,    TURB.y, 0),
    icIn      : new THREE.Vector3(IC_POS.x - IC_W/2 - 0.05, IC_POS.y + IC_H/2 + 0.15, IC_POS.z),
    icOut     : new THREE.Vector3(IC_POS.x + IC_W/2 + 0.05, IC_POS.y + IC_H/2 + 0.15, IC_POS.z),
    intake    : new THREE.Vector3(ENG.x - BORE - 0.22, CYL_TOP + 0.14, 0),
    exhaust   : new THREE.Vector3(ENG.x + BORE + 0.22, CYL_TOP + 0.14, 0),
    scIn      : new THREE.Vector3(SC_POS.x - 0.30, SC_POS.y + SC_H/2 + 0.05, 0),
    scOut     : new THREE.Vector3(SC_POS.x + 0.10, SC_POS.y - SC_H/2 - 0.05, 0)
  };

  /* ═══════════════════════════════════════════════════════════
     HELPERS
     ═══════════════════════════════════════════════════════════ */
  function makeOrthoCurve(waypoints) {
    const path = new THREE.CurvePath();
    for (let i = 0; i < waypoints.length - 1; i++) {
      const a = waypoints[i], b = waypoints[i + 1];
      if (a.distanceTo(b) < 1e-4) continue;
      path.add(new THREE.LineCurve3(a.clone(), b.clone()));
    }
    return path;
  }

  function makeStraightPipe(waypoints, radius, mat) {
    const group = new THREE.Group();
    for (let i = 0; i < waypoints.length - 1; i++) {
      const a = waypoints[i], b = waypoints[i + 1];
      const dir = new THREE.Vector3().subVectors(b, a);
      const len = dir.length();
      if (len < 1e-4) continue;
      const geo = new THREE.CylinderGeometry(radius, radius, len, TUBE_RAD, 1, false);
      const mesh = new THREE.Mesh(geo, mat || glassPipe);
      mesh.position.copy(a).addScaledVector(dir, 0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
      mesh.renderOrder = 2;
      group.add(mesh);
    }
    for (let i = 1; i < waypoints.length - 1; i++) {
      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(radius, TUBE_RAD, 8),
        mat || glassPipe
      );
      sphere.position.copy(waypoints[i]);
      sphere.renderOrder = 2;
      group.add(sphere);
    }
    return group;
  }

  function addCollarAt(point, dir, radius) {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(radius + 0.013, 0.018, 8, 18),
      M.steelDark
    );
    ring.position.copy(point);
    ring.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir.clone().normalize());
    ring.castShadow = true;
    system.add(ring);
  }

  function makeImpeller(radius, blades, bladeMat, hubMat, tilt = 0.35, lenScale = 0.65) {
    const g = new THREE.Group();
    const hub = new THREE.Mesh(
      new THREE.CylinderGeometry(radius * 0.30, radius * 0.30, 0.08, 20), hubMat);
    hub.rotation.z = Math.PI / 2; g.add(hub);
    const bladeLen = radius * lenScale;
    const bladeGeo = new THREE.BoxGeometry(0.028, bladeLen, radius * 0.16);
    for (let i = 0; i < blades; i++) {
      const a = (i / blades) * TAU;
      const blade = new THREE.Mesh(bladeGeo, bladeMat);
      blade.position.set(0, Math.cos(a) * radius * 0.60, Math.sin(a) * radius * 0.60);
      blade.rotation.x = a + tilt;
      blade.castShadow = true;
      g.add(blade);
    }
    return g;
  }

  function makeStreakTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const g = c.getContext('2d');
    g.translate(128, 128);
    const grd = g.createRadialGradient(0, 0, 18, 0, 0, 126);
    grd.addColorStop(0,    'rgba(255,255,255,0.85)');
    grd.addColorStop(0.72, 'rgba(255,255,255,0.18)');
    grd.addColorStop(1,    'rgba(255,255,255,0)');
    g.fillStyle = grd;
    g.beginPath(); g.arc(0, 0, 126, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.85)';
    for (let i = 0; i < 70; i++) {
      const a0 = Math.random() * TAU;
      const r  = 30 + Math.random() * 90;
      g.globalAlpha = 0.06 + Math.random() * 0.18;
      g.lineWidth = 1 + Math.random() * 2.5;
      g.beginPath();
      g.arc(0, 0, r, a0, a0 + 0.25 + Math.random() * 0.6);
      g.stroke();
    }
    g.globalAlpha = 1;
    return new THREE.CanvasTexture(c);
  }
  const streakTex = makeStreakTexture();

  /* ═══════════════════════════════════════════════════════════
     AIR FILTER (shared)
     ═══════════════════════════════════════════════════════════ */
  const airFilter = new THREE.Group();
  airFilter.position.copy(FILTER);
  system.add(airFilter);

  const afBody = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.30, 20), M.filter);
  afBody.rotation.z = Math.PI / 2;
  afBody.castShadow = true;
  airFilter.add(afBody);
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * TAU;
    const rib = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.015, 0.05), M.steelDark);
    rib.position.set(0, Math.cos(a) * 0.22, Math.sin(a) * 0.22);
    rib.rotation.x = a;
    airFilter.add(rib);
  }

  /* ═══════════════════════════════════════════════════════════
     INTERCOOLER (shared)
     ═══════════════════════════════════════════════════════════ */
  const intercooler = new THREE.Group();
  intercooler.position.copy(IC_POS);
  system.add(intercooler);

  const _im = new THREE.Object3D();
  const IC_ROWS = isLowEnd ? 6 : 10;
  const IC_ROW_GAP = 0.011;
  const rowH = ((IC_H - 0.06) - (IC_ROWS - 1) * IC_ROW_GAP) / IC_ROWS;
  const rowMesh = new THREE.InstancedMesh(
    new THREE.BoxGeometry(IC_W - 0.02, rowH, IC_D - 0.02), M.icCore, IC_ROWS
  );
  for (let i = 0; i < IC_ROWS; i++) {
    _im.position.set(0, -(IC_H - 0.06) / 2 + rowH / 2 + i * (rowH + IC_ROW_GAP), 0);
    _im.updateMatrix();
    rowMesh.setMatrixAt(i, _im.matrix);
  }
  rowMesh.castShadow = true;
  intercooler.add(rowMesh);

  const IC_FINS = isLowEnd ? 15 : 27;
  const finStep = (IC_W - 0.04) / (IC_FINS - 1);
  const finMesh = new THREE.InstancedMesh(
    new THREE.BoxGeometry(0.0065, IC_H - 0.05, IC_D + 0.035), M.icFin, IC_FINS
  );
  for (let i = 0; i < IC_FINS; i++) {
    _im.position.set(-(IC_W - 0.04) / 2 + i * finStep, 0, 0);
    _im.updateMatrix();
    finMesh.setMatrixAt(i, _im.matrix);
  }
  finMesh.castShadow = true;
  intercooler.add(finMesh);

  const headerGeo = new THREE.BoxGeometry(IC_W + 0.03, 0.028, IC_D + 0.05);
  const headerTop = new THREE.Mesh(headerGeo, M.icTank); headerTop.position.y =  IC_H / 2 - 0.014;
  const headerBot = new THREE.Mesh(headerGeo, M.icTank); headerBot.position.y = -IC_H / 2 + 0.014;
  headerTop.castShadow = headerBot.castShadow = true;
  intercooler.add(headerTop, headerBot);

  const tankGeo = new THREE.CapsuleGeometry(IC_D * 0.52, IC_H - IC_D * 1.04, 6, 16);
  const tankL = new THREE.Mesh(tankGeo, M.icTank);
  tankL.scale.set(0.36, 1, 1); tankL.position.x = -IC_W / 2 - 0.05; tankL.castShadow = true;
  const tankR = tankL.clone(); tankR.position.x =  IC_W / 2 + 0.05;
  intercooler.add(tankL, tankR);

  const IC_NOZ_Y = IC_H / 2 + 0.06;
  function makeIcNozzle() {
    const g = new THREE.Group();
    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.082, 0.082, 0.18, 18), M.icTank);
    g.add(neck);
    const bead = new THREE.Mesh(new THREE.TorusGeometry(0.084, 0.015, 8, 20), M.steelDark);
    bead.rotation.x = Math.PI / 2; bead.position.y = 0.088; g.add(bead);
    return g;
  }
  const icInlet  = makeIcNozzle(); icInlet.position.set(-IC_W / 2 - 0.05, IC_NOZ_Y, 0);
  const icOutlet = makeIcNozzle(); icOutlet.position.set( IC_W / 2 + 0.05, IC_NOZ_Y, 0);
  intercooler.add(icInlet, icOutlet);

  /* ═══════════════════════════════════════════════════════════
     ENGINE (shared cutaway)
     ═══════════════════════════════════════════════════════════ */
  const engineGroup = new THREE.Group();
  engineGroup.position.copy(ENG);
  system.add(engineGroup);

  const crankBase = new THREE.Mesh(new THREE.BoxGeometry(BORE * 3.2, 0.55, BORE * 3.2), M.engineBlock);
  crankBase.position.y = -0.72; crankBase.castShadow = true;
  engineGroup.add(crankBase);

  const wallT = 0.05;
  const cylBack = new THREE.Mesh(new THREE.BoxGeometry(BORE * 2 + wallT * 2, CYL_TOP - CYL_BOTTOM, wallT), M.engineBlock);
  cylBack.position.set(0, EY((CYL_TOP + CYL_BOTTOM) / 2), -BORE - wallT);
  cylBack.castShadow = true; engineGroup.add(cylBack);

  const cylLeft = new THREE.Mesh(new THREE.BoxGeometry(wallT, CYL_TOP - CYL_BOTTOM, BORE * 2), M.engineBlock);
  cylLeft.position.set(-BORE - wallT/2, EY((CYL_TOP + CYL_BOTTOM) / 2), 0);
  cylLeft.castShadow = true; engineGroup.add(cylLeft);

  const cylRight = new THREE.Mesh(new THREE.BoxGeometry(wallT, CYL_TOP - CYL_BOTTOM, BORE * 2), M.engineBlock);
  cylRight.position.set(BORE + wallT/2, EY((CYL_TOP + CYL_BOTTOM) / 2), 0);
  cylRight.castShadow = true; engineGroup.add(cylRight);

  const cutMat = M.engineCut;
  const cutBack = new THREE.Mesh(new THREE.PlaneGeometry(wallT * 2 + BORE * 2, CYL_TOP - CYL_BOTTOM), cutMat);
  cutBack.position.set(0, EY((CYL_TOP + CYL_BOTTOM) / 2), -BORE - wallT + 0.001);
  engineGroup.add(cutBack);

  const headWidth = BORE * 2 + wallT * 2;
  const headHeight = 0.30;
  const headDepth = BORE * 2 + wallT * 2;

  const headTop = new THREE.Mesh(new THREE.BoxGeometry(headWidth, 0.05, headDepth), M.engineBlock);
  headTop.position.y = EY(CYL_TOP) + headHeight - 0.025;
  headTop.castShadow = true; engineGroup.add(headTop);

  const headBack = new THREE.Mesh(new THREE.BoxGeometry(headWidth, headHeight - 0.05, wallT), M.engineBlock);
  headBack.position.set(0, EY(CYL_TOP) + headHeight/2, -BORE - wallT);
  engineGroup.add(headBack);

  const headLeft = new THREE.Mesh(new THREE.BoxGeometry(wallT, headHeight - 0.05, headDepth), M.engineBlock);
  headLeft.position.set(-BORE - wallT/2, EY(CYL_TOP) + headHeight/2, 0);
  engineGroup.add(headLeft);

  const headRight = new THREE.Mesh(new THREE.BoxGeometry(wallT, headHeight - 0.05, headDepth), M.engineBlock);
  headRight.position.set(BORE + wallT/2, EY(CYL_TOP) + headHeight/2, 0);
  engineGroup.add(headRight);

  const headCutBack = new THREE.Mesh(new THREE.PlaneGeometry(headWidth, headHeight), cutMat);
  headCutBack.position.set(0, EY(CYL_TOP) + headHeight/2, -BORE - wallT + 0.001);
  engineGroup.add(headCutBack);

  const deck = new THREE.Mesh(new THREE.BoxGeometry(BORE * 2, 0.04, BORE * 2), M.engineBlock);
  deck.position.y = EY(CYL_TOP) - 0.02;
  engineGroup.add(deck);

  const portGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.22, 12);
  const intakePort = new THREE.Mesh(portGeo, glassHousing);
  intakePort.rotation.z = Math.PI / 2;
  intakePort.position.set(-BORE - 0.11, EY(CYL_TOP) + 0.14, 0);
  intakePort.renderOrder = 2; engineGroup.add(intakePort);

  const exhaustPort = new THREE.Mesh(portGeo.clone(), glassHousing);
  exhaustPort.rotation.z = Math.PI / 2;
  exhaustPort.position.set(BORE + 0.11, EY(CYL_TOP) + 0.14, 0);
  exhaustPort.renderOrder = 2; engineGroup.add(exhaustPort);

  const pistonGroup = new THREE.Group();
  engineGroup.add(pistonGroup);
  const pistonBody = new THREE.Mesh(new THREE.CylinderGeometry(BORE * 0.96, BORE * 0.96, 0.20, 24), M.piston);
  pistonBody.castShadow = true; pistonGroup.add(pistonBody);
  for (let i = 0; i < 2; i++) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(BORE * 0.96, 0.012, 8, 24), M.ring);
    ring.rotation.x = Math.PI / 2; ring.position.y = 0.06 - i * 0.07;
    pistonGroup.add(ring);
  }
  const wrist = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, BORE * 0.5, 12), M.steelDark);
  wrist.rotation.x = Math.PI / 2; wrist.position.y = -0.05;
  pistonGroup.add(wrist);

  const conRod = new THREE.Mesh(new THREE.BoxGeometry(0.07, ROD_LEN, 0.10), M.rod);
  conRod.castShadow = true; engineGroup.add(conRod);

  const crankSpin = new THREE.Group();
  crankSpin.position.set(0, EY(CRANK_Y), 0);
  engineGroup.add(crankSpin);

  const crankDisc = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.06, 24), M.steelDark);
  crankDisc.rotation.x = Math.PI / 2; crankDisc.position.set(0, 0, -0.12); crankSpin.add(crankDisc);
  const crankHub = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.10, 14), M.steel);
  crankHub.rotation.x = Math.PI / 2; crankHub.position.set(0, 0, -0.12); crankSpin.add(crankHub);
  const crankCW = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.30, 0.06), M.steelDark);
  crankCW.position.set(0, 0, -0.12); crankSpin.add(crankCW);
  const crankPin = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.15, 14), M.steelDark);
  crankPin.rotation.x = Math.PI / 2; crankPin.position.set(0, CRANK_R, 0.02); crankSpin.add(crankPin);
  const crankMarker = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 8), M.accent);
  crankMarker.position.set(0, 0.14, -0.09); crankSpin.add(crankMarker);

  const valveY = EY(CYL_TOP) + 0.06;
  const valveXOffset = BORE * 0.55;

  const intakeValve = new THREE.Group();
  intakeValve.position.set(-valveXOffset, valveY, 0);
  engineGroup.add(intakeValve);
  const ivStem = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.26, 10), M.valve);
  ivStem.position.y = 0.13; intakeValve.add(ivStem);
  const ivHead = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.03, 20), M.valve);
  intakeValve.add(ivHead);

  function buildBelt() {
    const r1 = SC_PUL_R, r2 = CRANK_PUL_R;
    const y1 = SC_PUL_Y, y2 = CRANK_PUL_Y;
    const z1 = SC_PUL_Z, z2 = CRANK_PUL_Z;
    const pts = [];
    for (let i = 0; i <= 20; i++) {
      const a = Math.PI - (i / 20) * Math.PI;
      pts.push(new THREE.Vector3(0, y1 + Math.sin(a) * r1, z1 + Math.cos(a) * r1));
    }
    pts.push(new THREE.Vector3(0, y2, z2 + r2));
    for (let i = 0; i <= 20; i++) {
      const a = 0 - (i / 20) * Math.PI;
      pts.push(new THREE.Vector3(0, y2 + Math.sin(a) * r2, z2 + Math.cos(a) * r2));
    }
    pts.push(new THREE.Vector3(0, y1, z1 - r1));

    const curve = new THREE.CatmullRomCurve3(pts, true, 'centripetal', 0.5);
    const beltGeo = new THREE.TubeGeometry(curve, 120, 0.022, 8, true);
    const beltMesh = new THREE.Mesh(beltGeo, M.belt);
    beltMesh.castShadow = true;
    beltMesh.position.x = SC_POS.x - SC_W * 0.30;
    scGroup.add(beltMesh);

    const ribCount = 24;
    const ribGeo = new THREE.BoxGeometry(0.048, 0.014, 0.028);
    for (let i = 0; i < ribCount; i++) {
      const t = i / ribCount;
      const p = curve.getPoint(t);
      const tangent = curve.getTangent(t);
      const rib = new THREE.Mesh(ribGeo, M.belt);
      rib.position.set(SC_POS.x - SC_W * 0.30 + p.x, p.y, p.z);
      rib.lookAt(new THREE.Vector3(
        SC_POS.x - SC_W * 0.30 + p.x + tangent.x,
        p.y + tangent.y,
        p.z + tangent.z
      ));
      rib.rotateX(Math.PI / 2);
      scGroup.add(rib);
    }
    return beltMesh;
  }

  labels.add('engine',  'Engine');
  labels.add('piston',  'Piston');
  labels.add('valves',  'Valves');
  labels.add('plug',    'Spark plug');
  labels.add('exh',     'Hot exhaust');
  labels.add('tail',    'Exhaust out');
  labels.add('sc',      'Supercharger');
  labels.add('scbelt',  'Drive belt');
  labels.add('scrotor', 'Roots rotors');
  labels.add('scbp',    'Bypass valve');

  const LABEL_POS = {
    filter:  [FILTER.x, FILTER.y + 0.40, 0],
    fresh:   [-1.10, 1.58, 0],
    comp:    [COMP.x, COMP.y + 0.50, 0],
    bov:     [BOV_ANCHOR.x, BOV_ANCHOR.y + 0.55, BOV_ANCHOR.z],
    rpm3d:   [BEARING.x, BEARING.y - 0.32, 0.40],
    shaft:   [BEARING.x, BEARING.y + 0.28, 0],
    turb:    [TURB.x, TURB.y + 0.50, 0],
    wg:      [WG_ANCHOR.x, WG_ANCHOR.y - 0.58, WG_ANCHOR.z],
    ic:      [IC_POS.x, IC_POS.y - IC_H/2 - 0.24, IC_POS.z],
    charge:  [-1.10, 0.95, 0.35],
    cooled:  [-0.30, 0.65, 0.10],
    engine:  [ENG.x, ENG.y - 1.35, 0],

    valves:  [ENG.x + 0.72, CYL_TOP + 0.40, 0],
    plug:    [ENG.x, CYL_TOP + 0.55, 0.30],
    exh:     [1.40, 0.75, -0.40],
    tail:    [1.85, 1.45, -0.55],
    sc:      [SC_POS.x, SC_POS.y + SC_H/2 + 0.40, 0],
    scbelt:  [SC_POS.x - SC_W*0.30, (SC_PUL_Y + CRANK_PUL_Y) / 2, SC_PUL_Z + 0.28],
    scrotor: [SC_POS.x, SC_POS.y + SC_H/2 + 0.15, SC_D/2 + 0.10],
    scbp:    [SC_BYPASS_ANCHOR.x, SC_BYPASS_ANCHOR.y + 0.42, SC_BYPASS_ANCHOR.z]
  };

  /* ═══════════════════════════════════════════════════════════
     PARTICLE STREAMS
     ═══════════════════════════════════════════════════════════ */
  const _v = new THREE.Vector3();
  const _c = new THREE.Color();
  const _c2 = new THREE.Color();

  const COL = {
    fresh:   new THREE.Color(0x9ec9ff),
    charge:  new THREE.Color(0xffb257),
    cooled:  new THREE.Color(0x38bdf8),
    exhHot:  new THREE.Color(0xff6a1a),
    exhCold: new THREE.Color(0x6e7681),
    tailHot: new THREE.Color(0xff5522),
    tailCold:new THREE.Color(0x8b93a0)
  };

  function makeStream(curve, count, size, opacity) {
    const { geo, mat, points } = Parts.additivePoints(particleTex, count, size, opacity, { renderOrder: 1, parent: system });
    const data = [];
    for (let i = 0; i < count; i++) {
      data.push({
        t: Math.random(), speed: 0.85 + Math.random() * 0.30,
        wob: Math.random() * TAU, j: 0.70 + Math.random() * 0.30
      });
    }
    return { geo, points, data, count, curve, mat };
  }

  const freshStream   = makeStream(freshAirCurve,   P.fresh,   0.095, 0.45);
  const chargeStream  = makeStream(chargeCurve,     P.charge,  0.115, 0.90);
  const cooledStream  = makeStream(cooledCurve,     P.cooled,  0.105, 0.90);
  const exhaustStream = makeStream(exhaustCurve,    P.exhaust, 0.120, 0.95);
  const tailStream    = makeStream(tailCurve,       P.tail,    0.130, 0.80);
  const scInStream    = makeStream(scInCurve,        P.fresh,  0.095, 0.45);
  const scDischarge   = makeStream(scDischargeCurve, P.charge, 0.115, 0.90);
  const scExhaustStr  = makeStream(scExhaustCurve,   P.tail,   0.120, 0.80);

  function updateStream(s, dt, flow, wobble, wobF, colFn, simTime) {
    const posA = s.geo.attributes.position;
    const colA = s.geo.attributes.color;
    for (let i = 0; i < s.count; i++) {
      const p = s.data[i];
      p.t += dt * flow * p.speed;
      if (p.t >= 1) { p.t -= 1; p.wob = Math.random() * TAU; }
      if (p.t < 0)  { p.t += 1; }
      s.curve.getPoint(p.t, _v);
      if (wobble > 0) {
        const w = p.wob + simTime * wobF;
        _v.y += Math.sin(w) * wobble;
        _v.z += Math.cos(w * 1.3 + 1.7) * wobble;
      }
      posA.setXYZ(i, _v.x, _v.y, _v.z);
      colFn(_c, p, p.t);
      colA.setXYZ(i, _c.r, _c.g, _c.b);
    }
    posA.needsUpdate = true;
    colA.needsUpdate = true;
  }

  /* Swirl (turbo turbine volute) */
  const swirlGeo = new THREE.BufferGeometry();
  swirlGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(P.swirl * 3), 3));
  swirlGeo.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(P.swirl * 3), 3));
  const swirlMat = new THREE.PointsMaterial({
    map: particleTex, size: 0.16, sizeAttenuation: true,
    vertexColors: true, transparent: true, opacity: 0.95,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  const swirlPoints = new THREE.Points(swirlGeo, swirlMat);
  swirlPoints.frustumCulled = false; swirlPoints.renderOrder = 1;
  turboGroup.add(swirlPoints);

  const swirlData = [];
  for (let i = 0; i < P.swirl; i++) {
    swirlData.push({ ang: Math.random() * TAU, spr: Math.random(), spd: 0.7 + Math.random() * 0.6, j: 0.7 + Math.random() * 0.3 });
  }

  /* In-cylinder charge particles */
  const cylGeo = new THREE.BufferGeometry();
  cylGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(P.cyl * 3), 3));
  cylGeo.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(P.cyl * 3), 3));
  const cylMat = new THREE.PointsMaterial({
    map: particleTex, size: 0.075, sizeAttenuation: true,
    vertexColors: true, transparent: true, opacity: 0.9,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  const cylPoints = new THREE.Points(cylGeo, cylMat);
  cylPoints.frustumCulled = false; cylPoints.renderOrder = 1;
  engineGroup.add(cylPoints);

  const cylData = [];
  for (let i = 0; i < P.cyl; i++) {
    cylData.push({ ang: Math.random() * TAU, rad: Math.random(), h: 0.5 + Math.random() * 0.5, a: 0.1 + Math.random() * 0.4, spd: 0.7 + Math.random() * 0.6, ph: Math.random() * TAU });
  }

  /* BOV pool */
  const BOV_N = P.bov;
  const bovGeo = new THREE.BufferGeometry();
  bovGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(BOV_N * 3), 3));
  bovGeo.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(BOV_N * 3), 3));
  const bovMat = new THREE.PointsMaterial({
    map: particleTex, size: 0.16, sizeAttenuation: true,
    vertexColors: true, transparent: true, opacity: 0.95,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  const bovPoints = new THREE.Points(bovGeo, bovMat);
  bovPoints.frustumCulled = false; bovPoints.renderOrder = 1;
  system.add(bovPoints);

  const bovData = [];
  for (let i = 0; i < BOV_N; i++) bovData.push({ life: 0, maxLife: 1, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0 });
  function fireBov() {
    let placed = 0;
    for (let i = 0; i < BOV_N && placed < Math.min(14, BOV_N); i++) {
      const p = bovData[i];
      if (p.life > 0) continue;
      p.x = BOV_VENT.x + (Math.random() - 0.5) * 0.10;
      p.y = BOV_VENT.y;
      p.z = BOV_VENT.z + (Math.random() - 0.5) * 0.10;
      p.vx = (Math.random() - 0.5) * 0.5;
      p.vy = 1.0 + Math.random() * 0.8;
      p.vz = (Math.random() - 0.5) * 0.5;
      p.maxLife = 0.4 + Math.random() * 0.35;
      p.life = p.maxLife;
      placed++;
    }
  }

  /* Wastegate pool */
  const WG_N = P.wg;
  const wgGeo = new THREE.BufferGeometry();
  wgGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(WG_N * 3), 3));
  wgGeo.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(WG_N * 3), 3));
  const wgMat = new THREE.PointsMaterial({
    map: particleTex, size: 0.14, sizeAttenuation: true,
    vertexColors: true, transparent: true, opacity: 0.9,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  const wgPoints = new THREE.Points(wgGeo, wgMat);
  wgPoints.frustumCulled = false; wgPoints.renderOrder = 1;
  turboGroup.add(wgPoints);

  const wgData = [];
  for (let i = 0; i < WG_N; i++) wgData.push({ life: 0, maxLife: 1, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0 });
  let wgAcc = 0;
  function spawnWg() {
    for (let i = 0; i < WG_N; i++) {
      const p = wgData[i];
      if (p.life > 0) continue;
      p.x = WG_VENT.x + (Math.random() - 0.5) * 0.10;
      p.y = WG_VENT.y;
      p.z = WG_VENT.z + (Math.random() - 0.5) * 0.10;
      p.vx = (Math.random() - 0.5) * 0.4;
      p.vy = -1.4 - Math.random() * 0.8;
      p.vz = (Math.random() - 0.5) * 0.4;
      p.maxLife = 0.45 + Math.random() * 0.35;
      p.life = p.maxLife;
      return;
    }
  }

  /* ═══════════════════════════════════════════════════════════
     STATE
     ═══════════════════════════════════════════════════════════ */
  let turbineRpm    = 0;
  let scRpm         = 0;
  let boost         = 0;
  let egt           = 20;
  let iatPostIc     = 20;
  let wastegateOpen = 0;
  let bovOpen       = 0;
  let bypassOpen    = 0;
  let prevThrottle  = 0;
  let rotorPhase    = 0;
  let scRotorPhaseL = 0;
  let scRotorPhaseR = 0;
  let crankAngle    = 0;
  let thrEff        = 0;
  let exPulse       = 0;
  let exPulseSm     = 0;
  let flashT        = 0;
  let prevCrank     = 0;
  let rotorSlow     = false;
  let simTime       = 0;
  let currentMode   = 'turbo';

  const MAX_RPM   = 150000;
  const MAX_BOOST = 1.5;
  const WG_TARGET = 1.0;
  const SC_RATIO  = 1.8;
  const SC_MAX_RPM = 18000;

  /* ═══════════════════════════════════════════════════════════
     UI — kit chrome + pedal axis (no tabs — switcher lives in toolbar extras)
     ═══════════════════════════════════════════════════════════ */
  const ui = UI.create({
    moduleId: 'turbo',

    panel: {
      kicker: 'Forced Induction',
      title:  'Turbocharger · Working Principle',
      badge:  { text: 'Exhaust-Driven', color: '#ef4444' },
      desc: `<strong>Turbocharger.</strong> Hot exhaust gas leaves the engine, dives down behind the block, and enters the turbine
             from below — spinning the <strong>turbine wheel</strong>. Through the shared shaft, the compressor pulls in fresh air:
             light sparse particles become a dense amber stream as they're compressed. The intercooler cools the charge before it
             reaches the intake manifold. The <strong>wastegate</strong> bleeds excess exhaust to cap boost; the
             <strong>blow-off valve</strong> vents the charge pipe when you lift off.`
    },

    monitor: {
      config: { label: 'Boost pressure', value: { label: 'Boost pressure', unit: 'bar', max: 100, bar: true }, rows: [['drive', 'Turbine speed'], ['egt', 'Exhaust gas temp'], ['iat', 'Intake (post-IC)'], ['rpm', 'Engine speed']],
      footer: '<div class="mon-legend"><span><i style="background:var(--c-sky)"></i>Fresh air</span><span><i style="background:var(--c-orange)"></i>Hot compressed</span><span><i style="background:var(--c-cyan)"></i>Cooled charge</span><span><i style="background:var(--c-orange)"></i>Hot exhaust</span></div>',
      status: { text: 'Idle' } },
      initial: { value: { text: '0', unit: 'bar' }, rows: { drive: '0 rpm', egt: '20 °C', iat: '20 °C', rpm: '—' }, status: ['Idle', false] }
    },

    toolbar: {
      play: true, reset: true,
      speed: { label: 'Engine load', min: 0.15, max: 2.5, step: 0.05, value: 0.85 },
      labels: true, gas: true,
      extras: []
    },

    /* Phase 4: the accelerator is a controls.js pedal (id 'throttle'). k = -ln(0.88)·60. */
    axes: [
      { id: 'throttle', look: 'pedal', label: 'Throttle', preset: 'percent', spring: 'return', k: 7.67, keys: 'arrows', side: 'right' }
    ]
  });

  /* ═══════════════════════════════════════════════════════════
     PANEL READOUT REFS
     ═══════════════════════════════════════════════════════════ */
  const strokeDescEl   = document.getElementById('stroke-desc');
  const badgeEl        = document.getElementById('stroke-badge');
  const badgeTextEl    = document.getElementById('badge-text');
  const moduleTitleEl  = document.getElementById('module-title');
  const moduleKickerEl = document.getElementById('module-kicker');

  /* Phase 6: rotor slow-motion is a dock toggle, the induction type a dock choice (replace the toolbar button + ‹ › arrows) */
  const CONFIG_ORDER  = ['turbo', 'supercharger'];
  const CONFIG_LABELS = {
    turbo:        'Turbocharger',
    supercharger: 'Supercharger'
  };
  ui.addOptions([
    { id: 'config', type: 'choice', layout: 'segmented', label: 'Induction', options: CONFIG_ORDER.map(id => ({ id, label: CONFIG_LABELS[id] })) },
    { id: 'rotorslow', type: 'toggle', label: 'Slow rotor', ariaLabel: 'Rotor slow motion', onChange: (on) => { rotorSlow = on; } }
  ]);

  const TURBO_INFO = {
    title:  'Turbocharger · Working Principle',
    kicker: 'Forced Induction · Exhaust-Driven',
    badge:  { text: 'Exhaust-Driven', color: '#ef4444' },
    desc: `<strong>Turbocharger.</strong> Hot exhaust gas leaves the engine, dives down behind the block, and enters the turbine
           from below — spinning the <strong>turbine wheel</strong>. Through the shared shaft, the compressor pulls in fresh air:
           light sparse particles become a dense amber stream as they're compressed. The intercooler cools the charge before it
           reaches the intake manifold. The <strong>wastegate</strong> bleeds excess exhaust to cap boost; the
           <strong>blow-off valve</strong> vents the charge pipe when you lift off.`
  };

  const SC_INFO = {
    title:  'Supercharger · Working Principle',
    kicker: 'Forced Induction · Belt-Driven',
    badge:  { text: 'Belt-Driven', color: '#38bdf8' },
    desc: `<strong>Supercharger.</strong> A belt runs from the <strong>crankshaft pulley</strong> up to the
           <strong>blower drive pulley</strong> — spinning the supercharger in lockstep with the engine
           (typically 1.5–2× crankshaft speed). Two interlocking <strong>Roots rotors</strong> trap air in pockets
           and push it into the intake tract, producing boost instantly — no turbo lag. Because the blower is
           mechanically driven, it takes some engine power to turn; a <strong>bypass valve</strong> opens at light
           throttle and high vacuum to avoid wasting fuel.`
  };

  function applyConfig(id) {
    currentMode = id;

    /* Toggle 3D scenes */
    turboGroup.visible = (id === 'turbo');
    scGroup.visible    = (id === 'supercharger');

    /* Update the toolbar switcher label */
    ui.controls.set('config', CONFIG_ORDER.indexOf(id));          /* keep the dock choice in step */

    /* Update panel chrome */
    const info = (id === 'turbo') ? TURBO_INFO : SC_INFO;
    if (moduleTitleEl)  moduleTitleEl.textContent  = info.title;
    if (moduleKickerEl) moduleKickerEl.textContent = info.kicker;
    if (strokeDescEl)   strokeDescEl.innerHTML     = info.desc;
    if (badgeTextEl)    badgeTextEl.textContent    = info.badge.text;
    if (badgeEl) {
      badgeEl.style.background = `color-mix(in oklch, ${info.badge.color} 18%, transparent)`;
      badgeEl.style.color = info.badge.color;
      const dot = badgeEl.querySelector('.dot');
      if (dot) dot.style.background = info.badge.color;
    }

    /* Update row label */
    ui.monitor.update({ rowLabels: { drive: (id === 'turbo') ? 'Turbine speed' : 'Blower speed' } });

    /* Reset boost parameters */
    boost = 0;
    turbineRpm = 0;
    scRpm = 0;
    egt = 20;
    iatPostIc = 20;
    wastegateOpen = 0;
    bovOpen = 0;
    bypassOpen = 0;
    prevThrottle = 0;
    bovData.forEach(p => { p.life = 0; });
    wgData.forEach(p => { p.life = 0; });

    /* Chip + bridge status */
    if (bridge) bridge.setStatus((id === 'turbo') ? 'Turbocharger' : 'Supercharger', info.badge.color);
  }

  ui.controls.on('config', (i) => { const id = CONFIG_ORDER[i]; if (id !== currentMode) applyConfig(id); });

  /* ═══════════════════════════════════════════════════════════
     BRIDGE
     ═══════════════════════════════════════════════════════════ */
  const bridge = ui.wireBridge({
    viewManager,
    state,
    onCommand: (d) => {
      switch (d.action) {
        case 'reset': resetSim(); break;
        case 'setRotorSlow':
          ui.controls.set('rotorslow', !!d.value);        /* onChange sets rotorSlow */
          break;
        case 'setConfig':
          if (CONFIG_ORDER.indexOf(d.value) >= 0) applyConfig(d.value);
          break;
      }
    }
  });
  bridge.ready();

  /* Initialize — apply the default config AFTER bridge exists */
  applyConfig('turbo');

  /* ═══════════════════════════════════════════════════════════
     PHYSICS
     ═══════════════════════════════════════════════════════════ */
  function stepPhysics(dt) {
    const throttle = ui.controls.get('throttle');
    const engineRpm = 350 + state.speedMul * 850;
    const load = Math.min(1, engineRpm / 1800);
    const exhaustEnergy = throttle * load;
    thrEff = throttle * (0.35 + 0.65 * load);

    if (currentMode === 'turbo') {
      const wgNeed = boost - WG_TARGET * 0.95;
      const wgTarget = wgNeed > 0 ? Math.min(1, wgNeed * 5 + 0.15) : 0;
      wastegateOpen += (wgTarget - wastegateOpen) * Math.min(1, dt * 2.5);
      if (wastegateOpen < 0.01) wastegateOpen = 0;

      let target = 16000 + 136000 * Math.pow(exhaustEnergy, 1.25);
      target *= 1 - 0.42 * wastegateOpen;
      if (throttle < 0.03) target = Math.min(target, 14000);
      const tau = target > turbineRpm ? 1.5 : 2.4;
      turbineRpm += (target - turbineRpm) * (1 - Math.exp(-dt / tau));
      if (turbineRpm < 0) turbineRpm = 0;

      const boostTarget = MAX_BOOST * Math.pow(Math.max(0, Math.min(1, turbineRpm / 138000)), 2.3);
      boost += (boostTarget - boost) * (1 - Math.exp(-dt / 0.35));

      if (prevThrottle > 0.45 && throttle < 0.22 && boost > 0.35) {
        bovOpen = 1; fireBov();
      }
      bovOpen = Math.max(0, bovOpen - dt * 1.3);
      if (bovOpen > 0.04) boost *= Math.exp(-dt * 2.6);
    } else {
      const scTargetRpm = engineRpm * SC_RATIO;
      scRpm += (scTargetRpm - scRpm) * (1 - Math.exp(-dt / 0.15));

      const bpTarget = Math.max(0, 1 - throttle * 2.5);
      bypassOpen += (bpTarget - bypassOpen) * Math.min(1, dt * 3.0);

      const rpmNorm = Math.max(0, Math.min(1, (scRpm - 800) / (SC_MAX_RPM - 800)));
      const boostTarget = MAX_BOOST * 0.85 * rpmNorm * throttle;
      boost += (boostTarget - boost) * (1 - Math.exp(-dt / 0.20));

      if (bypassOpen > 0.10) boost *= Math.exp(-dt * 1.8);

      if (prevThrottle > 0.45 && throttle < 0.15 && boost > 0.15) {
        bovOpen = 1; fireBov();
      }
      bovOpen = Math.max(0, bovOpen - dt * 1.3);

      wastegateOpen = 0;
    }

    const egtTarget = 20 + 900 * Math.min(1.15, exhaustEnergy * 1.15);
    egt += (egtTarget - egt) * (1 - Math.exp(-dt / (egtTarget > egt ? 1.7 : 3.2)));

    const preIC = 20 + boost * 105;
    const iatTarget = 20 + (preIC - 20) * 0.26;
    iatPostIc += (iatTarget - iatPostIc) * (1 - Math.exp(-dt / 0.9));

    prevThrottle = throttle;
  }

  /* ═══════════════════════════════════════════════════════════
     ENGINE KINEMATICS
     ═══════════════════════════════════════════════════════════ */
  const STROKE_COLORS = [0x38bdf8, 0x818cf8, 0xf97316, 0x94a3b8];
  const chamberTopLocal = EY(CYL_TOP) - 0.04;

  function advanceCrank(dt) {
    const engineRpm = 350 + state.speedMul * 850;
    crankAngle = (crankAngle + engineRpm * 0.11 * dt) % 720;
  }

  function updateEngineKinematics(dt) {
    const throttle = ui.controls.get('throttle');
    const th = crankAngle * DEG;
    const py = CRANK_R * Math.cos(th) +
               Math.sqrt(Math.max(0.0001, ROD_LEN * ROD_LEN - (CRANK_R * Math.sin(th)) ** 2));
    const crankLY = EY(CRANK_Y);
    const wristLY = crankLY + py;

    pistonGroup.position.y = wristLY + 0.05;
    crankSpin.rotation.z = -th;

    const pinLX = CRANK_R * Math.sin(th);
    const pinLY = crankLY + CRANK_R * Math.cos(th);
    conRod.position.set(pinLX * 0.5, (pinLY + wristLY) * 0.5, 0);
    conRod.rotation.z = Math.atan2(pinLX, wristLY - pinLY);

    let inLift = 0, exLift = 0;
    if (crankAngle < 180)       inLift = Math.sin(crankAngle * DEG) * 0.045;
    else if (crankAngle >= 540) exLift = Math.sin((crankAngle - 540) * DEG) * 0.045;
    intakeValve.position.y  = valveY - inLift;
    exhaustValve.position.y = valveY - exLift;

    const strokeIdx = Math.floor(crankAngle / 180) % 4;
    if (prevCrank < 360 && crankAngle >= 360) flashT = 1;
    prevCrank = crankAngle;
    flashT = Math.max(0, flashT - dt * 3.2);
    combustionMat.opacity = flashT * 0.85;
    combustionLight.intensity = flashT * 2.4;
    combustion.scale.setScalar(0.7 + (1 - flashT) * 0.7);

    gasMat.color.setHex(STROKE_COLORS[strokeIdx]);
    const deg = crankAngle % 180;
    let gasOp;
    if (strokeIdx === 0)      gasOp = 0.16 + 0.14 * (deg / 180);
    else if (strokeIdx === 1) gasOp = 0.26 + 0.18 * (deg / 180);
    else if (strokeIdx === 2) gasOp = 0.52 - 0.30 * (deg / 180);
    else                      gasOp = 0.30 - 0.20 * (deg / 180);
    gasMat.opacity = gasOp * (0.6 + 0.4 * throttle);

    const pistonTop = pistonGroup.position.y + 0.10;
    const gasH = Math.max(0.04, chamberTopLocal - pistonTop);
    gasVolume.position.y = (pistonTop + chamberTopLocal) * 0.5;
    gasVolume.scale.set(1, gasH, 1);
    gasVolume.visible = state.showGas !== false;
  }

  /* ═══════════════════════════════════════════════════════════
     STREAM UPDATES
     ═══════════════════════════════════════════════════════════ */
  function updateAllStreams(dt) {
    const show = state.showGas !== false;

    [freshStream, chargeStream, cooledStream, exhaustStream, tailStream, scInStream, scDischarge, scExhaustStr].forEach(s => {
      s.points.visible = false;
    });
    if (!show) return;

    const egtF = Math.max(0, Math.min(1, (egt - 20) / 720));
    const boostF = Math.max(0, Math.min(1, boost / 0.8));

    /* Cooled stream is always shown — both modes share the IC */
    cooledStream.points.visible = true;
    cooledStream.mat.opacity = 0.25 + 0.70 * boostF;
    updateStream(cooledStream, dt, 0.035 + 0.24 * boostF + 0.04 * thrEff, 0.008, 3.2,
      (c, p) => { c.copy(COL.cooled).multiplyScalar(p.j); }, simTime);

    if (currentMode === 'turbo') {
      freshStream.points.visible = true;
      freshStream.mat.opacity = 0.30 + 0.40 * Math.min(1, thrEff * 1.8);
      updateStream(freshStream, dt, 0.10 + 0.55 * thrEff, 0.018, 2.6,
        (c, p) => { c.copy(COL.fresh).multiplyScalar(p.j); }, simTime);

      chargeStream.points.visible = true;
      chargeStream.mat.opacity = 0.25 + 0.70 * boostF;
      updateStream(chargeStream, dt, 0.04 + 0.26 * boostF + 0.06 * thrEff, 0.006, 3.0,
        (c, p, t) => { c.copy(COL.charge).multiplyScalar(p.j * (0.85 + 0.30 * (1 - t))); }, simTime);

      exhaustStream.points.visible = true;
      exhaustStream.mat.opacity = 0.22 + 0.75 * egtF;
      updateStream(exhaustStream, dt, (0.05 + 0.45 * thrEff) * (0.4 + 1.2 * exPulseSm), 0.014, 5.0,
        (c, p) => { c.copy(COL.exhCold).lerp(COL.exhHot, egtF); c.multiplyScalar(p.j * (0.60 + 0.55 * exPulseSm)); }, simTime);

      tailStream.points.visible = true;
      tailStream.mat.opacity = 0.28 + 0.55 * egtF;
      updateStream(tailStream, dt, 0.08 + 0.55 * thrEff, 0.020, 3.6,
        (c, p) => { c.copy(COL.tailCold).lerp(COL.tailHot, egtF * 0.75); c.multiplyScalar(p.j); }, simTime);
    } else {
      scInStream.points.visible = true;
      scInStream.mat.opacity = 0.30 + 0.40 * Math.min(1, thrEff * 1.8);
      updateStream(scInStream, dt, 0.10 + 0.55 * thrEff, 0.018, 2.6,
        (c, p) => { c.copy(COL.fresh).multiplyScalar(p.j); }, simTime);

      scDischarge.points.visible = true;
      scDischarge.mat.opacity = 0.25 + 0.70 * boostF;
      updateStream(scDischarge, dt, 0.04 + 0.26 * boostF + 0.06 * thrEff, 0.006, 3.0,
        (c, p, t) => { c.copy(COL.charge).multiplyScalar(p.j * (0.85 + 0.30 * (1 - t))); }, simTime);

      scExhaustStr.points.visible = true;
      scExhaustStr.mat.opacity = 0.28 + 0.55 * egtF;
      updateStream(scExhaustStr, dt, 0.08 + 0.55 * thrEff, 0.020, 3.6,
        (c, p) => { c.copy(COL.tailCold).lerp(COL.tailHot, egtF * 0.75); c.multiplyScalar(p.j); }, simTime);
    }
  }

  function updateSwirl(dt) {
    const active = (currentMode === 'turbo') && state.showGas !== false;
    swirlPoints.visible = active;
    if (!active) return;
    const srpm = Math.min(1, turbineRpm / MAX_RPM);
    const egtF = Math.max(0, Math.min(1, (egt - 20) / 600));
    const inten = egtF * (0.45 + 0.55 * exPulseSm);
    const posA = swirlGeo.attributes.position;
    const colA = swirlGeo.attributes.color;
    for (let i = 0; i < P.swirl; i++) {
      const p = swirlData[i];
      p.spr += dt * (0.25 + 0.55 * srpm) * p.spd;
      if (p.spr >= 1) { p.spr -= 1; p.ang = Math.random() * TAU; }
      p.ang += dt * (1.2 + 6.0 * srpm) * p.spd;
      const r = 0.36 - 0.16 * p.spr;
      const x = TURB.x - 0.18 + 0.42 * p.spr;
      const y = TURB.y + Math.cos(p.ang) * r;
      const z = TURB.z + Math.sin(p.ang) * r;
      posA.setXYZ(i, x, y, z);
      _c2.copy(COL.exhCold).lerp(COL.exhHot, egtF);
      _c2.multiplyScalar(p.j * inten * (0.5 + 0.6 * (1 - p.spr)));
      colA.setXYZ(i, _c2.r, _c2.g, _c2.b);
    }
    posA.needsUpdate = true;
    colA.needsUpdate = true;
  }

  function updateCylParticles(dt) {
    cylPoints.visible = state.showGas !== false;
    if (!cylPoints.visible) return;
    const strokeIdx = Math.floor(crankAngle / 180) % 4;
    const base = _c2.setHex(STROKE_COLORS[strokeIdx]);
    const posA = cylGeo.attributes.position;
    const colA = cylGeo.attributes.color;
    const pistonTop = pistonGroup.position.y + 0.10;
    const gasH = Math.max(0.04, chamberTopLocal - pistonTop);

    for (let i = 0; i < P.cyl; i++) {
      const p = cylData[i];
      if (strokeIdx === 0)      { p.a = Math.min(1, p.a + dt * 1.4); p.h = Math.max(0.05, p.h - dt * 0.30); }
      else if (strokeIdx === 1) { p.a = 1; }
      else if (strokeIdx === 2) { p.h += (Math.random() - 0.55) * dt * 2.2; p.h = Math.max(0, Math.min(1, p.h)); }
      else                      { p.h = Math.min(1.15, p.h + dt * 0.8); p.a -= dt * 0.7; }
      if (p.a <= 0 || p.h > 1.1) { p.a = 0.05; p.h = 0.7 + Math.random() * 0.3; p.rad = Math.random(); p.ang = Math.random() * TAU; }
      p.ang += dt * (0.6 + (strokeIdx === 2 ? 3.0 : 0.4)) * p.spd;
      const r = p.rad * BORE * 0.82;
      const y = pistonTop + p.h * gasH;
      posA.setXYZ(i, Math.cos(p.ang) * r, y, Math.sin(p.ang) * r);
      const b = p.a * (0.65 + 0.35 * Math.sin(p.ph + simTime * 6));
      colA.setXYZ(i, base.r * b, base.g * b, base.b * b);
    }
    posA.needsUpdate = true;
    colA.needsUpdate = true;
  }

  function updateBov(dt) {
    bovPoints.visible = state.showGas !== false;
    const posA = bovGeo.attributes.position;
    const colA = bovGeo.attributes.color;
    for (let i = 0; i < BOV_N; i++) {
      const p = bovData[i];
      if (p.life > 0) {
        p.life -= dt;
        p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
        p.vy -= 0.6 * dt;
        const f = Math.max(0, p.life / p.maxLife);
        posA.setXYZ(i, p.x, p.y, p.z);
        colA.setXYZ(i, COL.cooled.r * f, COL.cooled.g * f, COL.cooled.b * f);
      } else {
        colA.setXYZ(i, 0, 0, 0);
      }
    }
    posA.needsUpdate = true;
    colA.needsUpdate = true;
  }

  function updateWastegateFx(dt) {
    const active = state.showGas !== false && currentMode === 'turbo' && wastegateOpen > 0.06;
    wgPoints.visible = active;
    if (active) {
      wgAcc += dt * (5 + 26 * wastegateOpen);
      while (wgAcc > 1) { wgAcc -= 1; spawnWg(); }
    }
    const posA = wgGeo.attributes.position;
    const colA = wgGeo.attributes.color;
    const egtF = Math.max(0, Math.min(1, (egt - 20) / 700));
    _c2.copy(COL.exhCold).lerp(COL.exhHot, egtF);
    for (let i = 0; i < WG_N; i++) {
      const p = wgData[i];
      if (p.life > 0) {
        p.life -= dt;
        p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
        p.vy += 0.4 * dt;
        const f = Math.max(0, p.life / p.maxLife) * wastegateOpen;
        posA.setXYZ(i, p.x, p.y, p.z);
        colA.setXYZ(i, _c2.r * f * 0.9, _c2.g * f * 0.9, _c2.b * f * 0.9);
      } else {
        colA.setXYZ(i, 0, 0, 0);
      }
    }
    posA.needsUpdate = true;
    colA.needsUpdate = true;
  }

  /* ═══════════════════════════════════════════════════════════
     RESET
     ═══════════════════════════════════════════════════════════ */
  function resetSim() {
    ui.controls.resetAll();                       /* releases the throttle pedal */
    turbineRpm = 0; scRpm = 0; boost = 0; egt = 20; iatPostIc = 20;
    wastegateOpen = 0; bovOpen = 0; bypassOpen = 0; prevThrottle = 0;
    rotorPhase = 0; scRotorPhaseL = 0; scRotorPhaseR = 0;
    crankAngle = 0; prevCrank = 0;
    flashT = 0; exPulse = 0; exPulseSm = 0; thrEff = 0;
    bovData.forEach(p => { p.life = 0; });
    wgData.forEach(p => { p.life = 0; });
    [freshStream, chargeStream, cooledStream, exhaustStream, tailStream, scInStream, scDischarge, scExhaustStr].forEach(s => {
      s.data.forEach(p => { p.t = Math.random(); });
    });
  }

  /* ═══════════════════════════════════════════════════════════
     READOUTS
     ═══════════════════════════════════════════════════════════ */
  function updateReadouts() {
    if (currentMode === 'turbo') {
      ui.monitor.update({ rows: { drive: Math.round(turbineRpm / 1000).toLocaleString() + 'k rpm' } });
    } else {
      ui.monitor.update({ rows: { drive: Math.round(scRpm / 100) / 10 + 'k rpm' } });
    }

    let col;
    if (boost < 0.15)      col = '#64748b';
    else if (boost < 0.7)  col = '#38bdf8';
    else if (boost < 1.1)  col = '#22c55e';
    else                   col = '#f59e0b';

    ui.monitor.update({
      value: { text: String(boost.toFixed(2)), unit: 'bar', color: col || '', bar: (boost / 1.5) * 100, barColor: col },
      rows: { egt: Math.round(egt) + ' °C', iat: Math.round(iatPostIc) + ' °C' }
    });

    let statusTxt, ok;
    if (currentMode === 'turbo') {
      if (boost > 0.9)       { statusTxt = 'Full boost'; ok = true; }
      else if (boost > 0.15) { statusTxt = 'Spooling';   ok = true; }
      else                   { statusTxt = 'Idle';       ok = false; }
    } else {
      if (bypassOpen > 0.4)  { statusTxt = 'Bypass';     ok = false; }
      else if (boost > 0.6)  { statusTxt = 'Full boost'; ok = true; }
      else if (boost > 0.1)  { statusTxt = 'On boost';   ok = true; }
      else                   { statusTxt = 'Idle';       ok = false; }
    }
    ui.monitor.update({ rows: { rpm: '~' + Math.round(350 + state.speedMul * 850) + ' rpm' }, status: [statusTxt, !!(ok)] });
  }

  /* ═══════════════════════════════════════════════════════════
     ANIMATION LOOP
     ═══════════════════════════════════════════════════════════ */
  const clock = new THREE.Clock();
  let frame = 0;

  function animate() {
    requestAnimationFrame(animate);
    frame++;
    const rawDt = Math.min(clock.getDelta(), 0.05);
    const dt = state.playing ? rawDt : 0;

    if (dt > 0) {
      simTime += dt;
      stepPhysics(dt);
      advanceCrank(dt);

      if (crankAngle >= 500 && crankAngle <= 720) {
        exPulse = Math.sin(((crankAngle - 500) / 220) * Math.PI);
      } else {
        exPulse = 0;
      }
      exPulseSm += (exPulse - exPulseSm) * Math.min(1, dt * 8);
    }

    const srpm = Math.min(1, turbineRpm / MAX_RPM);
    const slowK = rotorSlow ? 0.15 : 1;
    const fadeK = rotorSlow ? 0.35 : 1;

    if (currentMode === 'turbo') {
      const omega = (0.8 + 8.5 * srpm) * TAU * slowK;
      rotorPhase = (rotorPhase + omega * dt) % TAU;
      compressorWheel.rotation.x = rotorPhase;
      turbineWheel.rotation.x    = rotorPhase;
      blurCompGroup.rotation.x   = rotorPhase;
      blurTurbGroup.rotation.x   = rotorPhase;

      const bladeOp = 1 - 0.68 * Math.sqrt(srpm) * fadeK;
      M.bladeCold.opacity = bladeOp;
      M.bladeHot.opacity  = bladeOp;
      const blurOp = (0.10 + 0.55 * Math.pow(srpm, 0.6)) * (rotorSlow ? 0.40 : 1);
      blurCompMat.opacity = blurOp;
      blurTurbMat.opacity = blurOp;

      const wgPush = wastegateOpen * 0.06;
      wgRod.position.y   = -0.31 - wgPush;
      wgValve.position.y = -0.39 - wgPush;
      bovPiston.position.y = 0.04 + bovOpen * 0.05;
    } else {
      const scNorm = Math.min(1, scRpm / SC_MAX_RPM);
      const scOmega = (1.5 + 12.0 * scNorm) * TAU * slowK;
      scRotorPhaseL = (scRotorPhaseL + scOmega * dt) % TAU;
      scRotorPhaseR = (scRotorPhaseR - scOmega * dt) % TAU;

      scRotorL.rotation.z = scRotorPhaseL;
      scRotorR.rotation.z = scRotorPhaseR;

      crankPulley.rotation.x = (crankAngle * DEG) * 0.5;
      scPulley.rotation.z = scRotorPhaseL * 0.5;
    }

    updateEngineKinematics(dt);
    updateAllStreams(dt);
    updateSwirl(dt);
    updateCylParticles(dt);
    updateBov(dt);
    updateWastegateFx(dt);

    if (state.playing) updateReadouts();

    /* Labels — show only mode-relevant ones */
    const show = state.showLabels !== false;
    const turboLabels = ['filter','fresh','comp','bov','rpm3d','shaft','turb','wg','ic','charge','cooled','engine','piston','valves','plug','exh','tail'];
    const scLabels    = ['filter','engine','piston','valves','plug','exh','tail','ic','cooled','sc','scbelt','scrotor','scbp'];
    const activeSet = (currentMode === 'turbo') ? turboLabels : scLabels;
    const allIds = new Set([...turboLabels, ...scLabels]);
    allIds.forEach(id => {
      const pos = LABEL_POS[id];
      if (pos && activeSet.indexOf(id) >= 0 && show) {
        labels.project(id, new THREE.Vector3(pos[0], pos[1], pos[2]), camera, wrap);
      } else {
        labels.hide(id);
      }
    });

    /* Update the live shaft label text */
    if (frame % 15 === 0 && currentMode === 'turbo') {
      const lblEl = document.getElementById('label-rpm3d');
      if (lblEl) lblEl.textContent = 'Shaft ' + Math.round(turbineRpm / 1000) + 'k rpm';
    }

    controls.update();
    renderer.render(scene, camera);
  }

  /* ═══════════════════════════════════════════════════════════
     INIT
     ═══════════════════════════════════════════════════════════ */
  updateReadouts();
  animate();
  </script>
</body>
</html>
