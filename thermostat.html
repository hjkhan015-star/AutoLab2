<script type="module">
import { runGuidedModule } from './components.js';

/* ═══ THERMOSTAT MODEL (pure maths, no DOM / three.js; tests/thermostat.test.mjs runs this block) ═══ */
/*MODEL-START*/
/* ═══════════════════════════════════════════════════════════════════════
   Thermostat model — wax-pellet thermostat inside a cooling loop.

   Pure functions, no DOM, no three.js (tests/thermostat.test.mjs runs this block).
   Simplified physical trends, not a bench lookup table.

   THE MECHANISM (what is modelled)
   ────────────────────────────────
   1. The wax pellet sits in the hot engine-outlet coolant. Its temperature Tw
      chases the coolant temperature with a lag (wax + copper cup have mass).
   2. Wax melts over a temperature band: "start to open" at the stamped rating,
      fully melted about 13 K later. Melting expands the wax ~10-20 %.
   3. The piston is fixed to the frame, so the expanding wax pushes the CUP
      (and the main valve disc attached to it) away from the seat, against the
      return spring. Lift 0..9 mm.
   4. A second disc on the other end of the cup closes the bypass port as the
      main valve opens — a see-saw. Radiator share = lift, bypass = 1 - lift.
   5. Wax freezes at a slightly lower temperature than it melts (hysteresis,
      HYST kelvin) — modelled as a rate-independent "play" operator.
   6. Engine and radiator are two thermal masses; the thermostat sits between
      them, so it regulates (and can "hunt") rather than just switch.
   ═══════════════════════════════════════════════════════════════════════ */

/* ── named constants ─────────────────────────────────────────────────── */
const K = Object.freeze({
  C_ENGINE: 30,     /* kJ/K  block + water jacket coolant                    */
  C_RAD: 20,        /* kJ/K  radiator core + hoses coolant                   */
  CP: 4.18,         /* kJ/kg/K coolant                                       */
  HEAT_IDLE: 3.5,   /* kW    heat to coolant at idle, zero load              */
  HEAT_LOAD: 46,    /* kW    extra at full load and redline                  */
  UA_RAD: 1.4,      /* kW/K  radiator conductance (air side, clean core)     */
  AIR_STILL: 0.10,  /* kW/K  air heat capacity rate, car standing, fan off   */
  AIR_RAM: 2.8,     /* kW/K  extra at 130 km/h                               */
  AIR_FAN: 1.1,     /* kW/K  extra with the electric fan running             */
  FAN_ON: 98,       /* °C    ECU switches the fan on                         */
  FAN_OFF: 93,      /* °C    ... and off again (hysteresis)                  */
  SPAN: 13,         /* K     start-to-open -> fully open                     */
  HYST: 3,          /* K     wax freezes this much below where it melts      */
  LIFT_MM: 9,       /* mm    full stroke                                     */
  LIFT_TAU: 0.6,    /* s     mechanical lag of the valve                     */
  CAP_BAR: 1.2,     /* bar   pressure cap                                    */
  BOIL_BASE: 100,   /* °C    boiling point at zero cap pressure              */
  BOIL_PER_BAR: 18, /* °C    ... per bar                                     */
  SPRING_PRE: 18,   /* N     return spring load, valve closed                */
  SPRING_RATE: 2.0  /* N/mm                                                  */
});

const clamp = (x, a, b) => (!Number.isFinite(x) ? a : x < a ? a : x > b ? b : x);
const smooth = (x) => { const t = clamp(x, 0, 1); return t * t * (3 - 2 * t); };

/* Failure modes. shift: start-to-open moves up (K). span: melt band width (K).
   max: largest lift fraction. tau: wax thermal lag multiplier. bias: sensed temp error (K). */
const FAULTS = Object.freeze({
  none:   { label: 'Healthy',                   shift: 0, span: K.SPAN, max: 1,   tau: 1, bias: 0,  jam: null },
  closed: { label: 'Stuck closed (jammed)',     shift: 0, span: K.SPAN, max: 1,   tau: 1, bias: 0,  jam: 0 },
  open:   { label: 'Stuck open (jammed)',       shift: 0, span: K.SPAN, max: 1,   tau: 1, bias: 0,  jam: 1 },
  lazy:   { label: 'Sluggish (aged wax)',       shift: 7, span: 22,     max: 0.8, tau: 3, bias: 0,  jam: null },
  air:    { label: 'Air pocket at the pellet',  shift: 0, span: K.SPAN, max: 1,   tau: 5, bias: -7, jam: null }
});
const F = (id) => FAULTS[id] || FAULTS.none;

/* ── pure helpers ────────────────────────────────────────────────────── */

/* Wax melt fraction 0..1 on the HEATING branch. Direction: hotter wax -> more melted. */
function meltOpen(Tw, rating, fault) {
  const f = F(fault);
  return smooth((Tw - (rating + f.shift)) / f.span);
}
/* ... on the COOLING branch (shifted left by HYST: it stays melted a few kelvin longer). */
function meltClose(Tw, rating, fault) {
  return meltOpen(Tw + K.HYST, rating, fault);
}
/* Valve lift fraction produced by a given melt fraction and fault. */
function liftFromMelt(melt, fault) {
  const f = F(fault);
  if (f.jam !== null) return f.jam;
  return clamp(melt, 0, 1) * f.max;
}

/* Heat the engine dumps into the coolant (kW). More load / rpm -> more heat. */
function engineHeat(load, rpm) {
  const L = clamp(load, 0, 1);
  const N = clamp((rpm - 800) / 4200, 0, 1);
  return K.HEAT_IDLE + K.HEAT_LOAD * L * (0.55 + 0.45 * N);
}
/* Water-pump mass flow (kg/s ~ L/s). Belt-driven: proportional to rpm. */
function pumpFlow(rpm) { return clamp(0.15 + 0.55 * (rpm / 1000), 0.3, 3.2); }
/* Air-side heat capacity rate (kW/K): ram air from road speed + fan. */
function airCapacity(speedKmh, fanOn) {
  return K.AIR_STILL + K.AIR_RAM * clamp(speedKmh / 130, 0, 1) + (fanOn ? K.AIR_FAN : 0);
}
/* Heat the radiator gives to the air (kW). Effectiveness-NTU with one stream dominant. */
function radiatorHeat(Tr, Tamb, Ca) {
  const c = Math.max(0.02, Ca);
  return c * (1 - Math.exp(-K.UA_RAD / c)) * (Tr - Tamb);
}
function boilingPoint(capBar = K.CAP_BAR) { return K.BOIL_BASE + K.BOIL_PER_BAR * clamp(capBar, 0, 2.5); }
/* Return spring load (N) at a lift fraction. */
function springLoad(lift) { return K.SPRING_PRE + K.SPRING_RATE * K.LIFT_MM * clamp(lift, 0, 1); }

/* ── state ───────────────────────────────────────────────────────────── */
function makeState(Tamb = 20) {
  return { Te: Tamb, Tr: Tamb, Tw: Tamb, melt: 0, lift: 0, fan: false, clock: 0, warmClock: 0, warmDone: false };
}
/* Cold start: everything soaked to ambient, wax solid, valve shut. */
function coldStart(s, Tamb = 20) { Object.assign(s, makeState(Tamb)); return s; }

/* Advance the model by dt model-seconds (sub-stepped for stability) and return derived values.
   dt = 0 only computes the derived values. */
function step(s, inp, dt) {
  const rating = inp.rating, fault = inp.fault || 'none', Tamb = inp.Tamb;
  const f = F(fault);
  const m = pumpFlow(inp.rpm);
  const Qin = engineHeat(inp.load, inp.rpm);
  const Tboil = boilingPoint();

  let n = dt > 0 ? Math.max(1, Math.ceil(dt / 0.2)) : 0;
  const h = n ? dt / n : 0;
  for (let i = 0; i < n; i++) {
    /* fan logic (ECU) with hysteresis */
    if (inp.fanMode === 'on') s.fan = true;
    else if (inp.fanMode === 'off') s.fan = false;
    else if (s.Te > K.FAN_ON) s.fan = true;
    else if (s.Te < K.FAN_OFF) s.fan = false;

    /* pellet temperature chases the (possibly mis-sensed) coolant temperature */
    const tauW = (3 + 5 / (0.3 + m / 3.2)) * f.tau;
    const Ts = s.Te + f.bias;
    s.Tw += (Ts - s.Tw) * (1 - Math.exp(-h / tauW));

    /* wax melt fraction: play operator between heating and cooling branches (hysteresis) */
    const lo = meltOpen(s.Tw, rating, fault), hi = meltClose(s.Tw, rating, fault);
    s.melt = clamp(s.melt, lo, hi);

    /* valve lift follows the wax with a small mechanical lag */
    const target = liftFromMelt(s.melt, fault);
    s.lift += (target - s.lift) * (1 - Math.exp(-h / K.LIFT_TAU));

    /* flow split: see-saw valve. Radiator share = lift, bypass share = 1 - lift. */
    const r = clamp(s.lift, 0, 1);
    const Ca = airCapacity(inp.speed, s.fan);
    const Qrad = radiatorHeat(s.Tr, Tamb, Ca);
    const carried = m * K.CP * r * (s.Te - s.Tr);           /* engine -> radiator loop, kW */
    const steam = s.Te > Tboil ? 5 * (s.Te - Tboil) : 0;    /* vented steam carries heat away */

    s.Te += ((Qin - carried - steam) / K.C_ENGINE) * h;
    s.Tr += ((carried - Qrad) / K.C_RAD) * h;
    s.Te = clamp(s.Te, Tamb - 15, 160);
    s.Tr = clamp(s.Tr, Tamb - 15, 160);

    s.clock += h;
    if (!s.warmDone) { s.warmClock += h; if (s.Te >= rating) s.warmDone = true; }
  }

  const r = clamp(s.lift, 0, 1);
  const Ca = airCapacity(inp.speed, s.fan);
  const Qrad = radiatorHeat(s.Tr, Tamb, Ca);
  const Tin = r * s.Tr + (1 - r) * s.Te;                       /* mixed coolant entering the engine */
  return {
    m, Qin, Qrad, Ca, Tboil, Tin,
    r, byp: 1 - r,
    mm: r * K.LIFT_MM,
    melt: s.melt,
    spring: springLoad(r),
    boiling: s.Te > Tboil,
    flowRad: m * r, flowByp: m * (1 - r),
    heater: clamp((s.Te - 40) / 45, 0, 1)
  };
}
/*MODEL-END*/
const Model = { K, clamp, smooth, FAULTS, meltOpen, meltClose, liftFromMelt, engineHeat, pumpFlow, airCapacity, radiatorHeat, boilingPoint, springLoad, makeState, coldStart, step };

/* ── module content ──────────────────────────────────────────────── */
const CFG = {
  moduleId: 'thermostat',
  title: 'Thermostat',
  kicker: 'Cooling',
  accent: '#f59e0b',
  badge: 'Wax element · bypass type',
  camPos: [5.2, 3.4, 7.4],
  target: [0.1, 0.8, 0],
  floorY: -2.0,
  ctls: [
    { id: 'ctl', label: 'Engine load', caption: 'Engine load', preset: 'percent', def: 30 },
    { id: 'rpm', preset: 'rpm', def: 1800, label: 'Engine speed', onChange: (v) => { S.rpm = v; } },
    { id: 'kph', preset: 'vehicle-speed', def: 30, label: 'Vehicle speed', onChange: (v) => { S.speed = v; } },
    { id: 'ambient', preset: 'ambient', def: 20, label: 'Ambient', onChange: (v) => { S.ambient = v; if (!sim.warmDone && sim.clock < 2) Model.coldStart(sim, v); } }
  ],
  chipLabel: 'Coolant temp',
  rows: [['open', 'Valve lift'], ['rad', 'To radiator']],
  ro: [
    ['open', 'Valve lift'],
    ['wax',  'Wax melted'],
    ['rad',  'To radiator'],
    ['byp',  'Via bypass'],
    ['tout', 'Radiator out'],
    ['qout', 'Heat rejected'],
    ['fan',  'Radiator fan'],
    ['heat', 'Cabin heater'],
    ['mode', 'Phase'],
    ['warm', 'Warm-up']
  ],
  legend: [
    ['#38bdf8', 'Cold coolant'],
    ['#f97316', 'Hot coolant'],
    ['#f3e6b8', 'Solid wax'],
    ['#ff8a1f', 'Molten wax'],
    ['#c77d4a', 'Copper cup'],
    ['#ef4444', 'Overheat']
  ],
  overview: `
<div class="al-sec"><h4>What it does</h4>
<p>The thermostat is a valve that opens by itself when the engine is hot. No motor, no electronics — just a sealed copper cup of <b>wax</b>. It holds coolant back while the engine is cold (fast warm-up) and then lets it flow through the radiator, so the engine settles near one temperature.</p></div>

<div class="al-sec"><h4>How the wax opens the valve</h4>
<ul>
<li><b>1 · Cold.</b> The wax is solid. The <b>return spring</b> keeps the main disc on its seat. The lower <b>bypass disc</b> is open, so coolant just circles engine → bypass → pump and warms up fast.</li>
<li><b>2 · Heat.</b> Hot coolant from the engine surrounds the cup. At the stamped temperature (82 / 88 / 91 °C) the wax starts to melt — from the cup wall inward.</li>
<li><b>3 · Expansion.</b> Melting wax expands (≈10–20 %) and cannot be squeezed. The <b>piston</b> is fixed to the frame, so the wax pushes the <b>cup</b> the other way. The main disc is fixed to the cup, so it slides off its seat, compressing the spring.</li>
<li><b>4 · See-saw.</b> The bypass disc is on the other end of the same cup. As the main valve opens, the bypass closes. Flow moves from bypass to radiator.</li>
<li><b>5 · Regulating.</b> The valve opens gradually (fully open ≈13 °C above start). It settles where the radiator removes exactly the heat the engine makes.</li>
<li><b>6 · Cooling down.</b> Wax freezes and shrinks; the spring pushes the cup back and the valve closes — a few degrees <i>lower</i> than it opened (hysteresis).</li>
</ul></div>

<div class="al-sec"><h4>Read the screen</h4>
<ul>
<li><b>Cutaway:</b> pale wax is solid, orange is molten. Watch the cup slide down while the piston stays still.</li>
<li><b>Opening-curve graph:</b> valve lift against temperature. Solid line = heating, dashed = cooling; the dot is the pellet right now.</li>
<li><b>Particles:</b> orange = hot coolant leaving the engine, blue = cooled by the radiator. How many go each way is the flow split.</li>
</ul></div>

<div class="al-sec"><h4>Other parts</h4>
<ul>
<li><b>Frame:</b> holds the piston tip and the spring seat; clamped between the two housing halves.</li>
<li><b>Jiggle valve:</b> a tiny loose pin that lets trapped air rise past the closed valve when you fill the system.</li>
<li><b>Bypass:</b> keeps coolant moving through the engine while the valve is shut, so the pump is never blocked and there are no hot spots.</li>
</ul></div>

<div class="al-sec"><h4>Try this</h4>
<ul>
<li>Press <b>Cold start</b> and watch all four phases, then see the cooling curve loop.</li>
<li>Pick <b>Stuck open</b>: the engine never warms up. Pick <b>Stuck closed</b> with load: it boils.</li>
<li>Stop the car (speed 0) with the fan on <b>Off</b> and watch the temperature climb past the valve's full-open point.</li>
<li>Change the rating: a hotter-rated thermostat runs the engine hotter.</li>
</ul></div>`,
  faults: [
    ['Stuck closed', 'Rapid overheating, top hose stays cold while the engine is hot, steam and boil-over. The fan runs but cannot help — no coolant reaches the radiator.', 'Feel both hoses during warm-up; test the thermostat in a pan of hot water with a thermometer.'],
    ['Stuck open', 'Very slow warm-up, weak cabin heater, gauge stays low, poor economy; the ECU may set a "coolant below regulating temperature" code (P0128).', 'Check the gauge and the ECU coolant PID after 10 minutes of driving.'],
    ['Sluggish (aged wax)', 'Opens late and not fully; temperature swings up and down.', 'Compare the opening temperature in hot water with the number stamped on the flange.'],
    ['Air pocket at the pellet', 'The pellet senses air or steam instead of coolant, so it opens late. Hot spots and a poor heater result.', 'Bleed the system at its highest point; check that the jiggle valve rattles and sits at the top.'],
    ['Wrong rating', 'A cooler rating over-cools the engine; a hotter one raises thermal load and detonation risk.', 'Match the part number and the stamped temperature to the service manual.'],
    ['Fitted backwards', 'Late opening or overheating — the pellet must sit on the engine side.', 'Pellet faces the engine; the jiggle valve goes at the top.']
  ],
  quiz: [
    ['What physically opens the valve?', ['A motor driven by the ECU', 'Wax melting and expanding', 'Oil pressure'], 1, 'The wax pellet melts and expands. Nothing else is needed — it is a purely thermal-mechanical valve.'],
    ['Which part is fixed to the frame?', ['The wax cup', 'The piston', 'The main valve disc'], 1, 'The piston is anchored to the frame. The expanding wax pushes the cup (and the disc attached to it) away from the seat.'],
    ['While the engine is cold, where does the coolant go?', ['Through the radiator', 'Through the bypass, back to the pump', 'It stops moving'], 1, 'The closed valve sends all flow through the bypass, so the engine warms up quickly.'],
    ['Why does a bypass disc close as the main valve opens?', ['Both discs ride on the same cup (a see-saw)', 'The ECU commands it', 'Coolant pressure'], 0, 'They are on opposite ends of one cup: radiator flow rises exactly as bypass flow falls.'],
    ['Why does the valve close at a lower temperature than it opens?', ['Hysteresis of the wax and spring', 'A faulty sensor', 'The fan'], 0, 'Wax freezes at a slightly lower temperature than it melts, so the opening and closing curves are not the same.'],
    ['A stuck-open thermostat causes…', ['Overheating', 'Slow warm-up and a weak heater', 'Coolant boiling'], 1, 'Coolant keeps going through the radiator, so the engine runs too cold.'],
    ['Thermostat fully open, hot day, stuck in traffic, engine still too hot. The limit is…', ['The thermostat rating', 'Airflow through the radiator (fan)', 'The spring'], 1, 'A fully open thermostat cannot do more. After that, only more air (fan / speed) removes more heat.']
  ]
};

/* ── module state (module level so Reset and the options can reach it) ── */
const S = { rpm: 1800, speed: 30, ambient: 20, rating: 88, fault: 'none', fan: 'auto', timeScale: 5, cut: true };
const sim = Model.makeState(S.ambient);
let traceSample = null, traceClear = false, sampleClock = 0;

const FAULT_WARN = {
  closed: 'Valve jammed shut: no flow to the radiator. Expect overheating.',
  open: 'Valve jammed open: bypass closed, engine runs too cold.',
  lazy: 'Aged wax: opens late and only partly. Temperature swings.',
  air: 'Air at the pellet: it senses a cooler temperature, so it opens late.'
};

function resetAll() {
  S.rpm = 1800; S.speed = 30; S.ambient = 20; S.rating = 88; S.fault = 'none'; S.fan = 'auto'; S.timeScale = 5; S.cut = true;
  Model.coldStart(sim, 20);
  traceClear = true; sampleClock = 0;
}
CFG.onReset = resetAll;     /* dock Reset: model + (the runtime then resets every control) */

CFG.options = [
  { id: 'rating', type: 'choice', layout: 'segmented', label: 'Rating', options: [{ id: '82', label: '82 °C' }, { id: '88', label: '88 °C' }, { id: '91', label: '91 °C' }], def: '88',
    onChange: (id) => { S.rating = Number(id) || 88; } },
  { id: 'fault', type: 'choice', layout: 'select', label: 'Failure mode', options: Object.keys(Model.FAULTS).map((id) => ({ id, label: Model.FAULTS[id].label })), def: 'none',
    onChange: (id) => { S.fault = id; } },
  { id: 'fan', type: 'choice', layout: 'segmented', label: 'Cooling fan', options: [{ id: 'auto', label: 'Auto' }, { id: 'on', label: 'On' }, { id: 'off', label: 'Off' }], def: 'auto',
    onChange: (id) => { S.fan = id; } },
  { id: 'timeScale', type: 'choice', layout: 'segmented', label: 'Time scale', options: [{ id: '1', label: '1×' }, { id: '5', label: '5×' }, { id: '20', label: '20×' }], def: '5',
    onChange: (id) => { S.timeScale = Number(id) || 1; } },
  { id: 'cutaway', type: 'toggle', label: 'Cutaway', def: true, onChange: (on) => { S.cut = !!on; } },
  { id: 'cold', type: 'action', label: 'Cold start', onAction: () => { Model.coldStart(sim, S.ambient); traceClear = true; sampleClock = 0; } }
];

CFG.traces = [{ id: 'hist', label: 'Coolant °C (20–130) · radiator out °C · valve lift %', min: 0, max: 100, length: 150,
  series: [
    { id: 'a', label: 'Coolant', color: 'var(--accent)' },
    { id: 'b', label: 'Radiator out', color: 'var(--ok)' },
    { id: 'c', label: 'Valve lift', color: 'var(--warn)' }
  ] }];

/* ═══════════════════════════════════════════════════════════════════
   3D SCENE
   ═══════════════════════════════════════════════════════════════════ */
function build(H) {
  const { THREE, root, mat, stream, pipe, clamp, lerp, lc, Parts, lowEnd } = H;
  const DS = THREE.DoubleSide;
  const PI = Math.PI;
  const sm = (c, m, r, o) => mat(c, m, r, Object.assign({ side: DS }, o || {}));
  const M = {
    steel: sm(0x9aa3b2, 0.85, 0.3), cast: sm(0x6b7482, 0.6, 0.5), flange: sm(0xb8c0cc, 0.9, 0.25),
    bright: sm(0xd0d6e0, 0.92, 0.2), copper: sm(0xc77d4a, 0.8, 0.3), brass: sm(0xd4a34a, 0.75, 0.32),
    rubber: sm(0x14161a, 0.05, 0.9), hose: sm(0x1a1a1a, 0.05, 0.95), spring: sm(0xc3cad6, 0.9, 0.25),
    frame: sm(0x4a5160, 0.7, 0.45), block: sm(0x4a5060, 0.65, 0.55), head: sm(0x5a6370, 0.7, 0.48),
    fin: sm(0x8f9aa5, 0.85, 0.4), tank: sm(0x353b48, 0.55, 0.55), fan: sm(0x2b3038, 0.55, 0.65),
    hub: sm(0x1a1e24, 0.8, 0.35, { emissive: 0x06b6d4, emissiveIntensity: 0 }), dark: sm(0x1a1e24, 0.8, 0.35), pump: sm(0x6b7482, 0.7, 0.4)
  };
  const waxSolid = new THREE.Color(0xf3e6b8), waxMolten = new THREE.Color(0xff8a1f), waxHot = new THREE.Color(0xffb347);
  const COLD = new THREE.Color(0x38bdf8), HOT = new THREE.Color(0xf97316);
  const tcol = (T) => new THREE.Color().copy(COLD).lerp(HOT, clamp((T - 30) / 75, 0, 1));

  /* layout */
  const TH_Y = 1.0;                             /* seat plane of the thermostat in world y */
  const ENG = new THREE.Vector3(-3.7, 0.2, 0);
  const RAD = new THREE.Vector3(3.6, 0.9, 0);
  const R = 0.85;                               /* housing inner radius */
  const LIFT_U = 0.225;                         /* full lift in scene units (9 mm)          */
  const SPR_BOT = -0.775, SPR_L0 = 0.715;       /* spring: fixed seat -> disc underside      */
  const W = (x, y, z) => [x, y + TH_Y, z || 0]; /* thermostat-local -> world                */

  const TH = new THREE.Group(); TH.position.set(0, TH_Y, 0); root.add(TH);

  /* ── housing (two variants: cut-away half, and closed) ───────────── */
  function mkHousing(cut) {
    const g = new THREE.Group(); TH.add(g);
    const a0 = cut ? PI / 2 : 0, aL = cut ? PI : PI * 2;
    const cyl = (rt, rb, h, x, y, rz, m) => {
      const o = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 36, 1, true, a0, aL), m || M.cast);
      o.position.set(x, y, 0); if (rz) o.rotation.z = rz; g.add(o); return o;
    };
    const ring = (ri, ro, y, m) => {
      const o = new THREE.Mesh(new THREE.RingGeometry(ri, ro, 40, 1, 0, cut ? PI : PI * 2), m || M.cast);
      o.rotation.x = -PI / 2; o.position.y = y; g.add(o); return o;
    };
    cyl(R, R, 1.3, 0, -0.65);                          /* lower body y -1.3 .. 0            */
    ring(0.30, R, -1.25);                              /* bypass seat plate (hole r .30)    */
    cyl(0.30, 0.30, 0.5, 0, -1.52);                    /* bypass outlet pipe (down)         */
    cyl(0.25, 0.25, 0.75, -1.2, -0.62, PI / 2);        /* inlet port from the engine        */
    ring(R, 1.1, -0.06);                               /* lower flange                      */

      /* coolant colours */
      const upT = o.r * Te + (1 - o.r) * Tr;
      fluidMatLow.color.copy(tcol(Te)); fluidMatUp.color.copy(tcol(upT));

      /* engine, radiator, fan, gauge */
      engG.position.x = ENG.x + 0.006 * Math.sin(t * 47); engG.position.y = ENG.y + 0.004 * Math.sin(t * 67 + 0.5);
      const eh = clamp((Te - 60) / 70, 0, 1);
      engGlowMat.opacity = eh * 0.30; engGlowMat.color.setHex(Te > 108 ? 0xef4444 : 0xff6822);
      if (Te > 108) engGlowMat.opacity = 0.35 + 0.15 * Math.sin(t * 12);
      radGlowMat.opacity = clamp((Tr - 45) / 55, 0, 1) * 0.28;
      const wantFan = sim.fan ? 7 : 0;
      fanSpd += (wantFan - fanSpd) * Math.min(1, dtv * 3);
      fanAng += fanSpd * dtv;
      fanG.rotation.z = -fanAng; M.hub.emissiveIntensity = sim.fan ? 0.8 : 0;
      needlePivot.rotation.z = lerp(ARC0, ARC1, clamp((Te - 40) / 90, 0, 1));
      needleMat.color.setHex(Te > 108 ? 0xef4444 : 0xf59e0b);

      /* particles */
      const spd = 0.04 + 0.10 * (o.m / 3.2);
      const hotC = tcol(Te), cooC = tcol(Tr);
      sIn.update(t, spd, 1); sIn.mat.color.copy(hotC);
      sUp.update(t, spd * 0.8, o.r > 0.02 ? clamp(0.25 + o.r * 0.9, 0, 1) : 0); sUp.mat.color.copy(hotC);
      sByp.update(t, spd * 0.8, o.byp > 0.02 ? clamp(0.25 + o.byp * 0.9, 0, 1) : 0); sByp.mat.color.copy(hotC);
      const midC = hotC.clone().lerp(cooC, 0.5);
      sCore.forEach((s) => { s.update(t, spd * 1.3, o.r > 0.02 ? clamp(0.3 + o.r, 0, 1) : 0); s.mat.color.copy(midC); });
      sRet.update(t, spd * 0.8, o.r > 0.02 ? clamp(0.25 + o.r * 0.9, 0, 1) : 0); sRet.mat.color.copy(cooC);
      const airN = clamp(o.Ca / 3.0, 0, 1);
      sAir.forEach((s) => s.update(t, 0.12 + 0.5 * airN, airN));

      /* stage canvas (throttled) */
      const now = performance.now();
      if (now - lastDraw > 80) { lastDraw = now; drawCurve(o); }

      /* monitor */
      let tr;
      if (traceClear) { traceClear = false; traceSample = null; tr = { hist: null }; }
      else {
        if (dtReal > 0) { sampleClock += dtReal; if (sampleClock >= 0.25) { sampleClock = 0; traceSample = [clamp((Te - 20) / 110 * 100, 0, 100), clamp((Tr - 20) / 110 * 100, 0, 100), lift * 100]; } }
        if (traceSample) { tr = { hist: traceSample }; traceSample = null; }
      }
      const [pt, ptone] = phase(o);
      const warn = FAULT_WARN[S.fault] || (o.boiling ? 'Coolant boiling — stop the engine.' : (Te > 108 ? 'Coolant ' + Te.toFixed(0) + ' °C — overheating. Add load relief or airflow.' : ''));
      const mm = o.mm.toFixed(1) + ' mm';
      let warmTxt;
      const wm = sim.warmClock, wf = (v) => (v >= 100 ? Math.floor(v / 60) + ':' + String(Math.floor(v % 60)).padStart(2, '0') : v.toFixed(0) + ' s');
      if (sim.warmDone) warmTxt = wf(wm) + ' ✓'; else warmTxt = wf(wm) + (S.fault === 'open' && wm > 300 ? ' · never' : ' …');
      const heatTxt = o.heater < 0.15 ? 'Cold' : o.heater < 0.6 ? 'Warming' : 'Hot';

      return {
        big: Te.toFixed(0), unit: ' °C', bar: clamp((Te - 20) / 110 * 100, 0, 100),
        rows: { open: mm, rad: (o.r * 100).toFixed(0) + ' %' },
        ro: {
          open: [mm, ''],
          wax: [(sim.melt * 100).toFixed(0) + ' %', sim.melt > 0.02 ? 'hi' : ''],
          rad: [(o.r * 100).toFixed(0) + ' %', ''],
          byp: [(o.byp * 100).toFixed(0) + ' %', ''],
          tout: [Tr.toFixed(0) + ' °C', Tr > 100 ? 'warn' : ''],
          qout: [o.Qrad.toFixed(1) + ' kW', ''],
          fan: [sim.fan ? 'On' : 'Off', sim.fan ? 'hi' : ''],
          heat: [heatTxt, o.heater < 0.15 ? 'warn' : ''],
          mode: [pt, ptone],
          warm: [warmTxt, '']
        },
        status: [warn || pt, true, warn ? (ptone === 'crit' ? 'crit' : 'warn') : ptone === 'ok' ? '' : ptone],
        traces: tr,
        ctl: (load * 100).toFixed(0) + ' %'
      };
    }
  };
}

runGuidedModule(CFG, build);
</script>
</body>
</html>
