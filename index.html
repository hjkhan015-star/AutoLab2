<html lang="en">

<style>
/* ═══════════════════════════════════════════════════════════════════════
   Shell-only styles — home screen, module frame. (Header + ⋯ menu live in chrome.js / controls.css.)
   ═══════════════════════════════════════════════════════════════════════ */
@layer shell {
  /* ── v6: progress, update toast, smoothness ── */
  .progress-card { margin: var(--s-3) var(--s-5) var(--s-2); padding: var(--s-3) var(--s-4); border-radius: var(--r-md);
    background: color-mix(in oklch, var(--accent) 8%, var(--bg)); border: 1px solid color-mix(in oklch, var(--accent) 22%, transparent); }
  .progress-t { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .progress-track { height: 6px; border-radius: 99px; background: color-mix(in oklch, var(--accent) 16%, transparent); overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transform-origin: left; animation: pfill .7s var(--ease-in-out) both; }
  @keyframes pfill { from { transform: scaleX(0); } }
  .module-card.done { position: relative; }
  .module-card.done::after { content: "\2713"; position: absolute; top: 8px; right: 10px; width: 20px; height: 20px; display: grid; place-items: center;
    border-radius: 50%; font-size: 12px; font-weight: 700; background: var(--c, var(--accent)); color: #0a0d13; }
  .update-toast { position: fixed; left: 50%; bottom: calc(var(--safe-b, 0px) + 84px); transform: translateX(-50%); z-index: var(--z-toast);
    display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; border-radius: 99px; font-size: 14px;
    background: var(--bg-elev, var(--surface, #151a24)); color: var(--text, #e6edf6); border: 1px solid color-mix(in oklch, var(--accent) 40%, transparent);
    box-shadow: 0 12px 32px -8px rgba(0,0,0,.5); animation: toastin .35s var(--ease-in-out) both; }
  .update-btn { padding: 6px 14px; border-radius: 99px; background: var(--accent); color: #0a0d13; font-weight: 600; }
  .update-x { width: 28px; height: 28px; border-radius: 50%; font-size: 18px; color: inherit; opacity: .7; }
  @keyframes toastin { from { opacity: 0; transform: translate(-50%, 12px); } }
  /* Smoothness: skip layout/paint of off-screen cards, GPU-hint the moving layers, crisper text */
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; -webkit-text-size-adjust: 100%; }
  .module-card, .mod-row { content-visibility: auto; contain-intrinsic-size: auto 96px; }
  .module-card { transition: transform .18s var(--ease-in-out), box-shadow .18s var(--ease-in-out); }
  .module-card:active, .mod-row:active { transform: scale(.975); }
  #module-screen iframe { contain: strict; }
  .home-main { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { .progress-fill, .update-toast { animation: none; } .home-main { scroll-behavior: auto; } .module-card { transition: none; } }

  #home-screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    background: var(--bg);
    z-index: var(--z-stage);
    overflow: hidden;
    transition: transform var(--dur-slow) var(--ease-in-out),
                opacity var(--dur-slow) var(--ease-in-out),
                filter var(--dur-slow) var(--ease-in-out);
    transform-origin: center top;
  }
  #home-screen.behind {
    transform: scale(.94) translateY(8px);
    opacity: 0;
    filter: blur(10px);
    pointer-events: none;
  }

  /* ── Header ── */
  .home-header {
    flex: 0 0 auto;
    padding: calc(var(--s-4) + var(--safe-t)) var(--s-5) var(--s-3);
    background: linear-gradient(180deg,
      color-mix(in oklch, var(--bg) 100%, transparent) 0%,
      color-mix(in oklch, var(--bg) 82%, transparent) 78%,
      transparent 100%);
    z-index: var(--z-monitor);
  }
  @media (min-width: 768px) {
    .home-header { max-width: 1100px; margin: 0 auto; width: 100%; }
  }

  .header-row { display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-4); }

  .brand-mark {
    width: 42px; height: 42px;
    flex: 0 0 auto;
    border-radius: var(--r-md);
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0a0d13;
    display: grid; place-items: center;
    box-shadow: 0 8px 24px -6px color-mix(in oklch, var(--accent) 55%, transparent);
    position: relative;
    overflow: hidden;
  }
  .brand-mark::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(120deg,
      transparent 40%,
      color-mix(in oklch, white 45%, transparent) 50%,
      transparent 60%);
    transform: translateX(-130%);
    animation: sheen 3.6s var(--ease-in-out) infinite;
  }
  @keyframes sheen {
    0%, 62% { transform: translateX(-130%); }
    100%    { transform: translateX(130%); }
  }
  .brand-mark svg { width: 24px; height: 24px; }

  .brand-copy { flex: 1; min-width: 0; }
  .brand-title {
    font-size: 19px; font-weight: 800;
    letter-spacing: -.025em;
    line-height: 1.1;
    display: flex; align-items: baseline; gap: 6px;
  }
  .brand-title .brand-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    display: inline-block;
    transform: translateY(-4px);
  }
  .brand-sub {
    font-size: 11.5px; color: var(--text-mute);
    margin-top: 3px; font-weight: 500;
  }

  #install-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px;
    border-radius: var(--r-sm);
    border: 1px solid color-mix(in oklch, var(--accent) 42%, transparent);
    background: color-mix(in oklch, var(--accent) 14%, transparent);
    color: var(--accent);
    font-size: 11.5px; font-weight: 700;
    letter-spacing: .02em;
    white-space: nowrap;
    transition: background var(--dur-fast) var(--ease-out),
                transform var(--dur-fast) var(--ease-spring);
  }
  #install-btn:active { transform: scale(.95); }
  #install-btn svg { width: 14px; height: 14px; }
  #install-btn[hidden] { display: none; }

  /* ── Search ── */
  .search-wrap {
    position: relative;
    display: flex; align-items: center;
    height: 44px;
    padding: 0 var(--s-3);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    transition: background var(--dur-fast) var(--ease-out),
                border-color var(--dur-fast) var(--ease-out),
                box-shadow var(--dur-fast) var(--ease-out);
  }
  .search-wrap:focus-within {
    background: var(--surface-3);
    border-color: var(--border-focus);
    box-shadow: 0 0 0 4px var(--ring);
  }
  .search-wrap svg {
    width: 16px; height: 16px;
    color: var(--text-mute);
    flex: 0 0 auto;
    margin-right: var(--s-2);
  }
  .search-wrap input {
    flex: 1; min-width: 0;
    background: transparent;
    border: 0; outline: none;
    color: var(--text);
    font-size: 15px; font-weight: 500;
  }
  .search-wrap input::placeholder { color: var(--text-mute); font-weight: 400; }
  @media (max-width: 720px) { .search-wrap input { font-size: 16px; } }

  /* ── View toggle (Roadmap / Apps) ── */
  .view-toggle {
    display: inline-flex;
    gap: 3px;
    margin-top: var(--s-3);
    padding: 3px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r-pill);
  }
  .view-toggle-btn {
    display: inline-flex; align-items: center;
    gap: 6px;
    min-height: 32px;
    padding: 0 12px;
    border-radius: var(--r-pill);
    color: var(--text-mute);
    font-size: 12px; font-weight: 700;
    letter-spacing: .01em;
    background: transparent;
    border: 0;
    cursor: pointer;
    transition: background var(--dur-base) var(--ease-out),
                color var(--dur-base) var(--ease-out),
                transform var(--dur-fast) var(--ease-spring);
    touch-action: manipulation;
  }
  .view-toggle-btn svg { width: 14px; height: 14px; flex: 0 0 auto; }
  .view-toggle-btn:hover { color: var(--text-dim); }
  .view-toggle-btn:active { transform: scale(.96); }
  .view-toggle-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .view-toggle-btn.active {
    background: color-mix(in oklch, var(--accent) 20%, var(--surface-3));
    color: var(--accent);
    box-shadow: 0 2px 8px -2px color-mix(in oklch, var(--accent) 40%, transparent);
  }
  .view-toggle-btn.active svg { color: var(--accent); }

  /* ── Main scroll area ── */
  .home-main {
    flex: 1; min-height: 0;
    overflow-y: auto; overflow-x: hidden;
    padding: var(--s-2) 0 calc(96px + var(--safe-b));
    scrollbar-width: none;
    -ms-overflow-style: none;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .home-main::-webkit-scrollbar { display: none; }
  @media (min-width: 768px) {
    .home-main { padding-bottom: var(--s-8); max-width: 1100px; margin: 0 auto; width: 100%; }
  }

  .section-title {
    padding: var(--s-4) var(--s-5) var(--s-2);
    font-size: 12.5px; font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--text-dim);
    text-wrap: balance;
  }

  /* ── Module grid ── */
  .module-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--s-3);
    padding: 0 var(--s-5);
  }
  @media (min-width: 520px) { .module-grid { grid-template-columns: repeat(3, 1fr); gap: var(--s-4); } }
  @media (min-width: 768px) { .module-grid { grid-template-columns: repeat(4, 1fr); gap: var(--s-4); } }
  @media (min-width: 1200px){ .module-grid { grid-template-columns: repeat(6, 1fr); } }

  .module-card {
    position: relative;
    aspect-ratio: 1;
    padding: var(--s-3) var(--s-2);
    border-radius: var(--r-lg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: var(--s-2);
    cursor: pointer;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    color: var(--text);
    background: color-mix(in oklch, var(--c, var(--accent)) 10%, var(--surface-2));
    border: 1px solid color-mix(in oklch, var(--c, var(--accent)) 22%, transparent);
    transition: transform var(--dur-fast) var(--ease-spring),
                border-color var(--dur-fast) var(--ease-out),
                box-shadow var(--dur-fast) var(--ease-out),
                background var(--dur-fast) var(--ease-out);
  }
  .module-card::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 0%,
      color-mix(in oklch, var(--c, var(--accent)) 34%, transparent) 0%,
      transparent 62%);
    opacity: .55;
    transition: opacity var(--dur-base) var(--ease-out);
    pointer-events: none;
  }
  .module-card:hover {
    border-color: color-mix(in oklch, var(--c, var(--accent)) 48%, transparent);
    box-shadow: 0 16px 48px -16px color-mix(in oklch, var(--c, var(--accent)) 65%, transparent);
  }
  .module-card:hover::before { opacity: .95; }
  .module-card:active { transform: scale(.955); }

  .module-card .card-icon {
    position: relative;
    width: 38px; height: 38px;
    color: var(--c, var(--accent));
    filter: drop-shadow(0 4px 14px color-mix(in oklch, var(--c, var(--accent)) 55%, transparent));
    z-index: var(--z-labels);
  }
  .module-card .card-icon svg { width: 100%; height: 100%; display: block; }
  .module-card .card-label {
    position: relative;
    font-size: 12.5px; font-weight: 700;
    text-align: center;
    line-height: 1.2;
    letter-spacing: -.01em;
    z-index: var(--z-labels);
    text-wrap: balance;
  }
  .module-card .card-sub {
    position: relative;
    font-size: 10px; font-weight: 500;
    color: var(--text-mute);
    text-align: center;
    line-height: 1.25;
    margin-top: -2px;
    z-index: var(--z-labels);
  }

  /* ── Recent list ── */
  .recent-list {
    display: flex; flex-direction: column;
    gap: var(--s-2);
    padding: 0 var(--s-5);
  }
  .recent-item {
    display: flex; align-items: center;
    gap: var(--s-3);
    padding: var(--s-3) var(--s-4);
    border-radius: var(--r-md);
    background: var(--surface-2);
    border: 1px solid var(--border);
    cursor: pointer;
    text-align: left;
    color: var(--text);
    transition: background var(--dur-fast) var(--ease-out),
                border-color var(--dur-fast) var(--ease-out),
                transform var(--dur-fast) var(--ease-spring);
    touch-action: manipulation;
  }
  .recent-item:hover { background: var(--surface-3); border-color: var(--border-hi); }
  .recent-item:active { transform: scale(.98); }
  .recent-item .r-icon {
    width: 36px; height: 36px;
    flex: 0 0 auto;
    display: grid; place-items: center;
    border-radius: var(--r-sm);
    background: color-mix(in oklch, var(--c, var(--accent)) 18%, transparent);
    color: var(--c, var(--accent));
    border: 1px solid color-mix(in oklch, var(--c, var(--accent)) 28%, transparent);
  }
  .recent-item .r-icon svg { width: 22px; height: 22px; }
  .recent-item .r-copy { flex: 1; min-width: 0; }
  .recent-item .r-title {
    font-size: 14px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .recent-item .r-sub {
    font-size: 11.5px; color: var(--text-mute);
    margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .recent-item .r-arrow { color: var(--text-mute); flex: 0 0 auto; }
  .recent-item .r-arrow svg { width: 16px; height: 16px; }

  /* ── Empty state ── */
  .empty-state {
    padding: var(--s-10) var(--s-6);
    text-align: center;
    color: var(--text-mute);
  }
  .empty-state svg { width: 52px; height: 52px; opacity: .35; margin: 0 auto var(--s-4); }
  .empty-state .e-title { font-size: 15px; font-weight: 700; color: var(--text-dim); margin-bottom: var(--s-1); }
  .empty-state .e-body { font-size: 13px; line-height: 1.5; max-width: 280px; margin: 0 auto; }

  /* ── About ── */
  .about-content { padding: var(--s-2) var(--s-5) var(--s-10); max-width: 640px; margin: 0 auto; }
  .about-hero {
    position: relative;
    padding: var(--s-6) var(--s-5);
    margin-bottom: var(--s-3);
    border-radius: var(--r-xl);
    overflow: hidden;
    background:
      radial-gradient(140% 120% at 0% 0%, color-mix(in oklch, var(--accent) 24%, transparent) 0%, transparent 55%),
      radial-gradient(140% 120% at 100% 100%, color-mix(in oklch, var(--accent-2) 24%, transparent) 0%, transparent 55%),
      var(--surface-2);
    border: 1px solid var(--border);
  }
  .about-hero .ah-eyebrow {
    font-size: 10.5px; font-weight: 800;
    letter-spacing: .15em; text-transform: uppercase;
    color: var(--accent);
    margin-bottom: var(--s-2);
  }
  .about-hero h2 {
    font-size: 22px; font-weight: 800;
    letter-spacing: -.03em;
    line-height: 1.15;
    margin-bottom: var(--s-2);
    text-wrap: balance;
  }
  .about-hero p { font-size: 13.5px; line-height: 1.6; color: var(--text-dim); max-width: 440px; }
  .about-hero .ah-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--s-4); }
  .about-hero .ah-tag {
    font-size: 10.5px; font-weight: 700;
    padding: 5px 10px;
    border-radius: var(--r-pill);
    background: color-mix(in oklch, var(--accent) 16%, transparent);
    color: var(--accent);
    border: 1px solid color-mix(in oklch, var(--accent) 32%, transparent);
  }
  .about-card {
    padding: var(--s-5);
    margin-bottom: var(--s-3);
    border-radius: var(--r-lg);
    background: var(--surface-2);
    border: 1px solid var(--border);
  }
  .about-card h3 { font-size: 16px; font-weight: 800; margin-bottom: var(--s-2); letter-spacing: -.01em; }
  .about-card p { font-size: 13.5px; line-height: 1.6; color: var(--text-dim); }
  .about-card p + p { margin-top: var(--s-2); }
  .about-card strong { color: var(--text); font-weight: 700; }
  .maker-card {
    position: relative;
    display: flex; align-items: center;
    gap: var(--s-4);
    padding: var(--s-5);
    margin-bottom: var(--s-3);
    border-radius: var(--r-xl);
    overflow: hidden;
    background: linear-gradient(135deg,
      color-mix(in oklch, var(--accent) 14%, transparent) 0%,
      color-mix(in oklch, var(--accent-2) 12%, transparent) 100%);
    border: 1px solid color-mix(in oklch, var(--accent) 26%, transparent);
  }
  .maker-card::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(circle at 100% 0%,
      color-mix(in oklch, var(--accent-2) 32%, transparent) 0%,
      transparent 55%);
    opacity: .6;
    pointer-events: none;
  }
  .maker-avatar {
    position: relative;
    width: 56px; height: 56px;
    flex: 0 0 auto;
    border-radius: var(--r-md);
    display: grid; place-items: center;
    font-size: 20px; font-weight: 900;
    letter-spacing: -.04em;
    color: #0a0d13;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 28px -8px color-mix(in oklch, var(--accent) 65%, transparent);
    z-index: var(--z-labels);
  }
  .maker-copy { position: relative; flex: 1; min-width: 0; z-index: var(--z-labels); }
  .maker-role {
    font-size: 10.5px; font-weight: 800;
    letter-spacing: .15em; text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .maker-name { font-size: 18px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  .maker-tag { font-size: 12px; color: var(--text-dim); margin-top: 4px; line-height: 1.4; }
  .about-credits {
    text-align: center;
    padding: var(--s-6) var(--s-5) 0;
    font-size: 11.5px; color: var(--text-mute);
    line-height: 1.7;
  }
  .about-credits .dot {
    display: inline-block;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--text-mute);
    margin: 0 6px;
    transform: translateY(-3px);
    opacity: .5;
  }
  .about-credits .sig { font-weight: 700; color: var(--text-dim); letter-spacing: .01em; }

  /* ── Bottom nav ── */
  #bottom-nav {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    display: flex; align-items: stretch;
    padding: 6px 10px calc(6px + var(--safe-b));
    background: color-mix(in oklch, var(--bg) 92%, transparent);
    backdrop-filter: blur(var(--blur-lg)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--blur-lg)) saturate(180%);
    border-top: 1px solid var(--border);
    z-index: var(--z-dock);
  }
  @media (min-width: 768px) {
    #bottom-nav {
      max-width: 640px; margin: 0 auto;
      border-radius: var(--r-xl) var(--r-xl) 0 0;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
  }
  .nav-tab {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3px;
    padding: var(--s-2) var(--s-1);
    border-radius: var(--r-sm);
    color: var(--text-mute);
    font-size: 10.5px; font-weight: 700;
    letter-spacing: .01em;
    transition: color var(--dur-base) var(--ease-out),
                background var(--dur-base) var(--ease-out);
  }
  .nav-tab svg { width: 22px; height: 22px; transition: transform var(--dur-base) var(--ease-spring); }
  .nav-tab.active { color: var(--accent); }
  .nav-tab.active svg { transform: translateY(-1px); }
  .nav-tab:active { background: var(--surface-hover); }

  /* ═══════════════════════════════════════════════════════════════════
     MODULE SCREEN
     ═══════════════════════════════════════════════════════════════════ */
  #module-screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform var(--dur-slow) var(--ease-in-out);
    background: var(--bg);
    z-index: var(--z-menu);
    overflow: hidden;
    will-change: transform;
  }
  #module-screen.active { transform: translateX(0); }

  /* header (chrome.js) is the first child of #module-screen; the frame host fills the rest */
  #module-frame-host { position: relative; flex: 1 1 auto; min-height: 0; background: var(--bg); }
  #module-frame-host iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0;
    background: var(--bg);
    display: none;
  }
  #module-frame-host iframe.active { display: block; }

  /* ── Boot loader ── */
  #boot-loader {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: var(--bg);
    z-index: var(--z-toast);
    transition: opacity var(--dur-slow) var(--ease-out);
    pointer-events: none;
  }
  #boot-loader.hidden { opacity: 0; }
  .boot-inner { display: flex; flex-direction: column; align-items: center; gap: var(--s-4); }
  .boot-ring {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 2.5px solid color-mix(in oklch, var(--text) 15%, transparent);
    border-top-color: var(--accent);
    animation: spin .9s linear infinite;
  }
  .boot-credit {
    font-size: 10.5px; font-weight: 700;
    letter-spacing: .22em; text-transform: uppercase;
    color: var(--text-mute);
    opacity: 0;
    animation: fadeUp .6s .3s var(--ease-out) forwards;
  }
  .boot-credit span {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: .85; transform: translateY(0); }
  }
}

  /* ── Systems layer (domain → system → modules) ── */
  .dom-tabs{display:flex;gap:var(--s-2);overflow-x:auto;padding:0 var(--s-5) var(--s-3);scrollbar-width:none}
  .dom-tabs::-webkit-scrollbar{display:none}
  .dom-tab{flex:none;padding:7px 14px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;color:var(--text-mute);background:var(--surface-2);border:1px solid var(--border)}
  .dom-tab.on{color:var(--text);border-color:var(--accent);background:color-mix(in oklch,var(--accent) 16%,var(--surface-2))}
  .sys-grid{display:grid;grid-template-columns:1fr;gap:var(--s-3);padding:0 var(--s-5) var(--s-4)}
  @media(min-width:600px){.sys-grid{grid-template-columns:repeat(2,1fr)}}
  @media(min-width:1000px){.sys-grid{grid-template-columns:repeat(3,1fr)}}
  .sys-card{position:relative;text-align:left;color:var(--text);padding:var(--s-4);border-radius:var(--r-lg);display:grid;grid-template-columns:44px 1fr;gap:2px var(--s-3);overflow:hidden;
    background:color-mix(in oklch,var(--c) 9%,var(--surface-2));border:1px solid color-mix(in oklch,var(--c) 24%,transparent);transition:transform var(--dur-fast) var(--ease-spring),box-shadow var(--dur-fast)}
  .sys-card:hover{box-shadow:0 14px 40px -16px color-mix(in oklch,var(--c) 65%,transparent)}.sys-card:active{transform:scale(.97)}
  .sys-ic{width:44px;height:44px;padding:9px;border-radius:var(--r-sm);color:var(--c);background:color-mix(in oklch,var(--c) 16%,transparent);grid-row:span 3}
  .sys-ic svg{width:100%;height:100%}
  .sys-name{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
  .sys-desc{font-size:12px;line-height:1.4;color:var(--text-mute)}
  .sys-foot{font-size:11px;font-weight:600;color:var(--c);margin-top:4px}
  .sys-back{margin:0 var(--s-5) var(--s-3);padding:6px 12px 6px 8px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;color:var(--text-mute);background:var(--surface-2);border:1px solid var(--border)}
  .sys-head{display:flex;gap:var(--s-4);align-items:center;margin:0 var(--s-5) var(--s-4);padding:var(--s-4);border-radius:var(--r-lg);background:linear-gradient(135deg,color-mix(in oklch,var(--c) 20%,var(--surface-2)),var(--surface-2));border:1px solid color-mix(in oklch,var(--c) 28%,transparent)}
  .sys-head .sys-ic{width:56px;height:56px;padding:12px;grid-row:auto;flex:none}
  .sys-kick{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--c)}
  .sys-title{font-size:19px;letter-spacing:-.02em;margin:2px 0}.sys-blurb{font-size:12.5px;line-height:1.45;color:var(--text-mute)}
  .flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 var(--s-5) var(--s-4);padding:var(--s-3);border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--border)}
  .flow-step{font-size:12px;font-weight:600;padding:5px 10px;border-radius:var(--r-pill);background:color-mix(in oklch,var(--c) 10%,transparent);color:var(--text-mute)}
  .flow-step.link{color:var(--text);border:1px solid color-mix(in oklch,var(--c) 45%,transparent)}
  .flow-arrow{color:var(--text-mute);font-size:12px}
  .mod-list{display:flex;flex-direction:column;gap:var(--s-2);padding:0 var(--s-5) var(--s-4)}
  .mod-row{display:flex;align-items:center;gap:var(--s-3);text-align:left;color:var(--text);padding:var(--s-3) var(--s-4);border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--c);transition:transform var(--dur-fast) var(--ease-spring),background var(--dur-fast)}
  .mod-row:hover{background:color-mix(in oklch,var(--c) 10%,var(--surface-2))}.mod-row:active{transform:scale(.985)}

  .badge.basic{color:var(--ok)}.badge.intermediate{color:var(--warn)}.badge.advanced{color:var(--crit)}
  .mod-row.soon{opacity:.5;border-left-style:dashed;cursor:default}.mod-row.soon:hover{background:var(--surface-2)}.mod-row.soon:active{transform:none}
  .rel{display:flex;flex-wrap:wrap;gap:var(--s-2);padding:0 var(--s-5) var(--s-6)}

  /* ═══════════════════════════════════════════════════════════════════
     APPS VIEW — mobile launcher style grid, grouped by system.
     ═══════════════════════════════════════════════════════════════════ */
  .apps-wrap { padding: 0 var(--s-4) var(--s-4); display: flex; flex-direction: column; gap: var(--s-5); }

  .app-system {
    position: relative;
    padding: var(--s-4) var(--s-3) var(--s-5);
    border-radius: var(--r-xl);
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 0% 0%,
        color-mix(in oklch, var(--c) 14%, transparent) 0%,
        transparent 60%),
      var(--surface-2);
    border: 1px solid color-mix(in oklch, var(--c) 26%, var(--border));
    box-shadow: 0 1px 0 color-mix(in oklch, var(--c) 8%, transparent) inset;
  }
  .app-system-head {
    display: flex; align-items: center;
    gap: var(--s-3);
    margin-bottom: var(--s-4);
    padding: 0 var(--s-1) var(--s-3);
    border-bottom: 1px solid color-mix(in oklch, var(--c) 22%, transparent);
  }
  .app-system-ic {
    width: 36px; height: 36px;
    padding: 8px;
    flex: 0 0 auto;
    border-radius: var(--r-sm);
    background: color-mix(in oklch, var(--c) 20%, transparent);
    color: var(--c);
    border: 1px solid color-mix(in oklch, var(--c) 30%, transparent);
  }
  .app-system-ic svg { width: 100%; height: 100%; display: block; }
  .app-system-meta { flex: 1; min-width: 0; }
  .app-system-title {
    font-size: 15px; font-weight: 800;
    letter-spacing: -.015em;
    line-height: 1.2;
    color: var(--text);
    text-wrap: balance;
  }
  .app-system-sub {
    font-size: 11.5px; font-weight: 500;
    color: var(--text-mute);
    margin-top: 3px;
    letter-spacing: .01em;
  }
  .app-system-count {
    flex: 0 0 auto;
    font: 700 11px var(--font-mono);
    padding: 4px 9px;
    border-radius: var(--r-pill);
    background: color-mix(in oklch, var(--c) 18%, transparent);
    color: var(--c);
    border: 1px solid color-mix(in oklch, var(--c) 32%, transparent);
  }

  .app-tiles {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--s-4) var(--s-1);
    padding: 0 var(--s-1);
  }
  @media (min-width: 520px) { .app-tiles { grid-template-columns: repeat(5, 1fr); } }
  @media (min-width: 768px) { .app-tiles { grid-template-columns: repeat(6, 1fr); } }
  @media (min-width: 1024px) { .app-tiles { grid-template-columns: repeat(8, 1fr); } }

  .app-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;
    gap: 0;
    cursor: pointer;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
    transition: transform var(--dur-fast) var(--ease-spring);
    touch-action: manipulation;
  }
  .app-tile:active { transform: scale(.90); }

  .app-tile-ic {
    position: relative;
    width: 56px;
    height: 56px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--c), color-mix(in oklch, var(--c) 70%, black));
    color: #fff;
    box-shadow: 0 6px 16px -6px color-mix(in oklch, var(--c) 60%, transparent);
    transition: box-shadow var(--dur-fast) var(--ease-out);
  }
  .app-tile:hover .app-tile-ic {
    box-shadow: 0 8px 24px -6px color-mix(in oklch, var(--c) 80%, transparent);
  }
  .app-tile-ic svg { width: 28px; height: 28px; }

  .app-tile-lbl {
    margin-top: 6px;
    font-size: 10.5px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--text);
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    padding: 0 2px;
    letter-spacing: -.01em;
  }

  .app-tile-mode {
    position: absolute;
    top: -4px;
    right: -4px;
    font: 700 8.5px var(--font-mono);
    padding: 2px 5px;
    border-radius: 6px;
    background: var(--bg);
    color: var(--text-mute);
    border: 1px solid var(--border);
    letter-spacing: .04em;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    z-index: var(--z-monitor);   /* badge above the card content */
  }

  /* Coming soon tile */
  .app-tile.soon { cursor: default; }
  .app-tile.soon:active { transform: none; }
  .app-tile.soon .app-tile-ic {
    background: var(--surface-2);
    color: var(--text-mute);
    border: 1px dashed var(--border);
    box-shadow: none;
  }
  .app-tile.soon:hover .app-tile-ic { box-shadow: none; }
  .app-tile.soon .app-tile-lbl { color: var(--text-mute); }

  /* View transition — respect reduced motion */
  .apps-wrap, .sys-grid, .module-grid, .recent-list {
    animation: viewFadeIn var(--dur-base) var(--ease-out);
  }
  @keyframes viewFadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .apps-wrap, .sys-grid, .module-grid, .recent-list,
    .app-tile, .app-tile-ic, .module-card, .module-card::before,
    .sys-card, .brand-mark::after, .boot-ring {
      animation: none !important;
      transition: none !important;
    }
  }

<script>
/* ═══════════════════════════════════════════════════════════════════════
   perf-guard — inlined. Pauses off-screen iframes to save battery.
   ═══════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  var HOST_ID = 'module-frame-host';

  var CONTROLLER = [
    '(function () {',
    '  if (window.__autolabPerfGuard) return;',
    '  window.__autolabPerfGuard = true;',
    '  var raf = window.requestAnimationFrame.bind(window);',
    '  var caf = window.cancelAnimationFrame.bind(window);',
    '  var paused = false;',
    '  var parked = new Map();',
    '  var uid = 1000000000;',
    '  window.requestAnimationFrame = function (cb) {',
    '    if (!paused) return raf(cb);',
    '    var id = ++uid;',
    '    parked.set(id, cb);',
    '    return id;',
    '  };',
    '  window.cancelAnimationFrame = function (id) {',
    '    if (parked.has(id)) { parked.delete(id); return; }',
    '    return caf(id);',
    '  };',
    '  function resume() {',
    '    if (!paused) return;',
    '    paused = false;',
    '    var cbs = [];',
    '    parked.forEach(function (cb) { cbs.push(cb); });',
    '    parked.clear();',
    '    for (var i = 0; i < cbs.length; i++) raf(cbs[i]);',
    '  }',
    '  window.addEventListener("message", function (e) {',
    '    var d = e.data;',
    '    if (!d || d.source !== "auto-shell") return;',
    '    if (d.action === "perf-pause")  { paused = true; return; }',
    '    if (d.action === "perf-resume") { resume(); }',
    '  });',
    '  try {',
    '    window.parent.postMessage(',
    '      { source: "auto-module-perf", action: "perf-ready" }, "*");',
    '  } catch (_) {}',
    '})();'
  ].join('\n');

  function inject(iframe) {
    var doc;
    try { doc = iframe.contentDocument; } catch (_) { return false; }
    if (!doc || !doc.documentElement) return false;
    if (doc.getElementById('autolab-perf-guard')) return true;
    try {
      var s = doc.createElement('script');
      s.id = 'autolab-perf-guard';
      s.textContent = CONTROLLER;
      (doc.head || doc.documentElement).appendChild(s);
      return true;
    } catch (_) { return false; }
  }
  function send(iframe, action) {
    try {
      iframe.contentWindow.postMessage({ source: 'auto-shell', action: action }, '*');
    } catch (_) {}
  }
  function sync(iframe) {
    if (!inject(iframe)) return false;
    send(iframe, iframe.classList.contains('active') ? 'perf-resume' : 'perf-pause');
    return true;
  }
  function retry(iframe) {
    var tries = 0;
    (function attempt() {
      if (sync(iframe)) return;
      if (++tries > 150) return;
      setTimeout(attempt, 30);
    })();
  }
  function watch(iframe) {
    if (iframe.__perfWatched) return;
    iframe.__perfWatched = true;
    retry(iframe);
    iframe.addEventListener('load', function () { retry(iframe); });
    new MutationObserver(function () { sync(iframe); })
      .observe(iframe, { attributes: true, attributeFilter: ['class'] });
  }
  function findBySource(src) {
    var host = document.getElementById(HOST_ID);
    if (!host) return null;
    var list = host.querySelectorAll('iframe');
    for (var i = 0; i < list.length; i++) {
      try { if (list[i].contentWindow === src) return list[i]; } catch (_) {}
    }
    return null;
  }
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.source !== 'auto-module-perf') return;
    if (d.action !== 'perf-ready') return;
    var fr = findBySource(e.source);
    if (fr) sync(fr);
  });
  function start() {
    var host = document.getElementById(HOST_ID);
    if (!host) { setTimeout(start, 200); return; }
    new MutationObserver(function () {
      var list = host.querySelectorAll('iframe');
      for (var i = 0; i < list.length; i++) watch(list[i]);
    }).observe(host, { childList: true });
    var list = host.querySelectorAll('iframe');
    for (var i = 0; i < list.length; i++) watch(list[i]);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start, { once: true });
  } else {
    start();
  }
})();
</script>

<script type="module">
import { createHeader, createMenu, SPEED, clampSpeed, isPhone } from './chrome.js';
import { createKeyRouter, installKeys } from './keys.js';
/* ═══════════════════════════════════════════════════════════════════════
   Shell — home screen, module frame control, header + ⋯ menu.
   ═══════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  var modules       = window.AUTO_MODULES || [];
  var homeScreen    = document.getElementById('home-screen');
  var homeMain      = document.getElementById('home-main');
  var bottomNav     = document.getElementById('bottom-nav');
  var searchInput   = document.getElementById('search-input');
  var installBtnEl  = document.getElementById('install-btn');
  var moduleCountEl = document.getElementById('module-count');
  var moduleScreen  = document.getElementById('module-screen');
  var frameHost     = document.getElementById('module-frame-host');
  var bootLoader    = document.getElementById('boot-loader');
  var viewToggleEl  = document.querySelector('.view-toggle');

  var PREF_KEY = 'autolab.prefs';

  function loadPrefs() {
    try { var r = localStorage.getItem(PREF_KEY); return r ? JSON.parse(r) : null; }
    catch (_) { return null; }
  }
  function detectSystemTheme() {
    try {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) return 'light';
    } catch (_) {}
    return 'dark';
  }
  var savedPrefs = loadPrefs() || {};

  var state = {
    tab: 'home', sys: null, dom: 'All',
    view: savedPrefs.view === 'roadmap' ? 'roadmap' : 'modules',
    active: null,
    playing: true,
    speed: SPEED.def,
    density: isPhone(window.innerWidth, window.innerHeight) ? 1 : 2,   /* label density: 2 all · 1 key · 0 none (labels.js); Key on phones */
    gas: true,           /* no UI since Phase 1; still sent so modules keep their default */
    theme: savedPrefs.theme || detectSystemTheme(),
    wireframe: !!savedPrefs.wireframe,
    xray: !!savedPrefs.xray,
    recents: loadRecents()
  };
  var iframes = Object.create(null);
  var speedTouched = false;
  var modSpeed = Object.create(null);

  function savePrefs() {
    try {
      localStorage.setItem(PREF_KEY, JSON.stringify({
        theme: state.theme,
        wireframe: state.wireframe,
        xray: state.xray,
        view: state.view
      }));
    } catch (_) {}
  }
  function loadRecents() {
    try {
      var r = localStorage.getItem('autolab.recents');
      if (!r) return [];
      var a = JSON.parse(r);
      if (!Array.isArray(a)) return [];
      return a.filter(function (id) { return modules.some(function (m) { return m.id === id; }); }).slice(0, 6);
    } catch (_) { return []; }
  }
  var visited = (function () {
    try { var v = JSON.parse(localStorage.getItem('autolab.visited') || '[]'); return Array.isArray(v) ? v : []; }
    catch (_) { return []; }
  })();
  function markVisited(id) {
    if (visited.indexOf(id) !== -1) return;
    visited.push(id);
    try { localStorage.setItem('autolab.visited', JSON.stringify(visited)); } catch (_) {}
  }
  function pushRecent(id) {
    markVisited(id);
    var a = state.recents.filter(function (x) { return x !== id; });
    a.unshift(id);
    state.recents = a.slice(0, 6);
    try { localStorage.setItem('autolab.recents', JSON.stringify(state.recents)); } catch (_) {}
  }

  function injectEmbedFix(fr) {
    try {
      var doc = fr.contentDocument;
      if (!doc || !doc.body) return;
      doc.body.classList.add('embedded');
      /* Theme is NOT written here any more: the shell sends `setTheme` (one path). */
      if (doc.body.classList.contains('uses-ui-kit')) return;
    } catch (_) {}
  }

  var MAX_LIVE = 4;
  var lru = [];
  function touchLru(id) { lru = lru.filter(function (x) { return x !== id; }); lru.push(id); }
  function evictOld(keepId) {
    while (lru.length > MAX_LIVE) {
      var victim = null;
      for (var i = 0; i < lru.length; i++) if (lru[i] !== keepId) { victim = lru[i]; break; }
      if (!victim) return;
      lru = lru.filter(function (x) { return x !== victim; });
      var fr = iframes[victim];
      if (fr) {
        try { fr.contentWindow.dispatchEvent(new Event('pagehide')); } catch (_) {}
        try { fr.src = 'about:blank'; } catch (_) {}
        if (fr.parentNode) fr.parentNode.removeChild(fr);
        delete iframes[victim];
      }
    }
  }

  function ensureIframe(mod) {
    if (iframes[mod.id]) return iframes[mod.id];
    var fr = document.createElement('iframe');
    fr.title = mod.title;
    fr.dataset.module = mod.id;
    fr.loading = 'eager';
    fr.setAttribute('allow', 'autoplay; fullscreen');
    fr.src = mod.file;
    fr.addEventListener('load', function () {
      injectEmbedFix(fr);
      var nudge = function () {
        try { fr.contentWindow.dispatchEvent(new Event('resize')); } catch (_) {}
        try { if (fr.contentWindow.document) fr.contentWindow.document.dispatchEvent(new Event('resize')); } catch (_) {}
      };
      nudge();
      setTimeout(nudge, 80);
      setTimeout(nudge, 320);
      sendAllCommands(mod.id);
    });
    frameHost.appendChild(fr);
    iframes[mod.id] = fr;
    return fr;
  }

  function postTo(id, msg) {
    var fr = iframes[id];
    if (!fr || !fr.contentWindow) return;
    try {
      fr.contentWindow.postMessage(Object.assign({ source: 'auto-shell', moduleId: id }, msg), '*');
    } catch (_) {}
  }
  function sendAllCommands(id) {
    var fr = iframes[id];
    if (!fr) return;
    var win = fr.contentWindow;
    if (!win) return;
    var ready = false;
    try { ready = !!(win.document && win.document.body); } catch (_) {}
    if (!ready) { fr.addEventListener('load', function () { sendAllCommands(id); }, { once: true }); return; }
    postTo(id, { type: 'command', action: 'setPlaying',   value: state.playing });
    if (speedTouched) postTo(id, { type: 'command', action: 'setSpeed', value: state.speed });
    postTo(id, { type: 'command', action: 'setLabelDensity', value: state.density });
    postTo(id, { type: 'command', action: 'setGas',       value: state.gas });
    postTo(id, { type: 'command', action: 'setTheme',     value: state.theme });
    postTo(id, { type: 'command', action: 'setWireframe', value: state.wireframe });
    postTo(id, { type: 'command', action: 'setXRay',      value: state.xray });
  }

  function svgWrap(inner) {
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('fill', 'none');
    s.setAttribute('stroke', 'currentColor');
    s.setAttribute('stroke-width', '1.7');
    s.setAttribute('stroke-linecap', 'round');
    s.setAttribute('stroke-linejoin', 'round');
    s.innerHTML = inner || '';
    return s;
  }

  /* ─── View toggle ─── */
  function applyViewToggleUI() {
    if (!viewToggleEl) return;
    viewToggleEl.querySelectorAll('.view-toggle-btn').forEach(function (b) {
      var on = b.dataset.view === state.view;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  }
  function setView(v) {
    if (v !== 'modules' && v !== 'roadmap') return;
    if (state.view === v) return;
    state.view = v;
    state.sys = null;
    applyViewToggleUI();
    savePrefs();
    if (state.tab === 'home') renderHome('home');
  }
  if (viewToggleEl) {
    viewToggleEl.addEventListener('click', function (e) {
      var b = e.target.closest('.view-toggle-btn');
      if (!b) return;
      setView(b.dataset.view);
    });
    viewToggleEl.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      var next = state.view === 'roadmap' ? 'modules' : 'roadmap';
      setView(next);
      var target = viewToggleEl.querySelector('[data-view="' + next + '"]');
      if (target) target.focus();
    });
  }

  /* ─── Home rendering ─── */
  function renderHome(tab) {
    state.tab = tab;
    document.querySelectorAll('.nav-tab').forEach(function (b) {
      var on = b.dataset.tab === tab;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    if (viewToggleEl) viewToggleEl.style.display = (tab === 'home') ? '' : 'none';
    homeMain.innerHTML = '';
    if (tab === 'home') renderAllModules();
    else if (tab === 'recents') renderRecents();
    else if (tab === 'about') renderAbout();
  }

  function buildCard(mod) {
    var card = document.createElement('button');
    card.className = 'module-card';
    card.style.setProperty('--c', mod.color || 'var(--accent)');
    card.setAttribute('aria-label', mod.title + (visited.indexOf(mod.id) !== -1 ? ' (explored)' : ''));
    if (visited.indexOf(mod.id) !== -1) card.classList.add('done');
    var iconBox = document.createElement('div');
    iconBox.className = 'card-icon';
    iconBox.appendChild(svgWrap(mod.icon || ''));
    card.appendChild(iconBox);
    var lbl = document.createElement('div');
    lbl.className = 'card-label';
    lbl.textContent = mod.label || mod.title;
    card.appendChild(lbl);
    var sub = document.createElement('div');
    sub.className = 'card-sub';
    sub.textContent = (mod.subtitle || '').split('·')[0].trim();
    card.appendChild(sub);
    card.addEventListener('click', function () { openModule(mod.id); });
    return card;
  }

  function renderAllModules() {
    var q = (searchInput.value || '').trim().toLowerCase();
    var filtered = q
      ? modules.filter(function (m) {
          return m.title.toLowerCase().indexOf(q) >= 0 ||
                 (m.subtitle || '').toLowerCase().indexOf(q) >= 0 ||
                 (m.label || '').toLowerCase().indexOf(q) >= 0;
        })
      : modules;

    if (q) {
      var st = document.createElement('div');
      st.className = 'section-title';
      st.textContent = 'Results (' + filtered.length + ')';
      homeMain.appendChild(st);
      if (!filtered.length) {
        homeMain.appendChild(buildEmptyState('No matches', 'Nothing found for "' + searchInput.value + '". Try another word.'));
        return;
      }
      var grid = document.createElement('div');
      grid.className = 'module-grid';
      filtered.forEach(function (m) { grid.appendChild(buildCard(m)); });
      homeMain.appendChild(grid);
      return;
    }

    if (state.sys) { renderSystem(state.sys); return; }
    if (state.view === 'modules') { renderModulesHome(); return; }
    renderSystems();
  }


  /*  Modules home: Jump back in + flat grid of all modules  */
  function renderModulesHome() {
    var last = state.recents.length ? modules.filter(function (m) { return m.id === state.recents[0]; })[0] : null;
    if (last) {
      homeMain.appendChild(el('div', 'section-title', 'Jump back in'));
      var j = el('button', 'jump-card'); j.style.setProperty('--c', last.color || 'var(--accent)');
      j.setAttribute('aria-label', 'Continue ' + last.title);
      var ib = el('div', 'jump-ic'); ib.appendChild(svgWrap(last.icon || '')); j.appendChild(ib);
      var cp = el('div', 'jump-copy');
      cp.appendChild(el('div', 'jump-t', last.title));
      cp.appendChild(el('div', 'jump-s', last.subtitle || ''));
      j.appendChild(cp);
      var ar = el('div', 'jump-arrow'); ar.appendChild(svgWrap('<path d="M9 6l6 6-6 6"/>')); j.appendChild(ar);
      j.onclick = function () { openModule(last.id); };
      var wrapJ = el('div', 'jump-wrap'); wrapJ.appendChild(j); homeMain.appendChild(wrapJ);
    }
    var done = modules.filter(function (m) { return visited.indexOf(m.id) !== -1; }).length;
    var pr = el('div', 'progress-card');
    pr.setAttribute('role', 'progressbar');
    pr.setAttribute('aria-valuemin', '0'); pr.setAttribute('aria-valuemax', String(modules.length));
    pr.setAttribute('aria-valuenow', String(done));
    pr.setAttribute('aria-label', 'Modules explored');
    pr.appendChild(el('div', 'progress-t', 'Explored ' + done + ' of ' + modules.length + ' modules'));
    var tr = el('div', 'progress-track'), fl = el('div', 'progress-fill');
    fl.style.width = (modules.length ? Math.round(done / modules.length * 100) : 0) + '%';
    tr.appendChild(fl); pr.appendChild(tr); homeMain.appendChild(pr);
    homeMain.appendChild(el('div', 'section-title', 'All modules'));
    var grid = el('div', 'module-grid');
    modules.forEach(function (m) { grid.appendChild(buildCard(m)); });
    homeMain.appendChild(grid);
  }

  /* ─── Systems layer (roadmap view) ─── */
  var SYSTEMS = window.AUTO_SYSTEMS || [], DOMAINS = window.AUTO_DOMAINS || [], META = window.AUTO_META || {};
  function el(t, c, txt) { var e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; }
  function byId(id) { return modules.filter(function (m) { return m.id === id; })[0]; }
  function allSystems() {
    var used = {}; SYSTEMS.forEach(function (s) { s.modules.forEach(function (i) { used[i] = 1; }); });
    var rest = modules.filter(function (m) { return !used[m.id]; });
    return rest.length ? SYSTEMS.concat([{ id: 'other', domain: 'Other', title: 'Other', color: '#94a3b8', blurb: 'Additional modules.',
      icon: '<circle cx="12" cy="12" r="8"/>', modules: rest.map(function (m) { return m.id; }), soon: [], flow: [], related: [] }]) : SYSTEMS;
  }
  function icBox(icon, c) { var b = el('div', 'sys-ic'); if (c) b.style.setProperty('--c', c); b.appendChild(svgWrap(icon)); return b; }
  function goSys(id) { state.sys = id; renderHome('home'); homeMain.scrollTop = 0; }

  function renderSystems() {
    var all = allSystems(), hasOther = all.some(function (s) { return s.id === 'other'; });
    var doms = ['All'].concat(DOMAINS, hasOther ? ['Other'] : []);
    var tabs = el('div', 'dom-tabs');
    doms.forEach(function (d) {
      var b = el('button', 'dom-tab' + (state.dom === d ? ' on' : ''), d);
      b.onclick = function () { state.dom = d; renderHome('home'); };
      tabs.appendChild(b);
    });
    homeMain.appendChild(tabs);
    doms.slice(1).forEach(function (d) {
      if (state.dom !== 'All' && state.dom !== d) return;
      var list = all.filter(function (s) { return s.domain === d; });
      if (!list.length) return;
      homeMain.appendChild(el('div', 'section-title', d));
      var g = el('div', 'sys-grid');
      list.forEach(function (s) {
        var c = el('button', 'sys-card'); c.style.setProperty('--c', s.color);
        c.setAttribute('aria-label', s.title);
        c.appendChild(icBox(s.icon));
        c.appendChild(el('div', 'sys-name', s.title));
        c.appendChild(el('div', 'sys-desc', s.blurb));
        var n = s.modules.length;
        c.appendChild(el('div', 'sys-foot', n + (n === 1 ? ' module' : ' modules') + (s.soon.length ? ' · ' + s.soon.length + ' coming soon' : '')));
        c.onclick = function () { goSys(s.id); };
        g.appendChild(c);
      });
      homeMain.appendChild(g);
    });
  }

  function modRow(m, i, s) {
    var mt = META[m.id] || ['Basic', 10, '3D'];
    var r = el('button', 'mod-row'); r.style.setProperty('--c', m.color || s.color);
    r.appendChild(el('span', 'mod-num', String(i + 1)));
    r.appendChild(icBox(m.icon || '', m.color));
    var cp = el('div', 'mod-copy');
    cp.appendChild(el('div', 'mod-t', m.title)); cp.appendChild(el('div', 'mod-s', m.subtitle || ''));
    var bd = el('div', 'mod-badges');
    bd.appendChild(el('span', 'badge ' + mt[0].toLowerCase(), mt[0]));
    bd.appendChild(el('span', 'badge', mt[2])); bd.appendChild(el('span', 'badge', '~' + mt[1] + ' min'));
    cp.appendChild(bd); r.appendChild(cp);
    r.onclick = function () { openModule(m.id); };
    return r;
  }

  function renderSystem(id) {
    var s = allSystems().filter(function (x) { return x.id === id; })[0];
    if (!s) { state.sys = null; renderSystems(); return; }
    var back = el('button', 'sys-back', '‹  All systems');
    back.onclick = function () { state.sys = null; renderHome('home'); };
    homeMain.appendChild(back);
    var h = el('div', 'sys-head'); h.style.setProperty('--c', s.color);
    h.appendChild(icBox(s.icon));
    var t = el('div', 'sys-htxt');
    t.appendChild(el('div', 'sys-kick', s.domain)); t.appendChild(el('h2', 'sys-title', s.title)); t.appendChild(el('p', 'sys-blurb', s.blurb));
    h.appendChild(t); homeMain.appendChild(h);
    if (s.flow.length) {
      homeMain.appendChild(el('div', 'section-title', 'How it works'));
      var f = el('div', 'flow'); f.style.setProperty('--c', s.color);
      s.flow.forEach(function (x, i) {
        var p = x.split('|'), n = el(p[1] ? 'button' : 'span', 'flow-step' + (p[1] ? ' link' : ''), p[0]);
        if (p[1]) n.onclick = function () { openModule(p[1]); };
        if (i) f.appendChild(el('span', 'flow-arrow', '→'));
        f.appendChild(n);
      });
      homeMain.appendChild(f);
    }
    homeMain.appendChild(el('div', 'section-title', 'Modules'));
    var l = el('div', 'mod-list'), k = 0;
    s.modules.forEach(function (mid) { var m = byId(mid); if (m) l.appendChild(modRow(m, k++, s)); });
    s.soon.forEach(function (n) {
      var r = el('div', 'mod-row soon'); r.style.setProperty('--c', s.color);
      r.appendChild(el('span', 'mod-num', '·'));
      var cp = el('div', 'mod-copy'); cp.appendChild(el('div', 'mod-t', n)); cp.appendChild(el('div', 'mod-s', 'On the roadmap'));
      r.appendChild(cp); r.appendChild(el('span', 'badge', 'Soon')); l.appendChild(r);
    });
    homeMain.appendChild(l);
    var rel = (s.related || []).map(function (rid) { return allSystems().filter(function (x) { return x.id === rid; })[0]; }).filter(Boolean);
    if (rel.length) {
      homeMain.appendChild(el('div', 'section-title', 'Related systems'));
      var rw = el('div', 'rel');
      rel.forEach(function (x) { var b = el('button', 'dom-tab', x.title); b.onclick = function () { goSys(x.id); }; rw.appendChild(b); });
      homeMain.appendChild(rw);
    }
  }

  /* ─── Apps grid view (mobile launcher style) ─── */
  function renderAppsGrid() {
    var all = allSystems(), hasOther = all.some(function (s) { return s.id === 'other'; });
    var doms = ['All'].concat(DOMAINS, hasOther ? ['Other'] : []);

    var tabs = el('div', 'dom-tabs');
    doms.forEach(function (d) {
      var b = el('button', 'dom-tab' + (state.dom === d ? ' on' : ''), d);
      b.onclick = function () { state.dom = d; renderHome('home'); };
      tabs.appendChild(b);
    });
    homeMain.appendChild(tabs);

    var wrap = el('div', 'apps-wrap');

    all.forEach(function (s) {
      if (state.dom !== 'All' && state.dom !== s.domain) return;
      wrap.appendChild(buildAppSystemCard(s));
    });

    if (!wrap.children.length) {
      homeMain.appendChild(buildEmptyState('Nothing here', 'No systems in this group yet.'));
      return;
    }
    homeMain.appendChild(wrap);
  }

  function buildAppSystemCard(s) {
    var card = el('section', 'app-system');
    card.style.setProperty('--c', s.color);
    card.setAttribute('aria-label', s.title + ' — ' + (s.modules.length + s.soon.length) + ' modules');

    /* head */
    var head = el('div', 'app-system-head');
    var ic = el('div', 'app-system-ic');
    ic.appendChild(svgWrap(s.icon));
    head.appendChild(ic);

    var meta = el('div', 'app-system-meta');
    meta.appendChild(el('div', 'app-system-title', s.title));
    var subBits = [s.domain];
    if (s.blurb) subBits.push(s.blurb.split('.')[0]);
    meta.appendChild(el('div', 'app-system-sub', subBits.join(' · ')));
    head.appendChild(meta);

    var total = s.modules.length + (s.soon ? s.soon.length : 0);
    var count = el('span', 'app-system-count', total + (total === 1 ? ' APP' : ' APPS'));
    head.appendChild(count);
    card.appendChild(head);

    /* tiles */
    var tiles = el('div', 'app-tiles');

    s.modules.forEach(function (mid) {
      var m = byId(mid);
      if (!m) return;
      var mt = META[m.id] || ['Basic', 10, '3D'];
      var tile = el('button', 'app-tile');
      tile.style.setProperty('--c', m.color || s.color);
      tile.setAttribute('aria-label', m.title + ' — ' + mt[0] + ' · ' + mt[2]);
      tile.setAttribute('title', m.title);

      var icB = el('div', 'app-tile-ic');
      icB.appendChild(svgWrap(m.icon || ''));
      tile.appendChild(icB);

      if (mt[2]) {
        var badgeText = mt[2] === '3D' ? '3D' : mt[2] === '2D' ? '2D' : 'MIX';
        var badge = el('span', 'app-tile-mode', badgeText);
        icB.appendChild(badge);
      }

      var lbl = el('div', 'app-tile-lbl', m.label || m.title);
      tile.appendChild(lbl);

      tile.onclick = function () { openModule(m.id); };
      tiles.appendChild(tile);
    });

    (s.soon || []).forEach(function (label) {
      var tile = el('div', 'app-tile soon');
      tile.style.setProperty('--c', s.color);
      tile.setAttribute('aria-disabled', 'true');
      tile.setAttribute('title', label + ' — coming soon');
      var icB = el('div', 'app-tile-ic');
      icB.appendChild(svgWrap('<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16v.01"/>'));
      tile.appendChild(icB);
      tile.appendChild(el('div', 'app-tile-lbl', label));
      tiles.appendChild(tile);
    });

    card.appendChild(tiles);
    return card;
  }

  function buildRecentItem(mod) {
    var el = document.createElement('button');
    el.className = 'recent-item';
    el.style.setProperty('--c', mod.color || 'var(--accent)');
    var iconBox = document.createElement('div');
    iconBox.className = 'r-icon';
    iconBox.appendChild(svgWrap(mod.icon || ''));
    el.appendChild(iconBox);
    var copy = document.createElement('div');
    copy.className = 'r-copy';
    var t = document.createElement('div');
    t.className = 'r-title'; t.textContent = mod.title;
    var s = document.createElement('div');
    s.className = 'r-sub'; s.textContent = mod.subtitle || '';
    copy.appendChild(t); copy.appendChild(s);
    el.appendChild(copy);
    var arrow = document.createElement('div');
    arrow.className = 'r-arrow';
    arrow.appendChild(svgWrap('<path d="M9 6l6 6-6 6"/>'));
    el.appendChild(arrow);
    el.addEventListener('click', function () { openModule(mod.id); });
    return el;
  }

  function buildEmptyState(title, body) {
    var el = document.createElement('div');
    el.className = 'empty-state';
    var icon = svgWrap('<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 9h18M8 14h3"/>');
    icon.setAttribute('stroke-width', '1.5');
    el.appendChild(icon);
    var t = document.createElement('div');
    t.className = 'e-title'; t.textContent = title;
    var b = document.createElement('div');
    b.className = 'e-body'; b.textContent = body;
    el.appendChild(t); el.appendChild(b);
    return el;
  }

  function renderRecents() {
    if (!state.recents.length) {
      homeMain.appendChild(buildEmptyState('Nothing here yet', 'Modules you open will appear here for quick access.'));
      return;
    }
    var st = document.createElement('div');
    st.className = 'section-title';
    st.textContent = 'Recently opened';
    homeMain.appendChild(st);
    var list = document.createElement('div');
    list.className = 'recent-list';
    state.recents.forEach(function (id) {
      var m = modules.find(function (x) { return x.id === id; });
      if (m) list.appendChild(buildRecentItem(m));
    });
    homeMain.appendChild(list);
  }

  function renderAbout() {
    var wrap = document.createElement('div');
    wrap.className = 'about-content';
    wrap.innerHTML = [
      '<div class="about-hero">',
      '  <div class="ah-eyebrow">Auto Lab · 3D Learning</div>',
      '  <h2>An interactive lab for the machines that move us.</h2>',
      '  <p>Explore engines, gearboxes, brakes and more — each one running as a live 3D simulation you can orbit, zoom and drive in real time.</p>',
      '  <div class="ah-tags">',
      '    <span class="ah-tag">' + modules.length + ' Modules</span>',
      '    <span class="ah-tag">Offline Ready</span>',
      '    <span class="ah-tag">Installable</span>',
      '    <span class="ah-tag">No Ads</span>',
      '  </div>',
      '</div>',
      '<div class="about-card">',
      '  <h3>How to use</h3>',
      '  <p><strong>Tap any module</strong> to open it. Inside, drag the 3D view to orbit, pinch to zoom, and use the floating controls at the bottom.</p>',
      '  <p>Switch between <strong>Modules</strong> and <strong>Roadmap</strong> with the toggle above — Modules shows every lesson as a card; Roadmap groups them by system and shows how each one connects.</p>',
      '  <p>Tap the <strong>info chip</strong> at the top-left to expand module details. View toggles — theme, wireframe, x-ray — live in the <strong>...</strong> menu and are remembered between sessions.</p>',
      '</div>',
      '<div class="maker-card">',
      '  <div class="maker-avatar">HK</div>',
      '  <div class="maker-copy">',
      '    <div class="maker-role">Designed &amp; Developed by</div>',
      '    <div class="maker-name">Hassan J Khan</div>',
      '    <div class="maker-tag">Engineer · Maker · Curious about how things move</div>',
      '  </div>',
      '</div>',
      '<div class="about-card">',
      '  <h3>Built with</h3>',
      '  <p>Real-time 3D by <strong>Three.js</strong>. Zero external UI frameworks — just clean vanilla JavaScript, tuned for smooth performance on mobile.</p>',
      '  <p>Runs entirely in your browser. Install it to your home screen and it works fully offline.</p>',
      '</div>',
      '<div class="about-credits">',
      '  <span class="sig">Auto Lab</span>',
      '  <span class="dot"></span>',
      '  <span class="sig">Hassan J Khan</span>',
      '  <br>© <span id="about-year"></span> · Crafted with care',
      '</div>'
    ].join('');
    homeMain.appendChild(wrap);
    var y = wrap.querySelector('#about-year');
    if (y) y.textContent = new Date().getFullYear();
  }

  bottomNav.addEventListener('click', function (e) {
    var btn = e.target.closest('.nav-tab');
    if (!btn) return;
    if (btn.dataset.tab === 'home' && state.tab === 'home') state.sys = null;
    renderHome(btn.dataset.tab);
  });
  searchInput.addEventListener('input', function () {
    if (state.tab !== 'home') renderHome('home');
    else renderAllModules();
  });

  /* ─── Theme ─── */
  function applyShellTheme() {
    var isLight = state.theme === 'light';
    document.documentElement.classList.toggle('light-theme', isLight);
    document.body.classList.toggle('light-theme', isLight);
    try { document.querySelector('meta[name="theme-color"]').setAttribute('content', isLight ? '#e8ecf3' : '#0a0d13'); } catch (_) {}
    if (menu) menu.update({ theme: state.theme });
  }
  function setTheme(t) {
    state.theme = (t === 'light') ? 'light' : 'dark';
    applyShellTheme();
    savePrefs();
    if (state.active) postTo(state.active, { type: 'command', action: 'setTheme', value: state.theme });
  }
  function setWireframe(v) {
    v = !!v;
    if (v === state.wireframe) return;
    state.wireframe = v;
    if (v) state.xray = false;
    savePrefs();
    menu.update({ wireframe: state.wireframe, xray: state.xray });
    if (state.active) {
      postTo(state.active, { type: 'command', action: 'setWireframe', value: state.wireframe });
      postTo(state.active, { type: 'command', action: 'setXRay',      value: state.xray });
    }
  }
  function setXRay(v) {
    v = !!v;
    if (v === state.xray) return;
    state.xray = v;
    if (v) state.wireframe = false;
    savePrefs();
    menu.update({ wireframe: state.wireframe, xray: state.xray });
    if (state.active) {
      postTo(state.active, { type: 'command', action: 'setWireframe', value: state.wireframe });
      postTo(state.active, { type: 'command', action: 'setXRay',      value: state.xray });
    }
  }

  /* ─── Open / close module ─── */
  function openModule(id) {
    var mod = modules.find(function (m) { return m.id === id; });
    if (!mod) return;
    state.active = id;
    pushRecent(id);
    for (var k in iframes) {
      if (k !== id) postTo(k, { type: 'command', action: 'setPlaying', value: false });
    }
    var wasLive = !!iframes[id];
    ensureIframe(mod);
    touchLru(id);
    evictOld(id);
    for (var k2 in iframes) iframes[k2].classList.toggle('active', k2 === id);
    moduleScreen.classList.add('active');
    moduleScreen.setAttribute('aria-hidden', 'false');
    homeScreen.classList.add('behind');
    header.setTitle(mod.title); header.setColor(mod.color);
    moduleScreen.style.setProperty('--al-accent', mod.color || 'var(--accent)');   /* header + ⋯ menu share the module accent */
    document.title = mod.title + ' — Auto Lab';
    try { if (location.hash.slice(1) !== id) history.pushState({ mod: id }, '', '#' + id); } catch (_) {}
    if (wasLive) {
      postTo(id, { type: 'command', action: 'setPlaying',   value: state.playing });
      postTo(id, { type: 'command', action: 'setTheme',     value: state.theme });
      postTo(id, { type: 'command', action: 'setWireframe', value: state.wireframe });
      postTo(id, { type: 'command', action: 'setXRay',      value: state.xray });
      if (modSpeed[id] != null) { state.speed = modSpeed[id]; menu.update({ speed: state.speed }); }
    }
    var fr = iframes[id];
    if (fr && fr.contentWindow) {
      setTimeout(function () {
        try { fr.contentWindow.dispatchEvent(new Event('resize')); } catch (_) {}
        try { if (fr.contentWindow.document) fr.contentWindow.document.dispatchEvent(new Event('resize')); } catch (_) {}
      }, 60);
    }
    menu.close(false);
  }

  function closeModule() {
    if (!state.active) return;
    var id = state.active;
    postTo(id, { type: 'command', action: 'setPlaying', value: false });
    if (iframes[id]) iframes[id].classList.remove('active');
    moduleScreen.classList.remove('active');
    moduleScreen.setAttribute('aria-hidden', 'true');
    homeScreen.classList.remove('behind');
    state.active = null;
    if (state.tab === 'home' && state.view === 'modules' && typeof renderHome === 'function') { try { renderHome('home'); } catch (_) {} }
    document.title = 'Auto Lab';
    try { if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch (_) {}
    menu.close(false);
  }
  function requestClose() {
    if (history.state && history.state.mod) history.back(); else closeModule();
  }

  window.addEventListener('popstate', function () {
    var id = location.hash.slice(1);
    if (id && modules.some(function (m) { return m.id === id; })) {
      if (state.active !== id) openModule(id);
    } else closeModule();
  });

  /* ─── Header + ⋯ menu (chrome.js) — the only global controls the shell owns ─── */
  var header = createHeader({
    onBack: function () { requestClose(); },
    onInfo: function () { if (state.active) postTo(state.active, { type: 'command', action: 'toggleInfo' }); },
    onMenu: function (anchor) { menu.toggle(anchor); }
  });
  moduleScreen.insertBefore(header.root, frameHost);

  var menu = createMenu({
    host: moduleScreen,
    state: { speed: state.speed, density: state.density, theme: state.theme, wireframe: state.wireframe, xray: state.xray },
    onToggle: function (open) { header.setMenuExpanded(open); },
    onChange: function (key, value) {
      if (key === 'speed') {
        state.speed = clampSpeed(value); speedTouched = true;
        if (state.active) { modSpeed[state.active] = state.speed; postTo(state.active, { type: 'command', action: 'setSpeed', value: state.speed }); }
      } else if (key === 'density') {
        state.density = value;
        if (state.active) postTo(state.active, { type: 'command', action: 'setLabelDensity', value: state.density });
      } else if (key === 'theme') setTheme(value);
      else if (key === 'wireframe') setWireframe(value);
      else if (key === 'xray') setXRay(value);
    }
  });
  menu.update({ theme: state.theme, wireframe: state.wireframe, xray: state.xray });

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.source !== 'auto-module') return;
    if (d.type === 'ready') {
      var fr = iframes[d.moduleId];
      if (fr) injectEmbedFix(fr);
      sendAllCommands(d.moduleId);
    } else if (d.type === 'key') {
      /* a shell-owned key pressed while focus is inside the module iframe */
      if (d.moduleId === state.active) keyRouter.incoming(d.action);
    } else if (d.type === 'state') {
      /* the module owns play/pause and label density (keys); mirror them here */
      if (d.moduleId !== state.active) return;
      if (typeof d.playing === 'boolean') state.playing = d.playing;
      if (d.density != null) { state.density = d.density; menu.update({ density: d.density }); }
    }
  });

  /* ─── Keys: one keymap (keys.js). Shell owns L/W/X/Esc; Space/R/D belong to the module
         and are forwarded to it when focus is in the shell. ─── */
  var keyRouter = createKeyRouter({
    owns: function (a) { return a === 'theme' || a === 'wireframe' || a === 'xray' || a === 'close'; },
    handle: function (a) {
      if (a === 'close') {
        if (menu.isOpen) menu.close(); else if (state.active) requestClose();
        return;
      }
      if (!state.active) return;
      if (a === 'theme') setTheme(state.theme === 'light' ? 'dark' : 'light');
      else if (a === 'wireframe') setWireframe(!state.wireframe);
      else if (a === 'xray') setXRay(!state.xray);
    },
    forward: function (a) {
      if (state.active) postTo(state.active, { type: 'command', action: 'key', value: a });
    }
  });
  installKeys(window, keyRouter);

  /* ─── PWA ─── */
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferredPrompt = e; installBtnEl.hidden = false;
  });
  installBtnEl.addEventListener('click', function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(function () {
      deferredPrompt = null;
      installBtnEl.hidden = true;
    });
  });
  window.addEventListener('appinstalled', function () {
    installBtnEl.hidden = true; deferredPrompt = null;
  });

  function showUpdateToast(worker) {
    if (document.getElementById('update-toast')) return;
    var t = el('div', 'update-toast'); t.id = 'update-toast'; t.setAttribute('role', 'status');
    t.appendChild(el('span', '', 'New version available'));
    var b = el('button', 'update-btn', 'Reload');
    b.onclick = function () { b.disabled = true; try { worker.postMessage({ type: 'SKIP_WAITING' }); } catch (_) { location.reload(); } };
    var x = el('button', 'update-x', '\u00d7'); x.setAttribute('aria-label', 'Dismiss');
    x.onclick = function () { t.remove(); };
    t.appendChild(b); t.appendChild(x); document.body.appendChild(t);
  }
  if ('serviceWorker' in navigator) {
    var hadController = !!navigator.serviceWorker.controller, reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController || reloading) { hadController = true; return; }
      reloading = true; location.reload();
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).then(function (reg) {
        if (reg.waiting && navigator.serviceWorker.controller) showUpdateToast(reg.waiting);
        reg.addEventListener('updatefound', function () {
          var w = reg.installing; if (!w) return;
          w.addEventListener('statechange', function () {
            if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdateToast(w);
          });
        });
        setInterval(function () { reg.update().catch(function () {}); }, 60 * 60 * 1000);
      }).catch(function (err) { console.warn('[Auto Lab] SW registration failed:', err); });
    });
  }

  /* ─── Boot ─── */
  moduleCountEl.textContent = modules.length + ' interactive modules';
  applyShellTheme();
  applyViewToggleUI();
  renderHome('home');

  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      bootLoader.classList.add('hidden');
      setTimeout(function () { try { bootLoader.remove(); } catch (_) {} }, 400);
      scheduleIdlePrefetch();
    });
  });

  var initialHash = location.hash.slice(1);
  var initialMod = modules.find(function (m) { return m.id === initialHash; });
  if (initialMod) setTimeout(function () { openModule(initialMod.id); }, 60);

  function scheduleIdlePrefetch() {
    var idle = window.requestIdleCallback || function (cb) { return setTimeout(cb, 1200); };
    var i = 0;
    function step() {
      if (i >= modules.length) return;
      var mod = modules[i++];
      if (iframes[mod.id]) { step(); return; }
      var link = document.createElement('link');
      link.rel = 'prefetch';
      link.href = mod.file;
      link.as = 'document';
      document.head.appendChild(link);
      idle(step, { timeout: 2000 });
    }
    idle(step, { timeout: 2000 });
  }
})();
</script>
</body>
</html>
