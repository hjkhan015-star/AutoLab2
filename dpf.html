  "overview": "<div class=\"al-sec\"><h4>What you are looking at</h4><p>A cut-away of a diesel exhaust canister. Exhaust enters on the left, passes the <b>DOC</b> (diesel oxidation catalyst, gold) and then the <b>wall-flow filter</b> (ceramic honeycomb, tan). In the filter, alternate channels are plugged at opposite ends, so the gas must cross the porous wall. Soot stays on the inlet side of the wall; clean gas leaves through the outlet channels. Three temperature sensors (T1, T2, T3), a differential-pressure sensor and the ECU run the regeneration.</p></div><div class=\"al-sec\"><h4>Chemistry</h4><ul><li><b>DOC:</b> CO + &frac12;O&#8322; &rarr; CO&#8322; &nbsp;|&nbsp; HC + O&#8322; &rarr; CO&#8322; + H&#8322;O (releases the heat) &nbsp;|&nbsp; NO + &frac12;O&#8322; &rarr; NO&#8322; (light-off ~200&ndash;250&nbsp;&deg;C).</li><li><b>Passive regen:</b> C + 2NO&#8322; &rarr; CO&#8322; + 2NO. Works from ~280&nbsp;&deg;C and fades above ~450&nbsp;&deg;C, where NO&#8322; is no longer stable.</li><li><b>Active regen:</b> C + O&#8322; &rarr; CO&#8322; (&Delta;H &asymp; &minus;33&nbsp;kJ per g of carbon). Needs ~550&nbsp;&deg;C and above; the ECU post-injects fuel that burns on the DOC to lift the gas to ~620&nbsp;&deg;C.</li><li><b>Ash:</b> Ca, Zn, Mg, P and S from lube oil (e.g. CaSO&#8324;). It does not burn, collects at the plugged ends and slowly cuts the soot capacity.</li></ul></div><div class=\"al-sec\"><h4>The ECU's job</h4><p>It reads soot from the pressure drop, but only when the flow is high enough for the signal to mean something. It requests a regeneration at ~6&nbsp;g/L and stops near 0.9&nbsp;g/L, but only runs it while the <b>enabling conditions</b> hold (DOC lit off, enough exhaust flow). If you drop to idle mid-regen it aborts. It also cuts post-injection above ~780&nbsp;&deg;C. Its monitors set P2002, P2453, P2458 and P2463 with a debounce time.</p></div><div class=\"al-sec\"><h4>Typical numbers</h4><ul><li>Soot limit: ~5&ndash;8&nbsp;g/L (here 9 for a new filter, falling as ash builds).</li><li>Clean filter: a few kPa at full flow. Loaded: tens of kPa.</li><li>Regen: 600&ndash;650&nbsp;&deg;C for 10&ndash;20 min on a real car (seconds here).</li><li>Damage: cordierite cracks from thermal shock above roughly 1&thinsp;000&nbsp;&deg;C and melts near 1&thinsp;400&nbsp;&deg;C.</li></ul></div><div class=\"al-sec\"><h4>Try this</h4><p>1) Set <b>Time scale</b> to 20&times;, load ~70&nbsp;%, speed ~3000 and <b>Urban</b>: soot climbs, the ECU requests a regen and runs it. Watch T-peak stay near 700&nbsp;&deg;C.<br>2) Now the dangerous one: at <b>1&times;</b> let soot reach ~8&nbsp;g/L (use <b>Failed dP sensor</b> to let it build, then set the fault back to <b>None</b> and tick <b>Force regen</b>). When <b>Bed avg / peak</b> passes ~650&nbsp;&deg;C and the filter glows orange (soot is burning hard), drop load and speed to idle. Low flow cannot carry the heat away, the peak shoots past 1&thinsp;000&nbsp;&deg;C and the filter cracks (permanent).<br>3) Press <b>Age filter</b> a few times: ash cuts the soot limit and raises back pressure.</p></div>",

/* ═══════════════════════════════════════════════════════════════════
   PHYSICS MODEL — pure, named functions.
   Simplified physical trends, not a dyno/bench lookup table.
   ═══════════════════════════════════════════════════════════════════ */

/* finite, range-safe clamp (never returns NaN) */
function clampN(x, a, b) {
  if (!Number.isFinite(x)) return a;
  return x < a ? a : (x > b ? b : x);
}
const num = (x, d) => (Number.isFinite(x) ? x : d);
const smooth01 = (x) => { const t = clampN(x, 0, 1); return t * t * (3 - 2 * t); };

/* ── named constants ─────────────────────────────────────────────── */
const SOOT_MAX_RATE = 0.16;   /* g/L per s at full load AND full revs                       */
const PASSIVE_MAX   = 0.055;  /* g/L per s, NO2 oxidation (C + 2NO2 -> CO2 + 2NO)           */
const ACTIVE_MAX    = 0.90;   /* g/L per s, O2 oxidation reference (C + O2 -> CO2)          */
const ASH_FROM_SOOT = 0.004;  /* g of ash left per g of soot burned (scaled so ~40 regens = 1 g/L) */
const ASH_WEAR      = 0.00012;/* g/L per s, continuous lube-oil ash                         */
const AGE_STEP      = 0.45;   /* g/L of ash added by one "Age filter" press (~100 000 km)   */
const TAU_FILTER    = 16;     /* s, monolith thermal time constant at half flow             */
const TAU_DOC       = 8;      /* s, DOC brick thermal time constant                         */
const TAU_IN        = 3;      /* s, gas temperature response to post-injection              */
const REGEN_TEMP    = 620;    /* C, post-injection gas target at the filter inlet           */
const REGEN_ON      = 6.0;    /* g/L, ECU soot estimate that REQUESTS a regen               */
const REGEN_OFF     = 0.9;    /* g/L, ECU soot estimate that ENDS a regen                   */
const SOOT_LIMIT    = 9.0;    /* g/L, derate / limp threshold for a clean new filter        */
const ASH_MAX       = 2.5;    /* g/L, ash saturation                                        */
const EGT_IDLE      = 110;    /* C above ambient at idle, no load                           */
const DOC_LIGHTOFF  = 215;    /* C, DOC half-conversion (light-off) when healthy            */
const DOC_AGED_SHIFT= 70;     /* C, light-off shift of an aged DOC                          */
const HEAT_K        = 12;     /* K*flow per (g/L/s): lumped soot heat release. Real: dH ~33 kJ/g carbon
                                 over the heat capacity of block + gas; scaled so a normal regen peaks ~700 C */
const PEAK_S        = 3.0;    /* s, hot-spot lead of the core over the bed average           */
const O2_REF        = 0.13;   /* O2 mole fraction at the reference burn rate                 */
const OVERTEMP_CUT  = 780;    /* C, ECU stops post-injection above this bed peak             */
const OVERTEMP_BACK = 700;    /* C, ECU resumes below this (hysteresis)                      */
const T_CRACK       = 1000;   /* C, thermal-shock damage starts above this bed peak          */
const T_MELT        = 1400;   /* C, cordierite melts near this                               */
const CRACK_BYPASS  = 0.38;   /* fraction of flow that bypasses the wall through a crack     */
const FLOW_ENABLE   = 0.18;   /* flow, below this the dP signal is not usable (ECU enabling) */
const FLOW_REGEN    = 0.20;   /* flow, an active regen needs at least this to run            */
const DEBOUNCE_S    = 6;      /* s, monitor debounce before a DTC is latched                 */
const REGEN_MAX_S   = 180;    /* s, a regen longer than this sets P2458                      */
const BP_LIMP       = 26;     /* kPa, back pressure that forces limp mode                    */

/* Soot formation. Direction: more load -> more soot (rich, cool diffusion
   flame), more rpm -> more soot, motorway -> slightly less per second. */
function sootProduction(load, rpm, cycleFactor) {
  const L = clampN(load, 0, 1);
  const N = clampN((num(rpm, 800) - 800) / 4200, 0, 1);
  const shape = 0.10 + 0.90 * L * L;
  const revs  = 0.55 + 0.75 * N;
  return SOOT_MAX_RATE * shape * revs * clampN(cycleFactor, 0.2, 2);
}

/* Exhaust gas temperature at the DOC inlet. Direction: more load -> hotter,
   more rpm -> hotter, tracks ambient, shifted by the drive cycle. */
function exhaustGasTemp(load, rpm, ambient, cycleDelta) {
  const L = clampN(load, 0, 1);
  const N = clampN((num(rpm, 800) - 800) / 4200, 0, 1);
  const rise = 430 * L * (0.55 + 0.45 * N) + 70 * N;
  return clampN(num(ambient, 20) + EGT_IDLE + rise + num(cycleDelta, 0), -30, 900);
}

/* Exhaust mass-flow proxy 0..1.2. Direction: more load -> more flow, more rpm -> more flow. */
function exhaustFlow(load, rpm) {
  const L = clampN(load, 0, 1);
  const N = clampN((num(rpm, 800) - 800) / 4200, 0, 1);
  return clampN(0.10 + 0.85 * (0.45 * L + 0.55 * N), 0.05, 1.2);
}

/* Exhaust O2 fraction. Direction: more load -> less O2 (diesel is lean, idle ~18 %, full load ~6 %). */
function exhaustO2(load) { return 0.18 - 0.12 * clampN(load, 0, 1); }

/* DOC conversion (0..1). Direction: ~0 when cold, S-curve through light-off,
   ~1 once hot. `shift` > 0 models an aged catalyst (light-off later). */
function docActivity(T, shift) {
  return smooth01((num(T, 0) - num(shift, 0) - (DOC_LIGHTOFF - 45)) / 90);
}

/* Passive oxidation (C + 2NO2). Direction: needs the DOC to make NO2, needs
   NOx (more load -> more), peaks 350-450 C, fades above ~450 C (NO2 -> NO). */
function passiveOxidation(T, load, docAct) {
  const nox  = 0.25 + 0.75 * clampN(load, 0, 1);
  const rise = smooth01((num(T, 0) - 260) / 140);
  const fall = 1 - 0.65 * smooth01((num(T, 0) - 450) / 150);
  return PASSIVE_MAX * clampN(docAct, 0, 1) * (0.3 + 0.7 * nox) * rise * fall;
}

/* Active oxidation (C + O2). Direction: nothing below ~550 C, then rises
   steeply with temperature (Arrhenius-like), scales with O2, needs soot. */
function activeOxidation(T, soot, o2) {
  const x    = clampN((num(T, 0) - 550) / 130, 0, 3.2);
  const fuel = clampN(num(soot, 0) / 1.5, 0, 1);
  const ox   = clampN(num(o2, 0.13) / O2_REF, 0.2, 1.6);
  return clampN(ACTIVE_MAX * Math.pow(x, 1.7) * fuel * ox, 0, 6);
}

/* Bed thermal time constant. Direction: more flow -> faster response (gas carries heat). */
function convTau(flow) { return TAU_FILTER * Math.pow(0.5 / clampN(flow, 0.12, 1.2), 0.7); }

/* Heating rate from burning soot, K/s. Direction: more burn -> hotter, LESS flow -> hotter
   (the gas is what carries the heat out). This is the runaway mechanism. */
function combustionHeat(burn, flow) { return HEAT_K * clampN(burn, 0, 6) / (0.2 + clampN(flow, 0.05, 1.2)); }

/* One explicit step of the bed average temperature (C): relaxation toward the gas
   inlet temperature plus combustion heat. */
function bedStep(T, Tin, flow, burn, h) {
  return clampN(T + ((Tin - T) / convTau(flow) + combustionHeat(burn, flow)) * h, -30, 1500);
}

/* Hot-spot temperature at the core. Direction: the faster the burn and the lower the flow,
   the further the peak sits above the average. */
function bedPeak(T, burn, flow) { return T + clampN(PEAK_S * combustionHeat(burn, flow), 0, 500); }

/* Soot capacity factor. Direction: more ash -> less room for soot (up to -30 %). */
function capFactor(ash) { return 1 - 0.30 * clampN(ash, 0, ASH_MAX) / ASH_MAX; }

/* Back pressure across the block (kPa). Direction: more soot, more ash, more flow -> more dP.
   A crack (bypass) removes most of the restriction. */
function backpressure(flowNorm, soot, ash, bypass) {
  const f = clampN(flowNorm, 0, 1.2);
  const loading = 1.35 * (clampN(num(soot, 0), 0, 20) + 1.4 * clampN(num(ash, 0), 0, ASH_MAX)) * (1 - 0.95 * clampN(bypass, 0, 1));
  const flow = 0.25 + 1.60 * Math.pow(f, 1.5);
  return clampN((0.9 + loading) * flow, 0, 120);
}

/* ECU's soot estimate from the measured dP. Inverse of backpressure(): more dP at the same
   flow -> more soot; the ECU subtracts its own ash estimate. */
function ecuSootFromDp(dp, flowNorm, ash) {
  const ff = 0.25 + 1.60 * Math.pow(clampN(flowNorm, 0.05, 1.2), 1.5);
  const loading = num(dp, 0) / ff - 0.9;
  return clampN(loading / 1.35 - 1.4 * clampN(ash, 0, ASH_MAX), 0, 20);
}

/* Filtration efficiency. Direction: healthy wall >97 %, improves as the cake forms;
   more bypass (crack) -> less efficient. */
function filtrationEfficiency(bypass, soot) {
  const cake = clampN(num(soot, 0) / 4, 0, 1);
  const wall = 0.975 + 0.02 * cake;
  const b = clampN(bypass, 0, 1);
  return clampN((1 - b) * wall + b * 0.04, 0.2, 0.999);
}

/* Permanent substrate damage rate (1/s). Direction: nothing below T_CRACK, rises with the
   hot-spot temperature above it. Damage never decreases. */
function thermalDamageRate(peak) {
  return 0.15 * clampN((num(peak, 0) - T_CRACK) / 150, 0, 3);
}

/* Drive cycles: thermal offset (C) and soot multiplier. */
const CYCLES = {
  urban:    { egt: -55, soot: 1.30, label: 'Urban / short trips' },
  mixed:    { egt:   0, soot: 1.00, label: 'Mixed' },
  motorway: { egt: +85, soot: 0.85, label: 'Motorway' }
};

const FAULT_INFO = {
  none:           { label: 'None (healthy)',                warn: '' },
  cracked:        { label: 'Cracked substrate (P2002)',     warn: 'Cracked substrate: exhaust bypasses the porous wall, filtration collapses while back pressure falls.' },
  shorttrips:     { label: 'Clogged by short trips (P2463)',warn: 'Short trips: the filter never gets hot enough for passive regeneration, so soot builds far faster than it burns off.' },
  dpsensor:       { label: 'Failed dP sensor (P2453)',      warn: 'dP sensor stuck low: the ECU sees almost no pressure drop, so it thinks the filter is empty until its plausibility monitor trips.' },
  regeninhibited: { label: 'Regeneration inhibited (P2458)',warn: 'Post-injection is not raising the bed temperature, so every regeneration attempt fails and soot keeps accumulating.' },
  docaged:        { label: 'Aged DOC (no light-off)',       warn: 'Aged DOC: light-off is ~70 C later and conversion is low. HC slips through, the bed stays cold, regens time out.' }
};
const DTC_TEXT = {
  P2002: 'P2002 - filter efficiency below threshold: measured dP is far below what the soot model expects (cracked or missing substrate).',
  P2453: 'P2453 - dP sensor implausible: no pressure drop at good flow. The ECU now estimates soot from a model.',
  P2458: 'P2458 - regeneration duration exceeded: the bed never got to temperature. Regeneration is locked out.',
  P2463: 'P2463 - excessive soot accumulation. Drive on a motorway or run a forced regeneration.'
};

/* ═══════════════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════════════ */
const S = { rpm: 1800, ambient: 20, cycle: 'mixed', fault: 'none', regenCmd: false, speed: 1 };

/* Phase 7a: the history lives in the Monitor (CFG.traces); the module only hands over one normalised sample
   per ~140 ms while the sim runs (0..100 % of each old axis range) and the current warning sentence. */
let traceSample = null, traceClear = false, warnText = '';
const traceN = (v, lo, hi) => Math.round(clampN((v - lo) / (hi - lo), 0, 1) * 1000) / 10;

const sim = {
  soot: 1.0, ash: 0.03, damage: 0,
  Tbed: 45, Tpeak: 45, peakMax: 45, Tdoc: 45, Tin: 45,
  docAct: 0, burn: 0, bypass: 0, dp: 0, bp: 0, eff: 0.99,
  ecuSoot: 1.0, modelSoot: 1.0,                 /* ECU's dP-based estimate and its own model     */
  regenState: 0,                                /* 0 idle, 1 requested/waiting, 2 heating, 3 active */
  postCmd: false, postAct: false, cut: false, lock: false,
  tReg: 0, regens: 0, aborts: 0,
  tP2453: 0, tP2002: 0, tP2463: 0,
  dtc: { P2002: false, P2453: false, P2458: false, P2463: false },
  lastT: -1
};

function resetModel() {
  const a = num(S.ambient, 20);
  sim.soot = 1.0; sim.ash = 0.03; sim.damage = 0;
  sim.Tbed = sim.Tpeak = sim.peakMax = sim.Tdoc = sim.Tin = a + 25;
  sim.docAct = 0; sim.burn = 0; sim.bypass = 0; sim.dp = 0; sim.bp = 0; sim.eff = 0.99;
  sim.ecuSoot = 1.0; sim.modelSoot = 1.0;
  sim.regenState = 0; sim.postCmd = false; sim.postAct = false; sim.cut = false; sim.lock = false;
  sim.tReg = 0; sim.regens = 0; sim.aborts = 0;
  sim.tP2453 = sim.tP2002 = sim.tP2463 = 0;
  sim.dtc.P2002 = sim.dtc.P2453 = sim.dtc.P2458 = sim.dtc.P2463 = false;
  sim.lastT = -1;
  traceClear = true;                  /* Monitor trace is cleared on the next update */
  S.regenCmd = false;
}
function resetAll() {
  S.rpm = 1800; S.ambient = 20; S.cycle = 'mixed'; S.fault = 'none'; S.speed = 1;
  resetModel();
  controls.resetAll();                 /* every axis back to its default (store -> onChange -> S) */
}

/* Debounced monitor timer: counts up while the condition holds, falls back otherwise. */
function tick(t, cond, h) { return cond ? t + h : Math.max(0, t - 2 * h); }

/* ── ECU: soot estimate, monitors with enabling conditions, regeneration state machine ── */
function ecuStep(h, L, rpm, flow) {
  const fault = S.fault;
  const dpOk = flow >= FLOW_ENABLE && rpm >= 1000;              /* enabling condition for any dP use */
  /* the sensor reading */
  sim.dp = (fault === 'dpsensor') ? clampN(0.15 + 0.10 * flow, 0, 1) : sim.bp;
  /* soot estimate: dP only while enabled (otherwise hold), or the model after P2453 */
  if (dpOk) sim.ecuSoot += (ecuSootFromDp(sim.dp, flow, sim.ash) - sim.ecuSoot) * (1 - Math.exp(-h / 2));
  const est = sim.dtc.P2453 ? sim.modelSoot : sim.ecuSoot;

  /* monitor P2453: reading far below even a clean filter at good flow */
  const expClean = backpressure(flow, 0, sim.ash, 0);
  sim.tP2453 = tick(sim.tP2453, flow >= 0.45 && rpm >= 1000 && sim.dp < 0.6 * expClean, h);
  if (sim.tP2453 > DEBOUNCE_S) sim.dtc.P2453 = true;
  /* monitor P2002: dP well below what the modelled soot would give (needs measurable soot) */
  const expSoot = backpressure(flow, sim.modelSoot, sim.ash, 0);
  sim.tP2002 = tick(sim.tP2002, flow >= 0.35 && rpm >= 1000 && !sim.dtc.P2453 && sim.modelSoot >= 2 && sim.dp < 0.75 * expSoot, h);

  const lim = SOOT_LIMIT * capFactor(sim.ash);
  sim.tP2463 = tick(sim.tP2463, est > 0.85 * lim, h);
  if (sim.tP2463 > DEBOUNCE_S) sim.dtc.P2463 = true;
  if (est < REGEN_OFF * 2) sim.dtc.P2463 = false;                /* clears after a successful burn-off */

  /* over-temperature protection with hysteresis */
  if (sim.Tpeak > OVERTEMP_CUT) sim.cut = true; else if (sim.Tpeak < OVERTEMP_BACK) sim.cut = false;

  if (S.regenCmd && sim.lock && fault !== 'regeninhibited') { sim.lock = false; sim.dtc.P2458 = false; }   /* workshop forced regen overrides the lock-out once the cause is fixed */
  const want = !sim.lock && (S.regenCmd || est > REGEN_ON);
  const enable = flow >= FLOW_REGEN && sim.Tdoc > DOC_LIGHTOFF;   /* enabling conditions to RUN a regen (ECU sees T, not conversion) */
  if (sim.regenState === 0) {
    if (want) { sim.regenState = 1; sim.tReg = 0; }
  } else if (sim.regenState === 1) {
    if (!want) sim.regenState = 0;
    else if (enable && !sim.cut) sim.regenState = 2;
  } else {
    sim.tReg += h;
    if (!enable) { sim.regenState = 1; sim.aborts++; }           /* aborted: idle / DOC cooled */
    else if (sim.tReg > REGEN_MAX_S) {                           /* took too long -> P2458, lock out */
      sim.dtc.P2458 = true; sim.lock = true; sim.regenState = 0; sim.aborts++;
      if (S.regenCmd) { S.regenCmd = false; controls.set('force', false); }
    } else if (est < REGEN_OFF) {                                /* done */
      sim.regenState = 0; sim.regens++;
      if (S.regenCmd) { S.regenCmd = false; controls.set('force', false); }
    } else if (sim.regenState === 2 && sim.Tbed > 550) sim.regenState = 3;
  }
  sim.postCmd = sim.regenState >= 2 && !sim.cut;
  sim.postAct = sim.postCmd && fault !== 'regeninhibited';
}

/* One physics step of length h seconds (called with h <= 0.25 s). */
function stepSim(h, L, rpm, amb, flow, egt, cyc) {
  const fault = S.fault;
  /* DOC and gas path */
  sim.Tdoc += (egt - sim.Tdoc) * (1 - Math.exp(-h / TAU_DOC));
  const aged = fault === 'docaged';
  sim.docAct = docActivity(sim.Tdoc, aged ? DOC_AGED_SHIFT : 0) * (aged ? 0.55 : 1);
  ecuStep(h, L, rpm, flow);
  /* post-injected HC burns on the DOC and lifts the gas toward REGEN_TEMP (only as far as the DOC converts) */
  const Tt = egt + (sim.postAct ? Math.sqrt(sim.docAct) * Math.max(0, REGEN_TEMP - egt) : 0);   /* HC lights off before NO, hence sqrt */
  sim.Tin += (Tt - sim.Tin) * (1 - Math.exp(-h / TAU_IN));

  /* substrate state -> bypass and efficiency */
  const bypassFault = (fault === 'cracked') ? CRACK_BYPASS : 0;
  sim.bypass = Math.max(bypassFault, CRACK_BYPASS * clampN(sim.damage * 4, 0, 1) + (sim.damage >= 1 ? 0.1 : 0));
  sim.eff = filtrationEfficiency(sim.bypass, sim.soot);

  /* soot mass balance (soot that is not captured never accumulates) */
  const passMul = (fault === 'shorttrips' ? 0.15 : 1);
  const sootMul = (fault === 'shorttrips' ? 1.35 : 1);
  const prod = sootProduction(L, rpm, cyc.soot) * sootMul;
  const burn0 = passiveOxidation(sim.Tbed, L, sim.docAct) * passMul + activeOxidation(sim.Tbed, sim.soot, exhaustO2(L));
  const dBurn = Math.min(sim.soot, Math.max(0, burn0) * h);
  sim.burn = h > 0 ? dBurn / h : 0;
  sim.soot = clampN(sim.soot + prod * sim.eff * h - dBurn, 0, 15);
  sim.modelSoot = clampN(sim.modelSoot + (sootProduction(L, rpm, 1) * 0.92 - sim.burn) * h, 0, 15);
  sim.ash = clampN(sim.ash + dBurn * ASH_FROM_SOOT + ASH_WEAR * h, 0, ASH_MAX);

  /* bed temperature and damage */
  sim.Tbed = bedStep(sim.Tbed, sim.Tin, flow, sim.burn, h);
  sim.Tpeak = bedPeak(sim.Tbed, sim.burn, flow);
  if (sim.Tpeak > sim.peakMax) sim.peakMax = sim.Tpeak;
  if (sim.Tpeak > T_MELT) sim.damage = 1;
  sim.damage = clampN(sim.damage + thermalDamageRate(sim.Tpeak) * h, 0, 1);

  /* pressure drop (uses the bypass just computed) */
  sim.bp = backpressure(flow, sim.soot, sim.ash, sim.bypass);
}

     zin[i].update(c.t, spd, dens);
     zwall[i].update(c.t, spd, dens * 0.9 * (1 - sim.bypass));
     zout[i].update(c.t, spd, dens * eff * (1 - sim.bypass));
   }
   clean.update(c.t, spd, dens * (0.55 + 0.45 * eff));
   leak.update(c.t, spd, dens * 0.85 * clamp(sim.bypass / CRACK_BYPASS, 0, 1));

   const pulse = 0.5 + 0.5 * Math.sin(c.t * 3.2);
   if (fault === 'dpsensor') {
     sensorMat.emissive.setHex(0xef4444);
     sensorMat.emissiveIntensity = 0.20 + 0.15 * pulse;
   } else {
     sensorMat.emissive.setHex(0x22d3ee);
     sensorMat.emissiveIntensity = 0.35 + 0.95 * clamp(dpSeen / 25, 0, 1);
   }
   /* T1 = gas in, T2 = gas after the DOC (post-injection exotherm), T3 = outlet (lags the bed) */
   const tv0 = clamp((egt - 100) / 600, 0, 1), tv1 = clamp((sim.Tin - 100) / 600, 0, 1), tv2 = clamp((sim.Tbed - 100) / 600, 0, 1);
   tipMats[0].emissive.copy(cTipC).lerp(cTipH, tv0); tipMats[0].emissiveIntensity = 0.4 + 0.9 * tv0;
   tipMats[1].emissive.copy(cTipC).lerp(cTipH, tv1); tipMats[1].emissiveIntensity = 0.4 + 0.9 * tv1;
   tipMats[2].emissive.copy(cTipC).lerp(cTipH, tv2); tipMats[2].emissiveIntensity = 0.4 + 0.9 * tv2;

   if (codes)                       { ecuLed.color.setHex(0xef4444); ecuLed.emissive.setHex(0xef4444); ecuLed.emissiveIntensity = 0.5 + 0.6 * pulse; }
   else if (sim.regenState > 0)     { ecuLed.color.setHex(0xf59e0b); ecuLed.emissive.setHex(0xf59e0b); ecuLed.emissiveIntensity = 0.8; }
   else                             { ecuLed.color.setHex(0x22c55e); ecuLed.emissive.setHex(0x22c55e); ecuLed.emissiveIntensity = 0.7; }

   if (sim.regenState >= 2 && sim.postCmd && !sim.postAct) {
     regenMat.color.setHex(0xef4444); regenMat.emissive.setHex(0xef4444);
     regenMat.emissiveIntensity = 0.55 + 0.65 * Math.abs(Math.sin(c.t * 5));
   } else if (sim.regenState >= 2) {
     regenMat.color.setHex(0xff6a00); regenMat.emissive.setHex(0xff6a00);
     regenMat.emissiveIntensity = 0.45 + 1.65 * clamp((sim.Tbed - 500) / 180, 0, 1);
   } else {
     regenMat.color.setHex(0x3a2a20); regenMat.emissive.setHex(0xff6a00);
     regenMat.emissiveIntensity = 0.03 + 0.28 * clamp((sim.Tbed - 320) / 260, 0, 1);
   }

   /* ── 5. throttled DOM work (trace + warning banner) ────────── */
   const now = performance.now();
   if (now - lastDom > 140) {
     lastDom = now;
     if (dtRaw > 0) traceSample = [traceN(sim.soot, 0, 12), traceN(sim.Tbed, 0, 1200), traceN(bp, 0, 40)];
     let warn = '';
     if (sim.damage > 0.12)               warn = 'Substrate damaged by overheating (peak ' + sim.peakMax.toFixed(0) + ' C seen). The crack is permanent - replace the filter.';
     else if (sim.Tpeak > T_CRACK)        warn = 'THERMAL RUNAWAY: bed peak ' + sim.Tpeak.toFixed(0) + ' C. Low flow cannot carry the heat away - the substrate is cracking.';
     else if (sim.cut && sim.regenState > 0) warn = 'Bed peak ' + sim.Tpeak.toFixed(0) + ' C - the ECU has cut post-injection (limit ' + OVERTEMP_CUT + ' C).';
     else if (codes)                      { const f = codes.split(' ')[0]; warn = DTC_TEXT[f] || ''; }
     if (!warn && FAULT_INFO[fault]) warn = FAULT_INFO[fault].warn;
     if (!warn) {
       if (sim.soot > limit)               warn = 'Soot load critical (' + sim.soot.toFixed(1) + ' g/L, limit ' + limit.toFixed(1) + '). Power derate is active - a forced workshop regeneration or a replacement filter is required.';
       else if (bp > BP_LIMP)              warn = 'Back pressure ' + bp.toFixed(0) + ' kPa - limp mode imminent.';
       else if (sim.regenState === 1)      warn = 'The ECU wants a regeneration but the enabling conditions are not met (' + rstat.toLowerCase() + ').';
       else if (sim.soot > REGEN_ON)       warn = 'Soot load high - the ECU is requesting an active regeneration.';
       else if (sim.ash > 1.2)             warn = 'Ash load ' + sim.ash.toFixed(2) + ' g/L - the filter is approaching the end of its service life.';
     }
     warnText = warn;
   }

   /* ── 6. readouts ───────────────────────────────────────────── */
   const sootState = sim.soot > limit ? 'crit' : (sim.soot > REGEN_ON ? 'warn' : 'ok');
   const bpState   = bp > BP_LIMP ? 'crit' : (bp > 15 ? 'warn' : 'ok');
   const effState  = eff < 0.80 ? 'crit' : (eff < 0.95 ? 'warn' : 'ok');
   const ashState  = sim.ash > 1.6 ? 'crit' : (sim.ash > 1.0 ? 'warn' : 'ok');
   const regState  = (sim.lock || (sim.regenState >= 2 && sim.postCmd && !sim.postAct)) ? 'crit' : (sim.regenState > 0 ? 'warn' : 'ok');
   const tempState = sim.Tpeak > T_CRACK ? 'crit' : (sim.Tpeak > OVERTEMP_CUT ? 'warn' : 'hi');
   const verState  = verdict === 'PASS' ? 'ok' : (verdict === 'SERVICE SOON' || verdict === 'FORCED REGEN' ? 'warn' : 'crit');

   let tr;
   if (traceClear) { traceClear = false; traceSample = null; tr = { hist: null }; }
   else if (traceSample) { tr = { hist: traceSample }; traceSample = null; }

   return {
     big: bp.toFixed(1),
     unit: ' kPa',
     bar: clamp(bp / 40, 0, 1) * 100,
     rows: {
       soot:  sim.soot.toFixed(2) + ' g/L',
       regen: rstat
     },
     ro: {
       soot:  [sim.soot.toFixed(2) + ' g/L', sootState],
       ecu:   [est.toFixed(2) + ' g/L' + (sim.dtc.P2453 ? ' (model)' : ''), Math.abs(est - sim.soot) > 2 ? 'warn' : ''],
       ash:   [sim.ash.toFixed(2) + ' g/L',  ashState],
       cap:   [limit.toFixed(1) + ' g/L',    limit < 7 ? 'warn' : ''],
       bp:    [bp.toFixed(1) + ' kPa',       bpState],
       dps:   [dpSeen.toFixed(1) + ' kPa',   fault === 'dpsensor' ? 'crit' : 'ok'],
       eff:   [(eff * 100).toFixed(1) + ' %', effState],
       temp:  [sim.Tbed.toFixed(0) + ' / ' + sim.Tpeak.toFixed(0) + ' \u00B0C', tempState],
       doc:   [(sim.docAct * 100).toFixed(0) + ' % @ ' + sim.Tdoc.toFixed(0) + ' \u00B0C', sim.docAct < 0.5 ? 'warn' : ''],
       egt:   [egt.toFixed(0) + ' \u00B0C',  egt > 620 ? 'warn' : ''],
       flow:  [(flow * 100).toFixed(0) + ' %', flow < FLOW_ENABLE ? 'warn' : ''],
       regen: [rstat, regState],
       dtc:   [(codes || 'none') + ' | ' + sim.regens + '/' + sim.aborts, codes ? 'crit' : 'ok'],
       verdict: [verdict, verState]
     },
     status: [warnText || rstat, true, warnText ? (sim.Tpeak > T_CRACK || sim.damage > 0.12 ? 'crit' : 'warn') : ''],
      traces: tr,
     ctl: (L * 100).toFixed(0) + ' %'
   };
  }
 };
}

/* Phase 6: every option / action lives in the dock (controls.js), nothing interactive is left in the panel.
   'Time scale' is the module's own physics time-compression (thermal warm-up); the menu's Sim speed is separate. */
CFG.options = [
  { id: "cycle", type: 'choice', layout: 'select', label: "Drive cycle", options: [{ id: "urban", label: "Urban / short trips" }, { id: "mixed", label: "Mixed" }, { id: "motorway", label: "Motorway" }], def: "mixed",
    onChange: (id) => { S.cycle = id; } },
  { id: "fault", type: 'choice', layout: 'select', label: "Fault injection", options: Object.keys(FAULT_INFO).map(id => ({ id, label: FAULT_INFO[id].label })), def: 'none',
    onChange: (id) => { S.fault = id; } },
  { id: 'timeScale', type: 'choice', layout: 'segmented', label: 'Time scale', options: [{ id: '1', label: '1×' }, { id: '5', label: '5×' }, { id: '20', label: '20×' }], def: '1',
    onChange: (id) => { S.speed = Number(id) || 1; } },
  { id: 'force', type: 'toggle', label: 'Force regen',
    onChange: (on) => { S.regenCmd = on; } },
  { id: 'age', type: 'action', label: 'Age filter (+100k km ash)',
    onAction: () => { sim.ash = clampN(sim.ash + AGE_STEP, 0, ASH_MAX); } }
];
CFG.onReset = resetAll;      /* the dock Reset runs the module reset (model + every control) */
resetModel();
/* Phase 7a: the old history canvas is a Monitor trace. All series are drawn as 0..100 % of their axis ranges. */
CFG.traces = [{ id: 'hist', label: 'Soot, bed temperature and back pressure history (% of full scale)', min: 0, max: 100, length: 150,
  series: [
    { id: 'a', label: 'Soot g/L', color: 'var(--accent)' },
    { id: 'b', label: 'Bed \u00B0C', color: 'var(--warn)' },
    { id: 'c', label: 'dP kPa', color: 'var(--ok)' }
  ] }];
runGuidedModule(CFG, build);
</script>
</body>
</html>
