/* ═══════════════════════════════════════════════════════════════════
   PHYSICS MODEL — pure, named functions.
   Simplified physical trends, not a dyno/bench lookup table.
   ═══════════════════════════════════════════════════════════════════ */

function clampN(x, a, b) {
  if (!Number.isFinite(x)) return a;
  return x < a ? a : (x > b ? b : x);
}
const num = (x, d) => (Number.isFinite(x) ? x : d);

/* ── named constants ─────────────────────────────────────────────── */
const COMP_EFF   = 0.72;   /* compressor isentropic efficiency               */
const GAMMA      = 0.286;  /* (γ-1)/γ for air                                 */
const TAU_BOOST  = 1.6;    /* s, turbo spool time constant                    */
const TAU_CORE   = 22;     /* s, intercooler core thermal time constant       */
const TAU_OIL    = 45;     /* s, oil soak ramp                                */
const MAX_BOOST  = 2.0;    /* bar, slider maximum                             */
const COLD_T     = 25;     /* °C, initial core & outlet temperature           */
const UNDERBOOST = 0.65;   /* actual/cmd ratio that flags a P0299             */

/* Pressure ratio from gauge boost (bar). Direction: more boost -> higher
   PR. Both arguments clamped so PR never drops below 1. */
function pressureRatio(boostBar) {
  return 1 + clampN(num(boostBar, 0), 0, 3);
}

/* Compressor outlet temperature. Adiabatic compression with a real
   efficiency: T_out = T_amb + (T_amb+273)·(PR^γ − 1)/η. Direction:
   more boost or hotter ambient -> hotter charge air. */
function compressorOutletTemp(Tamb, boostBar, compEff) {
  const pr = pressureRatio(boostBar);
  const ideal = Math.pow(pr, GAMMA) - 1;
  const rise = (num(Tamb, 20) + 273) * ideal / clampN(compEff, 0.4, 0.9);
  return clampN(num(Tamb, 20) + rise, -30, 320);
}

/* Ambient airflow across the core (0..1). Fan pull at a standstill,
   road speed dominates above ~30 km/h. Direction: faster -> more ram. */
function ramAirflow(vehicleSpeedKmh) {
  const v = clampN(num(vehicleSpeedKmh, 0) / 130, 0, 1);
  return clampN(0.16 + 0.80 * v, 0.10, 1.0);
}

/* Charge-air mass flow (normalised 0..1.2). Rises with rpm and with
   charge-air density. Direction: more rpm and more boost -> more flow. */
function chargeMassFlow(rpm, boostBar) {
  const N = clampN((num(rpm, 800) - 800) / 4200, 0, 1);
  const dens = 1 + clampN(boostBar, 0, 3);
  return clampN(N * dens * 0.55 + 0.08, 0.05, 1.2);
}

/* Max available boost as a function of engine speed. Direction: a
   small turbo cannot make full boost at low rpm. */
function maxBoostAtRpm(rpm) {
  const N = clampN((num(rpm, 800) - 800) / 3600, 0, 1);
  return 0.20 + 1.80 * N;
}

/* Steady-state heat-soak (0 = cold core, 1 = fully soaked). Load term
   scales with (Tin − Tamb) and charge flow; the cooling term scales
   with ram airflow. Direction: hot charge at low speed soaks; cool
   charge at high speed stays cold. */
function coreSteadyState(Tin, Tamb, chargeFlow, ramAir) {
  const dT = clampN((num(Tin, 20) - num(Tamb, 20)) / 110, 0, 1.6);
  const load = 1.6 * dT * clampN(chargeFlow, 0, 1.5);
  const cooling = 0.25 + 1.20 * clampN(ramAir, 0, 1);
  return clampN(load / (load + cooling), 0, 1);
}

/* Intercooler effectiveness. Best-case ~85 % with strong ram airflow
   and a cold core; ~50 % idling; heat-soak and hardware faults subtract.
   Direction: more ram and a colder core -> higher effectiveness. */
function intercoolerEffectiveness(ramAir, coreHot, fault, oilSoak) {
  let eff = 0.45 + 0.42 * clampN(ramAir, 0, 1);
  eff -= 0.16 * clampN(coreHot, 0, 1);
  if (fault === 'clogged') eff *= 0.52;
  else if (fault === 'oily') eff *= (1 - 0.45 * clampN(oilSoak, 0, 1));
  return clampN(eff, 0.08, 0.88);
}

/* Outlet temperature from effectiveness: T_out = Tamb + (Tin − Tamb)·(1−eff).
   Direction: better effectiveness -> outlet closer to ambient. */
function intercoolerOutletTemp(Tin, Tamb, eff) {
  return clampN(num(Tamb, 20) + (num(Tin, 20) - num(Tamb, 20)) * (1 - clampN(eff, 0, 1)), -30, 320);
}

/* Density gain from cooling. Ideal-gas: (T_in_K / T_out_K) − 1, as %.
   Direction: more cooling -> more oxygen per litre. Never negative. */
function densityGain(Tin, Tout) {
  const ratio = (num(Tin, 20) + 273) / Math.max(1, num(Tout, 20) + 273);
  return clampN((ratio - 1) * 100, 0, 80);
}

/* Pressure drop across the core (kPa). Rises with the square of charge
   flow and with charge-air density (boost). Mechanical faults add a
   fixed offset. Direction: more flow, more boost and any restriction
   -> higher Δp. */
function corePressureDrop(flowNorm, boostBar, fault) {
  const f = clampN(flowNorm, 0, 1.2);
  let dp = 2.0 + 6.5 * f * f + 3.0 * clampN(boostBar, 0, 2.5);
  if (fault === 'clogged') dp += 5.0;
  else if (fault === 'oily') dp += 1.5;
  return clampN(dp, 0, 40);
}

const elFold  = document.getElementById('ic-fold');
const elRpm   = document.getElementById('ic-rpm');

/* ── simulation state (module level so Reset can reach it) ───────── */
const GRAPH_N = 150;

  actualBoost: 0,
  coreHot: 0,
  oilSoak: 0,
  lastT: -1,
  samples: []
};

}

/* ── rolling graph ───────────────────────────────────────────────── */
function drawGraph() {
  const W = gcv.width, Hh = gcv.height;
  gctx.clearRect(0, 0, W, Hh);
  gctx.strokeStyle = 'rgba(148,163,184,0.16)';
  gctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const y = Math.round(Hh * i / 4) + 0.5;
    gctx.beginPath(); gctx.moveTo(0, y); gctx.lineTo(W, y); gctx.stroke();
  }
  const n = sim.samples.length;
  if (n < 2) return;
  const xAt = (i) => ((i + (GRAPH_N - n)) / (GRAPH_N - 1)) * W;
  const yEff = (v) => Hh - clampN(v, 0, 1) * (Hh - 6) - 3;
  const yT   = (v) => Hh - clampN(v / 150, 0, 1) * (Hh - 6) - 3;

  /* effectiveness filled area */
  gctx.beginPath();
  gctx.moveTo(xAt(0), Hh);
  for (let i = 0; i < n; i++) gctx.lineTo(xAt(i), yEff(sim.samples[i].e));
  gctx.lineTo(xAt(n - 1), Hh);
  gctx.closePath();
  gctx.fillStyle = 'rgba(56,189,248,0.18)';
  gctx.fill();

  gctx.beginPath();
  for (let i = 0; i < n; i++) {
    const x = xAt(i), y = yEff(sim.samples[i].e);
    if (i) gctx.lineTo(x, y); else gctx.moveTo(x, y);
  }
  gctx.strokeStyle = '#38bdf8'; gctx.lineWidth = 1.6; gctx.stroke();

  /* outlet temperature line */
  gctx.beginPath();
  for (let i = 0; i < n; i++) {
    const x = xAt(i), y = yT(sim.samples[i].T);
    if (i) gctx.lineTo(x, y); else gctx.moveTo(x, y);
  }
  gctx.strokeStyle = '#fb923c'; gctx.lineWidth = 1.6; gctx.stroke();
}

/* ═══════════════════════════════════════════════════════════════════
   MODULE SCENE (per-module 3D parts)
   ═══════════════════════════════════════════════════════════════════ */
function build(H) {
 const { box, cylX, mat, glass, pipe, stream, lc, clamp, root, THREE, lowEnd, put } = H;

 /* ── base materials ────────────────────────────────────────────── */
 const alu      = mat(0xc5ccd6, 0.75, 0.35);              /* fin aluminium       */
 const tankHot  = mat(0xd97c4a, 0.70, 0.40);              /* inlet end tank      */
 const tankCold = mat(0x5b8fa8, 0.70, 0.40);              /* outlet end tank     */
 const hose     = mat(0x1f2937, 0.20, 0.80);

 /* ── core fins ─────────────────────────────────────────────────── */
 for (let i = 0; i < 16; i++) box(3.0, 0.03, 1.6, alu, 0, -1 + i * 0.13, 0);

 /* ── glass side panel (X-ray) ─────────────────────────────────── */
 box(3.0, 2.2, 0.05, glass(0x94a3b8, 0.10), 0, 0, 0.83);

 /* ── end tanks ─────────────────────────────────────────────────── */
 box(0.5, 2.3, 1.7, tankHot,  -1.75, 0, 0);
 box(0.5, 2.3, 1.7, tankCold,  1.75, 0, 0);

 /* ── charge pipes ──────────────────────────────────────────────── */
 pipe([[-2, 1, 0], [-2.6, 1, 0], [-3.4, 1.6, 0], [-4.2, 1.6, 0]], 0.24, hose);
 pipe([[ 2, -1, 0], [ 2.6, -1, 0], [ 3.4, -1.6, 0], [ 4.2, -1.6, 0]], 0.24, hose);

 /* ── compressor wheel (animated, at the inlet pipe end) ───────── */
 const compressorWheel = new THREE.Group();
 const hubMat = mat(0x94a3b8, 0.9, 0.2);
 const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.05, 16), hubMat);
 hub.rotation.x = Math.PI / 2;
 compressorWheel.add(hub);
 for (let i = 0; i < 8; i++) {
   const blade = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.20, 0.045), hubMat);
   const a = i * Math.PI / 4;
   blade.position.set(Math.cos(a) * 0.11, Math.sin(a) * 0.11, 0);
   blade.rotation.z = a + 0.55;
   compressorWheel.add(blade);
 }
 compressorWheel.position.set(-4.5, 1.6, 0);
 root.add(compressorWheel);

 /* ── coupling joint (highlighted on leak fault) ───────────────── */
 const jointMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, metalness: 0.5, roughness: 0.6 });
 const joint = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.035, 8, 22), jointMat);
 joint.position.set(-3.4, 1.6, 0);
 joint.rotation.y = Math.PI / 2;
 root.add(joint);

 /* ── clog overlay (dark patches on the fins when clogged) ─────── */
 const clogMat = new THREE.MeshBasicMaterial({ color: 0x1a1410, transparent: true, opacity: 0, depthWrite: false });
 const clogs = new THREE.Group();
 for (let i = 0; i < 6; i++) {
   const c = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.05, 0.42), clogMat);
   const row = i % 3;
   const col = Math.floor(i / 3);
   c.position.set(-1 + col * 2, -0.75 + row * 0.75, 0.36);
   clogs.add(c);
 }
 clogs.visible = false;
 root.add(clogs);

 /* ── particle streams ─────────────────────────────────────────── */
 const nIn  = lowEnd ? 14 : 24;
 const nMid = lowEnd ?  8 : 16;
 const nOut = lowEnd ? 14 : 24;
 const nAmb = lowEnd ?  6 : 10;

 const hotS  = stream([[-4.4, 1.6, 0], [-3.4, 1.6, 0], [-2.6, 1, 0], [-1.9, 0.6, 0], [-1.5, 0.4, 0]], nIn,  0xff6b35, 0.13);
 const midS  = stream([[-1.5, 0.4, 0], [0, 0, 0], [1.5, -0.4, 0]],                              nMid, 0xfbbf24, 0.12);
 const coolS = stream([[ 1.5, -0.4, 0], [1.9, -0.6, 0], [2.6, -1, 0], [3.4, -1.6, 0], [4.4, -1.6, 0]], nOut, 0x38bdf8, 0.13);

 const amb = [];
 [[-0.8, 0.5], [0.8, 0.5], [-0.8, -0.5], [0.8, -0.5]].forEach(p => {
   amb.push(stream([[p[0], p[1], 2.7], [p[0], p[1], -2.7]], nAmb, 0x7dd3fc, 0.08));
 });

 const leakS = stream([[-3.4, 1.6, 0.2], [-3.0, 1.4, 1.3], [-2.4, 1.2, 2.4]], lowEnd ? 8 : 14, 0xff6b35, 0.12);

 let lastDom = 0;

 return {
  labels: [
    ['Hot charge in', [-3.3, 2.0, 0]],
    ['Compressor', [-4.5, 2.2, 0]],
    ['End tank (inlet)', [-1.75, 1.45, 0]],
    ['Core fins', [0, 1.30, 0]],
    ['End tank (outlet)', [1.75, 1.45, 0]],
    ['Cooled charge out', [3.5, -1.3, 0]],
    ['Ambient airflow', [0, -1.25, 2.4]]
  ],
  update(c) {
   /* ── 1. inputs ─────────────────────────────────────────────── */
   const dt        = Math.max(0, num(c.dt, 0)) * S.speed;
   const cmdFrac   = clampN(c.k, 0, 1);
   const cmdBoost  = cmdFrac * MAX_BOOST;
   const rpm       = num(S.rpm, 1800);
   const speedKmh  = num(S.speedKmh, 0);
   const Tamb      = num(S.ambient, 20);
   const fault     = S.fault;

   /* toolbar Reset rewinds simT -> detect and clear the model */
   if (sim.lastT >= 0 && c.t + 1e-4 < sim.lastT) resetModel();
   sim.lastT = c.t;

   /* ── 2. turbo spool lag & fault-limited target boost ───────── */
   const maxB = maxBoostAtRpm(rpm);
   let targetBoost = Math.min(cmdBoost, maxB);
   if (fault === 'leaking')       targetBoost *= 0.55;
   else if (fault === 'clogged')  targetBoost *= 0.96;
   else if (fault === 'oily')     targetBoost *= 0.98;

   if (dt > 0) {
     const a = 1 - Math.exp(-dt / TAU_BOOST);
     sim.actualBoost += (targetBoost - sim.actualBoost) * a;
   }
   sim.actualBoost = clampN(sim.actualBoost, 0, 3);

   /* ── 3. oil soak ramps up while the fault is active ────────── */
   if (fault === 'oily' && dt > 0) {
     sim.oilSoak = clampN(sim.oilSoak + dt / TAU_OIL, 0, 1);
   }

   /* ── 4. charge-air temperature out of the compressor ───────── */
   const Tin = compressorOutletTemp(Tamb, sim.actualBoost, COMP_EFF);

   /* ── 5. ram airflow over the core & charge mass flow ───────── */
   const ram  = ramAirflow(speedKmh);
   const flow = chargeMassFlow(rpm, sim.actualBoost);

   /* ── 6. core heat-soak state (first-order lag) ─────────────── */
   const steadyHot = coreSteadyState(Tin, Tamb, flow, ram);
   if (dt > 0) {
     const a = 1 - Math.exp(-dt / TAU_CORE);
     sim.coreHot += (steadyHot - sim.coreHot) * a;
   }
   sim.coreHot = clampN(sim.coreHot, 0, 1);

   /* ── 7. effectiveness, outlet temp, gain, pressure drop ────── */
   const eff     = intercoolerEffectiveness(ram, sim.coreHot, fault, sim.oilSoak);
   const tout    = intercoolerOutletTemp(Tin, Tamb, eff);
   const gain    = densityGain(Tin, tout);
   const dp      = corePressureDrop(flow, sim.actualBoost, fault);
   const coreTemp = Tamb + sim.coreHot * (Tin - Tamb) * 0.85;

   /* ── 8. derived state ─────────────────────────────────────── */
   const underboost = (cmdBoost > 0.4) && (sim.actualBoost < UNDERBOOST * cmdBoost);
   let stateTxt;
   if (fault === 'leaking' && underboost) stateTxt = 'Underboost - P0299';
   else if (tout > 80)                    stateTxt = 'Charge too hot';
   else if (sim.coreHot > 0.72)           stateTxt = 'Core heat-soaked';
   else if (eff < 0.55)                   stateTxt = 'Poor cooling';
   else if (eff > 0.75)                   stateTxt = 'Cooling well';
   else                                   stateTxt = 'Cooling';

   /* ── 9. 3D visuals ────────────────────────────────────────── */
   /* fins: glow with core temperature, tint brown when oil-soaked */
   const hotV = clampN((coreTemp - 35) / 95, 0, 1);
   alu.color.copy(lc(0xc5ccd6, 0x6b5238, sim.oilSoak * 0.85));
   alu.emissive.copy(lc(0x000000, 0xff2a00, hotV * 0.7));
   alu.emissiveIntensity = 0.04 + 1.20 * hotV;

   /* inlet tank reflects the incoming charge temperature */
   tankHot.color.copy(lc(0xd97c4a, 0xff3a1a, clampN((Tin - 60) / 120, 0, 1)));
   tankHot.emissive.copy(lc(0x000000, 0xff5a1a, clampN((Tin - 90) / 100, 0, 1)));
   tankHot.emissiveIntensity = clampN((Tin - 90) / 100, 0, 1) * 0.85;

   /* outlet tank warms slightly when the core is doing badly */
   tankCold.color.copy(lc(0x5b8fa8, 0x7db8d0, clampN((tout - 35) / 70, 0, 1) * 0.6));

   /* compressor wheel spins faster with boost */
   const spool = 0.35 + 7.0 * sim.actualBoost;
   compressorWheel.rotation.z += spool * dt * 4;

   /* clog overlay */
   clogs.visible = (fault === 'clogged');
   clogMat.opacity = fault === 'clogged' ? 0.88 : 0;

   /* joint pulses red when the coupler is leaking */
   if (fault === 'leaking') {
     jointMat.color.setHex(0xff3030);
     jointMat.emissive.setHex(0xff2020);
     jointMat.emissiveIntensity = 0.45 + 0.45 * Math.abs(Math.sin(c.t * 6));
   } else {
     jointMat.color.setHex(0x1f2937);
     jointMat.emissive.setHex(0x000000);
     jointMat.emissiveIntensity = 0;
   }

   /* streams: density follows flow; colours follow temperature */
   const chargeDens = clampN(flow / 1.1, 0.05, 1.05);
   const chargeSpd  = 0.10 + 0.30 * flow;
   hotS.update(c.t, chargeSpd, chargeDens);
   midS.update(c.t, chargeSpd, chargeDens);
   coolS.update(c.t, chargeSpd, chargeDens);
   hotS.mat.color.copy(lc(0xffaa55, 0xff5020, clampN((Tin - 70) / 100, 0, 1)));
   midS.mat.color.copy(lc(0xfbbf24, 0x38bdf8, eff));
   coolS.mat.color.copy(lc(0x7dd3fc, 0x38bdf8, clampN(1 - (tout - 25) / 70, 0, 1)));

   const ambSpd = 0.22 + 0.45 * (speedKmh / 130);
   for (let i = 0; i < amb.length; i++) amb[i].update(c.t, ambSpd, ram);

   leakS.update(c.t, 0.42, fault === 'leaking' ? 0.85 : 0);

   /* ── 10. throttled DOM work (graph + warning banner) ───────── */
   const now = performance.now();
   if (now - lastDom > 140) {
     lastDom = now;
     if (dt > 0) {
       sim.samples.push({ e: eff, T: tout });
       if (sim.samples.length > GRAPH_N) sim.samples.shift();
       drawGraph();
     }
     let warn = FAULT_INFO[fault] ? FAULT_INFO[fault].warn : '';
     if (!warn) {
       if (underboost) {
         warn = 'P0299 - underboost. Actual ' + sim.actualBoost.toFixed(2) + ' bar vs target ' + cmdBoost.toFixed(2) + ' bar.';
       } else if (tout > 85) {
         warn = 'Charge air at ' + tout.toFixed(0) + ' \u00B0C after the intercooler - the ECU will pull timing to protect the engine.';
       } else if (sim.coreHot > 0.80) {
         warn = 'Intercooler core heat-soaked (' + coreTemp.toFixed(0) + ' \u00B0C). Effectiveness will recover once ram airflow cools it down.';
       } else if (dp > 20) {
         warn = 'Pressure loss across the intercooler is ' + dp.toFixed(0) + ' kPa - boost response is suffering.';
       }
     }
     elWarn.textContent = warn;
     elWarn.classList.toggle('show', !!warn);
   }

   /* ── 11. readouts ─────────────────────────────────────────── */
   const boostState = underboost ? 'crit' : 'hi';
   const tinState   = Tin > 150 ? 'crit' : (Tin > 115 ? 'warn' : 'ok');
   const toutState  = tout > 80 ? 'crit' : (tout > 60 ? 'warn' : 'ok');
   const effState   = eff < 0.45 ? 'crit' : (eff < 0.60 ? 'warn' : 'ok');
   const gainState  = gain < 10 ? 'crit' : (gain < 16 ? 'warn' : 'ok');
   const dpState    = dp > 20 ? 'crit' : (dp > 13 ? 'warn' : 'ok');
   const coreState  = coreTemp > 100 ? 'crit' : (coreTemp > 75 ? 'warn' : 'ok');
   const stState    = (tout > 80 || underboost || sim.coreHot > 0.85) ? 'crit'
                    : (tout > 60 || eff < 0.55 || sim.coreHot > 0.65) ? 'warn'
                    : 'ok';

   return {
     big: (eff * 100).toFixed(0),
     unit: ' %',
     bar: clampN(eff * 100, 0, 100),
     rows: {
       tin:  Tin.toFixed(0) + ' \u00B0C',
       gain: '+' + gain.toFixed(0) + ' %'
     },
     ro: {
       boost: [sim.actualBoost.toFixed(2) + ' bar', boostState],
       cmd:   [cmdBoost.toFixed(2) + ' bar', ''],
       tin:   [Tin.toFixed(0) + ' \u00B0C', tinState],
       tout:  [tout.toFixed(0) + ' \u00B0C', toutState],
       eff:   [(eff * 100).toFixed(0) + ' %', effState],
       gain:  ['+' + gain.toFixed(0) + ' %', gainState],
       dp:    [dp.toFixed(1) + ' kPa', dpState],
       coreT: [coreTemp.toFixed(0) + ' \u00B0C', coreState],
       ram:   [(ram * 100).toFixed(0) + ' %', ''],
       state: [stateTxt, stState]
     },
     status: [stateTxt, true],
     ctl: cmdBoost.toFixed(2) + ' bar'
   };
  }
 };
}

runGuidedModule(CFG, build);
</script>
</body>
</html>
